# Declarative Project & Security Manifest for the Doc-Driven Discord Support Engine
# (`discord-support-bot/build_doc_index.py` and `discord-support-bot/discord_support_bot.py`)
#
# Why this file exists:
#   The core 7-stage support pipeline (OCR + decompounding, dual-translator scoring,
#   Orderless Corpus-Facet Bottleneck, Combinatorial FTS5 retrieval, causal reasoning,
#   deterministic @range/@options schema firewall, and two-phase forum polling) is
#   100% domain-agnostic and derived automatically from `doc-index.sqlite`.
#   This manifest holds the thin project-specific configuration so any open-source or
#   commercial project can run `build_doc_index.py` and `discord_support_bot.py`
#   without editing a single line of Python.

default_project: "leafrtp"

security:
  allowed_domains:
    - "dailystruggle.github.io"
    - "github.com"
    - "www.github.com"
    - "modrinth.com"
    - "www.modrinth.com"
    - "spigotmc.org"
    - "www.spigotmc.org"
    - "builtbybit.com"
    - "www.builtbybit.com"
    - "mclo.gs"
    - "api.mclo.gs"
  log_paste_providers:
    mclogs:
      url_pattern: "https?://(?:www\\.)?mclo\\.gs/([A-Za-z0-9]{5,32})"
      raw_url_template: "https://api.mclo.gs/1/raw/{id}"

projects:
  leafrtp:
    display_name: "LeafRTP"
    repo_path: "."
    site_base: "https://dailystruggle.github.io/RTP"
    forum_tags:
      - "🌿 LeafRTP"
      - "📦 API / Addons"
    reference_docs:
      - "site/intended-usage.md"
      - "site/what-not-to-do.md"
      - "site/how-it-works.md"
      - "admin/configuration/CONFIGURATION.md"
    error_code_lock_file: "docs/dev/bit-codes.lock"
    error_code_doc_file: "docs/dev/BIT_CODES.md"
    error_code_pattern: "\\b(?:[A-Z]{2,16}_[A-Z0-9_]{3,}|[A-Z]{2,16}[-\\s:]0*\\d{1,4})\\b"
    cli_prefix: "/rtp"
    valid_subcommands:
      - "admin"
      - "biome"
      - "config"
      - "editor"
      - "fill"
      - "gui"
      - "help"
      - "info"
      - "menu"
      - "player"
      - "region"
      - "reload"
      - "scan"
      - "test"
      - "version"
      - "world"
    forbidden_command_patterns:
      - "/rtp\\s+config\\s+(?:set|get|edit)\\b"
    diagnostics:
      version_pattern: "(?i)(?:/rtp\\s+version|leafrtp\\s+v?\\d+\\.\\d+|rtp\\s+version\\s*[:=]?\\s*\\d+\\.\\d+)"
      runtime_pattern: "(?i)\\b(?:paper|folia|purpur|spigot|pufferfish|fabric|neoforge|velocity|bungeecord)\\b[^\\n]{0,40}\\b(?:1\\.\\d+(?:\\.\\d+)?|26\\.\\d+)"
      test_pattern: "(?i)(?:/rtp\\s+test\\b|\\[rtp\\s+bit\\]|\\b(?:ACTION|BIT|HEATMAP|PROBE|RTP|TEST)[-_]\\d{1,4}\\b)|(?<!%)(?-i:\\bRTP_[A-Z0-9_]+\\b)"
      version_missing: "`/rtp version` output"
      version_present: "`/rtp version`"
      runtime_missing: "server `/version` output (Paper, Folia, Spigot, Fabric, or NeoForge version)"
      runtime_present: "server `/version`"
      test_missing: "`/rtp test` self-test output"
      test_present: "`/rtp test`"
      log_missing: "full `logs/latest.log` uploaded to <https://mclo.gs/>"
      log_present: "`mclo.gs` log"
      info_cmd: "`/rtp info`"
      startup_note: "(in-game `/rtp test` is not required when the server cannot boot)"
      lag_intro: "Teleport lag or server slowdowns usually come from one of three places: a permission setup bypassing the background location cache (`rtp.unqueued`, `rtp.params`, or wildcard `rtp.*` granted to regular players), on-demand chunk generation in an unpregenerated world, or custom `advanced/performance.yml` overrides (`syncLoading`, `viewDistanceSelect`, or JVM heap pressure).\n\nI do not want to recommend a config change that targets the wrong cause or makes your tick time worse. Please reply with:"
      lag_bullet: "- What `/rtp info` reports for hot/cold queue fill and active chunk tickets when the slowdown happens"
      cmd_intro: "A failed `/rtp` command or unexpected placement usually comes down to a permission node override (`rtp.use`, `rtp.notme` on operators, or region `requirePermission`), a missing world-to-region mapping in `definitions/worlds/` and `definitions/regions/`, or a console exception.\n\nRather than guessing at settings without seeing your setup, please reply with:"
      cmd_bullet: "- The exact command you ran, which world/region you are in, and whether the player has OP or a specific LuckPerms group"

  oneplayersleep:
    display_name: "OnePlayerSleep"
    site_base: "https://dailystruggle.github.io/OnePlayerSleep"
    forum_tags:
      - "💤 OnePlayerSleep"
    cli_prefix: "/ops"
    diagnostics:
      version_pattern: "(?i)(?:/(?:ops|sleep)\\s+version|oneplayersleep\\s+v?\\d+\\.\\d+|ops\\s+version\\s*[:=]?\\s*\\d+\\.\\d+)"
      runtime_pattern: "(?i)\\b(?:paper|folia|purpur|spigot|pufferfish|fabric|neoforge|velocity|bungeecord)\\b[^\\n]{0,40}\\b(?:1\\.\\d+(?:\\.\\d+)?|26\\.\\d+)"
      test_pattern: "(?i)(?:/(?:ops|sleep)\\s+test\\b|\\[ops\\s+bit\\]|\\bOPS[-_]\\d{1,4}\\b|\\bOPS_[A-Z0-9_]+\\b)"
      version_missing: "`/ops version` (or `/sleep version`) output"
      version_present: "`/ops version`"
      runtime_missing: "server `/version` output (Paper, Folia, Spigot, Fabric, or NeoForge version)"
      runtime_present: "server `/version`"
      test_missing: "`/ops test` (or `plugins/OnePlayerSleep/config.yml`) output"
      test_present: "`/ops test`"
      log_missing: "full `logs/latest.log` uploaded to <https://mclo.gs/>"
      log_present: "`mclo.gs` log"
      info_cmd: "`/ops status`"
      startup_note: "(in-game `/ops test` is not required when the server cannot boot)"
      lag_intro: "Sleep-skip or wakeup delays in `OnePlayerSleep` usually come from world-time sync hooks, cooldown/bed-check settings in `plugins/OnePlayerSleep/config.yml`, or another sleep/time plugin conflict.\n\nRather than guessing at settings without seeing your setup, please reply with:"
      lag_bullet: "- Which world and sleep/wakeup settings are active in `plugins/OnePlayerSleep/config.yml` when the issue happens"
      cmd_intro: "An unexpected sleep-skip or `/sleep` / `/ops` command behavior usually comes down to a permission override (`oneplayersleep.*`), a world filter in `plugins/OnePlayerSleep/config.yml`, or a console exception.\n\nRather than guessing at settings without seeing your setup, please reply with:"
      cmd_bullet: "- The exact command or bed action you tested, which world you are in, and whether the player has OP or a specific permission group"

  treegen:
    display_name: "TreeGen"
    site_base: "https://dailystruggle.github.io/TreeGen"
    forum_tags:
      - "🌲 TreeGen"
    cli_prefix: "/treegen"
    diagnostics:
      version_pattern: "(?i)(?:/treegen\\s+version|treegen\\s+v?\\d+\\.\\d+|treegen\\s+version\\s*[:=]?\\s*\\d+\\.\\d+)"
      runtime_pattern: "(?i)\\b(?:paper|folia|purpur|spigot|pufferfish|fabric|neoforge|velocity|bungeecord)\\b[^\\n]{0,40}\\b(?:1\\.\\d+(?:\\.\\d+)?|26\\.\\d+)"
      test_pattern: "(?i)(?:/treegen\\s+test\\b|\\[treegen\\s+bit\\]|\\bTREEGEN[-_]\\d{1,4}\\b|\\bTREEGEN_[A-Z0-9_]+\\b)"
      version_missing: "`/treegen version` output"
      version_present: "`/treegen version`"
      runtime_missing: "server `/version` output (Paper, Folia, Spigot, Fabric, or NeoForge version)"
      runtime_present: "server `/version`"
      test_missing: "`/treegen test` self-test output"
      test_present: "`/treegen test`"
      log_missing: "full `logs/latest.log` uploaded to <https://mclo.gs/>"
      log_present: "`mclo.gs` log"
      info_cmd: "`/treegen info`"
      startup_note: "(in-game `/treegen test` is not required when the server cannot boot)"
      lag_intro: "Tree generation slowdowns in `TreeGen` usually come from large schematic/populator batch sizes, synchronous chunk population in ungenerated terrain, or custom `plugins/TreeGen/config.yml` overrides.\n\nRather than guessing at settings without seeing your setup, please reply with:"
      lag_bullet: "- What `/treegen info` reports and which world/biome generator settings are active when the slowdown happens"
      cmd_intro: "A failed `/treegen` command or unexpected tree placement usually comes down to a biome/region filter in `plugins/TreeGen/`, a permission node override, or a console exception.\n\nRather than guessing at settings without seeing your setup, please reply with:"
      cmd_bullet: "- The exact `/treegen` command or generator config you tested and which world/biome you are in"

  fuzzer:
    display_name: "Server Fuzzer / Tools"
    site_base: "https://dailystruggle.github.io/RTP"
    forum_tags:
      - "🔬 Server Fuzzer / Tools"

triage:
  hostile_pattern: "(?i)\\b(?:clumsy\\s+hands|learn(?:ing)?\\s+to\\s+code|deteriorating|ping\\s+with\\s+answer|officially\\s+dead|(?:garbage|trash|useless|worst|pathetic|dogshit|horseshit|shit|crap|terrible|horrible|awful|worthless|junk)\\s+(?:plugin|mod|dev|developer|author|code|support|bot|resource)|(?:plugin|mod|code|support|bot)\\s+is\\s+(?:garbage|trash|useless|worthless|dogshit|shit|crap|a\\s+joke|a\\s+scam|broken\\s+trash)|dev(?:eloper)?s?\\s+(?:is|are)\\s+(?:lazy|incompetent|useless|dead|clueless|stupid|idiot(?:s)?|moron(?:s)?|ignoring|asleep|a\\s+scammer)|fix\\s+your\\s+(?:broken\\s+|trash\\s+|garbage\\s+|shit\\s+|useless\\s+|stupid\\s+|damn\\s+|fucking\\s+)?(?:plugin|mod|code|shit|garbage)|1[-\\s]*star\\s*(?:review|rating)?|one[-\\s]*star\\s+(?:review|rating)|leaving\\s+a\\s+(?:1[-\\s]*star|bad|negative)\\s+review|chargeback|demanding\\s+a\\s+refund|want\\s+my\\s+money\\s+back|waste\\s+of\\s+money|fuck(?:ing|ed|er)?|bullshit|dogshit|horseshit|piece\\s+of\\s+shit|wtf\\s+is\\s+this|stfu|dumbass|asshole|idiot(?:s|ic)?|moron(?:s|ic)?|incompetent|scam(?:mer|med)?|answer\\s+me\\s+(?:now|already|immediately)|respond\\s+(?:to\\s+me\\s+)?now|reply\\s+(?:to\\s+me\\s+)?now|wake\\s+up\\s+dev|stop\\s+ignoring\\s+me|any\\s+staff\\s+alive)\\b|(?:\\bhello+\\s*\\?{3,}|\\?{4,}|!{4,})|(?:(?-i:\\b(?!CIRCLE\\b|SQUARE\\b|RECTANGLE\\b|ELLIPSE\\b|POLYGON\\b|ACTION\\b|HEATMAP\\b)[A-Z]{3,}(?:\\s+[A-Z]{2,}){3,}\\b))"
  interest_signals:
    shop_talk:
      label: "architecture / systems shop-talk"
      pattern: "(?i)\\b(?:how\\s+does\\s+the\\s+queue\\s+work|cache\\s+cycle|under\\s+the\\s+hood|architectur(?:e|al|ally)|adr-\\d{3}|spatial\\s*resolution|spatial\\s+memory|archimedean|pipelined\\s+(?:parallel|location)|parallel\\s+location\\s+searching|region-file\\s+binning|benchmark(?:s|ed|ing)?|tickrate\\s+degradation|candidates\\s*=\\s*0|no\\s+qualifying\\s+backend|network\\.enabled|proxy-direct|devstack)\\b"
      requires_evidence: false
    empirical_repro:
      label: "empirical isolation / config + log repro"
      pattern: "(?i)\\b(?:duration\\s+unit\\s+is\\s+broken|deop(?:ping|ped)?|works\\s+(?:as\\s+normal|great|fine|properly|correctly)\\s+(?:when|for|if|without|in)\\b|fails\\s+(?:when|only\\s+when|if)\\b.*?\\bworks\\s+(?:when|if)\\b|in-game\\s+but\\s+for\\s+some\\s+reason|looking\\s+up\\s+those\\s+methods\\s+on\\s+(?:the\\s+)?github|source\\s+code\\s+on\\s+github|tab\\s+completion\\s+works|migrating\\s+from\\s+(?:betterrtp|ezrtp|justrtp).*?(?:exception|error)|%rtp_[a-z0-9_]+%)\\b"
      requires_evidence: true
    builder_api:
      label: "API / addon / plugin integration"
      pattern: "(?i)\\b(?:developing\\s+my\\s+(?:server\\s+)?plugin|using\\s+(?:code|the\\s+api)|rtp-api|rtpapi|custom\\s+shape|rtpaddon|addshape|bed-respawn|anchor-respawn|getbiome\\(\\)\\s+function)\\b"
      requires_evidence: false
