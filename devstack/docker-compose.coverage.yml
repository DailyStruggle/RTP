# Coverage overlay for the rtp-proxy devstack.
#
# Layered on top of docker-compose.yml by `run-acceptance.ps1 -Coverage` via the
# COMPOSE_FILE env var (same mechanism as docker-compose.lite.yml and
# docker-compose.lobby-world.yml). It mounts the shared JaCoCo agent directory
# into each backend and lobby service and attaches the -javaagent to their JVM options.
#
# Execution dumps (.exec) are written to ./jacoco/<service>.exec on server shutdown
# or when triggered dynamically via `/rtp test accessor` (or `/rtp test full`).
# Run `./gradlew jacocoServerReport` afterwards to generate HTML/XML coverage reports.

services:
  backend-a:
    environment:
      JVM_XX_OPTS: "-javaagent:/jacoco/jacocoagent.jar=destfile=/jacoco/backend-a.exec,includes=io.github.dailystruggle.rtp.*,dumponexit=true,output=file"
    volumes:
      - ./jacoco:/jacoco

  backend-b:
    environment:
      JVM_XX_OPTS: "-javaagent:/jacoco/jacocoagent.jar=destfile=/jacoco/backend-b.exec,includes=io.github.dailystruggle.rtp.*,dumponexit=true,output=file"
    volumes:
      - ./jacoco:/jacoco

  backend-c:
    environment:
      JVM_XX_OPTS: "-javaagent:/jacoco/jacocoagent.jar=destfile=/jacoco/backend-c.exec,includes=io.github.dailystruggle.rtp.*,dumponexit=true,output=file"
    volumes:
      - ./jacoco:/jacoco

  lobby-a:
    environment:
      JVM_XX_OPTS: "-javaagent:/jacoco/jacocoagent.jar=destfile=/jacoco/lobby-a.exec,includes=io.github.dailystruggle.rtp.*,dumponexit=true,output=file"
    volumes:
      - ./jacoco:/jacoco

  lobby-b:
    environment:
      JVM_XX_OPTS: "-javaagent:/jacoco/jacocoagent.jar=destfile=/jacoco/lobby-b.exec,includes=io.github.dailystruggle.rtp.*,dumponexit=true,output=file"
    volumes:
      - ./jacoco:/jacoco
