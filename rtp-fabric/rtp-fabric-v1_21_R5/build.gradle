// rtp-fabric-ADR-001 — Fabric multiversion v1_21_R5 submodule.
// rtp-fabric-ADR-004 — DistanceManager API split at MC 1.21.5.
//
// Pinned to MC 1.21.5, mojmap, Loom 1.11+, Java 21. Covers MC 1.21.5
// through 1.21.x (until the next breaking DistanceManager change).
// `addRegionTicket(TicketType, ChunkPos, int, T)` was removed in 1.21.5
// in favor of `addTicket(long, Ticket)` — see ADR-004 for the bisect.
plugins {
    id 'fabric-loom'
}

ext {
    minecraftVersion       = '1.21.5'
    loaderVersion          = '0.16.10'
    fabricApiVersion       = '0.119.2+1.21.5'
    permissionsApiVersion  = '0.3.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings  loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"

    modCompileOnly "me.lucko:fabric-permissions-api:${permissionsApiVersion}"

    api project(':rtp-api')
    api project(':rtp-core')
    api project(':commands-api')
    api project(':rtp-fabric:rtp-fabric-common')
    // See V1_21_R5FabricEffectDispatchers — Loom-compiled effect dispatchers.
    compileOnly project(':effects-api')
}
