// rtp-fabric-ADR-001 — Fabric multiversion v26_1_R1 submodule.
//
// Pinned to MC 26.1.2, the FIRST DEOBFUSCATED Minecraft release. Build-script
// shape diverges from the obf-era (1.20 / 1.21) submodules in five ways
// documented inline below; each is mandated by Fabric's 26.1 porting guide
// (https://docs.fabricmc.net/develop/porting/).
//
// Stub adapter at this stage — bodies will be ported in a follow-up Phase 2.5
// task once the v1_21_R1 reference is exercised end-to-end and the rename
// diff against deobf 26.1 is catalogued.
//
// IMPORTANT: this module requires JDK 25 to build. Contributors without
// JDK 25 installed will see this submodule fail toolchain provisioning;
// the rest of the project (Java 21) is unaffected. A Java 25 server can
// load Java 21 bytecode from common / v1_20_R1 / v1_21_R1 in the same
// shaded jar — bytecode compatibility is forward-only.
plugins {
    // Loom 1.15 splits its plugin IDs by obfuscation status: 26.1+ is
    // UNOBFUSCATED so it uses `net.fabricmc.fabric-loom` (no `mappings`
    // configuration). The legacy `fabric-loom` / `net.fabricmc.fabric-loom-remap`
    // IDs are for 1.21.11 and older. Version pinned in root settings.gradle
    // pluginManagement.plugins {} (project-wide bump on 2026-05-07).
    id 'net.fabricmc.fabric-loom'
}

ext {
    minecraftVersion       = '26.1.2'
    loaderVersion          = '0.18.4'
    fabricApiVersion       = '0.143.5+26.1'
    permissionsApiVersion  = '0.3.1'
}

java {
    toolchain {
        // (2) MC 26.1 requires Java 25 minimum.
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    // (3) NO `mappings` line — 26.1 ships deobfuscated, no mapping step needed.

    // (4) `modImplementation` / `modCompileOnly` collapse to plain
    //     `implementation` / `compileOnly` because the deobf game classes
    //     don't need Loom remapping.
    implementation "net.fabricmc:fabric-loader:${loaderVersion}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"

    compileOnly "me.lucko:fabric-permissions-api:${permissionsApiVersion}"

    // (5) Project deps unchanged. Note common is compiled to Java 21 bytecode
    //     and is fully loadable from this Java 25 module's runtime.
    api project(':rtp-api')
    api project(':rtp-core')
    api project(':commands-api')
    api project(':rtp-fabric:rtp-fabric-common')
    // See V26_1_R1FabricEffectDispatchers — Loom-compiled effect dispatchers.
    compileOnly project(':effects-api')
}
