include 'rtp-spigot:rtp-spigot-v1_20_R1'
include 'rtp-paper:rtp-paper-v1_20_R1'
include 'rtp-folia:rtp-folia-v1_20_R1'
include 'rtp-spigot:rtp-spigot-v1_21_R1'
include 'rtp-paper:rtp-paper-v1_21_R1'
include 'rtp-folia:rtp-folia-v1_21_R1'
include 'rtp-spigot:rtp-spigot-v26_1_R1'
include 'rtp-paper:rtp-paper-v26_1_R1'
include 'rtp-folia:rtp-folia-v26_1_R1'
include 'rtp-plugin'

// Fabric platform adapter — first-class in-scope as of 2026-04-30 per ADR-022.
// rtp-fabric-common applies fabric-loom (see its build.gradle); Loom is
// scoped per ADR-022 §3 to rtp-fabric/** and rtp-plugin only — it must
// not leak into rtp-core, rtp-api, commands-api, effects-api, or any
// Bukkit-family adapter.
//
// Per ADR-027 (Fabric multiversion submodule layout, 2026-05-01) the Fabric
// platform mirrors the Bukkit-family <platform>-vXX_YY_R1 split: common
// holds version-agnostic glue (with MC + fabric-api as modCompileOnly so
// no MC classes ship from common), and each v-submodule supplies the
// actual runtime mod jar pinned to its MC version. v1_21_R1 is the
// reference implementation; v1_20_R1 and v26_1_R1 ship as build-correct
// stubs and are filled in as Phase 2.5 follow-ups. Note v26_1_R1 requires
// JDK 25 + Loom 1.15 because MC 26.1 is deobfuscated; contributors without
// JDK 25 will see only that submodule fail toolchain provisioning.
include 'rtp-fabric:rtp-fabric-common'
include 'rtp-fabric:rtp-fabric-v1_20_R1'
include 'rtp-fabric:rtp-fabric-v1_21_R1'
// v26_1_R1 is intentionally NOT included in the default build: it requires
// Loom 1.15+ (deobf-26.1) which cannot coexist in a single Gradle invocation
// with the Loom 1.11-SNAPSHOT classloader used by common / v1_20 / v1_21 /
// rtp-plugin. Build it standalone via a separate Gradle invocation when JDK 25
// is available. See ADR-027 for rationale.
//include 'rtp-fabric:rtp-fabric-v26_1_R1'

//include 'addons:RTP_Iris_integration'
include 'addons:RTP_Glide'
include 'addons:RTP_ExampleAddon'

// Standalone helper plugins (no rtp-api / rtp-core dependency).
// See helpers/PeriodicWorldSaver/README.md for the directory rationale.
include 'helpers:PeriodicWorldSaver'
// Black-box stress-test driver for /rtp-style commands. Drives RTP, RTP-Pro,
// and competitor plugins under identical workloads to fill the front-page
// comparison table. See helpers/StressTestRTP/README.md.
include 'helpers:StressTestRTP'