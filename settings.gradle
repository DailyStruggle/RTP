project(':rtp-bukkit:rtp-bukkit-v26_1_R1').projectDir = file('platforms/rtp-bukkit/rtp-bukkit-v26_1_R1')

project(':rtp-paper').projectDir                = file('platforms/rtp-paper')
project(':rtp-paper:rtp-paper-common').projectDir   = file('platforms/rtp-paper/rtp-paper-common')
project(':rtp-paper:rtp-paper-v1_20_R1').projectDir = file('platforms/rtp-paper/rtp-paper-v1_20_R1')
project(':rtp-paper:rtp-paper-v1_21_R1').projectDir = file('platforms/rtp-paper/rtp-paper-v1_21_R1')
project(':rtp-paper:rtp-paper-v26_1_R1').projectDir = file('platforms/rtp-paper/rtp-paper-v26_1_R1')

project(':rtp-folia').projectDir                = file('platforms/rtp-folia')
project(':rtp-folia:rtp-folia-common').projectDir   = file('platforms/rtp-folia/rtp-folia-common')
project(':rtp-folia:rtp-folia-v1_20_R1').projectDir = file('platforms/rtp-folia/rtp-folia-v1_20_R1')
project(':rtp-folia:rtp-folia-v1_21_R1').projectDir = file('platforms/rtp-folia/rtp-folia-v1_21_R1')
project(':rtp-folia:rtp-folia-v26_1_R1').projectDir = file('platforms/rtp-folia/rtp-folia-v26_1_R1')

project(':rtp-fabric').projectDir                  = file('platforms/rtp-fabric')
project(':rtp-fabric:rtp-fabric-common').projectDir     = file('platforms/rtp-fabric/rtp-fabric-common')
project(':rtp-fabric:rtp-fabric-v1_20_R1').projectDir   = file('platforms/rtp-fabric/rtp-fabric-v1_20_R1')
project(':rtp-fabric:rtp-fabric-v1_21_R1').projectDir   = file('platforms/rtp-fabric/rtp-fabric-v1_21_R1')
project(':rtp-fabric:rtp-fabric-v1_21_R5').projectDir   = file('platforms/rtp-fabric/rtp-fabric-v1_21_R5')
project(':rtp-fabric:rtp-fabric-v1_21_R11').projectDir  = file('platforms/rtp-fabric/rtp-fabric-v1_21_R11')
if (!excludeJdk25) {
