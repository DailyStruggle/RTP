// pluginManagement provides fabric-loom for :rtp-fabric:** and :rtp-plugin
// (per ADR-022 §3 Build Discipline). Loom is published only on FabricMC's Maven,
// so we register it explicitly here. Plugin Portal stays as the default fallback
// for shadow / spotless / etc.
pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }
    // Declare fabric-loom's default version once here so every subproject
    // that applies it shares a single plugin classloader. Applying the same
    // plugin from independent `plugins { id '...' version '...' }` blocks
    // in multiple subprojects causes Gradle to load Loom into separate
    // classloaders, which surfaces as:
    //   `LoomGradleExtensionImpl_Decorated cannot be cast to LoomGradleExtension`
    // Subprojects now apply with a bare `id 'fabric-loom'` (no version).
    // The exception is :rtp-fabric:rtp-fabric-v26_1_R1 which pins Loom 1.15+
    // (required by deobf-26.1) — it declares its own version override and
    // therefore does load in a separate classloader, which is acceptable
    // because v26_1_R1 is a leaf module that no other Loom-using subproject
    // depends on at configuration time.
    plugins {
        id 'fabric-loom' version '1.11-SNAPSHOT'
    }
}

rootProject.name = 'RTP'

