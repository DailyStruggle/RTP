// pluginManagement provides fabric-loom for :rtp-fabric:** and :rtp-plugin
// (per ADR-022 §3 Build Discipline). Loom is published only on FabricMC's Maven,
// so we register it explicitly here. Plugin Portal stays as the default fallback
// for shadow / spotless / etc.
pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        // NeoForged Maven hosts the ModDevGradle (net.neoforged.moddev) plugin
        // implementation and its transitive dependencies. The gradlePluginPortal
        // below only carries the plugin *marker*; without this repo Gradle
        // resolves the marker for `net.neoforged.moddev` but then fails to find
        // the plugin's own dependency artifacts, surfacing as
        //   "Plugin [id: 'net.neoforged.moddev', version: '...'] was not found
        //    in any of the following sources".
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        gradlePluginPortal()
    }
    // Declare fabric-loom's default version once here so every subproject
    // that applies it shares a single plugin classloader. Applying the same
    // plugin from independent `plugins { id '...' version '...' }` blocks
    // in multiple subprojects causes Gradle to load Loom into separate
    // classloaders, which surfaces as:
    //   `LoomGradleExtensionImpl_Decorated cannot be cast to LoomGradleExtension`
    // Subprojects now apply with a bare `id 'fabric-loom'` (no version).
    // The exception is :rtp-fabric:rtp-fabric-v26_1_R1 which pins Loom 1.15+
    // (required by deobf-26.1) — it declares its own version override and
    // therefore does load in a separate classloader, which is acceptable
    // because v26_1_R1 is a leaf module that no other Loom-using subproject
    // depends on at configuration time.
    // Loom 1.15-SNAPSHOT (2026-05-07): bumped from 1.11-SNAPSHOT to support
    // the deobfuscated MC 26.1 submodule (rtp-fabric-v26_1_R1). Loom 1.11
    // already required Java 21 to RUN Gradle but mods could target lower
    // bytecode; per the Loom 1.15 release notes, the same forward
    // compatibility holds — older-MC submodules still pin their own
    // toolchain (Java 21) and `modImplementation` / `modCompileOnly` /
    // `mappings loom.officialMojangMappings()` remain supported. v26_1_R1
    // no longer needs its own version override (deleted from its
    // build.gradle alongside this bump). See settings.gradle history for
    // the prior side-build attempt that this supersedes.
    // Loom 1.15+ exposes TWO plugin IDs from one artifact:
    //   * net.fabricmc.fabric-loom        — for UNOBFUSCATED MC (26.1+)
    //   * net.fabricmc.fabric-loom-remap  — for OBFUSCATED MC (1.21.11 and older)
    // The legacy bare `fabric-loom` ID is supported only for the obfuscated
    // path. Both IDs come from the same plugin artifact, so a single version
    // pin keeps every Loom-using subproject in one classloader and avoids
    // the LoomGradleExtension ClassCastException.
    plugins {
        id 'fabric-loom'                       version '1.15-SNAPSHOT'
        id 'net.fabricmc.fabric-loom'          version '1.15-SNAPSHOT'
        id 'net.fabricmc.fabric-loom-remap'    version '1.15-SNAPSHOT'
        // NeoForge ModDevGradle: pin the version once here so the default
        // NeoForge carriers (rtp-neoforge-common + rtp-neoforge-v1_21_R1, the
        // JDK-21 1.21.x line that ships in the unified jar) share a single
        // plugin classloader and version. They apply it with a bare
        // `id 'net.neoforged.moddev'` (no per-module version).
        //
        // Version is 2.0.141: the single ModDevGradle 2 version shared by
        // EVERY NeoForge carrier (the JDK-21 1.21.x line AND the JDK-25 26.1
        // line). MC 26.1 requires moddev 2.0.134+, so the 26.1 carrier cannot
        // build on anything older; pinning the whole NeoForge set to 2.0.141
        // keeps all carriers in ONE plugin classloader (no per-module version
        // override, no dual-classloader split) and lets the default build
        // produce every platform adapter, 1.21.x and 26.1 alike. 2.0.141 is the
        // latest published moddev (Gradle Plugin Portal) and resolves from the
        // NeoForged + portal repositories declared above.
        //
        // Hosts that genuinely cannot reach 2.0.141 (fully offline, portal-
        // blocked) cannot build the NeoForge adapters at all and must drop them
        // with -PexcludeNeoforge (whole platform) or -PexcludeJdk25 (just the
        // JDK-25 26.1 carrier). Both leave the rest of the build untouched.
        id 'net.neoforged.moddev'              version '2.0.141'
    }
}

rootProject.name = 'RTP'

// commands-api and effects-api are in-tree Gradle modules (under api/), consumed
// by every plugin/adapter through plain project(':commands-api') /
// project(':effects-api') edges. They were briefly extracted to sibling repos
// (CommandsAPI / EffectsAPI) and consumed as published / composite-build
// coordinates; that was reverted because (a) effects-api applies fabric-loom and
// a published intermediary jar cannot satisfy RTP's mojmap Fabric modules, and
// (b) co-evolving the API with its only consumer through a publish round-trip is
// slower than an in-tree edge. See the include lines + projectDir overrides below.

// JDK-25 / unobfuscated-Loom modules can be excluded from the build graph by
// passing `-PexcludeJdk25` (or setting the JITPACK env var). These modules
// (effects-api-fabric-unobf, rtp-fabric-common-unobf, rtp-fabric-v26_1_R1)
// pin a Java 25 toolchain that is unavailable on JDK-21-only build hosts such
// as JitPack. Merely *configuring* them forces Gradle to resolve their
// `javaCompiler` toolchain, which fails the whole build even when the
// requested tasks (the addon-API publish closure) do not depend on them.
// The published closure (rtp-api/rtp-core + their project deps) never depends
// on these modules, so excluding them is safe. Keep the list in sync with
// jitpack.yml. See docs/dev/PUBLISHING.md.
def excludeJdk25 = startParameter.projectProperties.containsKey('excludeJdk25') ||
        System.getenv('JITPACK') != null

include 'rtp-api'
// Non-rtp-exclusive, platform-neutral API modules are grouped under the
// api/ folder to declutter the repo root. The Gradle project paths and
// Maven coordinates are intentionally KEPT FLAT (':yaml-api',
// ':effects-api', ':maps-api', ':metrics-api', and the nested
// ':effects-api:effects-api-fabric-unobf'); only the on-disk location moves,
// applied via projectDir overrides at the bottom of this section. This keeps
// every existing project(':...') dependency, Maven coordinate, and ADR/doc
// reference valid.
// commands-api -- platform-neutral command-tree framework (commands-api-ADR-001).
// In-tree module: consumed by rtp-api/rtp-core and every platform adapter via
// project(':commands-api'). Pure Java (Brigadier as compileOnly), no Loom.
include 'commands-api'
// yaml-api -- in-house zero-dependency YAML substrate (ADR-025), extracted from
// rtp-core so rtp-api can host the configurable selection model without a core
// dependency. Pure Java, no platform/Loom dependency.
include 'yaml-api'
// effects-api -- in-module platform split (effects-api-ADR-003). Applies
// fabric-loom so its fabric/ subpackage resolves net.minecraft.* at compile
// time; consumed in-tree via project(':effects-api').
include 'effects-api'
// effects-api-fabric-unobf -- nested Mojmap-unobf carrier for the deobf MC 26.x
// runtime (effects-api-ADR-006, rtp-fabric-ADR-009). Requires JDK 25 + Loom
// 1.15; excluded on JDK-21-only hosts alongside the other JDK-25 modules.
if (!excludeJdk25) {
    include 'effects-api:effects-api-fabric-unobf'
}
// maps-api — runtime cartography SPI (ADR-046, maps-api-ADR-001).
// Pure Java SPI: no Bukkit / Fabric / Loom dependency. Concrete bindings
// (BukkitMapBinding, FoliaMapBinding, FabricMapBinding) land in Stage 2/3
// inside the platform adapters; this module ships only the platform-neutral
// SPI + NoopMapBinding + HeatmapRenderer + ChartModel hierarchy.
include 'maps-api'
// metrics-api — platform-portable metrics SPI (metrics-api-ADR-001,
// extracted 2026-05-17). Pure Java SPI: no Bukkit / Fabric / Loom dependency.
// Designed for monorepo reuse — sibling plugins can consume without rtp-core
// (per metrics-api-ADR-001). Concrete bindings (PaperMetricsBinding,
// BukkitTpsSampler, FoliaMetricsBinding + FoliaRegionTpsSampler,
// FabricMetricsBinding) stay in their respective platform adapters.
include 'metrics-api'
// anvil-api -- platform-neutral vanilla Anvil region-file decode / NBT
// pre-filter (ADR-016). No RTP-module or platform dependency, so it groups
// under api/ with the other non-rtp-exclusive modules. Renamed from the
// former ':rtp-anvil' coordinate; on-disk at api/anvil-api.
include 'anvil-api'
// tags-api -- platform-neutral Minecraft block-tag JSON resolver (ADR-017).
// No RTP-module or platform dependency (hand-rolled JSON reader, no third-party
// JSON lib), so it groups under api/ with the other non-rtp-exclusive modules.
// Renamed from the former ':rtp-tags' coordinate; on-disk at api/tags-api.
include 'tags-api'

// Relocate the grouped api/ modules on disk while keeping their flat Gradle
// project paths (see the comment block above the include lines). The nested
// unobf carrier inherits no projectDir from its parent in Gradle, so it is
// overridden explicitly.
project(':commands-api').projectDir = file('api/commands-api')
project(':effects-api').projectDir  = file('api/effects-api')
if (!excludeJdk25) {
    project(':effects-api:effects-api-fabric-unobf').projectDir = file('api/effects-api/effects-api-fabric-unobf')
}
project(':yaml-api').projectDir     = file('api/yaml-api')
project(':maps-api').projectDir     = file('api/maps-api')
project(':metrics-api').projectDir  = file('api/metrics-api')
project(':anvil-api').projectDir    = file('api/anvil-api')
project(':tags-api').projectDir     = file('api/tags-api')

include 'rtp-core'

// RTP-exclusive server-side platform adapters are grouped under the
// platforms/ folder to declutter the repo root, mirroring the api/ grouping.
// The Gradle project paths and Maven coordinates are intentionally KEPT FLAT
// (':rtp-bukkit:rtp-bukkit-common', ':rtp-fabric:rtp-fabric-common', etc.);
// only the on-disk location moves, applied via the projectDir overrides at the
// bottom of this section. This keeps every existing project(':...') dependency,
// Maven coordinate, and ADR/doc reference valid. rtp-plugin (the shaded
// deliverable, not an adapter) stays at the repo root; rtp-proxy (the proxy
// side) is also grouped under platforms/ but keeps its flat Gradle paths.
include 'rtp-bukkit:rtp-bukkit-common'
include 'rtp-paper:rtp-paper-common'
include 'rtp-folia:rtp-folia-common'

include 'rtp-bukkit:rtp-bukkit-v1_20_R1'
include 'rtp-paper:rtp-paper-v1_20_R1'
include 'rtp-folia:rtp-folia-v1_20_R1'
include 'rtp-bukkit:rtp-bukkit-v1_21_R1'
include 'rtp-paper:rtp-paper-v1_21_R1'
include 'rtp-folia:rtp-folia-v1_21_R1'
include 'rtp-bukkit:rtp-bukkit-v26_1_R1'
include 'rtp-paper:rtp-paper-v26_1_R1'
include 'rtp-folia:rtp-folia-v26_1_R1'
// rtp-plugin is the shaded Bukkit-family aggregator. It bundles the JDK-25
// Fabric carriers (rtp-fabric-v26_1_R1 / *-unobf / effects-api-fabric-unobf)
// via project(...) dependencies, so it cannot be configured when those modules
// are excluded. It is not part of the addon-API publish closure and nothing
// depends on it, so it is dropped alongside the JDK-25 modules.
if (!excludeJdk25) {
    include 'rtp-plugin'
}

// Fabric platform adapter — first-class in-scope as of 2026-04-30 per ADR-022.
// rtp-fabric-common applies fabric-loom (see its build.gradle); Loom is
// scoped per ADR-022 §3 to platforms/rtp-fabric/** and rtp-plugin only — it must
// not leak into rtp-core, rtp-api, commands-api, effects-api, or any
// Bukkit-family adapter.
//
// Per rtp-fabric-ADR-001 (Fabric multiversion submodule layout, 2026-05-01) the Fabric
// platform mirrors the Bukkit-family <platform>-vXX_YY_R1 split: common
// holds version-agnostic glue (with MC + fabric-api as modCompileOnly so
// no MC classes ship from common), and each v-submodule supplies the
// actual runtime mod jar pinned to its MC version. v1_21_R1 is the
// reference implementation; v1_20_R1 and v26_1_R1 ship as build-correct
// stubs and are filled in as Phase 2.5 follow-ups. Note v26_1_R1 requires
// JDK 25 + Loom 1.15 because MC 26.1 is deobfuscated; contributors without
// JDK 25 will see only that submodule fail toolchain provisioning.
include 'rtp-fabric:rtp-fabric-common'
// rtp-fabric-common-unobf -- mojmap-bytecode sibling of rtp-fabric-common
// (rtp-fabric-ADR-009, paired with effects-api-ADR-006). Compiled under
// unobfuscated 1.15 Loom (same regime as rtp-fabric-v26_1_R1) so its NM
// constant-pool entries survive on a deobf MC 26.x runtime; consumed by
// V26_*_R1FabricVersionAdapter via `api project(...)`. Requires JDK 25 +
// fabric-loom 1.15+ (same toolchain as v26_1_R1).
if (!excludeJdk25) {
    include 'rtp-fabric:rtp-fabric-common-unobf'
}
include 'rtp-fabric:rtp-fabric-v1_20_R1'
include 'rtp-fabric:rtp-fabric-v1_21_R1'
include 'rtp-fabric:rtp-fabric-v1_21_R5'
// rtp-fabric-v1_21_R11 — re-included 2026-05-06 after rtp-fabric-ADR-007
// (Mojmap-name-decoupling) landed. The FabricVersionAdapter SPI now uses
// project-owned wrapper records (RTPLevelHandle / RTPBlockHandle / etc.)
// instead of net.minecraft.* types whose Mojmap names drift across point
// releases (notably ResourceLocation -> Identifier at 1.21.11). The R11
// adapter has been ported to the new contract and uses the new
// TicketType(long expiryTicks, int flags) constructor with flags = 14
// (FOR_LOADING | FOR_SIMULATION | RESETS_IDLE_TIMEOUT) — vanilla FORCED
// minus the SERIALIZE bit, S-002 safe.
include 'rtp-fabric:rtp-fabric-v1_21_R11'
// v26_1_R1 -- pinned to MC 26.1 (deobfuscated). Requires JDK 25 + fabric-loom 1.15+.
// Re-enabled 2026-05-07 to test the inline-dependency hypothesis: per
// rtp-fabric-ADR-001, the prior reason for excluding it was the
// `LoomGradleExtensionImpl_Decorated cannot be cast to LoomGradleExtension`
// error that appears when two Loom plugin versions are loaded into the
// same Gradle plugin classloader. v26_1_R1 declares its own
// `id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'` (independent
// classloader, leaf module not configured by other Loom modules), so the
// hypothesis is that the cast bug only fires when two Loom-using
// subprojects share a classloader scope -- which is not the case here as
// long as no rtp-plugin / rtp-fabric-common code path triggers Loom 1.11
// to read v26_1_R1's LoomGradleExtension.
//
// JDK 25 is provisioned per-subproject via Gradle's toolchain plugin --
// the rest of the build remains on JDK 21. CI must have JDK 25 installed
// (or `org.gradle.java.installations.auto-download=true`).
if (!excludeJdk25) {
    include 'rtp-fabric:rtp-fabric-v26_1_R1'
}
// v26_2_R1 -- EARLY/EXPERIMENTAL, pinned to the MC 26.2 pre-release
// (26.2-rc-2). Same deobf regime as v26_1_R1 (Loom 1.15, JDK 25, no
// mappings), cloned from it. See rtp-fabric-ADR-014. Re-pin the MC /
// loader / fabric-api versions when 26.2 reaches final.
if (!excludeJdk25) {
    include 'rtp-fabric:rtp-fabric-v26_2_R1'
}

