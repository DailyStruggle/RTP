// Multi-server proxy support — umbrella ADR-036 Accepted 2026-05-14.
// Phase 1: rtp-proxy-common ships the host-independent SPI, the reference
// weighted-average BackendSelector (rtp-proxy-ADR-004), and the reference
// InMemoryNetworkStateBinding (rtp-proxy-ADR-003). Pure-Java, no proxy-vendor
// or backend-platform imports (rtp-proxy-ADR-001 §Package Boundary Rules).
// rtp-proxy-velocity (Phase 2a) — no-op shell included 2026-05-18 after
// rtp-proxy-ADR-006 was Accepted. Compile-only Velocity API dependency;
// entry-point honors network.enabled:false as a strict no-op.
// rtp-proxy-bungee (Phase 3) remains documentation-only until
// rtp-proxy-ADR-008 ratifies (still Proposed).
include 'rtp-proxy:rtp-proxy-common'
include 'rtp-proxy:rtp-proxy-velocity'

// Relocate the rtp-proxy tree on disk under platforms/ while keeping its flat
// Gradle project paths. The implicit parent and each included child are
// overridden explicitly (parent projectDir does not cascade to children).
project(':rtp-proxy').projectDir                = file('platforms/rtp-proxy')
project(':rtp-proxy:rtp-proxy-common').projectDir   = file('platforms/rtp-proxy/rtp-proxy-common')
project(':rtp-proxy:rtp-proxy-velocity').projectDir = file('platforms/rtp-proxy/rtp-proxy-velocity')

// NeoForge platform adapter — in-scope per ADR-033 and rtp-neoforge-ADR-001.
// The NeoForge platform is part of the unified single-jar (rtp-plugin merges
// its Mojmap bytecode + META-INF/neoforge.mods.toml post-remap, so one
// LeafRTP-Pro-<ver>.jar loads on Bukkit/Fabric/Velocity AND NeoForge).
//
// The NeoForge toolchain (ModDevGradle, net.neoforged.moddev) resolves NeoForge
// userdev artifacts from network repositories that are NOT available on every
// build host (CI, JitPack, fully-offline sandboxes). Merely *configuring* these
// modules forces ModDevGradle to resolve those artifacts, which would fail an
// offline build — exactly like the JDK-25 Loom carriers above. So NeoForge is
// included BY DEFAULT (network-capable hosts produce the full unified jar) and
// can be dropped on network-constrained hosts by passing `-PexcludeNeoforge`
// (or setting the EXCLUDE_NEOFORGE env var). When excluded, rtp-plugin omits
// the NeoForge merge and the unified jar simply carries no neoforge.mods.toml.
// See platforms/rtp-neoforge/docs/adr/rtp-neoforge-ADR-001-platform-in-scope.md.
def excludeNeoforge = startParameter.projectProperties.containsKey('excludeNeoforge') ||
        System.getenv('EXCLUDE_NEOFORGE') != null
if (!excludeNeoforge) {
    include 'rtp-neoforge:rtp-neoforge-common'
    include 'rtp-neoforge:rtp-neoforge-v1_21_R1'

    project(':rtp-neoforge').projectDir                          = file('platforms/rtp-neoforge')
    project(':rtp-neoforge:rtp-neoforge-common').projectDir      = file('platforms/rtp-neoforge/rtp-neoforge-common')
    project(':rtp-neoforge:rtp-neoforge-v1_21_R1').projectDir    = file('platforms/rtp-neoforge/rtp-neoforge-v1_21_R1')

    // EARLY/EXPERIMENTAL 26.x carrier (MC 26.1, NeoForge 26.1.x). MC 26.1 runs
    // on Java 25, so this carrier pins a Java 25 toolchain and is gated by
    // `-PexcludeJdk25` (alongside the JDK-25 Fabric carriers above) - a
    // JDK-21-only host drops it even when the rest of NeoForge is built. It
    // shares the central moddev 2.0.141 pin (no per-module override). The
    // 1.21.1 carrier (Java 21) is unaffected and keeps the unified jar
    // NeoForge-capable on JDK-21 hosts. See
    // platforms/rtp-neoforge/rtp-neoforge-v26_1_R1/build.gradle.
    if (!excludeJdk25) {
        include 'rtp-neoforge:rtp-neoforge-v26_1_R1'
        project(':rtp-neoforge:rtp-neoforge-v26_1_R1').projectDir = file('platforms/rtp-neoforge/rtp-neoforge-v26_1_R1')
    }
}

include 'addons:RTP_ExampleAddon'
// RTP_GuiAddon - DonutSMP-style destination picker, split on the project platform
// model. rtp-gui-common is platform-neutral (menu model, config via RTP's
// ConfigParser, the MenuRenderer render seam, and the teleport submit through
// RTP.scheduler / serverAccessor); rtp-gui-bukkit, rtp-gui-fabric, and
// rtp-gui-neoforge are the per-platform chest-inventory renderers, all bundled
// into the single rtp-gui assembly jar. RTP owns validation
// (getAllowedTargets / getTargetStatus / teleport); the addon owns presentation.
include 'addons:RTP_GuiAddon:rtp-gui-common'
include 'addons:RTP_GuiAddon:rtp-gui-bukkit'
// Single multi-loader assembly jar (shades common + every platform renderer +
// all three loader descriptors), mirroring RTP's unified-jar model. Always built.
include 'addons:RTP_GuiAddon:rtp-gui'
// Fabric renderer carrier - deobf MC 26.x (Loom-unobf, JDK 25). Gated like the
// RTP Fabric 26.x carriers: dropped on JDK-21-only / network-constrained hosts.
if (!excludeJdk25) {
    include 'addons:RTP_GuiAddon:rtp-gui-fabric'
}
// NeoForge renderer carrier - MC 26.x (ModDevGradle, JDK 25). Gated by both the
// whole-NeoForge switch and the JDK-25 switch, matching rtp-neoforge-v26_1_R1.
if (!excludeNeoforge && !excludeJdk25) {
    include 'addons:RTP_GuiAddon:rtp-gui-neoforge'
}

// Standalone helper plugins (no rtp-api / rtp-core dependency).
// See helpers/PeriodicWorldSaver/README.md for the directory rationale.
include 'helpers:PeriodicWorldSaver'
// Black-box stress-test driver for /rtp-style commands. Drives RTP, RTP-Pro,
