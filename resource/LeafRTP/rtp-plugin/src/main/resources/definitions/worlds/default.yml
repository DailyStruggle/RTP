# --- RTP World Configuration ---
# Documentation: docs/admin/configuration/WORLDS.md

# Region used when a player runs /rtp in this world (or `/rtp world=<world>`).
# Out of the box, unconfigured worlds (like world_nether or world_the_end) fall back to "default"
# (which targets the overworld). To make `/rtp` or `/rtp world=world_nether` stay in the Nether,
# create a nether region (`definitions/regions/nether.yml` with `world: "world_nether"`,
# `vert.maxY: 120`, `vert.requireSkyLight: false`) and map `definitions/worlds/world_nether.yml`
# to `region: "nether"` via `/rtp editor`, `/rtp admin setup`, or `/rtp config worlds world_nether region=nether`.
# The region owns the destination world, distance (shape.radius), shape, vertical range (vert), and price.
# See docs/admin/configuration/WORLDS.md and docs/admin/configuration/REGIONS.md
# @type: enum
# @source: region
region: "default"

# true = need permission rtp.worlds.<worldname>. "@config" inherits
# defaults.requirePermission from config.yml.
# See docs/admin/configuration/CORE_CONFIG.md
# Replace with a literal to override per-world, e.g.:
#   requirePermission: true
requirePermission: "@config"

# World to send to if no permission
# @type: enum
# @source: world
override: "[0]"

# DO NOT TOUCH VERSION NUMBER
version: "1.0"