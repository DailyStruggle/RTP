# --- RTP 経済設定 ---

# サーバーの経済システムを通じてランダムテレポートのコストを設定します。
# テレポートコスト
# 標準 /rtp コマンドの基本料金。
# @type: number
# @range: [0.0, null]
# @default: 50.0
価格: 50.0

# 他のプレイヤーをテレポート (/rtp <プレイヤー>) するときの料金。
# @type: number
# @range: [0.0, null]
# @default: 200.0
他者への価格: 200.0

# カスタムパラメータ (/rtp region:<region> など) を使うときの料金。
# @type: number
# @range: [0.0, null]
# @default: 1000000000.0
パラメータ価格: 1000000000.0

# バイオーム指定 (/rtp biome:<biome>) の追加料金。
# @type: number
# @range: [0.0, null]
# @default: 5000.0
バイオーム価格: 5000.0

# テレポートがキャンセルされた場合（プレイヤーの移動、失敗など）に費用を返金します。
# @type: boolean
# @default: true
キャンセル時返金: true

# 支払い後にプレイヤーが保持すべき最低残高。これを下回る場合はテレポートを拒否します。
# @type: number
# @range: [0.0, null]
# @default: 0.0
最低残高: 0.0

# バージョン番号は変更しないでください
version: 1.0
