# --- RTP-Metrik-Einstellungen ---

# Reine Reporting-Schalter. Drossel-/Tuning-
# Schalter bleiben in performance.yml.
# Füllt auf Folia mit Details pro Region.
# Keine Wirkung auf Paper / Bukkit / Fabric (Single-Region-Runtimes geben
# stets eine leere Liste zurück, was für diese Plattformen korrekt ist).
# @type: boolean
# @default: true
foliaIncludeRegions: true

# Aggregationsstrategie, um Pro-Region-Stichproben in die skalaren
# tps{1,5,15}m-Felder auf Folia zusammenzufassen.
# @type: enum
# @options: [mean, max]
# @default: mean
foliaAggregationTps: "mean"

# Aggregationsstrategie, um Pro-Region-Stichproben in das skalare
# mspt-Feld auf Folia zusammenzufassen.
# @type: enum
# @options: [mean, max]
# @default: max
foliaAggregationMspt: "max"

# Aggregationsstrategie, um Pro-Region-Stichproben in das skalare
# tickBudgetUtilisation-Feld auf Folia zusammenzufassen.
# @type: enum
# @options: [mean, max]
# @default: max
foliaAggregationTickBudget: "max"

# ÄNDERE NICHT DIE VERSIONSNUMMER
version: 1.0
