# --- Настройки встроенных тестов (BIT) ---
# Документация: docs/admin/configuration/BIT.md

# Записывает структурные замечания действий как предупреждения, не блокируя регистрацию.
# Установите true, чтобы не регистрировать действия с эффективной ошибкой.
strictActions: false

# Записывает как предупреждения замечания к конфигурации, которые принимали прежние версии, не отклоняя /rtp reload.
# Установите true, чтобы считать их ошибками; перезагрузка или Hot-Apply с ошибками сохраняет текущую конфигурацию.
strictConfig: false

# Минимальное число проверок до определения, что условие всегда или никогда не проходит.
gateOutcomeSamples: 200

# Запланированный стартовый прогон BIT, выполняемый асинхронно на тике +2.
startupSweep: pbit

# Поставщик живого диагностического покрытия, внедряемый в RtpBit.RUNNER.
coverage: auto

# Уровни для зарегистрированных кодов BIT; они имеют приоритет над strictActions.
# Допустимо: ERROR, WARNING, INFO, DEBUG, TRACE и OFF. OFF подавляет замечание.
# Неизвестные коды и уровни игнорируются и записываются в журнал.
overrides:

# НЕ ИЗМЕНЯЙТЕ НОМЕР ВЕРСИИ
version: 1.0