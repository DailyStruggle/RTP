plugins {
    id 'java'
    alias(libs.plugins.shadow)
}

group = 'io.github.dailystruggle'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    maven {
        name = 'Minecraft Libraries'
        url = 'https://libraries.minecraft.net/'
    }
}

dependencies {
    implementation project(':helpers:stresstest-core')
    implementation 'org.jacoco:org.jacoco.core:0.8.12'
    compileOnly 'net.fabricmc:fabric-loader:0.16.5'
    compileOnly 'com.mojang:brigadier:1.2.9'
    testImplementation 'net.fabricmc:fabric-loader:0.16.5'
    testImplementation 'com.mojang:brigadier:1.2.9'
}

tasks.named('jar') {
    archiveClassifier.set('thin')
}

tasks.named('shadowJar') {
    archiveClassifier.set('')
    // ADR-122 Decision 3: shade and relocate server-api so it never clashes with an installed LeafRTP jar.
    relocate 'io.github.dailystruggle.server.api', 'io.github.dailystruggle.helpers.stresstestrtp.shaded.server.api'
    // Strip unused classes from shaded libraries (JaCoCo analysis/instrumentation/report
    // packages and transitive ASM) by tracing reachability from the carrier entry point.
    minimize()
    exclude 'org/jetbrains/annotations/**'
    exclude 'org/intellij/lang/annotations/**'
    exclude 'net/neoforged/**'
    exclude 'META-INF/maven/**'
    exclude 'META-INF/versions/*/module-info.class'
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}

test {
    dependsOn tasks.named('shadowJar')
    useJUnitPlatform()
}
