// helpers/StressTestRTP — umbrella Bukkit/Paper/Folia artifact packaging
// stresstest-core + stresstest-bukkit (ADR-122 Decision 1 & 3).
plugins {
    id 'java'
    id 'com.gradleup.shadow'
}

group = 'io.github.dailystruggle'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    implementation project(':helpers:stresstest-core')
    implementation project(':helpers:stresstest-bukkit')
    compileOnly 'org.spigotmc:spigot-api:1.20.4-R0.1-SNAPSHOT'

    testImplementation project(':helpers:stresstest-core')
    testImplementation project(':helpers:stresstest-bukkit')
    testImplementation 'org.spigotmc:spigot-api:1.20.4-R0.1-SNAPSHOT'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation platform(rootProject.libs.junit.bom)
    testImplementation rootProject.libs.junit.jupiter
    testRuntimeOnly rootProject.libs.junit.platform.launcher
}

test {
    dependsOn project(':helpers:stresstest-core').tasks.named('testClasses')
    dependsOn project(':helpers:stresstest-bukkit').tasks.named('testClasses')
    dependsOn project(':helpers:stresstest-bukkit').tasks.named('shadowJar')
    testClassesDirs += project(':helpers:stresstest-core').sourceSets.test.output.classesDirs
    testClassesDirs += project(':helpers:stresstest-bukkit').sourceSets.test.output.classesDirs
    classpath += project(':helpers:stresstest-core').sourceSets.test.output
    classpath += project(':helpers:stresstest-bukkit').sourceSets.test.output
    useJUnitPlatform()
}

shadowJar {
    archiveClassifier.set('')
    // ADR-122 Decision 3: shade and relocate server-api so it never clashes with an installed LeafRTP jar.
    relocate 'io.github.dailystruggle.server.api', 'io.github.dailystruggle.helpers.stresstestrtp.shaded.server.api'
}

jar {
    enabled = false
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}
