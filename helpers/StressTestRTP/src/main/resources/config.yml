# --- StressTestRTP Configuration ---
# Black-box stress-test driver for comparing /rtp commands across co-installed plugins.
# Documentation: helpers/StressTestRTP/README.md

# Dispatch benchmark commands as the target player instead of console.
# When false, dispatches from console with full admin permissions.
# @type: boolean
# @default: true
dispatch-as-player: true

# Allow timed benchmark mode with multiple target commands.
# When false, multi-target runs require /rtpstress sequence to avoid contention.
# @type: boolean
# @default: false
allow-timed-multi-target: false

# Target commands benchmarked round-robin or sequentially.
# {player} is replaced with the target player name.
# @type: list<string>
target-commands:
  # RTP / RTP-Pro (this project).
  - label: "rtp"
    command: "rtp:rtp"

  # BetterRTP (SuperRonanCraft).
  - label: "betterrtp"
    command: "betterrtp:betterrtp"

  # HuskHomes.
  - label: "huskhomes"
    command: "huskhomes:rtp"

  # EzRTP.
  - label: "ezrtp"
    command: "ezrtp:forcertp {player} world"

  # Demoted competitors (uncomment to benchmark):
  # - label: "jakesrtp"
  #   command: "jakesrtp:forcertp {player} -c default-settings"
  # - label: "asyrtp"
  #   command: "asyrtp:rtp world world {player}"
  # - label: "sorekillrtp"
  #   command: "sorekillrtp:randomtp {player} local world"
  # - label: "advancedrtp"
  #   command: "advancedrtp:rtp {player}"
  # - label: "essentialsx"
  #   command: "essentials:tpr"

# Legacy single-target command template.
# @type: string
# @default: "rtp player:{player}"
# target-command: "rtp player:{player}"

# Online players targeted by the benchmark harness.
# Accepts "all", "permission:<node>", or "names: [name1, name2]".
# @type: string
# @default: "all"
roster: "all"

# Maximum time allowed for a teleport attempt to complete before timing out.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 5000
attempt-timeout-ms: 5000

# Fail in-flight attempts immediately on matching rejection messages in console.
# @type: boolean
# @default: true
console-fail-enabled: true

# Console rejection patterns to detect failed attempts. Empty list uses defaults.
# @type: list<string>
console-fail-patterns: []

# Save loaded worlds after each benchmark phase before the recovery gap.
# "auto" saves on Spigot only; "always" saves on all platforms; "never" disables.
# @type: enum
# @options: ["auto", "always", "never"]
# @default: "auto"
save-worlds-between-phases: "auto"

# Default duration for timed benchmark runs (/rtpstress start).
# @type: integer
# @range: [1, null]
# @unit: seconds
# @default: 300
default-duration-seconds: 300

# Maximum number of concurrent teleport attempts in flight.
# @type: integer
# @range: [1, null]
# @default: 4
default-concurrency: 4

# Minimum delay between successive dispatches for the same player, in ticks.
# @type: integer
# @range: [0, null]
# @unit: ticks
# @default: 30
per-player-gap-ticks: 30

# Millisecond override for per-player dispatch gap. -1 uses per-player-gap-ticks.
# @type: integer
# @range: [-1, null]
# @unit: ms
# @default: -1
per-player-gap-ms: -1

# Dispatch next attempt immediately upon slot completion instead of waiting for runner tick.
# @type: boolean
# @default: true
immediate-redispatch: true

# Minimum interval between start times across all attempts. 0 runs unthrottled.
# @type: integer
# @range: [0, null]
# @unit: ms
# @default: 0
dispatch-interval-ms: 0

# Folia-specific attribution tuning settings.
folia:
  # Watch player position on owning region thread to attribute completions.
  # @type: boolean
  # @default: true
  pinned-position-watch: true

  # Minimum XZ distance in blocks to count a player movement as a teleport.
  # @type: number
  # @range: [0.0, null]
  # @unit: blocks
  # @default: 16.0
  poll-distance-threshold: 16.0

# Watchdog timeout to force-clear wedged in-flight state if no progress is made. 0 disables.
# @type: integer
# @range: [0, null]
# @unit: ms
# @default: 30000
no-progress-kickstart-ms: 30000

# Echo successful teleport attempts to the server log.
# @type: boolean
# @default: true
log-successful-teleports: true

# Echo failed teleport attempts to the server log.
# @type: boolean
# @default: true
log-failed-teleports: true

# Number of attempts dispatched in burst mode (/rtpstress burst).
# @type: integer
# @range: [1, null]
# @default: 10
default-burst: 10

# Fixed dispatched-attempt cap per target in sequence mode. 0 governs by time.
# @type: integer
# @range: [0, null]
# @default: 0
per-target-count: 0

# Sequence mode settings for isolated, per-target benchmark phases.
sequence:
  # Duration each target is exercised, in seconds.
  # @type: integer
  # @range: [1, null]
  # @unit: seconds
  # @default: 600
  per-target-seconds: 600

  # Idle recovery gap between targets, in seconds.
  # @type: integer
  # @range: [0, null]
  # @unit: seconds
  # @default: 120
  gap-seconds: 120

  # Warm-up duration before the measured sequence begins. 0 disables.
  # @type: integer
  # @range: [0, null]
  # @unit: seconds
  # @default: 30
  warmup-seconds: 30

  # Number of warm-up cycles across all targets.
  # @type: integer
  # @range: [1, null]
  # @default: 1
  warmup-target-cycles: 1

# Ramp mode (/rtpstress ramp <target>): fixed-rate offered-load stages against one target.
# Stress point = highest stage that passes every ramp.pass criterion.
# Concurrency is one in-flight attempt per roster player; default-concurrency is ignored.
ramp:
  # Offered rates per stage, ascending. Each stage writes one row to <stamp>-ramp.csv.
  # @type: list<number>
  # @unit: teleports/s
  # @default: [5, 10, 20, 40, 80, 160, 320]
  stages: [5, 10, 20, 40, 80, 160, 320]

  # Dispatch window per stage. The drain after it (<= attempt-timeout-ms + 1 s) is not counted.
  # @type: integer
  # @range: [1, null]
  # @unit: seconds
  # @default: 60
  stage-seconds: 60

  # No-dispatch window before warm-up, bots online. Its second half is the idle
  # baseline subtracted for every stage's net_* columns in <stamp>-phases.csv.
  # Taken before any teleport so a plugin's post-teleport background work is billed to it. 0 disables.
  # @type: integer
  # @range: [0, null]
  # @unit: seconds
  # @default: 30
  idle-seconds: 30

  # Unrecorded warm-up at the first stage's rate before stage 0. 0 disables.
  # @type: integer
  # @range: [0, null]
  # @unit: seconds
  # @default: 30
  warmup-seconds: 30

  # Idle settle between stages, after the drain.
  # @type: integer
  # @range: [0, null]
  # @unit: seconds
  # @default: 5
  gap-seconds: 5

  # Per-player re-dispatch gap during a ramp; replaces per-player-gap-ticks/-ms.
  # 0 keeps the roster (not a cooldown) as the only harness bound.
  # @type: integer
  # @range: [0, 5000]
  # @unit: ms
  # @default: 0
  per-player-gap-ms: 0

  # Paper only: cap each roster player's server-side view and simulation distance (2-32).
  # Paper loads max(view, simulation)+1 chunks around every player whatever the client asks,
  # so at view-distance 10 each landing pulls ~529 chunks and a large bot roster measures
  # world generation, not the plugin. Same for every target. 0 keeps server.properties.
  # @type: integer
  # @range: [0, 32]
  # @default: 2
  player-view-distance: 2

  # Console rejection phrases counted as plugin-side busy (shed, not failure). Empty uses defaults.
  # Only console-visible rejections can match; player-only chat replies surface as timeouts.
  # @type: list<string>
  busy-patterns: []

  # Stage pass criteria. All must hold.
  pass:
    # Minimum achieved/offered ratio (achieved = successful teleports / stage seconds).
    # @type: number
    # @range: [0.0, 1.0]
    # @default: 0.95
    min-achieved-fraction: 0.95

    # Maximum MSPT p95 over the stage window.
    # @type: number
    # @range: [0.0, null]
    # @unit: ms
    # @default: 50.0
    max-mspt-p95: 50.0

    # Maximum (timeouts + errors) / attempts. Busy rejections excluded.
    # @type: number
    # @range: [0.0, 1.0]
    # @default: 0.01
    max-fail-fraction: 0.01

  # Ramp stop rules.
  stop:
    # Stop after this many consecutive failing stages.
    # @type: integer
    # @range: [1, null]
    # @default: 2
    consecutive-failures: 2

    # Abort the current stage and stop when wall-clock TPS stays below this value...
    # @type: number
    # @range: [0.0, 20.0]
    # @default: 5.0
    low-tps-threshold: 5.0

    # ...continuously for this long.
    # @type: integer
    # @range: [0, null]
    # @unit: seconds
    # @default: 10
    low-tps-seconds: 10

# Per-chunk-load CPU cost calibration, in microseconds. 0 disables amendment.
# @type: number
# @range: [0.0, null]
# @unit: us
# @default: 28221.0
chunk-load-cost-us: 28221.0

# Paper-family chunk-load CPU cost override, in microseconds. 0 disables amendment.
# @type: number
# @range: [0.0, null]
# @unit: us
# @default: 0.0
chunk-load-cost-us-paper: 0.0

# Folia-family chunk-load CPU cost override, in microseconds. 0 disables amendment.
# @type: number
# @range: [0.0, null]
# @unit: us
# @default: 0.0
chunk-load-cost-us-folia: 0.0

# Sampling interval for per-thread CPU breakdown metrics. 0 samples boundaries only.
# @type: integer
# @range: [0, null]
# @unit: ms
# @default: 1000
cpu-breakdown-sample-ms: 1000

# Sampling cadence for TPS, MSPT, and JVM heap usage.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
sample-period-ms: 50

# Folia region TPS sampling cadence. Ignored on Spigot and Paper.
# @type: integer
# @range: [50, null]
# @unit: ms
# @default: 250
region-tps-sample-period-ms: 250

# Polling interval for the runner async dispatch loop.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 20
runner-tick-ms: 20

# Directory relative to plugin data folder for CSV and summary run artifacts.
# @type: string
# @default: "runs"
output-subdir: "runs"

# Sampling interval for plugin chunk ticket census on Paper.
# @type: integer
# @range: [250, null]
# @unit: ms
# @default: 1000
ticket-sample-period-ms: 1000

# Run a startup self-test verifying sync vs async chunk load attribution.
# @type: boolean
# @default: true
sync-load-selftest: true

# Sampling stride for ChunkLoadCounter stack-walk attribution (1 = inspect every load).
# Values > 1 sample 1-in-N loads and scale attributed counts, cutting stack-walk CPU on high-load plugins.
# @type: integer
# @range: [1, null]
# @default: 1
sync-load-sample-rate: 1

# Calibration probe to measure the memory and chunk footprint of a chunk ticket.
ticket-footprint-probe:
  # Enable the setup-phase chunk ticket footprint probe.
  # @type: boolean
  # @default: true
  enabled: true

  # Distance from world origin in blocks to search for an unloaded probe chunk.
  # @type: integer
  # @range: [1000, null]
  # @unit: blocks
  # @default: 20000
  origin-distance-blocks: 20000

  # Ticks awaited after load/unload before sampling footprint.
  # @type: integer
  # @range: [5, null]
  # @unit: ticks
  # @default: 40
  settle-ticks: 40

# Per-plugin memory allocation profiling via JDK Flight Recorder.
jfr-allocation:
  # Enable JFR object allocation profiling during measurement phases.
  # @type: boolean
  # @default: true
  enabled: true

  # Allocation-sample throttle rate passed to jdk.ObjectAllocationSample.
  # @type: string
  # @default: "300/s"
  throttle: "300/s"

  # Maximum recording buffer size per phase on disk, in megabytes.
  # @type: integer
  # @range: [1, null]
  # @unit: MB
  # @default: 256
  max-size-mb: 256

  # Additional package prefixes to track per target label.
  # @type: map
  tracked-packages: {}

# Plugin name to isolate in peak target chunk ticket census. Empty auto-infers from single target.
# @type: string
# @default: ""
residency-target-plugin: ""

# Detect and record plugins entering internal heap-pressure conservation modes.
# @type: boolean
# @default: true
heap-pressure-watch-enabled: true

# Regex patterns matched against console to detect heap-pressure mode triggers. Empty uses defaults.
# @type: list<string>
heap-pressure-patterns: []

# Best-effort cache reset commands dispatched before /rtpstress reset-cold runs.
# @type: list<string>
cache-reset-commands: []

# Spark profiler integration for automated per-phase profiling.
spark:
  # Enable automatic spark profiling during measurement phases.
  # @type: boolean
  # @default: true
  enabled: true

  # Start an isolated spark profile for each measurement phase.
  # @type: boolean
  # @default: true
  profile-per-phase: true

  # Auto-stop timeout in seconds for spark profiler.
  # @type: integer
  # @range: [1, null]
  # @unit: seconds
  # @default: 660
  timeout-seconds: 660

  # Only capture ticks slower than this threshold in ms. 0 captures all ticks.
  # @type: integer
  # @range: [0, null]
  # @unit: ms
  # @default: 0
  only-ticks-over-ms: 0

  # Sampling interval in ms passed to spark profiler start via --interval. 0 uses spark's default.
  # @type: integer
  # @range: [0, null]
  # @unit: ms
  # @default: 0
  interval-ms: 0

  # Comma-separated thread names sampled by spark profiler start, one --thread flag per entry.
  # A "*" inside an entry is a wildcard and switches spark to --regex; "*" alone samples every thread.
  # Empty samples the server thread only.
  # @type: string
  # @default: "Server thread,RTP-Anvil-IO-*"
  threads: "Server thread,RTP-Anvil-IO-*"

  # Save profiles locally (.sparkprofile) instead of uploading to bytebin.
  # @type: boolean
  # @default: true
  save-to-file: true

  # Intra-phase profile rotation interval in seconds. 0 disables rotation to avoid mid-phase stop/save spikes.
  # @type: integer
  # @range: [0, null]
  # @unit: seconds
  # @default: 0
  rotate-seconds: 0

  # Automatically decode saved spark profiles into summary JSON sidecars.
  # @type: boolean
  # @default: true
  auto-summary: true

  # Delay in ticks before polling for newly saved spark profile files.
  # @type: integer
  # @range: [1, null]
  # @unit: ticks
  # @default: 60
  auto-summary-delay-ticks: 60

  # Timeout in seconds to poll for newly saved spark profile files.
  # @type: integer
  # @range: [1, null]
  # @unit: seconds
  # @default: 30
  auto-summary-timeout-seconds: 30

  # Override path for spark plugin data folder. Empty uses default.
  # @type: string
  # @default: ""
  plugin-folder: ""
