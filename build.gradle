plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.8' apply false
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'io.github.dailystruggle'
version = '3.2.1'
ext.liteVersion = '3.2.1'

spotless {
    java {
        target 'rtp-*/**/*.java', 'addons/**/*.java'
        targetExclude '**/build/**', '**/.gradle/**', '**/generated/**', '**/target/**'
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

allprojects {
    group = 'io.github.dailystruggle'
    version = '3.2.1'

    // RTP-lite ships a separate version line from Pro. Pro tracks the
    // root `version` above (currently 3.2.1); lite is pinned via
    // `ext.liteVersion` and applied to the lite shadow/remap tasks and
    // `processLiteResources` token expansion in `rtp-plugin/build.gradle`.
    // Lite is brought up to parity with Pro at 3.1.3 alongside the free
    // build's basic Folia support (see CHANGELOG 3.1.3).
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
        maven { url = 'https://repo.papermc.io/repository/maven-snapshots/' }
        maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
        maven { url = 'https://jitpack.io' }
        maven { url = 'https://repo.codemc.io/repository/maven-public/' }
        maven { url = 'https://maven.fabricmc.net/' }
    }
}

subprojects {
    apply plugin: 'java-library'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        // `-sources` / `-javadoc` jars are intentionally NOT produced: the build
        // only ships the executable artifacts. The addon-API publish closure
        // below publishes `from components.java`, which simply carries no
        // sources/javadoc variant as a result.
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }

    // Javadoc strictness is concentrated on the addon-facing surface. rtp-api and
    // rtp-core are consumed by out-of-repo addon authors (see the publishing block
    // below), so they keep the JDK's default doclint checks (missing tags included).
    // Every other module (platform adapters, rtp-plugin, addons, the helper api/*
    // SPI modules) only needs javadoc to *build*, not to be exhaustively documented,
    // so doclint is disabled and javadoc warnings no longer fail their builds.
    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        if (project.path != ':rtp-api' && project.path != ':rtp-core') {
            options.addStringOption('Xdoclint:none', '-quiet')
            failOnError = false
        }
    }

    dependencies {
        compileOnly 'org.jetbrains:annotations:24.1.0'
        // Checker Framework qualifier annotations (compile-time only; not shipped in JARs).
        // The Resource Leak Checker reads @MustCall, @Owning, and @EnsuresCalledMethods
        // from this artifact during annotation processing.
        compileOnly 'org.checkerframework:checker-qual:3.42.0'
        testCompileOnly 'org.checkerframework:checker-qual:3.42.0'
        testImplementation platform('org.junit:junit-bom:5.10.0')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation 'org.mockito:mockito-core:5.5.0'
        testImplementation 'org.jetbrains:annotations:24.1.0'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
    }

    apply plugin: 'jacoco'
    jacoco { toolVersion = "0.8.11" }
    tasks.withType(Test) { finalizedBy jacocoTestReport }
    jacocoTestReport {
        dependsOn test
        reports { html.required = true; xml.required = true }
    }

    processResources {
        // Capture project.version at configuration time so the filesMatching
        // closure does not reach Task.project at execution time
        // (deprecated in Gradle 9, fatal in Gradle 10).
        def projectVersion = project.version
        inputs.property "version", projectVersion
        filesMatching(["plugin.yml", "fabric.mod.json"]) {
            expand "version": projectVersion
        }
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
}

// ---------------------------------------------------------------------------
// Addon-facing artifact publishing (JitPack / Maven Local).
//
// Both rtp-api and rtp-core are supported addon-development dependencies, so
// out-of-repo addon authors need them (and their inter-module project-dependency
// closure) resolvable from a public Maven coordinate rather than `project(...)`
// references that only exist inside this build. This block applies `maven-publish`
// to exactly that closure and nothing else, deliberately excluding the platform
// adapters, the Fabric/Loom (JDK 25) modules, and the shaded plugin jar.
//
// On JitPack (see jitpack.yml) the resulting modules are consumed as
//   com.github.DailyStruggle.RTP:<module>:<tag>
// For a "real" registry (Maven Central) see docs/dev/PUBLISHING.md.
//
// Closure rationale (transitive `api`/`implementation` project edges):
//   rtp-api  -> commands-api, yaml-api, metrics-api
//   rtp-core -> rtp-api, commands-api, yaml-api, effects-api, metrics-api,
//               maps-api, rtp-proxy:rtp-proxy-common
//   rtp-proxy-common   -> rtp-api
// Every coordinate that can appear in a generated POM must itself be published,
// otherwise a consumer's transitive resolution fails. commands-api and
// effects-api are in-tree modules re-exported via `api` from rtp-api/rtp-core,
// so they are published from this build alongside the rest of the closure.
def publishedModulePaths = [
        ':rtp-api',
        ':rtp-core',
        ':commands-api',
        ':effects-api',
        ':yaml-api',
        ':metrics-api',
        ':maps-api',
        ':rtp-proxy:rtp-proxy-common',
]

// ---------------------------------------------------------------------------
// Root `build/libs` artifact aggregation.
//
// The root project applies the `java` plugin (for Spotless / convenience), so
// its `jar` task produces an empty `RTP-<version>.jar` in `build/libs` (the
// root source tree has no `src/main/java`). The shippable artifacts (the shaded
// + Loom-remapped Pro and lite jars) are produced by `:rtp-plugin`. Mirror
// them into the root `build/libs` so `build/libs` holds the real jars rather
// than a blank one.
// `:rtp-plugin` is the shaded Bukkit-family aggregator. It bundles the JDK-25
// Fabric carriers via project(...) dependencies, so settings.gradle drops it
// from the build graph whenever the JDK-25 modules are excluded (e.g. the
// `-PexcludeJdk25` JitPack publish run). Only wire the aggregation task when
// the module is actually part of this build, otherwise `project(':rtp-plugin')`
// fails configuration with "Project with path ':rtp-plugin' could not be found".
// Only the executable, shippable jars are mirrored into the root `build/libs`.
// The intermediate `-dev` jars (Loom/Shadow pre-remap inputs) and the
// `-sources` / `-javadoc` jars are deliberately excluded - the root build
// collects executables only.
def executableJarsOnly = { spec ->
    spec.exclude '*-dev.jar'
    spec.exclude '*-sources.jar'
    spec.exclude '*-javadoc.jar'
}

if (findProject(':rtp-plugin') != null) {
    tasks.register('copyPluginJars', Copy) {
        group = 'build'
        description = 'Copies the shippable :rtp-plugin jars into the root build/libs.'
        from(project(':rtp-plugin').layout.buildDirectory.dir('libs')) {
            executableJarsOnly(it)
        }
        into layout.buildDirectory.dir('libs')
        // The root `jar` task drops an empty RTP-<version>.jar here; remove it so
        // build/libs only contains the real plugin artifacts. Also sweep any
        // stale non-executable jars left by earlier builds (the intermediate
        // `-dev` jars and historical `-sources` / `-javadoc` jars), since a
        // `Copy` task never prunes its destination - build/libs holds
        // executables only.
        doFirst {
            delete fileTree(layout.buildDirectory.dir('libs')) {
                include "${rootProject.name}-${project.version}.jar"
                include '*-dev.jar'
                include '*-sources.jar'
                include '*-javadoc.jar'
            }
        }
    }

    // Build the plugin jars before copying, and run the copy as part of the root
    // build so `.\gradlew build` leaves the real artifacts in build/libs.
    copyPluginJars.dependsOn ':rtp-plugin:assemble'
    tasks.named('assemble').configure { finalizedBy copyPluginJars }
}

// ---------------------------------------------------------------------------
// Root `build/libs` aggregation of the executable addon / helper jars.
//
// Mirroring the `:rtp-plugin` mirroring above, the user-installable jars from
// the standalone addons (LeafRTPGuiAddon assembly, LeafRTPCountdownAddon) and the
// helper plugins (PeriodicWorldSaver, StressTestRTP) are copied into the root
// `build/libs` so a single `.\gradlew build` leaves every shippable jar in one
// place. Only executables are copied (no `-dev` / `-sources` / `-javadoc`).
// Each module is wired only when it is part of the build graph (the JDK-25 /
// NeoForge carriers can be excluded via settings.gradle, but the executable
// modules listed here are always present).
def executableAddonHelperPaths = [
        ':addons:LeafRTPGuiAddon:rtp-gui',
        ':addons:LeafRTPCountdownAddon',
        ':helpers:PeriodicWorldSaver',
        ':helpers:StressTestRTP',
].findAll { findProject(it) != null }

if (!executableAddonHelperPaths.isEmpty()) {
    tasks.register('copyAddonAndHelperJars', Copy) {
        group = 'build'
        description = 'Copies the shippable addon / helper executable jars into the root build/libs.'
        executableAddonHelperPaths.each { path ->
            from(project(path).layout.buildDirectory.dir('libs')) {
                executableJarsOnly(it)
            }
        }
        into layout.buildDirectory.dir('libs')
    }

    executableAddonHelperPaths.each { path ->
        copyAddonAndHelperJars.dependsOn "${path}:assemble"
    }
    tasks.named('assemble').configure { finalizedBy 'copyAddonAndHelperJars' }
}

configure(publishedModulePaths.collect { project(it) }) {
    apply plugin: 'maven-publish'

    // Publish after evaluation so each module's `java`/`java-library` component
    // (and any withSourcesJar/withJavadocJar wiring) is fully registered first.
    afterEvaluate {
        publishing {
            publications {
                mavenJava(MavenPublication) {
                    from components.java
                }
            }
        }
    }
}
