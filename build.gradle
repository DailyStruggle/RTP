plugins {
    id 'java'
    // Shared plugin versions live in gradle/libs.versions.toml (version catalog).
    alias(libs.plugins.shadow) apply false
    alias(libs.plugins.spotless)
    alias(libs.plugins.japicmp) apply false
    alias(libs.plugins.cyclonedx) apply false
    alias(libs.plugins.sonar)
}

group = 'io.github.dailystruggle'
// Single source of truth for both version lines: `gradle.properties`
// (`version` / `liteVersion`). Do not hardcode the number here.
version = providers.gradleProperty('version').get()
ext.liteVersion = providers.gradleProperty('liteVersion').get()

spotless {
    lineEndings = 'UNIX'
    java {
        target 'rtp-*/**/*.java', 'addons/**/*.java', 'api/**/*.java'
        targetExclude '**/build/**', '**/.gradle/**', '**/generated/**', '**/target/**', 'api/**/build/**'
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

allprojects {
    group = 'io.github.dailystruggle'
    version = providers.gradleProperty('version').get()

    // ENTERPRISE_READINESS.md Item 40: Reproducible builds.
    // Ensure deterministic byte-for-byte JAR/ZIP creation across build environments.
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    // ENTERPRISE_READINESS.md Item 40: Dependency locking support.
    // Allows generating and verifying dependency lockfiles via `--write-locks`.
    dependencyLocking {
        lockMode = LockMode.LENIENT
    }

    // RTP-lite ships a separate version line from Pro. Pro tracks the
    // root `version` above (currently 3.2.1); lite is pinned via
    // `ext.liteVersion` and applied to the lite shadow/remap tasks and
    // `processLiteResources` token expansion in `rtp-plugin/build.gradle`.
    // Lite is brought up to parity with Pro at 3.1.3 alongside the free
    // build's basic Folia support (see CHANGELOG 3.1.3).
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
        maven { url = 'https://repo.papermc.io/repository/maven-snapshots/' }
        maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
        maven { url = 'https://nexus.sirblobman.xyz/public/' }
        maven {
            url = 'https://jitpack.io'
            content {
                excludeGroupByRegex 'com\\.github\\.sirblobman.*'
            }
        }
        maven { url = 'https://repo.codemc.io/repository/maven-public/' }
        maven { url = 'https://maven.fabricmc.net/' }
    }
}

subprojects {
    apply plugin: 'java-library'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(Integer.parseInt(libs.versions.javaToolchain.get()))
        }
        // `-sources` / `-javadoc` jars are intentionally NOT produced: the build
        // only ships the executable artifacts. The addon-API publish closure
        // below publishes `from components.java`, which simply carries no
        // sources/javadoc variant as a result.
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    // Javadoc strictness is concentrated on the addon-facing surface. rtp-api and
    // rtp-core are consumed by out-of-repo addon authors (see the publishing block
    // below), so they keep the JDK's default doclint checks (missing tags included).
    // Every other module (platform adapters, rtp-plugin, addons, the helper api/*
    // SPI modules) only needs javadoc to *build*, not to be exhaustively documented,
    // so doclint is disabled and javadoc warnings no longer fail their builds.
    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        if (project.path != ':rtp-api' && project.path != ':rtp-core') {
            options.addStringOption('Xdoclint:none', '-quiet')
            failOnError = false
        }
    }

    dependencies {
        // Shared versions are centralized in gradle/libs.versions.toml.
        compileOnly libs.jetbrains.annotations
        // Checker Framework qualifier annotations (compile-time only; not shipped in JARs).
        // The Resource Leak Checker reads @MustCall, @Owning, and @EnsuresCalledMethods
        // from this artifact during annotation processing.
        compileOnly libs.checker.qual
        testCompileOnly libs.checker.qual
        testImplementation platform(libs.junit.bom)
        testImplementation libs.junit.jupiter
        testImplementation libs.mockito.core
        testImplementation libs.jetbrains.annotations
        testRuntimeOnly libs.junit.platform.launcher
    }

    // Verbose test output (per-test start/pass lines + full stdout/stderr streaming)
    // is opt-in via `-PverboseTests`. The default run only reports skipped/failed
    // tests, which removes the dominant console-I/O cost on large suites
    // (rtp-core streams a lot of runtime logging). Failures still print full
    // stack traces and exceptions so a red build stays diagnosable.
    def verboseTests = project.hasProperty('verboseTests')
    // Fork tests across JVMs so a single module's suite runs in parallel. Capped
    // at half the available processors to leave headroom for Gradle's own
    // module-level parallelism (`org.gradle.parallel=true`) and the 8g daemon
    // heap shared with the Loom remap workers. `forkEvery` recycles a worker JVM
    // periodically to bound leaked static state across test classes.
    def testForks = project.hasProperty('testForks') ?
            project.property('testForks').toInteger() :
            Math.max(1, Runtime.runtime.availableProcessors().intdiv(2))
    // Tiered test execution (JUnit 5 tags). Test categories, by purpose:
    //   - "logic" (the DEFAULT / coverage tier): every UNTAGGED test. Fast,
    //     deterministic unit/logic tests - this is the tier the changed-line
    //     coverage gate (scripts/diff-coverage.py) measures, and the one new
    //     tests join by default (per library, then core).
    //   - `slow`    : long-running characterization / benchmark suites.
    //   - `edge`    : environment-specific / edge-case suites.
    //   - `simulation` / `drawing` / `demo` : non-logic suites (Monte-Carlo
    //     simulations, image/map drawing, demonstrations). Excluded from the
    //     default coverage-focused tier so it stays under budget.
    // Default `.\gradlew.bat build` / `test` runs the logic tier only (all of
    // the above tags are excluded). Pass `-PfullTests` to run EVERYTHING
    // (release / nightly CI): `.\gradlew.bat build -PfullTests`.
    // Untagged tests always run in both tiers, so the default stays a safe
    // superset-minus-non-logic.
    def fullTests = project.hasProperty('fullTests')
    def nonLogicTags = ['slow', 'edge', 'simulation', 'drawing', 'demo'] as String[]
    tasks.withType(Test).configureEach {
        useJUnitPlatform {
            if (!fullTests && name != 'simulationBenchmark') {
                excludeTags nonLogicTags
            }
        }
        maxHeapSize = '2048m'
        // -XX:+EnableDynamicAgentLoading opts in to Mockito/ByteBuddy's dynamic
        // agent attach, silencing the JDK "agent loaded dynamically ... will be
        // disallowed by default in a future release" warning across the suite.
        // -Xshare:off disables CDS so the test launcher's bootstrap-classpath
        // append no longer prints "Sharing is only supported for boot loader
        // classes ..." on every fork.
        jvmArgs '-XX:+UseG1GC', '-XX:MaxMetaspaceSize=384m', '-XX:+EnableDynamicAgentLoading', '-Xshare:off'
        maxParallelForks = testForks
        forkEvery = 20
        // Re-run when the tier toggle flips so cached results from the other
        // tier are not silently reused.
        inputs.property 'fullTests', fullTests
        testLogging {
            events = (verboseTests ? ['started', 'passed', 'skipped', 'failed'] : ['skipped', 'failed'])
            showStandardStreams = verboseTests
            exceptionFormat = 'full'
            showStackTraces = true
        }
    }

    // JaCoCo instrumentation + HTML/XML report generation is opt-in via
    // `-Pcoverage`. A routine `.\gradlew.bat build` skips it entirely (the
    // instrumentation agent and dual-format report are pure overhead for local
    // dev); CI runs coverage with `-Pcoverage`.
    apply plugin: 'jacoco'
    jacoco { toolVersion = libs.versions.jacoco.get() }
    if (project.hasProperty('coverage')) {
        tasks.withType(Test).configureEach { finalizedBy jacocoTestReport }
        jacocoTestReport {
            dependsOn test
            reports { html.required = true; xml.required = true }
        }
    }

    // Coverage floors, centralized (ENTERPRISE_READINESS.md section 4.1 item 3).
    // Single source of truth for every module's jacocoTestCoverageVerification
    // ratchet: floors live in one map here rather than scattered across per-module
    // build scripts. Add a module's path with its measured-minus-margin floors to
    // start gating it; raise the numbers as coverage grows -- never lower them.
    // The verification runs off the JaCoCo exec data the jacoco plugin already
    // attaches to every Test task, so it gates `check` regardless of `-Pcoverage`
    // (which only controls report generation). Platform adapters stay uncapped
    // until their realistic ceilings (section 2.2) are reached; add them here then.
    def coverageFloors = [
            // rtp-core measured via jacocoTestReport (2026-09-15): 81.6% instruction /
            // 65.8% branch. Floors carry a ~1-2 pt margin under the baseline because a
            // partially-recompiled tree makes JaCoCo discard stale execution data,
            // which can read several points low. Target is 90/80 (section 3).
            ':rtp-core': [
                    instruction: 0.80,
                    branch: 0.64,
                    // Per-package rules for safety-critical packages (ENTERPRISE_READINESS.md 4.1 item 4).
                    // Floors are higher than module baseline and gate critical pipelines.
                    packages: [
                            'io.github.dailystruggle.rtp.common.tasks.teleport': [instruction: 0.87, branch: 0.75],
                            'io.github.dailystruggle.rtp.common.selection.region': [instruction: 0.82, branch: 0.68],
                            'io.github.dailystruggle.rtp.common.selection.worldborder': [instruction: 0.99, branch: 0.89]
                    ]
            ],
            // metrics-api measured: 100% instruction / 94.6% branch.
            // Sits at Stage A target (0.95/0.85). ENTERPRISE_READINESS.md 4.2 item 13.
            ':metrics-api': [instruction: 0.95, branch: 0.85],
            // yaml-api measured: 97.0% instruction / 88.1% branch.
            // Sits at 0.92/0.80. ENTERPRISE_READINESS.md 4.2 item 7.
            ':yaml-api': [instruction: 0.92, branch: 0.80],
            // tags-api measured: 98.2% instruction / 90.9% branch.
            // Sits at Stage A target (0.95/0.85). ENTERPRISE_READINESS.md 4.2 item 8.
            ':tags-api': [instruction: 0.95, branch: 0.85],
            // anvil-api measured: 90.5% instruction / 80.5% branch.
            ':anvil-api': [instruction: 0.86, branch: 0.75],
            // maps-api measured: 94.7% instruction / 82.1% branch.
            ':maps-api': [instruction: 0.90, branch: 0.78],
            // rtp-api measured: 95.7% instruction / 81.3% branch.
            // Sits at Stage A strict 90/80 JaCoCo gate.
            ':rtp-api': [instruction: 0.90, branch: 0.80],
            // rtp-proxy-common measured via jacocoTestReport (2026-09-15): 87.0% instruction /
            // 68.8% branch (without Docker Redis IT). Floors carry a ~1-2 pt margin under the
            // baseline because a partially-recompiled tree makes JaCoCo discard stale execution
            // data, which can read several points low.
            ':rtp-proxy:rtp-proxy-common': [instruction: 0.85, branch: 0.67],
            // commands-api measured: 93.6% instruction / 80.3% branch.
            // Sits at Stage A strict 90/80 JaCoCo gate.
            ':commands-api': [instruction: 0.90, branch: 0.80],
    ]
    def moduleFloors = coverageFloors[project.path]
    if (moduleFloors != null) {
        jacocoTestCoverageVerification {
            // Read a fresh exec file, never a stale one. JaCoCo discards coverage
            // for classes whose bytecode changed since the last run, so a
            // verification off cached exec data can fail for reasons unrelated to
            // tests (ENTERPRISE_READINESS.md section 2.4 caveat 1). Binding to the
            // test task guarantees a same-invocation measurement.
            dependsOn test
            violationRules {
                rule {
                    limit {
                        counter = 'INSTRUCTION'
                        value   = 'COVEREDRATIO'
                        minimum = moduleFloors.instruction
                    }
                    limit {
                        counter = 'BRANCH'
                        value   = 'COVEREDRATIO'
                        minimum = moduleFloors.branch
                    }
                }
                if (moduleFloors.packages) {
                    moduleFloors.packages.each { pkgName, pkgLimits ->
                        rule {
                            element = 'PACKAGE'
                            includes = [pkgName]
                            if (pkgLimits.instruction != null) {
                                limit {
                                    counter = 'INSTRUCTION'
                                    value   = 'COVEREDRATIO'
                                    minimum = pkgLimits.instruction
                                }
                            }
                            if (pkgLimits.branch != null) {
                                limit {
                                    counter = 'BRANCH'
                                    value   = 'COVEREDRATIO'
                                    minimum = pkgLimits.branch
                                }
                            }
                        }
                    }
                }
            }
        }
        tasks.named('check').configure { dependsOn jacocoTestCoverageVerification }
    }

    // Local, programmable static analysis (the clang-tidy analogue). PMD is the
    // engine; the curated, appendable ruleset lives in config/pmd/ruleset.xml
    // (starter known-issue detectors + project-specific rules such as
    // PreferNonLockingExecution). It is applied ONLY under `-PstaticAnalysis`
    // so a routine `.\gradlew.bat build` neither resolves the PMD toolchain nor
    // pays its scan cost (keeps the fast-build budget intact). When enabled,
    // `pmdMain`/`pmdTest` run as part of `check` and FAIL the build on any
    // violation - this is the local + CI static-analysis gate.
    //   Local / CI gate : .\gradlew.bat check -PstaticAnalysis
    //   Whole build      : .\gradlew.bat build -PstaticAnalysis
    if (project.hasProperty('staticAnalysis')) {
        apply plugin: 'pmd'
        pmd {
            toolVersion = libs.versions.pmd.get()
            // The starter ruleset is the single source of truth; disable PMD's
            // built-in default set so only our curated/appended rules run.
            ruleSetFiles = rootProject.files('config/pmd/ruleset.xml')
            ruleSets = []
            consoleOutput = true
            // Fail the build on violations (that is the point of the gate).
            ignoreFailures = false
            // Analyse production + test sources; skip generated/remapped output.
            incrementalAnalysis = true
        }
    }

    processResources {
        // Capture project.version at configuration time so the filesMatching
        // closure does not reach Task.project at execution time
        // (deprecated in Gradle 9, fatal in Gradle 10).
        def projectVersion = project.version
        inputs.property "version", projectVersion
        filesMatching(["plugin.yml", "fabric.mod.json"]) {
            expand "version": projectVersion
        }
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
}

// ---------------------------------------------------------------------------
// Addon-facing artifact publishing (JitPack / Maven Local).
//
// Both rtp-api and rtp-core are supported addon-development dependencies, so
// out-of-repo addon authors need them (and their inter-module project-dependency
// closure) resolvable from a public Maven coordinate rather than `project(...)`
// references that only exist inside this build. This block applies `maven-publish`
// to exactly that closure and nothing else, deliberately excluding the platform
// adapters, the Fabric/Loom (JDK 25) modules, and the shaded plugin jar.
//
// On JitPack (see jitpack.yml) the resulting modules are consumed as
//   com.github.DailyStruggle.RTP:<module>:<tag>
// For a "real" registry (Maven Central) see docs/dev/PUBLISHING.md.
//
// Closure rationale (transitive `api`/`implementation` project edges):
//   rtp-api  -> commands-api, yaml-api, metrics-api
//   rtp-core -> rtp-api, commands-api, yaml-api, effects-api, metrics-api,
//               maps-api, rtp-proxy:rtp-proxy-common
//   rtp-proxy-common   -> rtp-api
// Every coordinate that can appear in a generated POM must itself be published,
// otherwise a consumer's transitive resolution fails. commands-api and
// effects-api are in-tree modules re-exported via `api` from rtp-api/rtp-core,
// so they are published from this build alongside the rest of the closure.
def publishedModulePaths = [
        ':rtp-api',
        ':rtp-core',
        ':commands-api',
        ':effects-api',
        ':yaml-api',
        ':metrics-api',
        ':maps-api',
        ':rtp-proxy:rtp-proxy-common',
]

// ---------------------------------------------------------------------------
// Binary compatibility checking (japicmp) - ENTERPRISE_READINESS.md item 31.
//
// Verifies public API modules (rtp-api, commands-api, effects-api, maps-api,
// metrics-api, anvil-api, tags-api) against the previous release baseline.
// Configured to fail the build on unannounced binary-incompatible changes.
def apiModulesForBinaryCheck = [
        ':rtp-api',
        ':commands-api',
        ':effects-api',
        ':maps-api',
        ':metrics-api',
        ':anvil-api',
        ':tags-api',
].findAll { findProject(it) != null }

def acceptedBreaksConfigFile = file("${rootDir}/config/binary-compatibility-accepted-breaks.json")

apiModulesForBinaryCheck.each { modulePath ->
    project(modulePath) {
        apply plugin: 'me.champeau.gradle.japicmp'

        def baselineVersion = project.findProperty('japicmpBaselineVersion') as String ?: '3.2.0'
        def baselineArtifact = "io.github.dailystruggle:${project.name}:${baselineVersion}"

        configurations {
            japicmpBaseline {
                canBeResolved = true
                canBeConsumed = false
            }
        }

        dependencies {
            japicmpBaseline(baselineArtifact) {
                transitive = false
            }
        }

        def pluginInst = project.plugins.findPlugin('me.champeau.gradle.japicmp')
        def taskClass = pluginInst.class.classLoader.loadClass('me.champeau.gradle.japicmp.JapicmpTask')

        def txtReportFile = layout.buildDirectory.file("reports/japicmp-${project.name}.txt")
        def htmlReportFile = layout.buildDirectory.file("reports/japicmp-${project.name}.html")

        tasks.register('checkBinaryCompatibility', taskClass) {
            group = 'verification'
            description = "Checks binary compatibility of ${project.name} against version ${baselineVersion}."

            // Compare newly built jar against resolved baseline.
            // In Loom-managed modules (such as :effects-api), `remapJar` produces the shippable jar
            // in build/libs, whereas `jar` outputs to build/devlibs/*-dev.jar.
            def jarTask = tasks.findByName('remapJar') ?: tasks.named('jar')
            newClasspath = files(jarTask)
            oldClasspath = configurations.japicmpBaseline

            // Report modified classes and emit rich reports
            onlyModified = true
            onlyBinaryIncompatibleModified = false
            failOnModification = false
            failOnSourceIncompatibility = false
            ignoreMissingClasses = true
            // Platform/internal adapter implementation packages are not public API
            packageExcludes = [
                    'io.github.dailystruggle.effectsapi.fabric'
            ]
            classExcludes = [
                    'io.github.dailystruggle.effectsapi.fabric.*'
            ]
            txtOutputFile = txtReportFile.get().asFile
            richReport {
                reportName = "japicmp-${project.name}.html"
                addDefaultRules = true
            }

            // Do not fail task execution if baseline jar cannot be found in repos (e.g. initial dev snapshot)
            onlyIf {
                try {
                    !configurations.japicmpBaseline.files.isEmpty()
                } catch (Exception e) {
                    logger.info("japicmp baseline ${baselineArtifact} not resolvable; skipping check for ${project.name}: ${e.message}")
                    return false
                }
            }

            // Post-analysis verification against binary-compatibility-accepted-breaks.json per DEPRECATION_POLICY.md
            doLast {
                def txtReport = txtReportFile.get().asFile
                if (!txtReport.exists()) {
                    return
                }

                // Parse accepted breaks from config
                def acceptedBreaks = []
                if (acceptedBreaksConfigFile.exists()) {
                    try {
                        def slurper = Class.forName('groovy.json.JsonSlurper').getDeclaredConstructor().newInstance()
                        def parsed = slurper.parse(acceptedBreaksConfigFile)
                        if (parsed.acceptedBreaks instanceof List) {
                            acceptedBreaks = parsed.acceptedBreaks
                        }
                    } catch (Exception e) {
                        throw new RuntimeException("Failed to parse ${acceptedBreaksConfigFile}: ${e.message}", e)
                    }
                }

                def unacceptedBinaryBreaks = []
                String currentClass = null
                txtReport.eachLine { line ->
                    def trimmed = line.trim()
                    if (trimmed.startsWith('class ') || trimmed.startsWith('interface ') || trimmed.startsWith('enum ')) {
                        currentClass = trimmed.split('\\s+')[1]
                    }
                    if (trimmed.contains('(!)') && (trimmed.contains('INCOMPATIBLE') || trimmed.contains('REMOVED') || trimmed.contains('MODIFIED'))) {
                        // Check if accepted in acceptedBreaks
                        boolean accepted = acceptedBreaks.any { entry ->
                            def modMatch = !entry.module || entry.module == project.name || entry.module == ":${project.name}"
                            def memberMatch = entry.member && trimmed.contains(entry.member as String)
                            def classMatch = entry.className && (currentClass == entry.className || trimmed.contains(entry.className as String))
                            def reasonGiven = entry.reason && entry.reason.toString().trim().length() > 0
                            return modMatch && (memberMatch || classMatch) && reasonGiven
                        }
                        if (!accepted) {
                            unacceptedBinaryBreaks << "[${project.name}] ${currentClass ?: ''}: ${trimmed}"
                        }
                    }
                }

                if (!unacceptedBinaryBreaks.isEmpty()) {
                    def msg = "Binary compatibility verification failed for ${project.name} against baseline ${baselineVersion}.\n" +
                            "The following binary-incompatible changes were detected and are NOT listed in config/binary-compatibility-accepted-breaks.json:\n" +
                            unacceptedBinaryBreaks.collect { "  - " + it }.join('\n') + "\n\n" +
                            "Per docs/dev/DEPRECATION_POLICY.md, public API elements must be deprecated for at least two minor releases before removal.\n" +
                            "If this breaking change has fulfilled the deprecation window and was announced in CHANGELOG.md, record it in config/binary-compatibility-accepted-breaks.json with the rationale."
                    throw new RuntimeException(msg)
                }
            }
        }
    }
}

// Root aggregator for binary compatibility
tasks.register('checkBinaryCompatibility') {
    group = 'verification'
    description = 'Aggregated binary compatibility verification for all public API modules.'
    apiModulesForBinaryCheck.each { modulePath ->
        dependsOn "${modulePath}:checkBinaryCompatibility"
    }
}

// ---------------------------------------------------------------------------
// Root `build/libs` artifact aggregation.
//
// The root project applies the `java` plugin (for Spotless / convenience), so
// its `jar` task produces an empty `RTP-<version>.jar` in `build/libs` (the
// root source tree has no `src/main/java`). The shippable artifacts (the shaded
// + Loom-remapped Pro and lite jars) are produced by `:rtp-plugin`. Mirror
// them into the root `build/libs` so `build/libs` holds the real jars rather
// than a blank one.
// `:rtp-plugin` is the shaded Bukkit-family aggregator. It bundles the JDK-25
// Fabric carriers via project(...) dependencies, so settings.gradle drops it
// from the build graph whenever the JDK-25 modules are excluded (e.g. the
// `-PexcludeJdk25` JitPack publish run). Only wire the aggregation task when
// the module is actually part of this build, otherwise `project(':rtp-plugin')`
// fails configuration with "Project with path ':rtp-plugin' could not be found".
// Only the executable, shippable jars are mirrored into the root `build/libs`.
// The intermediate `-dev` jars (Loom/Shadow pre-remap inputs) and the
// `-sources` / `-javadoc` jars are deliberately excluded - the root build
// collects executables only.
def executableJarsOnly = { spec ->
    spec.exclude '*-dev.jar'
    spec.exclude '*-sources.jar'
    spec.exclude '*-javadoc.jar'
}

if (findProject(':rtp-plugin') != null) {
    // Capture the empty root jar's name at configuration time. Reaching
    // Task.project (via `project.version`) inside the doFirst below is
    // deprecated in Gradle 9, fatal in Gradle 10, and incompatible with the
    // configuration cache.
    def rootJarName = "${rootProject.name}-${version}.jar"
    tasks.register('copyPluginJars', Copy) {
        group = 'build'
        description = 'Copies the shippable :rtp-plugin jars into the root build/libs.'
        from(project(':rtp-plugin').layout.buildDirectory.dir('libs')) {
            executableJarsOnly(it)
        }
        into layout.buildDirectory.dir('libs')
        // The root `jar` task drops an empty RTP-<version>.jar here; remove it so
        // build/libs only contains the real plugin artifacts. Also sweep any
        // stale non-executable jars left by earlier builds (the intermediate
        // `-dev` jars and historical `-sources` / `-javadoc` jars), since a
        // `Copy` task never prunes its destination - build/libs holds
        // executables only.
        doFirst {
            delete fileTree(layout.buildDirectory.dir('libs')) {
                include rootJarName
                include '*-dev.jar'
                include '*-sources.jar'
                include '*-javadoc.jar'
            }
        }
    }

    // Build the plugin jars before copying, and run the copy as part of the root
    // build so `.\gradlew build` leaves the real artifacts in build/libs.
    copyPluginJars.dependsOn ':rtp-plugin:assemble'
    tasks.named('assemble').configure { finalizedBy copyPluginJars }
}

// ---------------------------------------------------------------------------
// Root `build/libs` aggregation of the executable addon / helper jars.
//
// Mirroring the `:rtp-plugin` mirroring above, the user-installable jars from
// the standalone addons (LeafRTPGuiAddon assembly, LeafRTPCountdownAddon) and the
// helper plugins (PeriodicWorldSaver, StressTestRTP) are copied into the root
// `build/libs` so a single `.\gradlew build` leaves every shippable jar in one
// place. Only executables are copied (no `-dev` / `-sources` / `-javadoc`).
// Each module is wired only when it is part of the build graph (the JDK-25 /
// NeoForge carriers can be excluded via settings.gradle, but the executable
// modules listed here are always present).
def executableAddonHelperPaths = [
        ':addons:LeafRTPGuiAddon:rtp-gui',
        ':addons:LeafRTPCountdownAddon',
        ':addons:LeafRTPLinearAddon',
        ':helpers:PeriodicWorldSaver',
        ':helpers:StressTestRTP',
].findAll { findProject(it) != null }

if (!executableAddonHelperPaths.isEmpty()) {
    tasks.register('copyAddonAndHelperJars', Copy) {
        group = 'build'
        description = 'Copies the shippable addon / helper executable jars into the root build/libs.'
        executableAddonHelperPaths.each { path ->
            from(project(path).layout.buildDirectory.dir('libs')) {
                executableJarsOnly(it)
            }
        }
        into layout.buildDirectory.dir('libs')
    }

    executableAddonHelperPaths.each { path ->
        copyAddonAndHelperJars.dependsOn "${path}:assemble"
        if (project(path).tasks.findByName('shadowJar') != null) {
            copyAddonAndHelperJars.dependsOn "${path}:shadowJar"
        }
    }
    tasks.named('assemble').configure { finalizedBy 'copyAddonAndHelperJars' }
}

configure(publishedModulePaths.collect { project(it) }) {
    apply plugin: 'maven-publish'
    // `signing` is a first-party Gradle plugin (ships inside the Gradle
    // distribution, no external coordinate). It GPG-signs every published
    // artifact, which Maven Central requires. Applying it unconditionally is
    // harmless: the `signing {}` block below only wires signing tasks when a
    // key is actually present, so a credential-free `.\gradlew build` never
    // signs and never fails.
    apply plugin: 'signing'

    // Publish after evaluation so each module's `java`/`java-library` component
    // (and any withSourcesJar/withJavadocJar wiring) is fully registered first.
    afterEvaluate {
        // Maven Central rejects a publication that lacks `-sources` and
        // `-javadoc` jars, so the published closure produces both (the rest of
        // the build still ships thin executable jars only - see the `java {}`
        // note in `subprojects`). rtp-api/rtp-core keep strict doclint for the
        // in-repo build, but the Javadoc *jar* only needs to build, so doclint
        // is relaxed here for the published modules to keep the javadoc task
        // from failing the release on a missing @param/@return tag.
        tasks.withType(Javadoc).configureEach {
            options.addStringOption('Xdoclint:none', '-quiet')
            failOnError = false
        }
        java {
            withSourcesJar()
            withJavadocJar()
        }

        publishing {
            publications {
                mavenJava(MavenPublication) {
                    from components.java

                    // rtp-core applies `java-test-fixtures`, which adds
                    // testFixtures{Api,Runtime}Elements variants to the `java`
                    // component. Those carry a Gradle capability that cannot be
                    // represented in a POM (hence the "cannot be mapped to Maven"
                    // warning) and would publish a stray `-test-fixtures` jar that
                    // Maven Central rejects. Addon consumers never need the test
                    // fixtures, so drop those variants from every published module
                    // that has them (only rtp-core does today).
                    ['testFixturesApiElements', 'testFixturesRuntimeElements'].each { cfgName ->
                        if (configurations.findByName(cfgName) != null) {
                            components.java.withVariantsFromConfiguration(configurations.getByName(cfgName)) {
                                skip()
                            }
                        }
                    }

                    // POM metadata required by Maven Central (name, description,
                    // url, license, developers, scm). Central validates these on
                    // upload; JitPack / GitHub Packages ignore them, so adding
                    // them is safe for every channel.
                    pom {
                        name = project.name
                        description = 'RTP addon-facing API module: ' + project.name
                        url = 'https://github.com/DailyStruggle/RTP'
                        licenses {
                            license {
                                name = 'GPL-3.0'
                                url  = 'https://www.gnu.org/licenses/gpl-3.0.txt'
                            }
                        }
                        developers {
                            developer {
                                id = 'DailyStruggle'
                                name = 'DailyStruggle'
                            }
                        }
                        scm {
                            connection = 'scm:git:https://github.com/DailyStruggle/RTP.git'
                            developerConnection = 'scm:git:ssh://git@github.com/DailyStruggle/RTP.git'
                            url = 'https://github.com/DailyStruggle/RTP'
                        }
                    }
                }
            }

            // GitHub Packages Maven registry.
            //
            // Publishes the addon-facing closure to
            //   https://maven.pkg.github.com/DailyStruggle/RTP
            // Consumers add that URL as a Maven repo and depend on
            //   io.github.dailystruggle:<module>:<version>
            // (the same group/coordinate this build already produces).
            //
            // Credentials are read from Gradle properties `gpr.user` / `gpr.key`
            // (e.g. in ~/.gradle/gradle.properties, never committed) or, failing
            // that, the env vars GITHUB_ACTOR / GITHUB_TOKEN that GitHub Actions
            // injects automatically. Publishing to GitHub Packages needs a token
            // with the `write:packages` scope; reading needs `read:packages`.
            //
            // The repository is only wired when a token is actually present, so a
            // normal `.\gradlew build` on a dev box without credentials neither
            // fails configuration nor exposes an unauthenticated `publish` target.
            def ghUser = (findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')) as String
            def ghKey  = (findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')) as String
            if (ghUser && ghKey) {
                repositories {
                    maven {
                        name = 'GitHubPackages'
                        url = 'https://maven.pkg.github.com/DailyStruggle/RTP'
                        credentials {
                            username = ghUser
                            password = ghKey
                        }
                    }
                }
            }

            // Maven Central staging (first-party only).
            //
            // Sonatype's new Central Portal accepts a signed *bundle* rather
            // than a live Nexus deploy, and there is no first-party Gradle
            // plugin that speaks the Portal upload protocol. So instead of
            // trusting a third-party publish plugin with the signing key and
            // token, this build publishes the signed artifacts into a local
            // staging directory, which is then zipped and uploaded to the
            // Portal by hand (or a single curl step). See docs/dev/PUBLISHING.md.
            //
            // All published modules deploy into ONE shared root directory so the
            // whole closure can be bundled together:
            //   <root>/build/central-staging/
            repositories {
                maven {
                    name = 'CentralStaging'
                    url = rootProject.layout.buildDirectory.dir('central-staging')
                }
            }
        }

        // Artifact signing (first-party `signing` plugin).
        //
        // The signing key + passphrase are read from Gradle properties
        // `signingKey` (ASCII-armored in-memory PGP private key) and
        // `signingPassword`. In CI, provide them WITHOUT committing anything by
        // exporting the Gradle-property env vars:
        //   ORG_GRADLE_PROJECT_signingKey       = <armored private key>
        //   ORG_GRADLE_PROJECT_signingPassword  = <key passphrase>
        // Gradle maps any ORG_GRADLE_PROJECT_<name> env var to project property
        // <name>, so no build-script change is needed to feed CI secrets.
        //
        // Signing is wired only when a key is present, so a credential-free
        // `.\gradlew build` neither signs nor fails.
        signing {
            def signingKey = findProperty('signingKey') as String
            def signingPassword = findProperty('signingPassword') as String
            // Two mutually exclusive signing modes:
            //   1. In-memory ASCII-armored key via `signingKey` / `signingPassword`
            //      (best for CI: no gpg binary or keyring needed). NOTE: a key
            //      exported by a very recent GnuPG (2.4+/2.5+) can be unreadable
            //      by the BouncyCastle bundled in Gradle's signing plugin
            //      ("no configured signatory"); if you hit that, use mode 2.
            //   2. The local `gpg` CLI, enabled with `-PsignWithGpgCmd`. Gradle
            //      shells out to gpg, so it signs with whatever key gpg itself
            //      resolves (respecting GNUPGHOME / gpg.conf). This side-steps the
            //      BouncyCastle parse issue and is the reliable path on a box with
            //      a modern gpg installed.
            if (findProperty('signWithGpgCmd') != null) {
                useGpgCmd()
                sign publishing.publications.mavenJava
            } else if (signingKey) {
                useInMemoryPgpKeys(signingKey, signingPassword)
                sign publishing.publications.mavenJava
            }
        }
    }
}

// ---------------------------------------------------------------------------
// Devstack / Live Server JaCoCo Report & Extraction tasks
// ---------------------------------------------------------------------------
apply plugin: 'jacoco'
jacoco { toolVersion = libs.versions.jacoco.get() }

tasks.register('extractJacocoAgent', Copy) {
    description = 'Extracts the JaCoCo javaagent jar into devstack/jacoco/ for runtime server profiling.'
    group = 'verification'
    from {
        zipTree(configurations.jacocoAgent.singleFile)
    }
    include '**/jacocoagent.jar'
    into layout.projectDirectory.dir('devstack/jacoco')
    eachFile { fcd ->
        fcd.path = 'jacocoagent.jar'
    }
    includeEmptyDirs = false
}

tasks.register('jacocoServerReport', JacocoReport) {
    description = 'Generates JaCoCo coverage report for live server/devstack test execution data.'
    group = 'verification'

    def execFiles = fileTree(dir: rootDir, includes: [
            '**/devstack/jacoco/*.exec',
            '**/build/jacoco/server*.exec',
            '**/build/jacoco/backend*.exec'
    ]).filter { it.isFile() && it.length() > 50 }
    executionData.from = execFiles

    def serverProjects = subprojects.findAll {
        !it.name.toLowerCase().contains('fabric') && !it.name.toLowerCase().contains('neoforge')
    }

    sourceDirectories.from = files(serverProjects.collect { it.sourceSets.main.allSource.srcDirs })

    def pluginJar = fileTree(dir: "${rootDir}/rtp-plugin/build/libs").matching {
        include 'LeafRTP-Pro-*.jar'
        exclude '*-dev.jar'
    }
    def addonClassTrees = serverProjects.findAll { it.path.startsWith(':addons') }.collect {
        it.fileTree(dir: it.layout.buildDirectory, includes: ['classes/java/main/**', 'classes/kotlin/main/**'])
    }

    if (!pluginJar.empty) {
        classDirectories.from = files(
                zipTree(pluginJar.singleFile).matching {
                    include 'io/github/dailystruggle/rtp/**'
                    exclude '**/unobf/**', '**/*Unobf*', '**/*unobf*', '**/v26_*/**', '**/neoforge/**', '**/*NeoForge*'
                },
                addonClassTrees
        )
    } else {
        classDirectories.from = files(serverProjects.collect {
            it.fileTree(dir: it.layout.buildDirectory,
                    includes: ['classes/java/main/**', 'classes/kotlin/main/**'],
                    excludes: [
                            '**/unobf/**',
                            '**/*Unobf*',
                            '**/*unobf*',
                            '**/v26_*/**',
                            '**/neoforge/**',
                            '**/*NeoForge*'
                    ])
        })
    }

    reports {
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/server/html')
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/server/jacocoServerReport.xml')
    }
}

sonar {
    properties {
        property 'sonar.projectKey', 'DailyStruggle_RTP'
        property 'sonar.organization', 'dailystruggle'
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.coverage.exclusions', [
                '**/test/**',
                '**/testFixtures/**',
                '**/*Test*.java',
                '**/*Benchmark*.java',
                '**/testing/**',
                '**/mock/**'
        ].join(',')
        // Exclude test fixtures, platform adapters, version shims, unobf carrier mirrors,
        // and platform-specific implementations from cross-module CPD duplication checks.
        property 'sonar.cpd.exclusions', [
                '**/test/**',
                '**/testFixtures/**',
                '**/*Test*.java',
                '**/*Benchmark*.java',
                '**/testing/**',
                '**/mock/**',
                'platforms/**',
                'addons/**',
                'helpers/**',
                'rtp-plugin/**',
                'api/**/*unobf/**',
                'api/**/*Unobf/**',
                '**/server/ServerAccessorImpl.java'
        ].join(',')
        // ADR-094: Ignore java:S3077 (volatile on non-primitive/array) globally across the project.
        // Volatile reference publication is an intentional lock-free pattern used across spatial caches,
        // configuration reloads, and platform handle caches.
        // Also ignore java:S2975: public clone() implementations across Cloneable domain models.
        // Also ignore architectural patterns:
        // - java:S2176: per-version adapter subclasses share common interface/scheduler names.
        // - java:S1452: public SPI return types with wildcard generics (RTPWorld<?>, FactoryValue<?>).
        // - java:S2696: singleton instance initialization updating static fields.
        // - java:S1186: empty methods in test mocks/listeners/stubs.
        // - java:S1192: repeated string literals across test suites, serialization codecs, and command trees.
        // - java:S115: YAML/config/message enums intentionally using lowerCamelCase to map directly to YAML/lang keys.
        // - java:S3776: cognitive complexity across spatial math, polygon verification, chunk scanning, and platform version bridges.
        property 'sonar.issue.ignore.multicriteria', 's3077,s2975,s2176,s1452,s2696,s1186test,s1192,s115,s3776'
        property 'sonar.issue.ignore.multicriteria.s3077.ruleKey', 'java:S3077'
        property 'sonar.issue.ignore.multicriteria.s3077.resourceKey', '**/*'
        property 'sonar.issue.ignore.multicriteria.s2975.ruleKey', 'java:S2975'
        property 'sonar.issue.ignore.multicriteria.s2975.resourceKey', '**/*'
        property 'sonar.issue.ignore.multicriteria.s2176.ruleKey', 'java:S2176'
        property 'sonar.issue.ignore.multicriteria.s2176.resourceKey', '**/*'
        property 'sonar.issue.ignore.multicriteria.s1452.ruleKey', 'java:S1452'
        property 'sonar.issue.ignore.multicriteria.s1452.resourceKey', '**/*'
        property 'sonar.issue.ignore.multicriteria.s2696.ruleKey', 'java:S2696'
        property 'sonar.issue.ignore.multicriteria.s2696.resourceKey', '**/*'
        property 'sonar.issue.ignore.multicriteria.s1186test.ruleKey', 'java:S1186'
        property 'sonar.issue.ignore.multicriteria.s1186test.resourceKey', '**/src/test/**/*'
        property 'sonar.issue.ignore.multicriteria.s1192.ruleKey', 'java:S1192'
        property 'sonar.issue.ignore.multicriteria.s1192.resourceKey', '**/*'
        property 'sonar.issue.ignore.multicriteria.s115.ruleKey', 'java:S115'
        property 'sonar.issue.ignore.multicriteria.s115.resourceKey', '**/*'
        property 'sonar.issue.ignore.multicriteria.s3776.ruleKey', 'java:S3776'
        property 'sonar.issue.ignore.multicriteria.s3776.resourceKey', '**/*'
    }
}

subprojects {
    sonar {
        properties {
            def isPlatformOrAddon = project.projectDir.canonicalPath.contains(File.separator + 'platforms' + File.separator) ||
                    project.projectDir.canonicalPath.contains(File.separator + 'addons' + File.separator) ||
                    project.projectDir.canonicalPath.contains(File.separator + 'helpers' + File.separator) ||
                    project.path.startsWith(':rtp-bukkit') ||
                    project.path.startsWith(':rtp-paper') ||
                    project.path.startsWith(':rtp-folia') ||
                    project.path.startsWith(':rtp-fabric') ||
                    project.path.startsWith(':rtp-neoforge') ||
                    project.path.startsWith(':addons') ||
                    project.path.startsWith(':helpers') ||
                    project.path == ':rtp-plugin' ||
                    project.path == ':rtp-proxy:rtp-proxy-velocity'

            if (isPlatformOrAddon) {
                property 'sonar.coverage.exclusions', '**/*'
                property 'sonar.cpd.exclusions', '**/*'
            }

            def isVersionAdapterOrCarrier = project.name.matches('v[0-9]+.*') ||
                    project.name.contains('unobf') ||
                    project.path.matches('.*:(v[0-9]+.*|.*unobf.*)')
            if (isVersionAdapterOrCarrier) {
                property 'sonar.cpd.exclusions', '**/*'
            }

            if (!isPlatformOrAddon) {
                def jacocoReport = layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile
                if (jacocoReport.exists()) {
                    property 'sonar.coverage.jacoco.xmlReportPaths', jacocoReport.absolutePath
                }
            }
        }
    }
}
