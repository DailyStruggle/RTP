// rtp-proxy-common — host-independent proxy SPI + reference selector + in-memory binding.
//
// Architecture (rtp-proxy-ADR-001 section Package Boundary Rules):
//   - May depend on: rtp-api, JDK.
//   - Must NOT import: com.velocitypowered.*, net.md_5.bungee.*, org.bukkit.*,
//     net.minecraft.*, net.fabricmc.*.
// The package-boundary lint test (NoVendorImportsTest) enforces this on every build.
//
// Toolchain, java-library plugin, JUnit, and Checker-qual are inherited from
// the root subprojects { } block. No shadow, no Loom, no platform deps.
plugins {
    id 'java-library'
}

dependencies {
    api project(':rtp-api')
    // Phase 2e-SQL slice: SqlNetworkStateBinding uses JDBC + standard DataSource.
    // Production JDBC drivers (MySQL / Postgres) are supplied by the deploying
    // host's database accessor pool (AbstractSQLDatabaseAccessor in rtp-core);
    // we never bundle them. H2 ships as test-only so SqlNetworkStateBindingH2Test
    // can exercise two-instance fan-out without a real DB.
    testRuntimeOnly 'com.h2database:h2:2.2.224'
    // Phase 2e-Redis A1 slice: RedisNetworkStateBinding uses Jedis (already
    // pulled in by rtp-core for RedisManager); pinned to the same version
    // to avoid classpath conflicts when both modules ship in the unified jar.
    implementation 'redis.clients:jedis:5.1.2'
}
