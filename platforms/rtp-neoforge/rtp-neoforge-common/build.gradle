// Phase N1 â€” NeoForge platform adapter, version-agnostic common module.
//
// Mirrors platforms/rtp-fabric/rtp-fabric-common (rtp-fabric-ADR-001): this
// module holds version-agnostic NeoForge glue and compiles against a single
// Mojmap MC line purely to typecheck; each rtp-neoforge-vXX_YY_R1 carrier
// ships its own runtime jar pinned to its MC version.
//
// Toolchain: ModDevGradle (net.neoforged.moddev) per NEOFORGE_NOTES.md Â§8 and
// rtp-neoforge-ADR-001. ModDevGradle is the newer official NeoForge build path
// and is closest to Loom in spirit. It is applied ONLY under
// platforms/rtp-neoforge/** (build discipline parity with Loom, ADR-022 Â§3) â€”
// it must not leak into rtp-core / rtp-api / commands-api / any Bukkit-family
// or Fabric adapter.
//
// Architectural invariants (mirrors ADR-022 Â§4, applied to NeoForge):
//   * No org.bukkit.* and no net.fabricmc.* imports in this module.
//   * Shared business logic stays in :rtp-core / :rtp-api â€” this module is
//     NeoForge platform glue only.
//   * NeoForge is Mojmap-at-runtime (1.20.4+), so no obf carrier is required
//     (NEOFORGE_NOTES.md Â§5), but NM-typed surfaces that drift across MC revs
//     are still isolated in the per-version carriers, never in rtp-core.
//
// NOTE: this module is included in the build graph BY DEFAULT and is merged
// into the unified LeafRTP-Pro jar (rtp-plugin merges its Mojmap bytecode +
// META-INF/neoforge.mods.toml post-remap). The NeoForge userdev artifacts
// resolved by ModDevGradle require network access; on network-constrained
// hosts (JitPack, fully-offline CI) drop the module with `-PexcludeNeoforge`
// (or EXCLUDE_NEOFORGE) to keep `.\gradlew build` green. The named maintainer
// (project lead, @leaf_26) owns the adapter surfaces and proving the build on a
// network-capable host.

plugins {
    // ModDevGradle. Version pinned centrally in settings.gradle
    // pluginManagement.plugins {} (2.0.78 -- the proven, host-cached version
    // the 1.21.x line builds with) so this common module and the default
    // rtp-neoforge-v1_21_R1 carrier share one moddev version/classloader.
    // Apply with a bare id (no per-module version). The EARLY/EXPERIMENTAL
    // 26.1 carrier overrides to 2.0.141 in its own build.gradle (leaf-module
    // pattern, JDK-25 gated) -- do NOT raise the central pin to match it, or a
    // host that can only reach/cache 2.0.78 fails the whole default build.
    id 'net.neoforged.moddev'
}

// NeoForge / MC versions for the common typecheck line. Bump in lockstep with
// the rtp-neoforge-vXX_YY_R1 carriers when a new MC version is added.
ext {
    minecraftVersion = '1.21.1'
    neoforgeVersion  = '21.1.95'
}

neoForge {
    version = neoforgeVersion
    // No runs configured on common â€” the carriers own dev-launch run configs.
}

dependencies {
    // Platform-free abstractions consumed by every NeoForge adapter class.
    // Reused 1:1 from the platform-neutral modules (NEOFORGE_NOTES.md Â§3).
    api project(':rtp-api')
    api project(':rtp-core')
    // commands-api-ADR-001 â€” Brigadier Bridge. The bridge classes live in
    // :commands-api; this module supplies the NeoForge-side registration
    // trampoline (RegisterCommandsEvent), see NeoForgeCommandRegistrar.
    api project(':commands-api')
    // ADR-016 â€” anvil pre-filter. Platform-neutral .mca decoder; same .mca
    // substrate as Fabric (NEOFORGE_NOTES.md Â§3), reused unchanged.
    api project(':anvil-api')
}
