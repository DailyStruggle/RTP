plugins {
    id 'java-library'
}
def hasRtpCore = findProject(':rtp-api') != null && findProject(':rtp-core') != null

if (!hasRtpCore) {
    sourceSets {
        main {
            java {
                include 'io/github/dailystruggle/effectsapi/**'
                include 'io/github/dailystruggle/rtp/bukkitplatform/entity/PersonalBossBars.java'
                include 'io/github/dailystruggle/rtp/bukkitplatform/server/BukkitPluginServerAccessor.java'
                include 'io/github/dailystruggle/rtp/bukkitplatform/server/BukkitWorldEventHook.java'
                include 'io/github/dailystruggle/rtp/bukkitplatform/tools/MiniMessageRenderer.java'
                include 'io/github/dailystruggle/rtp/bukkitplatform/world/BukkitBlockWriter.java'
                include 'io/github/dailystruggle/rtp/bukkitplatform/world/BukkitRegionPaths.java'
            }
        }
        test {
            java {
                include 'io/github/dailystruggle/effectsapi/**'
                include 'io/github/dailystruggle/rtp/bukkitplatform/tools/MiniMessageRendererLegacyTest.java'
                include 'io/github/dailystruggle/rtp/bukkitplatform/world/BukkitRegionPathsTest.java'
            }
        }
    }
}

dependencies {
    api project(':server-api')
    if (hasRtpCore) {
        api project(':rtp-api')
        api project(':rtp-core')
    }
    if (findProject(':anvil-api') != null) {
        api project(':anvil-api')
    }
    if (findProject(':schematics-api') != null) {
        api project(':schematics-api')
    }
    if (findProject(':metrics-api') != null) {
        compileOnly project(':metrics-api')
        testImplementation project(':metrics-api')
    }
    compileOnly 'org.spigotmc:spigot-api:1.20.1-R0.1-SNAPSHOT'
    compileOnly 'org.jetbrains:annotations:24.1.0'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    // MiniMessage support: parse <tag>-style markup into an Adventure Component,
    // then bridge it into the existing bungee BaseComponent[] send path via the
    // Gson chat-component serializer. These are provided at runtime by Paper/
    // Folia (compileOnly here); on a pure Spigot server they are absent and the
    // SendMessage MiniMessage path transparently falls back to legacy color codes.
    compileOnly 'net.kyori:adventure-api:4.17.0'
    compileOnly 'net.kyori:adventure-text-minimessage:4.17.0'
    compileOnly 'net.kyori:adventure-text-serializer-gson:4.17.0'
    api project(':commands-api')
    api project(':effects-api')
    if (hasRtpCore) {
        testImplementation testFixtures(project(':rtp-core'))
    }
    testImplementation 'com.github.seeseemelk:MockBukkit-v1.20:3.93.2'
    // Adventure is compileOnly above (provided by Paper/Folia at runtime); the
    // MiniMessageRenderer tests need it on the test classpath to exercise the
    // legacy->MiniMessage segmentation and a real deserialize round-trip.
    testImplementation 'net.kyori:adventure-api:4.17.0'
    testImplementation 'net.kyori:adventure-text-minimessage:4.17.0'
    testImplementation 'net.kyori:adventure-text-serializer-gson:4.17.0'
    // ArchUnit - bytecode-level architecture rule enforcement. Hosts the three
    // boundary rules that lock the Spigot-exclusive Anvil read-only pre-filter
    // package in place (see ADR-016 / ADR-016 section 6).
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testImplementation 'com.mojang:brigadier:1.2.9'
    testImplementation rootProject.libs.jazzer.junit
}
