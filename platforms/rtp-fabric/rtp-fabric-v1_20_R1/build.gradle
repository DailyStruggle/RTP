// rtp-fabric-ADR-001 -- Fabric multiversion v1_20_R1 submodule.
//
// Pinned to MC 1.20.1, mojmap. Built on the Java 21 toolchain but emits
// Java 17 bytecode (`release = 17`, root build.gradle) because 1.20.1
// servers run on Java 17 (ADR-113).
//
// This module supplies the runtime mod jar for MC 1.20.x servers; common
// (rtp-fabric-common) carries no MC classes itself (modCompileOnly).
plugins {
    // Version pinned in settings.gradle pluginManagement.plugins {}.
    id 'fabric-loom'
}

ext {
    minecraftVersion       = '1.20.1'
    loaderVersion          = '0.16.5'
    fabricApiVersion       = '0.92.5+1.20.1'
    permissionsApiVersion  = '0.3.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings  loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"

    modCompileOnly "me.lucko:fabric-permissions-api:${permissionsApiVersion}"

    // Compile against the platform-neutral abstractions and the
    // version-agnostic Fabric glue that defines FabricVersionAdapter.
    api project(':rtp-api')
    api project(':rtp-core')
    api project(':commands-api')
    api project(':rtp-fabric:rtp-fabric-common')
    // See V1_20_R1FabricEffectDispatchers -- Loom-compiled effect dispatchers.
    compileOnly project(':effects-api')
}
