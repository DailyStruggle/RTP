plugins {
    id 'java-library'
}

dependencies {
    implementation project(':rtp-paper:rtp-paper-common')
    compileOnly 'io.papermc.paper:paper-api:1.21.3-R0.1-SNAPSHOT'
    testImplementation 'io.papermc.paper:paper-api:1.21.3-R0.1-SNAPSHOT'
    testImplementation testFixtures(project(':rtp-core'))
    testImplementation 'com.github.seeseemelk:MockBukkit-v1.21:3.111.0'
}

test {
    useJUnitPlatform()
}
