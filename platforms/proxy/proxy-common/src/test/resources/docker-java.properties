# Docker-gated Redis integration tier (ENTERPRISE_READINESS.md item 17): the
# transport/redis container tests reach the local Docker daemon through
# docker-java, bundled by Testcontainers 1.21.3. That docker-java falls back to
# Docker Engine API version 1.32 when it cannot negotiate a higher one, and
# modern daemons (Docker Engine 29+, minimum API 1.40) reject every 1.32 request
# with HTTP 400 -- so all client-provider strategies fail and the whole tier
# silently skips even when Docker is running.
#
# docker-java reads this `docker-java.properties` from the (test) classpath and
# honours `api.version`, unlike the DOCKER_API_VERSION *environment* variable
# (which docker-java does not map into its client config). Pinning a version
# inside the daemon's supported window [1.40, current] lets the container tests
# connect on modern Docker. Refs: testcontainers/testcontainers-java#11212
# (fixed at the root in Testcontainers 2.x, which negotiates the version).
api.version=1.44
