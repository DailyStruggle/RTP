plugins {
    id 'java-library'
}
dependencies {
    api project(':rtp-api')
    api project(':rtp-core')
    api project(':anvil-api')
    compileOnly 'org.spigotmc:spigot-api:1.20.1-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    // MiniMessage support: parse <tag>-style markup into an Adventure Component,
    // then bridge it into the existing bungee BaseComponent[] send path via the
    // Gson chat-component serializer. These are provided at runtime by Paper/
    // Folia (compileOnly here); on a pure Spigot server they are absent and the
    // SendMessage MiniMessage path transparently falls back to legacy color codes.
    compileOnly 'net.kyori:adventure-api:4.17.0'
    compileOnly 'net.kyori:adventure-text-minimessage:4.17.0'
    compileOnly 'net.kyori:adventure-text-serializer-gson:4.17.0'
    implementation 'xyz.tozymc.spigot:title-api:1.0'
    implementation project(':commands-api')
    testImplementation testFixtures(project(':rtp-core'))
    testImplementation 'com.github.seeseemelk:MockBukkit-v1.20:3.93.2'
    // Adventure is compileOnly above (provided by Paper/Folia at runtime); the
    // MiniMessageRenderer tests need it on the test classpath to exercise the
    // legacy->MiniMessage segmentation and a real deserialize round-trip.
    testImplementation 'net.kyori:adventure-api:4.17.0'
    testImplementation 'net.kyori:adventure-text-minimessage:4.17.0'
    testImplementation 'net.kyori:adventure-text-serializer-gson:4.17.0'
    // ArchUnit â€” bytecode-level architecture rule enforcement. Hosts the three
    // boundary rules that lock the Spigot-exclusive Anvil read-only pre-filter
    // package in place (see ADR-016 / ADR-016 Â§6).
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}
