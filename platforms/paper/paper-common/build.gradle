plugins {
    id 'java-library'
}

version = '1.0.0'

def hasRtpCore = findProject(':rtp-api') != null && findProject(':rtp-core') != null

if (!hasRtpCore) {
    sourceSets {
        main {
            java {
                include 'io/github/dailystruggle/rtp/paper/storage/**'
            }
            resources {
                exclude 'META-INF/services/io.github.dailystruggle.rtp.**'
            }
        }
        test {
            java {
                include 'io/github/dailystruggle/rtp/paper/storage/**'
            }
        }
    }
}

dependencies {
    api project(':bukkit:bukkit-common')
    compileOnly 'io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    if (hasRtpCore) {
        testImplementation testFixtures(project(':rtp-core'))
    } else {
        testImplementation rootProject.libs.mockito.core
    }
    testImplementation 'com.github.seeseemelk:MockBukkit-v1.20:3.93.2'
}
