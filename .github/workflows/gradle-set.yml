name: Gradle project-set build

# Called by gradle.yml once per project set (core, proxy, bukkit, fabric,
# neoforge, helpers, addons, plugin). Runs the set's Gradle tasks from
# scripts/ci-scope.py with the coverage and static-analysis gates, and hands
# the JaCoCo / PMD XML and compiled classes to the `analysis` job as
# `reports-<set>`, so SonarCloud does not recompile what this job built.
on:
  workflow_call:
    inputs:
      set:
        description: Project set name; used in check and artifact names.
        required: true
        type: string
      tasks:
        description: Space-separated Gradle tasks.
        required: true
        type: string
      artifact-name:
        description: Optional artifact to upload from artifact-path.
        required: false
        type: string
        default: ''
      artifact-path:
        description: Newline-separated paths for artifact-name.
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Both toolchains: the 26.x Fabric/NeoForge carriers (and the GUI renderers
      # and effects-api unobf module built against them) pin Java 25.
      - name: Set up JDK 21 and 25
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: |
            21
            25
          distribution: 'temurin'

      # PR runs write the cache too (the default is read-only off the default
      # branch), so a later push to the same PR reuses task outputs. Every set
      # runs as job `build` of this workflow; the per-set key keeps one set's
      # Gradle home from being restored into, or blocking the save of, another.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
        env:
          GRADLE_BUILD_ACTION_CACHE_KEY_JOB: gradle-set-${{ inputs.set }}
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        env:
          TASKS: ${{ inputs.tasks }}
        run: |
          if [ -z "$TASKS" ]; then
            echo "No tasks for this set."
            exit 0
          fi
          echo "Running: $TASKS"
          # Word splitting of $TASKS is intended: one Gradle task per word.
          ./gradlew $TASKS -Pcoverage -PstaticAnalysis

      - name: Publish test results
        uses: mikepenz/action-junit-report@db71d41eb79864e25ab0337e395c352e84523afe # v4.3.1
        if: always()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          check_name: 'Test Results (${{ inputs.set }})'

      # A tarball keeps repo-relative paths; upload-artifact would strip the
      # common prefix when only one module produced reports.
      - name: Pack reports and classes
        env:
          SET: ${{ inputs.set }}
        run: |
          { find . -path ./.git -prune -o \( -path '*/build/reports/jacoco/test/jacocoTestReport.xml' \
              -o -path '*/build/reports/pmd/*.xml' \) -type f -print
            find . -path ./.git -prune -o -path '*/build/classes' -type d -print
          } > report-files.txt
          echo "$(wc -l < report-files.txt) report file(s) / class dir(s)"
          tar -czf "reports-$SET.tgz" -T report-files.txt

      - name: Upload reports and classes
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: reports-${{ inputs.set }}
          path: reports-${{ inputs.set }}.tgz
          retention-days: 3

      - name: Upload coverage report
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: jacoco-coverage-${{ inputs.set }}
          path: '**/build/reports/jacoco/'
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload artifacts
        if: inputs.artifact-name != ''
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
