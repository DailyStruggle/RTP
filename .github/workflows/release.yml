name: Release rtp-lite to Modrinth

# Publishes the lite assembly variant (ADR-024) to the Modrinth project
# `rtp-lite` (https://modrinth.com/project/rtp-lite) on every tag matching
# `v*` (e.g. `v1.0.0`, `v1.0.1-beta.1`).
#
# Release notes are taken from CHANGELOG.md (the section matching the tag's
# version string), with any bullet tagged `**(Pro)**` stripped out so the
# lite notes only describe features that actually ship in rtp-lite. See
# AGENTS.md `CHANGELOG Hygiene` for the net-delta-from-last-released-tag rule
# that keeps each section honest, and the `Pro-exclusive tagging rule` at the
# top of CHANGELOG.md for the marker contract.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0). Must already exist.'
        required: true
        type: string

jobs:
  release:
    if: false # Temporarily disabled for SonarQube runs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # workflow_dispatch path: check out the requested tag explicitly.
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 1

      - name: Derive version from tag
        id: version
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Strip the `v` prefix (e.g. `v1.0.0` -> `1.0.0`).
          VERSION="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing lite version: ${VERSION} (from tag ${RAW_TAG})"

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Per AGENTS.md `Final Full Build`: prefer the full multi-module build
      # over a scoped `:rtp-plugin:remapLiteJar` so cross-module compile breaks
      # and downstream test regressions are caught before publication. The
      # lite jar is the artifact we ship; everything else is verification.
      # Also generate CycloneDX SBOM, release checksums, and sign deliverables (ENTERPRISE_READINESS.md items 37, 39, 40).
      - name: Build (full multi-module + lite jar + SBOM + checksums + signing)
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew build :rtp-plugin:remapLiteJar :rtp-plugin:cyclonedxBom :rtp-plugin:generateChecksums :rtp-plugin:signDeliverables

      - name: Locate lite jar and release deliverables
        id: artifact
        run: |
          # ADR-024: the lite artifact is the unclassified `LeafRTP-<version>.jar`
          # produced by `remapLiteJar` in rtp-plugin/build/libs/. The
          # classified `*-dev.jar` is the pre-remap intermediate and is NOT
          # the release artifact.
          LITE_JAR=$(find rtp-plugin/build/libs -maxdepth 1 -type f -name 'LeafRTP-*.jar' \
            ! -name 'LeafRTP-Pro-*' ! -name '*-dev.jar' ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' | head -n 1)
          if [ -z "$LITE_JAR" ]; then
            echo "::error::Could not locate the lite jar under rtp-plugin/build/libs/"
            ls -la rtp-plugin/build/libs/ || true
            exit 1
          fi
          echo "lite_jar=${LITE_JAR}" >> "$GITHUB_OUTPUT"
          echo "Found lite jar: ${LITE_JAR}"

          # Locate SBOM (Item 37)
          SBOM_FILE=$(find rtp-plugin/build/reports -maxdepth 2 -type f -name 'bom.json' | head -n 1)
          if [ -n "$SBOM_FILE" ]; then
            echo "sbom_file=${SBOM_FILE}" >> "$GITHUB_OUTPUT"
            echo "Found SBOM: ${SBOM_FILE}"
          fi

          # Locate PGP signature (Item 39)
          if [ -f "${LITE_JAR}.asc" ]; then
            echo "lite_asc=${LITE_JAR}.asc" >> "$GITHUB_OUTPUT"
            echo "Found PGP signature: ${LITE_JAR}.asc"
          else
            echo "No PGP signature found (signing credentials may not have been provided)."
          fi

      - name: Retrieve acceptance evidence log
        id: evidence
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            try {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'devstack-acceptance.yml',
                status: 'success',
                per_page: 5
              });
              if (runs.data.workflow_runs.length > 0) {
                const latestRun = runs.data.workflow_runs[0];
                console.log(`Fetching acceptance artifacts from successful run ${latestRun.id} (${latestRun.head_sha})`);
                const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: latestRun.id
                });
                const match = artifacts.data.artifacts.find(a => a.name.includes('acceptance') || a.name.includes('devstack'));
                if (match) {
                  const download = await github.rest.actions.downloadArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: match.id,
                    archive_format: 'zip'
                  });
                  fs.writeFileSync('acceptance-evidence.zip', Buffer.from(download.data));
                  console.log(`Downloaded acceptance evidence artifact ${match.name} to acceptance-evidence.zip`);
                  core.setOutput('evidence_file', 'acceptance-evidence.zip');
                } else {
                  console.log('No matching acceptance artifact found in run.');
                }
              } else {
                console.log('No successful devstack-acceptance runs found.');
              }
            } catch (err) {
              console.log(`Could not fetch acceptance evidence: ${err.message}`);
            }

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract the section for this version from the shared CHANGELOG.md.
          # Heading shape:
          #   ## [1.0.0] - YYYY-MM-DD
          # or
          #   ## [1.0.0-beta.1] - Unreleased
          # Stop at the next `## [` heading. Bullets tagged `**(Pro)**` (and
          # their wrapped continuation lines) are dropped so the lite notes
          # only describe features that ship in rtp-lite -- see the
          # `Pro-exclusive tagging rule` at the top of CHANGELOG.md.
          if [ ! -f CHANGELOG.md ]; then
            echo "::warning::CHANGELOG.md not found; falling back to generic release notes."
            echo "rtp-lite ${VERSION}" > release-notes.md
          else
            awk -v ver="$VERSION" '
              BEGIN { capture = 0; skip = 0 }
              /^## \[/ {
                if (capture) { exit }
                if (index($0, "[" ver "]") > 0) { capture = 1; next }
              }
              capture != 1 { next }
              # A new bullet resets the skip state; drop it if Pro-tagged.
              /^[ \t]*[-*] / {
                if (index($0, "**(Pro)**") > 0) { skip = 1; next }
                skip = 0
                print
                next
              }
              # Section headings always print and clear any active skip.
              /^### / { skip = 0; print; next }
              # Continuation / blank lines: suppressed only while skipping a
              # Pro-tagged bullet.
              skip == 1 { next }
              { print }
            ' CHANGELOG.md > release-notes.md
            if [ ! -s release-notes.md ]; then
              echo "::warning::No CHANGELOG.md section matched [${VERSION}]; using a placeholder."
              echo "rtp-lite ${VERSION}" > release-notes.md
            fi
          fi
          echo "--- release-notes.md ---"
          cat release-notes.md
          echo "--- end ---"

      - name: Generate SLSA Build Provenance (Item 42)
        uses: actions/attest-build-provenance@c074443f1a5cf70e7c5b0c9146f82725e2e8f5fb # v2.2.3
        with:
          subject-path: ${{ steps.artifact.outputs.lite_jar }}

      - name: Publish GitHub Release (Items 37, 39, 42)
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d190 # v2.0.8
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: rtp-lite ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') }}
          files: |
            ${{ steps.artifact.outputs.lite_jar }}
            ${{ steps.artifact.outputs.lite_jar }}.sha256
            ${{ steps.artifact.outputs.lite_jar }}.sha512
            ${{ steps.artifact.outputs.lite_asc }}
            ${{ steps.evidence.outputs.evidence_file }}
            rtp-plugin/build/reports/bom.json

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@086e3926861ca1252119e0b1f2010874e4c2780e # v3.3
        with:
          modrinth-id: rtp-lite
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.artifact.outputs.lite_jar }}
          name: rtp-lite ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          # Mark beta/alpha versions correctly so they do not surface as
          # "latest stable" in admin filters.
          version-type: ${{ contains(steps.version.outputs.version, 'beta') && 'beta' || contains(steps.version.outputs.version, 'alpha') && 'alpha' || 'release' }}
          changelog-file: release-notes.md
          loaders: |
            paper
            folia
            bukkit
            spigot
          # MC versions derived from the rtp-bukkit-v* / rtp-paper-v* submodule
          # set. Basic Folia support is included in lite per ADR-024 2026-06-10 amendment.
          # Fabric is held until rtp-fabric Phase 4 closes
          # (MULTI_PLATFORM_PLAN.md). Update this list when a new MC adapter
          # submodule lands under rtp-bukkit/ or rtp-paper/.
          game-versions: |
            1.20
            1.20.1
            1.20.2
            1.20.3
            1.20.4
            1.20.5
            1.20.6
            1.21
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
          # Fail loudly if Modrinth rejects (e.g. version collision, slug typo,
          # token scope). A silent skip would leave the tag without an
          # artifact on Modrinth and contradict S-004 (no silently swallowed
          # failures).
          fail-mode: fail
