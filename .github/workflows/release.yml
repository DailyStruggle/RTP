name: Release rtp-lite to Modrinth, Hangar and GitHub Releases (markdown sites)

# Owns the Git / markdown-listing side of a single release: creates and pushes
# the `v<version>` tag, publishes to Modrinth and Hangar (project body +
# version), and creates the public GitHub Release. It triggers on the same
# PR-merge (or workflow_dispatch) event as release-bbb.yml, so the two
# workflows run independently and each site is published exactly once with no
# cross-workflow coupling:
#   - release-bbb.yml: BuiltByBit (Pro + Lite BBCode pages), Spigot.
#   - release.yml (this file): the `v<version>` tag + Modrinth + Hangar (markdown) + GitHub Releases.
#
# Publishes the lite assembly variant (ADR-024, Lite only) to the Modrinth
# project `rtp-lite` (https://modrinth.com/project/rtp-lite) and the Hangar
# project `leaf26/LeafRTP` (https://hangar.papermc.io/leaf26/LeafRTP). Pro is
# never published to nor advertised on Hangar.
#
# Release notes are taken from CHANGELOG.md (the section matching the tag's
# version string), with any bullet tagged `**(Pro)**` stripped out so the
# lite notes only describe features that actually ship in rtp-lite. See
# AGENTS.md `CHANGELOG Hygiene` for the net-delta-from-last-released-tag rule
# that keeps each section honest, and the `Pro-exclusive tagging rule` at the
# top of CHANGELOG.md for the marker contract.

on:
  pull_request:
    types: [closed]
    branches:
      - V3
      - V2
      - V1
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string to release (e.g. 3.2.3). If omitted, read from gradle.properties.'
        required: false
        type: string

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       (startsWith(github.head_ref, 'v') || startsWith(github.head_ref, 'V')) &&
       contains(github.head_ref, '.'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # This workflow owns the tag: derive the version from the merged version
      # branch name (v3.2.3 -> 3.2.3) or the workflow_dispatch input, falling
      # back to gradle.properties. The tag is created later, after the build.
      - name: Determine release version
        id: version
        env:
          HEAD_REF: ${{ github.head_ref }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$HEAD_REF" =~ ^[vV]([0-9]+\.[0-9]+.*)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION=$(grep -E '^version=' gradle.properties | cut -d '=' -f 2 | tr -d '[:space:]')
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine release version."
            exit 1
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing lite version: ${VERSION} (tag v${VERSION})"

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Per AGENTS.md `Final Full Build`: prefer the full multi-module build
      # over a scoped `:rtp-plugin:remapLiteJar` so cross-module compile breaks
      # and downstream test regressions are caught before publication. The
      # lite jar is the artifact we ship; everything else is verification.
      # Also generate CycloneDX SBOM, release checksums, and sign deliverables (ENTERPRISE_READINESS.md items 37, 39, 40).
      - name: Build (full multi-module + lite jar + SBOM + checksums + signing)
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew build :rtp-plugin:remapLiteJar :rtp-plugin:cyclonedxBom :rtp-plugin:generateChecksums :rtp-plugin:signDeliverables

      - name: Locate lite jar and release deliverables
        id: artifact
        run: |
          # ADR-024: the lite artifact is the unclassified `LeafRTP-<version>.jar`
          # produced by `remapLiteJar` in rtp-plugin/build/libs/. The
          # classified `*-dev.jar` is the pre-remap intermediate and is NOT
          # the release artifact.
          LITE_JAR=$(find rtp-plugin/build/libs -maxdepth 1 -type f -name 'LeafRTP-*.jar' \
            ! -name 'LeafRTP-Pro-*' ! -name '*-dev.jar' ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' | head -n 1)
          if [ -z "$LITE_JAR" ]; then
            echo "::error::Could not locate the lite jar under rtp-plugin/build/libs/"
            ls -la rtp-plugin/build/libs/ || true
            exit 1
          fi
          echo "lite_jar=${LITE_JAR}" >> "$GITHUB_OUTPUT"
          echo "Found lite jar: ${LITE_JAR}"

          # Locate SBOM (Item 37)
          SBOM_FILE=$(find rtp-plugin/build/reports -maxdepth 2 -type f -name 'bom.json' | head -n 1)
          if [ -n "$SBOM_FILE" ]; then
            echo "sbom_file=${SBOM_FILE}" >> "$GITHUB_OUTPUT"
            echo "Found SBOM: ${SBOM_FILE}"
          fi

          # Locate PGP signature (Item 39)
          if [ -f "${LITE_JAR}.asc" ]; then
            echo "lite_asc=${LITE_JAR}.asc" >> "$GITHUB_OUTPUT"
            echo "Found PGP signature: ${LITE_JAR}.asc"
          else
            echo "No PGP signature found (signing credentials may not have been provided)."
          fi

      - name: Retrieve acceptance evidence log
        id: evidence
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            try {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'devstack-acceptance.yml',
                status: 'success',
                per_page: 5
              });
              if (runs.data.workflow_runs.length > 0) {
                const latestRun = runs.data.workflow_runs[0];
                console.log(`Fetching acceptance artifacts from successful run ${latestRun.id} (${latestRun.head_sha})`);
                const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: latestRun.id
                });
                const match = artifacts.data.artifacts.find(a => a.name.includes('acceptance') || a.name.includes('devstack'));
                if (match) {
                  const download = await github.rest.actions.downloadArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: match.id,
                    archive_format: 'zip'
                  });
                  fs.writeFileSync('acceptance-evidence.zip', Buffer.from(download.data));
                  console.log(`Downloaded acceptance evidence artifact ${match.name} to acceptance-evidence.zip`);
                  core.setOutput('evidence_file', 'acceptance-evidence.zip');
                } else {
                  console.log('No matching acceptance artifact found in run.');
                }
              } else {
                console.log('No successful devstack-acceptance runs found.');
              }
            } catch (err) {
              console.log(`Could not fetch acceptance evidence: ${err.message}`);
            }

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract the section for this version from the shared CHANGELOG.md.
          # Heading shape:
          #   ## [1.0.0] - YYYY-MM-DD
          # or
          #   ## [1.0.0-beta.1] - Unreleased
          # Stop at the next `## [` heading. Bullets tagged `**(Pro)**` (and
          # their wrapped continuation lines) are dropped so the lite notes
          # only describe features that ship in rtp-lite -- see the
          # `Pro-exclusive tagging rule` at the top of CHANGELOG.md.
          if [ ! -f CHANGELOG.md ]; then
            echo "::warning::CHANGELOG.md not found; falling back to generic release notes."
            echo "rtp-lite ${VERSION}" > release-notes.md
          else
            awk -v ver="$VERSION" '
              BEGIN { capture = 0; skip = 0 }
              /^## \[/ {
                if (capture) { exit }
                if (index($0, "[" ver "]") > 0) { capture = 1; next }
              }
              capture != 1 { next }
              # A new bullet resets the skip state; drop it if Pro-tagged.
              /^[ \t]*[-*] / {
                if (index($0, "**(Pro)**") > 0) { skip = 1; next }
                skip = 0
                print
                next
              }
              # Section headings always print and clear any active skip.
              /^### / { skip = 0; print; next }
              # Continuation / blank lines: suppressed only while skipping a
              # Pro-tagged bullet.
              skip == 1 { next }
              { print }
            ' CHANGELOG.md > release-notes.md
            if [ ! -s release-notes.md ]; then
              echo "::warning::No CHANGELOG.md section matched [${VERSION}]; using a placeholder."
              echo "rtp-lite ${VERSION}" > release-notes.md
            fi
          fi
          echo "--- release-notes.md ---"
          cat release-notes.md
          echo "--- end ---"

      - name: Generate SLSA Build Provenance (Item 42)
        uses: actions/attest-build-provenance@c074443f1a5cf70e7c5b0c9146f82725e2e8f5fb # v2.2.3
        with:
          subject-path: ${{ steps.artifact.outputs.lite_jar }}

      # Create and push the release tag now that the build has succeeded. This
      # workflow owns the tag (it is the one that needs it for the GitHub
      # Release below). release-bbb.yml does NOT tag.
      - name: Create and push Git tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists locally or remotely. Skipping tag creation."
          else
            echo "Creating and pushing tag ${TAG}..."
            git tag -a "$TAG" -m "Release ${TAG}"
            git push origin "$TAG"
          fi

      - name: Publish GitHub Release (Items 37, 39, 42)
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d190 # v2.0.8
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: rtp-lite ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') }}
          files: |
            ${{ steps.artifact.outputs.lite_jar }}
            ${{ steps.artifact.outputs.lite_jar }}.sha256
            ${{ steps.artifact.outputs.lite_jar }}.sha512
            ${{ steps.artifact.outputs.lite_asc }}
            ${{ steps.evidence.outputs.evidence_file }}
            rtp-plugin/build/reports/bom.json

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@086e3926861ca1252119e0b1f2010874e4c2780e # v3.3
        with:
          modrinth-id: rtp-lite
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.artifact.outputs.lite_jar }}
          name: rtp-lite ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          # Mark beta/alpha versions correctly so they do not surface as
          # "latest stable" in admin filters.
          version-type: ${{ contains(steps.version.outputs.version, 'beta') && 'beta' || contains(steps.version.outputs.version, 'alpha') && 'alpha' || 'release' }}
          changelog-file: release-notes.md
          loaders: |
            paper
            folia
            bukkit
            spigot
            fabric
            neoforge
            velocity
          # MC versions: 1.20+ for Bukkit/Paper/Spigot/Folia; lowest supported for Fabric and NeoForge is 1.21.1.
          # Testing up to 26.3.
          game-versions: |
            1.20
            1.20.1
            1.20.2
            1.20.3
            1.20.4
            1.20.5
            1.20.6
            1.21
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
            1.21.9
            1.21.10
            1.21.11
            26.1
            26.1.1
            26.1.2
            26.2
            26.3
          # Fail loudly if Modrinth rejects (e.g. version collision, slug typo,
          # token scope). A silent skip would leave the tag without an
          # artifact on Modrinth and contradict S-004 (no silently swallowed
          # failures).
          fail-mode: fail

      - name: Update Modrinth project description
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          python3 scripts/release/update_modrinth_description.py --project-id rtp-lite

      # Hangar (https://hangar.papermc.io/leaf26/LeafRTP) hosts the Lite variant
      # only; Pro is neither published nor advertised there. mc-publish supports
      # only CurseForge/Modrinth/GitHub, so Hangar is published directly against
      # its REST API via a stdlib script. The script targets the Paper platform
      # (covers Bukkit/Spigot/Paper/Folia) and filters the MC version list to
      # what Hangar recognizes. It fails closed on any API error (S-004).
      - name: Publish version to Hangar
        env:
          HANGAR_TOKEN: ${{ secrets.HANGAR_TOKEN }}
        run: |
          python3 scripts/release/publish_hangar_version.py \
            --project LeafRTP \
            --file "${{ steps.artifact.outputs.lite_jar }}" \
            --version "${{ steps.version.outputs.version }}" \
            --version-type "${{ contains(steps.version.outputs.version, 'beta') && 'beta' || contains(steps.version.outputs.version, 'alpha') && 'alpha' || 'release' }}" \
            --changelog-file release-notes.md

      - name: Update Hangar project description
        env:
          HANGAR_TOKEN: ${{ secrets.HANGAR_TOKEN }}
        run: |
          python3 scripts/release/update_hangar_description.py --project LeafRTP
