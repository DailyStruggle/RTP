name: Mutation Testing

on:
  workflow_dispatch:
  schedule:
    # Run weekly on Sunday at 03:00 UTC
    - cron: '0 3 * * 0'

permissions:
  contents: read

jobs:
  pitest:
    name: PIT (${{ matrix.package.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: worldborder
            target: "io.github.dailystruggle.rtp.common.selection.worldborder.*"
            threshold: 60
          - name: region-cache
            target: "io.github.dailystruggle.rtp.common.selection.region.cache.*"
            threshold: 60
          - name: teleport
            target: "io.github.dailystruggle.rtp.common.tasks.teleport.*"
            threshold: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      - name: Run PIT Mutation Testing
        run: |
          ./gradlew :rtp-core:pitest -Pmutation \
            -PmutationPackages="${{ matrix.package.target }}" \
            -PmutationThreshold=${{ matrix.package.threshold }} \
            --no-daemon

      - name: Archive PIT Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report-${{ matrix.package.name }}
          path: rtp-core/build/reports/pitest/
          if-no-files-found: ignore
