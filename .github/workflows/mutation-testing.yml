name: Mutation Testing

on:
  workflow_dispatch:
  schedule:
    # Run weekly on Sunday at 03:00 UTC
    - cron: '0 3 * * 0'

permissions:
  contents: read

jobs:
  pitest:
    name: PIT (${{ matrix.package.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: worldborder
            target: "io.github.dailystruggle.rtp.common.selection.worldborder.*"
            threshold: 60
          - name: region
            target: "io.github.dailystruggle.rtp.common.selection.region.*"
            threshold: 60
          - name: teleport
            target: "io.github.dailystruggle.rtp.common.tasks.teleport.*"
            threshold: 60
          - name: tools
            target: "io.github.dailystruggle.rtp.common.tools.*"
            threshold: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Run PIT Mutation Testing
        env:
          MUTATION_PACKAGES: ${{ matrix.package.target }}
          MUTATION_THRESHOLD: ${{ matrix.package.threshold }}
        run: |
          ./gradlew :rtp-core:pitest -Pmutation \
            -PmutationPackages="$MUTATION_PACKAGES" \
            -PmutationThreshold="$MUTATION_THRESHOLD" \
            --no-daemon

      - name: Archive PIT Report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pitest-report-${{ matrix.package.name }}
          path: rtp-core/build/reports/pitest/
          if-no-files-found: ignore
