name: Java CI with Gradle

on:
  push:
    branches: [ V3, V2, V1, main ]
  pull_request:
    branches: [ V3, V2, V1, main ]
  workflow_dispatch:

jobs:
  # Reduced graph: the offline / JDK-21-only build variant. Exercises the
  # exclusion machinery (-PexcludeJdk25 / -PexcludeNeoforge) so that fallback
  # path cannot rot silently. Matches what a JDK-21-only host (JitPack, an
  # offline sandbox) actually builds.
  build-reduced-jdk21:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for scripts
        run: chmod +x gradlew check_traceability.sh

      - name: Check traceability
        run: ./check_traceability.sh

      - name: Check UTF-8 mojibake
        run: python3 scripts/check-mojibake.py

      - name: Check code style (Spotless)
        run: ./gradlew spotlessCheck -PexcludeJdk25 -PexcludeNeoforge

      - name: Verify public API binary compatibility
        run: ./gradlew checkBinaryCompatibility -PexcludeJdk25 -PexcludeNeoforge

      - name: Build and test (reduced graph)
        run: ./gradlew build -PexcludeJdk25 -PexcludeNeoforge

  # Full graph: the complete unified-jar build, including the JDK-25 deobf
  # 26.x Fabric/NeoForge carriers (which pin their own Java 25 toolchain) and
  # the shaded plugin jar. Both JDK 21 and 25 are provisioned; Gradle selects
  # the right toolchain per module.
  build-full:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history so scripts/diff-coverage.py can diff against the PR
          # base (or the previous commit on push) rather than a shallow tip.
          fetch-depth: 0

      - name: Set up JDK 21 and 25
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: |
            21
            25
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for scripts
        run: chmod +x gradlew check_traceability.sh

      - name: Check traceability
        run: ./check_traceability.sh

      - name: Check UTF-8 mojibake
        run: python3 scripts/check-mojibake.py

      - name: Check code style (Spotless)
        run: ./gradlew spotlessCheck

      - name: Verify public API binary compatibility
        run: ./gradlew checkBinaryCompatibility

      # -Pcoverage wires JaCoCo report + the jacocoTestCoverageVerification
      # floors into check; -PstaticAnalysis runs the opt-in PMD gate
      # (incl. PreferNonLockingExecution). Both were previously local-only.
      - name: Build and test (with coverage + static analysis gates)
        run: ./gradlew build shadowJar -Pcoverage -PstaticAnalysis

      # Changed-line coverage gate: fails when < 80% of instrumented changed
      # lines are covered, measured against the PR base (pull_request) or the
      # previous commit (push). Reads the JaCoCo XML produced above.
      - name: Changed-line coverage gate
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            BASELINE="origin/${{ github.base_ref }}"
          else
            BASELINE="${{ github.event.before }}"
            if [ -z "$BASELINE" ] || [ "$BASELINE" = "0000000000000000000000000000000000000000" ]; then
              BASELINE="HEAD~1"
            fi
          fi
          echo "Gating changed-line coverage against $BASELINE"
          python3 scripts/diff-coverage.py --baseline "$BASELINE" --min 0.80

      - name: Publish test results
        uses: mikepenz/action-junit-report@5fb8152be6ff4b7721867dd11ca72fce2b16869e # v4.3.1
        if: always()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          check_name: 'Test Results'

      - name: Upload coverage report
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: jacoco-coverage
          path: '**/build/reports/jacoco/'
          retention-days: 14

      - name: Upload artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: RTP-Artifacts
          path: |
            build/libs/
            addons/*/build/libs/
