name: Java CI with Gradle

on:
  push:
    branches: [ V3, V2, V1 ]
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '*.md'
      - 'mkdocs.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE*'
  pull_request:
    branches: [ V3, V2, V1 ]
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '*.md'
      - 'mkdocs.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build scope (scripts/ci-scope.py): `full` for anything touching core, APIs,
  # platforms, rtp-plugin or build/CI config; `leaf` when every change is inside
  # addons/<Name>/ or helpers/<Name>/; `none` when nothing buildable changed.
  # Pull requests are scoped against their base. Pushes to V1/V2/V3 (merges) and
  # workflow_dispatch always build in full, so the shaded rtp-plugin jar that
  # bundles the addons is rebuilt on every merge.
  # Per-set flags (core, bukkit, fabric, neoforge, proxy, plugin, addons,
  # helpers) apply the project(':...') dependency closure; `full` is true when
  # every set is affected. Skipped jobs report as passing.
  changes:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      tasks: ${{ steps.scope.outputs.tasks }}
      full: ${{ steps.scope.outputs.full }}
      core: ${{ steps.scope.outputs.core }}
      bukkit: ${{ steps.scope.outputs.bukkit }}
      fabric: ${{ steps.scope.outputs.fabric }}
      neoforge: ${{ steps.scope.outputs.neoforge }}
      proxy: ${{ steps.scope.outputs.proxy }}
      plugin: ${{ steps.scope.outputs.plugin }}
      addons: ${{ steps.scope.outputs.addons }}
      helpers: ${{ steps.scope.outputs.helpers }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 scripts/ci-scope.py --base "$PR_BASE_SHA" --head HEAD
          else
            python3 scripts/ci-scope.py --force-full
          fi

  # Reduced graph: the offline / JDK-21-only build variant. Exercises the
  # exclusion machinery (-PexcludeJdk25 / -PexcludeNeoforge) so that fallback
  # path cannot rot silently. Matches what a JDK-21-only host (JitPack, an
  # offline sandbox) actually builds. Full tests and pre-flight checks run in build-full.
  build-reduced-jdk21:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble reduced graph
        run: ./gradlew assemble -PexcludeJdk25 -PexcludeNeoforge

      # ADR-113 classfile gate. `assemble` skips `check`, so run it explicitly here. It inspects
      # bytecode only, so the JDK 21 host is sufficient and no JDK 17 install is needed.
      - name: Verify Java 17 bytecode (ADR-113)
        run: ./gradlew verifyJava17Bytecode -PexcludeJdk25 -PexcludeNeoforge

  # Full graph: the complete unified-jar build, including the JDK-25 deobf
  # 26.x Fabric/NeoForge carriers (which pin their own Java 25 toolchain) and
  # the shaded plugin jar. Both JDK 21 and 25 are provisioned; Gradle selects
  # the right toolchain per module.
  build-full:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history so scripts/diff-coverage.py can diff against the PR
          # base (or the previous commit on push) rather than a shallow tip.
          fetch-depth: 0

      - name: Set up JDK 21 and 25
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: |
            21
            25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Grant execute permission for scripts
        run: chmod +x gradlew scripts/check_traceability.sh

      - name: Check traceability
        run: ./scripts/check_traceability.sh

      - name: Check UTF-8 mojibake
        run: python3 scripts/check-mojibake.py

      - name: Validate front pages
        run: python3 scripts/release/build_front_pages.py --check

      - name: Check code style (Spotless)
        run: ./gradlew spotlessCheck

      - name: Verify public API binary compatibility
        run: ./gradlew checkBinaryCompatibility

      # -Pcoverage wires JaCoCo report + the jacocoTestCoverageVerification
      # floors into check; -PstaticAnalysis runs the opt-in PMD gate
      # (incl. PreferNonLockingExecution). Both were previously local-only.
      - name: Build and test (with coverage + static analysis gates)
        run: ./gradlew build shadowJar -Pcoverage -PstaticAnalysis

      # SonarCloud analysis (ADR-094): reuses compiled bytecode, JaCoCo XML, and
      # PMD reports already generated by build above, avoiding redundant compilation.
      - name: Run SonarQube Analysis
        if: env.SONAR_TOKEN != ''
        run: ./gradlew sonar -Pcoverage -PstaticAnalysis

      # Changed-line coverage gate: fails when < 80% of instrumented changed
      # lines are covered, measured against the PR base (pull_request) or the
      # previous commit (push). Reads the JaCoCo XML produced above.
      - name: Changed-line coverage gate
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            BASELINE="origin/$BASE_REF"
          else
            BASELINE="$BEFORE_SHA"
            if [ -z "$BASELINE" ] || [ "$BASELINE" = "0000000000000000000000000000000000000000" ]; then
              BASELINE="HEAD~1"
            fi
          fi
          echo "Gating changed-line coverage against $BASELINE"
          python3 scripts/diff-coverage.py --baseline "$BASELINE" --min 0.80

      - name: Publish test results
        uses: mikepenz/action-junit-report@db71d41eb79864e25ab0337e395c352e84523afe # v4.3.1
        if: always()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          check_name: 'Test Results'

      - name: Upload coverage report
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: jacoco-coverage
          path: '**/build/reports/jacoco/'
          retention-days: 14

      - name: Upload artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: RTP-Artifacts
          path: |
            build/libs/
            addons/*/build/libs/

  # Addon/helper-only change set: builds and tests just the touched leaf
  # projects (their core dependencies compile, but core tests do not run unless
  # a core test reads the touched leaf's files). Coverage, Sonar and japicmp are
  # skipped: addons/helpers are excluded from coverage and carry no public API.
  build-leaf:
    needs: changes
    if: needs.changes.outputs.scope == 'leaf'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # JDK 25 for the MC 26.x GUI renderer carriers (rtp-gui-fabric / -neoforge).
      - name: Set up JDK 21 and 25
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: |
            21
            25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      - name: Grant execute permission for scripts
        run: chmod +x gradlew scripts/check_traceability.sh

      - name: Check traceability
        run: ./scripts/check_traceability.sh

      - name: Check UTF-8 mojibake
        run: python3 scripts/check-mojibake.py

      - name: Check code style (Spotless)
        run: ./gradlew spotlessCheck

      - name: Build and test touched addons/helpers
        env:
          TASKS: ${{ needs.changes.outputs.tasks }}
        run: |
          echo "Running: $TASKS"
          ./gradlew $TASKS -PstaticAnalysis

      - name: Publish test results
        uses: mikepenz/action-junit-report@db71d41eb79864e25ab0337e395c352e84523afe # v4.3.1
        if: always()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          check_name: 'Test Results (addons/helpers)'

      - name: Upload artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: RTP-Addon-Artifacts
          path: |
            addons/*/build/libs/
            addons/*/*/build/libs/
            helpers/*/build/libs/
