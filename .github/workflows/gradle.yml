name: Java CI with Gradle

on:
  push:
    branches: [ V3, V2, V1, main ]
  pull_request:
    branches: [ V3, V2, V1, main ]
  workflow_dispatch:

jobs:
  # Reduced graph: the offline / JDK-21-only build variant. Exercises the
  # exclusion machinery (-PexcludeJdk25 / -PexcludeNeoforge) so that fallback
  # path cannot rot silently. Matches what a JDK-21-only host (JitPack, an
  # offline sandbox) actually builds.
  build-reduced-jdk21:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for scripts
        run: chmod +x gradlew check_traceability.sh

      - name: Check traceability
        run: ./check_traceability.sh

      - name: Check code style (Spotless)
        run: ./gradlew spotlessCheck -PexcludeJdk25 -PexcludeNeoforge

      - name: Build and test (reduced graph)
        run: ./gradlew build -PexcludeJdk25 -PexcludeNeoforge

  # Full graph: the complete unified-jar build, including the JDK-25 deobf
  # 26.x Fabric/NeoForge carriers (which pin their own Java 25 toolchain) and
  # the shaded plugin jar. Both JDK 21 and 25 are provisioned; Gradle selects
  # the right toolchain per module.
  build-full:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 and 25
        uses: actions/setup-java@v5
        with:
          java-version: |
            21
            25
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for scripts
        run: chmod +x gradlew check_traceability.sh

      - name: Check traceability
        run: ./check_traceability.sh

      - name: Check code style (Spotless)
        run: ./gradlew spotlessCheck

      - name: Build and test
        run: ./gradlew build shadowJar

      - name: Publish test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          check_name: 'Test Results'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage
          path: '**/build/reports/jacoco/'
          retention-days: 14

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RTP-Artifacts
          path: |
            build/libs/
            addons/*/build/libs/
