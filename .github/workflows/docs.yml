name: Publish docs site

# Builds the MkDocs Material site and publishes it to the gh-pages branch.
# The first successful run creates gh-pages; enable GitHub Pages
# (Settings -> Pages -> Deploy from branch -> gh-pages) once to go live.

on:
  push:
    branches: [ V3, main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# gh-deploy pushes to the gh-pages branch, so the token needs write access.
permissions:
  contents: write

# Never let two doc deploys race to push gh-pages at once.
concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gh-deploy can update the gh-pages branch.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install docs toolchain
        run: pip install -r docs/requirements.txt

      - name: Build and deploy to gh-pages
        run: mkdocs gh-deploy --force --clean
