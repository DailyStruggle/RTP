name: Devstack Acceptance (Nightly)

on:
  schedule:
    # Run nightly at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Acceptance scenario to run (all, boot, heartbeat, killswitch, roundtrip, rtptest)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - boot
          - heartbeat
          - killswitch
          - roundtrip
          - rtptest
      wait_seconds:
        description: 'Wait timeout seconds for heartbeat / boot convergence'
        required: false
        default: '240'
        type: string

permissions:
  contents: read

jobs:
  acceptance-smoke:
    name: Devstack Acceptance Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21 and 25
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: |
            21
            25
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Grant execute permissions
        run: |
          chmod +x gradlew
          chmod +x devstack/*.sh

      - name: Pre-build devstack plugin jar
        run: |
          ./gradlew :rtp-plugin:remapJar --console=plain

      - name: Install bot dependencies (for roundtrip scenario)
        working-directory: devstack/clients
        run: |
          npm ci --ignore-scripts

      - name: Run devstack acceptance harness
        id: acceptance
        env:
          WAIT_SECONDS: ${{ github.event.inputs.wait_seconds || '240' }}
          SCENARIO: ${{ github.event.inputs.scenario || 'all' }}
        run: |
          cd devstack
          ./run-acceptance.sh --scenario "$SCENARIO" --wait-seconds "$WAIT_SECONDS"

      - name: Archive acceptance evidence & logs
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: devstack-acceptance-evidence
          path: |
            devstack/logs/**/acceptance-evidence.log
            devstack/logs/**/*.log
          retention-days: 30

      - name: Cleanup devstack containers
        if: always()
        run: |
          cd devstack
          ./run-acceptance.sh --scenario down --purge || true
