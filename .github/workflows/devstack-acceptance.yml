name: Devstack Acceptance (Nightly)

on:
  schedule:
    # Run nightly at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Acceptance scenario to run (all, boot, heartbeat, killswitch, roundtrip)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - boot
          - heartbeat
          - killswitch
          - roundtrip
      wait_seconds:
        description: 'Wait timeout seconds for heartbeat / boot convergence'
        required: false
        default: '240'
        type: string

permissions:
  contents: read

jobs:
  acceptance-smoke:
    name: Devstack Acceptance Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 and 25
        uses: actions/setup-java@v5
        with:
          java-version: |
            21
            25
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Grant execute permissions
        run: |
          chmod +x gradlew
          chmod +x devstack/*.sh

      - name: Pre-build devstack plugin & proxy jars
        run: |
          ./gradlew :rtp-proxy:rtp-proxy-velocity:jar :rtp-plugin:remapJar --console=plain

      - name: Install bot dependencies (for roundtrip scenario)
        working-directory: devstack/bot
        run: |
          npm ci || npm install

      - name: Run devstack acceptance harness
        id: acceptance
        env:
          WAIT_SECONDS: ${{ github.event.inputs.wait_seconds || '240' }}
          SCENARIO: ${{ github.event.inputs.scenario || 'all' }}
        run: |
          cd devstack
          ./run-acceptance.sh --scenario "$SCENARIO" --wait-seconds "$WAIT_SECONDS"

      - name: Archive acceptance evidence & logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devstack-acceptance-evidence
          path: |
            devstack/logs/**/acceptance-evidence.log
            devstack/logs/**/*.log
          retention-days: 30

      - name: Cleanup devstack containers
        if: always()
        run: |
          cd devstack
          ./run-acceptance.sh --scenario down --purge || true
