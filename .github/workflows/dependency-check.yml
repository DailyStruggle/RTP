name: OWASP Dependency Check

on:
  schedule:
    # Run weekly on Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:
  push:
    branches: [ V3 ]
    paths:
      - 'gradle/libs.versions.toml'
      - 'build.gradle'
      - '**/build.gradle'
  pull_request:
    branches: [ V3, V2, V1 ]
    paths:
      - 'gradle/libs.versions.toml'
      - 'build.gradle'
      - '**/build.gradle'
      - 'config/dependency-check-suppressions.xml'

permissions:
  contents: read

jobs:
  depcheck:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c # 1.1.0
        id: depcheck
        env:
          # actions/setup-java overrides JAVA_HOME on the runner, which leaks into the docker action.
          # Reset JAVA_HOME to the container image's internal JRE path.
          JAVA_HOME: /opt/jdk
        with:
          project: 'RTP'
          path: '.'
          format: 'ALL'
          # Gate on any non-trivial CVE (CVSS >= 4). Anything intentionally
          # accepted must carry a written justification in the suppression
          # file (auditors read suppressions). The step is no longer
          # continue-on-error, so an unsuppressed finding fails the build.
          args: >
            --suppression config/dependency-check-suppressions.xml
            --failOnCVSS 4
            --enableRetired

      - name: Archive Dependency-Check Reports
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        # Upload the report even when the gate fails so a failing CVE finding
        # is still inspectable from the run artifacts.
        if: always()
        with:
          name: dependency-check-report
          path: ${{ github.workspace }}/reports
          retention-days: 30
