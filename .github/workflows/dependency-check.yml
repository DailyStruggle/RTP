name: OWASP Dependency Check

on:
  schedule:
    # Run weekly on Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:
  push:
    branches: [ V3, main ]
    paths:
      - 'gradle/libs.versions.toml'
      - 'build.gradle'
      - '**/build.gradle'

permissions:
  contents: read

jobs:
  depcheck:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@d6ff68a7cc0cb016bfd69ab82ea541e21b72e505 # 2.5.4
        id: depcheck
        with:
          project: 'RTP'
          path: '.'
          format: 'ALL'
          args: >
            --suppression config/dependency-check-suppressions.xml
            --failOnCVSS 8
            --enableRetired
        continue-on-error: true

      - name: Archive Dependency-Check Reports
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dependency-check-report
          path: ${{ github.workspace }}/reports
          retention-days: 30
