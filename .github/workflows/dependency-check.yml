name: OWASP Dependency Check

# Paused: manual dispatch only. The shipped jars contain only in-repo classes
# (io/github/dailystruggle/**, including the bundled addon jars), so there is
# no third-party code for this scan to match; in-repo code is covered by
# SonarCloud and PMD. Restore the schedule / push / pull_request triggers if a
# third-party library is ever shaded or bundled.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  depcheck:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build plugin deliverables
        run: ./gradlew :rtp-plugin:assemble

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c # 1.1.0
        id: depcheck
        env:
          # actions/setup-java overrides JAVA_HOME on the runner, which leaks into the docker action.
          # Reset JAVA_HOME to the container image's internal JRE path.
          JAVA_HOME: /opt/jdk
        with:
          project: 'RTP'
          path: 'rtp-plugin/build/libs'
          format: 'ALL'
          # Gate on any non-trivial CVE (CVSS >= 4). Anything intentionally
          # accepted must carry a written justification in the suppression
          # file (auditors read suppressions). The step is no longer
          # continue-on-error, so an unsuppressed finding fails the build.
          args: >
            --suppression config/dependency-check-suppressions.xml
            --failOnCVSS 4
            --enableRetired

      - name: Archive Dependency-Check Reports
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        # Upload the report even when the gate fails so a failing CVE finding
        # is still inspectable from the run artifacts.
        if: always()
        with:
          name: dependency-check-report
          path: ${{ github.workspace }}/reports
          retention-days: 30
