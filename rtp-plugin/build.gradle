// Per ADR-022 §2 (Single-JAR Multi-Loader Packaging) this module is the
// multi-loader bootstrap: it ships both plugin.yml (Bukkit) and
// fabric.mod.json (Fabric) in one JAR. Loom remaps only the Fabric entry-
// point package; Bukkit-family classes retain Spigot/Paper-mapped bytecode.
//
// Loom is scoped here AND in :rtp-fabric:** only — never at root or in any
// platform-free / Bukkit-family module (ADR-022 §3, MULTI_PLATFORM_PLAN
// Phase 1).
plugins {
    id 'com.gradleup.shadow'
    // Version pinned in settings.gradle pluginManagement.plugins {}.
    id 'fabric-loom'
}
repositories {
    // Soft-dep repos for bundled claim-plugin integrations (see ADR-019).
    maven { url = 'https://maven.enginehub.org/repo/' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://repo.glaremasters.me/repository/bloodshot/' }
    maven { url = 'https://raw.githubusercontent.com/FabioZumbi12/RedProtect/mvn-repo/' }
    maven { url = 'https://repo.spongepowered.org/maven/' }
    maven { url = 'https://ci.ender.zone/plugin/repository/everything/' }
    maven { url = 'https://repo.dmulloy2.net/repository/public/' }
    // Soft-dep repos for the bundled PvP / combat-tag integrations (ADR-055).
    // CombatLogX API (SirBlobman public Nexus) and PvPManager API (CodeMC).
    maven { url = 'https://nexus.sirblobman.xyz/public/' }
    maven { url = 'https://repo.codemc.org/repository/maven-public/' }
}

// Bytecode-only configuration for the Java-25 v26_1_R1 adapter (2026-05-07).
// Standard `implementation` cannot accept it because Gradle's variant-aware
// resolution sees JVM-25 incompatibility against rtp-plugin's JDK-21
// compileClasspath. This configuration:
//   * has no transitive dependencies (we only want the v26_1_R1 jar itself);
//   * relaxes the TARGET_JVM_VERSION attribute so the JDK-25 variant resolves;
//   * is consumed only by shadowJar (never compileJava) -- RTPFabricMod
//     references the adapter by FQN string only.
configurations {
    fabric26Bytecode {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
        attributes {
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
        }
    }
    // EARLY/EXPERIMENTAL sibling of fabric26Bytecode for the MC 26.2
    // pre-release adapter (rtp-fabric-v26_2_R1). Same JDK-25 deobf regime
    // and same post-remap merge story; kept in its own configuration so the
    // merge closure's `singleFile` resolution stays unambiguous (one jar per
    // configuration). See rtp-fabric-ADR-014.
    fabric262Bytecode {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
        attributes {
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
        }
    }
    // Bytecode-only configuration for the JDK-25 / unobf-Loom-compiled
    // `rtp-fabric-common-unobf` carrier. Same variant-incompatibility
    // story as `fabric26Bytecode` above: the module's published variant
    // declares JVM-25 compatibility, so we cannot pull it onto
    // rtp-plugin's JDK-21 compileClasspath via plain `implementation
    // project(...)`. Instead, declare it here and merge it into the
    // released jar AFTER Loom's remapJar, so its Mojang-named
    // `net.minecraft.*` references survive intact (Loom would otherwise
    // rewrite them to intermediary `class_NNNN` and they'd fail to link
    // on the deobf MC 26.1.2 runtime). Required so that the v26_1_R1
    // adapter's `installEffectsWiring` path (which references
    // FabricEffectsHandlerUnobf and friends) does not throw
    // NoClassDefFoundError at SERVER_STARTED time. Effects-api wiring
    // would otherwise silently degrade — see effects-api-ADR-006 and
    // POTENTIAL_BUGS.md `2026-05-08 — Fabric effects-api wiring leaks
    // intermediary symbols on MC 26.1.2`.
    fabricCommonUnobfBytecode {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
        attributes {
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
        }
    }
    // Bytecode-only configuration for the effects-api fabric-unobf
    // carrier (effects-api/effects-api-fabric-unobf). Hosts
    // FabricEffectRuntimeUnobf and the Mojmap-named LocalEffects
    // implementations consumed transitively by FabricEffectsHandlerUnobf
    // on MC 26.1.2. Same JDK-25 / Loom-1.15-unobf variant story as
    // fabricCommonUnobfBytecode — must merge post-remap so its
    // `net.minecraft.*` references survive into the released jar.
    // Without this, the v26_1_R1 adapter's installEffectsWiring path
    // raises `NoClassDefFoundError:
    // io/github/dailystruggle/effectsapi/fabric_unobf/FabricEffectRuntimeUnobf`
    // at SERVER_STARTED time. See effects-api-ADR-006.
    effectsApiFabricUnobfBytecode {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
        attributes {
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
        }
    }
}

dependencies {
    // --- Loom-required Fabric / Minecraft baseline ---
    // Loom won't configure remapJar / runtime classpaths without these.
    // Versions mirror :rtp-fabric:rtp-fabric-common to avoid drift; if you
    // change one, change the other.
    //
    // IMPORTANT: use modCompileOnly (not modImplementation) for fabric-loader
    // and fabric-api. Both are provided by the Fabric runtime — fabric-loader
    // is the runtime itself, and fabric-api is declared as a hard `depends`
    // in fabric.mod.json so the user must install it as a separate mod in
    // mods/. Bundling them via modImplementation puts them on runtimeClasspath,
    // which Shadow then slurps into the released JAR (~5MB of nested mod jars
    // plus duplicate Loader bytecode). compileOnly keeps them on the compile
    // classpath only — Loom still drives remapJar correctly.
    //
    // The `minecraft` configuration cannot be compileOnly (Loom requires it),
    // so we instead subtract it from shadowJar's configurations below; that
    // strips MC server+client bytecode, fastutil, ICU4J, JNA, LWJGL, log4j,
    // Netty, Mojang datafixers, etc. — all of which the host server provides.
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings  loom.officialMojangMappings()
    modCompileOnly 'net.fabricmc:fabric-loader:0.16.5'
    modCompileOnly 'net.fabricmc.fabric-api:fabric-api:0.115.0+1.21.1'

    // The Fabric platform glue lives here. RTPFabricMod (in this module) is
    // the only class that resolves it on a Fabric runtime.
    implementation project(':rtp-fabric:rtp-fabric-common')

    // rtp-fabric-ADR-001 — version-specific Fabric adapters. RTPFabricMod.installVersionAdapter()
    // resolves these by FQN at runtime via Class.forName, so the bytecode must
    // be present in the shaded jar but is never compile-time imported here.
    // Mirrors the rtp-bukkit/-paper/-folia v-submodule inclusion pattern above.
    implementation project(':rtp-fabric:rtp-fabric-v1_20_R1')
    implementation project(':rtp-fabric:rtp-fabric-v1_21_R1')
    implementation project(':rtp-fabric:rtp-fabric-v1_21_R5')
    // :rtp-fabric:rtp-fabric-v1_21_R11 — re-enabled 2026-05-06 after rtp-fabric-ADR-007
    // (Mojmap-name-decoupling) landed and the R11 adapter was ported to the new
    // wrapper-based FabricVersionAdapter SPI. RTPFabricMod.adapterFqnFor now resolves
    // V1_21_R11FabricVersionAdapter on a 1.21.11+ runtime; on 1.21.5–1.21.10 the R5
    // adapter still wins. See settings.gradle and CHECKLIST-fabric-1.21.11-multiversion.md.
    implementation project(':rtp-fabric:rtp-fabric-v1_21_R11')
    // :rtp-fabric:rtp-fabric-v26_1_R1 — re-enabled 2026-05-07 after the
    // project-wide bump to fabric-loom 1.15-SNAPSHOT (settings.gradle
    // pluginManagement). With one Loom version across all subprojects
    // the LoomGradleExtension ClassCastException no longer fires, and
    // v26_1_R1 builds inline like the other Fabric submodules.
    //
    // Cannot use plain `implementation project(...)` here: v26_1_R1's
    // toolchain is JDK 25, so its published variant declares JVM-25
    // compatibility, and Gradle's variant-aware dependency resolution
    // refuses to mix it onto rtp-plugin's JDK-21 compileClasspath
    // ("Dependency resolution is looking for a library compatible with
    // JVM runtime version 21, but ... is only compatible with JVM
    // runtime version 25 or newer").
    //
    // RTPFabricMod#adapterFqnFor only references V26_1_R1FabricVersionAdapter
    // by FQN string (Class.forName), so we never need v26_1_R1 on the
    // compile classpath. Instead, declare a dedicated `fabric26Bytecode`
    // configuration that targets the Java-25 jar variant explicitly and
    // is consumed only by `shadowJar` (see configurations block below).
    fabric26Bytecode project(':rtp-fabric:rtp-fabric-v26_1_R1')

    // EARLY/EXPERIMENTAL MC 26.2 pre-release adapter. Resolved by FQN at
    // runtime (RTPFabricMod#adapterFqnFor), merged post-remap like v26_1_R1.
    // See rtp-fabric-ADR-014.
    fabric262Bytecode project(':rtp-fabric:rtp-fabric-v26_2_R1')

    // Sibling to fabric26Bytecode above. The unobf carrier hosts the
    // Mojang-named NM-typed surfaces (FabricEffectsHandlerUnobf, the
    // *Unobf world/chunk/player wrappers) consumed by the 26.1+
    // version adapters. Merged into the released jar post-remap via
    // the `mergeCommonUnobf` step below so Loom never rewrites its
    // `net.minecraft.*` references to intermediary names. See ADR-009
    // and effects-api-ADR-006.
    fabricCommonUnobfBytecode project(':rtp-fabric:rtp-fabric-common-unobf')

    // Sibling: the effects-api unobf carrier (FabricEffectRuntimeUnobf
    // and Mojmap-named LocalEffects). Consumed by FabricEffectsHandlerUnobf
    // on MC 26.1.2 via the v26_1_R1 adapter's installEffectsWiring path.
    // See effects-api-ADR-006 and POTENTIAL_BUGS.md 2026-05-08.
    effectsApiFabricUnobfBytecode project(':effects-api:effects-api-fabric-unobf')

    implementation project(':rtp-core')
    implementation project(':rtp-bukkit:rtp-bukkit-v1_20_R1')
    implementation project(':rtp-paper:rtp-paper-v1_20_R1')
    implementation project(':rtp-bukkit:rtp-bukkit-v1_21_R1')
    implementation project(':rtp-paper:rtp-paper-v1_21_R1')
    implementation project(':rtp-bukkit:rtp-bukkit-v26_1_R1')
    implementation project(':rtp-paper:rtp-paper-v26_1_R1')
    implementation project(':rtp-folia:rtp-folia-v26_1_R1')
    implementation project(':rtp-folia:rtp-folia-v1_21_R1')
    implementation project(':commands-api')
    implementation project(':effects-api')

    // Unified single-JAR per MULTI_SERVER_PLAN.md > Intended Usage & Deployment
    // Model: the same artifact loads on Bukkit/Paper/Folia (plugin.yml),
    // Fabric (fabric.mod.json), and Velocity (velocity-plugin.json). Velocity's
    // JavaPluginLoader.getSerializedPluginInfo returns on the first matching
    // descriptor entry, so co-existing plugin.yml is harmless. The Velocity API
    // stays compileOnly in :rtp-proxy:rtp-proxy-velocity and is provided by the
    // proxy host at runtime; on a Bukkit/Fabric runtime the Velocity entry-point
    // classes are simply never loaded.
    implementation project(':rtp-proxy:rtp-proxy-velocity')

    compileOnly 'org.spigotmc:spigot-api:1.20.1-R0.1-SNAPSHOT'
    // Test classpath: declare folia-api / paper-api (via MockBukkit) BEFORE
    // spigot-api so that javac resolves the `org.bukkit.Bukkit` class
    // containing Folia's scheduler statics (getGlobalRegionScheduler etc.).
    // spigot-api 1.20.1 ships its own Bukkit class without those methods;
    // when Loom is applied the classpath ordering shifts and spigot-api's
    // Bukkit can win, breaking MockFoliaScheduler. Order matters here.
    testImplementation 'dev.folia:folia-api:1.20.1-R0.1-SNAPSHOT'
    testImplementation 'com.github.seeseemelk:MockBukkit-v1.21:3.111.0'
    testImplementation 'org.spigotmc:spigot-api:1.20.1-R0.1-SNAPSHOT'
    testImplementation testFixtures(project(':rtp-core'))
    testImplementation project(':rtp-folia:rtp-folia-common')
    // C6 (CHECKLIST-metrics-and-multiserver §1.6.5) — ArchUnit guard pinning
    // raw TPS / player-count / max-players reads to the *MetricsBinding and
    // *TpsSampler classes. rtp-plugin is the only module that aggregates
    // every platform-common bytecode on its classpath, so the guard lives
    // here even though sibling guards live in :rtp-core's RTPArchitectureTest.
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'

    // Optional/Soft dependencies
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'org.popcraft:chunkyborder-common:1.0.70'
    compileOnly 'org.popcraft:chunky-common:1.2.217'

    // Bundled claim-plugin integrations (compile-only; runtime via Bukkit soft-depends).
    compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.9'
    compileOnly 'com.sk89q.worldedit:worldedit-bukkit:7.2.15'
    compileOnly 'com.github.TechFortress:GriefPrevention:16.18.1'
    compileOnly 'com.github.WiIIiam278:HuskTowns:1.6.2'
    compileOnly 'com.github.LlmDl:Towny:0.97.5.0'
    compileOnly 'com.massivecraft:Factions:1.6.9.5-U0.6.9'
    compileOnly 'com.griefdefender:api:2.1.0-SNAPSHOT'
    compileOnly 'com.github.angeschossen:LandsAPI:6.22.0'
    compileOnly 'br.net.fabiozumbi12.RedProtect:RedProtect-Core:7.7.3'
    compileOnly('br.net.fabiozumbi12.RedProtect:RedProtect-Spigot:7.7.3') {
        exclude group: 'com.destroystokyo.paper', module: 'paper-api'
        exclude group: 'com.sk89q.worldedit'
        exclude group: 'com.sk89q.worldguard'
        exclude group: 'de.keyle', module: 'mypet'
        exclude group: 'net.ess3', module: 'EssentialsX'
    }

    // Bundled PvP / combat-tag integrations (ADR-055; compile-only, runtime via Bukkit soft-depends).
    // Both plugins ship stable, published developer APIs, so the adapters compile against the
    // real interfaces rather than reflection -- this makes the package-private-impl bug class
    // (an IllegalAccessException at invoke() time, silently swallowed) impossible. SimpleCombatLog
    // has no published artifact and stays reflective in SimpleCombatLogChecker.
    // CombatLogX's ICombatLogX extends BlueSlimeCore framework interfaces (IMultiVersionPlugin /
    // IResourceHolder) that javac must resolve to verify the instanceof/cast, so the core artifact
    // is left transitive (compileOnly -> never shaded). The api/core versions are intentionally
    // pinned to the older (2023) SNAPSHOTs: the latest (core 2.9 / api 11.7) ship Java 25 bytecode
    // (class file v69) which this Java-21 (`--release 21`, v65) compile rejects. The getCombatManager()
    // and isInCombat(Player) signatures are stable across 11.x, and the installed plugin supplies the
    // actual classes at runtime, so compiling against the older API is binary-compatible with 11.6+.
    compileOnly 'com.github.sirblobman.api:core:2.8-SNAPSHOT'
    compileOnly 'com.github.sirblobman.combatlogx:api:11.2-SNAPSHOT'
    compileOnly('me.chancesd.pvpmanager:pvpmanager:4.0.8') { transitive = false }

    implementation 'org.bstats:bstats-bukkit:3.0.3'
    implementation 'xyz.tozymc.spigot:title-api:1.0'

    // JDBC drivers (H2, SQLite, MySQL, PostgreSQL) are intentionally NOT bundled.
    // We cannot shade in every database dependency (size, license, native binaries),
    // so DatabaseAccessorFactory probes Class.forName at runtime and falls back along
    // requested -> H2 -> flat-file YAML. Spigot/Paper/Folia typically ship SQLite as a
    // server-side runtime dep; admins who want H2/SQLite/MySQL/Postgres on Fabric (or
    // on a server that doesn't bundle them) must drop the appropriate driver jar onto
    // the server classpath. See DatabaseAccessorFactory and FabricDatabaseHandler.
}

tasks.register('copyDocs', Copy) {
    // Ship only audience-A (server admin) and audience-B (addon author) docs.
    // Contributor-facing material (`docs/dev/**`, `docs/adr/**`,
    // `CONTRIBUTING.md`, `CODE_OF_CONDUCT.md`, `FOR_CONTRIBUTORS.md`,
    // SpigotMC `*.bbcode` listing sources, `DOCS_OPTIMIZATION_PLAN.md`, ...)
    // is intentionally NOT bundled — it remains available in the public
    // repository. The `docs/admin/**` and `docs/architecture/**` trees stay
    // in the jar so admins who unzip the release can read Quick Start,
    // Configuration, the runtime/architecture diagrams, etc., without
    // needing GitHub access. See CHANGELOG `[3.0.0-beta.2]`.
    from(rootProject.file('docs')) {
        // Top-level audience landing pages (the ones that actually live under docs/).
        include 'MAP.md'
        include 'FOR_SERVER_ADMINS.md'
        include 'FOR_ADDON_DEVELOPERS.md'
        // Audience-A: server-admin docs and runtime/architecture diagrams.
        include 'admin/**'
        include 'architecture/**'
    }
    from(rootProject.projectDir) {
        include 'LICENSE'
    }
    // Defensive: never ship editor/agent backup files even if a `.bak`
    // slips into a kept subtree (AGENTS.md backup policy + 2026-05-05
    // Pro-jar audit, where two `docs/*.bak` files leaked into the released
    // jar because `processResources`'s `**/*.bak` exclude does not reach
    // this `Copy` task's output).
    exclude '**/*.bak'
    into layout.buildDirectory.dir('resources/main/docs')
}

processResources {
    // Defensive exclude: never ship editor/agent backup files even if one slips into resources.
    exclude '**/*.bak'
}
processResources.dependsOn copyDocs
shadowJar.dependsOn processResources


// ADR-024: the existing shadowJar produces the FULL/Pro edition (LeafRTP-Pro).
// A sibling `shadowLiteJar` task below produces the lite edition under the
// unclassified `LeafRTP-<version>.jar` name. Both are built by `assemble`.
shadowJar {
    archiveBaseName.set('LeafRTP-Pro')
    // Mojang-mapped intermediate; remapJar consumes this and writes the
    // unclassified `LeafRTP-Pro-<version>.jar` (intermediary-mapped, the
    // released artifact). See remapJar block below.
    archiveClassifier.set('dev')
    archiveVersion.set(project.version.toString())

    // Strip Loom's `minecraft` configuration (and its transitive deps:
    // MC server+client bytecode, MC assets/data, mappings.tiny, fastutil,
    // ICU4J, JNA + native libs, LWJGL, log4j, Netty, Google libs, Mojang
    // datafixers, SpongePowered Mixin) from the shaded JAR. All of these
    // are provided at runtime by the host server (Paper or Fabric). Without
    // this filter the released JAR is ~100MB; with it, ~3-5MB.
    //
    // We replace shadowJar's default `runtimeClasspath` input with
    // `runtimeClasspath` minus the `minecraft` configuration's resolved
    // artifacts. fabric-loader and fabric-api are already off runtimeClasspath
    // because they're declared as modCompileOnly above.
    configurations = [
        project.configurations.runtimeClasspath.copyRecursive { dep ->
            !(dep.group == 'com.mojang' && dep.name == 'minecraft')
        }
    ]
    // Belt-and-braces: even if the configuration filter misses something,
    // exclude the file patterns that ship inside the merged Minecraft JAR.
    // None of these are referenced by RTP code; all are provided by the host.
    dependencies {
        exclude(dependency('com.mojang:minecraft'))
        exclude(dependency('com.mojang:datafixerupper'))
        exclude(dependency('com.mojang:authlib'))
        exclude(dependency('com.mojang:brigadier'))
        exclude(dependency('com.mojang:logging'))
        exclude(dependency('com.mojang:text2speech'))
        exclude(dependency('it.unimi.dsi:fastutil'))
        exclude(dependency('com.ibm.icu:icu4j'))
        exclude(dependency('net.java.dev.jna:jna'))
        exclude(dependency('net.java.dev.jna:jna-platform'))
        exclude(dependency('org.lwjgl:.*'))
        exclude(dependency('org.apache.logging.log4j:.*'))
        exclude(dependency('io.netty:.*'))
        exclude(dependency('com.google.guava:.*'))
        exclude(dependency('com.google.code.gson:.*'))
        exclude(dependency('org.spongepowered:mixin'))
        exclude(dependency('net.fabricmc:fabric-loader'))
        exclude(dependency('net.fabricmc.fabric-api:.*'))
        exclude(dependency('net.fabricmc:.*'))
    }
    // Strip Mojang asset trees and remap metadata that may sneak through
    // any of the above (defence-in-depth — these are ~30MB combined).
    exclude 'assets/minecraft/**'
    exclude 'data/minecraft/**'
    exclude 'mappings/**'
    exclude 'net/minecraft/**'
    exclude 'com/mojang/**'
    exclude 'windows/**'
    exclude 'linux-**'
    exclude 'darwin-**'
    exclude 'macos/**'
    exclude 'META-INF/jars/**'

    relocate 'org.bstats', 'io.github.dailystruggle.rtp.bstats'
    relocate 'io.github.dailystruggle.commandsapi', 'io.github.dailystruggle.rtp.commandsapi'
    relocate 'io.github.dailystruggle.effectsapi', 'io.github.dailystruggle.rtp.effectsapi'
    relocate 'com.zaxxer.hikari', 'io.github.dailystruggle.rtp.hikari'
    // org.lz4:lz4-java exposes its API under net.jpountz.* (legacy package).
    // Required at runtime by rtp-anvil for LZ4-compressed chunk decode.
    // Relocate to avoid clashing with other plugins shading the same lib.
    relocate 'net.jpountz', 'io.github.dailystruggle.rtp.lz4'

    // The JDK-25 v26_1_R1 adapter bytecode is INTENTIONALLY NOT merged here.
    //
    // Why: Loom's `remapJar` (which consumes shadowJar's output, see below)
    // remaps the ENTIRE jar's net.minecraft.* references from Mojmap to
    // intermediary. The v26_1_R1 module's bytecode is built without
    // intermediary remapping (its build.gradle uses `net.fabricmc.fabric-loom`
    // — Loom 1.15+ unobfuscated plugin, no `mappings` line) because MC 26.1.2
    // ships fully deobfuscated and has NO intermediary lookup table at runtime.
    // If its classes pass through remapJar, Mojang names like
    // `net/minecraft/server/level/ServerPlayer` get rewritten to intermediary
    // (`net/minecraft/class_3222`), which then fail to link on the deobf 26.1.2
    // runtime with NoClassDefFoundError.
    //
    // Solution: merge v26_1_R1 bytecode AFTER remapJar via the `mergeV26`
    // task below, so its classes survive intact.
}

// Loom's remapJar reads from `jar` by default and produces an intermediary-
// mapped artifact suitable for the Fabric runtime. Our released artifact is
// the shaded uber-jar, so redirect remapJar's input to shadowJar's output.
// Without this, RTPFabricMod's Mojang-mapped MC references (e.g.
// net.minecraft.network.chat.Component) survive into the released jar and
// fail at entrypoint creation with NoClassDefFoundError on a real Fabric
// runtime (which only knows the intermediary names net.minecraft.class_*).
remapJar {
    dependsOn shadowJar
    inputFile.set(shadowJar.archiveFile)
    archiveBaseName.set('LeafRTP-Pro')
    archiveClassifier.set('')
    archiveVersion.set(project.version.toString())
}

// Reusable closure: merge v26_1_R1 + rtp-fabric-common-unobf + effects-api-fabric-unobf
// bytecode INTO an already-Loom-remapped jar (Pro or lite). Same rationale as the
// rtp-plugin shadowJar comment above: these carriers ship Mojang-named net.minecraft.*
// references that Loom must NOT remap to intermediary, otherwise they fail to link on
// the deobfuscated MC 26.1.2 runtime. We open the jar post-remap and append the
// carrier classes verbatim (with ASM-driven package relocations to match shadow's
// io.github.dailystruggle.{commandsapi,effectsapi} -> io.github.dailystruggle.rtp.*
// rewrite).
//
// `editionLabel` flows into the log line so build output identifies whether the merge
// ran for Pro or lite.
// Note: takes the carrier jars as explicit File args so the closure does not
// reach back to Task.project at execution time (deprecated in Gradle 9, fatal
// in Gradle 10 and incompatible with the configuration cache). Callers must
// resolve the configurations at *configuration* time (outside doLast) and
// pass the singleFile results in.
ext.mergeFabricUnobfBytecodeIntoJar = { File out, String editionLabel, File v26, File commonUnobf, File effectsUnobf ->
    def tmp = new File(out.parentFile, out.name + '.v26merge.tmp')
    def skipPatterns = [
        ~'^fabric\\.mod\\.json$',
        ~'^META-INF/MANIFEST\\.MF$',
        ~'^META-INF/mods\\.toml$',
        ~'^META-INF/services/.*$',
        ~'^pack\\.mcmeta$',
        ~'^assets/.*$',
        ~'^data/.*$',
        ~'^mappings/.*$'
    ]
    def shouldSkipFromMerge = { String name ->
        for (p in skipPatterns) {
            if (name ==~ p) return true
        }
        return false
    }
    def addedFromV26 = 0
    def addedFromCommonUnobf = 0
    def addedFromEffectsUnobf = 0
    def existing = new HashSet<String>()
    def pkgRemap = [
        'io/github/dailystruggle/effectsapi/'  : 'io/github/dailystruggle/rtp/effectsapi/',
        'io/github/dailystruggle/commandsapi/' : 'io/github/dailystruggle/rtp/commandsapi/'
    ]
    def remapClassBytes = { byte[] input ->
        def cr = new org.objectweb.asm.ClassReader(input)
        def cw = new org.objectweb.asm.ClassWriter(0)
        def remapper = new org.objectweb.asm.commons.Remapper() {
            @Override
            String map(String internalName) {
                for (entry in pkgRemap.entrySet()) {
                    if (internalName.startsWith(entry.key)) {
                        return entry.value + internalName.substring(entry.key.length())
                    }
                }
                return internalName
            }
        }
        cr.accept(new org.objectweb.asm.commons.ClassRemapper(cw, remapper), 0)
        return cw.toByteArray()
    }
    def remapEntryName = { String name ->
        for (entry in pkgRemap.entrySet()) {
            if (name.startsWith(entry.key)) {
                return entry.value + name.substring(entry.key.length())
            }
        }
        return name
    }
    new java.util.zip.ZipFile(out).withCloseable { src ->
        new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(tmp)).withCloseable { zos ->
            def srcEntries = src.entries()
            while (srcEntries.hasMoreElements()) {
                def e = srcEntries.nextElement()
                existing.add(e.name)
                def newEntry = new java.util.zip.ZipEntry(e.name)
                newEntry.time = e.time
                zos.putNextEntry(newEntry)
                if (!e.isDirectory()) {
                    src.getInputStream(e).withCloseable { ins -> ins.transferTo(zos) }
                }
                zos.closeEntry()
            }
            for (carrier in [v26, commonUnobf, effectsUnobf]) {
                int countBefore = existing.size()
                int label = [v26: 0, commonUnobf: 1, effectsUnobf: 2][carrier == v26 ? 'v26' : (carrier == commonUnobf ? 'commonUnobf' : 'effectsUnobf')]
                new java.util.zip.ZipFile(carrier).withCloseable { cz ->
                    def es = cz.entries()
                    while (es.hasMoreElements()) {
                        def e = es.nextElement()
                        if (e.isDirectory()) continue
                        if (shouldSkipFromMerge(e.name)) continue
                        def outName = e.name.endsWith('.class') ? remapEntryName(e.name) : e.name
                        if (existing.contains(outName)) continue
                        byte[] payload = cz.getInputStream(e).withCloseable { ins -> ins.readAllBytes() }
                        if (e.name.endsWith('.class')) {
                            payload = remapClassBytes(payload)
                        }
                        def newEntry = new java.util.zip.ZipEntry(outName)
                        newEntry.time = e.time
                        zos.putNextEntry(newEntry)
                        zos.write(payload)
                        zos.closeEntry()
                        existing.add(outName)
                    }
                }
                int added = existing.size() - countBefore
                if (carrier == v26) addedFromV26 = added
                else if (carrier == commonUnobf) addedFromCommonUnobf = added
                else addedFromEffectsUnobf = added
            }
        }
    }
    if (!out.delete()) {
        throw new GradleException("Failed to delete original jar output: " + out)
    }
    if (!tmp.renameTo(out)) {
        java.nio.file.Files.copy(tmp.toPath(), out.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        tmp.delete()
    }
    logger.lifecycle("[rtp-plugin] (${editionLabel}) Merged ${addedFromV26} v26_1_R1 adapter classes + ${addedFromCommonUnobf} rtp-fabric-common-unobf classes + ${addedFromEffectsUnobf} effects-api-fabric-unobf classes into ${out.name} (post-remap, Mojang names preserved).")
}

// Post-process remapJar to merge in the v26_1_R1 adapter bytecode WITHOUT
// passing it through Loom's intermediary remap. See the rationale comment in
// shadowJar above. We open the just-remapped jar and append the v26 module's
// classes in place; Loom never sees them, so their Mojang names stay intact
// and link cleanly on the deobfuscated MC 26.1.2 runtime.
remapJar {
    dependsOn ':rtp-fabric:rtp-fabric-v26_1_R1:jar'
    dependsOn ':rtp-fabric:rtp-fabric-v26_2_R1:jar'
    dependsOn ':rtp-fabric:rtp-fabric-common-unobf:jar'
    dependsOn ':effects-api:effects-api-fabric-unobf:jar'
    // Resolve carrier jars and capture the merge closure at configuration
    // time so doLast does not invoke Task.project at execution time
    // (deprecated in Gradle 9, fatal in Gradle 10).
    def v26Jar = project.configurations.fabric26Bytecode
    def v262Jar = project.configurations.fabric262Bytecode
    def commonUnobfJar = project.configurations.fabricCommonUnobfBytecode
    def effectsUnobfJar = project.configurations.effectsApiFabricUnobfBytecode
    def mergeFn = project.ext.mergeFabricUnobfBytecodeIntoJar
    doLast {
        mergeFn(remapJar.archiveFile.get().asFile, 'Pro',
                v26Jar.singleFile, commonUnobfJar.singleFile, effectsUnobfJar.singleFile)
        // Second pass merges the 26.2 pre-release adapter; the unobf carriers
        // are already present from the first pass and are skipped (existing
        // check), so only the v26_2_R1 adapter classes are added.
        mergeFn(remapJar.archiveFile.get().asFile, 'Pro (26.2)',
                v262Jar.singleFile, commonUnobfJar.singleFile, effectsUnobfJar.singleFile)
    }
}


// `archives` configuration is deprecated for artifact declaration in Gradle 9
// (removed in Gradle 10). Wiring these tasks directly into `assemble` is the
// supported replacement -- see upgrading_version_9.html#sec:archives-configuration.
assemble.dependsOn shadowJar
assemble.dependsOn remapJar

// =============================================================================
// ADR-024 -- RTP-lite assembly variant.
//
// Lite produces the unclassified `LeafRTP-<version>.jar` (the "default" artifact);
// the pre-existing shadowJar above produces `LeafRTP-Pro-<version>.jar`. Both are
// built whenever `assemble` runs.
//
// See docs/adr/ADR-024-rtp-lite-assembly-variant.md for the scope contract.
// Class/resource excludes below are enforced a second time by
// `liteJarStructureCheck` (regex audit of the produced JAR).
// =============================================================================

sourceSets {
    lite {
        java.srcDirs = ['src/lite/java']
        resources.srcDirs = ['src/lite/resources']
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

tasks.named('compileLiteJava') {
    dependsOn tasks.named('compileJava')
}

// ADR-024 locale parity: lite ships reduced English baselines for
// config.yml / performance.yml / safety.yml / logging.yml / regions/default.yml
// (Pro baselines minus lite-irrelevant keys). The Pro lang/ tree under
// `rtp-plugin/src/main/resources/lang/<loc>/` still carries the full Pro
// key set, so without trimming, every lite install would ship locale
// translations for keys (`visitorEnabled`, `loginCacheEnabled`,
// `loginCacheCap`, `onEventParsing`, `pregeneratedPreference`,
// `backlogRefillThreshold`, `prefab`, block-tag / state-predicate `safety.yml`
// sections, ...) that have no counterpart in lite's English baseline.
//
// `repackLiteLocales` regenerates `src/lite/resources/lang/` from the Pro
// lang tree, dropping any locale row whose base_key is not present in the
// matching lite English baseline. messages.yml is copied through unchanged
// (per the ADR-024 2026-05-11(b) amendment lite ships the full
// messages.yml). The script is `scripts/repack-lite-locales.ps1`.
//
// `processLiteResources` depends on this so the lite source set's resource
// copy picks up the freshly-regenerated tree.
tasks.register('repackLiteLocales', Exec) {
    group = 'build'
    description = 'Regenerates rtp-plugin/src/lite/resources/lang/ from the ' +
            'Pro lang tree, pruned to lite\'s reduced baseline key set (ADR-024).'

    def proMain   = file("${project.projectDir}/src/main/resources")
    def liteMain  = file("${project.projectDir}/src/lite/resources")
    def liteLang  = file("${liteMain}/lang")
    def scriptDir = rootProject.file('scripts')
    def script    = file("${scriptDir}/repack-lite-locales.ps1")

    // Inputs: the Pro lang tree, every lite-shipped baseline YAML, and the
    // script itself. Any change to these triggers a re-run.
    inputs.dir("${proMain}/lang").withPropertyName('proLangTree')
    inputs.files(fileTree(liteMain) { include '*.yml'; include 'regions/*.yml' })
            .withPropertyName('liteBaselines')
    inputs.file(script).withPropertyName('repackScript')

    // Output: the regenerated lite lang/ tree.
    outputs.dir(liteLang).withPropertyName('liteLangTree')

    // PowerShell on Windows; on other hosts fall back to pwsh (PowerShell
    // Core) which is shipped with modern Linux/macOS dev images and CI.
    def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
    def shell = isWindows ? 'powershell' : 'pwsh'
    commandLine shell, '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', script.absolutePath
}

tasks.named('processLiteResources') {
    dependsOn tasks.named('repackLiteLocales')
}

// The root build.gradle configures `processResources` (main sourceSet) to
// expand ${version} in plugin.yml / fabric.mod.json, but the `lite` sourceSet
// declared above (ADR-024) gets its own `processLiteResources` task that
// does NOT inherit that configuration. Without this block the lite JAR
// ships plugin.yml with literal `${version}`, causing Bukkit to log
// `Enabling RTP v${version}` on enable. Mirror the root config here.
tasks.named('processLiteResources') {
    // Capture lite's version at configuration time so the filesMatching
    // closure does not reach Task.project at execution time
    // (deprecated in Gradle 9, fatal in Gradle 10).
    // Lite tracks its own version line (`ext.liteVersion`, set in root
    // build.gradle) independent of Pro's `project.version`.
    def projectVersion = project.ext.liteVersion
    inputs.property "version", projectVersion
    filesMatching(["plugin.yml", "fabric.mod.json"]) {
        expand "version": projectVersion
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    exclude '**/*.bak'
}

tasks.register('shadowLiteJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    group = 'build'
    description = 'Builds the pre-remap RTP (lite) shaded jar (ADR-024). The final lite ' +
            'artifact is produced by `remapLiteJar`, which feeds Loom intermediary remap + ' +
            'the v26_1_R1 / *-unobf bytecode merge onto this jar.'

    // The released lite artifact is `LeafRTP-<version>.jar` (unclassified, produced by
    // `remapLiteJar` below — mirrors Pro's `shadowJar` -> `remapJar` chain). This task's
    // output is the pre-remap input; it carries the `-dev` classifier to avoid clashing
    // with the released artifact's filename, identical in spirit to Loom's own
    // `jar` / `remapJar` split.
    archiveBaseName.set('LeafRTP')
    archiveClassifier.set('dev')
    archiveVersion.set(project.ext.liteVersion.toString())

    // Lite source set first so its plugin.yml/config.yml/etc. win over main's
    // when DuplicatesStrategy.EXCLUDE is applied (Shadow honours first-seen).
    from sourceSets.lite.output
    // Include main source set output (bukkit bootstrap helpers, listeners, server
    // provider, command classes). A freshly-registered ShadowJar task does NOT
    // default to sourceSets.main.output -- only the auto-created `shadowJar` task
    // does. Without this line, the lite JAR ships only RTPBukkitLitePlugin.class
    // and crashes on enable with NoClassDefFoundError for BukkitServerProvider.
    from sourceSets.main.output
    from rootProject.file('LICENSE')

    // Reuse the full shadowJar's already-filtered configurations (Loom-aware
    // strips for `minecraft`, fabric-loader, fabric-api, etc.) and apply the
    // ADR-024 SQL/Redis additional strip on top.
    // Loom transparently injects Minecraft transitives (oshi, jline, joml,
    // mixinextras, asm, jorbis, joptsimple, etc.) onto runtimeClasspath as
    // top-level entries. The full shadowJar task strips them via Loom's
    // task-level hook, but that hook fires only on the existing `shadowJar`
    // task -- not on this newly-registered one. So we replicate the strip
    // explicitly by group.
    configurations = [
        project.configurations.runtimeClasspath.copyRecursive { dep ->
            !(dep.group == 'com.mojang') &&
            !(dep.group?.startsWith('net.fabricmc')) &&
            !(dep.group == 'com.github.oshi') &&
            !(dep.group == 'org.jline') &&
            !(dep.group == 'org.joml') &&
            !(dep.group == 'org.ow2.asm') &&
            !(dep.group == 'org.objectweb.asm') &&
            !(dep.group == 'io.github.llamalad7') &&
            !(dep.group == 'org.jcraft') &&
            !(dep.group == 'net.sf.jopt-simple') &&
            !(dep.group == 'it.unimi.dsi') &&
            !(dep.group == 'com.ibm.icu') &&
            !(dep.group == 'net.java.dev.jna') &&
            !(dep.group == 'org.lwjgl') &&
            !(dep.group == 'org.apache.logging.log4j') &&
            !(dep.group == 'io.netty') &&
            !(dep.group == 'org.apache.commons') &&
            !(dep.group == 'commons-codec') &&
            !(dep.group == 'commons-io') &&
            !(dep.group == 'commons-logging') &&
            !(dep.group == 'com.google.guava') &&
            !(dep.group == 'com.google.code.gson') &&
            !(dep.group == 'org.spongepowered') &&
            !(dep.group == 'org.slf4j') &&
            !(dep.group == 'net.minecrell') &&
            // ADR-024 specific: SQL/Redis drivers.
            !(dep.group == 'com.h2database') &&
            !(dep.group == 'org.xerial' && dep.name == 'sqlite-jdbc') &&
            !(dep.group == 'mysql') &&
            !(dep.group == 'org.postgresql') &&
            !(dep.group == 'redis.clients') &&
            !(dep.group == 'com.zaxxer') &&
            // Loom/Mojang networking transitives -- not used by lite runtime.
            !(dep.group == 'org.apache.httpcomponents') &&
            // org.lz4:lz4-java is REQUIRED at runtime by rtp-anvil's chunk
            // decompression path (compression mode 4 in r.X.Z.mca). rtp-anvil
            // is intentionally kept in lite, so its lz4 transitive must be too.
            // Stripping it caused NoClassDefFoundError: net/jpountz/lz4/LZ4FrameInputStream
            // on every Anvil probe of an LZ4-compressed chunk. Relocated below.
            !(dep.group == 'org.jline') &&
            !(dep.group == 'org.json') &&
            !(dep.group == 'com.mojang')
        }
    ]

    dependencies {
        // Mojang/Loom strips (mirror full shadowJar).
        exclude(dependency('com.mojang:minecraft'))
        exclude(dependency('com.mojang:datafixerupper'))
        exclude(dependency('com.mojang:authlib'))
        exclude(dependency('com.mojang:brigadier'))
        exclude(dependency('com.mojang:logging'))
        exclude(dependency('com.mojang:text2speech'))
        exclude(dependency('it.unimi.dsi:fastutil'))
        exclude(dependency('com.ibm.icu:icu4j'))
        exclude(dependency('net.java.dev.jna:jna'))
        exclude(dependency('net.java.dev.jna:jna-platform'))
        exclude(dependency('org.lwjgl:.*'))
        exclude(dependency('org.apache.logging.log4j:.*'))
        exclude(dependency('io.netty:.*'))
        exclude(dependency('com.google.guava:.*'))
        exclude(dependency('com.google.code.gson:.*'))
        exclude(dependency('org.spongepowered:mixin'))
        exclude(dependency('net.fabricmc:fabric-loader'))
        exclude(dependency('net.fabricmc.fabric-api:.*'))
        exclude(dependency('net.fabricmc:.*'))
        // ADR-024:
        exclude(dependency('net.minecrell:.*'))
        exclude(dependency('com.h2database:.*'))
        exclude(dependency('org.xerial:sqlite-jdbc'))
        exclude(dependency('mysql:.*'))
        exclude(dependency('org.postgresql:.*'))
        exclude(dependency('redis.clients:.*'))
        exclude(dependency('com.zaxxer:.*'))
        exclude(dependency('org.apache.httpcomponents:.*'))
        // org.lz4:lz4-java retained -- see comment in configurations filter above.
        exclude(dependency('org.jline:.*'))
        exclude(dependency('org.json:.*'))
    }

    // Class-level excludes -- ADR-024 drops list (as amended 2026-05-07: Fabric retained in lite).
    // NOTE: rtp-anvil is INTENTIONALLY KEPT in lite (ADR-024 reversal: performance parity
    // with Pro for benchmark comparisons; BukkitRTPWorld hard-references AnvilProbeSupport).
    // NOTE: Fabric (RTPFabricMod + rtp-fabric-common classes) is INTENTIONALLY KEPT in lite
    // as of the 2026-05-07 ADR-024 amendment. Lite still ships no JDBC drivers, so Fabric+lite
    // falls through FabricDatabaseHandler.setupDatabase to YamlFileDatabase (loud warning).
    exclude 'io/github/dailystruggle/rtp/tags/**'
    exclude 'io/github/dailystruggle/rtp/folia/**'
    exclude 'io/github/dailystruggle/rtp/folia_*/**'
    // Networking/CLI transitives pulled in by Loom -- unused at runtime in lite.
    exclude 'org/apache/http/**'
    exclude 'org/apache/commons/**'
    exclude 'org/jline/**'
    exclude 'org/json/**'
    // net/jpountz/** retained -- rtp-anvil needs LZ4FrameInputStream at runtime.
    // Relocated to io.github.dailystruggle.rtp.lz4 below.
    exclude 'mozilla/**'
    exclude 'flightrecorder-config.jfc'
    // ADR-024 Phase B audit: Mojang/MC asset stubs and version manifest leak past
    // the `assets/minecraft/**` glob because they sit at the artifact root.
    exclude 'version.json'
    exclude 'pack.png'
    exclude 'data/.mcassetsroot'
    exclude 'assets/.mcassetsroot'
    // Folia annotation stubs (org.checkerframework astub file) -- compile-only artifact.
    exclude 'folia-thread-stubs.astub'
    // Paper/log4j terminal-console plugin -- not used by lite (no log4j here).
    exclude 'net/minecrell/**'
    // SLF4J API: lite uses RTP.log (RTPServerAccessor) routing; the host server
    // (Spigot/Paper) provides slf4j on its own classpath.
    exclude 'org/slf4j/**'
    // Annotation-processor service descriptors leaked from compileOnly deps.
    exclude 'META-INF/services/javax.annotation.processing.Processor'
    // Orphan maven metadata for stripped libraries.
    exclude 'META-INF/maven/org.slf4j/**'
    exclude 'META-INF/maven/org.apache.commons/**'
    exclude 'META-INF/maven/com.zaxxer/**'
    exclude 'io/github/dailystruggle/rtp/common/database/options/H2*.class'
    exclude 'io/github/dailystruggle/rtp/common/database/options/SQLite*.class'
    exclude 'io/github/dailystruggle/rtp/common/database/options/MySQL*.class'
    exclude 'io/github/dailystruggle/rtp/common/database/options/Postgre*.class'
    // AbstractSQLDatabaseAccessor is INTENTIONALLY KEPT in lite: RTP.java references it via
    // `instanceof` in a scheduled flush task. Excluding it caused NoClassDefFoundError at
    // runtime. The concrete H2/SQLite/MySQL/Postgres subclasses remain excluded, so the
    // instanceof check is always false in lite.
    exclude 'io/github/dailystruggle/rtp/common/network/Redis*.class'
    exclude 'io/github/dailystruggle/rtp/common/selection/region/LoginCacheTask.class'
    // HikariCP -- pulled in transitively but only used by SQL accessors which lite drops.
    exclude 'com/zaxxer/hikari/**'
    exclude 'io/github/dailystruggle/rtp/hikari/**'
    exclude 'META-INF/maven/com.zaxxer/**'
    // Resources dropped from lite.
    // lang/** and language.yml are INTENTIONALLY KEPT in lite as of 2026-05-11
    // (ADR-024 language-options amendment): multilingual support / locale switching
    // (ADR-020) ships in lite for Pro parity. The feature is dormant for operators
    // who do not write a language.yml or do not run /rtp lang -- locale defaults to
    // English. LanguageBootstrap.resolve() is invoked unconditionally from
    // Configs#reloadConfigs(); shipping the resources is sufficient to activate it.
    exclude 'economy.yml'
    // integrations.yml is INTENTIONALLY KEPT in lite as of 2026-05-11 (ADR-024
    // claim-plugin amendment): the bundled claim-plugin integrations (ADR-019)
    // are wired in lite as well, and ClaimIntegrations#buildParser loads its
    // defaults from integrations.yml on the classpath.
    // logging.yml is INTENTIONALLY KEPT in lite (src/lite/resources/logging.yml
    // overrides the full version via duplicatesStrategy = EXCLUDE). Without it,
    // no min_level filter loads and every FINE/FINER/FINEST log call prints.
    // fabric.mod.json is INTENTIONALLY KEPT in lite as of the 2026-05-07 ADR-024 amendment
    // so Fabric Loader can discover RTPFabricMod from the lite jar.
    exclude 'docs/**'
    exclude 'README.md'
    exclude 'CHANGELOG.md'
    exclude 'CONTRIBUTING.md'
    exclude 'CODE_OF_CONDUCT.md'
    exclude 'SECURITY.md'
    exclude 'SUPPORT.md'
    // Mojang asset trees (mirror full shadowJar).
    exclude 'assets/minecraft/**'
    exclude 'data/minecraft/**'
    exclude 'mappings/**'
    exclude 'net/minecraft/**'
    exclude 'com/mojang/**'
    exclude 'windows/**'
    exclude 'linux-**'
    exclude 'darwin-**'
    exclude 'macos/**'
    exclude 'META-INF/jars/**'
    // Drop the Pro/full bootstrap class -- lite ships only RTPBukkitLitePlugin.
    exclude 'io/github/dailystruggle/rtp/bukkit/RTPBukkitPlugin.class'
    exclude 'io/github/dailystruggle/rtp/bukkit/RTPBukkitPlugin$*.class'

    // Prefer src/lite/resources/<name> over src/main/resources/<name>
    // (plugin.yml, performance.yml, config.yml, ...).
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Same relocations as full, minus H2 (not shaded).
    relocate 'org.bstats', 'io.github.dailystruggle.rtp.bstats'
    relocate 'io.github.dailystruggle.commandsapi', 'io.github.dailystruggle.rtp.commandsapi'
    relocate 'io.github.dailystruggle.effectsapi', 'io.github.dailystruggle.rtp.effectsapi'
    // org.lz4:lz4-java exposes its API under net.jpountz.* (legacy package).
    // Relocate to avoid clashing with any other plugin shading the same lib.
    relocate 'net.jpountz', 'io.github.dailystruggle.rtp.lz4'

    // Lite intentionally does NOT depend on `copyDocs` -- lite ships no docs.
    dependsOn tasks.named('processResources')
    dependsOn tasks.named('compileJava')
    dependsOn tasks.named('compileLiteJava')
}

// ADR-024 (2026-05-07 amendment) -- Fabric in scope for lite. To support the full
// MC version range (1.20.x .. 26.1.2) the lite jar must go through Loom's
// intermediary remap (same as Pro's `remapJar`) so RTPFabricMod / rtp-fabric-common
// classes link on intermediary-mapped Fabric runtimes (MC <= 1.21.x). The
// v26_1_R1 adapter + rtp-fabric-common-unobf + effects-api-fabric-unobf carriers
// are then merged in post-remap (Mojang-named, for the deobfuscated 26.1.2
// runtime). This mirrors Pro's `shadowJar` -> `remapJar(+merge)` chain.
tasks.register('remapLiteJar', net.fabricmc.loom.task.RemapJarTask) {
    group = 'build'
    description = 'Builds the final RTP (lite) jar: Loom-remap of shadowLiteJar + v26/unobf merge (ADR-024).'

    dependsOn tasks.named('shadowLiteJar')
    dependsOn ':rtp-fabric:rtp-fabric-v26_1_R1:jar'
    dependsOn ':rtp-fabric:rtp-fabric-v26_2_R1:jar'
    dependsOn ':rtp-fabric:rtp-fabric-common-unobf:jar'
    dependsOn ':effects-api:effects-api-fabric-unobf:jar'

    inputFile.set(tasks.named('shadowLiteJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).flatMap { it.archiveFile })
    archiveBaseName.set('LeafRTP')
    archiveClassifier.set('')
    archiveVersion.set(project.ext.liteVersion.toString())

    // Resolve carrier jars and capture the merge closure at configuration time
    // so doLast does not reach Task.project at execution time
    // (deprecated in Gradle 9, fatal in Gradle 10).
    def v26Jar = project.configurations.fabric26Bytecode
    def v262Jar = project.configurations.fabric262Bytecode
    def commonUnobfJar = project.configurations.fabricCommonUnobfBytecode
    def effectsUnobfJar = project.configurations.effectsApiFabricUnobfBytecode
    def mergeFn = project.ext.mergeFabricUnobfBytecodeIntoJar

    doLast {
        mergeFn(remapLiteJar.archiveFile.get().asFile, 'lite',
                v26Jar.singleFile, commonUnobfJar.singleFile, effectsUnobfJar.singleFile)
        // Second pass merges the 26.2 pre-release adapter (carriers already
        // present from the first pass are skipped). See rtp-fabric-ADR-014.
        mergeFn(remapLiteJar.archiveFile.get().asFile, 'lite (26.2)',
                v262Jar.singleFile, commonUnobfJar.singleFile, effectsUnobfJar.singleFile)
    }
}

tasks.register('liteJarStructureCheck') {
    group = 'verification'
    description = 'Asserts that the RTP (lite) JAR contains no forbidden entries (ADR-024).'
    dependsOn tasks.named('remapLiteJar')

    doLast {
        def jarFile = tasks.named('remapLiteJar').get().archiveFile.get().asFile
        if (!jarFile.exists()) {
            throw new GradleException("ADR-024 structure check: lite JAR not found at ${jarFile}")
        }
        def forbidden = [
            // anvil intentionally retained in lite (see shadowLiteJar comment).
            ~'^io/github/dailystruggle/rtp/tags/.*$',
            ~'^io/github/dailystruggle/rtp/folia/.*$',
            ~'^io/github/dailystruggle/rtp/folia_.*$',
            // Fabric (rtp/fabric/**) intentionally retained in lite as of the 2026-05-07
            // ADR-024 amendment -- see shadowLiteJar comment.
            ~'^io/github/dailystruggle/rtp/bukkit/RTPBukkitPlugin\\$?.*\\.class$',
            ~'^io/github/dailystruggle/rtp/common/database/options/H2.*\\.class$',
            ~'^io/github/dailystruggle/rtp/common/database/options/SQLite.*\\.class$',
            ~'^io/github/dailystruggle/rtp/common/database/options/MySQL.*\\.class$',
            ~'^io/github/dailystruggle/rtp/common/database/options/Postgre.*\\.class$',
            ~'^io/github/dailystruggle/rtp/common/network/Redis.*\\.class$',
            ~'^com/zaxxer/hikari/.*$',
            ~'^io/github/dailystruggle/rtp/hikari/.*$',
            ~'^io/github/dailystruggle/rtp/common/selection/region/LoginCacheTask\\.class$',
            // lang/** and language.yml intentionally present in lite as of the
            // 2026-05-11 ADR-024 language-options amendment -- see shadowLiteJar comment.
            ~'^economy\\.yml$',
//            ~'^integrations\\.yml$',
            // logging.yml intentionally present in lite -- see shadowLiteJar comment.
            // fabric.mod.json intentionally present in lite as of the 2026-05-07
            // ADR-024 amendment -- see shadowLiteJar comment.
            ~'^docs/.*$',
            ~'^README\\.md$',
            ~'^CHANGELOG\\.md$',
            ~'^org/h2/.*$',
            ~'^org/sqlite/.*$',
            ~'^com/mysql/.*$',
            ~'^org/postgresql/.*$',
            ~'^redis/clients/.*$',
            // ADR-024 Phase B audit: assert no Mojang asset stubs / Loom leftovers.
            ~'^version\\.json$',
            ~'^pack\\.png$',
            ~'^(data|assets)/\\.mcassetsroot$',
            ~'^folia-thread-stubs\\.astub$',
            ~'^net/minecrell/.*$',
            ~'^org/slf4j/.*$',
            ~'^META-INF/services/javax\\.annotation\\.processing\\.Processor$',
            ~'^META-INF/maven/org\\.slf4j/.*$',
            ~'^META-INF/maven/org\\.apache\\.commons/.*$',
            ~'^META-INF/maven/com\\.zaxxer/.*$'
        ]

        def violations = []
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry ->
                def name = entry.name
                forbidden.each { pat ->
                    if (name ==~ pat) {
                        violations << name
                    }
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                "ADR-024 structure check FAILED. Forbidden entries in lite JAR:\n  " +
                violations.unique().sort().join('\n  '))
        }

        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            def yml = zip.getEntry('plugin.yml')
            if (yml == null) {
                throw new GradleException("ADR-024 structure check: plugin.yml missing from lite JAR")
            }
            def content = zip.getInputStream(yml).getText('UTF-8')
            if (!content.contains('io.github.dailystruggle.rtp.bukkit.lite.RTPBukkitLitePlugin')) {
                throw new GradleException(
                    "ADR-024 structure check: plugin.yml in lite JAR does not point at " +
                    "RTPBukkitLitePlugin. Resource overlay (src/lite/resources/plugin.yml) " +
                    "may not have shadowed src/main/resources/plugin.yml.")
            }
        }

        logger.lifecycle("[ADR-024] liteJarStructureCheck passed for ${jarFile.name}")
    }
}

tasks.named('check') { dependsOn 'liteJarStructureCheck' }

// `archives` configuration is deprecated for artifact declaration in Gradle 9
// (removed in Gradle 10). The `assemble.dependsOn` wiring below is the
// supported replacement -- see upgrading_version_9.html#sec:archives-configuration.
assemble.dependsOn tasks.named('remapLiteJar')
