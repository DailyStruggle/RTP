# Unsafe Blocks
# Materials the plugin will reject as a landing target or any block within
# `safetyRadius` of the target. Populated from the Bukkit Material enum.
# Anything that can damage, trap, or drown a player belongs here.
unsafeBlocks:
  # Fluids and Elemental Hazards
  - WATER
  - LAVA
  - BUBBLE_COLUMN
  - FIRE
  - SOUL_FIRE
  - POWDER_SNOW

  # Environmental Damage
  - MAGMA_BLOCK
  - CACTUS
  - SWEET_BERRY_BUSH
  - WITHER_ROSE
  - POINTED_DRIPSTONE
  - CAMPFIRE
  - SOUL_CAMPFIRE
  - CREAKING_HEART

  # Trapping and Obstructions
  - COBWEB
  - BEDROCK
  - NETHER_PORTAL
  - END_PORTAL
  - END_GATEWAY

  # Explosives
  - TNT
  - END_CRYSTAL
  - RESPAWN_ANCHOR

  # Aquatic Flora
  - SEAGRASS
  - TALL_SEAGRASS
  - KELP
  - KELP_PLANT

  # State Flags
  - WATERLOGGED

# Biome Filter
# biomeWhitelist: false -> `biomes` list is a blacklist (skip these biomes)
#                  true  -> `biomes` list is a whitelist (only allow these biomes)
# The default blacklist excludes oceans, rivers, void, and other biomes where
# a safe solid-ground landing is unlikely or impossible.
biomeWhitelist: false
biomes:
  # OCEAN BIOMES
  - OCEAN
  - DEEP_OCEAN
  - WARM_OCEAN
  - LUKEWARM_OCEAN
  - DEEP_LUKEWARM_OCEAN
  - COLD_OCEAN
  - DEEP_COLD_OCEAN
  - FROZEN_OCEAN
  - DEEP_FROZEN_OCEAN

  # RIVER BIOMES
  - RIVER
  - FROZEN_RIVER

  # ADJACENT AND COASTAL BIOMES
  - BEACH
  - SNOWY_BEACH
  - STONY_SHORE
  - SWAMP
  - MANGROVE_SWAMP

  # END BIOMES (no solid landing / void-adjacent)
  - SMALL_END_ISLANDS

  # NETHER BIOMES (dangerous/irregular terrain)
  - BASALT_DELTAS

  # TECHNICAL BIOMES
  - THE_VOID

# DO NOT TOUCH VERSION NUMBER
version: "1.0"