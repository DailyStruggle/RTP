# --- RTP Safety Configuration ---
# Documentation: https://github.com/DailyStruggle/RTP/blob/master/docs/admin/SAFETY.md
# Seconds of invulnerability granted after a teleport completes.
# 0 disables the post-teleport invulnerability window.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 5
invulnerabilityTime: 5

# Block radius around the landing spot scanned for hazards.
# 0 checks only the landing block + immediate vertical.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 0
safetyRadius: 0

# Maximum retries for the stale-chunk guard before failing the attempt.
# @type: integer
# @range: [0, null]
# @default: 2
staleChunkRetryLimit: 2

# Use the off-thread anvil NBT prefilter to reject candidates without
# loading their chunks.
# @type: boolean
# @default: true
anvilPrefilterEnabled: true

# Radius of the emergency landing platform built at the destination.
# -1 disables the platform entirely.
# @type: integer
# @range: [-1, null]
# @unit: blocks
# @default: -1
platformRadius: -1

# Depth (vertical thickness) of the emergency platform.
# @type: integer
# @range: [1, null]
# @unit: blocks
# @default: 1
platformDepth: 1

# Air-space height cleared above the emergency platform.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 2
platformAirHeight: 2

# Material used for the emergency landing platform.
# @type: material
# @source: material
# @default: GLASS
platformMaterial: "GLASS"

# Blocks treated as passable air for landing-safety checks.
# Accepts Bukkit Material names and "#minecraft:<tag>" tag references.
# @type: list<material>
# @source: material
airBlocks:
  - "AIR"
  - "CAVE_AIR"
  - "VOID_AIR"
  - "LEGACY_AIR"
  - "STRUCTURE_VOID"
  - "LIGHT"
  - "#minecraft:flowers"
  - "#minecraft:small_flowers"
  # Note: #minecraft:tall_flowers is an item-only tag in vanilla; its members
  # (LILAC, PEONY, ROSE_BUSH, SUNFLOWER, PITCHER_PLANT) are already covered by
  # #minecraft:flowers above.
  - "SHORT_GRASS"
  - "TALL_GRASS"
  - "SHORT_DRY_GRASS"
  - "TALL_DRY_GRASS"
  - "FERN"
  - "LARGE_FERN"
  - "DEAD_BUSH"
  - "BUSH"
  - "WILDFLOWERS"
  - "FIREFLY_BUSH"
  - "LEGACY_LONG_GRASS"
  - "LEGACY_DEAD_BUSH"
  - "#minecraft:saplings"
  - "BROWN_MUSHROOM"
  - "RED_MUSHROOM"
  - "CRIMSON_FUNGUS"
  - "WARPED_FUNGUS"
  - "#minecraft:crops"
  - "MELON_STEM"
  - "PUMPKIN_STEM"
  - "SUGAR_CANE"
  - "BAMBOO_SAPLING"
  - "VINE"
  - "GLOW_LICHEN"
  - "WEEPING_VINES"
  - "TWISTING_VINES"
  - "HANGING_ROOTS"
  - "PALE_HANGING_MOSS"
  - "RESIN_CLUMP"
  - "#minecraft:rails"
  - "REDSTONE_WIRE"
  - "COMPARATOR"
  - "REPEATER"
  - "LEVER"
  - "STRING"
  - "TRIPWIRE"
  - "TORCH"
  - "WALL_TORCH"
  - "SOUL_TORCH"
  - "SOUL_WALL_TORCH"
  - "REDSTONE_TORCH"
  - "REDSTONE_WALL_TORCH"
  - "END_ROD"
  - "#minecraft:buttons"
  - "#minecraft:pressure_plates"
  - "#minecraft:standing_signs"
  - "#minecraft:wall_signs"
  - "#minecraft:ceiling_hanging_signs"
  - "#minecraft:wall_hanging_signs"
  - "LEGACY_SIGN"
  - "LEGACY_WALL_SIGN"
  - "SNOW"
  - "MOSS_CARPET"
  - "PALE_MOSS_CARPET"
  - "LEAF_LITTER"
  - "#minecraft:leaves"

# Blocks that disqualify a landing spot (lava, hazards, etc.).
# Accepts Bukkit Material names, "#minecraft:<tag>" tag references, and
# state predicates such as "*[waterlogged=true]".
# @type: list<material>
# @source: material
unsafeBlocks:
  - "WATER"
  - "LAVA"
  - "BUBBLE_COLUMN"
  - "*[waterlogged=true]"
  - "#minecraft:fire"
  - "POWDER_SNOW"
  - "MAGMA_BLOCK"
  - "#minecraft:campfires"
  - "CACTUS"
  - "SWEET_BERRY_BUSH"
  - "WITHER_ROSE"
  - "CHORUS_PLANT"
  - "CHORUS_FLOWER"
  - "POINTED_DRIPSTONE"
  - "COBWEB"
  - "CREAKING_HEART"
  - "BEDROCK"
  - "NETHER_PORTAL"
  - "END_PORTAL"
  - "END_GATEWAY"
  - "TNT"
  - "END_CRYSTAL"
  - "RESPAWN_ANCHOR"
  - "SEAGRASS"
  - "TALL_SEAGRASS"
  - "KELP"
  - "KELP_PLANT"
  - "#minecraft:logs"

# If true, the biomes list is a whitelist (only these biomes are
# allowed). If false, it is a blacklist (these biomes are excluded).
# @type: boolean
# @default: false
biomeWhitelist: false

# Biomes treated as whitelist or blacklist members per biomeWhitelist.
# @type: list<biome>
# @source: biome
biomes:
  - "OCEAN"
  - "DEEP_OCEAN"
  - "WARM_OCEAN"
  - "LUKEWARM_OCEAN"
  - "DEEP_LUKEWARM_OCEAN"
  - "COLD_OCEAN"
  - "DEEP_COLD_OCEAN"
  - "FROZEN_OCEAN"
  - "DEEP_FROZEN_OCEAN"
  - "RIVER"
  - "FROZEN_RIVER"
  - "BEACH"
  - "SNOWY_BEACH"
  - "STONY_SHORE"
  - "SWAMP"
  - "MANGROVE_SWAMP"
  - "SMALL_END_ISLANDS"
  - "BASALT_DELTAS"
  - "DRIPSTONE_CAVES"
  - "LUSH_CAVES"
  - "DEEP_DARK"
  - "THE_VOID"

# --- Optional PvP / combat-tag pre-flight gate ---
# Master toggle. When true, /rtp consults the active combat-state authority
# before enrolling a player and again before applying the destination, and
# applies pvpOnCombat below. Off by default.
# @type: boolean
# @default: false
pvpCheckEnabled: false

# How long after dealing or taking PvP damage a player is considered "in combat"
# by RTP's native tracker. Ignored when an external combat-tag plugin is bound.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 15
pvpCombatTagSeconds: 15

# What to do when a combat-tagged player requests (or is mid-)/rtp.
# ALLOW  - permit, but log an audit line
# DENY   - refuse the command with the busy message
# DELAY  - postpone until the combat tag expires, then proceed
# CANCEL - abort an in-progress / queued teleport
# Unknown values fail safe to DENY.
# @type: enum
# @options: [ALLOW, DENY, DELAY, CANCEL]
# @default: DENY
pvpOnCombat: "DENY"

# Combat-state source preference.
# AUTO     - external combat-tag plugin if one is bound, else native tracker
# NATIVE   - always use RTP's native damage tracker
# EXTERNAL - only a bound combat-tag plugin (no native fallback)
# @type: enum
# @options: [AUTO, NATIVE, EXTERNAL]
# @default: AUTO
pvpSource: "AUTO"

# Native tracker: tag a player who TAKES PvP damage.
# @type: boolean
# @default: true
pvpTagVictim: true

# Native tracker: tag a player who DEALS PvP damage.
# @type: boolean
# @default: true
pvpTagAggressor: true

# DO NOT TOUCH VERSION NUMBER
version: 1.0
