# --- RTP Safety Configuration ---
# Documentation: https://github.com/DailyStruggle/RTP/blob/master/docs/admin/SAFETY.md

invulnerabilityTime: 5 # Seconds of invulnerability after teleport
safetyRadius: 0 # Block radius around landing to check for hazards
staleChunkRetryLimit: 2 # Max retries for stale-chunk guard
anvilPrefilterEnabled: true # Off-thread safety probe (Spigot only)
platformRadius: -1 # Radius of emergency platform (-1 to disable)
platformDepth: 1 # Depth of platform
platformAirHeight: 2 # Air space above platform
platformMaterial: GLASS # Material for platform

airBlocks:
  - AIR
  - CAVE_AIR
  - VOID_AIR
  - LEGACY_AIR
  - STRUCTURE_VOID
  - LIGHT
  - "#minecraft:flowers"
  - "#minecraft:small_flowers"
  # Note: #minecraft:tall_flowers is an item-only tag in vanilla; its members
  # (LILAC, PEONY, ROSE_BUSH, SUNFLOWER, PITCHER_PLANT) are already covered by
  # #minecraft:flowers above.
  - SHORT_GRASS
  - TALL_GRASS
  - SHORT_DRY_GRASS
  - TALL_DRY_GRASS
  - FERN
  - LARGE_FERN
  - DEAD_BUSH
  - BUSH
  - WILDFLOWERS
  - FIREFLY_BUSH
  - LEGACY_LONG_GRASS
  - LEGACY_DEAD_BUSH
  - "#minecraft:saplings"
  - BROWN_MUSHROOM
  - RED_MUSHROOM
  - CRIMSON_FUNGUS
  - WARPED_FUNGUS
  - "#minecraft:crops"
  - MELON_STEM
  - PUMPKIN_STEM
  - SUGAR_CANE
  - BAMBOO_SAPLING
  - VINE
  - GLOW_LICHEN
  - WEEPING_VINES
  - TWISTING_VINES
  - HANGING_ROOTS
  - PALE_HANGING_MOSS
  - RESIN_CLUMP
  - "#minecraft:rails"
  - REDSTONE_WIRE
  - COMPARATOR
  - REPEATER
  - LEVER
  - STRING
  - TRIPWIRE
  - TORCH
  - WALL_TORCH
  - SOUL_TORCH
  - SOUL_WALL_TORCH
  - REDSTONE_TORCH
  - REDSTONE_WALL_TORCH
  - END_ROD
  - "#minecraft:buttons"
  - "#minecraft:pressure_plates"
  - "#minecraft:standing_signs"
  - "#minecraft:wall_signs"
  - "#minecraft:ceiling_hanging_signs"
  - "#minecraft:wall_hanging_signs"
  - LEGACY_SIGN
  - LEGACY_WALL_SIGN
  - SNOW
  - MOSS_CARPET
  - PALE_MOSS_CARPET
  - LEAF_LITTER
  - "#minecraft:leaves"

unsafeBlocks:
  - WATER
  - LAVA
  - BUBBLE_COLUMN
  - "*[waterlogged=true]"
  - "#minecraft:fire"
  - POWDER_SNOW
  - MAGMA_BLOCK
  - "#minecraft:campfires"
  - CACTUS
  - SWEET_BERRY_BUSH
  - WITHER_ROSE
  - CHORUS_PLANT
  - CHORUS_FLOWER
  - POINTED_DRIPSTONE
  - COBWEB
  - CREAKING_HEART
  - BEDROCK
  - NETHER_PORTAL
  - END_PORTAL
  - END_GATEWAY
  - TNT
  - END_CRYSTAL
  - RESPAWN_ANCHOR
  - SEAGRASS
  - TALL_SEAGRASS
  - KELP
  - KELP_PLANT
  - "#minecraft:logs"

biomeWhitelist: false # If true, 'biomes' is a whitelist; otherwise a blacklist
biomes:
