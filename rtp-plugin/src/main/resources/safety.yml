# --- RTP Safety Configuration ---
# Configures how the plugin determines if a teleport location is "safe".
#
# Token grammar (ADR-017):
#   MATERIAL                          -- plain material, e.g. LAVA
#   MATERIAL[prop=val,prop2=val2]     -- material only when ALL block-state properties match
#   #namespace:tag                    -- expands to every material in that block tag
#   #namespace:tag[prop=val]          -- tag members only when properties match
#   *[prop=val]                       -- ANY material when properties match (wildcard)
#
# Property values are compared case-insensitively against the string form of
# Bukkit's BlockData. Unknown tags expand to the empty set (no-op, fail-open);
# malformed tokens are logged once at WARN level on reload (REQ-RTP-S-004).
# Order within a list does not matter.

# Invulnerability (Seconds)
# Duration of invulnerability granted to the player after teleporting.
# Prevents damage from fire, drowning, or falls upon arrival.
invulnerabilityTime: 5

# Safety Check Radius (Blocks)
# Radius around the target block to check for dangerous conditions.
# Larger values ensure more safety but can make finding a spot harder.
safetyRadius: 0

# Stale-Chunk Retry Limit (count)
# Bounded retry budget for the stale-chunk guard (ADR-015 / REQ-RTP-S-005).
# After an async chunk load resolves, the follow-up block-evaluation task is
# enqueued on a Count-Bound task pipe (Folia Region Thread scheduler). If the
# pipe is backlogged, the native chunk GC may unload the chunk before the task
# runs, which would otherwise trigger a synchronous chunk load on the Region
# Thread and trip the Folia Watchdog. When this guard detects the race, it
# re-queues an async chunk load up to this many times per candidate. On
# exhaustion the candidate is rejected through the normal "unsafe" path
# (a WARN is logged; nothing is silently discarded).
# Default: 2. Only raise on forks with hyper-aggressive chunk GC.
staleChunkRetryLimit: 2

# Anvil Read-Only Pre-filter (vanilla Spigot only)
# Off-thread safety probe that parses the persisted `r.X.Z.mca` region file and
# rejects clearly-unsafe candidates (lava/magma/fire at the heightmap surface)
# before requesting the authoritative live chunk load. Reduces tick-thread
# pressure on vanilla Spigot where the live chunk-load API is not truly async.
# Has no effect on Paper or Folia (they override the chunk-load path with
# native async APIs and never enter the pre-filter).
# The live chunk.isSafe(...) re-check remains the authoritative source of truth
# on ACCEPT; REJECT is the only short-circuit. See ADR-016 / REQ-RTP-S-005.
# Default: true. Set to false to disable the probe (useful on modded forks with
# exotic region formats).
anvilPrefilterEnabled: true

# Landing Platforms
# Creates a landing platform at the teleport destination.
# centre block is chosen based on the block type at the location.
# Set platformRadius to -1 to disable platforms.
# Default is -1 (disabled) — modern safety checks (chunk.isSafe + vert-adjustor) reliably
# produce solid-ground landings, so the emergency glass-block platform is off by default.
# Increase to 0+ only if you still see unsafe landings and want the legacy fallback.
platformRadius: -1
platformDepth: 1

# Height of air to ensure above the platform.
# May cause lighting issues if set too high.
platformAirHeight: 2

# Default block type for the platform if no solid block exists.
platformMaterial: GLASS

# Air Blocks
# Material types treated as walkable / non-blocking space above the landing.
# Uses vanilla block tags where possible to stay forward-compatible with new
# Mojang additions (e.g. a new flower variant added in a future MC release
# is automatically picked up by #minecraft:small_flowers without a config edit).
airBlocks:
  # True air variants (no tag covers all of these together)
  - AIR
  - CAVE_AIR
  - VOID_AIR
  - LEGACY_AIR
  - STRUCTURE_VOID
  - LIGHT

  # Flowers (covers dandelion, poppies, tulips, eyeblossoms, torchflower, ...)
  - "#minecraft:flowers"
  - "#minecraft:small_flowers"
  - "#minecraft:tall_flowers"

  # Grass-like plants and bushes not in the flowers tags
  - SHORT_GRASS
  - TALL_GRASS
  - SHORT_DRY_GRASS
  - TALL_DRY_GRASS
  - FERN
  - LARGE_FERN
  - DEAD_BUSH
  - BUSH
  - WILDFLOWERS
  - FIREFLY_BUSH
  - LEGACY_LONG_GRASS
  - LEGACY_DEAD_BUSH

  # Saplings, propagules, and fungi
  - "#minecraft:saplings"
  - BROWN_MUSHROOM
  - RED_MUSHROOM
  - CRIMSON_FUNGUS
  - WARPED_FUNGUS

  # Crops and surface flora not in a convenient tag
  - "#minecraft:crops"
  - MELON_STEM
  - PUMPKIN_STEM
  - SUGAR_CANE
  - BAMBOO_SAPLING

  # Vines and wall-mounted flora
  - VINE
  - GLOW_LICHEN
  - WEEPING_VINES
  - TWISTING_VINES
  - HANGING_ROOTS
  - PALE_HANGING_MOSS
  - RESIN_CLUMP

  # Rails
  - "#minecraft:rails"

  # Redstone and mechanisms (no grouping tag exists)
  - REDSTONE_WIRE
  - COMPARATOR
  - REPEATER
  - LEVER
  - STRING
  - TRIPWIRE

  # Torches and lighting (no grouping tag)
  - TORCH
  - WALL_TORCH
  - SOUL_TORCH
  - SOUL_WALL_TORCH
  - REDSTONE_TORCH
  - REDSTONE_WALL_TORCH
  - END_ROD

  # Buttons (stone + wooden variants)
  - "#minecraft:buttons"

  # Pressure plates
  - "#minecraft:pressure_plates"

  # Signs -- all standing/wall/hanging variants in four tags
  - "#minecraft:standing_signs"
  - "#minecraft:wall_signs"
  - "#minecraft:ceiling_hanging_signs"
  - "#minecraft:wall_hanging_signs"
  - LEGACY_SIGN
  - LEGACY_WALL_SIGN

  # Ground cover
  - SNOW
  - MOSS_CARPET
  - PALE_MOSS_CARPET
  - LEAF_LITTER

# Unsafe Blocks
# Materials or block-states the plugin will reject as a landing target or any
# block within `safetyRadius` of the target. Supports state predicates and
# wildcards (see grammar at top of file).
unsafeBlocks:
  # Fluids
  - WATER
  - LAVA
  - BUBBLE_COLUMN

  # Any waterlogged block (slabs/stairs/fences/walls/signs/chains/...) --
  # replaces the legacy 'WATERLOGGED' pseudo-token. Uses ADR-017 wildcard.
  - "*[waterlogged=true]"

  # Fire and heat hazards
  - "#minecraft:fire"
  - POWDER_SNOW
  - MAGMA_BLOCK

  # Campfires (both lit and unlit are unsafe -- players sink into them)
  - "#minecraft:campfires"

  # Contact damage / entrapment
  - CACTUS
  - SWEET_BERRY_BUSH
  - WITHER_ROSE
  - POINTED_DRIPSTONE
  - COBWEB
  - CREAKING_HEART

  # Void / portal / immovable
  - BEDROCK
  - NETHER_PORTAL
  - END_PORTAL
  - END_GATEWAY

  # Explosives
  - TNT
  - END_CRYSTAL
  - RESPAWN_ANCHOR

  # Aquatic flora (drown risk)
  - SEAGRASS
  - TALL_SEAGRASS
  - KELP
  - KELP_PLANT

# Biome Filter
# biomeWhitelist: false -> `biomes` list is a blacklist (skip these biomes)
#                  true  -> `biomes` list is a whitelist (only allow these biomes)
# The default blacklist excludes oceans, rivers, void, and other biomes where
# a safe solid-ground landing is unlikely or impossible.
biomeWhitelist: false
biomes:
  # OCEAN BIOMES
  - OCEAN
  - DEEP_OCEAN
  - WARM_OCEAN
  - LUKEWARM_OCEAN
  - DEEP_LUKEWARM_OCEAN
  - COLD_OCEAN
  - DEEP_COLD_OCEAN
  - FROZEN_OCEAN
  - DEEP_FROZEN_OCEAN

  # RIVER BIOMES
  - RIVER
  - FROZEN_RIVER

  # ADJACENT AND COASTAL BIOMES
  - BEACH
  - SNOWY_BEACH
  - STONY_SHORE
  - SWAMP
  - MANGROVE_SWAMP

  # END BIOMES (no solid landing / void-adjacent)
  - SMALL_END_ISLANDS

  # NETHER BIOMES (dangerous/irregular terrain)
  - BASALT_DELTAS

  # TECHNICAL BIOMES
  - THE_VOID

# DO NOT TOUCH VERSION NUMBER
version: "1.0"
