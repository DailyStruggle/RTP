# --- RTP Economy Settings ---
# Documentation: https://github.com/DailyStruggle/RTP/wiki/Economy

# Cost for a /rtp.
# @type: number
# @range: [0.0, null]
# @default: 50.0
price: 50.0

# Extra cost to /rtp another player.
# @type: number
# @range: [0.0, null]
# @default: 200.0
priceOther: 200.0

# Extra cost when you add parameters to /rtp.
# @type: number
# @range: [0.0, null]
# @default: 1000000000.0
paramsPrice: 1000000000.0

# Extra cost when you pick a biome.
# @type: number
# @range: [0.0, null]
# @default: 5000.0
biomePrice: 5000.0

# Give money back if the teleport is cancelled.
# @type: boolean
# @default: true
refundOnCancel: true

# Lowest balance you can have left after paying.
# @type: number
# @range: [0.0, null]
# @default: 0.0
balanceFloor: 0.0

# DO NOT TOUCH VERSION NUMBER
version: 1.1
