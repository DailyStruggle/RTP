# --- RTP Economy Settings ---
# Documentation: https://github.com/DailyStruggle/RTP/wiki/Economy
# Base cost charged for a successful /rtp.
# @type: number
# @range: [0.0, null]
# @default: 50.0
price: 50.0

# Extra cost charged when teleporting another player (/rtp <other>).
# @type: number
# @range: [0.0, null]
# @default: 200.0
priceOther: 200.0

# Extra cost charged when supplying parameters to /rtp.
# @type: number
# @range: [0.0, null]
# @default: 1000000000.0
paramsPrice: 1000000000.0

# Extra cost charged when specifying a biome in /rtp parameters.
# @type: number
# @range: [0.0, null]
# @default: 5000.0
biomePrice: 5000.0

# Refund the cost if the teleport is cancelled (player moves, failure, etc.).
# @type: boolean
# @default: true
refundOnCancel: true

# Minimum balance the player must retain after paying; teleport is rejected
# if it would drop below this floor.
# @type: number
# @range: [0.0, null]
# @default: 0.0
balanceFloor: 0.0

# DO NOT TOUCH VERSION NUMBER
version: 1.1
