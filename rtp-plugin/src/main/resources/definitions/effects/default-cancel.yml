# --- effects/default-cancel.yml: plays when a teleport is cancelled ---
# Docs: plugins/RTP/docs/admin/configuration/EVENTS_AND_EFFECTS.md (see effects/default.yml too)

when: cancel
effects:
  # Use whole numbers. Volume/pitch are percent (100 = full).
  - SOUND.BLOCK_NOTE_BLOCK_BASS.100.50.0.0.0

version: "1.0"
