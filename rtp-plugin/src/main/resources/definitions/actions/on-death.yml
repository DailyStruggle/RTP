# --- actions/on-death.yml ---
# Free sample scripted action (ADR-093): respawn-after-death random teleport.
# This reproduces justRTP's "respawn RTP after death" via an event-triggered action.
# Bind this action id to the respawn/death event in your event config.

alias: "deathscatter"
permission: "rtp.action.ondeath"
description: "Scatter players to a fresh safe spot when they respawn."

placement:
  region: "default"
  profile: "square"
  anchor: "regionQueue"
  parameters:
    subspaceChunkRadius: 4
    minSeparation: 16
    elevationTolerance: 8

confinement:
  boundary: "SUBSPACE"
  duration: "0s"

lifecycle:
  onStart:
    - PLAYER: "msg &aRespawned in the wild - good luck out there."

version: "1.0"
