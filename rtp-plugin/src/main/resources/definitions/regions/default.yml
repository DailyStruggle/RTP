# --- RTP Region Configuration ---
# Documentation: docs/admin/configuration/REGIONS.md

# Target world for this region (e.g. "world", "world_nether", "world_the_end").
# "[0]" = main overworld. Do NOT change default.yml to "world_nether" unless you want ALL
# worlds to send players to the nether; instead create a new region (e.g. definitions/regions/nether.yml
# with world: "world_nether", vert.maxY: 120, vert.requireSkyLight: false) and map it in
# definitions/worlds/world_nether.yml (region: "nether") via /rtp editor, /rtp admin setup, or config.
# @type: enum
# @source: world
world: "[0]"

# Not generally recommended: when true, replaces the whole shape block with a square matching
# the vanilla /worldborder and ignores shape, radius, centerRadius, centerX, and centerZ.
# Prefer setting shape.radius with a distance unit suffix (e.g. shape.radius: 2500b or 5km) in
# /rtp editor or definitions/regions/<region>.yml so you keep your shape and inner centerRadius hole.
worldBorderOverride: false

# Spawn area shape and size.
#
# Write distances with a unit suffix: 4096b (blocks), 10km (kilometers), 256c (chunks), or 4r (region files).
# Bare numbers without a suffix default to chunks (1 chunk = 16 blocks).
# radius is the outer edge (nobody lands past it), centerRadius is the inner edge / donut hole
# (nobody lands inside it), and centerRadius must stay below radius or there is no land left to pick from.
#
# Recommended ways to configure your region shape and radius:
#   1. Visual browser workspace: run `/rtp editor` to drag region borders on the map and edit settings.
#   2. Guided setup or command: run `/rtp admin setup` or `/rtp config regions default shape.radius=5km`.
#   3. Region file (`definitions/regions/<region>.yml`): replace "@config" with an inline `shape:` block
#      (or edit the starter fallback `defaults.shape` in config.yml).
#
# See docs/admin/configuration/REGIONS.md and docs/admin/WEB_EDITOR_GUIDE.md
# Example inline shape block:
#   shape:
#     name: "CIRCLE"
#     mode: "REROLL"
#     radius: 4096b
#     centerRadius: 1024b
shape: "@config"

# Vertical landing window (minY, maxY, requireSkyLight, maxHillAngle). Configure in `/rtp editor`,
# `/rtp config regions default vert.<key>=<value>`, or replace "@config" with an inline `vert:` block
# here ("@config" inherits the starter fallback `defaults.vert` from config.yml).
# See docs/admin/configuration/REGIONS.md
# Replace with an inline block to override per-region (e.g. for Nether or cave worlds):
#   vert:
#     name: "LINEAR"
#     minY: 32
#     maxY: 120
#     direction: 2
#     requireSkyLight: false
#     # Refuse landings on hillsides or cliff edges this steep or steeper, in degrees.
#     # "off" (fastest, default), 30, 45 or 60.
#     maxHillAngle: 30
vert: "@config"

# If true, rtp.regions.<name> is required. "@config" inherits defaults.requirePermission
# from config.yml. See docs/admin/configuration/CORE_CONFIG.md
# Replace with a literal to override per-region, e.g.:
#   requirePermission: true
requirePermission: "@config"

# Region to redirect to if no permission
# @type: enum
# @source: region
override: "default"

# Economy cost override for this region (added on top of the economy.yml base price).
# Use "@economy" to inherit the base price from economy.yml instead of a literal.
# See docs/admin/configuration/ECONOMY.md
# Replace with a number or the inheritance token to override per-region, e.g.:
#   price: 100.0
#   price: "@economy"
price: 0.0

# Optional cosmetic display name shown in /rtp info and the GUI menu. Does NOT
# change the region's identity (commands/permissions still use the file name).
# Supports color codes (e.g. &#55ff55 or &a). Defaults to the region name.
# displayName: "&#55ff55Wild Overworld"

# --- Advanced (cache/precision tuning; defaults suit most servers) ---
# Each "@config" inherits the matching defaults.<key> value from config.yml;
# replace with a number to override per-region. See:
#   docs/admin/configuration/CORE_CONFIG.md
#   docs/admin/configuration/REGIONS.md
# Max pre-calculated safe locations. Example override:
#   cacheCap: 64
cacheCap: "@config"

# Backlog cache capacity for candidate locations pre-filtered before full safety checks. 0 disables it.
# Example override:
#   backlogCacheCap: 1000
backlogCacheCap: "@config"

# Max chunks kept loaded for zero-latency. Example override:
#   activeChunkCap: 10
activeChunkCap: "@config"

# Precision for bad-location tracking (any positive integer, or "auto"). Example override:
#   spatialResolution: "auto"
spatialResolution: "@config"

# DO NOT TOUCH VERSION NUMBER
version: "1.1"
