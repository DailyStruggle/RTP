# --- RTP Core Configuration ---
# Documentation: https://github.com/DailyStruggle/RTP/wiki/Core-Configuration
# Pick your language in language.yml.
#
# Where to find things (files/folders in this RTP folder):
#   config.yml    - this file: core teleport behavior and shared defaults
#   safety.yml    - where players may or may not land (blocks, biomes)
#   economy.yml   - charge players for /rtp (needs Vault)
#   language.yml  - pick your language
#   messages/     - all player-facing text (commands, player, system, network, placeholders)
#   effects/      - particle and sound effects on teleport
#   regions/      - per-region settings
#   worlds/       - per-world settings
#   advanced/     - tuning you usually do not need (performance, database, logging, metrics, network, biomes, blocks)
#   lang/         - bundled translations
#   addons/       - config for optional add-ons (countdown, GUI menu, claim integrations)
# Seconds to wait before teleporting. 0 = right away.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 2
teleportDelay: 2

# How far you can move before the teleport cancels.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 2
cancelDistance: 2

# Wait time between /rtp uses. Skipped by rtp.nocooldown.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 300
teleportCooldown: 300

# Max /rtp uses before lockout. 0 = no limit. Skipped by rtp.nolock.
# @type: integer
# @range: [0, null]
# @default: 0
lockAfterUses: 0

# Seconds until the use count resets. 0 = never resets.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 0
lockAfterResetSeconds: 0

# true = set your spawn point where you land.
# @type: boolean
# @default: false
setRespawnOnTeleport: false

# Console commands run after teleport. [player] = the player's name.
# @type: list<string>
consoleCommands:
  - "say [player] has just randomly teleported!"

# Commands run as the player after teleport. [player] = their name.
# @type: list<string>
playerCommands:
  - ""

# Menu look. renderer = list of styles to try in order.
menu:
  # Menu styles to try; first one that works wins.
  # @type: list<enum>
  # @options: ["book", "chat"]
  renderer:
    - "book"

# Shared defaults. A region/world value of "@config" copies the matching entry below,
# so you change a setting once here instead of in every region file.
defaults:
  # Default area shape and size. radius/centerRadius = how far out you land, measured in chunks.
  shape:
    # Landing area shape algorithm.
    # @type: enum
    # @source: shape
    name: "CIRCLE"
    mode: "ACCUMULATE"
    radius: 256
    centerRadius: 64
    centerX: 0
    centerZ: 0
    weight: 1.0
    # Keep spots from being reused. 0 = off, 1 = the landing chunk, N = bigger square.
    uniquePlacements: 0
    expand: false
  # Default high/low landing window.
  vert:
    # Vertical placement algorithm.
    # @type: enum
    # @source: vert
    name: "LINEAR"
    minY: 32
    maxY: 255
    # Search order: 0 = bottom-up, 1 = top-down, 2 = middle-out, 3 = edges-in, else random.
    direction: 2
    requireSkyLight: true
  # How many safe spots to pre-calculate.
  cacheCap: 50
  # Extra unverified spots kept ready. 0 = off.
  backlogCacheCap: 1000
  # Max chunks kept loaded for instant teleports.
  activeChunkCap: 10
  # Bad-spot tracking precision (1-5).
  spatialResolution: 3
  # Whether regions/worlds need permission.
  requirePermission: false

# DO NOT TOUCH VERSION NUMBER
version: 3.1
