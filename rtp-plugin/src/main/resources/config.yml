# --- RTP Core Configuration ---
# Documentation: https://github.com/DailyStruggle/RTP/blob/master/docs/admin/CORE_CONFIG.md

# Locale selection now lives in language.yml (loaded before config.yml).
teleportDelay: 2 # Wait time (seconds) before teleport
cancelDistance: 2 # Max move distance during delay before cancellation
teleportCooldown: 300 # Wait time (seconds) between successful uses

consoleCommands:
  - "say [player] has just randomly teleported!"
playerCommands:
  - ""

database:
  type: "sqlite" # yaml, sqlite, mysql, or postgresql
  host: "127.0.0.1"
  port: 3306
  name: "rtp"
  username: "root"
  password: "password"

network:
  redis:
    enabled: false
    host: "127.0.0.1"
    port: 6379
    password: ""

# DO NOT TOUCH VERSION NUMBER
version: "3.0"
