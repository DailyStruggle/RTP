# --- RTP Integration Settings ---
# Each toggle rerolls the destination when it lands inside a claim/region
# owned by the named plugin (only active when that plugin is installed).
# Reroll the location if it lands inside a SaberFactions claim.
# @type: boolean
# @default: false
rerollSaberFactions: false

# Reroll the location if it lands inside Factions territory reported via the FactionsBridge API.
# FactionsBridge bridges many Factions forks (FactionsUUID, SaberFactions, FactionsX, KingdomsX, ...)
# behind one API; enable this when the FactionsBridge plugin is installed.
# @type: boolean
# @default: false
rerollFactionsBridge: false

# Reroll the location if it lands inside a GriefDefender claim.
# @type: boolean
# @default: false
rerollGriefDefender: false

# Reroll the location if it lands inside a GriefPrevention claim.
# @type: boolean
# @default: false
rerollGriefPrevention: false

# Reroll the location if it lands inside a Lands claim.
# @type: boolean
# @default: false
rerollLands: false

# Reroll the location if it lands inside a RedProtect region.
# @type: boolean
# @default: false
rerollRedProtect: false

# Reroll the location if it lands inside a Residence claim.
# @type: boolean
# @default: false
rerollResidence: false

# Reroll the location if it lands inside a CrashClaim claim.
# @type: boolean
# @default: false
rerollCrashClaim: false

# Reroll the location if it lands inside a HuskClaims claim.
# @type: boolean
# @default: false
rerollHuskClaims: false

# Reroll the location if it lands inside KingdomsX claimed land.
# @type: boolean
# @default: false
rerollKingdomsX: false

# Reroll the location if it lands inside a Towny Advanced claim.
# @type: boolean
# @default: false
rerollTownyAdvanced: false

# Reroll the location if it lands inside a WorldGuard region.
# @type: boolean
# @default: false
rerollWorldGuard: false

# DO NOT TOUCH VERSION NUMBER
version: 1.0
