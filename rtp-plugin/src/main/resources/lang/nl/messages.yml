# --- RTP Berichten (Nederlands) ---
# Vertaling van de speler- en consoleberichten.
#
# BELANGRIJK:
#   - De sleutelnamen in dit bestand komen overeen met de rechterkolom
#     van lang/nl/messages.lang.yml. Als een sleutel daar ontbreekt,
#     wordt de Engelse basissleutel gebruikt.
#   - Behoud de plaatshouders tussen haakjes: [P0], [delay], [attempts],
#     [world], [region], [remainingCooldown], [scan_chunks], enz.
#   - Behoud de kleurcodes &a &e &c en hexadecimale codes (#2636ef).
#
# REQ-RTP-F-013 / ADR-020.
# ###############################################################################
# Sectie 1: Algemene instellingen
# ###############################################################################
plaatshouders:
  # P0
  - "[RTP]"

# ###############################################################################
# Sectie 2: Teletransport
# ###############################################################################
alTeletransporteert: "&e[P0] je wordt al geteletransporteerd!"

# if the plugin is currently reloading
teletransportGeweigerdHerladen: "&e[P0] teletransports zijn tijdelijk uitgeschakeld terwijl de plugin herlaadt. Probeer het over een ogenblik opnieuw."
vertragingsBericht: "&e[P0] Teletransporteren over [delay]. Beweeg niet."
chunkLaden: "&e[P0] Chunks laden, even geduld..."
teletransportBericht: "&e[P0] Geteletransporteerd in [attempts] pogingen, in [processingTime]"

# if teleport is cancelled
teletransportAnnuleren: "&e[P0] Teletransport geannuleerd!"

# if no safe places after reaching max attempts
# placeholder: [attempts] - the maximum number of attempts
onveilig: "&e[P0] geen veilige locatie gevonden in [attempts] pogingen"

# when the player is on cooldown
# placeholder: [remainingCooldown] - the remaining time
wachttijdBericht: "&e[P0] Je kunt pas weer teletransporteren over [remainingCooldown]"

# if the region doesn't have any locations queued and the player doesn't have rtp.unqueued permission
geenLocatiesInWachtrij: "#f5eb73[P0] er zijn momenteel geen locaties beschikbaar"

# when the queue line shifts
# placeholder: [spot] - the current position in line
wachtrijUpdate: "#2636ef[P0] jouw positie in de wachtrij: [spot]"

# if the player doesn't have enough money to teleport in the region
# placeholder: [money] - how much money is required for the command
onvoldoendeSaldo: "&e[P0] je hebt minimaal $[money] nodig."

# ###############################################################################
# Sectie 3: Tijdnotatie
# ###############################################################################
dagen: "d"
uren: "u"
minuten: "m"
seconden: "s"
milliseconden: "ms"

# ###############################################################################
# Sectie 4: Systeem en beheer
# ###############################################################################
oudBestand: "&b[P0] een oud [filename] gevonden. Bijwerken"

# detected a bukkit world that isn't in the config file
# placeholder: [world] - the world detected
nieuweWereld: "&b[P0] nieuwe wereld '[world]' gedetecteerd"

# world doesn't exist in bukkit
# placeholder: [world] - the world name
ongeldigeWereld: "&e[P0] wereld '[world]' kon niet worden gevonden"

# plugin reload/update text
# placeholder: [filename] - name of file
herladen: "&b[P0] [filename] laden..."
herladen_klaar: "&b[P0] [filename] succesvol geladen."
bijwerken: "&a[P0] [filename] bijwerken..."
bijgewerkt: "&a[P0] [filename] succesvol bijgewerkt."

# plugin doesn't have the command the user requested
# placeholder: [arg] - the argument attempted
ongeldigArgument: "&c[P0] ongeldig opdrachtargument [arg]"

# when the console tries to run a command meant only for players
consoleOpdrachNietToegestaan: "&c[P0] Je moet een speler in het spel zijn om dit commando uit te voeren."

# plugin is busy reloading
busy: "&c[P0] bezig"

# plugin doesn't have the subcommand or parameter the user requested
# placeholder: [arg] - the argument attempted
invalidCommand: "&c[P0] ongeldig commando - [arg]"

# user doesn't have permission for the command requested
geenRechten: "&eSorry, maar je hebt geen toestemming om dit commando uit te voeren. Neem contact op met de serverbeheerders als je denkt dat dit een fout is."

# ###############################################################################
# Sectie 5: Beheerderslogboeken
# ###############################################################################
locatieOpgeslagen: "&e[P0] [amount] locaties succesvol opgeslagen voor [region]"
locatieGeladen: "&e[P0] [amount] locaties succesvol geladen voor [region]"

# ###############################################################################
# Sectie 6: Scan-opdracht
# ###############################################################################
scanStarten: "&a[P0] scantaak gestart voor regio's: [scan_regions]"
scanResetten: "&e[P0] scanwachtrij gereset voor regio's: [scan_regions]"
scanAnnuleren: "&e[P0] scantaak geannuleerd voor regio's: [scan_regions]"
scanPauze: "#A020F0[P0] scantaak gepauzeerd voor regio's: [scan_regions]"
scanHervatten: "#10A5F5[P0] scantaak hervat voor regio's: [scan_regions]"
scanActief: "&c[P0] er is al een scantaak actief voor regio's: [scan_regions]"
scanNietActief: "&c[P0] er is geen scantaak actief voor regio's: [scan_regions]"
# placeholder: [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
scanStatus: "&a[P0] [scan_chunks] / [scan_totalChunks] chunks voltooid voor regio's: [scan_regions]. [scan_cps] cps. Landpercentage: [scan_landPercentage]%. Resterende tijd: [scan_eta]"

# ###############################################################################
# Sectie 7: Info-opdracht
# ###############################################################################
titelInfo: "&a======RTP Informatie======"
infoTickets: "&7Actieve globale chunk-tickets: &f[tickets]"
infoTeletransports: "&7Actieve teletransport-toestandsmachines: &f[teleports]"
infoMSPT: "&7Huidige plugin MSPT: &f[mspt]"
infoTotaalLadingen: "&7Levenslange geladen chunks: &f[loads]"
infoLoadsByOrigin: "&7Loads by Origin: &f[loadsByOrigin]"
infoLekSnelheid: "&7Huidige chunk-leksnelheid: &f[leakRate]"
# --- Metrics SPI health block (METRICS_PLAN.md > /rtp info Surface) ---
infoQueueDepth: "&7Players Waiting In Region Queues: &f[queueDepth]"
infoPendingTeleports: "&7Pending Teleport Pipelines: &f[pendingTeleports]"
infoAvgPipelineMs: "&7Avg Pipeline Latency: &f[avgPipelineMs] ms"
infoHeap: "&7JVM Heap: &f[heapUsedMb] / [heapMaxMb] MiB"
# Header line for the Health pipeline labelled block in /rtp info.
infoHealthPipelineHeader: "&7--- Health: pipeline ---"
# TPS readout for the 1m / 5m / 15m windows. Placeholders: [tps1m] [tps5m] [tps15m].
infoTps: "&7TPS (1m/5m/15m): &f[tps1m] / [tps5m] / [tps15m]"
# Live server MSPT and tick-budget utilisation. Placeholders: [mspt] [tickBudgetUtilisation].
infoMSPTLive: "&7Server MSPT: &f[mspt] ms (&7tick budget: &f[tickBudgetUtilisation]&7)"
# Configured player soft-cap vs current online count. Placeholders: [softCap] [playerCount].
infoSoftCap: "&7Players: &f[playerCount] / [softCap]"
# Most recent database round-trip latency in ms. Placeholder: [databaseLatencyMs].
infoDatabaseLatencyMs: "&7Database Latency: &f[databaseLatencyMs] ms"
# Health colour-band thresholds. Doubles consumed by ColourBands in rtp-core
# to wrap coloured-variant placeholders (e.g. [tps1mColoured]) with &a/&e/&c.
infoThresholdTpsGreen: 19.5
infoThresholdTpsYellow: 18.0
infoThresholdMsptGreen: 30.0
infoThresholdMsptYellow: 45.0
infoThresholdCacheFillGreen: 0.5
infoThresholdCacheFillYellow: 0.25
infoThresholdNetworkAgeYellow: 5.0
# Header line introducing the per-Folia-region table (Folia runtime only).
infoFoliaRegionsHeader: "&7--- Folia regions ---"
# Per-row template for a single Folia region. Placeholders: [regionId] [tps1m]
# [mspt] [playerCount] [queueDepth] [tickBudgetUtilisation].
infoFoliaRegion: "  &f[regionId]&7: tps=&f[tps1m]&7 mspt=&f[mspt]&7 players=&f[playerCount]&7 queue=&f[queueDepth]&7 budget=&f[tickBudgetUtilisation]"
infoDisclaimerKoptekst: "&7--- Diagnostische opmerking ---"
infoDisclaimer: "&7Diagnostische opmerking: Als het totale aantal verweesde chunks op de server het historische totaal van ladingen door deze plugin ([loads]) overschrijdt, is deze plugin niet de enige oorzaak van het geheugenlek."
infoWereldKoptekst: "#008080Werelden:"
infoConsoleWereldKoptekst: "&7--- Werelden ---"
infoWereld: "  #21ADA8[world]"
infoRegioKoptekst: "#63C5DARegio's:"
infoConsoleRegioKoptekst: "&7--- Regio's ---"
infoRegio: "  #52B2BF[region]"

# sub-info listings
# placeholders: [world], [region], [requirePermission], [override], [shape], [worldBorderOverride], [cacheCap], [cached], [keptCache], [unkeptCache], [backlogCache], [backlogCacheCap]
wereldGegevens:
  - "#21ADA8[world]:"
  - "#99EEBB  - regio: [region]"
  - "#99EEBB  - toestemmingVereist: [requirePermission]"
  - "#99EEBB  - overschrijven: [override]"

regioGegevens:
  - "#52B2BF[region]:"
  - "#58CCED  - wereld: [world]"
  - "#58CCED  - vorm: [shape]"
  - "#58CCED  - toestemmingVereist: [requirePermission]"
  - "#58CCED  - wereldgrensOverschrijving: [worldBorderOverride]"
  - "#58CCED  - cacheCapaciteit: [cacheCap]"
  - "#58CCED  - behoudCache (L1): [keptCache]"
  - "#58CCED  - vrijgegevenCache (L2): [unkeptCache]"
  - "#58CCED  - achterstandCache (L3): [backlogCache] / [backlogCacheCap]"
  - "#58CCED  - inCache: [cached]"

# ###############################################################################
# Sectie 8: Opdrachtbeschrijvingen
# ###############################################################################
rtp: "&b/rtp - teletransporteer naar een willekeurige locatie"
rtp_beschrijving: "teletransporteer naar een willekeurige locatie"
hulp: "&b/rtp help - deze hulp weergeven"
hulp_beschrijving: "opdrachten beschrijven"
herladen_opdracht: "&b/rtp reload - configuratiebestanden herladen"
herladen_beschrijving: "configuratiebestanden herladen"
scan: "&b/rtp scan - alle mogelijke regiolocaties testen om laadtijden te verbeteren"
scan_beschrijving: "opgeslagen gegevens wissen en alle mogelijke regiolocaties testen"
config_beschrijving: "configuratiebestanden tijdens uitvoering bijwerken"
info_beschrijving: "huidige pluginstatus controleren"
test_beschrijving: "RTP-functies testen"

# ###############################################################################
# Section 8b: Generalized Menu Framework (ADR-035 / ADR-044)
# ###############################################################################
# Sent when a menu token is unknown, malformed, or belongs to another player.
menuInvalid: "&c[P0] that menu link is invalid."
# Sent when a menu token has expired or was already consumed.
menuExpired: "&c[P0] that menu link has expired. Please reopen the menu."
# Sent when a menu redeem cannot resolve the calling player UUID.
menuUnknownPlayer: "&c[P0] menu links can only be used by in-game players."
# Hover-fallback template used by the menu reflector when no YAML block-comment
# is available for a parameter. Placeholder: [type] - the declared parameter type.
menuHoverFallbackType: "type: [type]"
# Hover-fallback template used by the menu reflector when a parameter exposes a
# small curated value set. Placeholder: [values] - comma-joined accepted values.
menuHoverFallbackBounds: "accepted: [values]"
# Label for the "go back one level" navigation row prepended to every non-root menu page.
menuBack: "&7« back"
# Label template for the "execute the assembled command" row prepended to every
# runnable non-root menu page. Placeholder: [command] - the assembled /rtp ... invocation.
menuExecute: "&a▶ run [command]"
# Header row at the top of a parameter-value picker sub-page (Stage A.2).
# Placeholders: [param] - parameter name; [command] - assembled /rtp ... invocation.
menuPickValue: "&epick a value for [param] (will run: /rtp [command] [param]:<value>)"
# Label for the "type a custom value" fallback row on a parameter-value picker page.
# Clicking it prefills chat with the assembled command up to '<param>:' so the player
# can type any value, including ones not in the suggestion list.
menuTypeValue: "&7✎ type a custom value..."
# Non-clickable header row at the top of every non-root menu page (Stage A.4).
# Surfaces the currently-constructed /rtp invocation including any staged
# parameter assignments (name:value). Placeholder: [command] - assembled args.
menuConstructed: "&7building: &f/rtp [command]"
# Non-clickable title row prepended to the root /rtp menu page (Stage A.5).
# Provides a welcoming header before the player descends into any subcommand.
menuRootTitle: "&6&l⚡ RTP menu"
# Non-clickable subtitle/hint row prepended to the root /rtp menu page below
# menuRootTitle (Stage A.5). Short orientation text for first-time users.
menuRootHint: "&7click an option below to begin"
# Navigation rows appended to paginated menu pages (Stage A.6) — clicking
# them moves to the previous/next page of the same model. Placeholder:
# [page] - the 1-based human-readable target page number.
menuPagePrev: "&7« previous page ([page])"
menuPageNext: "&7next page ([page]) »"
# Section divider on the front page above teleport rows (player view).
menuFrontPageSectionTeleport: "&8--- &7teleport &8---"
# Section divider on the front page above admin rows (admin view).
menuFrontPageSectionAdmin: "&8--- &7admin &8---"
# Front-page rows. No placeholders.
menuFrontPageRowTeleport: "&a▶ /rtp &7- teleport to a random location"
menuFrontPageRowRegion: "&a▶ /rtp region:&7... &7- pick a region"
menuFrontPageRowBiome: "&a▶ /rtp biome:&7... &7- pick a biome"
menuFrontPageRowHelp: "&a▶ /rtp help &7- list commands"
menuFrontPageRowInfo: "&b▶ /rtp info &7- plugin diagnostics"
menuFrontPageRowConfig: "&b▶ /rtp config &7- edit config files"
menuFrontPageRowScan: "&b▶ /rtp scan &7- pre-fill region caches"
menuFrontPageRowDiagnostics: "&c▶ /rtp test full &7- run full diagnostics"
menuFrontPageRowReload: "&c▶ /rtp reload &7- reload config files"
# Hover text for the diagnostics row warning about cost. No placeholders.
menuFrontPageHoverDiagnostics: "&7runs full diagnostic suite; may be expensive"
# Hover text for the reload row warning about side-effects. No placeholders.
menuFrontPageHoverReload: "&7reloads all config files; in-flight teleports may be affected"

