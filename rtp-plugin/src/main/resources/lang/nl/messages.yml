################################################################################
# Sectie 7: Info-opdracht
################################################################################
titelInfo: "&a======RTP Informatie======"
infoTickets: "&7Actieve globale chunk-tickets: &f[tickets]"
infoTeletransports: "&7Actieve teletransport-toestandsmachines: &f[teleports]"
