# --- Taaltoewijzing: effects.yml ---
# Wijst interne configuratiesleutels (links) toe aan de namen die
# operators in effects.yml zien (rechts).
# Bewerk alleen de rechterkolom om opties te hernoemen of te vertalen;
# de linkerkolom is een codeconstante en mag niet worden gewijzigd.
# Als dit bestand ontbreekt, hergenereert de plugin automatisch een
# Engelse versie met identieke waarden aan beide kanten.
when: wanneer
permission: rechten
players: spelers
inherit: erft
effects: effecten
version: version
