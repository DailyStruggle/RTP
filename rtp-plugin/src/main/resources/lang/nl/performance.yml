# --- Prestatieconfiguratie van RTP ---
# Stem de plugin af op de serverprestaties.
# Maximaal aantal zoekpogingen
# Hoe vaak de plugin een veilige locatie zoekt voordat hij stopt.
# Impact: HOOG — hoge waarden kunnen het CPU-gebruik per verzoek sterk verhogen.
# @type: integer
# @range: [1, null]
# @default: 32
maximaalPogingen: 10

# Voorlaadafstand bestemming (chunks)
# Straal van chunks die rondom de bestemming worden voorgeladen.
# Aantal geladen chunks = ( 1 + 2 * straal )^2.
# Impact: HOOG — een te hoge waarde kan TPS-dalingen veroorzaken bij teletransport.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
zichtafstandSelectie: 0

# Chunkstraal die vlak vóór de teleport rond de eindlocatie wordt geladen.
# 0 laadt alleen de bestemmingschunk.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
zichtafstandTeletransport: 0

# Selectiefrequentie (spelticks)
# Tijd tussen zoekopdrachten naar nieuwe locaties om regiocaches te vullen.
# ( 20 ticks = 1 seconde ).
# Impact: GEMIDDELD — lagere waarden vullen de cache sneller maar gebruiken meer CPU.
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
periode: 20

# Toegewezen tijd per taak (milliseconden)
# Maximale tijd (ms) besteed aan RTP-taken per tick.
# Bereik: 0 - 50.
# Impact: GEMIDDELD — hoge waarden verwerken sneller maar riskeren ticktijd.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
synchroonToegewezenTijd: 50

# Maximaal aantal milliseconden per tick besteed aan asynchrone taken.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
asynchroonToegewezenTijd: 50

# Minimale TPS-vereiste
# Minimale server-TPS voordat een nieuwe locatie in de cache wordt geplaatst.
# Bereik: 0.0 - 20.0.
# Impact: LAAG — voorkomt dat de plugin lag toevoegt wanneer de server het moeilijk heeft.
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
minimaalTPS: 19.0

# Maximaal JVM-heapgebruik (percentage van de maximale heap) voordat het
# genereren van de achtergrondcache pauzeert. Elke gecachte locatie vergrendelt
# een chunk, dus een onbegrensde vulling op een server met een kleine heap kan
# de JVM in een constante garbage collection drijven en de server zonder
# consolefout onbereikbaar maken. Zolang het gebruik op of boven deze drempel
# ligt, stopt RTP met het aanvullen van de locatiecache, maar blijft het reeds
# gecachte locaties aan wachtende spelers leveren. 0 of 100 schakelt de grens
# uit.
# @type: number
# @range: [0.0, 100.0]
# @default: 85.0
maxHeapPercentage: 85.0

# Wachtrij na teletransport
# Als true probeert de plugin de locatiecache direct na een RTP te vullen.
# Impact: GEMIDDELD
# @type: boolean
# @default: false
wachtrij_naTeletransport: false

# Synchroon laden
# Gebruik synchroon chunkladen voor locatieselectie.
# Impact: HOOG — NIET AANBEVOLEN! Kan ernstige serverblokkades veroorzaken.
# @type: boolean
# @default: false
synchroonLaden: false

# Rechtenparsering (opstarten)
# verwerking_bijGebeurtenis: Incompatibel met brede rechten zoals *.*.
# Impact: GEMIDDELD (bijGebeurtenis) / LAAG (effect)
# @type: boolean
# @default: false
verwerking_bijGebeurtenis: false

# Effect-permissienodes bij het opstarten inlezen.
# @type: boolean
# @default: true
effectVerwerking: true

# Bioomselektiecache
# bioomHerinnering: Eerder gevonden locaties per bioom hergebruiken.
# bioomHerinnering_geforceerd: Alleen al ontdekte en gecachte biomen gebruiken.
# Impact: LAAG tot GEMIDDELD
# @type: boolean
# @default: true
bioomHerinnering: true

# Indien ingesteld worden biome-gefilterde verzoeken alleen uit de cache bediend
# (nooit nieuwe biome-zoekopdrachten). Vereist biomeRecall.
# @type: boolean
# @default: false
bioomHerinnering_geforceerd: false

# Beïnvloedt de biome-gefilterde selectie zo dat elk gevraagd biome met gelijke
# kans wordt aangestuurd, in plaats van naar rato van hoeveel van de regio het
# beslaat. Voorkomt dat veelvoorkomende biomes zeldzame verdringen wanneer er
# meerdere worden gevraagd. Vereist biomeRecall; geen effect op ongefilterde
# (standaardbiome-)teleports.
# @type: boolean
# @default: false
bioomGewogen: false

# Per-biome relative selection weights for biome-filtered teleports.
# Only consulted when biomeWeighted is true. Biomes not listed here use
# weight 1.0, so an empty/all-equal map reproduces the equal-probability
# behavior of biomeWeighted on its own. A biome given weight 2.0 is
# steered toward roughly twice as often as a weight-1.0 biome among the
# requested set (when both are present in biome-recall memory); 0.0
# suppresses a biome. Requires biomeRecall; no effect on unfiltered
# (default-biome) teleports. The shipped plains entry is a weight-1.0
# no-op example - replace or extend it with the biomes you want to bias.
# @type: map<string, number>
bioomGewichten:
  # Relatieve selectieweging voor dit biome (1.0 = geen bias).
  # @type: number
  # @range: [0.0, null]
  # @default: 1.0
  plains: 1.0
  sunflower_plains: 1.0
  snowy_plains: 1.0
  ice_spikes: 1.0
  desert: 1.0
  swamp: 1.0
  mangrove_swamp: 1.0
  forest: 1.0
  flower_forest: 1.0
  birch_forest: 1.0
  dark_forest: 1.0
  old_growth_birch_forest: 1.0
  old_growth_pine_taiga: 1.0
  old_growth_spruce_taiga: 1.0
  taiga: 1.0
  snowy_taiga: 1.0
  savanna: 1.0
  savanna_plateau: 1.0
  windswept_hills: 1.0
  windswept_gravelly_hills: 1.0
  windswept_forest: 1.0
  windswept_savanna: 1.0
  jungle: 1.0
  sparse_jungle: 1.0
  bamboo_jungle: 1.0
  badlands: 1.0
  eroded_badlands: 1.0
  wooded_badlands: 1.0
  meadow: 1.0
  cherry_grove: 1.0
  pale_garden: 1.0
  grove: 1.0
  snowy_slopes: 1.0
  frozen_peaks: 1.0
  jagged_peaks: 1.0
  stony_peaks: 1.0
  river: 1.0
  frozen_river: 1.0
  beach: 1.0
  snowy_beach: 1.0
  stony_shore: 1.0
  warm_ocean: 1.0
  lukewarm_ocean: 1.0
  deep_lukewarm_ocean: 1.0
  ocean: 1.0
  deep_ocean: 1.0
  cold_ocean: 1.0
  deep_cold_ocean: 1.0
  frozen_ocean: 1.0
  deep_frozen_ocean: 1.0
  mushroom_fields: 1.0
  dripstone_caves: 1.0
  lush_caves: 1.0
  deep_dark: 1.0
  # --- De Nether ---
  nether_wastes: 1.0
  warped_forest: 1.0
  crimson_forest: 1.0
  soul_sand_valley: 1.0
  basalt_deltas: 1.0
  # --- The End ---
  the_end: 1.0
  end_highlands: 1.0
  end_midlands: 1.0
  small_end_islands: 1.0
  end_barrens: 1.0
  # --- Overig / technisch ---
  the_void: 1.0

# Passieve chunkcontrole
# Zoekt naar veilige locaties in alle geladen chunks binnen het bereik van een regio.
# Impact: HOOG — kan de serverbelasting bij chunklaadgebeurtenissen aanzienlijk verhogen.
# @type: boolean
# @default: true
controleer_bijChunkLaden: true

# Achtergrondgegevensverzameling (Region Data Visitor)
# Wanneer de voorgenereercache vol is, wordt per regio één observerende
# RegionCacheTask gepland met dezelfde `periode`. Hergebruikt dezelfde
# LocationGenerator-pipeline maar verwerpt de veilige kandidaat in plaats van
# hem in de wachtrij te plaatsen, zodat bijeffecten (registratie van slechte
# locaties, bioomoogst) op de achtergrond worden opgebouwd zonder dat de
# wachtrij boven zijn limiet groeit. Genereert NOOIT wereldgeneratie: chunks
# die nog niet op schijf staan worden overgeslagen via het Anvil-voorfilter
# van met uitkomst UNKNOWN.
# bezoeker_ingeschakeld: hoofdschakelaar (true schakelt observatiemodus in).
# De cadans wordt overgenomen van de bovenstaande `periode`-instelling.
# Impact: LAAG — begrensd door de bestaande `periode`; werk alleen wanneer
# de cache geen ruimte heeft voor standaard vullingen.
# @type: boolean
# @default: false
bezoeker_ingeschakeld: true

# Houd een gereserveerde cache voor join-teleports (rtp.onevent.firstjoin / rtp.onevent.join). Grootte volgens de resterende vrije spelersslots. Zie
# @type: boolean
# @default: false
loginCacheIngeschakeld: false

# Harde bovengrens voor de join-cache. 0 = automatisch (server max-players bij opstart).
# @type: integer
# @range: [0, null]
# @default: 0
loginCacheLimiet: 0

# WIJZIG HET VERSIENUMMER NIET
# Probability [0.0, 1.0] of rejecting an ungenerated chunk per selection attempt. 0.0 = no bias (default), 1.0 = strictly avoid ungenerated land. Generated chunks always pass.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.0
voorgegenereerdVoorkeur: 0.0

# Fraction [0.0, 1.0] of L3 backlog capacity at which refill resumes (hysteresis). 0.5 = refill only after L3 drains to 50% (default). 1.0 = refill continuously.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.5
backlogBijvulDrempel: 0.5

# Latentiedrempel (ms) waarboven een direct bediende (niet-gewachtrijde) teleport
# wordt gecontroleerd: er wordt een WARN gelogd en de cumulatieve teller
# slowPipelineCount (getoond door /rtp info) verhoogd. Alleen directe/niet-gewachtrijde
# teleports worden gecontroleerd; gewachtrijde worden uitgesloten omdat hun gemeten
# tijd de wachtrijtijd bevat. 0 of lager schakelt de controle uit. Zie ADR-053.
# @type: integer
# @range: [0, null]
# @unit: ms
# @default: 5000
traagPipelineDrempelMs: 5000

# Diepte van de publieke teleportwachtrij (wachtende spelers) waarop of waarboven
# de wachtrij-tegendruk wordt gecontroleerd: er wordt een flankgetriggerde WARN
# gelogd en de cumulatieve teller queueGrowthWarnCount (getoond door /rtp info) wordt
# eenmaal per overschrijding verhoogd. 0 of lager schakelt de controle uit (opt-in). Zie ADR-053.
# @type: integer
# @range: [0, null]
# @unit: players
# @default: 0
wachtrijGroeiWaarschuwDrempel: 0

# Instellingen voor /rtp admin prefab. De apply -> confirm-stroom schrijft elk gewijzigd
# configuratiebestand met een back-up genaamd <file>.yml.bak.<epochMillis>;
# bakRetention beperkt hoeveel van zulke back-ups per bestand worden bewaard, oudste
# eerst verwijderd. Zet op 1 om alleen de nieuwste te bewaren; waarden onder 1 worden
# naar 1 bijgesteld. /rtp admin prefab rollback doorloopt back-ups nieuwste-eerst over
# meerdere aanroepen.
voorgevormd:
  # Number of timestamped config backups kept per file before pruning.
  # @type: integer
  # @range: [1, null]
  # @default: 3
  bakRetention: 3
# RAAK HET VERSIENUMMER NIET AAN
version: 1.0
