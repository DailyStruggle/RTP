# Blocks that disqualify a landing spot (lava, hazards, etc.).
# Accepts Bukkit Material names, "#minecraft:<tag>" tag references, and
# state predicates such as "*[waterlogged=true]".
# @type: list<material>
# @source: material
onveiligBlokken:
  - "WATER"
  - "LAVA"
  - "BUBBLE_COLUMN"
  - "*[waterlogged=true]"
  - "#minecraft:fire"
  - "POWDER_SNOW"
  - "MAGMA_BLOCK"
  - "#minecraft:campfires"
  - "CACTUS"
  - "SWEET_BERRY_BUSH"
