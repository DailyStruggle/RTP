# --- Veiligheidsconfiguratie van RTP ---
# Configureert hoe de plugin bepaalt of een teletransportlocatie "veilig" is.
# Token-grammatica:
# MATERIAAL -- enkel materiaal, bijv. LAVA
# MATERIAAL[eigenschap=waarde] -- materiaal alleen als ALLE blokeigenschappen overeenkomen
# #namespace:tag -- uitgebreid naar alle materialen van die tag
# #namespace:tag[eigenschap=waarde] -- tagleden alleen als eigenschappen overeenkomen
# *[eigenschap=waarde] -- ELK materiaal wanneer eigenschappen overeenkomen (wildcard)
# Eigenschapswaarden worden hoofdletterongevoelig vergeleken met de
# tekenreeksvorm van Bukkit BlockData. Onbekende tags worden uitgebreid
# naar de lege verzameling (no-op, fail-open); misvormde tokens worden
# eenmalig geregistreerd op WARN-niveau bij herladen .
# De volgorde binnen een lijst maakt niet uit.
# Onkwetsbaarheid (seconden)
# Duur van de onkwetsbaarheid die aan de speler wordt verleend na teletransport.
# Voorkomt schade door vuur, verdrinking of vallen bij aankomst.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 5
onkwetsbaarheidstijd: 5

# Veiligheidscontrolestraal (blokken)
# Straal rondom het doelblok om te controleren op gevaarlijke omstandigheden.
# Hogere waarden geven meer veiligheid maar maken het moeilijker een plek te vinden.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 0
veiligheidsStraal: 0

# Maximaal aantal pogingen voor verouderde chunk (telling)
# Begrensd pogingsbudget voor de verouderde-chunk-bewaker
# . Standaard: 2.
# @type: integer
# @range: [0, null]
# @default: 2
staleChunkRetryLimit: 2

# Anvil-alleen-lezen-voorfilter (alleen Spigot vanilla)
# Off-thread veiligheidssonde die het opgeslagen regiobestand analyseert
# en duidelijk onveilige kandidaten afwijst vóór het opvragen van de
# autoritatieve live-chunk. Zie
# Standaard: true. Stel in op false om de sonde uit te schakelen.
# @type: boolean
# @default: true
anvilPrefilterEnabled: true

# Landingsplatforms
# Maakt een landingsplatform op de teletransportbestemming.
# Stel platformStraal in op -1 om platforms uit te schakelen.
# @type: integer
# @range: [-1, null]
# @unit: blocks
# @default: -1
platformStraal: -1

# Depth (vertical thickness) of the emergency platform.
# @type: integer
# @range: [1, null]
# @unit: blocks
# @default: 1
platformDiepte: 1

# Air-space height cleared above the emergency platform.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 2
platformLuchtHoogte: 2

# Material used for the emergency landing platform.
# @type: material
# @source: material
# @default: GLASS
platformMateriaal: "GLASS"

# Blocks treated as passable air for landing-safety checks.
# Accepts Bukkit Material names and "#minecraft:<tag>" tag references
#.
# @type: list<material>
# @source: material
luchtBlokken:
  - "AIR"
  - "CAVE_AIR"
  - "VOID_AIR"
  - "LEGACY_AIR"
  - "STRUCTURE_VOID"
  - "LIGHT"
  - "#minecraft:flowers"
  - "#minecraft:small_flowers"
  # Opmerking: #minecraft:tall_flowers is in vanilla alleen een item-tag; zijn leden
  # (LILAC, PEONY, ROSE_BUSH, SUNFLOWER, PITCHER_PLANT) zijn al gedekt door
  # #minecraft:flowers hierboven.
  - "#minecraft:tall_flowers"
  - "SHORT_GRASS"
  - "TALL_GRASS"
  - "SHORT_DRY_GRASS"
  - "TALL_DRY_GRASS"
  - "FERN"
  - "LARGE_FERN"
  - "DEAD_BUSH"
  - "BUSH"
  - "WILDFLOWERS"
  - "FIREFLY_BUSH"
  - "LEGACY_LONG_GRASS"
  - "LEGACY_DEAD_BUSH"
  - "#minecraft:saplings"
  - "BROWN_MUSHROOM"
  - "RED_MUSHROOM"
  - "CRIMSON_FUNGUS"
  - "WARPED_FUNGUS"
