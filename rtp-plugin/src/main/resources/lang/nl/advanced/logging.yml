# Minimaal logniveau (het fijnste van dit en dat van de server-logger).
# ALL houdt het gedrag identiek aan de server-logger.
# @type: enum
# @options: [SEVERE, WARNING, INFO, CONFIG, FINE, FINER, FINEST, ALL, OFF]
# @default: ALL
min_niveau: "INFO"

# Basisactiviteitslogboeken
# opdracht: RTP-opdrachten uitgevoerd door spelers registreren
# teletransport: werkelijke teletransportgebeurtenissen registreren
# @type: boolean
# @default: false
opdracht: false

# Geslaagde teleportgebeurtenissen loggen
# @type: boolean
# @default: true
teletransport: true

# Foutopsporing bij selectiemislukkingen
# Registreert gedetailleerde informatie wanneer het selecteren van een veilige locatie mislukt,
# inclusief mislukkingspercentages en zoekparameters.
# @type: boolean
# @default: true
selectie_mislukking: true

# Automatische of gebeurtenisgestuurde RTP-logboeken
# Logboeken voor door gebeurtenissen geactiveerde RTP:
# Wanneer de speler van wereld wisselt
# @type: boolean
# @default: true
gebeurtenis_wereldWisseling: true

# Wanneer de speler de server betreedt
# @type: boolean
# @default: true
gebeurtenis_deelnemen: true

# Wanneer de speler herSpawnt
# @type: boolean
# @default: true
gebeurtenis_herSpawn: true

# Wanneer de speler beweegt (als bewegings-RTP actief is)
# @type: boolean
# @default: true
gebeurtenis_bewegen: true

# Wanneer de speler teletransporteert (als teletransport-RTP actief is)
# @type: boolean
# @default: true
gebeurtenis_teletransport: true

# --- Plugin-logboeken ---
# Schakelt logboekregistratie van verschillende pluginactiviteiten in of uit.
# Gedetailleerde systeemlogboeken
# gedetailleerd_herladen: alle herladen bestanden/secties registreren
# gedetailleerd_regioInit: initialisatie van elke regio registreren
# @type: boolean
# @default: false
gedetailleerd_herladen: false

# Details van regio-initialisatie loggen
# @type: boolean
# @default: false
gedetailleerd_regioInit: false

# Systeemlogboeken
# Gerelateerd aan achtergrondtaken en databasebewerkingen.
# @type: boolean
# @default: false
systeem_geheugenTracker: false

# Debuglogs voor database-activiteit
# @type: boolean
# @default: false
systeem_database: false

# WIJZIG HET VERSIENUMMER NIET
version: 1.0
