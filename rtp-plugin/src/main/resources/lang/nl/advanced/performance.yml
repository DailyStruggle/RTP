# Minimale TPS-vereiste
# Minimale server-TPS voordat een nieuwe locatie in de cache wordt geplaatst.
# Bereik: 0.0 - 20.0.
# Impact: LAAG — voorkomt dat de plugin lag toevoegt wanneer de server het moeilijk heeft.
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
minimaalTPS: 19.0

# Max. JVM-heapgebruik (% van max) voordat het achtergrond-cachevullen pauzeert.
# Reeds gecachte locaties worden nog bediend. 0 of 100 schakelt het uit.
# @type: number
# @range: [0.0, 100.0]
# @default: 85.0
maxHeapPercentage: 85.0

# --- Prestatieconfiguratie van RTP ---
# Stem de plugin af op de serverprestaties.
# Maximaal aantal zoekpogingen
# Hoe vaak de plugin een veilige locatie zoekt voordat hij stopt.
# Impact: HOOG — hoge waarden kunnen het CPU-gebruik per verzoek sterk verhogen.
# @type: integer
# @range: [1, null]
# @default: 32
maximaalPogingen: 10

# Selectiefrequentie (spelticks)
# Tijd tussen zoekopdrachten naar nieuwe locaties om regiocaches te vullen.
# ( 20 ticks = 1 seconde ).
# Impact: GEMIDDELD — lagere waarden vullen de cache sneller maar gebruiken meer CPU.
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
periode: 20

# Toegewezen tijd per taak (milliseconden)
# Maximale tijd (ms) besteed aan RTP-taken per tick.
# Bereik: 0 - 50.
# Impact: GEMIDDELD — hoge waarden verwerken sneller maar riskeren ticktijd.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
synchroonToegewezenTijd: 50

# Maximaal aantal milliseconden per tick besteed aan asynchrone taken.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
asynchroonToegewezenTijd: 50

# Voorlaadafstand bestemming (chunks)
# Straal van chunks die rondom de bestemming worden voorgeladen.
# Aantal geladen chunks = ( 1 + 2 * straal )^2.
# Impact: HOOG — een te hoge waarde kan TPS-dalingen veroorzaken bij teletransport.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
zichtafstandSelectie: 0

# Chunkstraal die vlak vóór de teleport rond de eindlocatie wordt geladen.
# 0 laadt alleen de bestemmingschunk.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
zichtafstandTeletransport: 0

# Ticks waarover de kijkafstand van een geteleporteerde speler na aankomst terug
# naar normaal loopt, wat de chunk-laadpiek afvlakt. 0 schakelt de begrenzing uit.
# LET OP: Tijdelijk op 0 gezet. Het geleidelijke herstel veroorzaakt flikkering /
# opnieuw renderen aan de clientzijde bij aankomst. Laat op 0 tot nader bericht.
# @type: integer
# @range: [0, null]
# @unit: ticks
# @default: 200
zichtafstandHerstelInterval: 0

# Wachtrij na teletransport
# Als true probeert de plugin de locatiecache direct na een RTP te vullen.
# Impact: GEMIDDELD
# @type: boolean
# @default: false
wachtrij_naTeletransport: false

# Registreert biomen van reeds geladen chunks in het ruimtelijke geheugen, wat
# biome-recall / -weging voedt. Geen extra chunk-I/O.
# @type: boolean
# @default: true
controleer_bijChunkLaden: true

# Fractie van de backlogcapaciteit waarbij het bijvullen hervat (hysterese).
# 0.5 = bijvullen na leeglopen tot 50%; 1.0 = continu bijvullen.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.5
backlogBijvulDrempel: 0.5

# Kans om per poging een niet-gegenereerde chunk te weigeren.
# 0.0 = geen bias, 1.0 = niet-gegenereerd land mijden. Gegenereerde chunks slagen altijd.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.0
voorgegenereerdVoorkeur: 0.0

# Reserveert een cache van locaties voor teleportaties bij binnenkomst
# (rtp.onevent.firstjoin / rtp.onevent.join).
# @type: boolean
# @default: false
loginCacheIngeschakeld: false

# Harde bovengrens voor de join-cache. 0 = automatisch (server max-players bij opstart).
# @type: integer
# @range: [0, null]
# @default: 0
loginCacheLimiet: 0

# Bioomselektiecache
# bioomHerinnering: Eerder gevonden locaties per bioom hergebruiken.
# bioomHerinnering_geforceerd: Alleen al ontdekte en gecachte biomen gebruiken.
# Impact: LAAG tot GEMIDDELD
# @type: boolean
# @default: true
bioomHerinnering: true

# Bedient biome-gefilterde verzoeken alleen vanuit de cache (genereert nooit nieuwe
# biome-zoekopdrachten). Vereist biomeRecall.
# @type: boolean
# @default: false
bioomHerinnering_geforceerd: false

# Latentiedrempel (ms) waarboven een direct bediende teleportatie wordt geaudit
# (WARN gelogd, slowPipelineCount opgehoogd). 0 of minder schakelt uit.
# @type: integer
# @range: [0, null]
# @unit: ms
# @default: 5000
traagPipelineDrempelMs: 5000

# Wachtrijdiepte (wachtende spelers) waarbij tegendruk wordt geaudit
# (WARN gelogd, queueGrowthWarnCount opgehoogd). 0 of minder schakelt uit.
# @type: integer
# @range: [0, null]
# @unit: players
# @default: 0
wachtrijGroeiWaarschuwDrempel: 0

# Synchroon laden
# Gebruik synchroon chunkladen voor locatieselectie.
# Impact: HOOG — NIET AANBEVOLEN! Kan ernstige serverblokkades veroorzaken.
# @type: boolean
# @default: false
synchroonLaden: false

# Rechtenparsering (opstarten)
# verwerking_bijGebeurtenis: Incompatibel met brede rechten zoals *.*.
# Impact: GEMIDDELD (bijGebeurtenis) / LAAG (effect)
# @type: boolean
# @default: false
verwerking_bijGebeurtenis: false

# Effect-permissienodes bij het opstarten inlezen.
# @type: boolean
# @default: true
effectVerwerking: true

# Achtergrondgegevensverzameling (Region Data Visitor)
# Wanneer de voorgenereercache vol is, wordt per regio één observerende taak
# gepland met dezelfde `periode`. Hergebruikt dezelfde
# pipeline maar verwerpt de veilige kandidaat in plaats van
# hem in de wachtrij te plaatsen, zodat bijeffecten (registratie van slechte
# locaties, bioomoogst) op de achtergrond worden opgebouwd zonder dat de
# wachtrij boven zijn limiet groeit. Genereert NOOIT wereldgeneratie: chunks
# die nog niet op schijf staan worden overgeslagen via het Anvil-voorfilter
# van met uitkomst UNKNOWN.
# bezoeker_ingeschakeld: hoofdschakelaar (true schakelt observatiemodus in).
# De cadans wordt overgenomen van de bovenstaande `periode`-instelling.
# Impact: LAAG — begrensd door de bestaande `periode`; werk alleen wanneer
# de cache geen ruimte heeft voor standaard vullingen.
# @type: boolean
# @default: false
bezoeker_ingeschakeld: true

# Instellingen voor /rtp admin prefab. De apply -> confirm-stroom schrijft per
# gewijzigd bestand een back-up; bakRetention beperkt hoeveel er bewaard blijven (oudste gesnoeid).
voorgevormd:
  # Number of timestamped config backups kept per file before pruning.
  # @type: integer
  # @range: [1, null]
  # @default: 3
  bakRetention: 3
# RAAK HET VERSIENUMMER NIET AAN
version: 1.0
