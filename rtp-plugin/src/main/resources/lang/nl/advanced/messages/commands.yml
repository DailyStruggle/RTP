configPendingRowFormat: "&9[key]&8 = &0[value]"

# Hovertekst getoond wanneer de kijker over een klaargezette rij beweegt op een
# configuratiebestandpagina. Geen plaatshouders.
configPendingRowHover: "klik om te annuleren"

# Klikbaar label voor de rij "klaargezette wijzigingen toepassen" op een configuratiebestandpagina.
# Voert het samengestelde commando /rtp config <file> k1=v1 ... uit en wist het mandje.
configApplyRow: "&2&l[apply]"

# Klikbaar label voor de rij "klaargezette wijzigingen verwerpen" op een configuratiebestandpagina.
# Wist het mandje zonder toe te passen.
configDiscardRow: "&c&l[discard]"

# --- Kaart- / grafiekweergave ---
# Verzonden wanneer op een kaartrij wordt geklikt maar kaartweergave niet beschikbaar is op deze
# server (bijv. de Lite-variant, of geen kaartprovider geïnstalleerd).
mapBindingMissing: "&c[P0] kaartweergave is niet beschikbaar op deze server."

# Verzonden wanneer een grafiek wordt aangevraagd maar er geen renderer is geregistreerd voor dat
# grafiektype.
mapResolverMissing: "&c[P0] geen grafiekresolver geregistreerd voor dit verzoek."

# Verzonden wanneer een resolver wordt uitgevoerd maar de onderliggende gegevensbron niet beschikbaar is
# voor het gevraagde doel (onbekende regio, nog geen gegevens, wereld ontladen).
# Plaatshouder: [region] - de gevraagde regionaam (kan leeg zijn).
mapUnavailable: "&e[P1] grafiekgegevens zijn op dit moment niet beschikbaar."

# Verzonden wanneer de kaartdienst op dit moment geen kaart kan toewijzen (bijv. een
# limiet per kijker is bereikt).
mapBusy: "&e[P1] de kaartdienst is bezig; probeer het zo dadelijk opnieuw."

# Label voor de klikbare menurij in "/rtp info" die een heatmap rendert van
# de bekende onveilige locaties van de huidige regio. Verborgen wanneer kaartweergave
# niet beschikbaar is op deze server.
menuInfoBadPointsLabel: "#9D7CD8&l# kaart met onveilige punten"

# --- MultiConfig-submenu ---
# Terugval voor koptekstrij wanneer er geen kopsleutel per soort is geregistreerd.
# Plaatshouder: [parserKind] - de ruwe multiconfig-soortnaam.
multiconfigHeaderDefault: "#5FB3B3&l[parserKind]"

# Koptekstrijlabel voor de selectiepagina van de regio-multiconfig. Geen plaatshouders.
multiconfigHeaderRegions: "#5FB3B3&l regio's"

# Koptekstrijlabel voor de selectiepagina van de werelden-multiconfig. Geen plaatshouders.
multiconfigHeaderWorlds: "#5FB3B3&l werelden"

# Schakelrijlabel wanneer verwijdermodus UIT staat. Geen plaatshouders.
multiconfigToggleRemoveModeOff: "&8[ ] verwijdermodus"

# Schakelrijlabel wanneer verwijdermodus AAN staat. Klikken op invoerrijen verwijdert.
multiconfigToggleRemoveModeOn: "&c[x] verwijdermodus (klik op een item om te verwijderen)"

# Keuzerijlabel voor de invoer "+ Nieuw toevoegen...". Geen plaatshouders.
multiconfigRowAdd: "&2+ nieuw toevoegen..."

# Hovertekst voor de Toevoegen-rij. Plaatshouder: [name] - vooraf ingevulde standaardnaam.
multiconfigRowAddHover: "&7typ een naam in de aambeeldprompt; vooringevuld: &f[name]"

# Hovertekst voor een itemrij in normale modus. Plaatshouder: [name].
multiconfigRowEditHover: "&7bewerk &f[name]"

# Hovertekst voor een itemrij in verwijdermodus. Plaatshouder: [name].
multiconfigRowRemoveHover: "&cverwijder &f[name]"

# Titelrij pagina verwijdering bevestigen. Plaatshouder: [name].
multiconfigConfirmTitle: "&c&l[name] verwijderen?"

# Label van Ja-rij op pagina verwijdering bevestigen. Geen plaatshouders.
multiconfigConfirmYes: "&c&l[confirm delete]"

# Label van Annuleren-rij op pagina verwijdering bevestigen. Geen plaatshouders.
multiconfigConfirmNo: "&2&l[cancel]"

# Hovertekst op een vergrendelde (grijs gemaakte) standaardregiorij. Geen plaatshouders.
multiconfigLockRegionDefault: "&7de standaardregio kan niet worden verwijderd"

# Hovertekst op een vergrendelde (grijs gemaakte) wereldrij. Plaatshouder: [name].
multiconfigLockWorldLoaded: "&7wereld '[name]' is geladen op de server; ontlaad deze voordat je de configuratie verwijdert"

# Resultaatbericht na een succesvolle TOEVOEGING. Plaatshouder: [name].
multiconfigResultAdded: "&a'[name]' toegevoegd."

# Resultaatbericht na een succesvolle VERWIJDERING. Plaatshouder: [name].
multiconfigResultRemoved: "&a'[name]' verwijderd."

# Resultaatbericht wanneer TOEVOEGEN mislukt. Plaatshouders: [name], [reason].
multiconfigResultAddFailed: "&ckon '[name]' niet toevoegen: [reason]"

# Resultaatbericht wanneer VERWIJDEREN mislukt. Plaatshouders: [name], [reason].
multiconfigResultRemoveFailed: "&ckon '[name]' niet verwijderen: [reason]"

# Resultaatbericht wanneer de voorgestelde itemnaam wordt afgewezen door het filter.
# Plaatshouder: [name].
multiconfigResultNameInvalid: "&cnaam '[name]' is niet toegestaan; gebruik letters, cijfers, '_', '-', '.'"

# Resultaatbericht wanneer een TOEVOEGING botst met een bestaande itemnaam.
# Plaatshouder: [name].
multiconfigResultNameTaken: "&cer bestaat al een item met de naam '[name]'."

