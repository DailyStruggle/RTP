# --- RTP-berichten (deze taal) ---
# Berichtteksten voor spelers en operators in deze taal, gegroepeerd per onderwerp.
# Automatisch gegenereerde kopie van de Engelse berichten; niet met de hand bewerken (wordt overschreven).

# ###############################################################################
# Sectie 4: Systeem en beheer
# ###############################################################################
oudBestand: "&b[P0] een oud [filename] gevonden. Bijwerken"

# een bukkit-wereld gedetecteerd die niet in het configuratiebestand staat
# placeholder: [world] - de gedetecteerde wereld
nieuweWereld: "&b[P0] nieuwe wereld '[world]' gedetecteerd"

# plugin reload-/updatetekst
# placeholder: [filename] - bestandsnaam
herladen: "&b[P0] [filename] laden..."
herladen_klaar: "&b[P0] [filename] succesvol geladen."
reloadFailed: "&c[P0] Configuratie opnieuw laden is mislukt. Controleer het serverlog."
reloadRejected: "&c[P0] Herladen geweigerd: [count] configuratiefout(en); de actieve configuratie blijft behouden. Eerste: [code] in [source] bij [path]. Details: /rtp test subsystem=config"
bijwerken: "&a[P0] [filename] bijwerken..."
bijgewerkt: "&a[P0] [filename] succesvol bijgewerkt."

# ###############################################################################
# Sectie 5: Beheerderslogboeken
# ###############################################################################
locatieOpgeslagen: "&7[P0] [amount] locaties succesvol opgeslagen voor [region]"
locatieGeladen: "&7[P0] [amount] locaties succesvol geladen voor [region]"

# ###############################################################################
# Sectie 11: Metadata
# ###############################################################################
# RAAK HET VERSIENUMMER NIET AAN
version: 1.0

# ###############################################################################
# Sectie 12: Ontwikkelaarsopties
# ###############################################################################
devTagTonen: false
