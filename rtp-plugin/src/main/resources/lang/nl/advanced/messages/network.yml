# --- RTP-berichten (deze taal) ---
# Berichtteksten voor spelers en operators in deze taal, gegroepeerd per onderwerp.
# Automatisch gegenereerde kopie van de Engelse berichten; niet met de hand bewerken (wordt overschreven).

# --- Berichten voor cross-server netwerkmodus ---
# Alleen verzonden wanneer `network.enabled: true` en de `/rtp` van de speler wordt gerouteerd
# via de cross-server wachtrij (zie network.yml `routing.mode`).
# Alle sleutels zijn optioneel vanuit het perspectief van de speler - de basiscyclus
# van `delayMessage` / `teleportMessage` stuurt nog steeds de zichtbare stroom aan.
# Verzonden wanneer het verzoek is geaccepteerd in de cross-server wachtrij
# en wacht op toewijzing door een backend. Plaatshouder: [position] - 0-geïndexeerde
# positie van `pollStatus`; kan leeg zijn als het transport geen positie retourneert.
networkQueued: "&7[P0] in de wachtrij voor een cross-server bestemming (positie [position])..."

# Verzonden wanneer een speler /rtp uitvoert terwijl deze al in de cross-server wachtrij staat.
# Plaatshouder: [position] - positie in de rij; kan leeg zijn.
alreadyQueued: "&cJe wacht al in de cross-server wachtrij (positie [position]). Even geduld."

# Verzonden wanneer een item in de cross-server wachtrij te lang wachtte en werd verwijderd.
# Geen plaatshouders.
networkTimedOut: "&c[P0] cross-server teleport verliep terwijl er op een backend werd gewacht."

# Verzonden wanneer de cross-server wachtrij vol is en het verzoek wordt afgewezen.
# Geen plaatshouders.
waitlistFull: "&c[P0] cross-server wachtrij is vol; probeer het zo opnieuw."

# Verzonden wanneer de wachtrij het verzoek heeft overgedragen aan de proxy-router en
# een backendselectie bezig is.
networkRouting: "&7[P0] routeren naar een backend..."

# Verzonden wanneer een backend een coördinaat heeft gereserveerd voor deze speler en de
# proxy op het punt staat de overstap tussen servers te starten. Plaatshouder: [server]
# - de serverId van de bestemmingsbackend.
networkReserved: "&a[P0] coördinaat gereserveerd op [server]. Overdragen..."

# Verzonden wanneer de proxy bezig is met de overstap. Plaatshouder: [server] - bestemming.
networkTransferring: "&a[P0] overdragen naar [server]..."

# Verzonden wanneer het cross-server pad het opgaf en terugviel op de lokale server.
# Plaatshouder: [reason] - de reden voor terugvallen.
networkFallback: "&e[P0] cross-server niet beschikbaar ([reason]); terugvallen op lokaal."

# Verzonden wanneer het cross-server verzoek is mislukt en er geen terugval mogelijk was.
# Plaatshouder: [reason] - de reden van mislukking.
networkFailed: "&c[P0] cross-server teleport mislukt: [reason]."

# Verzonden wanneer de speler vroeg om een specifieke regio (`/rtp <region>`) maar
# geen enkele backend in het netwerk deze momenteel bedient. Plaatshouder:
# [region] - de gevraagde regionaam.
networkRegionUnavailable: "&c[P0] geen backend bedient regio '[region]' op dit moment."

# Verzonden wanneer de gevraagde regionaam verwijst naar twee of meer backends en
# het door de beheerder geconfigureerde beleid er geen kan kiezen (wordt alleen geactiveerd
# bij strenger beleid dan het standaard `warn`). Plaatshouder: [region].
networkRegionAmbiguous: "&c[P0] regio '[region]' is dubbelzinnig over backends; kies een server."

# RAAK HET VERSIENUMMER NIET AAN
version: 1.0
