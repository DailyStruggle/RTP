# RTP Network Mode (multi-server / multi-proxy) Disabled by default; flipping `network.enabled: true` opts this backend into the cross-server network.

network:
  # Bij false wordt dit bestand gelezen en gevalideerd en daarna genegeerd: er worden geen threads, tabellen of transport geopend.
  # @type: boolean
  # @default: false
  enabled: false
  # Stabiele backend-identiteit, vereist indien ingeschakeld; twee backends met dezelfde serverId overschrijven elkaars heartbeat.
  # @type: string
  # @default: ""
  serverId: ""
  # Omgevingsvariabele met het gedeelde HMAC-geheim; vereist indien ingeschakeld met transport.type redis.
  # @type: string
  # @default: "RTP_NET_SECRET"
  secretEnv: "RTP_NET_SECRET"

# Backing store for cross-process state.
transport:
  # Opslag-backend voor het transport.
  # @type: enum
  # @options: ["auto", "plugin-message", "in-memory", "sql", "redis"]
  # @default: "auto"
  type: "auto"
  pluginMessage:
    # Plugin-berichtenkanaal van de proxy; laat standaard tenzij je proxy een niet-standaard naam gebruikt.
    # @type: string
    # @default: "bungeecord:main"
    channel: "bungeecord:main"
  redis:
    # Hostnaam of IP van de Redis-instantie die door elke backend en proxy wordt gedeeld (vereist wanneer type redis is).
    # @type: string
    # @default: "localhost"
    host: "localhost"
    # Redis-poort; pas aan voor niet-standaard implementaties.
    # @type: integer
    # @default: 6379
    port: 6379
    # Redis-wachtwoord; laat leeg voor Redis zonder authenticatie, stel in wanneer ACL/requirepass is geconfigureerd.
    # @type: string
    # @default: ""
    password: ""

# Backend heartbeat / peer-staleness cadence (shared by every transport tier).
heartbeat:
  # Hoe vaak deze backend zijn statusrij publiceert (ms).
  # @type: integer
  # @default: 1000
  intervalMs: 1000
  # Hoe lang de laatst geziene status van een peer betrouwbaar blijft voordat die als onbekend wordt behandeld (ms); houd boven intervalMs.
  # @type: integer
  # @default: 5000
  staleAfterMs: 5000

# Backend-side router.
routing:
  # Routermodus: local (alleen lokale pijplijn), auto (eerst lokaal, anders wachtrij) of always (altijd inschrijven).
  # @type: enum
  # @options: ["local", "auto", "always"]
  # @default: "local"
  mode: "local"
  # Lobbymodus: maakt van deze backend een puur verdeelknooppunt dat een kale /rtp automatisch naar de peer-regio met de meeste voorraad routeert.
  # @type: boolean
  # @default: false
  lobbyMode: false

# Cross-server wait queue.
queue:
  # Maximaal aantal lokaal gebufferde inschrijvingen voordat tegendruk nieuwe /rtp-aanroepen weigert (QUEUE_FULL).
  # @type: integer
  # @default: 50
  maxDepth: 50
  # Flush-cadans van openstaande schrijfacties van de backend (ms); lager = lagere latentie, hoger = minder ritten naar het transport.
  # @type: integer
  # @default: 250
  flushIntervalMs: 250
  # Poll-cadans van de statuscache van de backend (ms); hoe vaak voortgang per speler wordt ververst.
  # @type: integer
  # @default: 1000
  pollIntervalMs: 1000
  # Optionele passieve TTL-veroudering van envelop-HASHes (ms); 0 schakelt uit.
  # @type: integer
  # @default: 0
  entryTtlMs: 0
  # Snelheidslimiet voor cross-server /rtp-inschrijvingen (token bucket): aanhoudende verzoeken per seconde.
  # @type: number
  # @default: 5
  crossServerRequestsPerSecond: 5
  # Snelheidslimiet voor cross-server /rtp-inschrijvingen: burstgrootte.
  # @type: number
  # @default: 10
  crossServerRequestsBurst: 10
  # Aantal BLPOP-workers aan de proxykant; verhoog alleen wanneer een enkele worker verzadigd raakt.
  # @type: integer
  # @default: 1
  workerThreads: 1

# Reservation-token lifecycle.
reservation:
  # Cadans van de TTL-opruimer aan de proxykant (ms); veegt verlopen tokens op en geeft hun coordinaten vrij.
  # @type: integer
  # @default: 30000
  reapIntervalMs: 30000
  # TTL per token (ms); een geclaimde maar niet-verbruikte reservering ouder dan dit wordt vrijgegeven als verlaten.
  # @type: integer
  # @default: 60000
  ttlMs: 60000

# Region-collision policy.
regionCollision:
  # Botsingsbeleid toegepast bij het opstarten.
  # @type: enum
  # @options: ["warn", "rename-local", "reject-startup"]
  # @default: "warn"
  policy: "warn"

# Optional per-destination policy overlay (matched by serverId); leave commented for the common case.
#servers:
#  example-backend:
#    # Permission required to target this destination (empty = none).
#    # @type: string
#    # @default: "
#    permission: "
#    # Label shown in menus / suggestions (default: serverId).
#    # @type: string
#    # @default: "
#    display-name: "Example"
#    # Hide from tab-completion when it has no servable region.
#    # @type: boolean
#    # @default: false
#    hide-when-unavailable: false
#    # Allow targeting it even when it reports no servable region.
#    # @type: boolean
#    # @default: true
#    allow-when-unavailable: true
# Load balancer scoring table.
loadBalancer:
  # Gewicht van de ingebouwde regio-schaarsteterm; 0 omdat de expliciete `region`-term hieronder dat signaal bezit.
  # @type: number
  # @default: 0
  regionScarcityWeight: 0
  # Scoring terms, one per metric.
  terms:
    # Tick pressure; sigmoid knee at 0.6.
    mspt:
      # Metriek-invoer.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "mspt"
      input: "mspt"
      # Termgewicht.
      # @type: number
      # @default: 1.0
      weight: 1.0
      curve:
        # Curvetype.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "sigmoid"
        type: "sigmoid"
        # Steilheid.
        # @type: number
        # @range: [0.1, 20]
        # @default: 8.0
        k: 8.0
        # Middelpunt.
        # @type: number
        # @range: [0, 1]
        # @default: 0.6
        x0: 0.6
    # Queue depth; small queues silent, large ones explode.
    queue:
      # Metriek-invoer.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "queueDepth"
      input: "queueDepth"
      # Termgewicht.
      # @type: number
      # @default: 1.0
      weight: 1.0
      curve:
        # Curvetype.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "exponential"
        type: "exponential"
        # Steilheid.
        # @type: number
        # @range: [0.1, 20]
        # @default: 3.0
        k: 3.0
    # Heap gate; fires at >= 85% used.
    heap:
      # Metriek-invoer.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "heapUsed"
      input: "heapUsed"
      # Termgewicht.
      # @type: number
      # @default: 5.0
      weight: 5.0
      curve:
        # Curvetype.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "step"
        type: "step"
        # Stapdrempel.
        # @type: number
        # @range: [0, 1]
        # @default: 0.85
        threshold: 0.85
    # Region gate; fires when the kept pool is >= 95% full.
    region:
      # Metriek-invoer.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "keptRegion"
      input: "keptRegion"
      # Termgewicht.
      # @type: number
      # @default: 5.0
      weight: 5.0
      curve:
        # Curvetype.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "step"
        type: "step"
        # Stapdrempel.
        # @type: number
        # @range: [0, 1]
        # @default: 0.95
        threshold: 0.95
    # Gentle tie-breaker on kept count.
    kept:
      # Metriek-invoer.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "keptCount"
      input: "keptCount"
      # Termgewicht.
      # @type: number
      # @default: 0.25
      weight: 0.25
      curve:
        # Curvetype.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "logarithmic"
        type: "logarithmic"
        # Steilheid.
        # @type: number
        # @range: [0.1, 20]
        # @default: 9.0
        k: 9.0

version: 1.1
