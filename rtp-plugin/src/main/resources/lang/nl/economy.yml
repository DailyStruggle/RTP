# --- Economieconfiguratie van RTP ---
# Configureert de kosten van willekeurig teletransporteren via de servereconomie.
# Teletransportkosten
# Basiskosten voor een standaard /rtp-opdracht.
# @type: number
# @range: [0.0, null]
# @default: 50.0
prijs: 50.0

# Kosten voor het teletransporteren van een andere speler (/rtp <speler>).
# @type: number
# @range: [0.0, null]
# @default: 200.0
prijsAnder: 200.0

# Kosten voor het gebruik van aangepaste parameters (/rtp region:<regio>, enz.).
# @type: number
# @range: [0.0, null]
# @default: 1000000000.0
parametersPrijs: 1000000000.0

# Extra kosten voor het opgeven van een bioom (/rtp biome:<bioom>).
# @type: number
# @range: [0.0, null]
# @default: 5000.0
bioomPrijs: 5000.0

# Betaalt de kosten terug als de teleportatie wordt geannuleerd (speler beweegt, fout, enz.).
# @type: boolean
# @default: true
terugbetalingBijAnnulering: true

# Minimumsaldo dat de speler na betaling moet behouden; de teleportatie wordt
# geweigerd als het hieronder zou zakken.
# @type: number
# @range: [0.0, null]
# @default: 0.0
minimumSaldo: 0.0

# WIJZIG HET VERSIENUMMER NIET
version: 1.0
