# --- RTP Economy Settings ---
# Documentation: plugins/RTP/docs/admin/configuration/ECONOMY.md

# Base cost charged for a successful /rtp.
# @type: number
# @range: [0.0, null]
# @default: 50.0
price: 50.0

# Extra cost charged when teleporting another player (/rtp <other>).
# @type: number
# @range: [0.0, null]
# @default: 200.0
priceOther: 200.0

# Extra cost charged when supplying parameters to /rtp.
# @type: number
# @range: [0.0, null]
# @default: 1000000000.0
paramsPrice: 1000000000.0

# Extra cost charged when specifying a biome in /rtp parameters.
# @type: number
# @range: [0.0, null]
# @default: 5000.0
biomePrice: 5000.0

# Zwraca koszt, gdy teleportacja zostanie anulowana (gracz się porusza, błąd itp.).
# @type: boolean
# @default: true
refundOnCancel: true

# Minimalne saldo, jakie gracz musi zachować po zapłacie; teleportacja zostanie
# odrzucona, jeśli spadłoby poniżej tego progu.
# @type: number
# @range: [0.0, null]
# @default: 0.0
balanceFloor: 0.0

# DO NOT TOUCH VERSION NUMBER
version: 1.0
