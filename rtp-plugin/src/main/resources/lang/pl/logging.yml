# --- Przełączniki logowania pluginu ---
# Documentation: plugins/RTP/docs/admin/CONFIGURATION.md#loggingyml--console-logging-verbosity
# Loguj wszystkie pliki przeładowane podczas /rtp reload
# @type: boolean
# @default: false
szczegolowe_przeladowanie: false

# Loguj szczegóły inicjalizacji regionu
# @type: boolean
# @default: false
szczegolowa_inicjalizacjaRegionu: false

# Loguj komendy RTP wykonane przez graczy
# @type: boolean
# @default: false
polecenie: false

# Loguj udane zdarzenia teleportacji
# @type: boolean
# @default: true
teleportacja: true

# Loguj RTP wywołane zmianą świata
# @type: boolean
# @default: true
zdarzenie_zmianaSwiata: true

# Loguj RTP wywołane przy dołączeniu
# @type: boolean
# @default: true
zdarzenie_dolaczenie: true

# Loguj RTP wywołane przy odrodzeniu
# @type: boolean
# @default: true
zdarzenie_odrodzenie: true

# Loguj przetwarzanie zdarzeń ruchu
# @type: boolean
# @default: true
zdarzenie_ruch: true

# Loguj przetwarzanie zdarzeń teleportacji
# @type: boolean
# @default: true
zdarzenie_teleportacja: true

# Loguj informacje, gdy wybór lokalizacji się nie powiedzie
# @type: boolean
# @default: true
niepowodzenie_wyboru: true

# Logi debugowania aktywności pamięci
# @type: boolean
# @default: false
system_sledzeniePamieci: false

# Logi debugowania aktywności bazy danych
# @type: boolean
# @default: false
system_bazaDanych: false

# Minimalny poziom logowania pluginu. Efektywny filtr to bardziej szczegółowy
# z tego i loggera Bukkit. ALL zachowuje zachowanie identyczne z loggerem Bukkit.
# @type: enum
# @options: [SEVERE, WARNING, INFO, CONFIG, FINE, FINER, FINEST, ALL, OFF]
# @default: ALL
min_poziom: "INFO"

# NIE ZMIENIAJ NUMERU WERSJI
version: 1.0
