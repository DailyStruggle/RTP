# Minimalny TPS serwera wymagany do kontynuowania kolejkowania w tle.
# Praca w tle wstrzymuje się, gdy TPS spadnie poniżej tego progu.
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
minTPS: 19.0

# Maks. użycie sterty JVM (% maksimum), zanim wstrzymane zostanie wypełnianie
# bufora w tle. Już zbuforowane lokacje są nadal serwowane. 0 lub 100 wyłącza.
# @type: number
# @range: [0.0, 100.0]
# @default: 85.0
maxHeapProcent: 85.0

# --- Ustawienia wydajności RTP ---
# Documentation: plugins/RTP/docs/admin/configuration/PERFORMANCE.md
# Maksymalna liczba prób wyszukiwania na wywołanie /rtp przed rezygnacją.
# @type: integer
# @range: [1, null]
# @default: 32
maksProby: 32

# Ticki między cyklami pamięci podręcznej w tle (wstępne wypełnianie regionu, uzupełnianie kolejki).
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
okres: 20

# Maksymalna liczba milisekund na tick poświęcana zadaniom synchronicznym.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
przydzielonyCzasSync: 50

# Maksymalna liczba milisekund na tick poświęcana zadaniom asynchronicznym.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
przydzielonyCzasAsync: 50

# Promień chunków ładowanych wokół kandydującej lokalizacji podczas wyboru.
# 0 ładuje tylko chunk kandydata.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
zasiegWidokuWybor: 0

# Promień chunków ładowanych wokół końcowej lokalizacji tuż przed teleportacją.
# 0 ładuje tylko chunk docelowy.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
zasiegWidokuTeleport: 0

# Ticki, w trakcie których zasięg widzenia teleportowanego gracza wraca do normy
# po przybyciu, wygładzając skok ładowania chunków. 0 wyłącza ograniczenie.
# UWAGA: Tymczasowo wymuszone na 0. Stopniowe przywracanie powoduje migotanie /
# ponowne renderowanie po stronie klienta przy przybyciu. Pozostaw 0 do odwołania.
# @type: integer
# @range: [0, null]
# @unit: ticks
# @default: 200
zasiegWidokuPrzywracanieInterwal: 0

# Uzupełnij pamięć podręczną regionu natychmiast po udanej teleportacji.
# @type: boolean
# @default: false
kolejkowaniePoTeleporcie: false

# Rejestruje biomy z już załadowanych chunków w pamięci przestrzennej, zasilając
# przypominanie / ważenie biomów. Bez dodatkowego I/O chunków.
# @type: boolean
# @default: true
sprawdzPrzyZaladowaniuChunka: true

# Ułamek pojemności backlogu, przy którym wznawiane jest uzupełnianie (histereza).
# 0.5 = uzupełniaj po opróżnieniu do 50%; 1.0 = uzupełniaj ciągle.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.5
progUzupelnieniaBacklog: 0.5

# Prawdopodobieństwo odrzucenia niewygenerowanego chunku na próbę.
# 0.0 = bez stronniczości, 1.0 = unikaj niewygenerowanego terenu. Wygenerowane chunki zawsze przechodzą.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.0
preferencjaPregenerowane: 0.0

# Rezerwuje bufor lokacji dla teleportacji przy dołączeniu
# (rtp.onevent.firstjoin / rtp.onevent.join).
# @type: boolean
# @default: false
cacheLogowaniaWlaczona: false

# Twardy limit pamięci podręcznej dołączania. 0 = automatycznie (max-players serwera przy starcie).
# @type: integer
# @range: [0, null]
# @default: 0
limitCacheLogowania: 0

# Ponownie wykorzystuj z pamięci podręcznej wcześniej znalezione lokalizacje dopasowane do biomu.
# @type: boolean
# @default: true
pamiecBiomu: true

# Obsługuje żądania filtrowane biomem tylko z bufora (nigdy nie generuje nowych
# wyszukiwań biomu). Wymaga biomeRecall.
# @type: boolean
# @default: false
pamiecBiomuWymuszona: false

# Próg opóźnienia (ms), powyżej którego natychmiast obsłużona teleportacja jest
# audytowana (WARN w logu, slowPipelineCount zwiększony). 0 lub mniej wyłącza.
# @type: integer
# @range: [0, null]
# @unit: ms
# @default: 5000
progWolnegoPipelineMs: 5000

# Głębokość kolejki (oczekujący gracze), przy której audytowane jest ciśnienie zwrotne
# (WARN w logu, queueGrowthWarnCount zwiększony). 0 lub mniej wyłącza.
# @type: integer
# @range: [0, null]
# @unit: players
# @default: 0
progOstrzezeniaWzrostuKolejki: 0

# Użyj synchronicznego ładowania chunków. NIEZALECANE. Narusza ducha S-005
# na Folii i zablokuje główny wątek na Paper/Spigot.
# @type: boolean
# @default: false
ladowanieSync: false

# Ponownie parsuj węzły uprawnień przy każdym zdarzeniu zamiast buforowania.
# @type: boolean
# @default: false
analizaPrzyZdarzeniu: false

# Parsuj węzły uprawnień efektów przy starcie.
# @type: boolean
# @default: true
analizaEfektow: true

# Włącz gromadzenie danych w tle na potrzeby analityki odwiedzających.
# @type: boolean
# @default: false
goscWlaczony: false

# Ustawienia /rtp admin prefab. Przepływ apply -> confirm zapisuje kopię zapasową
# dla każdego zmienionego pliku; bakRetention ogranicza liczbę (najstarsze usuwane).
prefabrykat:
  # Number of timestamped config backups kept per file before pruning.
  # @type: integer
  # @range: [1, null]
  # @default: 3
  bakRetention: 3
# NIE ZMIENIAJ NUMERU WERSJI
version: 1.0
