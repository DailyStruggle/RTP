# RTP Network Mode (multi-server / multi-proxy) Disabled by default; flipping `network.enabled: true` opts this backend into the cross-server network.

network:
  # Gdy false, ten plik jest odczytywany i sprawdzany, a nastepnie ignorowany: nie otwiera sie zaden watek, tabela ani transport.
  # @type: boolean
  # @default: false
  enabled: false

  # Stabilna tozsamosc backendu, wymagana gdy wlaczone; dwa backendy z tym samym serverId nadpisuja sobie nawzajem heartbeat.
  # @type: string
  # @default: ""
  serverId: ""

  # Zmienna srodowiskowa przechowujaca wspoldzielony sekret HMAC; wymagana gdy wlaczone z transport.type redis.
  # @type: string
  # @default: "RTP_NET_SECRET"
  secretEnv: "RTP_NET_SECRET"

# Backing store for cross-process state.
transport:
  # Magazyn danych transportu.
  # @type: enum
  # @options: ["auto", "plugin-message", "in-memory", "sql", "redis"]
  # @default: "auto"
  type: "auto"
  pluginMessage:
    # Kanal komunikacji wtyczek proxy; pozostaw domyslny, chyba ze twoje proxy uzywa niestandardowej nazwy.
    # @type: string
    # @default: "bungeecord:main"
    channel: "bungeecord:main"
  redis:
    # Nazwa hosta lub IP instancji Redis wspoldzielonej przez kazdy backend i proxy (wymagane gdy type to redis).
    # @type: string
    # @default: "localhost"
    host: "localhost"

    # Port Redis; zmien dla niestandardowych wdrozen.
    # @type: integer
    # @default: 6379
    port: 6379

    # Haslo Redis; pozostaw puste dla Redis bez uwierzytelniania, ustaw gdy skonfigurowano ACL/requirepass.
    # @type: string
    # @default: ""
    password: ""

# Backend heartbeat / peer-staleness cadence (shared by every transport tier).
heartbeat:
  # Jak czesto ten backend publikuje swoj wiersz stanu (ms).
  # @type: integer
  # @default: 1000
  intervalMs: 1000

  # Jak dlugo ostatnio widziany stan rownorzednego wezla pozostaje zaufany, zanim zostanie uznany za nieznany (ms); utrzymuj powyzej intervalMs.
  # @type: integer
  # @default: 5000
  staleAfterMs: 5000

# Backend-side router.
routing:
  # Tryb routera: local (tylko lokalny potok), auto (najpierw lokalnie, inaczej kolejka oczekiwania) lub always (zawsze zapisuj).
  # @type: enum
  # @options: ["local", "auto", "always"]
  # @default: "local"
  mode: "local"

  # Tryb lobby: czyni ten backend czystym wezlem rozdzielajacym, ktory automatycznie kieruje samo /rtp do regionu rownorzednego z najwieksza rezerwa.
  # @type: boolean
  # @default: false
  lobbyMode: false

# Cross-server wait queue.
queue:
  # Maksymalna liczba lokalnie buforowanych zapisow, zanim przeciwcisnienie odrzuci nowe wywolania /rtp (QUEUE_FULL).
  # @type: integer
  # @default: 50
  maxDepth: 50

  # Czestotliwosc oprozniania oczekujacych zapisow backendu (ms); nizej = mniejsze opoznienie, wyzej = mniej podrozy do transportu.
  # @type: integer
  # @default: 250
  flushIntervalMs: 250

  # Czestotliwosc odpytywania pamieci podrecznej stanu backendu (ms); jak czesto odswiezany jest postep na gracza.
  # @type: integer
  # @default: 1000
  pollIntervalMs: 1000

  # Opcjonalne pasywne starzenie TTL HASH-y kopert (ms); 0 wylacza.
  # @type: integer
  # @default: 0
  entryTtlMs: 0

  # Limit tempa zapisow /rtp miedzy serwerami (token bucket): trwale zadania na sekunde.
  # @type: number
  # @default: 5
  crossServerRequestsPerSecond: 5

  # Limit tempa zapisow /rtp miedzy serwerami: rozmiar serii.
  # @type: number
  # @default: 10
  crossServerRequestsBurst: 10

  # Liczba workerow BLPOP po stronie proxy; zwieksz tylko gdy pojedynczy worker sie nasyca.
  # @type: integer
  # @default: 1
  workerThreads: 1

# Reservation-token lifecycle.
reservation:
  # Czestotliwosc czyszczenia TTL po stronie proxy (ms); usuwa wygasle tokeny i zwalnia ich wspolrzedne.
  # @type: integer
  # @default: 30000
  reapIntervalMs: 30000

  # TTL na token (ms); zarezerwowana, ale niewykorzystana rezerwacja starsza niz to jest zwalniana jako porzucona.
  # @type: integer
  # @default: 60000
  ttlMs: 60000

# Region-collision policy.
regionCollision:
  # Polityka kolizji stosowana przy uruchamianiu.
  # @type: enum
  # @options: ["warn", "rename-local", "reject-startup"]
  # @default: "warn"
  policy: "warn"

# Optional per-destination policy overlay (matched by serverId); leave commented for the common case.
# servers:
#  example-backend:
#    # Permission required to target this destination (empty = none).
#    # @type: string
#    # @default: "
#    permission: "
#    # Label shown in menus / suggestions (default: serverId).
#    # @type: string
#    # @default: "
#    display-name: "Example"
#    # Hide from tab-completion when it has no servable region.
#    # @type: boolean
#    # @default: false
#    hide-when-unavailable: false
#    # Allow targeting it even when it reports no servable region.
#    # @type: boolean
#    # @default: true
#    allow-when-unavailable: true
# Load balancer scoring table.
loadBalancer:
  # Waga wbudowanego czlonu niedoboru regionow; 0, poniewaz jawny czlon `region` ponizej posiada ten sygnal.
  # @type: number
  # @default: 0
  regionScarcityWeight: 0

  # Scoring terms, one per metric.
  terms:
    # Tick pressure; sigmoid knee at 0.6.
    mspt:
      # Wejscie metryki.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "mspt"
      input: "mspt"

      # Waga czlonu.
      # @type: number
      # @default: 1.0
      weight: 1.0
      curve:
        # Typ krzywej.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "sigmoid"
        type: "sigmoid"

        # Stromosc.
        # @type: number
        # @range: [0.1, 20]
        # @default: 8.0
        k: 8.0

        # Punkt srodkowy.
        # @type: number
        # @range: [0, 1]
        # @default: 0.6
        x0: 0.6

    # Queue depth; small queues silent, large ones explode.
    queue:
      # Wejscie metryki.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "queueDepth"
      input: "queueDepth"

      # Waga czlonu.
      # @type: number
      # @default: 1.0
      weight: 1.0
      curve:
        # Typ krzywej.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "exponential"
        type: "exponential"

        # Stromosc.
        # @type: number
        # @range: [0.1, 20]
        # @default: 3.0
        k: 3.0

    # Heap gate; fires at >= 85% used.
    heap:
      # Wejscie metryki.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "heapUsed"
      input: "heapUsed"

      # Waga czlonu.
      # @type: number
      # @default: 5.0
      weight: 5.0
      curve:
        # Typ krzywej.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "step"
        type: "step"

        # Prog skoku.
        # @type: number
        # @range: [0, 1]
        # @default: 0.85
        threshold: 0.85

    # Region gate; fires when the kept pool is >= 95% full.
    region:
      # Wejscie metryki.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "keptRegion"
      input: "keptRegion"

      # Waga czlonu.
      # @type: number
      # @default: 5.0
      weight: 5.0
      curve:
        # Typ krzywej.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "step"
        type: "step"

        # Prog skoku.
        # @type: number
        # @range: [0, 1]
        # @default: 0.95
        threshold: 0.95

    # Gentle tie-breaker on kept count.
    kept:
      # Wejscie metryki.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "keptCount"
      input: "keptCount"

      # Waga czlonu.
      # @type: number
      # @default: 0.25
      weight: 0.25
      curve:
        # Typ krzywej.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "logarithmic"
        type: "logarithmic"

        # Stromosc.
        # @type: number
        # @range: [0.1, 20]
        # @default: 9.0
        k: 9.0

version: 1.1
