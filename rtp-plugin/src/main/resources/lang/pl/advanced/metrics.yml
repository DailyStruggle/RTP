# --- Ustawienia metryk RTP ---

# Pokrętła wyłącznie raportowe dla SPI metryk z Fazy M2. Pokrętła
# ograniczania / strojenia pozostają w performance.yml.
# Wypełnia MetricsSnapshot.foliaRegions() szczegółami per-region w Folii.
# Brak efektu na Paper / Bukkit / Fabric (środowiska jednoregionowe zawsze
# zwracają pustą listę, co jest poprawną odpowiedzią dla tych platform).
# @type: boolean
# @default: true
foliaIncludeRegions: true

# Strategia agregacji służąca do złożenia próbek z poszczególnych regionów
# w skalarne pola tps{1,5,15}m obiektu MetricsSnapshot w Folii.
# @type: enum
# @options: [mean, max]
# @default: mean
foliaAggregationTps: "mean"

# Strategia agregacji służąca do złożenia próbek z poszczególnych regionów
# w skalarne pole mspt obiektu MetricsSnapshot w Folii.
# @type: enum
# @options: [mean, max]
# @default: max
foliaAggregationMspt: "max"

# Strategia agregacji służąca do złożenia próbek z poszczególnych regionów
# w skalarne pole tickBudgetUtilisation obiektu MetricsSnapshot w Folii.
# @type: enum
# @options: [mean, max]
# @default: max
foliaAggregationTickBudget: "max"

# NIE ZMIENIAJ NUMERU WERSJI
version: 1.0
