# --- RTP Core Configuration ---
# Documentation: https://github.com/DailyStruggle/RTP/blob/master/docs/admin/CORE_CONFIG.md
# Locale selection now lives in language.yml (loaded before config.yml).
# Wait time before a queued teleport executes.
# 0 teleports immediately (skips the cancel-on-move window).
# Interacts with cancelDistance below.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 2
teleportDelay: 2

# Maximum distance a player may move during teleportDelay before the
# queued teleport is cancelled.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 2
cancelDistance: 2

# Wait time between successful uses of /rtp by the same player.
# Bypassed by rtp.nocooldown.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 300
teleportCooldown: 300

# Console commands executed on successful teleport. Use [player] for the
# target player's name. Empty string entries are ignored.
# @type: list<string>
consoleCommands:
  - "say [player] has just randomly teleported!"

# Polecenia wykonywane jako teleportowany gracz po udanej teleportacji.
# Użyj [player] dla nazwy gracza. Puste wpisy są ignorowane.
# @type: list<string>
playerCommands:
  # Polecenia wykonywane jako teleportowany gracz po udanej teleportacji.
  # Użyj [player] dla nazwy gracza. Puste wpisy są ignorowane.
  # @type: list<string>
  - ""

# Database backend used for persistence.
# yaml/sqlite are file-backed and require no extra config; mysql and
# postgresql use the host/port/name/username/password fields below.
database:
  # Backend type.
  # @type: enum
  # @options: ["yaml", "sqlite", "mysql", "postgresql"]
  # @default: "sqlite"
  type: "sqlite"
  # Database host. Used by mysql/postgresql only.
  # @type: string
  host: "127.0.0.1"
  # Port bazy danych. Używany tylko przez mysql/postgresql.
  # @type: integer
  # @range: [1, 65535]
  port: 3306
  # Nazwa bazy danych / schematu. Używana tylko przez mysql/postgresql.
  # @type: string
  name: "rtp"
  # Nazwa użytkownika bazy danych. Używana tylko przez mysql/postgresql.
  # @type: string
  username: "root"
  # Hasło bazy danych. Używane tylko przez mysql/postgresql.
  # @type: string
  password: "password"

# Cross-server / proxy transport settings.
network:
  redis:
    # Włącza wiązanie stanu sieci oparte na Redis.
    # @type: boolean
    # @default: false
    enabled: false
    # Redis host.
    # @type: string
    host: "127.0.0.1"
    # Port Redis.
    # @type: integer
    # @range: [1, 65535]
    port: 6379
    # Redis password. Empty string disables auth.
    # @type: string
    password: ""

# Uogólniony framework menu.
# `renderer` to uporządkowana lista preferencji identyfikatorów rendererów.
# W razie wyjątku lub braku adaptera framework przechodzi przez listę i
# korzysta z kolejnego wpisu. Po wyczerpaniu listy ścieżka otwarcia bez
# tokenu wraca do konfigurowalnej wiadomości `menuInvalid`. Dostępne id:
# book. (Renderer chatu pojawi się w późniejszym wydaniu i wówczas
# zostanie dodany do listy domyślnej.)
menu:
  # Ordered preference list of renderer ids.
  # @type: list<enum>
  # @options: ["book", "chat"]
  renderer:
    # Uogólniony framework menu.
    # `renderer` to uporządkowana lista preferencji identyfikatorów rendererów.
    # W razie wyjątku lub braku adaptera framework przechodzi przez listę i
    # korzysta z kolejnego wpisu. Po wyczerpaniu listy ścieżka otwarcia bez
    # tokenu wraca do konfigurowalnej wiadomości `menuInvalid`. Dostępne id:
    # book. (Renderer chatu pojawi się w późniejszym wydaniu i wówczas
    # zostanie dodany do listy domyślnej.)
    - "book"

# DO NOT TOUCH VERSION NUMBER
version: 3.0
