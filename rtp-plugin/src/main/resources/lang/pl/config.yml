# --- RTP Core Configuration ---
# Documentation: plugins/RTP/docs/admin/configuration/CORE_CONFIG.md
# Locale selection now lives in language.yml (loaded before config.yml).
# Wait time before a queued teleport executes.
# 0 teleports immediately (skips the cancel-on-move window). Supports duration units (e.g. 2s, 40t, 1500ms).
# Interacts with cancelDistance below.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 2
teleportDelay: 2

# Maximum distance a player may move during teleportDelay before the
# queued teleport is cancelled.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 2
cancelDistance: 2

# Wait time between successful uses of /rtp by the same player.
# Bypassed by rtp.nocooldown. Supports duration units (e.g. 5m, 300s, 1h).
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 300
teleportCooldown: 300

# Maksymalna liczba udanych użyć /rtp, jaką gracz może wykonać w oknie
# lockAfterResetSeconds, zanim zostanie zablokowany (parytet z LockAfter z BetterRTP).
# 0 wyłącza limit. Pomijane przez rtp.nolock.
# @type: integer
# @range: [0, null]
# @default: 0
lockAfterUses: 0

# Długość przesuwnego okna limitu użyć dla lockAfterUses. Licznik resetuje się po tylu
# sekundach od pierwszego użycia w oknie. 0 oznacza, że limit nigdy się nie resetuje
# (twardy limit dożywotni). Obsługuje jednostki czasu (np. 24h, 1d).
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 0
lockAfterResetSeconds: 0

# Gdy true, udane /rtp ustawia miejsce lądowania jako trwały
# punkt odrodzenia gracza (parytet z BetterRTP).
# @type: boolean
# @default: false
setRespawnOnTeleport: false

# Console commands executed on successful teleport. Use [player] for the
# target player's name. Empty string entries are ignored.
# @type: list<string>
consoleCommands:
  - "say [player] właśnie losowo się teleportował!"

# Polecenia wykonywane jako teleportowany gracz po udanej teleportacji.
# Użyj [player] dla nazwy gracza. Puste wpisy są ignorowane.
# @type: list<string>
playerCommands:
  # Polecenia wykonywane jako teleportowany gracz po udanej teleportacji.
  # Użyj [player] dla nazwy gracza. Puste wpisy są ignorowane.
  # @type: list<string>
  - ""

# Uogólniony framework menu.
# `renderer` to uporządkowana lista preferencji identyfikatorów rendererów.
# W razie wyjątku lub braku adaptera framework przechodzi przez listę i
# korzysta z kolejnego wpisu. Po wyczerpaniu listy ścieżka otwarcia bez
# tokenu wraca do konfigurowalnej wiadomości `menuInvalid`. Dostępne id:
# book. (Renderer chatu pojawi się w późniejszym wydaniu i wówczas
# zostanie dodany do listy domyślnej.)
menu:
  # Ordered preference list of renderer ids.
  # @type: list<enum>
  # @options: ["book", "chat"]
  renderer:
    # Uogólniony framework menu.
    # `renderer` to uporządkowana lista preferencji identyfikatorów rendererów.
    # W razie wyjątku lub braku adaptera framework przechodzi przez listę i
    # korzysta z kolejnego wpisu. Po wyczerpaniu listy ścieżka otwarcia bez
    # tokenu wraca do konfigurowalnej wiadomości `menuInvalid`. Dostępne id:
    # book. (Renderer chatu pojawi się w późniejszym wydaniu i wówczas
    # zostanie dodany do listy domyślnej.)
    - "book"

# Globalne wartości domyślne dziedziczone przez pliki regionów/światów za pomocą tokenu "@config".
defaults:
  # Domyślny kształt i rozmiar obszaru, używany przez każdy region z kształtem "@config".
  #
  # ROZMIARY TUTAJ SĄ DOMYŚLNIE W CHUNKACH (1 chunk = 16 bloków):
  #   radius: 64   ->  1 024 bloki od środka
  #   radius: 256  ->  4 096 bloków od środka   (poniższa wartość domyślna)
  #   radius: 625  -> 10 000 bloków od środka
  #
  # SUFIKSY JEDNOSTEK PRZESTRZENNYCH:
  # Możesz także użyć jawnych jednostek bezpośrednio dla radius, centerRadius itp.:
  #   radius: 4096b   (lub 4096 blocks, 4096m)
  #   radius: 256c    (chunki)
  #   radius: 4r      (pliki regionów Anvil = 32 chunki = 512 bloków)
  #   radius: 5km     (kilometry = 5000 bloków)
  #
  # radius       = krawędź zewnętrzna. Nikt nie ląduje dalej niż tutaj.
  # centerRadius = krawędź wewnętrzna / dziura pączka. Nikt nie ląduje bliżej niż tutaj.
  #                Musi pozostać mniejsze niż radius, w przeciwnym razie nie ma terenu do wyboru.
  shape:
    # Landing area shape algorithm.
    # @type: enum
    # @source: shape
    name: "CIRCLE"
    mode: "ACCUMULATE"
    radius: 256
    centerRadius: 64
    centerX: 0
    centerZ: 0
    weight: 1.0

    # Keep spots from being reused. 0 = off, 1 = the landing chunk, N = bigger square.
    uniquePlacements: 0
    expand: false

  # Default high/low landing window.
  vert:
    # Vertical placement algorithm.
    # @type: enum
    # @source: vert
    name: "LINEAR"
    minY: 32
    maxY: 255

    # Search order: 0 = bottom-up, 1 = top-down, 2 = middle-out, 3 = edges-in, else random.
    direction: 2
    requireSkyLight: true

  # How many safe spots to pre-calculate.
  cacheCap: 50

  # Extra unverified spots kept ready. 0 = off.
  backlogCacheCap: 1000

  # Max chunks kept loaded for instant teleports.
  activeChunkCap: 10

  # Bad-spot tracking precision (1-5).
  spatialResolution: 3

  # Whether regions/worlds need permission.
  requirePermission: false

# DO NOT TOUCH VERSION NUMBER
version: 3.1
