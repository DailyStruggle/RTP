# --- Ustawienia wydajności RTP ---
# Documentation: plugins/RTP/docs/admin/configuration/PERFORMANCE.md
# Maksymalna liczba prób wyszukiwania na wywołanie /rtp przed rezygnacją.
# @type: integer
# @range: [1, null]
# @default: 32
maksProby: 32

# Promień chunków ładowanych wokół kandydującej lokalizacji podczas wyboru.
# 0 ładuje tylko chunk kandydata.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
zasiegWidokuWybor: 0

# Promień chunków ładowanych wokół końcowej lokalizacji tuż przed teleportacją.
# 0 ładuje tylko chunk docelowy.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
zasiegWidokuTeleport: 0

# Ticki między cyklami pamięci podręcznej w tle (wstępne wypełnianie regionu, uzupełnianie kolejki).
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
okres: 20

# Maksymalna liczba milisekund na tick poświęcana zadaniom synchronicznym.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
przydzielonyCzasSync: 50

# Maksymalna liczba milisekund na tick poświęcana zadaniom asynchronicznym.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
przydzielonyCzasAsync: 50

# Minimalny TPS serwera wymagany do kontynuowania kolejkowania w tle.
# Praca w tle wstrzymuje się, gdy TPS spadnie poniżej tego progu.
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
minTPS: 19.0

# Maksymalne wykorzystanie sterty JVM (procent maksymalnej sterty) przed
# wstrzymaniem generowania pamięci podręcznej w tle. Każda zapisana w pamięci
# podręcznej lokalizacja blokuje chunk, więc nieograniczone wypełnianie na
# serwerze z małą stertą może wpędzić JVM w ciągłe odśmiecanie pamięci i
# sprawić, że serwer przestanie odpowiadać bez żadnego błędu w konsoli.
# Dopóki użycie jest równe lub przekracza ten próg, RTP przestaje uzupełniać
# pamięć podręczną lokalizacji, ale nadal udostępnia już zapisane lokalizacje
# oczekującym graczom. 0 lub 100 wyłącza ten limit.
# @type: number
# @range: [0.0, 100.0]
# @default: 85.0
maxHeapProcent: 85.0

# Uzupełnij pamięć podręczną regionu natychmiast po udanej teleportacji.
# @type: boolean
# @default: false
kolejkowaniePoTeleporcie: false

# Użyj synchronicznego ładowania chunków. NIEZALECANE. Narusza ducha S-005
# na Folii i zablokuje główny wątek na Paper/Spigot.
# @type: boolean
# @default: false
ladowanieSync: false

# Ponownie parsuj węzły uprawnień przy każdym zdarzeniu zamiast buforowania.
# @type: boolean
# @default: false
analizaPrzyZdarzeniu: false

# Parsuj węzły uprawnień efektów przy starcie.
# @type: boolean
# @default: true
analizaEfektow: true

# Ponownie wykorzystuj z pamięci podręcznej wcześniej znalezione lokalizacje dopasowane do biomu.
# @type: boolean
# @default: true
pamiecBiomu: true

# Gdy włączone, żądania filtrowane po biomie obsługiwane są tylko z pamięci
# podręcznej (bez nowych wyszukiwań biomów). Wymaga biomeRecall.
# @type: boolean
# @default: false
pamiecBiomuWymuszona: false

# Modyfikuje wybór filtrowany po biomie tak, by każdy żądany biom był wybierany
# z równym prawdopodobieństwem, a nie proporcjonalnie do tego, jaką część regionu
# zajmuje. Zapobiega zagłuszaniu rzadkich biomów przez pospolite, gdy żądanych
# jest kilka biomów. Wymaga biomeRecall; bez wpływu na teleportacje bez filtra
# (domyślny biom).
# @type: boolean
# @default: false
biomWazony: false

# Per-biome relative selection weights for biome-filtered teleports.
# Only consulted when biomeWeighted is true. Biomes not listed here use
# weight 1.0, so an empty/all-equal map reproduces the equal-probability
# behavior of biomeWeighted on its own. A biome given weight 2.0 is
# steered toward roughly twice as often as a weight-1.0 biome among the
# requested set (when both are present in biome-recall memory); 0.0
# suppresses a biome. Requires biomeRecall; no effect on unfiltered
# (default-biome) teleports. The shipped plains entry is a weight-1.0
# no-op example - replace or extend it with the biomes you want to bias.
# @type: map<string, number>
wagiBiomu:
  # Względna waga wyboru dla tego biomu (1.0 = brak preferencji).
  # @type: number
  # @range: [0.0, null]
  # @default: 1.0
  plains: 1.0
  sunflower_plains: 1.0
  snowy_plains: 1.0
  ice_spikes: 1.0
  desert: 1.0
  swamp: 1.0
  mangrove_swamp: 1.0
  forest: 1.0
  flower_forest: 1.0
  birch_forest: 1.0
  dark_forest: 1.0
  old_growth_birch_forest: 1.0
  old_growth_pine_taiga: 1.0
  old_growth_spruce_taiga: 1.0
  taiga: 1.0
  snowy_taiga: 1.0
  savanna: 1.0
  savanna_plateau: 1.0
  windswept_hills: 1.0
  windswept_gravelly_hills: 1.0
  windswept_forest: 1.0
  windswept_savanna: 1.0
  jungle: 1.0
  sparse_jungle: 1.0
  bamboo_jungle: 1.0
  badlands: 1.0
  eroded_badlands: 1.0
  wooded_badlands: 1.0
  meadow: 1.0
  cherry_grove: 1.0
  pale_garden: 1.0
  grove: 1.0
  snowy_slopes: 1.0
  frozen_peaks: 1.0
  jagged_peaks: 1.0
  stony_peaks: 1.0
  river: 1.0
  frozen_river: 1.0
  beach: 1.0
  snowy_beach: 1.0
  stony_shore: 1.0
  warm_ocean: 1.0
  lukewarm_ocean: 1.0
  deep_lukewarm_ocean: 1.0
  ocean: 1.0
  deep_ocean: 1.0
  cold_ocean: 1.0
  deep_cold_ocean: 1.0
  frozen_ocean: 1.0
  deep_frozen_ocean: 1.0
  mushroom_fields: 1.0
  dripstone_caves: 1.0
  lush_caves: 1.0
  deep_dark: 1.0
  # --- Nether ---
  nether_wastes: 1.0
  warped_forest: 1.0
  crimson_forest: 1.0
  soul_sand_valley: 1.0
  basalt_deltas: 1.0
  # --- The End ---
  the_end: 1.0
  end_highlands: 1.0
  end_midlands: 1.0
  small_end_islands: 1.0
  end_barrens: 1.0
  # --- Różne / techniczne ---
  the_void: 1.0

# Skanuj w poszukiwaniu bezpiecznych miejsc lądowania we wszystkich załadowanych
# chunkach (oportunistyczne wstępne wypełnianie).
# @type: boolean
# @default: true
sprawdzPrzyZaladowaniuChunka: true

# Włącz gromadzenie danych w tle na potrzeby analityki odwiedzających.
# @type: boolean
# @default: false
goscWlaczony: false

# Zachowuj zarezerwowaną pamięć podręczną dla teleportów przy dołączaniu (rtp.onevent.firstjoin / rtp.onevent.join). Rozmiar według wolnych slotów. Zobacz
# @type: boolean
# @default: false
cacheLogowaniaWlaczona: false

# Twardy limit pamięci podręcznej dołączania. 0 = automatycznie (max-players serwera przy starcie).
# @type: integer
# @range: [0, null]
# @default: 0
limitCacheLogowania: 0

# Szansa odrzucenia niewygenerowanego chunku na każdą próbę wyboru.
# 0.0 = brak preferencji (domyślnie), 1.0 = ściśle unikaj niewygenerowanego terenu.
# Wygenerowane chunki zawsze przechodzą.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.0
preferencjaPregenerowane: 0.0

# Ułamek pojemności zaległości L3, przy którym wznawia się uzupełnianie
# (histereza). 0.5 = uzupełniaj dopiero, gdy L3 spadnie do 50% (domyślnie).
# 1.0 = uzupełniaj ciągle. Wyższe wartości grupują sprawdzenia binów .mca
# dla lepszej wydajności CPU/pamięci.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.5
progUzupelnieniaBacklog: 0.5

# Próg opóźnienia (ms), powyżej którego natychmiast obsłużona (bez kolejki)
# teleportacja jest audytowana: zapisywane jest WARN, a skumulowany licznik
# slowPipelineCount (pokazywany przez /rtp info) jest zwiększany. Audytowane są
# tylko teleportacje natychmiastowe/bez kolejki; te z kolejki są wyłączone, bo ich
# zmierzony czas obejmuje oczekiwanie w kolejce. 0 lub mniej wyłącza audyt. Zob. ADR-053.
# @type: integer
# @range: [0, null]
# @unit: ms
# @default: 5000
progWolnegoPipelineMs: 5000

# Głębokość publicznej kolejki teleportacji (oczekujący gracze), przy której
# audytowane jest spiętrzenie kolejki: zapisywane jest WARN wyzwalane zboczem,
# a skumulowany licznik queueGrowthWarnCount (pokazywany przez /rtp info) jest
# zwiększany raz na przekroczenie. 0 lub mniej wyłącza audyt (opcjonalny). Zob. ADR-053.
# @type: integer
# @range: [0, null]
# @unit: players
# @default: 0
progOstrzezeniaWzrostuKolejki: 0

# Ustawienia /rtp admin prefab. Przepływ apply -> confirm zapisuje każdy zmieniony plik
# konfiguracji z kopią zapasową o nazwie <file>.yml.bak.<epochMillis>;
# bakRetention ogranicza liczbę takich kopii przechowywanych na plik, usuwając najpierw
# najstarsze. Ustaw 1, aby zachować tylko najnowszą; wartości poniżej 1 są podnoszone do 1.
# /rtp admin prefab rollback przechodzi kopie od najnowszej w wielu wywołaniach.
prefabrykat:
  # Number of timestamped config backups kept per file before pruning.
  # @type: integer
  # @range: [1, null]
  # @default: 3
  bakRetention: 3
# NIE ZMIENIAJ NUMERU WERSJI
version: 1.0
