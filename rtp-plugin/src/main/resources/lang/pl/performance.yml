# --- RTP Performance Settings ---
# Documentation: plugins/RTP/docs/admin/PERFORMANCE.md
# Maximum search attempts per /rtp invocation before giving up.
# @type: integer
# @range: [1, null]
# @default: 32
maxAttempts: 32

# Chunk radius loaded around a candidate location during selection.
# 0 loads only the candidate chunk.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
viewDistanceSelect: 0

# Chunk radius loaded around the final location immediately before
# teleport. 0 loads only the destination chunk.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
viewDistanceTeleport: 0

# Ticks between background cache cycles (region pre-fill, queue refill).
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
period: 20

# Maximum milliseconds per tick spent in synchronous tasks.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
syncAllottedTime: 50

# Maximum milliseconds per tick spent in asynchronous tasks.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
asyncAllottedTime: 50

# Minimum server TPS required to continue background queueing.
# Background work pauses when TPS drops below this threshold.
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
minTPS: 19.0

# Refill the region cache immediately after a successful teleport.
# @type: boolean
# @default: false
postTeleportQueueing: false

# Use synchronous chunk loading. NOT RECOMMENDED. Violates S-005 spirit
# on Folia and will block the main thread on Paper/Spigot.
# @type: boolean
# @default: false
syncLoading: false

# Re-parse permission nodes on every event instead of caching.
# @type: boolean
# @default: false
onEventParsing: false

# Parse effect permission nodes at startup.
# @type: boolean
# @default: true
effectParsing: true

# Reuse previously-found biome-matched locations from cache.
# @type: boolean
# @default: true
biomeRecall: true

# When set, only serve biome-filtered requests from cache (never
# generate new biome searches). Requires biomeRecall.
# @type: boolean
# @default: false
biomeRecallForced: false

# Bias biome-filtered selection so each requested biome is steered toward
# with equal probability, instead of in proportion to how much of the
# region it covers. Counteracts common biomes drowning out rare ones when
# several biomes are requested. Requires biomeRecall; no effect on
# unfiltered (default-biome) teleports.
# @type: boolean
# @default: false
biomeWeighted: false

# Per-biome relative selection weights for biome-filtered teleports.
# Only consulted when biomeWeighted is true. Biomes not listed here use
# weight 1.0, so an empty/all-equal map reproduces the equal-probability
# behavior of biomeWeighted on its own. A biome given weight 2.0 is
# steered toward roughly twice as often as a weight-1.0 biome among the
# requested set (when both are present in biome-recall memory); 0.0
# suppresses a biome. Requires biomeRecall; no effect on unfiltered
# (default-biome) teleports. The shipped plains entry is a weight-1.0
# no-op example - replace or extend it with the biomes you want to bias.
# @type: map<string, number>
biomeWeights:
  # @type: number
  # @range: [0.0, null]
  # @default: 1.0
  plains: 1.0

# Scan for safe landing spots in all loaded chunks (opportunistic
# pre-fill).
# @type: boolean
# @default: false
checkOnChunkLoads: false

# Enable background data gathering for visitor analytics.
# @type: boolean
# @default: false
visitorEnabled: false

# Zachowuj zarezerwowaną pamięć podręczną dla teleportów przy dołączaniu (rtp.onevent.firstjoin / rtp.onevent.join). Rozmiar według wolnych slotów. Zobacz
# @type: boolean
# @default: false
loginCacheEnabled: false

# Twardy limit pamięci podręcznej dołączania. 0 = automatycznie (max-players serwera przy starcie).
# @type: integer
# @range: [0, null]
# @default: 0
loginCacheCap: 0

# Probability of rejecting an ungenerated chunk per selection attempt.
# 0.0 = no bias (default), 1.0 = strictly avoid ungenerated land.
# Generated chunks always pass.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.0
pregeneratedPreference: 0.0

# Fraction of L3 backlog capacity at which refill resumes (hysteresis).
# 0.5 = refill only after L3 drains to 50% (default). 1.0 = refill
# continuously. Higher values group .mca-bin checks for better
# CPU/memory efficiency.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.5
backlogRefillThreshold: 0.5

# Latency threshold (ms) above which an immediately-served (unqueued) teleport
# is audited: a WARN is logged and the cumulative slowPipelineCount counter
# (surfaced by /rtp info) is incremented. Only immediate/unqueued teleports are
# audited; queued at-rate teleports are excluded because their measured time
# includes queue-wait. 0 or below disables the audit. See ADR-053.
# @type: integer
# @range: [0, null]
# @unit: ms
# @default: 5000
slowPipelineThresholdMs: 5000

# Public teleport-queue depth (players waiting) at or above which queue
# backpressure is audited: an edge-triggered WARN is logged and the cumulative
# queueGrowthWarnCount counter (surfaced by /rtp info) is incremented once per
# crossing. 0 or below disables the audit (opt-in). See ADR-053.
# @type: integer
# @range: [0, null]
# @unit: players
# @default: 0
queueGrowthWarnThreshold: 0
# Settings for /rtp admin prefab. The `apply` -> `confirm` flow writes
# each touched config file with a sibling backup named
# <file>.yml.bak.<epochMillis>; `bakRetention` caps how many such
# backups are kept per file, oldest pruned first. Set to 1 to keep only
# the most recent backup; values below 1 are clamped to 1. /rtp admin
# prefab rollback walks backups newest-first across multiple invocations.
prefab:
  # @type: integer
  # @range: [1, null]
  # @default: 3
  bakRetention: 3
# DO NOT TOUCH VERSION NUMBER
version: 1.0
