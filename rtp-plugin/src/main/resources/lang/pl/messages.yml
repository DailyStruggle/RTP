# --- Komunikaty RTP widoczne dla gracza ---
# Wszystkie ciagi widoczne dla gracza i konsoli.
#
# Formatowanie:
#   - klasyczne kody kolorow Bukkit (np. &a, &e, &c)
#   - szesnastkowe kody kolorow (np. #2636ef)
#   - symbole PlaceholderAPI (gdy PAPI jest zainstalowane)
#
# Symbole zastepcze:
#   - Wspolne symbole "[Pn]" sa zdefiniowane na liscie `placeholders` ponizej.
#     [P0] to domyslnie prefiks RTP.
#   - Symbole specyficzne dla komunikatu (np. [attempts], [world]) sa opisane
#     bezposrednio nad kazdym komunikatem, ktory ich uzywa.
#
# ###############################################################################
# Sekcja 1: Konfiguracja ogolna
# ###############################################################################
# lista dodatkowych symboli zastepczych
# format: Pn - gdzie n to indeks na tej liscie
symboleZastepcze:
  # P0
  - "[RTP]"

# ###############################################################################
# Sekcja 2: Teleportacja
# ###############################################################################
# podczas teleportacji wyswietl to
juzTeleportowany: "&7[P0] ⚡ już jesteś teleportowany!"

# gdy wtyczka jest aktualnie przeładowywana
teleportOdmowaPrzeladowanie: "&7[P0] teleportacje są tymczasowo wyłączone, gdy plugin się przeładowuje. Spróbuj ponownie za chwilę."
wiadomoscOpoznienia: "&7[P0] ⚡ Teleporting in [delay]. Don't move"
ladowanieChunkow: "&7[P0] ⚙ Wczytywanie chunków! proszę czekać..."
wiadomoscTeleportu: "&7[P0] ⚡ Teleported in [attempts] attempts, in [processingTime]"

# jesli teleportacja zostanie anulowana
teleportAnulowano: "&7[P0] ⚡ Teleportacja anulowana!"

# brak bezpiecznych miejsc po wyczerpaniu maksymalnej liczby prób
# zmienna: [attempts] - maksymalna liczba prób
niebezpieczny: "&7[P0] ⌖ nie udało się znaleźć bezpiecznego miejsca w ciągu [attempts] prób"

# gdy gracz jest na odnowieniu
# zmienna: [remainingCooldown] - pozostały czas
wiadomoscOdnowienia: "&7[P0] ⚡ Nie możesz teleportować się ponownie przez [remainingCooldown]"

# gdy region nie ma żadnych lokalizacji w kolejce, a gracz nie posiada uprawnienia rtp.unqueued
brakLokalizacjiWKolejce: "#f5eb73[P0] ⌖ brak gotowych lokalizacji w tej chwili"

# gdy kolejka się przesuwa
# zmienna: [spot] - bieżąca pozycja w kolejce
aktualizacjaKolejki: "#2636ef[P0] twoje miejsce w kolejce: [spot]"

# gdy gracz nie ma wystarczająco pieniędzy na teleportację w regionie
# zmienna: [money] - kwota wymagana przez polecenie
zaMaloPieniedzy: "&7[P0] potrzebujesz co najmniej $[money] na to."

# ###############################################################################
# Sekcja 3: Formatowanie czasu
# ###############################################################################
# dla symboli czasu: jak nazywac dni, godziny, minuty, sekundy i milisekundy
dni: "d"
godziny: "h"
minuty: "m"
sekundy: "s"
millis: "ms"

# ###############################################################################
# Sekcja 4: System i zarzadzanie
# ###############################################################################
# wersja pliku konfiguracyjnego jest nizsza niz najnowsza
# zmienna: [filename] - nazwa pliku, wraz z rozszerzeniem
staryPlik: "&b[P0] wykryto stary [filename]. Aktualizowanie"

# wykryto świat bukkit nieobecny w pliku konfiguracyjnym
# zmienna: [world] - wykryty świat
nowySwiat: "&b[P0] wykryto nowy świat '[world]'"

# świat nie istnieje w bukkit
# zmienna: [world] - nazwa świata
nieprawidlowySwiat: "&7[P0] nie udało się znaleźć świata '[world]'"

# tekst przeładowania / aktualizacji wtyczki
# zmienna: [filename] - nazwa pliku
przeladowywanie: "&b[P0] wczytywanie [filename]..."
przeladowano: "&b[P0] pomyślnie wczytano [filename]."
aktualizowanie: "&a[P0] aktualizowanie [filename]..."
zaktualizowano: "&a[P0] pomyślnie zaktualizowano [filename]."

# wtyczka nie zawiera polecenia, o które prosił użytkownik
# zmienna: [arg] - próbowany argument
nieprawidlowyArgument: "&c[P0] nieprawidłowy argument polecenia [arg]"

# gdy konsola próbuje wykonać polecenie tylko dla graczy
komendaKonsoliNiedozwolona: "&c[P0] Musisz być graczem w grze, aby wykonać to polecenie."

# wtyczka jest zajeta przeladowywaniem
zajety: "&c[P0] zajęty"

# Sent when the optional PvP combat check refuses /rtp because the player is in combat
pvpInCombat: "&c[P0] Nie możesz losowo się teleportować podczas walki."

# wtyczka nie ma podkomendy lub parametru zadanego przez uzytkownika
# zmienna: [arg] - sprobowany argument
nieprawidlowaKomenda: "&c[P0] nieprawidłowe polecenie - [arg]"

# użytkownik nie ma uprawnień do żądanego polecenia
brakUprawnien: "&7Przykro mi, ale nie masz uprawnień do wykonania tego polecenia. Skontaktuj się z administratorami serwera, jeśli uważasz, że to błąd."

# ###############################################################################
# Sekcja 5: Logi administracyjne
# ###############################################################################
# logowane, gdy lokalizacje sa zapisywane/wczytywane z bazy danych
# zmienna: [amount] - liczba lokalizacji
# zmienna: [region] - nazwa regionu
lokalizacjaZapisana: "&7[P0] Pomyślnie zapisano [amount] lokalizacji dla [region]"
lokalizacjaZaladowana: "&7[P0] Pomyślnie wczytano [amount] lokalizacji dla [region]"

# ###############################################################################
# Sekcja 6: Komenda skanowania
# ###############################################################################
# komunikaty zwiazane z komenda skanowania
# zmienna: [scan_regions] - lista regionow
scanStart: "&a[P0] zadanie skanowania uruchomione dla regionów: [scan_regions]"
skanReset: "&7[P0] kolejka skanowania zresetowana dla regionów: [scan_regions]"
skanAnuluj: "&7[P0] zadanie skanowania anulowane dla regionów: [scan_regions]"
scanPause: "#A020F0[P0] zadanie skanowania wstrzymane dla regionów: [scan_regions]"
skanWznow: "#10A5F5[P0] zadanie skanowania wznowione dla regionów: [scan_regions]"
skanDziala: "&c[P0] zadanie skanowania już działa dla regionów: [scan_regions]"
skanNieDziala: "&c[P0] zadanie skanowania nie działa dla regionów: [scan_regions]"
# zmienne: [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
scanStatus: "[P0] &8» &7[scan_regions] &8| &7[scan_chunks]&8/&7[scan_totalChunks] &8| #7E9CC8[scan_cps]&7 cps &8| #7E9CC8[scan_landPercentage]%&7 ziemia &8| &7ETA #7E9CC8[scan_eta]"

# ###############################################################################
# Sekcja 7: Komenda info
# ###############################################################################
# komunikaty zwiazane z komenda info
infoTytul: "&a&l/rtp info"
infoTickets: "&7Globalne aktywne bilety chunków: #7E9CC8[tickets]"
infoTeleports: "&7Aktywne maszyny stanów teleportacji: #7E9CC8[teleports]"
infoMSPT: "&7Bieżący MSPT pluginu: #7E9CC8[mspt]"
infoLadowaniaRazem: "&7Łącznie wczytanych chunków: #7E9CC8[loads]"
infoLadowaniaWgZrodla: "&7Wczytania wg źródła: #7E9CC8[loadsByOrigin]"
infoWspolczynnikWycieku: "&7Bieżący wskaźnik wycieku chunków: #7E9CC8[leakRate]"
# --- Metrics SPI health block ---
infoGlebokoscKolejki: "&7Gracze oczekujący w kolejkach regionów: #7E9CC8[queueDepth]"
infoOczekujaceTeleporty: "&7Oczekujące potoki teleportacji: #7E9CC8[pendingTeleports]"
infoSredniaPipelineMs: "&7Śr. opóźnienie potoku: #7E9CC8[avgPipelineMs] ms"
# Pipeline-latency percentiles (ADR-053). Placeholders: [pipelineMsP50] [pipelineMsP75]
# [pipelineMsP90] [pipelineMsP95] [pipelineMsP99] [pipelineSampleCount].
infoPipelinePercentiles: "&7Pipeline Latency (ms) P50/P75/P90/P95/P99: #7E9CC8[pipelineMsP50] / [pipelineMsP75] / [pipelineMsP90] / [pipelineMsP95] / [pipelineMsP99]&7 (n=[pipelineSampleCount])"
# Slow-teleport audit (ADR-053, immediate/unqueued teleports only). Placeholders:
# [slowPipelineCount] [slowPipelineThresholdMs].
infoSlowPipeline: "&7Slow Teleports (> #7E9CC8[slowPipelineThresholdMs]&7 ms): #7E9CC8[slowPipelineCount]"
# Queue-growth audit (ADR-053). Placeholders: [queueGrowthWarnCount] [queueGrowthWarnThreshold].
infoQueueGrowth: "&7Queue-Growth Warnings (>= #7E9CC8[queueGrowthWarnThreshold]&7): #7E9CC8[queueGrowthWarnCount]"
infoHeap: "&7Sterta JVM: #7E9CC8[heapUsedMb] / [heapMaxMb] MiB"
# Wiersz nagłówka dla bloku Health pipeline w /rtp info.
infoKondycjaPipelineNaglowek: "&7--- Kondycja: potok ---"
# Odczyt TPS dla okien 1m / 5m / 15m. Zmienne: [tps1m] [tps5m] [tps15m].
infoTps: "&7TPS (1m/5m/15m): #7E9CC8[tps1m] / [tps5m] / [tps15m]"
# Bieżący MSPT serwera oraz wykorzystanie budżetu ticka. Zmienne: [mspt] [tickBudgetUtilisation].
infoMSPTLive: "&7MSPT serwera: #7E9CC8[mspt] ms (&7budżet ticka: #7E9CC8[tickBudgetUtilisation]&7)"
# Configured player soft-cap vs current online count. Placeholders: [softCap] [playerCount].
infoMiekkiLimit: "&7Gracze: #7E9CC8[playerCount] / [softCap]"
# Najnowsze opóźnienie tam i z powrotem bazy danych w ms. Zmienna: [databaseLatencyMs].
infoOpoznienieBazyMs: "&7Opóźnienie bazy danych: #7E9CC8[databaseLatencyMs] ms"
# Generation outcome metrics (ADR-052), sourced from the process-global RtpOutcomeStats.
# Success/failure rate over all recorded generation attempts. Placeholders:
# [genSuccessRate] [genFailureRate] [genOutcomeTotal].
infoFailureRate: "&7Generation Success: #7E9CC8[genSuccessRate]&7 (fail #7E9CC8[genFailureRate]&7, n=#7E9CC8[genOutcomeTotal]&7)"
# Single most common rejection cause and its share of all failures. Placeholders:
# [genTopRejectionCause] [genTopRejectionShare].
infoTopRejectionCause: "&7Top Rejection Cause: #7E9CC8[genTopRejectionCause]&7 (#7E9CC8[genTopRejectionShare]&7)"
# Per-cause rejection breakdown (the analogue of a competitor's /rtp unsafe-stats).
# Placeholder: [genFailureBreakdown] - comma-separated cause=N list, busiest first.
infoFailureBreakdown: "&7Rejections by Cause: #7E9CC8[genFailureBreakdown]"
# Health colour-band thresholds. Doubles consumed by ColourBands in rtp-core
# to wrap coloured-variant placeholders (e.g. [tps1mColoured]) with &a/&7/&c.
infoProgTpsZielony: 19.5
infoProgTpsZolty: 18.0
infoProgMsptZielony: 30.0
infoProgMsptZolty: 45.0
infoProgWypelnienieCacheZielony: 0.5
infoProgWypelnienieCacheZolty: 0.25
infoProgWiekSieciZolty: 5.0
# Wiersz naglowka wprowadzajacy tabele per-region Folia (tylko srodowisko Folia).
infoFoliaRegionyNaglowek: "&7--- Regiony Folia ---"
# Szablon wiersza dla pojedynczego regionu Folia. Zmienne: [regionId] [tps1m]
# [mspt] [playerCount] [queueDepth] [tickBudgetUtilisation].
infoFoliaRegion: "  #7E9CC8[regionId]&7: tps=#7E9CC8[tps1m]&7 mspt=#7E9CC8[mspt]&7 players=#7E9CC8[playerCount]&7 queue=#7E9CC8[queueDepth]&7 budget=#7E9CC8[tickBudgetUtilisation]"
infoZastrzezenieNaglowek: "&7--- Zastrzeżenie diagnostyczne ---"
infoZastrzezenie: "&7Uwaga diagnostyczna: Jeśli całkowita liczba osieroconych chunków serwera przekracza łączną liczbę wczytań tego pluginu ([loads]), ten plugin nie jest jedynym źródłem wycieku pamięci."
infoSwiatNaglowek: "#008080Światy:"
infoKonsolaSwiatNaglowek: "&7--- Światy ---"
infoSwiat: "  #21ADA8[world]"
infoRegionNaglowek: "#63C5DARegiony:"
infoKonsolaRegionNaglowek: "&7--- Regiony ---"
infoRegion: "  #52B2BF[region]"

# pod-listy info
# zmienne: [world], [region], [requirePermission], [override], [shape], [worldBorderOverride], [cacheCap], [cached], [keptCache], [unkeptCache], [backlogCache], [backlogCacheCap]
swiatInfo:
  - "#21ADA8[world]:"
