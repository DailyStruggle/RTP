testOpis: "testuj funkcje RTP"

# ###############################################################################
# Sekcja 8b: Uogolniony framework menu
# ###############################################################################
# Wysylane, gdy konkretna komenda /rtp menu ... jest zniekształcona, wskazuje na
# nieznana sciezke/parametr lub nie przechodzi bramki uprawnien po stronie serwera.
# ADR-050: klikniecia w menu to konkretne komendy, wiec nie ma tokenu do wygasniecia.
menuNieprawidlowe: "&c[P0] that menu link is invalid."
# Wysyłane, gdy realizacja menu nie może rozpoznać UUID wywołującego gracza.
menuNieznanyGracz: "&c[P0] menu links can only be used by in-game players."
# Szablon zastepczy podpowiedzi uzywany przez reflektor menu, gdy dla parametru
# nie ma komentarza blokowego w YAML. Zmienna: [type] - zadeklarowany typ parametru.
menuHoverTypZastepczy: "typ: [type]"
# Szablon zastepczy podpowiedzi uzywany przez reflektor menu, gdy parametr udostepnia
# maly, wyselekcjonowany zbior wartosci. Zmienna: [values] - dozwolone wartosci rozdzielone przecinkami.
menuHoverGraniceZastepcze: "akceptowane: [values]"
# Etykieta wiersza nawigacji "cofnij o jeden poziom" dodawanego na poczatku kazdej nie-glownej strony menu.
menuWstecz: "&7« back"
# Szablon etykiety wiersza "wykonaj zlozona komende" dodawanego na poczatku kazdej
# uruchamialnej, nie-glownej strony menu. Zmienna: [command] - zlozone wywolanie /rtp ...
menuWykonaj: "&a▶ run [command]"
# Wiersz naglowka na gorze podstrony wyboru wartosci parametru (Etap A.2).
# Zmienne: [param] - nazwa parametru; [command] - zlozone wywolanie /rtp ...
menuWybierzWartosc: "&7wybierz wartość dla [param] (uruchomi: /rtp [command] [param]:<value>)"
# Etykieta zastepczego wiersza "wpisz wlasna wartosc" na stronie wyboru wartosci parametru.
# Klikniecie wstepnie wypelnia czat zlozona komenda az do '<param>:', dzieki czemu gracz
# moze wpisac dowolna wartosc, takze spoza listy sugestii.
menuWpiszWartosc: "&7✎ type a custom value..."
# Nieklikalny wiersz naglowka na gorze kazdej nie-glownej strony menu (Etap A.4).
# Pokazuje aktualnie budowane wywolanie /rtp wraz z wszelkimi przypisanymi
# parametrami (name:value). Zmienna: [command] - zlozone argumenty.
menuZbudowane: "&7budowanie: #7E9CC8/rtp [command]"
# Nieklikalny wiersz tytulu dodawany na poczatku glownej strony menu /rtp (Etap A.5).
# Zapewnia powitalny naglowek, zanim gracz zejdzie do dowolnej podkomendy.
menuGlownyTytul: "#5FB3B3&l⚡ RTP menu"
# Nieklikalny wiersz podtytulu/podpowiedzi dodawany na glownej stronie menu /rtp pod
# menuRootTitle (Etap A.5). Krotki tekst orientacyjny dla nowych uzytkownikow.
menuGlownaWskazowka: "&7kliknij opcję poniżej, aby zacząć"
# Wiersze nawigacji dodawane do stronicowanych stron menu (Etap A.6) - klikniecie
# przenosi do poprzedniej/nastepnej strony tego samego modelu. Zmienna:
# [page] - czytelny dla czlowieka numer strony docelowej liczony od 1.
menuStronaPoprzednia: "&7« previous page ([page])"
menuStronaNastepna: "&7next page ([page]) »"
# Separator sekcji na stronie glownej nad wierszami teleportacji (widok gracza).
menuStronaGlownaSekcjaTeleport: "&8--- &7teleport &8---"
# Front-page rows. No placeholders.
menuStronaGlownaWierszTeleport: "&a▶ /rtp &7- teleport to a random location"
menuStronaGlownaWierszRegion: "&a▶ /rtp region:&7... &7- pick a region"
