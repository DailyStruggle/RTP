# --- Mensagens do RTP (Português) ---
# Tradução das mensagens visíveis ao jogador e ao console.
# IMPORTANTE:
# - Os nomes de chave deste arquivo correspondem à coluna direita de
# lang/pt/messages.lang.yml (a tradução dos nomes internos de chave do
# plugin). Se uma chave não aparecer em messages.lang.yml, é usada a
# chave em inglês do arquivo base (lang/messages.lang.yml).
# - Preserve os marcadores entre colchetes como estão: [P0], [delay],
# [attempts], [world], [region], [remainingCooldown], [scan_chunks], etc.
# - Preserve os códigos de cor &a &7 &c e hexadecimais (#2636ef).
# ###############################################################################
# Seção 1: Configuração geral
# ###############################################################################
marcadores:
  # P0
  - "[RTP]"

# ###############################################################################
# Seção 2: Teletransporte
# ###############################################################################
jaTeletransportando: "&7[P0] ⚡ você já está se teletransportando!"

# se o plugin está sendo recarregado no momento
teletransporteNegadoRecarregando: "&7[P0] os teletransportes estão temporariamente desativados enquanto o plugin recarrega. Tente novamente em alguns instantes."
mensagemAtraso: "<gradient:#9D7CD8:#5FB3B3>[P0] ⚡ Teletransportando em [delay]. Nao se mova.</gradient>"
carregamentoChunk: "&7[P0] ⚙ Carregando chunks, por favor aguarde..."
mensagemTeletransporte: "<gradient:#5FB3B3:#9D7CD8>[P0] ⚡ Teletransportado em [attempts] tentativas, em [processingTime]</gradient>"

# if teleport is cancelled
cancelarTeletransporte: "&7[P0] ⚡ Teletransporte cancelado!"

# se não houver lugares seguros após atingir o máximo de tentativas
# espaço reservado: [attempts] - o número máximo de tentativas
inseguro: "&7[P0] ⌖ nenhuma localização segura encontrada em [attempts] tentativas"

# quando o jogador está em tempo de recarga
# espaço reservado: [remainingCooldown] - o tempo restante
mensagemEspera: "&7[P0] ⚡ Você não pode teletransportar-se novamente por [remainingCooldown]"

# when the player has reached the lockAfterUses cap and is locked out (BetterRTP LockAfter parity)
lockedAfterUses: "&7[P0] ⌖ Você atingiu seu limite de teletransporte aleatório. Tente novamente em [remainingLockTime]."

# se a região não tem locais na fila e o jogador não tem a permissão rtp.unqueued
semLocalizacoesNaFila: "#f5eb73[P0] ⌖ não há localizações prontas no momento"

# quando a fila de espera avança
# espaço reservado: [spot] - a posição atual na fila
atualizarFila: "#2636ef[P0] sua posição na fila: [spot]"

# se o jogador não tiver dinheiro suficiente para teletransportar na região
# espaço reservado: [money] - quanto dinheiro o comando exige
dinheiroInsuficiente: "&7[P0] você precisa de pelo menos $[money] para isso."

# ###############################################################################
# Seção 3: Formato de tempo
# ###############################################################################
dias: "d"
horas: "h"
minutos: "m"
segundos: "s"
milissegundos: "ms"

# ###############################################################################
# Seção 4: Sistema e administração
# ###############################################################################
arquivoAntigo: "&b[P0] [filename] antigo detectado. Atualizando"

# detectado um mundo bukkit que não está no arquivo de configuração
# espaço reservado: [world] - o mundo detectado
mundoNovo: "&b[P0] novo mundo '[world]' detectado"

# o mundo não existe no bukkit
# espaço reservado: [world] - o nome do mundo
mundoInvalido: "&7[P0] não foi possível encontrar o mundo '[world]'"

# texto de recarga / atualização do plugin
# espaço reservado: [filename] - nome do arquivo
recarregando: "&b[P0] carregando [filename]..."
recarregado: "&b[P0] [filename] carregado com sucesso."
atualizando: "&a[P0] atualizando [filename]..."
atualizado: "&a[P0] [filename] atualizado com sucesso."

# o plugin não tem o comando que o usuário solicitou
# espaço reservado: [arg] - o argumento tentado
argumentoInvalido: "&c[P0] argumento de comando inválido [arg]"

# quando o console tenta executar um comando apenas para jogadores
comandoConsoleNaoPermitido: "&c[P0] Você precisa ser um jogador no jogo para executar este comando."

# busy e invalidCommand não são traduzidos em messages.lang.yml -> usam-se as chaves em inglês (fallback ao baseline).
busy: "&c[P0] ocupado"

# Sent when the optional PvP combat check refuses /rtp because the player is in combat
pvpInCombat: "&c[P0] Você não pode se teleportar aleatoriamente durante o combate."

# plugin doesn't have the subcommand or parameter the user requested
# placeholder: [arg] - the argument attempted
invalidCommand: "&c[P0] comando inválido - [arg]"

# o usuário não tem permissão para o comando solicitado
semPermissoes: "&7Desculpe, mas você não tem permissão para executar este comando. Contate os administradores do servidor se acredita que isso é um erro."

# ###############################################################################
# Seção 5: Registros administrativos
# ###############################################################################
localizacaoSalva: "&7[P0] [amount] localizações salvas com sucesso para [region]"
localizacaoCarregada: "&7[P0] [amount] localizações carregadas com sucesso para [region]"

# ###############################################################################
# Seção 6: Comando Scan
# ###############################################################################
iniciarEscaneamento: "&a[P0] tarefa de escaneamento iniciada para as regiões: [scan_regions]"
reiniciarEscaneamento: "&7[P0] fila de escaneamento reiniciada para as regiões: [scan_regions]"
cancelarEscaneamento: "&7[P0] tarefa de escaneamento cancelada para as regiões: [scan_regions]"
pausarEscaneamento: "#A020F0[P0] tarefa de escaneamento pausada para as regiões: [scan_regions]"
retomarEscaneamento: "#10A5F5[P0] tarefa de escaneamento retomada para as regiões: [scan_regions]"
escaneamentoAtivo: "&c[P0] já existe uma tarefa de escaneamento em andamento para as regiões: [scan_regions]"
escaneamentoNaoAtivo: "&c[P0] não há tarefa de escaneamento em andamento para as regiões: [scan_regions]"
# placeholder: [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
estadoEscaneamento: "[P0] &8» &7[scan_regions] &8| &7[scan_chunks]&8/&7[scan_totalChunks] &8| #7E9CC8[scan_cps]&7 cps &8| #7E9CC8[scan_landPercentage]%&7 terra &8| &7ETA #7E9CC8[scan_eta]"
# Boss-bar title shown to players with rtp.scan permission while a world scan is running.
# Set to empty string to disable the boss-bar.
# placeholder: [scan_regions], [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
scanBossBar: "Scanning [scan_regions]: [scan_chunks]/[scan_totalChunks] ([scan_landPercentage]% land) ETA [scan_eta]"

# ###############################################################################
# Seção 7: Comando Info
# ###############################################################################
tituloInfo: "&2&l/rtp info"
infoTickets: "&7Tickets de chunk ativos globais: #7E9CC8[tickets]"
# infoTeletransportes: deduplicado com infoPendingTeleports no bloco Health (esvaziado por compatibilidade com sobrescritas de locale).
infoTeletransportes: ""
# infoMSPT: deduplicado com infoMSPTLive ("MSPT: x ms (orçamento do tick y%)"); a linha live carrega o indicador de orçamento.
infoMSPT: ""
infoCargasTotais: "&7Chunks carregados ao longo da vida: #7E9CC8[loads]"
infoCargasPorOrigem: "&7Carregamentos por origem: #7E9CC8[loadsByOrigin]"
infoTaxaVazamento: "&7Taxa atual de vazamento de chunks: #7E9CC8[leakRate]"
# --- Metrics SPI health block ---
infoQueueDepth: "&7Jogadores aguardando nas filas de região: #7E9CC8[queueDepth]"
infoPendingTeleports: "&7Pipelines de teletransporte pendentes: #7E9CC8[pendingTeleports]"
infoAvgPipelineMs: "&7Latência média do pipeline: #7E9CC8[avgPipelineMs] ms"
# Pipeline-latency percentiles (ADR-053). Placeholders: [pipelineMsP50] [pipelineMsP75]
# [pipelineMsP90] [pipelineMsP95] [pipelineMsP99] [pipelineSampleCount].
infoPipelinePercentiles: "&7Latência do pipeline (ms) P50/P75/P90/P95/P99: #7E9CC8[pipelineMsP50] / [pipelineMsP75] / [pipelineMsP90] / [pipelineMsP95] / [pipelineMsP99]&7 (n=[pipelineSampleCount])"
# Slow-teleport audit (ADR-053, immediate/unqueued teleports only). Placeholders:
# [slowPipelineCount] [slowPipelineThresholdMs].
infoSlowPipeline: "&7Teletransportes lentos (> #7E9CC8[slowPipelineThresholdMs]&7 ms): #7E9CC8[slowPipelineCount]"
# Queue-growth audit (ADR-053). Placeholders: [queueGrowthWarnCount] [queueGrowthWarnThreshold].
infoQueueGrowth: "&7Avisos de crescimento da fila (>= #7E9CC8[queueGrowthWarnThreshold]&7): #7E9CC8[queueGrowthWarnCount]"
infoHeap: "&7Heap da JVM: #7E9CC8[heapUsedMb] / [heapMaxMb] MiB"
# Linha de cabeçalho do bloco rotulado Health pipeline em /rtp info.
infoHealthPipelineHeader: "&7--- Estado: pipeline ---"
# Leitura de TPS para as janelas 1m / 5m / 15m. Espaços reservados: [tps1m] [tps5m] [tps15m].
infoTps: "&7TPS (1m/5m/15m): #7E9CC8[tps1m] / [tps5m] / [tps15m]"
# MSPT do servidor em tempo real e utilização do orçamento de tick. Espaços reservados: [mspt] [tickBudgetUtilisation].
infoMSPTLive: "&7MSPT do servidor: #7E9CC8[mspt] ms (&7orçamento de tick: #7E9CC8[tickBudgetUtilisation]&7)"
# Configured player soft-cap vs current online count. Placeholders: [softCap] [playerCount].
infoSoftCap: "&7Jogadores: #7E9CC8[playerCount] / [softCap]"
# Latência mais recente de ida e volta do banco de dados em ms. Espaço reservado: [databaseLatencyMs].
infoDatabaseLatencyMs: "&7Latência do banco de dados: #7E9CC8[databaseLatencyMs] ms"
# Generation outcome metrics (ADR-052), sourced from the process-global RtpOutcomeStats.
# Success/failure rate over all recorded generation attempts. Placeholders:
# [genSuccessRate] [genFailureRate] [genOutcomeTotal].
infoFailureRate: "&7Sucesso de geração: #7E9CC8[genSuccessRate]&7 (falhas #7E9CC8[genFailureRate]&7, n=#7E9CC8[genOutcomeTotal]&7)"
# Single most common rejection cause and its share of all failures. Placeholders:
# [genTopRejectionCause] [genTopRejectionShare].
infoTopRejectionCause: "&7Principal causa de rejeição: #7E9CC8[genTopRejectionCause]&7 (#7E9CC8[genTopRejectionShare]&7)"
# Per-cause rejection breakdown (the analogue of a competitor's /rtp unsafe-stats).
# Placeholder: [genFailureBreakdown] - comma-separated cause=N list, busiest first.
infoFailureBreakdown: "&7Rejeições por causa: #7E9CC8[genFailureBreakdown]"
# Health colour-band thresholds. Doubles consumed by ColourBands in rtp-core
# to wrap coloured-variant placeholders (e.g. [tps1mColoured]) with &a/&7/&c.
infoThresholdTpsGreen: 19.5
infoThresholdTpsYellow: 18.0
infoThresholdMsptGreen: 30.0
infoThresholdMsptYellow: 45.0
infoThresholdCacheFillGreen: 0.5
infoThresholdCacheFillYellow: 0.25
infoThresholdNetworkAgeYellow: 5.0
# Header line introducing the per-Folia-region table (Folia runtime only).
infoFoliaRegionsHeader: "&7--- Regiões do Folia ---"
# Per-row template for a single Folia region. Placeholders: [regionId] [tps1m]
# [mspt] [playerCount] [queueDepth] [tickBudgetUtilisation].
infoFoliaRegion: "#7E9CC8[regionId]&7: tps=#7E9CC8[tps1m]&7 mspt=#7E9CC8[mspt]&7 players=#7E9CC8[playerCount]&7 queue=#7E9CC8[queueDepth]&7 budget=#7E9CC8[tickBudgetUtilisation]"
cabecalhoAvisoInfo: "&7--- Aviso de diagnóstico ---"
avisoInfo: "&7Nota de diagnóstico: Se o número total de chunks órfãos do servidor exceder o total histórico de cargas deste plugin ([loads]), este plugin não é a única causa do vazamento de memória."
cabecalhoMundoInfo: "#008080Mundos:"
cabecalhoMundoConsoleInfo: "&7--- Mundos ---"
infoMundo: "#21ADA8[world]"
cabecalhoRegiaoInfo: "#63C5DARegiões:"
cabecalhoRegiaoConsoleInfo: "&7--- Regiões ---"
infoRegiao: "#52B2BF[region]"
# Biome-occupancy leaderboard shown by /rtp info biomes - which biomes online
# players spend their time in, sampled over the server's uptime.
# Header placeholders: [biomeTotalSamples] [biomeDistinctCount].
infoBiomeActivityHeader: "&8--- &3Ocupação de biomas &8(&3[biomeTotalSamples]&8 amostras, &3[biomeDistinctCount]&8 biomas) ---"
# Per-biome row. Placeholders: [biomeRank] [biomeName] [biomeSamples] [biomePercent] [biomeBar].
infoBiomeActivityRow: "&8 [biomeRank]. &3[biomeName] &8[biomeBar] &7[biomePercent]% &8([biomeSamples])"
# Shown when no occupancy has been sampled yet.
infoBiomeActivityEmpty: "&8--- &7nenhuma ocupação de biomas amostrada ainda &8---"

# sub-info listings
# placeholders: [world], [region], [requirePermission], [override], [shape], [worldBorderOverride], [cacheCap], [cached], [keptCache], [unkeptCache], [backlogCache], [backlogCacheCap]
dadosMundo:
  - "#21ADA8[world]:"
  - "#99EEBB  - região: [region]"
  - "#99EEBB  - permissão exigida: [requirePermission]"
  - "#99EEBB  - substituição: [override]"

dadosRegiao:
  - "#52B2BF[region]:"
  - "#58CCED  - mundo: [world]"
  - "#58CCED  - forma: [shape]"
  - "#58CCED  - permissão exigida: [requirePermission]"
  - "#58CCED  - substituição da borda do mundo: [worldBorderOverride]"
  - "#58CCED  - limite de cache: [cacheCap]"
  - "#58CCED  - cache mantido (L1): [keptCache]"
  - "#58CCED  - cache liberado (L2): [unkeptCache]"
  - "#58CCED  - cache de backlog (L3): [backlogCache] / [backlogCacheCap]"
  - "#58CCED  - em cache: [cached]"
  - "#58CCED  - cobertura aprendida: [memCoveragePct] (ruins: [memBadPct], [memBadCount] células)"
  - "#58CCED  - principal causa de rejeição: [memTopCause] ([memTopCausePct])"

