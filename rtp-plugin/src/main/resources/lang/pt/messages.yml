# --- Mensagens do RTP (Português) ---
# Tradução das mensagens visíveis ao jogador e ao console.
#
# IMPORTANTE:
#   - Os nomes de chave deste arquivo correspondem à coluna direita de
#     lang/pt/messages.lang.yml (a tradução dos nomes internos de chave do
#     plugin). Se uma chave não aparecer em messages.lang.yml, é usada a
#     chave em inglês do arquivo base (lang/messages.lang.yml).
#   - Preserve os marcadores entre colchetes como estão: [P0], [delay],
#     [attempts], [world], [region], [remainingCooldown], [scan_chunks], etc.
#   - Preserve os códigos de cor &a &e &c e hexadecimais (#2636ef).
#
# REQ-RTP-F-013 / ADR-020.
# ###############################################################################
# Seção 1: Configuração geral
# ###############################################################################
marcadores:
  # P0
  - "[RTP]"

# ###############################################################################
# Seção 2: Teletransporte
# ###############################################################################
jaTeletransportando: "&e[P0] você já está se teletransportando!"

# if the plugin is currently reloading
teletransporteNegadoRecarregando: "&e[P0] os teletransportes estão temporariamente desativados enquanto o plugin recarrega. Tente novamente em alguns instantes."
mensagemAtraso: "&e[P0] Teletransportando em [delay]. Não se mova."
carregamentoChunk: "&e[P0] Carregando chunks, por favor aguarde..."
mensagemTeletransporte: "&e[P0] Teletransportado em [attempts] tentativas, em [processingTime]"

# if teleport is cancelled
cancelarTeletransporte: "&e[P0] Teletransporte cancelado!"

# if no safe places after reaching max attempts
# placeholder: [attempts] - the maximum number of attempts
inseguro: "&e[P0] nenhuma localização segura encontrada em [attempts] tentativas"

# when the player is on cooldown
# placeholder: [remainingCooldown] - the remaining time
mensagemEspera: "&e[P0] Você não pode teletransportar-se novamente por [remainingCooldown]"

# if the region doesn't have any locations queued and the player doesn't have rtp.unqueued permission
semLocalizacoesNaFila: "#f5eb73[P0] não há localizações prontas no momento"

# when the queue line shifts
# placeholder: [spot] - the current position in line
atualizarFila: "#2636ef[P0] sua posição na fila: [spot]"

# if the player doesn't have enough money to teleport in the region
# placeholder: [money] - how much money is required for the command
dinheiroInsuficiente: "&e[P0] você precisa de pelo menos $[money] para isso."

# ###############################################################################
# Seção 3: Formato de tempo
# ###############################################################################
dias: "d"
horas: "h"
minutos: "m"
segundos: "s"
milissegundos: "ms"

# ###############################################################################
# Seção 4: Sistema e administração
# ###############################################################################
arquivoAntigo: "&b[P0] [filename] antigo detectado. Atualizando"

# detected a bukkit world that isn't in the config file
# placeholder: [world] - the world detected
mundoNovo: "&b[P0] novo mundo '[world]' detectado"

# world doesn't exist in bukkit
# placeholder: [world] - the world name
mundoInvalido: "&e[P0] não foi possível encontrar o mundo '[world]'"

# plugin reload/update text
# placeholder: [filename] - name of file
recarregando: "&b[P0] carregando [filename]..."
recarregado: "&b[P0] [filename] carregado com sucesso."
atualizando: "&a[P0] atualizando [filename]..."
atualizado: "&a[P0] [filename] atualizado com sucesso."

# plugin doesn't have the command the user requested
# placeholder: [arg] - the argument attempted
argumentoInvalido: "&c[P0] argumento de comando inválido [arg]"

# when the console tries to run a command meant only for players
comandoConsoleNaoPermitido: "&c[P0] Você precisa ser um jogador no jogo para executar este comando."

# busy e invalidCommand não são traduzidos em messages.lang.yml -> usam-se as chaves em inglês (fallback ao baseline).
busy: "&c[P0] ocupado"

# plugin doesn't have the subcommand or parameter the user requested
# placeholder: [arg] - the argument attempted
invalidCommand: "&c[P0] comando inválido - [arg]"

# user doesn't have permission for the command requested
semPermissoes: "&eDesculpe, mas você não tem permissão para executar este comando. Contate os administradores do servidor se acredita que isso é um erro."

# ###############################################################################
# Seção 5: Registros administrativos
# ###############################################################################
localizacaoSalva: "&e[P0] [amount] localizações salvas com sucesso para [region]"
localizacaoCarregada: "&e[P0] [amount] localizações carregadas com sucesso para [region]"

# ###############################################################################
# Seção 6: Comando Scan
# ###############################################################################
iniciarEscaneamento: "&a[P0] tarefa de escaneamento iniciada para as regiões: [scan_regions]"
reiniciarEscaneamento: "&e[P0] fila de escaneamento reiniciada para as regiões: [scan_regions]"
cancelarEscaneamento: "&e[P0] tarefa de escaneamento cancelada para as regiões: [scan_regions]"
pausarEscaneamento: "#A020F0[P0] tarefa de escaneamento pausada para as regiões: [scan_regions]"
retomarEscaneamento: "#10A5F5[P0] tarefa de escaneamento retomada para as regiões: [scan_regions]"
escaneamentoAtivo: "&c[P0] já existe uma tarefa de escaneamento em andamento para as regiões: [scan_regions]"
escaneamentoNaoAtivo: "&c[P0] não há tarefa de escaneamento em andamento para as regiões: [scan_regions]"
# placeholder: [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
estadoEscaneamento: "&a[P0] concluídos [scan_chunks] / [scan_totalChunks] chunks para as regiões: [scan_regions]. [scan_cps] cps. Porcentagem de terra: [scan_landPercentage]%. Tempo restante: [scan_eta]"

# ###############################################################################
# Seção 7: Comando Info
# ###############################################################################
tituloInfo: "&a======Informações do RTP======"
infoTickets: "&7Tickets de chunk ativos globais: &f[tickets]"
# infoTeletransportes: deduplicado com infoPendingTeleports no bloco Health (esvaziado por compatibilidade com sobrescritas de locale).
infoTeletransportes: ""
# infoMSPT: deduplicado com infoMSPTLive ("MSPT: x ms (orçamento do tick y%)"); a linha live carrega o indicador de orçamento.
infoMSPT: ""
infoCargasTotais: "&7Chunks carregados ao longo da vida: &f[loads]"
infoCargasPorOrigem: "&7Cargas por origem: &f[loadsByOrigin]"
infoTaxaVazamento: "&7Taxa atual de vazamento de chunks: &f[leakRate]"
# --- Metrics SPI health block (METRICS_PLAN.md > /rtp info Surface) ---
infoQueueDepth: "&7Jogadores aguardando em filas de região: &f[queueDepth]"
infoPendingTeleports: "&7Pipelines de teletransporte pendentes: &f[pendingTeleports]"
infoAvgPipelineMs: "&7Avg Pipeline Latency: &f[avgPipelineMs] ms"
infoHeap: "&7Heap da JVM: &f[heapUsedMb] / [heapMaxMb] MiB"
# Header line for the Health pipeline labelled block in /rtp info.
infoHealthPipelineHeader: "&7--- Health: pipeline ---"
# TPS readout for the 1m / 5m / 15m windows. Placeholders: [tps1m] [tps5m] [tps15m].
infoTps: "&7TPS (1m/5m/15m): &f[tps1m] / [tps5m] / [tps15m]"
# Live server MSPT and tick-budget utilisation. Placeholders: [mspt] [tickBudgetUtilisation].
infoMSPTLive: "&7Server MSPT: &f[mspt] ms (&7tick budget: &f[tickBudgetUtilisation]&7)"
# Configured player soft-cap vs current online count. Placeholders: [softCap] [playerCount].
infoSoftCap: "&7Players: &f[playerCount] / [softCap]"
# Most recent database round-trip latency in ms. Placeholder: [databaseLatencyMs].
infoDatabaseLatencyMs: "&7Database Latency: &f[databaseLatencyMs] ms"
# Health colour-band thresholds. Doubles consumed by ColourBands in rtp-core
# to wrap coloured-variant placeholders (e.g. [tps1mColoured]) with &a/&e/&c.
infoThresholdTpsGreen: 19.5
infoThresholdTpsYellow: 18.0
infoThresholdMsptGreen: 30.0
infoThresholdMsptYellow: 45.0
infoThresholdCacheFillGreen: 0.5
infoThresholdCacheFillYellow: 0.25
infoThresholdNetworkAgeYellow: 5.0
# Header line introducing the per-Folia-region table (Folia runtime only).
infoFoliaRegionsHeader: "&7--- Folia regions ---"
# Per-row template for a single Folia region. Placeholders: [regionId] [tps1m]
# [mspt] [playerCount] [queueDepth] [tickBudgetUtilisation].
infoFoliaRegion: "  &f[regionId]&7: tps=&f[tps1m]&7 mspt=&f[mspt]&7 players=&f[playerCount]&7 queue=&f[queueDepth]&7 budget=&f[tickBudgetUtilisation]"
cabecalhoAvisoInfo: "&7--- Aviso de diagnóstico ---"
avisoInfo: "&7Nota de diagnóstico: Se o número total de chunks órfãos do servidor exceder o total histórico de cargas deste plugin ([loads]), este plugin não é a única causa do vazamento de memória."
cabecalhoMundoInfo: "#008080Mundos:"
cabecalhoMundoConsoleInfo: "&7--- Mundos ---"
infoMundo: "  #21ADA8[world]"
cabecalhoRegiaoInfo: "#63C5DARegiões:"
cabecalhoRegiaoConsoleInfo: "&7--- Regiões ---"
infoRegiao: "  #52B2BF[region]"

# sub-info listings
# placeholders: [world], [region], [requirePermission], [override], [shape], [worldBorderOverride], [cacheCap], [cached], [keptCache], [unkeptCache], [backlogCache], [backlogCacheCap]
dadosMundo:
  - "#21ADA8[world]:"
  - "#99EEBB  - regiao: [region]"
  - "#99EEBB  - exigirPermissao: [requirePermission]"
  - "#99EEBB  - sobrescrever: [override]"

dadosRegiao:
  - "#52B2BF[region]:"
  - "#58CCED  - mundo: [world]"
  - "#58CCED  - forma: [shape]"
  - "#58CCED  - exigirPermissao: [requirePermission]"
  - "#58CCED  - sobrescritaDeBorda: [worldBorderOverride]"
  - "#58CCED  - capacidadeCache: [cacheCap]"
  - "#58CCED  - cacheRetida (L1): [keptCache]"
  - "#58CCED  - cacheLiberada (L2): [unkeptCache]"
  - "#58CCED  - cacheAcumulada (L3): [backlogCache] / [backlogCacheCap]"
  - "#58CCED  - emCache: [cached]"

# ###############################################################################
# Seção 8: Descrições de comandos
# ###############################################################################
rtp: "&b/rtp - teletransporte-se para uma localização aleatória"
rtp_descricao: "teletransporte-se para uma localização aleatória"
ajuda: "&b/rtp help - mostrar esta ajuda"
ajuda_descricao: "descrever comandos"
recarregar: "&b/rtp reload - recarregar os arquivos de configuração"
recarregar_descricao: "recarregar arquivos de configuração"
escaneamento: "&b/rtp scan - testar todas as localizações possíveis da região para melhorar os tempos de carregamento"
escaneamento_descricao: "apagar dados salvos e testar todas as localizações possíveis da região"
config_descricao: "atualizar arquivos de configuração em tempo de execução"
info_descricao: "verificar o estado atual do plugin"
teste_descricao: "testar funcionalidades do RTP"

# ###############################################################################
# Seção 8b: Framework de menus generalizado (ADR-035 / ADR-044)
# ###############################################################################
# Estas chaves não são traduzidas em lang/pt/messages.lang.yml, portanto usam-se
# os nomes canônicos em inglês (fallback ao baseline ADR-020).
menuInvalid: "&c[P0] esse link de menu não é válido."
# Sent when a menu token has expired or was already consumed.
menuExpired: "&c[P0] esse link de menu expirou. Reabra o menu."
# Sent when a menu redeem cannot resolve the calling player UUID.
menuUnknownPlayer: "&c[P0] os links de menu só podem ser usados por jogadores no jogo."
# Modelo de tooltip quando não há comentário YAML disponível para um parâmetro. Marcador: [type] - o tipo declarado do parâmetro.
menuHoverFallbackType: "tipo: [type]"
# Modelo de tooltip quando um parâmetro expõe um conjunto pequeno de valores. Marcador: [values] - valores aceitos separados por vírgula.
menuHoverFallbackBounds: "aceitos: [values]"
# Rótulo da linha de navegação "voltar um nível" em cada página de menu não raiz.
menuBack: "&7<< voltar"
# Modelo da linha "executar o comando montado" em cada página de menu executável não raiz. Marcador: [command] - a invocação /rtp ... montada.
menuExecute: "&a> executar [command]"
# Cabeçalho de uma subpágina seletora de valor de parâmetro (Etapa A.2).
# Marcadores: [param] - nome do parâmetro; [command] - a invocação /rtp ... montada.
menuPickValue: "&eescolha um valor para [param] (executará: /rtp [command] [param]:<valor>)"
# Rótulo da linha "digitar valor personalizado" como alternativa no seletor.
# Ao clicar, preenche o chat com o comando montado até '<param>:'.
menuTypeValue: "&7digitar um valor personalizado..."
# Non-clickable header row at the top of every non-root menu page (Stage A.4).
# Surfaces the currently-constructed /rtp invocation including any staged
# parameter assignments (name:value). Placeholder: [command] - assembled args.
menuConstructed: "&7construindo: &f/rtp [command]"
# Título não interativo no topo do menu raiz /rtp menu (Etapa A.5).
menuRootTitle: "&6&l menu do RTP"
# Subtítulo/orientação não interativo abaixo de menuRootTitle (Etapa A.5).
menuRootHint: "&7clique em uma opção para começar"
# Linhas de navegação adicionadas a páginas de menu paginadas (Etapa A.6).
# Marcador: [page] - número de página de destino (base 1).
menuPagePrev: "&7<< página anterior ([page])"
menuPageNext: "&7página seguinte ([page]) >>"
# Section divider on the front page above teleport rows (player view).
menuFrontPageSectionTeleport: "&8--- &7teleport &8---"
# Section divider on the front page above admin rows (admin view).
menuFrontPageSectionAdmin: "&8--- &7admin &8---"
# Front-page rows. No placeholders.
menuFrontPageRowTeleport: "&a▶ /rtp &7- teleport to a random location"
menuFrontPageRowRegion: "&a▶ /rtp region:&7... &7- pick a region"
menuFrontPageRowBiome: "&a▶ /rtp biome:&7... &7- pick a biome"
menuFrontPageRowHelp: "&a▶ /rtp help &7- list commands"
menuFrontPageRowInfo: "&b▶ /rtp info &7- plugin diagnostics"
menuFrontPageRowConfig: "&b▶ /rtp config &7- edit config files"
menuFrontPageRowScan: "&b▶ /rtp scan &7- pre-fill region caches"
menuFrontPageRowDiagnostics: "&c▶ /rtp test full &7- run full diagnostics"
menuFrontPageRowReload: "&c▶ /rtp reload &7- reload config files"
# Hover text for the diagnostics row warning about cost. No placeholders.
menuFrontPageHoverDiagnostics: "&7runs full diagnostic suite; may be expensive"
# Hover text for the reload row warning about side-effects. No placeholders.
menuFrontPageHoverReload: "&7reloads all config files; in-flight teleports may be affected"

