cancelarEscaneamento: "&7[P0] tarefa de escaneamento cancelada para as regiões: [scan_regions]"
pausarEscaneamento: "#A020F0[P0] tarefa de escaneamento pausada para as regiões: [scan_regions]"
retomarEscaneamento: "#10A5F5[P0] tarefa de escaneamento retomada para as regiões: [scan_regions]"
