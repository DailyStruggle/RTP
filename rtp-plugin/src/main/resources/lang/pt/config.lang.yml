# --- Mapeamento de Idioma: config.yml ---
# Mapeia as chaves internas (esquerda) para os nomes visíveis ao usuário
# em config.yml (direita). Edite apenas o lado direito para renomear ou
# traduzir uma opção; o lado esquerdo é uma constante de código e não
# deve ser alterado.
# Se este arquivo estiver ausente, o plugin o regenera com pares
# idênticos esquerda/direita (os valores padrão em inglês).
database: "bancoDeDados"
playerCommands: "comandosJogador"
teleportCooldown: "tempoDeEsperaTeletransporte"
cancelDistance: "distanciaCancelamento"
teleportDelay: "atrasoTeletransporte"
consoleCommands: "comandosConsole"
version: "version"
network: "rede"
