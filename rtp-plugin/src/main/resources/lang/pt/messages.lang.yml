# --- Mapeamento de Idioma: messages.yml ---
# Mapeia as chaves internas de mensagem (esquerda) para os nomes visíveis
# ao usuário em messages.yml (direita). Edite apenas o lado direito para
# renomear ou traduzir uma chave de mensagem; o lado esquerdo é uma
# constante de código e não deve ser alterado.
# Observação: este arquivo mapeia apenas NOMES DE CHAVE. O texto traduzido
# da própria mensagem vive em messages.yml. Se este arquivo estiver
# ausente, o plugin o regenera com pares idênticos esquerda/direita (os
# valores padrão em inglês).
