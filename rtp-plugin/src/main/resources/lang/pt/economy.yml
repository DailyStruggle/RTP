# --- Configuração econômica do RTP ---
# Configura os custos do teletransporte aleatório usando a economia do servidor.
# Custos do teletransporte
# Custo base para um comando /rtp padrão.
# @type: number
# @range: [0.0, null]
# @default: 50.0
preco: 50.0

# Custo para teletransportar outro jogador (/rtp <jogador>).
# @type: number
# @range: [0.0, null]
# @default: 200.0
precoOutro: 200.0

# Custo por usar parâmetros personalizados (/rtp region:<região>, etc.).
# @type: number
# @range: [0.0, null]
# @default: 1000000000.0
precoParametros: 1000000000.0

# Custo adicional por especificar um bioma (/rtp biome:<bioma>).
# @type: number
# @range: [0.0, null]
# @default: 5000.0
precoBioma: 5000.0

# Reembolsa o custo se o teleporte for cancelado (o jogador se move, falha, etc.).
# @type: boolean
# @default: true
reembolsoAoCancelar: true

# Saldo mínimo que o jogador deve manter após pagar; o teleporte é rejeitado
# se cair abaixo deste limite.
# @type: number
# @range: [0.0, null]
# @default: 0.0
saldoMinimo: 0.0

# NAO MODIFIQUE O NUMERO DE VERSAO
version: 1.0
