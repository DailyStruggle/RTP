# --- Mensagens do RTP (este idioma) ---
# Textos de mensagens para jogadores e operadores neste idioma, agrupados por tema.
# Copia gerada automaticamente das mensagens em ingles; nao editar a mao (sera sobrescrito).

# --- Mensagens do modo de rede entre servidores ---
# Enviadas apenas quando `network.enabled: true` e o `/rtp` do jogador é roteado
# pela fila de espera entre servidores (consulte network.yml `routing.mode`).
# Todas as chaves são opcionais da perspectiva do jogador - o ciclo básico
# de `delayMessage` / `teleportMessage` ainda conduz o fluxo visível.
# Enviado quando a solicitação foi aceita na fila de espera entre servidores
# e aguarda a reivindicação de um backend. Espaço reservado: [position] - posição
# indexada em 0 de `pollStatus`; pode estar vazio se o transporte não retornar
# nenhuma posição.
networkQueued: "&7[P0] na fila para um destino entre servidores (posição [position])..."

# Enviado quando um jogador executa /rtp enquanto já aguarda na fila entre servidores.
# Espaço reservado: [position] - posição na fila; pode estar vazio.
alreadyQueued: "&cVocê já está esperando na fila entre servidores (posição [position]). Aguarde."

# Enviado quando uma entrada na fila entre servidores esperou muito tempo e foi descartada.
# Sem espaços reservados.
networkTimedOut: "&c[P0] o teleporte entre servidores expirou enquanto aguardava um backend."

# Enviado quando a fila entre servidores está cheia e a solicitação é rejeitada.
# Sem espaços reservados.
waitlistFull: "&c[P0] a fila entre servidores está cheia; tente novamente em breve."

# Enviado quando a fila transferiu a solicitação para o roteador do proxy e
# a seleção de um backend está em andamento.
networkRouting: "&7[P0] roteando para um backend..."

# Enviado quando um backend reservou uma coordenada para este jogador e o
# proxy está prestes a iniciar o salto entre servidores. Espaço reservado: [server]
# - o serverId do backend de destino.
networkReserved: "&a[P0] coordenada reservada em [server]. Transferindo..."

# Enviado quando o proxy está no meio do salto. Espaço reservado: [server] - destino.
networkTransferring: "&a[P0] transferindo para [server]..."

# Enviado quando a rota entre servidores desistiu e recorreu ao servidor local.
# Espaço reservado: [reason] - o motivo do fallback.
networkFallback: "&e[P0] entre servidores indisponível ([reason]); voltando ao local."

# Enviado quando a solicitação entre servidores falhou e nenhum fallback foi possível.
# Espaço reservado: [reason] - o motivo da falha.
networkFailed: "&c[P0] o teleporte entre servidores falhou: [reason]."

# Enviado quando o jogador solicitou uma região específica (`/rtp <region>`), mas
# nenhum backend na rede a está atendendo no momento. Espaço reservado:
# [region] - o nome da região solicitada.
networkRegionUnavailable: "&c[P0] nenhum backend está servindo a região '[region]' no momento."

# Enviado quando o nome da região solicitada resolve para dois ou mais backends e
# a política configurada pelo operador não pode escolher um (só dispara
# sob políticas mais rigorosas que o padrão `warn`). Espaço reservado: [region].
networkRegionAmbiguous: "&c[P0] a região '[region]' é ambígua entre backends; fixe um servidor."

# DO NOT TOUCH VERSION NUMBER
version: 1.0
