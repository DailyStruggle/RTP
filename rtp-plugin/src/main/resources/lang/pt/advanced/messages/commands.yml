# neste servidor (ex.: compilação Lite ou nenhum provedor de mapas instalado).
mapBindingMissing: "&c[P0] a renderização de mapas não está disponível neste servidor."

# Enviado quando um gráfico é solicitado, mas nenhum renderizador está registrado para
# esse tipo de gráfico.
mapResolverMissing: "&c[P0] nenhum resolvedor de gráficos registrado para esta solicitação."

# Enviado quando um resolvedor é executado, mas a fonte de dados subjacente não está disponível
# para o alvo solicitado (região desconhecida, ainda sem dados, mundo descarregado).
# Espaço reservado: [region] - o nome da região solicitada (pode estar vazio).
mapUnavailable: "&e[P1] os dados do gráfico não estão disponíveis no momento."

# Enviado quando o serviço de mapas não pode alocar um mapa no momento (ex.: limite
# por visualizador atingido).
mapBusy: "&e[P1] o serviço de mapas está ocupado; tente novamente em breve."

# Rótulo para a linha clicável do menu \"/rtp info\" que renderiza um mapa térmico dos
