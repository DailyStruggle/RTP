# --- Mensagens do RTP (este idioma) ---
# Textos de mensagens para jogadores e operadores neste idioma, agrupados por tema.
# Copia gerada automaticamente das mensagens em ingles; nao editar a mao (sera sobrescrito).

# ###############################################################################
# Seção 2: Teletransporte
# ###############################################################################
jaTeletransportando: "&7[P0] ⚡ você já está se teletransportando!"

# se o plugin está sendo recarregado no momento
teletransporteNegadoRecarregando: "&7[P0] os teletransportes estão temporariamente desativados enquanto o plugin recarrega. Tente novamente em alguns instantes."
mensagemAtraso: "<gradient:#9D7CD8:#5FB3B3>[P0] ⚡ Teletransportando em [delay]. Nao se mova.</gradient>"
carregamentoChunk: "&7[P0] ⚙ Carregando chunks, por favor aguarde..."
mensagemTeletransporte: "<gradient:#5FB3B3:#9D7CD8>[P0] ⚡ Teletransportado em [attempts] tentativas, em [processingTime]</gradient>"

# if teleport is cancelled
cancelarTeletransporte: "&7[P0] ⚡ Teletransporte cancelado!"

# se não houver lugares seguros após atingir o máximo de tentativas
# espaço reservado: [attempts] - o número máximo de tentativas
inseguro: "&7[P0] ⌖ nenhuma localização segura encontrada em [attempts] tentativas"

# quando o jogador está em tempo de recarga
# espaço reservado: [remainingCooldown] - o tempo restante
mensagemEspera: "&7[P0] ⚡ Você não pode teletransportar-se novamente por [remainingCooldown]"

# when the player has reached the lockAfterUses cap and is locked out (BetterRTP LockAfter parity)
lockedAfterUses: "&7[P0] ⌖ Você atingiu seu limite de teletransporte aleatório. Tente novamente em [remainingLockTime]."

# se a região não tem locais na fila e o jogador não tem a permissão rtp.unqueued
semLocalizacoesNaFila: "#f5eb73[P0] ⌖ não há localizações prontas no momento"

# quando a fila de espera avança
# espaço reservado: [spot] - a posição atual na fila
atualizarFila: "#2636ef[P0] sua posição na fila: [spot]"

# se o jogador não tiver dinheiro suficiente para teletransportar na região
# espaço reservado: [money] - quanto dinheiro o comando exige
dinheiroInsuficiente: "&7[P0] você precisa de pelo menos $[money] para isso."

# ###############################################################################
# Seção 3: Formato de tempo
# ###############################################################################
dias: "d"
horas: "h"
minutos: "m"
segundos: "s"
milissegundos: "ms"

# o mundo não existe no bukkit
# espaço reservado: [world] - o nome do mundo
mundoInvalido: "&7[P0] não foi possível encontrar o mundo '[world]'"

# o plugin não tem o comando que o usuário solicitou
# espaço reservado: [arg] - o argumento tentado
argumentoInvalido: "&c[P0] argumento de comando inválido [arg]"

# quando o console tenta executar um comando apenas para jogadores
comandoConsoleNaoPermitido: "&c[P0] Você precisa ser um jogador no jogo para executar este comando."

# busy e invalidCommand não são traduzidos em messages.lang.yml -> usam-se as chaves em inglês (fallback ao baseline).
busy: "&c[P0] ocupado"

# Sent when the optional PvP combat check refuses /rtp because the player is in combat
pvpInCombat: "&c[P0] Você não pode se teleportar aleatoriamente durante o combate."

# plugin doesn't have the subcommand or parameter the user requested
# placeholder: [arg] - the argument attempted
invalidCommand: "&c[P0] comando inválido - [arg]"

# o usuário não tem permissão para o comando solicitado
semPermissoes: "&7Desculpe, mas você não tem permissão para executar este comando. Contate os administradores do servidor se acredita que isso é um erro."

# ###############################################################################
# Seção 8: Descrições de comandos
# ###############################################################################
rtp: "&b/rtp - teletransporte-se para uma localização aleatória"
rtp_descricao: "teletransporte-se para uma localização aleatória"
ajuda: "&b/rtp help - mostrar esta ajuda"
ajuda_descricao: "descrever comandos"
recarregar: "&b/rtp reload - recarregar os arquivos de configuração"
recarregar_descricao: "recarregar arquivos de configuração"
escaneamento: "&b/rtp scan - testar todas as localizações possíveis da região para melhorar os tempos de carregamento"
escaneamento_descricao: "apagar dados salvos e testar todas as localizações possíveis da região"
config_descricao: "atualizar arquivos de configuração em tempo de execução"
info_descricao: "verificar o estado atual do plugin"
teste_descricao: "testar funcionalidades do RTP"

# ###############################################################################
# Seção 9: Suporte ao PlaceholderAPI
# ###############################################################################
JOGADOR_DISPONIVEL: "&aDISPONIVEL"
JOGADOR_TEMPO_ESPERA: "&7EM ESPERA"
JOGADOR_CONFIGURAR: "&bESCOLHENDO LOCALIZACAO"
JOGADOR_CARREGANDO: "&bCARREGANDO CHUNKS"
JOGADOR_TELETRANSPORTANDO: "&bTELETRANSPORTANDO"

# ###############################################################################
# Seção 10: Elementos visuais
# ###############################################################################
titulo: "<rainbow>Teletransportado!</rainbow>"
subtitulo: "<gradient:#A78BFA:#E876A0>divirta-se!</gradient>"
aparecer: 20
permanecer: 20
desaparecer: 20

# actionbar setting
barraAcao: ""

# DO NOT TOUCH VERSION NUMBER
version: 1.0
