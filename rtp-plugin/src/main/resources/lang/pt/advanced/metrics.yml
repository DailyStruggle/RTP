# --- Configurações de métricas do RTP ---
# Botões somente de relatório para a SPI de métricas da Fase M2. Botões de
# limitação / ajuste fino continuam em performance.yml.
# Preenche MetricsSnapshot.foliaRegions() com detalhe por região no Folia.
# Sem efeito em Paper / Bukkit / Fabric (runtimes de única região sempre
# retornam lista vazia, que é a resposta correta para essas plataformas).
# @type: boolean
# @default: true
foliaIncludeRegions: true

# Estratégia de agregação usada para combinar amostras por região nos
# campos escalares tps{1,5,15}m de MetricsSnapshot no Folia.
# @type: enum
# @options: [mean, max]
# @default: mean
foliaAggregationTps: "mean"

# Estratégia de agregação usada para combinar amostras por região no
# campo escalar mspt de MetricsSnapshot no Folia.
# @type: enum
# @options: [mean, max]
# @default: max
foliaAggregationMspt: "max"

# Estratégia de agregação usada para combinar amostras por região no campo
# escalar tickBudgetUtilisation de MetricsSnapshot no Folia.
# @type: enum
# @options: [mean, max]
# @default: max
foliaAggregationTickBudget: "max"

# NÃO ALTERE O NÚMERO DA VERSÃO
version: 1.0
