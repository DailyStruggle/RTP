# RTP Network Mode (multi-server / multi-proxy) Disabled by default; flipping `network.enabled: true` opts this backend into the cross-server network.

network:
  # Se false, este arquivo e lido e validado, depois ignorado: nenhuma thread, tabela ou transporte e aberto.
  # @type: boolean
  # @default: false
  enabled: false

  # Identidade estavel do backend, obrigatoria quando ativado; dois backends com o mesmo serverId sobrescrevem o heartbeat um do outro.
  # @type: string
  # @default: ""
  serverId: ""

  # Variavel de ambiente que contem o segredo HMAC compartilhado; obrigatoria quando ativado com transport.type redis.
  # @type: string
  # @default: "RTP_NET_SECRET"
  secretEnv: "RTP_NET_SECRET"

# Backing store for cross-process state.
transport:
  # Armazenamento de apoio do transporte.
  # @type: enum
  # @options: ["auto", "plugin-message", "in-memory", "sql", "redis"]
  # @default: "auto"
  type: "auto"
  pluginMessage:
    # Canal de mensagens de plugins do proxy; mantenha o padrao a menos que seu proxy use um nome nao padrao.
    # @type: string
    # @default: "bungeecord:main"
    channel: "bungeecord:main"
  redis:
    # Nome de host ou IP da instancia Redis compartilhada por cada backend e proxy (obrigatorio quando type e redis).
    # @type: string
    # @default: "localhost"
    host: "localhost"

    # Porta do Redis; altere para implantacoes nao padrao.
    # @type: integer
    # @default: 6379
    port: 6379

    # Senha do Redis; deixe vazia para Redis sem autenticacao, defina quando ACL/requirepass estiver configurado.
    # @type: string
    # @default: ""
    password: ""

# Backend heartbeat / peer-staleness cadence (shared by every transport tier).
heartbeat:
  # Com que frequencia este backend publica sua linha de estado (ms).
  # @type: integer
  # @default: 1000
  intervalMs: 1000

  # Por quanto tempo o ultimo estado visto de um par permanece confiavel antes de ser tratado como desconhecido (ms); mantenha acima de intervalMs.
  # @type: integer
  # @default: 5000
  staleAfterMs: 5000

# Backend-side router.
routing:
  # Modo do roteador: local (apenas pipeline local), auto (local primeiro, senao fila de espera) ou always (sempre inscrever).
  # @type: enum
  # @options: ["local", "auto", "always"]
  # @default: "local"
  mode: "local"

  # Modo lobby: torna este backend um no de despacho puro que roteia automaticamente o /rtp simples para a regiao par com mais reservas.
  # @type: boolean
  # @default: false
  lobbyMode: false

# Cross-server wait queue.
queue:
  # Numero maximo de inscricoes armazenadas localmente antes que a contrapressao rejeite novas chamadas /rtp (QUEUE_FULL).
  # @type: integer
  # @default: 50
  maxDepth: 50

  # Cadencia de descarga das escritas pendentes do backend (ms); menor = menor latencia, maior = menos idas ao transporte.
  # @type: integer
  # @default: 250
  flushIntervalMs: 250

  # Cadencia de sondagem do cache de estado do backend (ms); com que frequencia o progresso por jogador e atualizado.
  # @type: integer
  # @default: 1000
  pollIntervalMs: 1000

  # Envelhecimento passivo opcional por TTL dos HASH de envelope (ms); 0 desativa.
  # @type: integer
  # @default: 0
  entryTtlMs: 0

  # Limite de taxa de inscricoes /rtp entre servidores (token bucket): requisicoes sustentadas por segundo.
  # @type: number
  # @default: 5
  crossServerRequestsPerSecond: 5

  # Limite de taxa de inscricoes /rtp entre servidores: tamanho do burst.
  # @type: number
  # @default: 10
  crossServerRequestsBurst: 10

  # Numero de workers BLPOP no lado do proxy; aumente apenas quando um unico worker satura.
  # @type: integer
  # @default: 1
  workerThreads: 1

# Reservation-token lifecycle.
reservation:
  # Cadencia do coletor por TTL no lado do proxy (ms); varre tokens expirados e libera suas coordenadas.
  # @type: integer
  # @default: 30000
  reapIntervalMs: 30000

  # TTL por token (ms); uma reserva reivindicada mas nao consumida mais antiga que isto e liberada como abandonada.
  # @type: integer
  # @default: 60000
  ttlMs: 60000

# Region-collision policy.
regionCollision:
  # Politica de colisao aplicada na inicializacao.
  # @type: enum
  # @options: ["warn", "rename-local", "reject-startup"]
  # @default: "warn"
  policy: "warn"

# Optional per-destination policy overlay (matched by serverId); leave commented for the common case.
# servers:
#  example-backend:
#    # Permission required to target this destination (empty = none).
#    # @type: string
#    # @default: "
#    permission: "
#    # Label shown in menus / suggestions (default: serverId).
#    # @type: string
#    # @default: "
#    display-name: "Example"
#    # Hide from tab-completion when it has no servable region.
#    # @type: boolean
#    # @default: false
#    hide-when-unavailable: false
#    # Allow targeting it even when it reports no servable region.
#    # @type: boolean
#    # @default: true
#    allow-when-unavailable: true
# Load balancer scoring table.
loadBalancer:
  # Peso do termo integrado de escassez de regioes; 0 porque o termo `region` explicito abaixo possui esse sinal.
  # @type: number
  # @default: 0
  regionScarcityWeight: 0

  # Scoring terms, one per metric.
  terms:
    # Tick pressure; sigmoid knee at 0.6.
    mspt:
      # Entrada da metrica.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "mspt"
      input: "mspt"

      # Peso do termo.
      # @type: number
      # @default: 1.0
      weight: 1.0
      curve:
        # Tipo de curva.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "sigmoid"
        type: "sigmoid"

        # Inclinacao.
        # @type: number
        # @range: [0.1, 20]
        # @default: 8.0
        k: 8.0

        # Ponto medio.
        # @type: number
        # @range: [0, 1]
        # @default: 0.6
        x0: 0.6

    # Queue depth; small queues silent, large ones explode.
    queue:
      # Entrada da metrica.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "queueDepth"
      input: "queueDepth"

      # Peso do termo.
      # @type: number
      # @default: 1.0
      weight: 1.0
      curve:
        # Tipo de curva.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "exponential"
        type: "exponential"

        # Inclinacao.
        # @type: number
        # @range: [0.1, 20]
        # @default: 3.0
        k: 3.0

    # Heap gate; fires at >= 85% used.
    heap:
      # Entrada da metrica.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "heapUsed"
      input: "heapUsed"

      # Peso do termo.
      # @type: number
      # @default: 5.0
      weight: 5.0
      curve:
        # Tipo de curva.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "step"
        type: "step"

        # Limiar do degrau.
        # @type: number
        # @range: [0, 1]
        # @default: 0.85
        threshold: 0.85

    # Region gate; fires when the kept pool is >= 95% full.
    region:
      # Entrada da metrica.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "keptRegion"
      input: "keptRegion"

      # Peso do termo.
      # @type: number
      # @default: 5.0
      weight: 5.0
      curve:
        # Tipo de curva.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "step"
        type: "step"

        # Limiar do degrau.
        # @type: number
        # @range: [0, 1]
        # @default: 0.95
        threshold: 0.95

    # Gentle tie-breaker on kept count.
    kept:
      # Entrada da metrica.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "keptCount"
      input: "keptCount"

      # Peso do termo.
      # @type: number
      # @default: 0.25
      weight: 0.25
      curve:
        # Tipo de curva.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "logarithmic"
        type: "logarithmic"

        # Inclinacao.
        # @type: number
        # @range: [0.1, 20]
        # @default: 9.0
        k: 9.0

version: 1.1
