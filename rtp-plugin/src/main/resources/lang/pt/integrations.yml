# --- Configurações de integração do RTP ---
# Cada opção sorteia o destino novamente se ele cair dentro de um claim/região do plugin indicado (ativa apenas se esse plugin estiver instalado).
# Sorteia a localização novamente se ela cair dentro de um claim do Factions.
# @type: boolean
# @default: false
rerollFactions: false

# Sorteia a localização novamente se ela cair dentro de um claim do GriefDefender.
# @type: boolean
# @default: false
rerollGriefDefender: false

# Sorteia a localização novamente se ela cair dentro de um claim do GriefPrevention.
# @type: boolean
# @default: false
rerollGriefPrevention: false

# Sorteia a localização novamente se ela cair dentro de um claim do HuskTowns.
# @type: boolean
# @default: false
rerollHuskTowns: false

# Sorteia a localização novamente se ela cair dentro de um claim do Lands.
# @type: boolean
# @default: false
rerollLands: false

# Sorteia a localização novamente se ela cair dentro de uma região do RedProtect.
# @type: boolean
# @default: false
rerollRedProtect: false

# Sorteia a localização novamente se ela cair dentro de um claim do Towny Advanced.
# @type: boolean
# @default: false
rerollTownyAdvanced: false

# Sorteia a localização novamente se ela cair dentro de uma região do WorldGuard.
# @type: boolean
# @default: false
rerollWorldGuard: false

# NÃO ALTERE O NÚMERO DA VERSÃO
version: 1.0
