# Temps d'attente (secondes) avant la téléportation
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 2
delaiTeleportation: 2

# Distance de mouvement maximale pendant le délai avant annulation
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 2
distanceAnnulation: 2

# Temps d'attente (secondes) entre les utilisations réussies
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 300
refroidissementTeleportation: 300

# Maximum number of successful /rtp uses a player may make within the
# lockAfterResetSeconds window before being locked out (BetterRTP LockAfter parity).
# 0 disables the cap. Bypassed by rtp.nolock.
# @type: integer
# @range: [0, null]
# @default: 0
lockAfterUses: 0

# Length of the rolling usage-cap window for lockAfterUses. The counter resets this
# many seconds after the window's first use. 0 means the cap never resets (a hard
# lifetime cap).
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 0
lockAfterResetSeconds: 0

# When true, a successful /rtp sets the landed location as the player's persistent
# spawn anchor (BetterRTP SetAsRespawn parity).
# @type: boolean
# @default: false
setRespawnOnTeleport: false

# Commandes exécutées après la téléportation
# @type: list<string>
commandesConsole:
  - "say [player] vient de se téléporter aléatoirement !"

# Commandes exécutées en tant que joueur téléporté lors d'une téléportation réussie.
# Utilisez [player] pour le nom du joueur. Les entrées vides sont ignorées.
# @type: list<string>
commandesJoueur:
  # Commandes exécutées en tant que joueur téléporté lors d'une téléportation réussie.
  # Utilisez [player] pour le nom du joueur. Les entrées vides sont ignorées.
  # @type: list<string>
  - ""

# Configuration de la base de données
baseDeDonnees:
  # Backend type.
  # @type: enum
  # @options: ["yaml", "sqlite", "mysql", "postgresql"]
  # @default: "sqlite"
  type: "sqlite"
  # Database host. Used by mysql/postgresql only.
  # @type: string
  host: "127.0.0.1"
  # Port de la base de données. Utilisé uniquement par mysql/postgresql.
  # @type: integer
  # @range: [1, 65535]
  port: 3306
  # Nom de la base de données / schéma. Utilisé uniquement par mysql/postgresql.
  # @type: string
  name: "rtp"
  # Nom d'utilisateur de la base de données. Utilisé uniquement par mysql/postgresql.
  # @type: string
  username: "root"
  # Mot de passe de la base de données. Utilisé uniquement par mysql/postgresql.
  # @type: string
  password: "password"

# Configuration du réseau et de la synchronisation
reseau:
  redis:
    # Enable Redis-backed network state binding.
    # @type: boolean
    # @default: false
    enabled: false
    # Redis host.
    # @type: string
    host: "127.0.0.1"
    # Redis port.
    # @type: integer
    # @range: [1, 65535]
    port: 6379
    # Redis password. Empty string disables auth.
    # @type: string
    password: ""

# Cadre de menu généralisé.
# `renderer` est une liste ordonnée de préférences d'identifiants de
# renderer. En cas d'exception ou d'adaptateur manquant, le framework
# parcourt la liste et bascule sur l'entrée suivante. Si la liste est
# épuisée, la voie d'ouverture sans jeton retombe sur le message
# configurable `menuInvalid`. Identifiants disponibles : book. (Le
# renderer chat arrivera dans une livraison ultérieure et sera ajouté à la
# liste par défaut à ce moment-là.)
menu:
  # Ordered preference list of renderer ids.
  # @type: list<enum>
  # @options: ["book", "chat"]
  renderer:
    # Cadre de menu généralisé.
    # `renderer` est une liste ordonnée de préférences d'identifiants de
    # renderer. En cas d'exception ou d'adaptateur manquant, le framework
    # parcourt la liste et bascule sur l'entrée suivante. Si la liste est
    # épuisée, la voie d'ouverture sans jeton retombe sur le message
    # configurable `menuInvalid`. Identifiants disponibles : book. (Le
    # renderer chat arrivera dans une livraison ultérieure et sera ajouté à la
    # liste par défaut à ce moment-là.)
    - "book"

# NE PAS MODIFIER LE NUMÉRO DE VERSION
version: 3.0
