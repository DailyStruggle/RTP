# Temps d'attente (secondes) avant la téléportation
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 2
delaiTeleportation: 2

# Distance de mouvement maximale pendant le délai avant annulation
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 2
distanceAnnulation: 2

# Temps d'attente (secondes) entre les utilisations réussies
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 300
refroidissementTeleportation: 300

# Nombre maximal d'utilisations réussies de /rtp qu'un joueur peut faire pendant la
# fenêtre lockAfterResetSeconds avant d'être verrouillé (parité avec LockAfter de BetterRTP).
# 0 désactive la limite. Contourné par rtp.nolock.
# @type: integer
# @range: [0, null]
# @default: 0
lockAfterUses: 0

# Durée de la fenêtre glissante de limite d'utilisation pour lockAfterUses. Le compteur se
# réinitialise ce nombre de secondes après la première utilisation de la fenêtre. 0 signifie
# que la limite ne se réinitialise jamais (une limite à vie).
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 0
lockAfterResetSeconds: 0

# Si true, un /rtp réussi définit le lieu d'atterrissage comme point de
# réapparition persistant du joueur (parité avec BetterRTP).
# @type: boolean
# @default: false
setRespawnOnTeleport: false

# Commandes exécutées après la téléportation
# @type: list<string>
commandesConsole:
  - "say [player] vient de se téléporter aléatoirement !"

# Commandes exécutées en tant que joueur téléporté lors d'une téléportation réussie.
# Utilisez [player] pour le nom du joueur. Les entrées vides sont ignorées.
# @type: list<string>
commandesJoueur:
  # Commandes exécutées en tant que joueur téléporté lors d'une téléportation réussie.
  # Utilisez [player] pour le nom du joueur. Les entrées vides sont ignorées.
  # @type: list<string>
  - ""

# Cadre de menu généralisé.
# `renderer` est une liste ordonnée de préférences d'identifiants de
# renderer. En cas d'exception ou d'adaptateur manquant, le framework
# parcourt la liste et bascule sur l'entrée suivante. Si la liste est
# épuisée, la voie d'ouverture sans jeton retombe sur le message
# configurable `menuInvalid`. Identifiants disponibles : book. (Le
# renderer chat arrivera dans une livraison ultérieure et sera ajouté à la
# liste par défaut à ce moment-là.)
menu:
  # Ordered preference list of renderer ids.
  # @type: list<enum>
  # @options: ["book", "chat"]
  renderer:
    # Cadre de menu généralisé.
    # `renderer` est une liste ordonnée de préférences d'identifiants de
    # renderer. En cas d'exception ou d'adaptateur manquant, le framework
    # parcourt la liste et bascule sur l'entrée suivante. Si la liste est
    # épuisée, la voie d'ouverture sans jeton retombe sur le message
    # configurable `menuInvalid`. Identifiants disponibles : book. (Le
    # renderer chat arrivera dans une livraison ultérieure et sera ajouté à la
    # liste par défaut à ce moment-là.)
    - "book"

# Valeurs par défaut globales héritées par les fichiers de région/monde via le jeton "@config".
defaults:
  # Forme et taille de la zone par défaut. radius/centerRadius = la distance d'atterrissage, mesurée en chunks.
  shape:
    # Landing area shape algorithm.
    # @type: enum
    # @source: shape
    name: "CIRCLE"
    mode: "ACCUMULATE"
    radius: 256
    centerRadius: 64
    centerX: 0
    centerZ: 0
    weight: 1.0
    # Keep spots from being reused. 0 = off, 1 = the landing chunk, N = bigger square.
    uniquePlacements: 0
    expand: false
  # Default high/low landing window.
  vert:
    # Vertical placement algorithm.
    # @type: enum
    # @source: vert
    name: "LINEAR"
    minY: 32
    maxY: 255
    # Search order: 0 = bottom-up, 1 = top-down, 2 = middle-out, 3 = edges-in, else random.
    direction: 2
    requireSkyLight: true
  # How many safe spots to pre-calculate.
  cacheCap: 50
  # Extra unverified spots kept ready. 0 = off.
  backlogCacheCap: 1000
  # Max chunks kept loaded for instant teleports.
  activeChunkCap: 10
  # Bad-spot tracking precision (1-5).
  spatialResolution: 3
  # Whether regions/worlds need permission.
  requirePermission: false

# NE PAS MODIFIER LE NUMÉRO DE VERSION
version: 3.1
