configPendingHeader: "&6&l-- pending changes --"

# Libellé par ligne pour une entrée clé=valeur préparée (en attente) sur une page de fichier de configuration.
# Cliquer sur la ligne la supprime du panier. Espaces réservés : [key], [value].
configPendingRowFormat: "&9[key]&8 = &0[value]"

# Texte d'infobulle affiché lorsque l'utilisateur survole une ligne en attente (préparée) sur
# une page de fichier de configuration. Aucun espace réservé.
configPendingRowHover: "cliquez pour retirer"

# Libellé cliquable pour la ligne « appliquer les modifications en attente » sur une page de fichier de configuration.
# Exécute la commande assemblée /rtp config <file> k1=v1 ... et vide le panier.
configApplyRow: "&2&l[apply]"

# Libellé cliquable pour la ligne « annuler les modifications en attente » sur une page de fichier de configuration.
# Vide le panier sans appliquer les modifications.
configDiscardRow: "&c&l[discard]"

# --- Rendu de cartes / graphiques ---
# Envoyé lorsqu'une ligne de carte est cliquée mais que le rendu de carte n'est pas disponible
# sur ce serveur (ex. variante d'assemblage Lite, ou aucun fournisseur de cartes installé).
mapBindingMissing: "&c[P0] le rendu de carte n'est pas disponible sur ce serveur."

# Envoyé lorsqu'un graphique est demandé mais qu'aucun résolveur n'est enregistré pour ce
# type de graphique.
mapResolverMissing: "&c[P0] aucun résolveur de graphique enregistré pour cette requête."

# Envoyé lorsqu'un résolveur s'exécute mais que la source de données sous-jacente est indisponible
# pour la cible demandée (région inconnue, pas encore de données, monde déchargé).
# Espace réservé : [region] - le nom de la région demandée (peut être vide).
mapUnavailable: "&e[P1] les données du graphique ne sont pas disponibles pour le moment."

# Envoyé lorsque le service de cartes ne peut pas allouer de carte pour le moment (ex. limite
# par joueur atteinte).
mapBusy: "&e[P1] le service de cartes est occupé ; veuillez réessayer sous peu."

# Libellé pour la ligne cliquable du menu « /rtp info » affichant une carte thermique des
# emplacements dangereux connus de la région actuelle. Masquée si le rendu de carte n'est
# pas disponible sur ce serveur.
menuInfoBadPointsLabel: "#9D7CD8&l# carte des points dangereux"

# --- Sous-menu MultiConfig ---
# Ligne d'en-tête de secours utilisée lorsqu'aucune clé d'en-tête par type n'est enregistrée.
# Espace réservé : [parserKind] - le nom brut du type de multi-config.
multiconfigHeaderDefault: "#5FB3B3&l[parserKind]"

# Libellé de ligne d'en-tête pour la page du sélecteur multi-config des régions. Aucun espace réservé.
multiconfigHeaderRegions: "#5FB3B3&l régions"

# Libellé de ligne d'en-tête pour la page du sélecteur multi-config des mondes. Aucun espace réservé.
multiconfigHeaderWorlds: "#5FB3B3&l mondes"

# Libellé de la ligne de basculement lorsque le mode suppression est DÉSACTIVÉ. Aucun espace réservé.
multiconfigToggleRemoveModeOff: "&8[ ] mode suppression"

# Libellé de la ligne de basculement lorsque le mode suppression est ACTIVÉ. Cliquer sur les lignes d'entrée les supprime.
multiconfigToggleRemoveModeOn: "&c[x] mode suppression (cliquez sur une entrée pour supprimer)"

# Libellé de la ligne de sélection pour l'entrée « + Ajouter nouveau... ». Aucun espace réservé.
multiconfigRowAdd: "&2+ ajouter..."

# Texte d'infobulle pour la ligne Ajouter. Espace réservé : [name] - nom par défaut prérempli.
multiconfigRowAddHover: "&7saisissez un nom dans l'invite de l'enclume ; prérempli : &f[name]"

# Texte d'infobulle pour une ligne d'entrée en mode normal. Espace réservé : [name].
multiconfigRowEditHover: "&7modifier &f[name]"

# Texte d'infobulle pour une ligne d'entrée en mode suppression. Espace réservé : [name].
multiconfigRowRemoveHover: "&csupprimer &f[name]"

# Ligne de titre de la page de confirmation de suppression. Espace réservé : [name].
multiconfigConfirmTitle: "&c&lsupprimer [name] ?"

# Libellé de la ligne Oui de la page de confirmation de suppression. Aucun espace réservé.
multiconfigConfirmYes: "&c&l[confirm delete]"

# Libellé de la ligne Annuler de la page de confirmation de suppression. Aucun espace réservé.
multiconfigConfirmNo: "&2&l[cancel]"

# Texte d'infobulle sur une ligne de région par défaut verrouillée (grisée). Aucun espace réservé.
multiconfigLockRegionDefault: "&7la région par défaut ne peut pas être supprimée"

# Texte d'infobulle sur une ligne de monde verrouillé (grisé). Espace réservé : [name].
multiconfigLockWorldLoaded: "&7le monde '[name]' est chargé sur le serveur ; déchargez-le avant de supprimer sa config"

# Message de résultat après un AJOUT réussi. Espace réservé : [name].
multiconfigResultAdded: "&a'[name]' ajouté."

# Message de résultat après une SUPPRESSION réussie. Espace réservé : [name].
multiconfigResultRemoved: "&a'[name]' supprimé."

# Message de résultat lorsqu'un AJOUT a échoué. Espaces réservés : [name], [reason].
multiconfigResultAddFailed: "&cimpossible d'ajouter '[name]' : [reason]"

# Message de résultat lorsqu'une SUPPRESSION a échoué. Espaces réservés : [name], [reason].
multiconfigResultRemoveFailed: "&cimpossible de supprimer '[name]' : [reason]"

# Message de résultat lorsque le nom d'entrée proposé est rejeté par le validateur.
# Espace réservé : [name].
multiconfigResultNameInvalid: "&cle nom '[name]' n'est pas autorisé ; utilisez des lettres, des chiffres, '_', '-', '.'"

# Message de résultat lorsqu'un AJOUT entre en conflit avec un nom d'entrée existant.
# Espace réservé : [name].
multiconfigResultNameTaken: "&cune entrée nommée '[name]' existe déjà."

# DO NOT TOUCH VERSION NUMBER
version: 1.0
