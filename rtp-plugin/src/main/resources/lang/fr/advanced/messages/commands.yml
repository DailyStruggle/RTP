# --- Messages RTP (cette langue) ---
# Textes des messages destines aux joueurs et aux operateurs dans cette langue, groupes par theme.
# Copie generee automatiquement des messages anglais; ne pas editer a la main (sera ecrase).

# ###############################################################################
# Section 6: Scan Command
# ###############################################################################
# messages relatifs à la commande scan
# espace réservé : [scan_regions] - liste des régions
scanStart: "&a[P0] tâche de scan démarrée pour les régions : [scan_regions]"
scanReset: "&7[P0] file de scan réinitialisée pour les régions : [scan_regions]"
scanCancel: "&7[P0] tâche de scan annulée pour les régions : [scan_regions]"
scanPause: "#A020F0[P0] tâche de scan mise en pause pour les régions : [scan_regions]"
scanResume: "#10A5F5[P0] tâche de scan reprise pour les régions : [scan_regions]"
scanRunning: "&c[P0] tâche de scan déjà en cours pour les régions : [scan_regions]"
scanNotRunning: "&c[P0] tâche de scan non en cours pour les régions : [scan_regions]"

# espaces réservés : [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
scanStatus: "[P0] &8» &7[scan_regions] &8| &7[scan_chunks]&8/&7[scan_totalChunks] &8| #7E9CC8[scan_cps]&7 cps &8| #7E9CC8[scan_landPercentage]%&7 terres &8| &7ETA #7E9CC8[scan_eta]"

# Titre de la boss-bar affiché aux joueurs ayant la permission rtp.scan pendant qu'un scan de monde est en cours.
# Définir sur une chaîne vide pour désactiver la boss-bar.
# espaces réservés : [scan_regions], [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
scanBossBar: "Analyse de [scan_regions]: [scan_chunks]/[scan_totalChunks] ([scan_landPercentage]% terre) ETA [scan_eta]"

