# --- Messages RTP (cette langue) ---
# Textes des messages destines aux joueurs et aux operateurs dans cette langue, groupes par theme.
# Copie generee automatiquement des messages anglais; ne pas editer a la main (sera ecrase).

# --- Messages RTP visibles par l'utilisateur ---
# Toutes les chaînes visibles par les joueurs et la console.
# Formatage :
# - Codes de couleur Bukkit hérités (ex. &a, &7, &c)
# - Codes de couleur hexadécimaux (ex. #2636ef)
# - Espaces réservés PlaceholderAPI (lorsque PAPI est installé)
# Espaces réservés :
# - Les espaces réservés partagés "[Pn]" sont définis dans la liste `placeholders` ci-dessous.
# [P0] est le préfixe RTP par défaut.
# - Les espaces réservés propres à chaque message (ex. [attempts], [world]) sont documentés
# en commentaire au-dessus de chaque message qui les utilise.
# ###############################################################################
# Section 1 : Configuration générale
# ###############################################################################
# liste d'espaces réservés supplémentaires
# format : Pn - où n est l'index dans cette liste
placeholders:
  # P0
  - "[RTP]"

# DO NOT TOUCH VERSION NUMBER
version: 1.0
