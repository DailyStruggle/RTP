# --- Messages RTP (cette langue) ---
# Textes des messages destines aux joueurs et aux operateurs dans cette langue, groupes par theme.
# Copie generee automatiquement des messages anglais; ne pas editer a la main (sera ecrase).

# --- Messages du mode réseau inter-serveurs ---
# Envoyés uniquement lorsque `network.enabled: true` et que le `/rtp` du joueur est routé
# à travers la file d'attente inter-serveurs (voir network.yml `routing.mode`).
# Toutes les clés sont facultatives du point de vue du joueur - le cycle de base
# `delayMessage` / `teleportMessage` pilote toujours le flux visible.
# Envoyé lorsque la demande a été acceptée dans la file d'attente inter-serveurs
# et attend une prise en charge par un serveur backend. Espace réservé : [position] - position
# avec index 0 depuis `pollStatus` ; peut être vide si le transport ne renvoie aucune
# position.
networkQueued: "&7[P0] en file pour une destination inter-serveurs (position [position])..."

# Envoyé lorsqu'un joueur exécute /rtp alors qu'il attend déjà dans la file inter-serveurs.
# Espace réservé : [position] - position dans la file ; peut être vide.
alreadyQueued: "&cVous attendez déjà dans la file inter-serveurs (position [position]). Veuillez patienter."

# Envoyé lorsqu'une entrée de la file inter-serveurs a attendu trop longtemps et a été abandonnée.
# Aucun espace réservé.
networkTimedOut: "&c[P0] la téléportation inter-serveurs a expiré en attendant un serveur."

# Envoyé lorsque la file inter-serveurs est pleine et que la demande est rejetée.
# Aucun espace réservé.
waitlistFull: "&c[P0] la file inter-serveurs est pleine ; réessayez bientôt."

# Envoyé lorsque la file a transmis la demande au routeur proxy et
# qu'une sélection de backend est en cours.
networkRouting: "&7[P0] routage vers un serveur..."

# Envoyé lorsqu'un backend a réservé une coordonnée pour ce joueur et que le
# proxy est sur le point d'initier le saut inter-serveurs. Espace réservé : [server]
# - le serverId du backend de destination.
networkReserved: "&a[P0] coordonnée réservée sur [server]. Transfert..."

# Envoyé lorsque le proxy est en cours de transfert. Espace réservé : [server] - destination.
networkTransferring: "&a[P0] transfert vers [server]..."

# Envoyé lorsque le chemin inter-serveurs a échoué et bascule sur le serveur local.
# Espace réservé : [reason] - la raison du repli.
networkFallback: "&e[P0] inter-serveurs indisponible ([reason]) ; retour au serveur local."

# Envoyé lorsque la demande inter-serveurs a échoué et qu'aucun repli n'était possible.
# Espace réservé : [reason] - la raison de l'échec.
networkFailed: "&c[P0] la téléportation inter-serveurs a échoué : [reason]."

# Envoyé lorsque le joueur demande une région spécifique (`/rtp <region>`) mais
# qu'aucun backend du réseau ne la dessert actuellement. Espace réservé :
# [region] - le nom de la région demandée.
networkRegionUnavailable: "&c[P0] aucun serveur ne dessert actuellement la région '[region]'."

# Envoyé lorsque le nom de région demandé correspond à au moins deux backends et
# que la politique configurée par l'opérateur ne peut pas en choisir un (ne se déclenche
# qu'avec des politiques plus strictes que l'avertissement par défaut `warn`). Espace réservé : [region].
networkRegionAmbiguous: "&c[P0] la région '[region]' est ambiguë entre serveurs ; veuillez fixer un serveur."

# DO NOT TOUCH VERSION NUMBER
version: 1.0
