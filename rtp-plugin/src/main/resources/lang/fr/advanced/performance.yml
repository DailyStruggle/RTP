# Min TPS to continue background queueing
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
tpsMin: 19.0

# Utilisation max du heap JVM (% du max) avant la pause du remplissage du cache
# en arrière-plan. Les emplacements déjà en cache restent servis. 0 ou 100 désactive.
# @type: number
# @range: [0.0, 100.0]
# @default: 85.0
maxHeapPourcentage: 85.0

# --- RTP Performance Settings ---
# Documentation: plugins/RTP/docs/admin/configuration/PERFORMANCE.md
# Max search attempts before giving up
# @type: integer
# @range: [1, null]
# @default: 32
tentativesMax: 32

# Ticks between background cache cycles
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
periode: 20

# Max ms per tick for sync tasks
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
tempsAlloueSync: 50

# Max ms per tick for async tasks
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
tempsAlloueAsync: 50

# Chunk radius to load during selection
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
distanceVueSelection: 0

# Chunk radius to load before teleport
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
distanceVueTeleport: 0

# Ticks pendant lesquels la distance de vue d'un joueur téléporté revient à la
# normale après l'arrivée, lissant le pic de chargement de chunks. 0 désactive le bridage.
# @type: integer
# @range: [0, null]
# @unit: ticks
# @default: 200
intervalleRestaurationVue: 200

# Refill cache immediately after teleport
# @type: boolean
# @default: false
miseEnFilePostTeleport: false

# Enregistre les biomes des chunks déjà chargés dans la mémoire spatiale, alimentant
# le rappel / la pondération des biomes. Aucune E/S de chunk supplémentaire.
# @type: boolean
# @default: true
verifierAuChargementChunk: true

# Fraction de la capacité du backlog L3 à laquelle le remplissage reprend (hystérésis).
# 0.5 = remplir après être tombé à 50% ; 1.0 = remplir en continu.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.5
seuilRemplissageBacklog: 0.5

# Probabilité de rejeter un chunk non généré par tentative.
# 0.0 = aucun biais, 1.0 = éviter les terrains non générés. Les chunks générés passent toujours.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.0
preferencePregenere: 0.0

# Réserve un cache d'emplacements pour les téléportations à la connexion
# (rtp.onevent.firstjoin / rtp.onevent.join).
# @type: boolean
# @default: false
cacheConnexionActive: false

# Plafond strict du cache de connexion. 0 = automatique (max-players du serveur au démarrage).
# @type: integer
# @range: [0, null]
# @default: 0
limiteCacheConnexion: 0

# Reuse found biome locations
# @type: boolean
# @default: true
rappelBiome: true

# Ne sert les demandes filtrées par biome que depuis le cache (ne génère jamais de
# nouvelles recherches de biome). Nécessite biomeRecall.
# @type: boolean
# @default: false
rappelBiomeForce: false

# Oriente chaque biome demandé avec une probabilité égale plutôt qu'en fonction de
# la part de région couverte. Nécessite biomeRecall ; sans effet sur les téléportations non filtrées.
# @type: boolean
# @default: false
biomePondere: false

# Poids relatifs par biome pour les téléportations filtrées par biome. Utilisés
# uniquement quand biomeWeighted est true. Les biomes non listés utilisent 1.0 (aucun
# biais) ; 2.0 = choisi ~deux fois plus souvent, 0.0 = supprimé. L'ensemble vanilla
# complet est prélisté à 1.0 comme référence éditable ; ajoutez les biomes moddés par
# leur id de plateforme (ex. terralith:emerald_peaks). Nécessite biomeRecall.
# @type: map<string, number>
poidsBiome:
  # Poids de sélection relatif pour ce biome (1.0 = aucun biais).
  # @type: number
  # @range: [0.0, null]
  # @default: 1.0
  plains: 1.0
  sunflower_plains: 1.0
  snowy_plains: 1.0
  ice_spikes: 1.0
  desert: 1.0
  swamp: 1.0
  mangrove_swamp: 1.0
  forest: 1.0
  flower_forest: 1.0
  birch_forest: 1.0
  dark_forest: 1.0
  old_growth_birch_forest: 1.0
  old_growth_pine_taiga: 1.0
  old_growth_spruce_taiga: 1.0
  taiga: 1.0
  snowy_taiga: 1.0
  savanna: 1.0
  savanna_plateau: 1.0
  windswept_hills: 1.0
  windswept_gravelly_hills: 1.0
  windswept_forest: 1.0
  windswept_savanna: 1.0
  jungle: 1.0
  sparse_jungle: 1.0
  bamboo_jungle: 1.0
  badlands: 1.0
  eroded_badlands: 1.0
  wooded_badlands: 1.0
  meadow: 1.0
  cherry_grove: 1.0
  pale_garden: 1.0
  grove: 1.0
  snowy_slopes: 1.0
  frozen_peaks: 1.0
  jagged_peaks: 1.0
  stony_peaks: 1.0
  river: 1.0
  frozen_river: 1.0
  beach: 1.0
  snowy_beach: 1.0
  stony_shore: 1.0
  warm_ocean: 1.0
  lukewarm_ocean: 1.0
  deep_lukewarm_ocean: 1.0
  ocean: 1.0
  deep_ocean: 1.0
  cold_ocean: 1.0
  deep_cold_ocean: 1.0
  frozen_ocean: 1.0
  deep_frozen_ocean: 1.0
  mushroom_fields: 1.0
  dripstone_caves: 1.0
  lush_caves: 1.0
  deep_dark: 1.0
  # --- Le Nether ---
  nether_wastes: 1.0
  warped_forest: 1.0
  crimson_forest: 1.0
  soul_sand_valley: 1.0
  basalt_deltas: 1.0
  # --- L'End ---
  the_end: 1.0
  end_highlands: 1.0
  end_midlands: 1.0
  small_end_islands: 1.0
  end_barrens: 1.0
  # --- Divers / technique ---
  the_void: 1.0

# Seuil de latence (ms) au-delà duquel une téléportation servie immédiatement est
# auditée (WARN journalisé, slowPipelineCount incrémenté). 0 ou moins désactive.
# @type: integer
# @range: [0, null]
# @unit: ms
# @default: 5000
seuilPipelineLenteMs: 5000

# Profondeur de file (joueurs en attente) à partir de laquelle la contre-pression
# est auditée (WARN journalisé, queueGrowthWarnCount incrémenté). 0 ou moins désactive.
# @type: integer
# @range: [0, null]
# @unit: players
# @default: 0
seuilAlerteCroissanceFile: 0

# Use sync chunk loading (NOT RECOMMENDED)
# @type: boolean
# @default: false
chargementSync: false

# Parse permissions on every event
# @type: boolean
# @default: false
analyseSurEvenement: false

# Parse effect permissions on startup
# @type: boolean
# @default: true
analyseEffets: true

# Enable background data gathering
# @type: boolean
# @default: false
visiteurActive: true

# Paramètres de /rtp admin prefab. Le flux apply -> confirm écrit une sauvegarde
# par fichier modifié ; bakRetention limite le nombre conservé (les plus anciennes élaguées).
prefabrique:
  # Number of timestamped config backups kept per file before pruning.
  # @type: integer
  # @range: [1, null]
  # @default: 3
  bakRetention: 3
# NE PAS MODIFIER LE NUMÉRO DE VERSION
version: 1.0
