# --- Paramètres d'intégration de RTP ---
# Chaque option relance le tirage de la destination si elle tombe dans un claim/une région du plugin indiqué (actif uniquement si ce plugin est installé).
# Relance le tirage si la position tombe dans un claim Factions.
# @type: boolean
# @default: false
rerollFactions: false

# Relance le tirage si la position tombe dans un claim GriefDefender.
# @type: boolean
# @default: false
rerollGriefDefender: false

# Relance le tirage si la position tombe dans un claim GriefPrevention.
# @type: boolean
# @default: false
rerollGriefPrevention: false

# Relance le tirage si la position tombe dans un claim HuskTowns.
# @type: boolean
# @default: false
rerollHuskTowns: false

# Relance le tirage si la position tombe dans un claim Lands.
# @type: boolean
# @default: false
rerollLands: false

# Relance le tirage si la position tombe dans une région RedProtect.
# @type: boolean
# @default: false
rerollRedProtect: false

# Relance le tirage si la position tombe dans un claim Towny Advanced.
# @type: boolean
# @default: false
rerollTownyAdvanced: false

# Relance le tirage si la position tombe dans une région WorldGuard.
# @type: boolean
# @default: false
rerollWorldGuard: false

# NE PAS MODIFIER LE NUMÉRO DE VERSION
version: 1.0
