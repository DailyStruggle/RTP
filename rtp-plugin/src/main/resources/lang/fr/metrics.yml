# --- Paramètres des métriques RTP ---
# Réglages purement de reporting pour la SPI de métriques de la Phase M2. Les
# réglages de régulation / réglage restent dans performance.yml.
# Documentation : docs/dev/METRICS_PLAN.md > Folia Aggregation
# Remplit MetricsSnapshot.foliaRegions() avec le détail par région sur Folia.
# Sans effet sur Paper / Bukkit / Fabric (les runtimes mono-région renvoient
# toujours une liste vide, ce qui est la bonne réponse pour ces plateformes).
# @type: boolean
# @default: true
foliaIncludeRegions: true

# Stratégie d'agrégation pour fusionner les échantillons par région dans
# les champs scalaires tps{1,5,15}m de MetricsSnapshot sur Folia.
# Valeurs acceptées : mean | max
# @type: enum
# @default: mean
foliaAggregationTps: "mean"

# Stratégie d'agrégation pour fusionner les échantillons par région dans
# le champ scalaire mspt de MetricsSnapshot sur Folia.
# Valeurs acceptées : mean | max
# @type: enum
# @default: max
foliaAggregationMspt: "max"

# Stratégie d'agrégation pour fusionner les échantillons par région dans
# le champ scalaire tickBudgetUtilisation de MetricsSnapshot sur Folia.
# Valeurs acceptées : mean | max
# @type: enum
# @default: max
foliaAggregationTickBudget: "max"

# DO NOT TOUCH VERSION NUMBER
version: 1.0
