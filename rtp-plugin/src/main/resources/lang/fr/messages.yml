# --- RTP User-Facing Messages ---
# All player- and console-visible strings.
# Formatting:
# - Bukkit legacy color codes (e.g. &a, &e, &c)
# - Hex color codes (e.g. #2636ef)
# - PlaceholderAPI placeholders (when PAPI is installed)
# Placeholders:
# - Shared "[Pn]" placeholders are defined in the `placeholders` list below.
# [P0] is the RTP prefix by default.
# - Per-message placeholders (e.g. [attempts], [world]) are documented inline
# above each message that uses them.
# ###############################################################################
# Section 1: General Configuration
# ###############################################################################
# list of additional placeholders
# format: Pn - where n is the index in this list
placeholders:
  # P0
  - "[RTP]"

# ###############################################################################
# Section 2: Teleportation
# ###############################################################################
# when teleporting, say this
alreadyTeleporting: "&e[P0] you're already teleporting!"

# si le plugin est en cours de rechargement
teleportDeniedReloading: "&e[P0] teleports are temporarily disabled while the plugin reloads. Please try again shortly."
delayMessage: "&e[P0] Teleporting in [delay]. Don't move"
chunkLoading: "&e[P0] Loading chunks! please wait..."
teleportMessage: "&e[P0] Teleported in [attempts] attempts, in [processingTime]"

# if teleport is cancelled
teleportCancel: "&e[P0] Teleport cancelled!"

# s'il n'y a pas d'endroits sûrs après le nombre maximum de tentatives
# espace réservé : [attempts] - le nombre maximum de tentatives
unsafe: "&e[P0] could not find a safe location within [attempts] attempts"

# lorsque le joueur est en temps de recharge
# espace réservé : [remainingCooldown] - le temps restant
cooldownMessage: "&e[P0] You can't teleport again for [remainingCooldown]"

# si la région n'a aucun emplacement en file et que le joueur n'a pas la permission rtp.unqueued
noLocationsQueued: "#f5eb73[P0] no locations ready at this time"

# lorsque la file d'attente avance
# espace réservé : [spot] - la position actuelle dans la file
queueUpdate: "#2636ef[P0] your spot in line: [spot]"

# si le joueur n'a pas assez d'argent pour se téléporter dans la région
# espace réservé : [money] - combien d'argent la commande requiert
notEnoughMoney: "&e[P0] you need at least $[money] for that."

# ###############################################################################
# Section 3: Time Formatting
# ###############################################################################
# for time placeholders, what to call days, hours, minutes, seconds, and milliseconds
days: "d"
hours: "h"
minutes: "min"
seconds: "s"
millis: "ms"

# ###############################################################################
# Section 4: System & Management
# ###############################################################################
# a configuration file 'version' is lower than the latest
# placeholder: [filename] - name of file, including file extension
oldFile: "&b[P0] old [filename] detected. Updating"

# monde bukkit détecté qui n'est pas dans le fichier de configuration
# espace réservé : [world] - le monde détecté
newWorld: "&b[P0] detected a new world '[world]'"

# le monde n'existe pas dans bukkit
# espace réservé : [world] - le nom du monde
invalidWorld: "&e[P0] could not find world '[world]'"

# texte de rechargement / mise à jour du plugin
# espace réservé : [filename] - nom du fichier
reloading: "&b[P0] loading [filename]..."
reloaded: "&b[P0] successfully loaded [filename]."
updating: "&a[P0] updating [filename]..."
updated: "&a[P0] successfully updated [filename]."

# le plugin n'a pas la commande demandée par l'utilisateur
# espace réservé : [arg] - l'argument tenté
badArg: "&c[P0] invalid command argument [arg]"

# lorsque la console tente d'exécuter une commande réservée aux joueurs
consoleCmdNotAllowed: "&c[P0] You must be an in-game player to execute this command."

# plugin is busy reloading
busy: "&c[P0] occupé"

# plugin doesn't have the subcommand or parameter the user requested
# placeholder: [arg] - the argument attempted
invalidCommand: "&c[P0] commande invalide - [arg]"

# l'utilisateur n'a pas la permission pour la commande demandée
noPerms: "&eI'm sorry, but you do not have permission to perform this command. Please contact the server administrators if you believe that this is in error."

# ###############################################################################
# Section 5: Administrative Logs
# ###############################################################################
# logged when locations are saved/loaded from database
# placeholder: [amount] - number of locations
# placeholder: [region] - name of region
locationSaved: "&e[P0] Successfully saved [amount] locations for [region]"
locationLoaded: "&e[P0] Successfully loaded [amount] locations for [region]"

# ###############################################################################
# Section 6: Scan Command
# ###############################################################################
# messages related to the scan command
# placeholder: [scan_regions] - list of regions
scanStart: "&a[P0] scan task started for regions: [scan_regions]"
scanReset: "&e[P0] scan queue reset for regions: [scan_regions]"
scanCancel: "&e[P0] scan task cancelled for regions: [scan_regions]"
scanPause: "#A020F0[P0] scan task paused for regions: [scan_regions]"
scanResume: "#10A5F5[P0] scan task resumed for regions: [scan_regions]"
scanRunning: "&c[P0] scan task already running for regions: [scan_regions]"
scanNotRunning: "&c[P0] scan task not running for regions: [scan_regions]"
# placeholder: [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
scanStatus: "&a[P0] completed [scan_chunks] / [scan_totalChunks] chunks for regions: [scan_regions]. [scan_cps] cps. Land Percentage: [scan_landPercentage]%. ETA: [scan_eta]"

# ###############################################################################
# Section 7: Info Command
# ###############################################################################
# messages related to the info command
infoTitle: "&a======RTP Info======"
infoTickets: "&7Tickets de chunks actifs globaux : &f[tickets]"
infoTeleports: "&7Active Teleport State Machines: &f[teleports]"
infoMSPT: "&7MSPT actuel du plugin : &f[mspt]"
infoTotalLoads: "&7Lifetime Chunks Loaded: &f[loads]"
infoLoadsByOrigin: "&7Loads by Origin: &f[loadsByOrigin]"
infoLeakRate: "&7Current Chunk Leak Rate: &f[leakRate]"
# --- Metrics SPI health block (METRICS_PLAN.md > /rtp info Surface) ---
infoQueueDepth: "&7Players Waiting In Region Queues: &f[queueDepth]"
infoPendingTeleports: "&7Pending Teleport Pipelines: &f[pendingTeleports]"
infoAvgPipelineMs: "&7Avg Pipeline Latency: &f[avgPipelineMs] ms"
infoHeap: "&7JVM Heap: &f[heapUsedMb] / [heapMaxMb] MiB"
# Ligne d'en-tête du bloc Health pipeline dans /rtp info.
infoHealthPipelineHeader: "&7--- Health: pipeline ---"
# Affichage TPS pour les fenêtres 1m / 5m / 15m. Espaces réservés : [tps1m] [tps5m] [tps15m].
infoTps: "&7TPS (1m/5m/15m): &f[tps1m] / [tps5m] / [tps15m]"
# MSPT du serveur en direct et utilisation du budget tick. Espaces réservés : [mspt] [tickBudgetUtilisation].
infoMSPTLive: "&7Server MSPT: &f[mspt] ms (&7tick budget: &f[tickBudgetUtilisation]&7)"
# Configured player soft-cap vs current online count. Placeholders: [softCap] [playerCount].
infoSoftCap: "&7Players: &f[playerCount] / [softCap]"
# Dernière latence aller-retour de la base de données en ms. Espace réservé : [databaseLatencyMs].
infoDatabaseLatencyMs: "&7Database Latency: &f[databaseLatencyMs] ms"
# Health colour-band thresholds. Doubles consumed by ColourBands in rtp-core
# to wrap coloured-variant placeholders (e.g. [tps1mColoured]) with &a/&e/&c.
infoThresholdTpsGreen: 19.5
infoThresholdTpsYellow: 18.0
infoThresholdMsptGreen: 30.0
infoThresholdMsptYellow: 45.0
infoThresholdCacheFillGreen: 0.5
infoThresholdCacheFillYellow: 0.25
infoThresholdNetworkAgeYellow: 5.0
# Header line introducing the per-Folia-region table (Folia runtime only).
infoFoliaRegionsHeader: "&7--- Folia regions ---"
# Per-row template for a single Folia region. Placeholders: [regionId] [tps1m]
# [mspt] [playerCount] [queueDepth] [tickBudgetUtilisation].
infoFoliaRegion: "  &f[regionId]&7: tps=&f[tps1m]&7 mspt=&f[mspt]&7 players=&f[playerCount]&7 queue=&f[queueDepth]&7 budget=&f[tickBudgetUtilisation]"
infoDisclaimerHeader: "&7--- Diagnostic Disclaimer ---"
infoDisclaimer: "&7Diagnostic Note: If the server's total orphaned chunk count exceeds this plugin's lifetime loads ([loads]), this plugin is not the sole source of the memory leak."
infoWorldHeader: "#008080Worlds:"
infoConsoleWorldHeader: "&7--- Worlds ---"
infoWorld: "  #21ADA8[world]"
infoRegionHeader: "#63C5DARegions:"
infoConsoleRegionHeader: "&7--- Regions ---"
infoRegion: "  #52B2BF[region]"

# sub-info listings
# placeholders: [world], [region], [requirePermission], [override], [shape], [worldBorderOverride], [cacheCap], [cached], [keptCache], [unkeptCache], [backlogCache], [backlogCacheCap]
worldInfo:
  - "#21ADA8[world]:"
  - "#99EEBB  - region: [region]"
  - "#99EEBB  - requirePermission: [requirePermission]"
  - "#99EEBB  - override: [override]"

regionInfo:
  - "#52B2BF[region] :"
  - "#58CCED  - monde : [world]"
  - "#58CCED  - forme : [shape]"
  - "#58CCED  - permissionRequise : [requirePermission]"
  - "#58CCED  - substitutionBordureMonde : [worldBorderOverride]"
  - "#58CCED  - capaciteCache : [cacheCap]"
  - "#58CCED  - cacheConserve (L1) : [keptCache]"
  - "#58CCED  - cacheLibere (L2) : [unkeptCache]"
  - "#58CCED  - cacheArriere (L3) : [backlogCache] / [backlogCacheCap]"
  - "#58CCED  - enCache : [cached]"

# ###############################################################################
# Section 8 : Descriptions des commandes
# ###############################################################################
rtp: "&b/rtp - se téléporter à un endroit aléatoire"
rtp_description: "se téléporter à un endroit aléatoire"
help: "&b/rtp help - see this"
help_description: "describe commands"
reload: "&b/rtp reload - reload config files"
reload_description: "reload config files"
scan: "&b/rtp scan - tester tous les placements possibles de région pour améliorer les temps de chargement"
scan_description: "effacer les données sauvegardées et tester tous les placements possibles de région"
config_description: "mettre à jour les fichiers de configuration au moment de l'exécution"
info_description: "vérifier l'état actuel du plugin"
test_description: "tester les fonctions RTP"

# ###############################################################################
# Section 8b: Generalized Menu Framework
# ###############################################################################
# Sent when a menu token is unknown, malformed, or belongs to another player.
menuInvalid: "&c[P0] that menu link is invalid."
# Sent when a menu token has expired or was already consumed.
menuExpired: "&c[P0] that menu link has expired. Please reopen the menu."
# Envoyé lorsqu'un échange de menu ne peut pas résoudre l'UUID du joueur appelant.
menuUnknownPlayer: "&c[P0] menu links can only be used by in-game players."
# Hover-fallback template used by the menu reflector when no YAML block-comment
# is available for a parameter. Placeholder: [type] - the declared parameter type.
menuHoverFallbackType: "type: [type]"
# Hover-fallback template used by the menu reflector when a parameter exposes a
# small curated value set. Placeholder: [values] - comma-joined accepted values.
menuHoverFallbackBounds: "accepted: [values]"
# Label for the "go back one level" navigation row prepended to every non-root menu page.
menuBack: "&7« back"
# Label template for the "execute the assembled command" row prepended to every
# runnable non-root menu page. Placeholder: [command] - the assembled /rtp ... invocation.
menuExecute: "&a▶ run [command]"
# Header row at the top of a parameter-value picker sub-page (Stage A.2).
# Placeholders: [param] - parameter name; [command] - assembled /rtp ... invocation.
menuPickValue: "&epick a value for [param] (will run: /rtp [command] [param]:<value>)"
# Label for the "type a custom value" fallback row on a parameter-value picker page.
# Clicking it prefills chat with the assembled command up to '<param>:' so the player
# can type any value, including ones not in the suggestion list.
menuTypeValue: "&7✎ type a custom value..."
# Non-clickable header row at the top of every non-root menu page (Stage A.4).
# Surfaces the currently-constructed /rtp invocation including any staged
# parameter assignments (name:value). Placeholder: [command] - assembled args.
menuConstructed: "&7building: &f/rtp [command]"
# Non-clickable title row prepended to the root /rtp menu page (Stage A.5).
# Provides a welcoming header before the player descends into any subcommand.
menuRootTitle: "&6&l⚡ RTP menu"
# Non-clickable subtitle/hint row prepended to the root /rtp menu page below
# menuRootTitle (Stage A.5). Short orientation text for first-time users.
menuRootHint: "&7click an option below to begin"
# Navigation rows appended to paginated menu pages (Stage A.6) — clicking
# them moves to the previous/next page of the same model. Placeholder:
# [page] - the 1-based human-readable target page number.
menuPagePrev: "&7« previous page ([page])"
menuPageNext: "&7next page ([page]) »"
# Section divider on the front page above teleport rows (player view).
menuFrontPageSectionTeleport: "&8--- &7teleport &8---"
# Section divider on the front page above admin rows (admin view).
menuFrontPageSectionAdmin: "&8--- &7admin &8---"
# Front-page rows. No placeholders.
menuFrontPageRowTeleport: "&a▶ /rtp &7- teleport to a random location"
menuFrontPageRowRegion: "&a▶ /rtp region:&7... &7- pick a region"
menuFrontPageRowBiome: "&a▶ /rtp biome:&7... &7- pick a biome"
menuFrontPageRowHelp: "&a▶ /rtp help &7- list commands"
menuFrontPageRowInfo: "&b▶ /rtp info &7- plugin diagnostics"
menuFrontPageRowConfig: "&b▶ /rtp config &7- edit config files"
menuFrontPageRowScan: "&b▶ /rtp scan &7- pre-fill region caches"
menuFrontPageRowDiagnostics: "&c▶ /rtp test full &7- run full diagnostics"
menuFrontPageRowReload: "&c▶ /rtp reload &7- reload config files"
# Texte au survol de la ligne de diagnostics avertissant du coût. Aucun espace réservé.
menuFrontPageHoverDiagnostics: "&7runs full diagnostic suite; may be expensive"
# Texte au survol de la ligne de rechargement avertissant des effets secondaires. Aucun espace réservé.
menuFrontPageHoverReload: "&7reloads all config files; in-flight teleports may be affected"

