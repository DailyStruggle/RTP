# --- RTP User-Facing Messages ---
# All player- and console-visible strings.
# Formatting:
# - Bukkit legacy color codes (e.g. &a, &7, &c)
# - Hex color codes (e.g. #2636ef)
# - PlaceholderAPI placeholders (when PAPI is installed)
# Placeholders:
# - Shared "[Pn]" placeholders are defined in the `placeholders` list below.
# [P0] is the RTP prefix by default.
# - Per-message placeholders (e.g. [attempts], [world]) are documented inline
# above each message that uses them.
# ###############################################################################
# Section 0: Espaces réservés
# ###############################################################################
# list of additional placeholders
# format: Pn - where n is the index in this list"
placeholders:
  # P0
  - "[RTP]"

# ###############################################################################
# Section 1: Teleportation
# ###############################################################################
# when teleporting, say this
alreadyTeleporting: "&7[P0] ⚡ vous êtes déjà en téléportation !"

# si le plugin est en cours de rechargement
teleportDeniedReloading: "&7[P0] les téléportations sont temporairement désactivées pendant le rechargement du plugin. Réessayez bientôt."
delayMessage: "<gradient:#9D7CD8:#5FB3B3>[P0] ⚡ Téléportation dans [delay]. Ne bougez pas.</gradient>"
chunkLoading: "&7[P0] ⚙ Chargement des chunks ! veuillez patienter..."
teleportMessage: "<gradient:#5FB3B3:#9D7CD8>[P0] ⚡ Téléporté en [attempts] tentatives, en [processingTime]</gradient>"

# if teleport is cancelled
teleportCancel: "&7[P0] ⚡ Téléportation annulée !"

# Sent when the optional PvP combat check refuses /rtp because the player is in combat
pvpInCombat: "&c[P0] Vous ne pouvez pas vous téléporter aléatoirement en combat."

# s'il n'y a pas d'endroits sûrs après le nombre maximum de tentatives
# espace réservé : [attempts] - le nombre maximum de tentatives
unsafe: "&7[P0] ⌖ impossible de trouver un emplacement sûr en [attempts] tentatives"

# lorsque le joueur est en temps de recharge
# espace réservé : [remainingCooldown] - le temps restant
cooldownMessage: "&7[P0] ⚡ Vous ne pouvez pas vous téléporter avant [remainingCooldown]"

# when the player has reached the lockAfterUses cap and is locked out (BetterRTP LockAfter parity)
lockedAfterUses: "&7[P0] ⌖ Vous avez atteint votre limite de téléportation aléatoire. Réessayez dans [remainingLockTime]."

# si la région n'a aucun emplacement en file et que le joueur n'a pas la permission rtp.unqueued
noLocationsQueued: "#f5eb73[P0] ⌖ aucun emplacement prêt pour le moment"

# lorsque la file d'attente avance
# espace réservé : [spot] - la position actuelle dans la file
queueUpdate: "#2636ef[P0] votre place dans la file : [spot]"

# si le joueur n'a pas assez d'argent pour se téléporter dans la région
# espace réservé : [money] - combien d'argent la commande requiert
notEnoughMoney: "&7[P0] il vous faut au moins $[money] pour cela."

# ###############################################################################
# Section 2: Retour des commandes
# ###############################################################################
# le monde n'existe pas dans bukkit
# espace réservé : [world] - le nom du monde
invalidWorld: "&7[P0] impossible de trouver le monde '[world]'"

# le plugin n'a pas la commande demandée par l'utilisateur
# espace réservé : [arg] - l'argument tenté
badArg: "&c[P0] argument de commande invalide [arg]"

# plugin doesn't have the subcommand or parameter the user requested
# placeholder: [arg] - the argument attempted
invalidCommand: "&c[P0] commande invalide - [arg]"

# l'utilisateur n'a pas la permission pour la commande demandée
noPerms: "&7Désolé, mais vous n'avez pas la permission d'exécuter cette commande. Veuillez contacter les administrateurs du serveur si vous pensez qu'il s'agit d'une erreur."

# plugin is busy reloading
busy: "&c[P0] occupé"

# lorsque la console tente d'exécuter une commande réservée aux joueurs
consoleCmdNotAllowed: "&c[P0] Vous devez être un joueur en jeu pour exécuter cette commande."

# ###############################################################################
# Section 3: Téléportation inter-serveurs (mode réseau)
# ###############################################################################
# Sent only when `network.enabled: true` and the player's `/rtp` is routed
# across the cross-server wait queue (see network.yml `routing.mode`).
# All keys are optional from the player's perspective - the L2 baseline
# `delayMessage` / `teleportMessage` cycle still drives the visible flow.
# Sent when the request has been accepted into the cross-server wait queue
# and is awaiting a backend claim. Placeholder: [position] - 0-indexed
# position from `pollStatus`; may be empty if the transport returns no
# position.
networkQueued: "&7[P0] en file pour une destination inter-serveurs (position [position])..."
# Sent when a player runs /rtp* while they already hold a non-terminal
# cross-server enrolment (command-lock). Placeholder:
# [position] - FIFO position when known; empty when the proxy has not yet
# assigned one.
alreadyQueued: "&cVous attendez déjà dans la file inter-serveurs (position [position]). Veuillez patienter."
# Sent when a cross-server waitlist entry is reaped after exceeding its
# configured TTL. No placeholders.
networkTimedOut: "&c[P0] la téléportation inter-serveurs a expiré en attendant un serveur."
# Sent when a cross-server waitlist enrolment is rejected because the shared
# waitlist has reached its configured maximum size (REJECTED_FULL).
# No placeholders.
waitlistFull: "&c[P0] la file inter-serveurs est pleine ; réessayez bientôt."
# Sent when the queue has handed the request off to the proxy router and
# a backend selection is in progress.
networkRouting: "&7[P0] routage vers un serveur..."
# Sent when a backend has reserved a coordinate for this player and the
# proxy is about to initiate the cross-server hop. Placeholder: [server]
# - the destination backend's serverId.
networkReserved: "&a[P0] coordonnée réservée sur [server]. Transfert..."
# Sent when the proxy is mid-hop. Placeholder: [server] - destination.
networkTransferring: "&a[P0] transfert vers [server]..."
# Sent when the cross-server path gave up and fell back to the local server.
# Placeholder: [reason] - the reason for falling back.
networkFallback: "&e[P0] inter-serveurs indisponible ([reason]) ; retour au serveur local."
# Sent when the cross-server request failed and no fallback was possible.
# Placeholder: [reason] - the failure reason.
networkFailed: "&c[P0] la téléportation inter-serveurs a échoué : [reason]."
# Sent when the player asked for a specific region (`/rtp <region>`) but
# no backend in the network is currently serving it. Placeholder:
# [region] - the requested region name.
networkRegionUnavailable: "&c[P0] aucun serveur ne dessert actuellement la région '[region]'."
# Sent when the requested region name resolves to two or more backends and
# the operator-configured policy cannot pick one (only fires
# under stronger policies than the default `warn`). Placeholder: [region].
networkRegionAmbiguous: "&c[P0] la région '[region]' est ambiguë entre serveurs ; veuillez fixer un serveur."

# ###############################################################################
# Section 4: Visuals
# ###############################################################################
# title settings
# remove or set title to " to disable
# PlaceholderAPI is recommended for coordinates"
title: "<rainbow>Teleporte!</rainbow>"
subtitle: "<gradient:#A78BFA:#E876A0>amusez-vous!</gradient>"
fadeIn: 20
stay: 20
fadeOut: 20

# actionbar setting
actionbar: ""

# ###############################################################################
# Section 5: Time Formatting
# ###############################################################################
# for time placeholders, what to call days, hours, minutes, seconds, and milliseconds
days: "d"
hours: "h"
minutes: "min"
seconds: "s"
millis: "ms"

# ###############################################################################
# Section 6: Descriptions des commandes
# ###############################################################################
rtp: "&b/rtp - se téléporter à un endroit aléatoire"
rtp_description: "se téléporter à un endroit aléatoire"
help: "&b/rtp help - voir ceci"
help_description: "décrit les commandes"
reload: "&b/rtp reload - recharger les fichiers de configuration"
reload_description: "recharger les fichiers de configuration"
scan: "&b/rtp scan - tester tous les placements possibles de région pour améliorer les temps de chargement"
scan_description: "effacer les données sauvegardées et tester tous les placements possibles de région"
config_description: "mettre à jour les fichiers de configuration au moment de l'exécution"
info_description: "vérifier l'état actuel du plugin"
test_description: "tester les fonctions RTP"

# ###############################################################################
# Section 7: Scan Command
# ###############################################################################
# messages related to the scan command
# placeholder: [scan_regions] - list of regions
scanStart: "&a[P0] tâche de scan démarrée pour les régions : [scan_regions]"
scanReset: "&7[P0] file de scan réinitialisée pour les régions : [scan_regions]"
scanCancel: "&7[P0] tâche de scan annulée pour les régions : [scan_regions]"
scanPause: "#A020F0[P0] tâche de scan mise en pause pour les régions : [scan_regions]"
scanResume: "#10A5F5[P0] tâche de scan reprise pour les régions : [scan_regions]"
scanRunning: "&c[P0] tâche de scan déjà en cours pour les régions : [scan_regions]"
scanNotRunning: "&c[P0] tâche de scan non en cours pour les régions : [scan_regions]"
