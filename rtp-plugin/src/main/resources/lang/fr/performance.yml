# --- RTP Performance Settings ---
# Documentation: plugins/RTP/docs/admin/PERFORMANCE.md
# Max search attempts before giving up
# @type: integer
# @range: [1, null]
# @default: 32
tentativesMax: 32

# Chunk radius to load during selection
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
distanceVueSelection: 0

# Chunk radius to load before teleport
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
distanceVueTeleport: 0

# Ticks between background cache cycles
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
periode: 20

# Max ms per tick for sync tasks
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
tempsAlloueSync: 50

# Max ms per tick for async tasks
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
tempsAlloueAsync: 50

# Min TPS to continue background queueing
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
tpsMin: 19.0

# Utilisation maximale du tas de la JVM (pourcentage du tas maximal) avant que
# la génération du cache en arrière-plan ne se mette en pause. Chaque
# emplacement mis en cache verrouille un chunk, donc un remplissage illimité
# sur un serveur disposant d'un petit tas peut entraîner la JVM dans un ramasse-
# miettes constant et rendre le serveur insensible sans aucune erreur dans la
# console. Tant que l'utilisation est égale ou supérieure à ce seuil, RTP cesse
# de remplir le cache d'emplacements mais continue de servir les emplacements
# déjà mis en cache aux joueurs en attente. 0 ou 100 désactive la limite.
# @type: number
# @range: [0.0, 100.0]
# @default: 85.0
maxHeapPourcentage: 85.0

# Refill cache immediately after teleport
# @type: boolean
# @default: false
miseEnFilePostTeleport: false

# Use sync chunk loading (NOT RECOMMENDED)
# @type: boolean
# @default: false
chargementSync: false

# Parse permissions on every event
# @type: boolean
# @default: false
analyseSurEvenement: false

# Parse effect permissions on startup
# @type: boolean
# @default: true
analyseEffets: true

# Reuse found biome locations
# @type: boolean
# @default: true
rappelBiome: true

# Only use biomes already in cache
# @type: boolean
# @default: false
rappelBiomeForce: false

# Biaise la sélection filtrée par biome pour que chaque biome demandé soit ciblé
# avec une probabilité égale, au lieu d'être proportionnel à la part de la région
# qu'il couvre. Évite que les biomes courants n'éclipsent les rares quand plusieurs
# biomes sont demandés. Nécessite biomeRecall ; sans effet sur les téléportations
# non filtrées (biome par défaut).
# @type: boolean
# @default: false
biomePondere: false

# Per-biome relative selection weights for biome-filtered teleports.
# Only consulted when biomeWeighted is true. Biomes not listed here use
# weight 1.0, so an empty/all-equal map reproduces the equal-probability
# behavior of biomeWeighted on its own. A biome given weight 2.0 is
# steered toward roughly twice as often as a weight-1.0 biome among the
# requested set (when both are present in biome-recall memory); 0.0
# suppresses a biome. Requires biomeRecall; no effect on unfiltered
# (default-biome) teleports. The shipped plains entry is a weight-1.0
# no-op example - replace or extend it with the biomes you want to bias.
# @type: map<string, number>
poidsBiome:
  # Poids de sélection relatif pour ce biome (1.0 = aucun biais).
  # @type: number
  # @range: [0.0, null]
  # @default: 1.0
  plains: 1.0
  sunflower_plains: 1.0
  snowy_plains: 1.0
  ice_spikes: 1.0
  desert: 1.0
  swamp: 1.0
  mangrove_swamp: 1.0
  forest: 1.0
  flower_forest: 1.0
  birch_forest: 1.0
  dark_forest: 1.0
  old_growth_birch_forest: 1.0
  old_growth_pine_taiga: 1.0
  old_growth_spruce_taiga: 1.0
  taiga: 1.0
  snowy_taiga: 1.0
  savanna: 1.0
  savanna_plateau: 1.0
  windswept_hills: 1.0
  windswept_gravelly_hills: 1.0
  windswept_forest: 1.0
  windswept_savanna: 1.0
  jungle: 1.0
  sparse_jungle: 1.0
  bamboo_jungle: 1.0
  badlands: 1.0
  eroded_badlands: 1.0
  wooded_badlands: 1.0
  meadow: 1.0
  cherry_grove: 1.0
  pale_garden: 1.0
  grove: 1.0
  snowy_slopes: 1.0
  frozen_peaks: 1.0
  jagged_peaks: 1.0
  stony_peaks: 1.0
  river: 1.0
  frozen_river: 1.0
  beach: 1.0
  snowy_beach: 1.0
  stony_shore: 1.0
  warm_ocean: 1.0
  lukewarm_ocean: 1.0
  deep_lukewarm_ocean: 1.0
  ocean: 1.0
  deep_ocean: 1.0
  cold_ocean: 1.0
  deep_cold_ocean: 1.0
  frozen_ocean: 1.0
  deep_frozen_ocean: 1.0
  mushroom_fields: 1.0
  dripstone_caves: 1.0
  lush_caves: 1.0
  deep_dark: 1.0
  # --- Le Nether ---
  nether_wastes: 1.0
  warped_forest: 1.0
  crimson_forest: 1.0
  soul_sand_valley: 1.0
  basalt_deltas: 1.0
  # --- L'End ---
  the_end: 1.0
  end_highlands: 1.0
  end_midlands: 1.0
  small_end_islands: 1.0
  end_barrens: 1.0
  # --- Divers / technique ---
  the_void: 1.0

# Check for safe spots in all loaded chunks
# @type: boolean
# @default: false
verifierAuChargementChunk: false

# Enable background data gathering
# @type: boolean
# @default: false
visiteurActive: true

# Conserver un cache réservé pour les téléportations à la connexion (rtp.onevent.firstjoin / rtp.onevent.join). Dimensionné par les slots libres restants. Voir
# @type: boolean
# @default: false
cacheConnexionActive: false

# Plafond strict du cache de connexion. 0 = automatique (max-players du serveur au démarrage).
# @type: integer
# @range: [0, null]
# @default: 0
limiteCacheConnexion: 0

# Probability [0.0, 1.0] of rejecting an ungenerated chunk per selection attempt. 0.0 = no bias (default), 1.0 = strictly avoid ungenerated land. Generated chunks always pass.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.0
preferencePregenere: 0.0

# Fraction [0.0, 1.0] of L3 backlog capacity at which refill resumes (hysteresis). 0.5 = refill only after L3 drains to 50% (default). 1.0 = refill continuously.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.5
seuilRemplissageBacklog: 0.5

# Seuil de latence (ms) au-delà duquel une téléportation servie immédiatement
# (non mise en file) est auditée : un WARN est journalisé et le compteur cumulé
# slowPipelineCount (affiché par /rtp info) est incrémenté. Seules les
# téléportations immédiates/non mises en file sont auditées ; celles en file
# sont exclues car leur temps mesuré inclut l'attente. 0 ou moins désactive l'audit. Voir ADR-053.
# @type: integer
# @range: [0, null]
# @unit: ms
# @default: 5000
seuilPipelineLenteMs: 5000

# Profondeur de la file publique de téléportation (joueurs en attente) à partir de
# laquelle la contre-pression est auditée : un WARN déclenché sur front est journalisé
# et le compteur cumulé queueGrowthWarnCount (affiché par /rtp info) est incrémenté
# une fois par franchissement. 0 ou moins désactive l'audit (optionnel). Voir ADR-053.
# @type: integer
# @range: [0, null]
# @unit: players
# @default: 0
seuilAlerteCroissanceFile: 0

# Réglages de /rtp admin prefab. Le flux apply -> confirm écrit chaque fichier de
# configuration modifié avec une sauvegarde nommée <file>.yml.bak.<epochMillis>;
# bakRetention limite le nombre de telles sauvegardes conservées par fichier, les
# plus anciennes étant supprimées d'abord. Mettez 1 pour ne garder que la plus
# récente ; les valeurs inférieures à 1 sont ramenées à 1. /rtp admin prefab rollback
# parcourt les sauvegardes de la plus récente à la plus ancienne sur plusieurs appels.
prefabrique:
  # Number of timestamped config backups kept per file before pruning.
  # @type: integer
  # @range: [1, null]
  # @default: 3
  bakRetention: 3
# NE PAS MODIFIER LE NUMÉRO DE VERSION
version: 1.0
