# --- RTP Performance Settings ---
# Documentation: plugins/RTP/docs/admin/PERFORMANCE.md
# Max search attempts before giving up
# @type: integer
# @range: [1, null]
# @default: 32
maxAttempts: 32

# Chunk radius to load during selection
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
viewDistanceSelect: 0

# Chunk radius to load before teleport
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
viewDistanceTeleport: 0

# Ticks between background cache cycles
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
period: 20

# Max ms per tick for sync tasks
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
syncAllottedTime: 50

# Max ms per tick for async tasks
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
asyncAllottedTime: 50

# Min TPS to continue background queueing
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
minTPS: 19.0

# Refill cache immediately after teleport
# @type: boolean
# @default: false
postTeleportQueueing: false

# Use sync chunk loading (NOT RECOMMENDED)
# @type: boolean
# @default: false
syncLoading: false

# Parse permissions on every event
# @type: boolean
# @default: false
onEventParsing: false

# Parse effect permissions on startup
# @type: boolean
# @default: true
effectParsing: true

# Reuse found biome locations
# @type: boolean
# @default: true
biomeRecall: true

# Only use biomes already in cache
# @type: boolean
# @default: false
biomeRecallForced: false

# Bias biome-filtered selection so each requested biome is steered toward
# with equal probability, instead of in proportion to how much of the
# region it covers. Counteracts common biomes drowning out rare ones when
# several biomes are requested. Requires biomeRecall; no effect on
# unfiltered (default-biome) teleports.
# @type: boolean
# @default: false
biomeWeighted: false

# Per-biome relative selection weights for biome-filtered teleports.
# Only consulted when biomeWeighted is true. Biomes not listed here use
# weight 1.0, so an empty/all-equal map reproduces the equal-probability
# behavior of biomeWeighted on its own. A biome given weight 2.0 is
# steered toward roughly twice as often as a weight-1.0 biome among the
# requested set (when both are present in biome-recall memory); 0.0
# suppresses a biome. Requires biomeRecall; no effect on unfiltered
# (default-biome) teleports. The shipped plains entry is a weight-1.0
# no-op example - replace or extend it with the biomes you want to bias.
# @type: map<string, number>
biomeWeights:
  # @type: number
  # @range: [0.0, null]
  # @default: 1.0
  plains: 1.0

# Check for safe spots in all loaded chunks
# @type: boolean
# @default: false
checkOnChunkLoads: false

# Enable background data gathering
# @type: boolean
# @default: false
visitorEnabled: true

# Conserver un cache réservé pour les téléportations à la connexion (rtp.onevent.firstjoin / rtp.onevent.join). Dimensionné par les slots libres restants. Voir
# @type: boolean
# @default: false
loginCacheEnabled: false

# Plafond strict du cache de connexion. 0 = automatique (max-players du serveur au démarrage).
# @type: integer
# @range: [0, null]
# @default: 0
loginCacheCap: 0

# Probability [0.0, 1.0] of rejecting an ungenerated chunk per selection attempt. 0.0 = no bias (default), 1.0 = strictly avoid ungenerated land. Generated chunks always pass.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.0
pregeneratedPreference: 0.0

# Fraction [0.0, 1.0] of L3 backlog capacity at which refill resumes (hysteresis). 0.5 = refill only after L3 drains to 50% (default). 1.0 = refill continuously.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.5
backlogRefillThreshold: 0.5

# Latency threshold (ms) above which an immediately-served (unqueued) teleport
# is audited: a WARN is logged and the cumulative slowPipelineCount counter
# (surfaced by /rtp info) is incremented. Only immediate/unqueued teleports are
# audited; queued at-rate teleports are excluded because their measured time
# includes queue-wait. 0 or below disables the audit. See ADR-053.
# @type: integer
# @range: [0, null]
# @unit: ms
# @default: 5000
slowPipelineThresholdMs: 5000

# Public teleport-queue depth (players waiting) at or above which queue
# backpressure is audited: an edge-triggered WARN is logged and the cumulative
# queueGrowthWarnCount counter (surfaced by /rtp info) is incremented once per
# crossing. 0 or below disables the audit (opt-in). See ADR-053.
# @type: integer
# @range: [0, null]
# @unit: players
# @default: 0
queueGrowthWarnThreshold: 0
# Settings for /rtp admin prefab. The `apply` -> `confirm` flow writes
# each touched config file with a sibling backup named
# <file>.yml.bak.<epochMillis>; `bakRetention` caps how many such
# backups are kept per file, oldest pruned first. Set to 1 to keep only
# the most recent backup; values below 1 are clamped to 1. /rtp admin
# prefab rollback walks backups newest-first across multiple invocations.
prefab:
  # @type: integer
  # @range: [1, null]
  # @default: 3
  bakRetention: 3
# DO NOT TOUCH VERSION NUMBER
version: 1.0
