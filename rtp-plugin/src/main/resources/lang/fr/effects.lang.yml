# --- Mappage de langue : effects.yml ---
# Associe les noms internes des clés de configuration (à gauche) aux
# noms visibles par l'opérateur dans effects.yml (à droite).
# Modifiez uniquement la colonne de droite pour renommer ou traduire
# les options ; la gauche est une constante du code, ne la modifiez pas.
# Si ce fichier est absent, le plugin le régénérera automatiquement avec
# une version anglaise dont les deux côtés sont identiques.
when: quand
permission: permission
players: joueurs
inherit: herite
effects: effets
version: version
