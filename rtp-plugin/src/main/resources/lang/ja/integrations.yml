# --- RTP 連携設定 ---
# 各トグルは、指定したプラグインのクレーム/領域内に着地した場合に転送先を再抽選します（そのプラグインが導入されている場合のみ有効）。
# Factions のクレーム内に着地した場合に位置を再抽選します。
# @type: boolean
# @default: false
rerollFactions: false

# GriefDefender のクレーム内に着地した場合に位置を再抽選します。
# @type: boolean
# @default: false
rerollGriefDefender: false

# GriefPrevention のクレーム内に着地した場合に位置を再抽選します。
# @type: boolean
# @default: false
rerollGriefPrevention: false

# HuskTowns のクレーム内に着地した場合に位置を再抽選します。
# @type: boolean
# @default: false
rerollHuskTowns: false

# Lands のクレーム内に着地した場合に位置を再抽選します。
# @type: boolean
# @default: false
rerollLands: false

# RedProtect の領域内に着地した場合に位置を再抽選します。
# @type: boolean
# @default: false
rerollRedProtect: false

# Towny Advanced のクレーム内に着地した場合に位置を再抽選します。
# @type: boolean
# @default: false
rerollTownyAdvanced: false

# WorldGuard の領域内に着地した場合に位置を再抽選します。
# @type: boolean
# @default: false
rerollWorldGuard: false

# バージョン番号は変更しないでください
version: 1.0
