# --- RTP 経済設定 ---
# サーバーの経済システムを通じてランダムテレポートのコストを設定します。
# 返金ポリシー
# テレポートがキャンセルされたときに料金を返金してクールダウンをリセットするか。
キャンセル時返金: true

# テレポートコスト
# 標準 /rtp コマンドの基本料金。
価格: 50.0

# 他のプレイヤーをテレポート (/rtp <プレイヤー>) するときの料金。
他者への価格: 200.0

# カスタムパラメータ (/rtp region:<region> など) を使うときの料金。
パラメータ価格: 1000000000.0

# バイオーム指定 (/rtp biome:<biome>) の追加料金。
バイオーム価格: 5000.0

# 強制される最低残高。
# RTP 使用後にプレイヤーの残高がこの値を下回ることはできません。
最低残高: 0.0

# バージョン番号は変更しないでください
version: 1.0
