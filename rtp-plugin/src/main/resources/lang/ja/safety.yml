# --- RTP 安全設定 ---
# プラグインがテレポート先を「安全」と判断する基準を設定します。
# トークン構文:
# MATERIAL -- 単純な素材、例: LAVA
# MATERIAL[prop=val,prop2=val2] -- すべてのブロック状態プロパティが一致した場合のみ
# #namespace:tag -- そのタグ配下のすべての素材に展開
# #namespace:tag[prop=val] -- プロパティが一致した場合のみタグメンバーをカウント
# *[prop=val] -- プロパティが一致したときに任意の素材にマッチ（ワイルドカード）
# プロパティ値は Bukkit BlockData の文字列形式と大文字小文字を無視して比較されます。
# 未知のタグは空集合に展開されます (no-op, fail-open)。形式不正のトークンはリロード時に
# WARN レベルで一度だけログ出力されます 。リスト内の順序は重要ではありません。
# 無敵時間（秒）
# テレポート後にプレイヤーが無敵となる時間。到着直後に火・窒息・落下ダメージで死ぬのを防ぎます。
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 5
無敵時間: 5

# 安全チェック半径（ブロック）
# ターゲットブロック周辺の危険チェック半径。
# 大きいほど安全ですが、適切な着地点を見つけるのは難しくなります。
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 0
安全半径: 0

# 古いチャンクの再試行上限（回数）
# における古いチャンクガードの有界リトライ予算。非同期チャンクロード
# 完了後、後続のブロック評価タスクは Count-Bound のタスクパイプライン (Folia の Region Thread
# スケジューラ) にキューイングされます。パイプラインが飽和している場合、ネイティブのチャンク GC
# がそのタスクの実行前にチャンクをアンロードしてしまうことがあり、放置すると Region Thread での
# 同期ロードが発生し Folia の Watchdog を起こします。ガードがこの競合を検知すると、最大この回数まで
# 非同期ロードを再キューイングします。使い切ったらこの候補は通常の "unsafe" ルートで拒否されます
# (WARN ログを出力。黙って捨てることはありません)。
# デフォルト: 2。極めて積極的なチャンク GC を持つフォークでのみ増やしてください。
# @type: integer
# @range: [0, null]
# @default: 2
staleChunkRetryLimit: 2

# 読み取り専用 Anvil プリフィルタ（Vanilla Spigot のみ）
# 永続化されたリージョンファイル `r.X.Z.mca` をスレッド外で解析する安全プローブで、
# 明らかに安全でない候補（heightmap 表面が lava/magma/fire）について、ライブで権威ある
# チャンクのロードを要求する前に拒否します。Vanilla Spigot ではライブチャンクロード API が
# 真に非同期ではないため、tick スレッドの負荷を軽減します。Paper / Folia ではネイティブの
# 非同期 API がチャンクロード経路を置き換えており、プリフィルタには到達しないため効果はありません。
# ACCEPT 時は引き続き chunk.isSafe(...) のライブ再チェックが権威となります。REJECT のみが
# ショートカットです。 を参照。
# デフォルト: true。エキゾチックなリージョンフォーマットを使うフォークではプリフィルタを
# 無効化するために false に設定してください。
# @type: boolean
# @default: true
anvilPrefilterEnabled: true

# 着地プラットフォーム
# テレポート先に着地用プラットフォームを生成します。中心ブロックは目的地のブロック種類に応じて選択。
# プラットフォームを無効にするには platformRadius を -1 に設定。
# デフォルト: -1 (無効) — モダンな安全チェック (chunk.isSafe + 垂直調整) によって信頼できる
# 着地点が安定して得られるため、この緊急用プラットフォーム (ガラスブロック) はデフォルトで無効です。
# 旧式のフォールバックが必要なほど安全でない着地が出る場合のみ 0 以上に設定してください。
# @type: integer
# @range: [-1, null]
# @unit: blocks
# @default: -1
プラットフォーム半径: -1

# Depth (vertical thickness) of the emergency platform.
# @type: integer
# @range: [1, null]
# @unit: blocks
# @default: 1
プラットフォーム深さ: 1

# プラットフォーム上に保証する空気の高さ。
# 高すぎると光環境がおかしくなることがあります。
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 2
プラットフォーム空気高さ: 2

# 目的地に固体ブロックがない場合にプラットフォームで使うデフォルト素材。
# @type: material
# @source: material
# @default: GLASS
プラットフォーム素材: "GLASS"

# 空気ブロック
# 通り抜け可能/プレイヤーの体を遮らないと見なす素材。前方互換性のため
# 可能な限りバニラのブロックタグを優先してください
# (例: 将来 MC が追加する花は #minecraft:small_flowers から自動的に選択されます)。
# @type: list<material>
# @source: material
空気ブロック:
  # 真の air バリアント（これらをすべてカバーするタグはありません）
  - "AIR"
  - "CAVE_AIR"
  - "VOID_AIR"
  - "LEGACY_AIR"
  - "STRUCTURE_VOID"
  - "LIGHT"
  # 花 (タンポポ, ポピー, チューリップ, アイブロッサム, トーチフラワー…)
  - "#minecraft:flowers"
  - "#minecraft:small_flowers"
  # 注意: #minecraft:tall_flowers はバニラではアイテム専用タグです。そのメンバー
  # (LILAC, PEONY, ROSE_BUSH, SUNFLOWER, PITCHER_PLANT) はすでに上記の
  # #minecraft:flowers でカバーされています。
  - "#minecraft:tall_flowers"
  # 草系の植物と、花タグに含まれない低木
  - "SHORT_GRASS"
  - "TALL_GRASS"
  - "SHORT_DRY_GRASS"
  - "TALL_DRY_GRASS"
  - "FERN"
  - "LARGE_FERN"
  - "DEAD_BUSH"
  - "BUSH"
  - "WILDFLOWERS"
  - "FIREFLY_BUSH"
  - "LEGACY_LONG_GRASS"
  - "LEGACY_DEAD_BUSH"
  # 苗木, 繁殖芽, キノコ
  - "#minecraft:saplings"
  - "BROWN_MUSHROOM"
  - "RED_MUSHROOM"
  - "CRIMSON_FUNGUS"
  - "WARPED_FUNGUS"
  # 作物と便利なタグのない地表植物
  - "#minecraft:crops"
  - "MELON_STEM"
  - "PUMPKIN_STEM"
  - "SUGAR_CANE"
  - "BAMBOO_SAPLING"
  # ツタと壁掛け植物
  - "VINE"
  - "GLOW_LICHEN"
  - "WEEPING_VINES"
  - "TWISTING_VINES"
  - "HANGING_ROOTS"
  - "PALE_HANGING_MOSS"
  - "RESIN_CLUMP"
  # レール
  - "#minecraft:rails"
  # レッドストーン回路 (まとまったタグなし)
  - "REDSTONE_WIRE"
  - "COMPARATOR"
  - "REPEATER"
  - "LEVER"
  - "STRING"
  - "TRIPWIRE"
  # 松明と照明 (まとまったタグなし)
  - "TORCH"
  - "WALL_TORCH"
  - "SOUL_TORCH"
  - "SOUL_WALL_TORCH"
  - "REDSTONE_TORCH"
  - "REDSTONE_WALL_TORCH"
  - "END_ROD"
  # ボタン (石/木のすべてのバリアント)
  - "#minecraft:buttons"
  # 感圧板
  - "#minecraft:pressure_plates"
  # 看板 -- 直立/壁掛け/吊り下げの全バリアント (4 つのタグ)
  - "#minecraft:standing_signs"
  - "#minecraft:wall_signs"
  - "#minecraft:ceiling_hanging_signs"
  - "#minecraft:wall_hanging_signs"
  - "LEGACY_SIGN"
  - "LEGACY_WALL_SIGN"
  # 地表カーペット
  - "SNOW"
  - "MOSS_CARPET"
  - "PALE_MOSS_CARPET"
  - "LEAF_LITTER"

# 危険ブロック
# プラグインが着地点として拒否する素材またはブロック状態。`safetyRadius` 範囲内に
# あった場合も拒否されます。状態述語とワイルドカードに対応 (ファイル先頭の構文参照)。
# @type: list<material>
# @source: material
危険ブロック:
  # 流体
  - "WATER"
  - "LAVA"
  - "BUBBLE_COLUMN"
  # 水没ブロック (ハーフ/階段/フェンス/壁/看板/チェーン/…) — 旧来の擬似トークン
  # 'WATERLOGGED' を置き換えます。 のワイルドカードを使用。
  - "*[waterlogged=true]"
  # 火炎と高温危険物
  - "#minecraft:fire"
  - "POWDER_SNOW"
  - "MAGMA_BLOCK"
  # 焚き火 (点火/未点火のいずれもプレイヤーが沈み込むため危険)
  - "#minecraft:campfires"
  # 接触ダメージ / 引っかかり
  - "CACTUS"
  - "SWEET_BERRY_BUSH"
  - "WITHER_ROSE"
  - "CHORUS_PLANT"
  - "CHORUS_FLOWER"
  - "POINTED_DRIPSTONE"
  - "COBWEB"
  - "CREAKING_HEART"
  # 奈落 / ポータル / 移動不可
  - "BEDROCK"
  - "NETHER_PORTAL"
  - "END_PORTAL"
  - "END_GATEWAY"
  # 爆発物
  - "TNT"
  - "END_CRYSTAL"
  - "RESPAWN_ANCHOR"
  # 水中植物 (窒息リスク)
  - "SEAGRASS"
  - "TALL_SEAGRASS"
  - "KELP"
  - "KELP_PLANT"
  - "#minecraft:logs"

# バイオームフィルタ
# biomeWhitelist: false -> `biomes` リストはブラックリスト (これらをスキップ)
#                  true  -> `biomes` リストはホワイトリスト (これらだけを許可)
# デフォルトのブラックリストは海洋・河川・奈落、その他しっかりした安全な着地点を
# 得るのが難しい/不可能なバイオームを除外します。
# @type: boolean
# @default: false
バイオームホワイトリスト: false

# Biomes treated as whitelist or blacklist members per biomeWhitelist.
# @type: list<biome>
# @source: biome
バイオーム:
  # 海洋系
  - "OCEAN"
  - "DEEP_OCEAN"
  - "WARM_OCEAN"
  - "LUKEWARM_OCEAN"
  - "DEEP_LUKEWARM_OCEAN"
  - "COLD_OCEAN"
  - "DEEP_COLD_OCEAN"
  - "FROZEN_OCEAN"
  - "DEEP_FROZEN_OCEAN"
  # 河川系
  - "RIVER"
  - "FROZEN_RIVER"
  # 隣接/沿岸バイオーム
  - "BEACH"
  - "SNOWY_BEACH"
  - "STONY_SHORE"
  - "SWAMP"
  - "MANGROVE_SWAMP"
  # エンドバイオーム (固体着地点なし / 奈落隣接)
  - "SMALL_END_ISLANDS"
  # ネザーバイオーム (危険/起伏のある地形)
  - "BASALT_DELTAS"
  # 技術的バイオーム
  - "THE_VOID"
  - "LUSH_CAVES"
  - "DEEP_DARK"
  - "THE_VOID"

# --- Optional PvP / combat-tag pre-flight gate ---
# Master toggle. When true, /rtp consults the active combat-state authority
# before enrolling a player and again before applying the destination, and
# applies pvpOnCombat below. Off by default.
# @type: boolean
# @default: false
pvpCheckEnabled: false

# How long after dealing or taking PvP damage a player is considered "in combat"
# by RTP's native tracker. Ignored when an external combat-tag plugin is bound.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 15
pvpCombatTagSeconds: 15

# What to do when a combat-tagged player requests (or is mid-)/rtp.
# ALLOW  - permit, but log an audit line
# DENY   - refuse the command with the busy message
# DELAY  - postpone until the combat tag expires, then proceed
# CANCEL - abort an in-progress / queued teleport
# Unknown values fail safe to DENY.
# @type: enum
# @options: [ALLOW, DENY, DELAY, CANCEL]
# @default: DENY
pvpOnCombat: "DENY"

# Combat-state source preference.
# AUTO     - external combat-tag plugin if one is bound, else native tracker
# NATIVE   - always use RTP's native damage tracker
# EXTERNAL - only a bound combat-tag plugin (no native fallback)
# @type: enum
# @options: [AUTO, NATIVE, EXTERNAL]
# @default: AUTO
pvpSource: "AUTO"

# Native tracker: tag a player who TAKES PvP damage.
# @type: boolean
# @default: true
pvpTagVictim: true

# Native tracker: tag a player who DEALS PvP damage.
# @type: boolean
# @default: true
pvpTagAggressor: true

# バージョン番号は変更しないでください
version: 1.0
