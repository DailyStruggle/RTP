# --- 組み込みテスト（BIT）の設定 ---
# ドキュメント: docs/admin/configuration/BIT.md

# アクションの構造上の検出結果を警告として記録し、登録を妨げません。
# true にすると、有効な ERROR があるアクションは登録されません。
strictActions: false

# 以前のバージョンで受け入れられていた設定の指摘を警告として記録し、/rtp reload を拒否しません。
# true にするとエラーとして扱い、エラーのある再読み込みや Hot-Apply では現在の設定を維持します。
strictConfig: false

# ゲートを常に成功または常に失敗と判定するまでに必要な最小評価回数。
gateOutcomeSamples: 200

# 登録済み BIT コードの重大度。strictActions のプリセットより優先されます。
# 使用可能な値: ERROR、WARNING、INFO、DEBUG、TRACE、OFF。OFF は検出結果を抑制します。
# 未登録のコードやレベルは無視され、ログに記録されます。
overrides:

# バージョン番号は変更しないでください
version: 1.0