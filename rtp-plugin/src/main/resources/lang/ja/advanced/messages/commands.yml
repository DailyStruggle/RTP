# --- RTP のメッセージ (この言語) ---
# この言語でのプレイヤーおよび運営者向けメッセージ文。テーマごとに分類されています。
# 英語版メッセージから自動生成された複製です。手動で編集しないでください (上書きされます)。

# ###############################################################################
# セクション 6: スキャンコマンド
# ###############################################################################
スキャン開始: "&a[P0] 以下のリージョンでスキャンタスクを開始しました: [scan_regions]"
スキャンリセット: "&7[P0] 以下のリージョンのスキャンキューをリセットしました: [scan_regions]"
スキャン取消: "&7[P0] 以下のリージョンのスキャンタスクを取り消しました: [scan_regions]"
スキャン一時停止: "#A020F0[P0] 以下のリージョンのスキャンタスクを一時停止しました: [scan_regions]"
スキャン再開: "#10A5F5[P0] 以下のリージョンのスキャンタスクを再開しました: [scan_regions]"
スキャン実行中: "&c[P0] 以下のリージョンでは既にスキャンタスクが実行中です: [scan_regions]"
スキャン未実行: "&c[P0] 以下のリージョンには現在スキャンタスクがありません: [scan_regions]"
# placeholder: [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
スキャン状況: "[P0] &8» &7[scan_regions] &8| &7[scan_chunks]&8/&7[scan_totalChunks] &8| #7E9CC8[scan_cps]&7 cps &8| #7E9CC8[scan_landPercentage]%&7 陸地 &8| &7ETA #7E9CC8[scan_eta]"
# Boss-bar title shown to players with rtp.scan permission while a world scan is running.
# Set to empty string to disable the boss-bar.
# placeholder: [scan_regions], [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
scanBossBar: "Scanning [scan_regions]: [scan_chunks]/[scan_totalChunks] ([scan_landPercentage]% land) ETA [scan_eta]"

# ###############################################################################
# セクション 7: 情報コマンド
# ###############################################################################
情報タイトル: "&2&l/rtp info"
情報_チケット: "&7グローバルアクティブチャンクチケット: #7E9CC8[tickets]"
情報_テレポート: "&7アクティブテレポートステートマシン: #7E9CC8[teleports]"
情報_MSPT: "&7プラグイン現在の MSPT: #7E9CC8[mspt]"
情報_総ロード数: "&7累計ロードチャンク数: #7E9CC8[loads]"
infoLoadsByOrigin: "&7発生源別の読み込み: #7E9CC8[loadsByOrigin]"
情報_リーク率: "&7現在のチャンクリーク率: #7E9CC8[leakRate]"
# --- Health metrics block ---
infoQueueDepth: "&7リージョンキューで待機中のプレイヤー: #7E9CC8[queueDepth]"
infoPendingTeleports: "&7保留中のテレポートパイプライン: #7E9CC8[pendingTeleports]"
infoAvgPipelineMs: "&7パイプライン平均遅延: #7E9CC8[avgPipelineMs] ms"
# Pipeline-latency percentiles. Placeholders: [pipelineMsP50] [pipelineMsP75]
# [pipelineMsP90] [pipelineMsP95] [pipelineMsP99] [pipelineSampleCount].
infoPipelinePercentiles: "&7パイプライン遅延 (ms) P50/P75/P90/P95/P99: #7E9CC8[pipelineMsP50] / [pipelineMsP75] / [pipelineMsP90] / [pipelineMsP95] / [pipelineMsP99]&7 (n=[pipelineSampleCount])"
# Slow-teleport audit (immediate/unqueued teleports only). Placeholders:
# [slowPipelineCount] [slowPipelineThresholdMs].
infoSlowPipeline: "&7遅いテレポート (> #7E9CC8[slowPipelineThresholdMs]&7 ms): #7E9CC8[slowPipelineCount]"
# Queue-growth audit. Placeholders: [queueGrowthWarnCount] [queueGrowthWarnThreshold].
infoQueueGrowth: "&7キュー増加の警告 (>= #7E9CC8[queueGrowthWarnThreshold]&7): #7E9CC8[queueGrowthWarnCount]"
infoHeap: "&7JVMヒープ: #7E9CC8[heapUsedMb] / [heapMaxMb] MiB"
# /rtp info の Health pipeline ラベルブロックのヘッダー行。
infoHealthPipelineHeader: "&7--- 状態: パイプライン ---"
# 1m / 5m / 15m ウィンドウの TPS 表示。プレースホルダー: [tps1m] [tps5m] [tps15m]。
infoTps: "&7TPS (1m/5m/15m): #7E9CC8[tps1m] / [tps5m] / [tps15m]"
# サーバーのリアルタイム MSPT と tick バジェット使用率。プレースホルダー: [mspt] [tickBudgetUtilisation]。
infoMSPTLive: "&7サーバーMSPT: #7E9CC8[mspt] ms (&7ティック予算: #7E9CC8[tickBudgetUtilisation]&7)"
# Configured player soft-cap vs current online count. Placeholders: [softCap] [playerCount].
infoSoftCap: "&7プレイヤー: #7E9CC8[playerCount] / [softCap]"
# データベースの最新ラウンドトリップレイテンシ（ms）。プレースホルダー: [databaseLatencyMs]。
infoDatabaseLatencyMs: "&7データベース遅延: #7E9CC8[databaseLatencyMs] ms"
# Generation outcome metrics.
# Success/failure rate over all recorded generation attempts. Placeholders:
# [genSuccessRate] [genFailureRate] [genOutcomeTotal].
infoFailureRate: "&7生成成功率: #7E9CC8[genSuccessRate]&7 (失敗 #7E9CC8[genFailureRate]&7, n=#7E9CC8[genOutcomeTotal]&7)"
# Single most common rejection cause and its share of all failures. Placeholders:
# [genTopRejectionCause] [genTopRejectionShare].
infoTopRejectionCause: "&7主な拒否理由: #7E9CC8[genTopRejectionCause]&7 (#7E9CC8[genTopRejectionShare]&7)"
# Per-cause rejection breakdown.
# Placeholder: [genFailureBreakdown] - comma-separated cause=N list, busiest first.
infoFailureBreakdown: "&7理由別の拒否: #7E9CC8[genFailureBreakdown]"
# Health colour-band thresholds. Used to colour the coloured-variant
# placeholders (e.g. [tps1mColoured]) green/yellow/red.
infoThresholdTpsGreen: 19.5
infoThresholdTpsYellow: 18.0
infoThresholdMsptGreen: 30.0
infoThresholdMsptYellow: 45.0
infoThresholdCacheFillGreen: 0.5
infoThresholdCacheFillYellow: 0.25
infoThresholdNetworkAgeYellow: 5.0
# Header line introducing the per-Folia-region table (Folia runtime only).
infoFoliaRegionsHeader: "&7--- Foliaリージョン ---"
# Per-row template for a single Folia region. Placeholders: [regionId] [tps1m]
# [mspt] [playerCount] [queueDepth] [tickBudgetUtilisation].
infoFoliaRegion: "#7E9CC8[regionId]&7: tps=#7E9CC8[tps1m]&7 mspt=#7E9CC8[mspt]&7 players=#7E9CC8[playerCount]&7 queue=#7E9CC8[queueDepth]&7 budget=#7E9CC8[tickBudgetUtilisation]"
情報_免責_ヘッダ: "&7--- 診断ノート ---"
情報_免責: "&7診断ノート: サーバーの孤立チャンク総数が本プラグインの累計ロード数 ([loads]) を超える場合、本プラグインがメモリリークの唯一の原因ではありません。"
情報_ワールドヘッダ: "#008080ワールド:"
情報_コンソール_ワールドヘッダ: "&7--- ワールド ---"
情報ワールド: "#21ADA8[world]"
情報_リージョンヘッダ: "#63C5DAリージョン:"
情報_コンソール_リージョンヘッダ: "&7--- リージョン ---"
情報リージョン: "#52B2BF[region]"
# Biome-occupancy leaderboard shown by /rtp info biomes - which biomes online
# players spend their time in, sampled over the server's uptime.
# Header placeholders: [biomeTotalSamples] [biomeDistinctCount].
infoBiomeActivityHeader: "&8--- &3バイオーム占有 &8(&3[biomeTotalSamples]&8 サンプル, &3[biomeDistinctCount]&8 バイオーム) ---"
# Per-biome row. Placeholders: [biomeRank] [biomeName] [biomeSamples] [biomePercent] [biomeBar].
infoBiomeActivityRow: "&8 [biomeRank]. &3[biomeName] &8[biomeBar] &7[biomePercent]% &8([biomeSamples])"
# Shown when no occupancy has been sampled yet.
infoBiomeActivityEmpty: "&8--- &7まだバイオーム占有がサンプリングされていません &8---"

# sub-info listings
# placeholders: [world], [region], [requirePermission], [override], [shape], [worldBorderOverride], [cacheCap], [cached], [keptCache], [unkeptCache], [backlogCache], [backlogCacheCap]
ワールド情報:
  - "#21ADA8[world]:"
  - "#99EEBB  - リージョン: [region]"
  - "#99EEBB  - 必要な権限: [requirePermission]"
  - "#99EEBB  - 上書き: [override]"

リージョン情報:
  - "#52B2BF[region]:"
  - "#58CCED  - ワールド: [world]"
  - "#58CCED  - 形状: [shape]"
  - "#58CCED  - 必要な権限: [requirePermission]"
  - "#58CCED  - ワールドボーダーの上書き: [worldBorderOverride]"
  - "#58CCED  - キャッシュ上限: [cacheCap]"
  - "#58CCED  - 保持キャッシュ (L1): [keptCache]"
  - "#58CCED  - 解放キャッシュ (L2): [unkeptCache]"
  - "#58CCED  - バックログキャッシュ (L3): [backlogCache] / [backlogCacheCap]"
  - "#58CCED  - キャッシュ済み: [cached]"
  - "#58CCED  - 学習済みカバレッジ: [memCoveragePct] (不良: [memBadPct], [memBadCount] セル)"
  - "#58CCED  - 主な拒否理由: [memTopCause] ([memTopCausePct])"

