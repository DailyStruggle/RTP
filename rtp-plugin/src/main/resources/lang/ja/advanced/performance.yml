# 即時提供されたテレポートが監査されるレイテンシしきい値（ミリ秒）。
# （WARN を記録し slowPipelineCount を加算）。0 以下で無効。
# @type: integer
# @range: [0, null]
# @unit: ms
# @default: 5000
低速パイプラインしきい値Ms: 5000

# バックプレッシャーが監査されるキュー深さ（待機中のプレイヤー数）。
# （WARN を記録し queueGrowthWarnCount を加算）。0 以下で無効。
# @type: integer
# @range: [0, null]
# @unit: players
# @default: 0
キュー増加警告しきい値: 0

# 同期ロード
# 位置選択時に同期チャンクロードを使用します。
# 影響: 高 — 推奨しません！深刻なサーバーラグを引き起こす可能性があります。
# @type: boolean
# @default: false
同期ロード: false

# 起動時パーミッション解析
# onEventParsing: ワイルドカード権限 *.* と互換性がありません。
# 影響: 中 (onEvent) / 低 (effect)
# @type: boolean
# @default: false
イベント時解析: false

# 起動時にエフェクトの権限ノードを解析します。
# @type: boolean
# @default: true
エフェクト解析: true

# 観察モードキャッシュ補充 (Region Data Visitor)
# プリジェネレーション済みキャッシュが満杯の場合、同じ `period` 周期で
# 各リージョンに観察モードの RegionCacheTask をスケジュールします。
# 通常のキャッシュ補充と同じ LocationGenerator パイプラインを再利用しますが、
# 安全候補をキューに入れずに破棄するため、副作用（不良位置の記録、観測済み
# バイオームの収集など）はバックグラウンドで蓄積される一方、キューが上限を
# 超えることはありません。
# ワールド生成は決して引き起こしません: ディスクに書き込まれていないチャンクは
# の Anvil プリフィルタにより UNKNOWN としてスキップされます。
# visitorEnabled: メインスイッチ (true で観察モードを有効化)。
# 頻度は上の `period` 設定に従います。専用のレートパラメータはありません。
# 影響: 低 — 既存の `period` で律速されており、デフォルト補充モードでキャッシュに
# 余裕があるときにのみ追加作業が行われます。
# @type: boolean
# @default: false
ビジター有効: true

# /rtp admin prefab の設定。apply -> confirm の流れで変更した各ファイルに
# 予備バックアップを書き込みます。bakRetention は保持数を制限します（古いものから削除）。
プリセット:
  # Number of timestamped config backups kept per file before pruning.
  # @type: integer
  # @range: [1, null]
  # @default: 3
  bakRetention: 3
# バージョン番号は変更しないでください
version: 1.0
