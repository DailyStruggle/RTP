# 最低 TPS 要件
# 新しい位置をキャッシュに追加する前に必要な最低サーバー TPS。
# 範囲: 0.0 - 20.0。
# 影響: 低 — サーバーが既にラグっているときにプラグインが負荷を増やすのを防ぎます。
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
最低TPS: 19.0

# バックグラウンドのキャッシュ補充を一時停止する JVM ヒープ使用率の上限（最大の%）。
# キャッシュ済みの場所は引き続き提供されます。0 または 100 で無効。
# @type: number
# @range: [0.0, 100.0]
# @default: 85.0
maxHeapパーセント: 85.0

# --- RTP パフォーマンス設定 ---
# サーバーパフォーマンスに合わせてプラグインの挙動を細かく調整します。
# 最大検索試行回数
# 1 回のリクエストで安全な位置を探す最大試行回数。これを超えると諦めます。
# 影響: 高 — 大きな値はリクエストごとの CPU 使用を大きく増やします。
# @type: integer
# @range: [1, null]
# @default: 32
最大試行回数: 10

# 選択頻度（tick）
# 各リージョンの位置キャッシュをバックグラウンドで補充する間隔。
# ( 20 tick = 1 秒 )。
# 影響: 中 — 値が小さいほど補充は速くなりますが、CPU を多く消費します。
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
周期: 20

# タスクごとの割当時間（ミリ秒）
# 1 tick の中で RTP タスクに使う最大時間（ミリ秒）。
# 範囲: 0 - 50。
# 影響: 中 — 大きいほど処理は速くなりますが、tick を圧迫する可能性があります。
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
割当時間_同期: 50

# 1 ティックあたりに非同期タスクへ費やす最大ミリ秒数。
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
割当時間_非同期: 50

# 目的地のプリロード（チャンク）
# 目的地周辺で事前にロードするチャンクの半径。
# ロードされるチャンク数 = ( 1 + 2 * 半径 )^2。
# 影響: 高 — 大きすぎるとテレポート時に TPS 低下を引き起こすことがあります。
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
視距離_選択: 0

# テレポート直前に最終地点の周囲で読み込むチャンク半径。
# 0 は目的地のチャンクのみを読み込みます。
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
視距離_テレポート: 0

# テレポート後にプレイヤーの視距離が通常に戻るまでのティック数。チャンク読み込みの
# 急増を緩和します。0 でクランプを無効化します。
# @type: integer
# @range: [0, null]
# @unit: ticks
# @default: 200
視距離_復元間隔: 200

# テレポート後キューイング
# true の場合、RTP の直後にプラグインが位置キャッシュの補充を試みます。
# 影響: 中
# @type: boolean
# @default: false
テレポート後キューイング: false

# 既に読み込まれているチャンクのバイオームを空間メモリに登録し、バイオームの
# 再利用 / 重み付けに反映します。追加のチャンク I/O はありません。
# @type: boolean
# @default: true
チャンクロード時チェック: true

# L3 バックログ容量のうち補充を再開する割合（ヒステリシス）。
# 0.5=50% まで減ってから補充、1.0=継続的に補充。
# @type: number
# @range: [0.0, 1.0]
# @default: 0.5
バックログ補充しきい値: 0.5

# 試行ごとに未生成チャンクを拒否する確率。
# 0.0=偏りなし、1.0=未生成の土地を回避。生成済みチャンクは常に通過します。
# @type: number
# @range: [0.0, 1.0]
# @default: 0.0
事前生成優先度: 0.0

# 参加時のテレポート用に場所のキャッシュを確保します
# （rtp.onevent.firstjoin / rtp.onevent.join）。
# @type: boolean
# @default: false
ログインキャッシュ有効: false

# 参加キャッシュの上限。0 = 自動 (起動時のサーバー max-players)。
# @type: integer
# @range: [0, null]
# @default: 0
ログインキャッシュ上限: 0

# バイオーム選択キャッシュ
# biomeRecall: バイオームごとに過去に見つけた位置を再利用します。
# biomeRecallForced: キャッシュ済みのバイオームのみを使用します。
# 影響: 低〜中
# @type: boolean
# @default: true
バイオーム記憶: true

# バイオームでフィルタした要求をキャッシュからのみ提供します（新しいバイオーム
# 検索は生成しません）。biomeRecall が必要です。
# @type: boolean
# @default: false
バイオーム記憶_強制: false

# 要求された各バイオームを、領域に占める割合ではなく等確率で誘導します。
# biomeRecall が必要です。フィルタなしのテレポートには影響しません。
# @type: boolean
# @default: false
バイオーム重み付け: false

# バイオームでフィルタしたテレポートの、バイオームごとの相対重み。biomeWeighted が
# true のときのみ使用。未掲載のバイオームは 1.0（偏りなし）、2.0=約2倍選ばれ、
# 0.0=抑制。バニラの全バイオームが編集可能な参考として 1.0 で事前掲載済み。
# Mod のバイオームはプラットフォーム ID で追加（例: terralith:emerald_peaks）。
# biomeRecall が必要です。
# @type: map<string, number>
バイオーム重み:
  # このバイオームの相対的な選択ウェイト（1.0 = 偏りなし）。
  # @type: number
  # @range: [0.0, null]
  # @default: 1.0
  plains: 1.0
  sunflower_plains: 1.0
  snowy_plains: 1.0
  ice_spikes: 1.0
  desert: 1.0
  swamp: 1.0
  mangrove_swamp: 1.0
  forest: 1.0
  flower_forest: 1.0
  birch_forest: 1.0
  dark_forest: 1.0
  old_growth_birch_forest: 1.0
  old_growth_pine_taiga: 1.0
  old_growth_spruce_taiga: 1.0
  taiga: 1.0
  snowy_taiga: 1.0
  savanna: 1.0
  savanna_plateau: 1.0
  windswept_hills: 1.0
  windswept_gravelly_hills: 1.0
  windswept_forest: 1.0
  windswept_savanna: 1.0
  jungle: 1.0
  sparse_jungle: 1.0
  bamboo_jungle: 1.0
  badlands: 1.0
  eroded_badlands: 1.0
  wooded_badlands: 1.0
  meadow: 1.0
  cherry_grove: 1.0
  pale_garden: 1.0
  grove: 1.0
  snowy_slopes: 1.0
  frozen_peaks: 1.0
  jagged_peaks: 1.0
  stony_peaks: 1.0
  river: 1.0
  frozen_river: 1.0
  beach: 1.0
  snowy_beach: 1.0
  stony_shore: 1.0
  warm_ocean: 1.0
  lukewarm_ocean: 1.0
  deep_lukewarm_ocean: 1.0
  ocean: 1.0
  deep_ocean: 1.0
  cold_ocean: 1.0
  deep_cold_ocean: 1.0
  frozen_ocean: 1.0
  deep_frozen_ocean: 1.0
  mushroom_fields: 1.0
  dripstone_caves: 1.0
  lush_caves: 1.0
  deep_dark: 1.0
  # --- ネザー ---
  nether_wastes: 1.0
  warped_forest: 1.0
  crimson_forest: 1.0
  soul_sand_valley: 1.0
  basalt_deltas: 1.0
  # --- ジ・エンド ---
  the_end: 1.0
