# --- RTP のメッセージ (この言語) ---
# この言語でのプレイヤーおよび運営者向けメッセージ文。テーマごとに分類されています。
# 英語版メッセージから自動生成された複製です。手動で編集しないでください (上書きされます)。

# ###############################################################################
# セクション 2: テレポート
# ###############################################################################
既にテレポート中: "&7[P0] ⚡ あなたは既にテレポート中です！"

# プラグインが現在リロード中のとき
テレポート拒否_リロード中: "&7[P0] プラグインがリロード中のため、テレポートは一時的に無効です。後ほど再試行してください。"
遅延メッセージ: "<gradient:#9D7CD8:#5FB3B3>[P0] ⚡ [delay] 後にテレポートします。動かないでください</gradient>"
チャンクロード中: "&7[P0] ⚙ チャンクを読み込み中です。お待ちください.."
テレポートメッセージ: "<gradient:#5FB3B3:#9D7CD8>[P0] ⚡ [attempts] 回の試行でテレポートしました ([processingTime])</gradient>"

# if teleport is cancelled
テレポート取消: "&7[P0] ⚡ テレポートをキャンセルしました！"

# 最大試行回数に達しても安全な場所が見つからなかったとき
# プレースホルダー: [attempts] - 最大試行回数
危険: "&7[P0] ⌖ [attempts] 回試行しても安全な位置を見つけられませんでした"

# プレイヤーがクールダウン中のとき
# プレースホルダー: [remainingCooldown] - 残り時間
クールダウンメッセージ: "&7[P0] ⚡ 再びテレポートするには [remainingCooldown] 待つ必要があります"

# when the player has reached the lockAfterUses cap and is locked out (BetterRTP LockAfter parity)
lockedAfterUses: "&7[P0] ⌖ ランダムテレポートの上限に達しました。[remainingLockTime] 後にもう一度お試しください。"

# リージョンに位置のキューがなく、プレイヤーが rtp.unqueued 権限を持っていないとき
利用可能な位置なし: "#f5eb73[P0] ⌖ 現在利用可能な位置がありません"

# 待機列が動いたとき
# プレースホルダー: [spot] - 現在の待機位置
キュー更新: "#2636ef[P0] キュー内のあなたの順番: [spot]"

# プレイヤーがそのリージョンでテレポートするのに十分なお金がないとき
# プレースホルダー: [money] - コマンドに必要な金額
残高不足: "&7[P0] この操作には少なくとも $[money] が必要です。"

# ###############################################################################
# セクション 3: 時間表記
# ###############################################################################
日: "日"
時: "時間"
分: "分"
秒: "秒"
ミリ秒: "ミリ秒"

# bukkit にそのワールドが存在しません
# プレースホルダー: [world] - ワールド名
無効なワールド: "&7[P0] ワールド '[world]' は見つかりません"

# プラグインに該当するコマンドがありません
# プレースホルダー: [arg] - 試行された引数
無効な引数: "&c[P0] コマンド引数が無効です [arg]"

# プレイヤー専用のコマンドをコンソールが実行しようとしたとき
コンソール不可: "&c[P0] このコマンドはゲーム内プレイヤーとして実行する必要があります。"

# busy と invalidCommand は messages.lang.yml で翻訳されていない -> 英語キー名 (英語ベースラインへフォールバック)。
busy: "&c[P0] 取り込み中"

# Sent when the optional PvP combat check refuses /rtp because the player is in combat
pvpInCombat: "&c[P0] 戦闘中はランダムテレポートできません。"

# plugin doesn't have the subcommand or parameter the user requested
# placeholder: [arg] - the argument attempted
invalidCommand: "&c[P0] 無効なコマンド - [arg]"

# ユーザーに要求されたコマンドの権限がありません
権限なし: "&7申し訳ありません。このコマンドを実行する権限がありません。これが誤りだと思う場合はサーバー管理者に連絡してください。"

# ###############################################################################
# セクション 8: コマンド説明
# ###############################################################################
rtp: "&b/rtp - ランダムな場所にテレポートする"
rtp_説明: "ランダムな場所にテレポートする"
ヘルプ: "&b/rtp help - このヘルプを表示する"
ヘルプ_説明: "コマンド説明"
リロード: "&b/rtp reload - 設定ファイルをリロードする"
リロード_説明: "設定ファイルをリロードする"
スキャン: "&b/rtp scan - リージョン内のすべての可能な位置をスキャンしてロード速度を向上させる"
スキャン_説明: "保存済みデータをクリアし、リージョン内のすべての可能な位置をスキャンする"
設定_説明: "実行時に設定ファイルを更新する"
情報_説明: "プラグインの現在の状態を表示する"
テスト_説明: "RTP 機能をテストする"

# ###############################################################################
# セクション 9: PlaceholderAPI サポート
# ###############################################################################
プレイヤー_利用可能: "&a利用可能"
プレイヤー_クールダウン: "&7待機中"
プレイヤー_準備: "&b位置選択中"
プレイヤー_ロード中: "&bチャンクロード中"
プレイヤー_テレポート中: "&bテレポート中"

# ###############################################################################
# セクション 10: ビジュアル要素
# ###############################################################################
タイトル: "<rainbow>テレポートしました！</rainbow>"
サブタイトル: "<gradient:#A78BFA:#E876A0>楽しんでね！</gradient>"
フェードイン: 20
表示時間: 20
フェードアウト: 20

# actionbar setting
アクションバー: ""
