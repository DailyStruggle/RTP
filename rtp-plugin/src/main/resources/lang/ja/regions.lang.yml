# --- 言語マッピング: regions/*.yml ---
# 内部リージョンキー名（左側）を `regions/` 配下のすべてのファイルで操作者に見える
# キー名（右側）に対応付けます。
# 名前を改名・翻訳する場合は右側のみを編集してください。
# 左側はコード定数なので変更しないでください。
# このファイルが存在しない場合、プラグインは左右が同一の英語版を再生成します。

world: ワールド
worldBorderOverride: ワールドボーダー上書き
shape: 形状
vert: 垂直
requirePermission: 権限要求
cacheCap: キャッシュ上限
activeChunkCap: アクティブチャンク上限
price: 価格
spatialResolution: 空間解像度
override: 上書き
version: version
