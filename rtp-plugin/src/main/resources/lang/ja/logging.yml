# --- プラグインログ切り替え ---
# プラグインの各種アクティビティのログを有効/無効にします。
# 詳細システムログ
# detailed_reload: リロードされたすべてのファイル/セクションをログ
# detailed_region_init: 各リージョンの初期化をログ
詳細_リロード: false
詳細_リージョン初期化: false

# 基本アクティビティログ
# command: プレイヤーが実行した RTP コマンドをログ
# teleport: 実際のテレポートイベントをログ
コマンド: false
テレポート: true

# イベント駆動の自動 RTP のログ
イベント_ワールド変更: "true # プレイヤーがワールドを切り替えたとき"
イベント_参加: "true        # プレイヤーがサーバーに参加したとき"
イベント_リスポーン: "true   # プレイヤーがリスポーンしたとき"
イベント_移動: "true        # プレイヤーが移動したとき (移動駆動 RTP が有効な場合)"
イベント_テレポート: "true   # プレイヤーがテレポートしたとき (テレポート駆動 RTP が有効な場合)"

# 選択失敗デバッグ
# 安全な位置を見つけられなかったときの詳細をログに残します。失敗率や検索パラメータを含みます。
選択失敗: true

# システムログ
# バックグラウンドタスクとデータベース操作に関連します。
システム_メモリトラッカ: false
システム_データベース: false

# プラグインレベルの最小ログレベル。実際のフィルタはこの値と Bukkit logger のうち
# より厳しい方が適用されます。
# 値: SEVERE, WARNING, INFO, CONFIG, FINE, FINER, FINEST, ALL, OFF。
# デフォルトは ALL で、Bukkit logger と同じ動作になります。
最低レベル: "INFO"

# バージョン番号は変更しないでください
version: 1.0
