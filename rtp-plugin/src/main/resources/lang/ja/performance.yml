# --- RTP パフォーマンス設定 ---
# サーバーパフォーマンスに合わせてプラグインの挙動を細かく調整します。

# 最大検索試行回数
# 1 回のリクエストで安全な位置を探す最大試行回数。これを超えると諦めます。
# 影響: 高 — 大きな値はリクエストごとの CPU 使用を大きく増やします。
最大試行回数: 10

# 目的地のプリロード（チャンク）
# 目的地周辺で事前にロードするチャンクの半径。
# ロードされるチャンク数 = ( 1 + 2 * 半径 )^2。
# 影響: 高 — 大きすぎるとテレポート時に TPS 低下を引き起こすことがあります。
視距離_選択: 0
視距離_テレポート: 0

# 選択頻度（tick）
# 各リージョンの位置キャッシュをバックグラウンドで補充する間隔。
# ( 20 tick = 1 秒 )。
# 影響: 中 — 値が小さいほど補充は速くなりますが、CPU を多く消費します。
周期: 20

# タスクごとの割当時間（ミリ秒）
# 1 tick の中で RTP タスクに使う最大時間（ミリ秒）。
# 範囲: 0 - 50。
# 影響: 中 — 大きいほど処理は速くなりますが、tick を圧迫する可能性があります。
割当時間_同期: 50
割当時間_非同期: 50

# 最低 TPS 要件
# 新しい位置をキャッシュに追加する前に必要な最低サーバー TPS。
# 範囲: 0.0 - 20.0。
# 影響: 低 — サーバーが既にラグっているときにプラグインが負荷を増やすのを防ぎます。
最低TPS: 19.0

# テレポート後キューイング
# true の場合、RTP の直後にプラグインが位置キャッシュの補充を試みます。
# 影響: 中
テレポート後キューイング: false

# 同期ロード
# 位置選択時に同期チャンクロードを使用します。
# 影響: 高 — 推奨しません！深刻なサーバーラグを引き起こす可能性があります。
同期ロード: false

# 起動時パーミッション解析
# onEventParsing: ワイルドカード権限 *.* と互換性がありません。
# 影響: 中 (onEvent) / 低 (effect)
イベント時解析: false
エフェクト解析: true

# バイオーム選択キャッシュ
# biomeRecall: バイオームごとに過去に見つけた位置を再利用します。
# biomeRecallForced: キャッシュ済みのバイオームのみを使用します。
# 影響: 低〜中
バイオーム記憶: true
バイオーム記憶_強制: false

# チャンクロード時のパッシブチェック
# リージョン範囲内でロードされたすべてのチャンクから安全な位置を探します。
# 影響: 高 — チャンクロードイベントでサーバー負荷を大きく増やす可能性があります。
チャンクロード時チェック: false

# 観察モードキャッシュ補充 (Region Data Visitor)
# プリジェネレーション済みキャッシュが満杯の場合、同じ `period` 周期で
# 各リージョンに観察モードの RegionCacheTask をスケジュールします。
# 通常のキャッシュ補充と同じ LocationGenerator パイプラインを再利用しますが、
# 安全候補をキューに入れずに破棄するため、副作用（不良位置の記録、観測済み
# バイオームの収集など）はバックグラウンドで蓄積される一方、キューが上限を
# 超えることはありません。
# ワールド生成は決して引き起こしません: ディスクに書き込まれていないチャンクは
# ADR-016 の Anvil プリフィルタにより UNKNOWN としてスキップされます。
# visitorEnabled: メインスイッチ (true で観察モードを有効化)。
# 頻度は上の `period` 設定に従います。専用のレートパラメータはありません。
# 影響: 低 — 既存の `period` で律速されており、デフォルト補充モードでキャッシュに
# 余裕があるときにのみ追加作業が行われます。
visitorEnabled: true

# バージョン番号は変更しないでください
pregeneratedPreference: 0.0 # Probability [0.0, 1.0] of rejecting an ungenerated chunk per selection attempt. 0.0 = no bias (default), 1.0 = strictly avoid ungenerated land. Generated chunks always pass.
backlogRefillThreshold: 0.5 # Fraction [0.0, 1.0] of L3 backlog capacity at which refill resumes (hysteresis). 0.5 = refill only after L3 drains to 50% (default). 1.0 = refill continuously.
version: "1.0"
