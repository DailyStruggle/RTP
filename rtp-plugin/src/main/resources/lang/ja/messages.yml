# --- RTP メッセージ（日本語） ---
# プレイヤーとコンソールに表示されるメッセージの日本語翻訳。
# 重要事項:
# - このファイルのキー名は lang/ja/messages.lang.yml の右列 (内部キー名の
# 日本語訳) と一致させてください。messages.lang.yml に無いキーは英語
# ベースライン (lang/messages.lang.yml) の英語キー名にフォールバックします。
# - 角括弧プレースホルダはそのまま残してください: [P0], [delay], [attempts],
# [world], [region], [remainingCooldown], [scan_chunks] など。
# - カラーコード &a &e &c と HEX カラー (#2636ef) はそのまま残してください。
# ###############################################################################
# セクション 1: 一般設定
# ###############################################################################
プレースホルダ:
  # P0
  - "[RTP]"

# ###############################################################################
# セクション 2: テレポート
# ###############################################################################
既にテレポート中: "&e[P0] あなたは既にテレポート中です！"

# プラグインが現在リロード中のとき
テレポート拒否_リロード中: "&e[P0] プラグインがリロード中のため、テレポートは一時的に無効です。後ほど再試行してください。"
遅延メッセージ: "&e[P0] [delay] 後にテレポートします。動かないでください。"
チャンクロード中: "&e[P0] チャンクをロード中です。お待ちください……"
テレポートメッセージ: "&e[P0] [attempts] 回の試行でテレポートしました ([processingTime])"

# if teleport is cancelled
テレポート取消: "&e[P0] テレポートをキャンセルしました！"

# 最大試行回数に達しても安全な場所が見つからなかったとき
# プレースホルダー: [attempts] - 最大試行回数
危険: "&e[P0] [attempts] 回試行しても安全な位置を見つけられませんでした"

# プレイヤーがクールダウン中のとき
# プレースホルダー: [remainingCooldown] - 残り時間
クールダウンメッセージ: "&e[P0] 再びテレポートするには [remainingCooldown] 待つ必要があります"

# リージョンに位置のキューがなく、プレイヤーが rtp.unqueued 権限を持っていないとき
利用可能な位置なし: "#f5eb73[P0] 現在利用可能な位置がありません"

# 待機列が動いたとき
# プレースホルダー: [spot] - 現在の待機位置
キュー更新: "#2636ef[P0] キュー内のあなたの順番: [spot]"

# プレイヤーがそのリージョンでテレポートするのに十分なお金がないとき
# プレースホルダー: [money] - コマンドに必要な金額
残高不足: "&e[P0] この操作には少なくとも $[money] が必要です。"

# ###############################################################################
# セクション 3: 時間表記
# ###############################################################################
日: "日"
時: "時間"
分: "分"
秒: "秒"
ミリ秒: "ミリ秒"

# ###############################################################################
# セクション 4: システム / 管理
# ###############################################################################
旧ファイル: "&b[P0] 古い [filename] を検出しました。更新中"

# 設定ファイルにない bukkit ワールドを検出しました
# プレースホルダー: [world] - 検出されたワールド
新ワールド: "&b[P0] 新ワールド '[world]' を検出しました"

# bukkit にそのワールドが存在しません
# プレースホルダー: [world] - ワールド名
無効なワールド: "&e[P0] ワールド '[world]' は見つかりません"

# プラグインのリロード / 更新メッセージ
# プレースホルダー: [filename] - ファイル名
リロード中: "&b[P0] [filename] をロード中……"
リロード完了: "&b[P0] [filename] のロードが完了しました。"
更新中: "&a[P0] [filename] を更新中……"
更新済み: "&a[P0] [filename] を正常に更新しました。"

# プラグインに該当するコマンドがありません
# プレースホルダー: [arg] - 試行された引数
無効な引数: "&c[P0] コマンド引数が無効です [arg]"

# プレイヤー専用のコマンドをコンソールが実行しようとしたとき
コンソール不可: "&c[P0] このコマンドはゲーム内プレイヤーとして実行する必要があります。"

# busy と invalidCommand は messages.lang.yml で翻訳されていない -> 英語キー名 (英語ベースラインへフォールバック)。
busy: "&c[P0] 取り込み中"

# plugin doesn't have the subcommand or parameter the user requested
# placeholder: [arg] - the argument attempted
invalidCommand: "&c[P0] 無効なコマンド - [arg]"

# ユーザーに要求されたコマンドの権限がありません
権限なし: "&e申し訳ありません。このコマンドを実行する権限がありません。これが誤りだと思う場合はサーバー管理者に連絡してください。"

# ###############################################################################
# セクション 5: 管理ログ
# ###############################################################################
位置保存: "&e[P0] [region] の位置を [amount] 件保存しました"
位置ロード: "&e[P0] [region] の位置を [amount] 件ロードしました"

# ###############################################################################
# セクション 6: スキャンコマンド
# ###############################################################################
スキャン開始: "&a[P0] 以下のリージョンでスキャンタスクを開始しました: [scan_regions]"
スキャンリセット: "&e[P0] 以下のリージョンのスキャンキューをリセットしました: [scan_regions]"
スキャン取消: "&e[P0] 以下のリージョンのスキャンタスクを取り消しました: [scan_regions]"
スキャン一時停止: "#A020F0[P0] 以下のリージョンのスキャンタスクを一時停止しました: [scan_regions]"
スキャン再開: "#10A5F5[P0] 以下のリージョンのスキャンタスクを再開しました: [scan_regions]"
スキャン実行中: "&c[P0] 以下のリージョンでは既にスキャンタスクが実行中です: [scan_regions]"
スキャン未実行: "&c[P0] 以下のリージョンには現在スキャンタスクがありません: [scan_regions]"
# placeholder: [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
スキャン状況: "&a[P0] [scan_chunks] / [scan_totalChunks] チャンク完了 (リージョン: [scan_regions])。[scan_cps] cps。陸地比率: [scan_landPercentage]%。残り時間: [scan_eta]"

# ###############################################################################
# セクション 7: 情報コマンド
# ###############################################################################
情報タイトル: "&a======RTP 情報======"
情報_チケット: "&7グローバルアクティブチャンクチケット: &f[tickets]"
情報_テレポート: "&7アクティブテレポートステートマシン: &f[teleports]"
情報_MSPT: "&7プラグイン現在の MSPT: &f[mspt]"
情報_総ロード数: "&7累計ロードチャンク数: &f[loads]"
infoLoadsByOrigin: "&7Loads by Origin: &f[loadsByOrigin]"
情報_リーク率: "&7現在のチャンクリーク率: &f[leakRate]"
# --- Metrics SPI health block (METRICS_PLAN.md > /rtp info Surface) ---
infoQueueDepth: "&7Players Waiting In Region Queues: &f[queueDepth]"
infoPendingTeleports: "&7Pending Teleport Pipelines: &f[pendingTeleports]"
infoAvgPipelineMs: "&7Avg Pipeline Latency: &f[avgPipelineMs] ms"
infoHeap: "&7JVM Heap: &f[heapUsedMb] / [heapMaxMb] MiB"
# /rtp info の Health pipeline ラベルブロックのヘッダー行。
infoHealthPipelineHeader: "&7--- Health: pipeline ---"
# 1m / 5m / 15m ウィンドウの TPS 表示。プレースホルダー: [tps1m] [tps5m] [tps15m]。
infoTps: "&7TPS (1m/5m/15m): &f[tps1m] / [tps5m] / [tps15m]"
# サーバーのリアルタイム MSPT と tick バジェット使用率。プレースホルダー: [mspt] [tickBudgetUtilisation]。
infoMSPTLive: "&7Server MSPT: &f[mspt] ms (&7tick budget: &f[tickBudgetUtilisation]&7)"
# Configured player soft-cap vs current online count. Placeholders: [softCap] [playerCount].
infoSoftCap: "&7Players: &f[playerCount] / [softCap]"
# データベースの最新ラウンドトリップレイテンシ（ms）。プレースホルダー: [databaseLatencyMs]。
infoDatabaseLatencyMs: "&7Database Latency: &f[databaseLatencyMs] ms"
# Health colour-band thresholds. Doubles consumed by ColourBands in rtp-core
# to wrap coloured-variant placeholders (e.g. [tps1mColoured]) with &a/&e/&c.
infoThresholdTpsGreen: 19.5
infoThresholdTpsYellow: 18.0
infoThresholdMsptGreen: 30.0
infoThresholdMsptYellow: 45.0
infoThresholdCacheFillGreen: 0.5
infoThresholdCacheFillYellow: 0.25
infoThresholdNetworkAgeYellow: 5.0
# Header line introducing the per-Folia-region table (Folia runtime only).
infoFoliaRegionsHeader: "&7--- Folia regions ---"
# Per-row template for a single Folia region. Placeholders: [regionId] [tps1m]
# [mspt] [playerCount] [queueDepth] [tickBudgetUtilisation].
infoFoliaRegion: "  &f[regionId]&7: tps=&f[tps1m]&7 mspt=&f[mspt]&7 players=&f[playerCount]&7 queue=&f[queueDepth]&7 budget=&f[tickBudgetUtilisation]"
情報_免責_ヘッダ: "&7--- 診断ノート ---"
情報_免責: "&7診断ノート: サーバーの孤立チャンク総数が本プラグインの累計ロード数 ([loads]) を超える場合、本プラグインがメモリリークの唯一の原因ではありません。"
情報_ワールドヘッダ: "#008080ワールド:"
情報_コンソール_ワールドヘッダ: "&7--- ワールド ---"
情報ワールド: "  #21ADA8[world]"
情報_リージョンヘッダ: "#63C5DAリージョン:"
情報_コンソール_リージョンヘッダ: "&7--- リージョン ---"
情報リージョン: "  #52B2BF[region]"

# sub-info listings
# placeholders: [world], [region], [requirePermission], [override], [shape], [worldBorderOverride], [cacheCap], [cached], [keptCache], [unkeptCache], [backlogCache], [backlogCacheCap]
ワールド情報:
  - "#21ADA8[world]:"
  - "#99EEBB  - リージョン: [region]"
  - "#99EEBB  - 権限要求: [requirePermission]"
  - "#99EEBB  - 上書き: [override]"

リージョン情報:
  - "#52B2BF[region]:"
  - "#58CCED  - ワールド: [world]"
  - "#58CCED  - 形状: [shape]"
  - "#58CCED  - 権限要求: [requirePermission]"
  - "#58CCED  - ワールドボーダー上書き: [worldBorderOverride]"
  - "#58CCED  - キャッシュ上限: [cacheCap]"
  - "#58CCED  - 保持キャッシュ (L1): [keptCache]"
  - "#58CCED  - 解放キャッシュ (L2): [unkeptCache]"
  - "#58CCED  - バックログキャッシュ (L3): [backlogCache] / [backlogCacheCap]"
  - "#58CCED  - キャッシュ済み: [cached]"

