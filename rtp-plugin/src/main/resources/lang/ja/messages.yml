# --- RTP メッセージ（日本語） ---
# プレイヤーとコンソールに表示されるメッセージの日本語翻訳。
# 重要事項:
# - このファイルのキー名は lang/ja/messages.lang.yml の右列 (内部キー名の
# 日本語訳) と一致させてください。messages.lang.yml に無いキーは英語
# ベースライン (lang/messages.lang.yml) の英語キー名にフォールバックします。
# - 角括弧プレースホルダはそのまま残してください: [P0], [delay], [attempts],
# [world], [region], [remainingCooldown], [scan_chunks] など。
# - カラーコード &a &7 &c と HEX カラー (#2636ef) はそのまま残してください。
# ###############################################################################
# セクション 0: プレースホルダー
# ###############################################################################
プレースホルダ:
  # P0
  - "[RTP]"

# ###############################################################################
# セクション 1: テレポート
# ###############################################################################
既にテレポート中: "&7[P0] ⚡ あなたは既にテレポート中です！"

# プラグインが現在リロード中のとき
テレポート拒否_リロード中: "&7[P0] プラグインがリロード中のため、テレポートは一時的に無効です。後ほど再試行してください。"
遅延メッセージ: "<gradient:#9D7CD8:#5FB3B3>[P0] ⚡ [delay] 後にテレポートします。動かないでください</gradient>"
チャンクロード中: "&7[P0] ⚙ チャンクを読み込み中です。お待ちください.."
テレポートメッセージ: "<gradient:#5FB3B3:#9D7CD8>[P0] ⚡ [attempts] 回の試行でテレポートしました ([processingTime])</gradient>"

# if teleport is cancelled
テレポート取消: "&7[P0] ⚡ テレポートをキャンセルしました！"

# Sent when the optional PvP combat check refuses /rtp because the player is in combat
pvpInCombat: "&c[P0] 戦闘中はランダムテレポートできません。"

# 最大試行回数に達しても安全な場所が見つからなかったとき
# プレースホルダー: [attempts] - 最大試行回数
危険: "&7[P0] ⌖ [attempts] 回試行しても安全な位置を見つけられませんでした"

# プレイヤーがクールダウン中のとき
# プレースホルダー: [remainingCooldown] - 残り時間
クールダウンメッセージ: "&7[P0] ⚡ 再びテレポートするには [remainingCooldown] 待つ必要があります"

# when the player has reached the lockAfterUses cap and is locked out (BetterRTP LockAfter parity)
lockedAfterUses: "&7[P0] ⌖ ランダムテレポートの上限に達しました。[remainingLockTime] 後にもう一度お試しください。"

# リージョンに位置のキューがなく、プレイヤーが rtp.unqueued 権限を持っていないとき
利用可能な位置なし: "#f5eb73[P0] ⌖ 現在利用可能な位置がありません"

# 待機列が動いたとき
# プレースホルダー: [spot] - 現在の待機位置
キュー更新: "#2636ef[P0] キュー内のあなたの順番: [spot]"

# プレイヤーがそのリージョンでテレポートするのに十分なお金がないとき
# プレースホルダー: [money] - コマンドに必要な金額
残高不足: "&7[P0] この操作には少なくとも $[money] が必要です。"

# ###############################################################################
# セクション 2: コマンドフィードバック
# ###############################################################################
# bukkit にそのワールドが存在しません
# プレースホルダー: [world] - ワールド名
無効なワールド: "&7[P0] ワールド '[world]' は見つかりません"

# プラグインに該当するコマンドがありません
# プレースホルダー: [arg] - 試行された引数
無効な引数: "&c[P0] コマンド引数が無効です [arg]"

# plugin doesn't have the subcommand or parameter the user requested
# placeholder: [arg] - the argument attempted
invalidCommand: "&c[P0] 無効なコマンド - [arg]"

# ユーザーに要求されたコマンドの権限がありません
権限なし: "&7申し訳ありません。このコマンドを実行する権限がありません。これが誤りだと思う場合はサーバー管理者に連絡してください。"

# busy と invalidCommand は messages.lang.yml で翻訳されていない -> 英語キー名 (英語ベースラインへフォールバック)。
busy: "&c[P0] 取り込み中"

# プレイヤー専用のコマンドをコンソールが実行しようとしたとき
コンソール不可: "&c[P0] このコマンドはゲーム内プレイヤーとして実行する必要があります。"

# ###############################################################################
# セクション 3: サーバー間テレポート（ネットワークモード）
# ###############################################################################
# Sent only when `network.enabled: true` and the player's `/rtp` is routed
# across the cross-server wait queue (see network.yml `routing.mode`).
# All keys are optional from the player's perspective - the L2 baseline
# `delayMessage` / `teleportMessage` cycle still drives the visible flow.
# Sent when the request has been accepted into the cross-server wait queue
# and is awaiting a backend claim. Placeholder: [position] - 0-indexed
# position from `pollStatus`; may be empty if the transport returns no
# position.
networkQueued: "&7[P0] サーバー間の目的地を待機中です (順番 [position])..."
# Sent when a player runs /rtp* while they already hold a non-terminal
# cross-server enrolment (command-lock). Placeholder:
# [position] - FIFO position when known; empty when the proxy has not yet
# assigned one.
alreadyQueued: "&cすでにサーバー間キューで待機中です (順番 [position])。お待ちください。"
# Sent when a cross-server waitlist entry is reaped after exceeding its
# configured TTL. No placeholders.
networkTimedOut: "&c[P0] バックエンドの待機中にサーバー間テレポートがタイムアウトしました。"
# Sent when a cross-server waitlist enrolment is rejected because the shared
# waitlist has reached its configured maximum size (REJECTED_FULL).
# No placeholders.
waitlistFull: "&c[P0] サーバー間キューが満杯です。しばらくしてからもう一度お試しください。"
# Sent when the queue has handed the request off to the proxy router and
# a backend selection is in progress.
networkRouting: "&7[P0] バックエンドへルーティング中..."
# Sent when a backend has reserved a coordinate for this player and the
# proxy is about to initiate the cross-server hop. Placeholder: [server]
# - the destination backend's serverId.
networkReserved: "&a[P0] [server] に座標を予約しました。転送中..."
# Sent when the proxy is mid-hop. Placeholder: [server] - destination.
networkTransferring: "&a[P0] [server] へ転送中..."
# Sent when the cross-server path gave up and the request fell back to
# the local backend. Placeholder: [reason] - one of the
# `RoutingDecision.FallbackReason` values (e.g. NO_LIVE_PEER, QUEUE_FULL).
networkFallback: "&e[P0] サーバー間が利用できません ([reason])。ローカルに切り替えます。"
# Sent when the cross-server request failed terminally (no fallback was
# possible). Placeholder: [reason] - the `DispatchOutcome.Failed.Reason`.
networkFailed: "&c[P0] サーバー間テレポートに失敗しました: [reason]。"
# Sent when the player asked for a specific region (`/rtp <region>`) but
# no backend in the network is currently serving it. Placeholder:
# [region] - the requested region name.
networkRegionUnavailable: "&c[P0] 現在リージョン '[region]' を提供しているバックエンドはありません。"
# Sent when the requested region name resolves to two or more backends and
# the operator-configured policy cannot pick one (only fires
# under stronger policies than the default `warn`). Placeholder: [region].
networkRegionAmbiguous: "&c[P0] リージョン '[region]' は複数のバックエンドで曖昧です。サーバーを指定してください。"

