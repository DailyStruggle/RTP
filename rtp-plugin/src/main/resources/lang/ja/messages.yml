# --- RTP メッセージ（日本語） ---
# プレイヤーとコンソールに表示されるメッセージの日本語翻訳。
# 重要事項:
# - このファイルのキー名は lang/ja/messages.lang.yml の右列 (内部キー名の
# 日本語訳) と一致させてください。messages.lang.yml に無いキーは英語
# ベースライン (lang/messages.lang.yml) の英語キー名にフォールバックします。
# - 角括弧プレースホルダはそのまま残してください: [P0], [delay], [attempts],
# [world], [region], [remainingCooldown], [scan_chunks] など。
# - カラーコード &a &7 &c と HEX カラー (#2636ef) はそのまま残してください。
# ###############################################################################
# セクション 1: 一般設定
# ###############################################################################
プレースホルダ:
  # P0
  - "[RTP]"

# ###############################################################################
# セクション 2: テレポート
# ###############################################################################
既にテレポート中: "&7[P0] あなたは既にテレポート中です！"

# プラグインが現在リロード中のとき
テレポート拒否_リロード中: "&7[P0] プラグインがリロード中のため、テレポートは一時的に無効です。後ほど再試行してください。"
遅延メッセージ: "&7[P0] [delay] 後にテレポートします。動かないでください。"
チャンクロード中: "&7[P0] チャンクをロード中です。お待ちください……"
テレポートメッセージ: "&7[P0] [attempts] 回の試行でテレポートしました ([processingTime])"

# if teleport is cancelled
テレポート取消: "&7[P0] テレポートをキャンセルしました！"

# 最大試行回数に達しても安全な場所が見つからなかったとき
# プレースホルダー: [attempts] - 最大試行回数
危険: "&7[P0] [attempts] 回試行しても安全な位置を見つけられませんでした"

# プレイヤーがクールダウン中のとき
# プレースホルダー: [remainingCooldown] - 残り時間
クールダウンメッセージ: "&7[P0] 再びテレポートするには [remainingCooldown] 待つ必要があります"

# リージョンに位置のキューがなく、プレイヤーが rtp.unqueued 権限を持っていないとき
利用可能な位置なし: "#f5eb73[P0] 現在利用可能な位置がありません"

# 待機列が動いたとき
# プレースホルダー: [spot] - 現在の待機位置
キュー更新: "#2636ef[P0] キュー内のあなたの順番: [spot]"

# プレイヤーがそのリージョンでテレポートするのに十分なお金がないとき
# プレースホルダー: [money] - コマンドに必要な金額
残高不足: "&7[P0] この操作には少なくとも $[money] が必要です。"

# ###############################################################################
# セクション 3: 時間表記
# ###############################################################################
日: "日"
時: "時間"
分: "分"
秒: "秒"
ミリ秒: "ミリ秒"

# ###############################################################################
# セクション 4: システム / 管理
# ###############################################################################
旧ファイル: "&b[P0] 古い [filename] を検出しました。更新中"

# 設定ファイルにない bukkit ワールドを検出しました
# プレースホルダー: [world] - 検出されたワールド
新ワールド: "&b[P0] 新ワールド '[world]' を検出しました"

# bukkit にそのワールドが存在しません
# プレースホルダー: [world] - ワールド名
無効なワールド: "&7[P0] ワールド '[world]' は見つかりません"

# プラグインのリロード / 更新メッセージ
# プレースホルダー: [filename] - ファイル名
リロード中: "&b[P0] [filename] をロード中……"
リロード完了: "&b[P0] [filename] のロードが完了しました。"
更新中: "&a[P0] [filename] を更新中……"
更新済み: "&a[P0] [filename] を正常に更新しました。"

# プラグインに該当するコマンドがありません
# プレースホルダー: [arg] - 試行された引数
無効な引数: "&c[P0] コマンド引数が無効です [arg]"

# プレイヤー専用のコマンドをコンソールが実行しようとしたとき
コンソール不可: "&c[P0] このコマンドはゲーム内プレイヤーとして実行する必要があります。"

# busy と invalidCommand は messages.lang.yml で翻訳されていない -> 英語キー名 (英語ベースラインへフォールバック)。
busy: "&c[P0] 取り込み中"

# plugin doesn't have the subcommand or parameter the user requested
# placeholder: [arg] - the argument attempted
invalidCommand: "&c[P0] 無効なコマンド - [arg]"

# ユーザーに要求されたコマンドの権限がありません
権限なし: "&7申し訳ありません。このコマンドを実行する権限がありません。これが誤りだと思う場合はサーバー管理者に連絡してください。"

# ###############################################################################
# セクション 5: 管理ログ
# ###############################################################################
位置保存: "&7[P0] [region] の位置を [amount] 件保存しました"
位置ロード: "&7[P0] [region] の位置を [amount] 件ロードしました"

# ###############################################################################
# セクション 6: スキャンコマンド
# ###############################################################################
スキャン開始: "&a[P0] 以下のリージョンでスキャンタスクを開始しました: [scan_regions]"
スキャンリセット: "&7[P0] 以下のリージョンのスキャンキューをリセットしました: [scan_regions]"
スキャン取消: "&7[P0] 以下のリージョンのスキャンタスクを取り消しました: [scan_regions]"
スキャン一時停止: "#A020F0[P0] 以下のリージョンのスキャンタスクを一時停止しました: [scan_regions]"
スキャン再開: "#10A5F5[P0] 以下のリージョンのスキャンタスクを再開しました: [scan_regions]"
スキャン実行中: "&c[P0] 以下のリージョンでは既にスキャンタスクが実行中です: [scan_regions]"
スキャン未実行: "&c[P0] 以下のリージョンには現在スキャンタスクがありません: [scan_regions]"
# placeholder: [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
スキャン状況: "&a[P0] [scan_chunks] / [scan_totalChunks] チャンク完了 (リージョン: [scan_regions])。[scan_cps] cps。陸地比率: [scan_landPercentage]%。残り時間: [scan_eta]"

