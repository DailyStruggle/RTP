# テレポート遅延（秒）
# 実際にテレポートが発動するまでにプレイヤーが待つ時間。
# サーバーが目的地のチャンクを事前にロードする時間を確保できます。
テレポート遅延: 2

# 移動キャンセル（ブロック）
# 遅延中にプレイヤーがこの距離以上動いたらテレポートをキャンセルします。
# -1 で無効化。
キャンセル距離: 2

# テレポート間隔（秒）
# プレイヤーが連続して RTP を使うまでに待つ時間。
テレポートクールダウン: 300

# テレポート後コマンド
# テレポート成功後に実行するコマンドのリスト。
# プレースホルダ [player] はプレイヤー名を表します。
コンソールコマンド:
  - "say [player] がランダムテレポートしました！"

# Commands executed as the teleporting player on successful teleport.
# Use [player] for the target player's name. Empty string entries are ignored.
# @type: list<string>
プレイヤーコマンド:
  - ""

# --- データベース設定 ---
# キャッシュされた位置やプレイヤーデータの保存先。
データベース:
  # 利用可能な type: yaml, sqlite, mysql, postgresql
  # - yaml/sqlite: ローカルファイル（追加設定不要）
  # - mysql/postgresql: リモートデータベース（下記の認証情報が必要）
  type: "sqlite"
  # ネットワークデータベースの認証情報（ローカルでは無視されます）
  host: "127.0.0.1"
  # Database port. Used by mysql/postgresql only.
  # @type: integer
  # @range: [1, 65535]
  port: 3306
  # Database / schema name. Used by mysql/postgresql only.
  # @type: string
  name: "rtp"
  # Database username. Used by mysql/postgresql only.
  # @type: string
  username: "root"
  # Database password. Used by mysql/postgresql only.
  # @type: string
  password: "password"

# --- ネットワーク同期 ---
# Redis は複数サーバー間でキャッシュされた位置を同期するために使われます。
ネットワーク:
  redis:
    # Enable Redis-backed network state binding.
    # @type: boolean
    # @default: false
    enabled: false
    # Redis host.
    # @type: string
    host: "127.0.0.1"
    # Redis port.
    # @type: integer
    # @range: [1, 65535]
    port: 6379
    # Redis password. Empty string disables auth.
    # @type: string
    password: ""

# Generalized menu framework (ADR-035 / ADR-044).
# `renderer` is an ordered preference list of renderer ids. On exception or
# missing adapter the framework walks the list and falls back to the next
# entry. If the list is exhausted the no-token open-page path falls back to
# the configurable `menuInvalid` message. Available ids: book. (The chat
# renderer ships in a follow-up and will be added to the default list at
# that point.)
menu:
  # Ordered preference list of renderer ids.
  # @type: list<enum>
  # @options: ["book", "chat"]
  renderer:
    - "book"

# バージョン番号は変更しないでください
version: 3.0
