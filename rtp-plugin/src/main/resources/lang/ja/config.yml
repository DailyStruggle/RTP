# --- RTP メイン設定 ---

# プレイヤーに表示されるメッセージの言語。
# デフォルト: "en" (messages.yml に同梱された英語ベースライン)。
# 他の翻訳は lang/<locale>/messages.yml にあり、英語ベースラインの上に
# レイヤーとして読み込まれます。言語ファイルに無いキーは黙って英語に
# フォールバックします。未知の言語コードは警告を出して同様に英語に
# フォールバックします。
# ADR-020 と REQ-RTP-F-013 を参照。
language: "en"

# テレポート遅延（秒）
# 実際にテレポートが発動するまでにプレイヤーが待つ時間。
# サーバーが目的地のチャンクを事前にロードする時間を確保できます。
テレポート遅延: 2

# 移動キャンセル（ブロック）
# 遅延中にプレイヤーがこの距離以上動いたらテレポートをキャンセルします。
# -1 で無効化。
キャンセル距離: 2

# テレポート間隔（秒）
# プレイヤーが連続して RTP を使うまでに待つ時間。
テレポートクールダウン: 300

# テレポート後コマンド
# テレポート成功後に実行するコマンドのリスト。
# プレースホルダ [player] はプレイヤー名を表します。
コンソールコマンド:
  - "say [player] がランダムテレポートしました！"
プレイヤーコマンド:
  - ""

# --- データベース設定 ---
# キャッシュされた位置やプレイヤーデータの保存先。
データベース:
  # 利用可能な type: yaml, sqlite, mysql, postgresql
  # - yaml/sqlite: ローカルファイル（追加設定不要）
  # - mysql/postgresql: リモートデータベース（下記の認証情報が必要）
  type: "sqlite"

  # ネットワークデータベースの認証情報（ローカルでは無視されます）
  host: "127.0.0.1"
  port: 3306
  name: "rtp"
  username: "root"
  password: "password"

# --- ネットワーク同期 ---
# Redis は複数サーバー間でキャッシュされた位置を同期するために使われます。
ネットワーク:
  redis:
    enabled: false
    host: "127.0.0.1"
    port: 6379
    password: ""

# バージョン番号は変更しないでください
version: "3.0"
