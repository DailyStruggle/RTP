# --- Language Mapping: config.yml ---
# Maps internal config keys (left) to the user-visible key names used in
# config.yml (right). Edit only the right-hand side to rename or translate
# a config option; the left-hand side is a code constant and must not change.
# If this file is missing, the plugin regenerates it with identical left/right
# pairs (the English defaults).
database: "database"
playerCommands: "playerCommands"
teleportCooldown: "teleportCooldown"
cancelDistance: "cancelDistance"
teleportDelay: "teleportDelay"
consoleCommands: "consoleCommands"
version: "version"
network: "network"
