# --- Language Mapping: economy.yml ---
# Maps internal config keys (left) to the user-visible key names used in
# economy.yml (right). Edit only the right-hand side to rename or translate
# a config option; the left-hand side is a code constant and must not change.
# If this file is missing, the plugin regenerates it with identical left/right
# pairs (the English defaults).
balanceFloor: "balanceFloor"
price: "price"
priceOther: "priceOther"
refundOnCancel: "refundOnCancel"
biomePrice: "biomePrice"
paramsPrice: "paramsPrice"
version: "version"
