# --- RTP User-Facing Messages (cat dialect) ---
# Every meow, hiss, and purr the kitty wants the human staff to read.
# Formatting:
# - Bukkit legacy color codes (e.g. &a, &e, &c)
# - Hex color codes (e.g. #2636ef)
# - PlaceholderAPI placeholders (when PAPI is installed)
# Placeholders:
# - Shared "[Pn]" placeholders are defined in the `empty_bowls` list below.
# [P0] is the RTP prefix by default.
# - Per-message placeholders (e.g. [attempts], [world]) are documented inline
# above each message that uses them.
# Note: keys like `busy` and `invalidCommand` are not key-renamed in
# messages.lang.yml, so they keep their English left-hand names below.
# ###############################################################################
# Section 1: General Configuration
# ###############################################################################
# list of additional placeholders
# format: Pn - where n is the index in this list
empty_bowls:
  # P0
  - "[RTP]"

# ###############################################################################
# Section 2: Pouncing
# ###############################################################################
# already mid-pounce
already_pouncing: "&e[P0] mrrp! you're already pouncing!"

# plugin is grooming itself
pounce_denied_grooming: "&e[P0] pounces are paused while the kitty grooms. try again after a few licks."
hold_paw_message: "&e[P0] Pouncing in [delay]. Don't twitch your tail"
kibble_loading: "&e[P0] Loading kibble! please wait..."
pounce_message: "&e[P0] Pounced in [attempts] attempts, in [processingTime]"

# pounce cancelled
pounce_cancelled: "&e[P0] Pounce cancelled! mrow."

# no safe spots after max attempts
# placeholder: [attempts] - the maximum number of attempts
spooky: "&e[P0] could not find a safe paw-spot within [attempts] attempts"

# the kitty is on cooldown nap
# placeholder: [remainingCooldown] - the remaining time
nap_message: "&e[P0] you can't pounce again for [remainingCooldown]. nap first."

# no warm spots ready
no_warm_spots_left: "#f5eb73[P0] no warm spots ready at this time"

# the line of waiting kitties shifted
# placeholder: [spot] - the current position in line
line_of_kitties_updated: "#2636ef[P0] your spot in line: [spot]"

# kitty does not have enough treats to pounce in this region
# placeholder: [money] - how much money is required for the command
not_enough_treats: "&e[P0] you need at least $[money] treats for that."

# ###############################################################################
# Section 3: Time Formatting
# ###############################################################################
# for time placeholders: how a kitty counts time
many_naps: "d"
long_naps: "h"
yawns: "m"
tail_flicks: "s"
whisker_twitches: "ms"

# ###############################################################################
# Section 4: System & Management
# ###############################################################################
# a config file 'version' is older than the latest
# placeholder: [filename] - name of file, including file extension
ancient_scroll: "&b[P0] old [filename] detected. Updating"

# sniffed a new bukkit world not in the config file
# placeholder: [world] - the world detected
new_box: "&b[P0] sniffed a new box '[world]'"

# bukkit-box has no such world
# placeholder: [world] - the world name
not_a_real_box: "&e[P0] could not find box '[world]'"

# tall-human reload / update text
# placeholder: [filename] - name of file
grooming: "&b[P0] grooming [filename]..."
groomed_complete: "&b[P0] finished grooming [filename]."
rearranging_whiskers: "&a[P0] rearranging [filename]..."
groomed: "&a[P0] [filename] all tidy."

# tall-human asked for a trick the kitty does not know
# placeholder: [arg] - the argument attempted
silly_word: "&c[P0] silly word, kitty: [arg]"

# the tall-human terminal is trying a kitty-only trick
tall_human_forbidden: "&c[P0] only an in-game kitty can do that, tall human."

# kitty is grooming and busy
busy: "&c[P0] busy grooming"

# unknown subcommand
# placeholder: [arg] - the argument attempted
invalidCommand: "&c[P0] invalid command - [arg]"

# no permission
no_treats_for_you: "&eI'm sorry, but no treats for you. please ask the head kitty if you think this is wrong."

# ###############################################################################
# Section 5: Administrative Logs
# ###############################################################################
# logged when warm-spots are saved/loaded from the scratching post
# placeholder: [amount] - number of locations
# placeholder: [region] - name of region
warm_spot_saved: "&e[P0] saved [amount] warm-spots for [region]"
warm_spot_remembered: "&e[P0] remembered [amount] warm-spots for [region]"

# ###############################################################################
# Section 6: Sniff (Scan) Command
# ###############################################################################
# sniff command status messages
# placeholder: [scan_regions] - list of regions
start_sniffing: "&a[P0] sniff started for territories: [scan_regions]"
forget_the_smell: "&e[P0] sniff queue forgotten for territories: [scan_regions]"
stop_sniffing: "&e[P0] sniff cancelled for territories: [scan_regions]"
pause_sniffing: "#A020F0[P0] sniff paused for territories: [scan_regions]"
resume_sniffing: "#10A5F5[P0] sniff resumed for territories: [scan_regions]"
sniffing_now: "&c[P0] already sniffing territories: [scan_regions]"
not_sniffing: "&c[P0] not sniffing territories: [scan_regions]"
# placeholders: [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
sniff_status: "&a[P0] sniffed [scan_chunks] / [scan_totalChunks] kibble for territories: [scan_regions]. [scan_cps] cps. land smell: [scan_landPercentage]%. ETA: [scan_eta]"

# ###############################################################################
# Section 7: Info (Meow) Command
# ###############################################################################
# info command output
meow_title: "&a======RTP Meow Info======"
paw_tickets: "&7Global active kibble tickets: &f[tickets]"
pounces: "&7Active pounce state machines: &f[teleports]"
meows_per_tick: "&7Current plugin meows-per-tick: &f[mspt]"
total_naps_disturbed: "&7Lifetime kibble loaded: &f[loads]"
infoLoadsByOrigin: "&7Loads by Origin: &f[loadsByOrigin]"
drool_rate: "&7Current drool (chunk leak) rate: &f[leakRate]"
# --- Metrics SPI health block (METRICS_PLAN.md > /rtp info Surface) ---
infoQueueDepth: "&7Players Waiting In Region Queues: &f[queueDepth]"
infoPendingTeleports: "&7Pending Teleport Pipelines: &f[pendingTeleports]"
infoAvgPipelineMs: "&7Avg Pipeline Latency: &f[avgPipelineMs] ms"
infoHeap: "&7JVM Heap: &f[heapUsedMb] / [heapMaxMb] MiB"
# Header line for the Health pipeline labelled block in /rtp info.
infoHealthPipelineHeader: "&7--- Health: pipeline ---"
# TPS readout for the 1m / 5m / 15m windows. Placeholders: [tps1m] [tps5m] [tps15m].
infoTps: "&7TPS (1m/5m/15m): &f[tps1m] / [tps5m] / [tps15m]"
# Live server MSPT and tick-budget purr-meter. Placeholders: [mspt] [tickBudgetUtilisation].
infoMSPTLive: "&7Server MSPT: &f[mspt] ms (&7tick budget: &f[tickBudgetUtilisation]&7)"
# Configured player soft-cap vs current online count. Placeholders: [softCap] [playerCount].
infoSoftCap: "&7Players: &f[playerCount] / [softCap]"
# Latest kibble-stash round-trip latency in ms. Placeholder: [databaseLatencyMs].
infoDatabaseLatencyMs: "&7Database Latency: &f[databaseLatencyMs] ms"
# Health colour-band thresholds. Doubles consumed by ColourBands in rtp-core
# to wrap coloured-variant placeholders (e.g. [tps1mColoured]) with &a/&e/&c.
infoThresholdTpsGreen: 19.5
infoThresholdTpsYellow: 18.0
infoThresholdMsptGreen: 30.0
infoThresholdMsptYellow: 45.0
infoThresholdCacheFillGreen: 0.5
infoThresholdCacheFillYellow: 0.25
infoThresholdNetworkAgeYellow: 5.0
# Header line introducing the per-Folia-region table (Folia runtime only).
infoFoliaRegionsHeader: "&7--- Folia regions ---"
# Per-row template for a single Folia region. Placeholders: [regionId] [tps1m]
# [mspt] [playerCount] [queueDepth] [tickBudgetUtilisation].
infoFoliaRegion: "  &f[regionId]&7: tps=&f[tps1m]&7 mspt=&f[mspt]&7 players=&f[playerCount]&7 queue=&f[queueDepth]&7 budget=&f[tickBudgetUtilisation]"
hairball_warning_header: "&7--- Hairball disclaimer ---"
hairball_warning: "&7Hairball note: if the server's total orphaned-kibble count exceeds this kitty's lifetime loads ([loads]), this kitty is not the only droolster."
box_header: "#008080Boxes:"
tall_human_box_header: "&7--- Boxes ---"
box_info_meow: "  #21ADA8[world]"
territory_header: "#63C5DATerritories:"
tall_human_territory_header: "&7--- Territories ---"
territory_meow: "  #52B2BF[region]"

# sub-info listings
# placeholders: [world], [region], [requirePermission], [override], [shape], [worldBorderOverride], [cacheCap], [cached], [keptCache], [unkeptCache], [backlogCache], [backlogCacheCap]
box_info:
  - "#21ADA8[world]:"
  - "#99EEBB  - territory: [region]"
  - "#99EEBB  - requires_pets: [requirePermission]"
  - "#99EEBB  - paw_over: [override]"

territory_info:
  - "#52B2BF[region]:"
  - "#58CCED  - box: [world]"
  - "#58CCED  - pounce_shape: [shape]"
  - "#58CCED  - requires_pets: [requirePermission]"
  - "#58CCED  - fence_override: [worldBorderOverride]"
  - "#58CCED  - kibble_jar_lid: [cacheCap]"
  - "#58CCED  - hot_pile (L1): [keptCache]"
  - "#58CCED  - cold_pile (L2): [unkeptCache]"
  - "#58CCED  - backlog_pile (L3): [backlogCache] / [backlogCacheCap]"
  - "#58CCED  - cached: [cached]"

# ###############################################################################
# Section 8: Command Descriptions
# ###############################################################################
# shown in the help (ask-for-pets) command
pounce: "&b/rtp - pounce to a random spot"
pounce_description: "pounce to a random spot"
ask_for_pets: "&b/rtp help - mrrp, see this list"
ask_for_pets_description: "describe commands"
groom: "&b/rtp reload - re-lick config files"
groom_description: "re-lick config files"
sniff: "&b/rtp scan - try every territory placement to make pouncing faster"
sniff_description: "forget stored data and try every territory placement"
setup_description: "update config files at runtime"
meow_info_description: "check the kitty's current state"
practice_pounce_description: "practice-test RTP functions"

# ###############################################################################
# Section 8b: Generalized Menu Framework
# ###############################################################################
# Sent when a menu token is unknown, malformed, or belongs to another player.
menuInvalid: "&c[P0] that menu link is invalid."
# Sent when a menu token has expired or was already consumed.
menuExpired: "&c[P0] that menu link has expired. Please reopen the menu."
# Sent when a menu redeem cannot resolve the calling player UUID.
menuUnknownPlayer: "&c[P0] menu links can only be used by in-game players."
# Hover-fallback template used by the menu reflector when no YAML block-comment
# is available for a parameter. Placeholder: [type] - the declared parameter type.
menuHoverFallbackType: "type: [type]"
# Hover-fallback template used by the menu reflector when a parameter exposes a
# small curated value set. Placeholder: [values] - comma-joined accepted values.
menuHoverFallbackBounds: "accepted: [values]"
# Label for the "go back one level" navigation row prepended to every non-root menu page.
menuBack: "&7« back"
# Label template for the "execute the assembled command" row prepended to every
# runnable non-root menu page. Placeholder: [command] - the assembled /rtp ... invocation.
menuExecute: "&a▶ run [command]"
# Header row at the top of a parameter-value picker sub-page (Stage A.2).
# Placeholders: [param] - parameter name; [command] - assembled /rtp ... invocation.
menuPickValue: "&epick a value for [param] (will run: /rtp [command] [param]:<value>)"
# Label for the "type a custom value" fallback row on a parameter-value picker page.
# Clicking it prefills chat with the assembled command up to '<param>:' so the player
# can type any value, including ones not in the suggestion list.
menuTypeValue: "&7✎ type a custom value..."
# Non-clickable header row at the top of every non-root menu page (Stage A.4).
# Surfaces the currently-constructed /rtp invocation including any staged
# parameter assignments (name:value). Placeholder: [command] - assembled args.
menuConstructed: "&7building: &f/rtp [command]"
# Non-clickable title row prepended to the root /rtp menu page (Stage A.5).
# Provides a welcoming header before the player descends into any subcommand.
menuRootTitle: "&6&l⚡ RTP menu"
# Non-clickable subtitle/hint row prepended to the root /rtp menu page below
# menuRootTitle (Stage A.5). Short orientation text for first-time users.
menuRootHint: "&7click an option below to begin"
# Navigation rows appended to paginated menu pages (Stage A.6) — clicking
# them moves to the previous/next page of the same model. Placeholder:
# [page] - the 1-based human-readable target page number.
menuPagePrev: "&7« previous page ([page])"
menuPageNext: "&7next page ([page]) »"
# Section divider on the front page above teleport rows (player view).
menuFrontPageSectionTeleport: "&8--- &7teleport &8---"
# Section divider on the front page above admin rows (admin view).
menuFrontPageSectionAdmin: "&8--- &7admin &8---"
# Front-page rows. No placeholders.
menuFrontPageRowTeleport: "&a▶ /rtp &7- teleport to a random location"
menuFrontPageRowRegion: "&a▶ /rtp region:&7... &7- pick a region"
menuFrontPageRowBiome: "&a▶ /rtp biome:&7... &7- pick a biome"
menuFrontPageRowHelp: "&a▶ /rtp help &7- list commands"
menuFrontPageRowInfo: "&b▶ /rtp info &7- plugin diagnostics"
menuFrontPageRowConfig: "&b▶ /rtp config &7- edit config files"
menuFrontPageRowScan: "&b▶ /rtp scan &7- pre-fill region caches"
menuFrontPageRowDiagnostics: "&c▶ /rtp test full &7- run full diagnostics"
menuFrontPageRowReload: "&c▶ /rtp reload &7- reload config files"
# Hover text for the diagnostics row warning about cost. No placeholders.
menuFrontPageHoverDiagnostics: "&7runs full diagnostic suite; may be expensive"
# Hover text for the reload row warning about side-effects. No placeholders.
menuFrontPageHoverReload: "&7reloads all config files; in-flight teleports may be affected"

