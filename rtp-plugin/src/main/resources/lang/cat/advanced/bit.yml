# --- Built-In Vet Check (BIT) Configuration (cat dialect) ---
# Documentation: docs/admin/configuration/BIT.md

# Meow about structural action hairballs as warnings instead of blocking action registration.
# Set true to keep an action with an effective ERROR hairball from registering.
strictActions: false

# Meow about setup findings that older litters accepted as warnings, so /rtp reload is not hissed away.
# Set true to treat them as errors; a reload or Hot-Apply with any error keeps the current setup purring.
strictConfig: false

# Smallest pile of sniff-samples before a gate is judged as never or always passing.
gateOutcomeSamples: 200

# Scheduled wake-up BIT prowl executed asynchronously at tick +2.
startupSweep: pbit

# Live diagnostic fur-coverage sniffer tucked into RtpBit.RUNNER.
coverage: auto

# Severity paw-overrides for registered BIT code keys; these trump strictActions.
# Allowed levels: ERROR, WARNING, INFO, DEBUG, TRACE and OFF. OFF hushes the finding.
# Unknown codes and levels are ignored and logged.
overrides:

# Do not bite the version number, sacred catnip
version: 1.0