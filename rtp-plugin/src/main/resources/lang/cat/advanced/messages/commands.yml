# --- RTP mews (this kitty's tongue) ---
# Player- and staff-facing mews for this language, grouped by what they're for.
# Auto-copied from the baseline mews; do not paw-edit (it gets overwritten).

# ###############################################################################
# Section 6: Sniff (Scan) Command
# ###############################################################################
# sniff command status messages
# placeholder: [scan_regions] - list of regions
start_sniffing: "&a[P0] sniff started for territories: [scan_regions]"
forget_the_smell: "&7[P0] sniff queue forgotten for territories: [scan_regions]"
stop_sniffing: "&7[P0] sniff cancelled for territories: [scan_regions]"
pause_sniffing: "#A020F0[P0] sniff paused for territories: [scan_regions]"
resume_sniffing: "#10A5F5[P0] sniff resumed for territories: [scan_regions]"
sniffing_now: "&c[P0] already sniffing territories: [scan_regions]"
not_sniffing: "&c[P0] not sniffing territories: [scan_regions]"
# placeholders: [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
sniff_status: "[P0] &8» &7[scan_regions] &8| &7[scan_chunks]&8/&7[scan_totalChunks] &8| #7E9CC8[scan_cps]&7 sniffs/s &8| #7E9CC8[scan_landPercentage]%&7 land smell &8| &7ETA #7E9CC8[scan_eta]"
# Boss-bar title shown to players with rtp.scan permission while a world scan is running.
# Set to empty string to disable the boss-bar.
# placeholder: [scan_regions], [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
sniff_bar: "Sniffing [scan_regions]: [scan_chunks]/[scan_totalChunks] ([scan_landPercentage]% warm-spots) ETA [scan_eta]"

