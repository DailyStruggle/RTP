# Minimum purrs/sec (TPS) to keep sniffing in the background
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
minimum_purrs_per_second: 19.0

# Max JVM heap nibbling (% of max) before background warm-spot stuffing naps.
# Already-stashed warm-spots are still served. 0 or 100 turns the gate off.
# @type: number
# @range: [0.0, 100.0]
# @default: 85.0
maxHeapPurrcent: 85.0

# --- RTP Performance Settings (cat dialect) ---
# How fast a kitty can stalk and pounce without knocking over the lamp.
# Max pounce attempts before giving up
# @type: integer
# @range: [1, null]
# @default: 32
max_pounces: 32

# Tail flicks (ticks) between background sniff cycles
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
tail_swish_period: 20

# Max whisker-twitches per tick for sync errands
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
sync_nap_time: 50

# Max whisker-twitches per tick for async errands
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
async_nap_time: 50

# Kibble (chunk) radius to load while stalking
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
stalking_distance: 0

# Kibble (chunk) radius to load just before pouncing
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
pounce_distance: 0

# Ticks over which a teleported kitty's view distance creeps back to normal after
# landing, smoothing the chunk-load pounce. 0 turns the clamp off.
# @type: integer
# @range: [0, null]
# @unit: ticks
# @default: 200
pounce_recovery_naps: 200

# Refill the warm-spot pile right after a pounce
# @type: boolean
# @default: false
line_up_after_pounce: false

# Sniffs biomes from already-awake chunks into spatial memory, feeding biome
# recall / weighting. No extra chunk fetching.
# @type: boolean
# @default: true
check_when_kibble_arrives: true

# Fraction of the L3 backlog stash where refilling wakes back up (hysteresis).
# 0.5 = refill after draining to 50%; 1.0 = refill nonstop.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.5
backlog_refill_threshold: 0.5

# Odds of turning your nose up at an ungenerated chunk per try.
# 0.0 = no bias, 1.0 = dodge ungenerated land. Generated chunks always pass.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.0
prefers_explored_land: 0.0

# Stashes a pile of warm-spots for arrival zoomies
# (rtp.onevent.firstjoin / rtp.onevent.join).
# @type: boolean
# @default: false
login_warmspot_enabled: false

# Hard lid for the join warm-spot pile. 0 = auto (server max-kitties at startup).
# @type: integer
# @range: [0, null]
# @default: 0
login_warmspot_cap: 0

# Reuse already-known biome warm-spots
# @type: boolean
# @default: true
smell_memory: true

# Only serves biome-picky requests from the stash (never starts fresh biome
# hunts). Needs biomeRecall.
# @type: boolean
# @default: false
forced_smell_memory: false

# Steers each requested biome with equal odds instead of by how much turf it
# covers. Needs biomeRecall; no effect on unfiltered zoomies.
# @type: boolean
# @default: false
biome_favoritism: false

# Per-biome relative weights for biome-picky zoomies. Only used when biomeWeighted
# is true. Unlisted biomes use 1.0 (no bias); 2.0 = pounced ~twice as often, 0.0 =
# hushed. The whole vanilla set is pre-listed at 1.0 as an editable scratch-pad; add
# modded biomes by their platform id (e.g. terralith:emerald_peaks). Needs biomeRecall.
# @type: map<string, number>
biome_favor_amounts:
  # How strongly this biome gets pounced toward (1.0 = no favoritism).
  # @type: number
  # @range: [0.0, null]
  # @default: 1.0
  plains: 1.0
  sunflower_plains: 1.0
  snowy_plains: 1.0
  ice_spikes: 1.0
  desert: 1.0
  swamp: 1.0
  mangrove_swamp: 1.0
  forest: 1.0
  flower_forest: 1.0
  birch_forest: 1.0
  dark_forest: 1.0
  old_growth_birch_forest: 1.0
  old_growth_pine_taiga: 1.0
  old_growth_spruce_taiga: 1.0
  taiga: 1.0
  snowy_taiga: 1.0
  savanna: 1.0
  savanna_plateau: 1.0
  windswept_hills: 1.0
  windswept_gravelly_hills: 1.0
  windswept_forest: 1.0
  windswept_savanna: 1.0
  jungle: 1.0
  sparse_jungle: 1.0
  bamboo_jungle: 1.0
  badlands: 1.0
  eroded_badlands: 1.0
  wooded_badlands: 1.0
  meadow: 1.0
  cherry_grove: 1.0
  pale_garden: 1.0
  grove: 1.0
  snowy_slopes: 1.0
  frozen_peaks: 1.0
  jagged_peaks: 1.0
  stony_peaks: 1.0
  river: 1.0
  frozen_river: 1.0
  beach: 1.0
  snowy_beach: 1.0
  stony_shore: 1.0
  warm_ocean: 1.0
  lukewarm_ocean: 1.0
  deep_lukewarm_ocean: 1.0
  ocean: 1.0
  deep_ocean: 1.0
  cold_ocean: 1.0
  deep_cold_ocean: 1.0
  frozen_ocean: 1.0
  deep_frozen_ocean: 1.0
  mushroom_fields: 1.0
  dripstone_caves: 1.0
  lush_caves: 1.0
  deep_dark: 1.0
  # --- Nether ---
  nether_wastes: 1.0
  warped_forest: 1.0
  crimson_forest: 1.0
  soul_sand_valley: 1.0
  basalt_deltas: 1.0
  # --- The End ---
  the_end: 1.0
  end_highlands: 1.0
  end_midlands: 1.0
  small_end_islands: 1.0
  end_barrens: 1.0
  # --- Odds & ends / techy ---
  the_void: 1.0

# Lag threshold (ms) above which an instantly-served zoomie gets audited
# (WARN logged, slowPipelineCount bumped). 0 or below turns it off.
# @type: integer
# @range: [0, null]
# @unit: ms
# @default: 5000
slow_pounce_threshold_ms: 5000

# Queue depth (kitties waiting) at which backpressure gets audited
# (WARN logged, queueGrowthWarnCount bumped). 0 or below turns it off.
# @type: integer
# @range: [0, null]
# @unit: players
# @default: 0
queue_growth_warn_threshold: 0

# Use sync chunk loading (NOT RECOMMENDED, may pull tail)
# @type: boolean
# @default: false
synced_kibble: false

# Re-sniff permissions on every event
# @type: boolean
# @default: false
sniff_on_event: false

# Parse sparkle (effect) permissions at startup
# @type: boolean
# @default: true
sparkle_parsing: true

# Enable background data gathering by visiting kitties
# @type: boolean
# @default: false
visitor_kitty_enabled: false

# Settings for /rtp admin prefab. The apply -> confirm flow writes a spare backup
# per touched file; bakRetention caps how many are kept (oldest pruned).
prefab_blanket:
  # Number of timestamped config backups kept per file before pruning.
  # @type: integer
  # @range: [1, null]
  # @default: 3
  bakRetention: 3
# Do not bite the version number, sacred catnip
meowsion: 1.0
