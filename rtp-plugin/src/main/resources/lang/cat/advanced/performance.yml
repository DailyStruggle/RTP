# --- RTP Performance Settings (cat dialect) ---
# How fast a kitty can stalk and pounce without knocking over the lamp.
# Max pounce attempts before giving up
# @type: integer
# @range: [1, null]
# @default: 32
max_pounces: 32

# Kibble (chunk) radius to load while stalking
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
stalking_distance: 0

# Kibble (chunk) radius to load just before pouncing
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
pounce_distance: 0

# Total naps (ticks) over which a pounced kitty's warm-spot distance
# stretches back out after landing. On a pounce the warm-spot distance
# curls up small to the pounce_distance radius (at least 2 kibble-rings),
# so the scratching-post only loads a tiny ring of warm-spots when kitty
# lands, then unfurls back over these naps. This smooths the warm-spot
# loading hairball that can choke a tick on weak naps-boxes. 0 turns the
# curl-up off. Does nothing when pounce_distance is already at or above
# kitty's warm-spot distance.
# @type: integer
# @range: [0, null]
# @unit: ticks
# @default: 200
pounce_recovery_naps: 200

# Tail flicks (ticks) between background sniff cycles
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
tail_swish_period: 20

# Max whisker-twitches per tick for sync errands
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
sync_nap_time: 50

# Max whisker-twitches per tick for async errands
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
async_nap_time: 50

# Minimum purrs/sec (TPS) to keep sniffing in the background
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
minimum_purrs_per_second: 19.0

# Da biggest amount of JVM nap-pile (purrcent of da max nap-pile) afore da
# behind-da-scenes warm-spot makin' takes a catnap. Every warm-spot held in
# memory pins a chunk, so fillin' up furever on a teeny-nap-pile server can
# make da JVM cough up endless furballs (garbage collection) an' leave da
# server frozen like a startled kitty wif no error in da hooman-box.
# While usage sits at or above dis line, RTP stops toppin' up da warm-spot
# stash but keeps handin' out already-warmed spots to waitin' kitties. 0 or
# 100 turns da gate off.
# @type: number
# @range: [0.0, 100.0]
# @default: 85.0
maxHeapPurrcent: 85.0

# Refill the warm-spot pile right after a pounce
# @type: boolean
# @default: false
line_up_after_pounce: false

# Use sync chunk loading (NOT RECOMMENDED, may pull tail)
# @type: boolean
# @default: false
synced_kibble: false

# Re-sniff permissions on every event
# @type: boolean
# @default: false
sniff_on_event: false

# Parse sparkle (effect) permissions at startup
# @type: boolean
# @default: true
sparkle_parsing: true

# Reuse already-known biome warm-spots
# @type: boolean
# @default: true
smell_memory: true

# Only use biomes already remembered (no new sniffing)
# @type: boolean
# @default: false
forced_smell_memory: false

# Bias biome-filtered pouncing so each wanted biome gets steered toward with
# equal chance, instead of in proportion to how much of the territory it covers.
# Stops common biomes from drowning out the rare ones when several are asked for.
# Needs biomeRecall; no effect on unfiltered (default-biome) pounces.
# @type: boolean
# @default: false
biome_favoritism: false

# Per-biome relative selection weights for biome-filtered teleports.
# Only consulted when biomeWeighted is true. Biomes not listed here use
# weight 1.0, so an empty/all-equal map reproduces the equal-probability
# behavior of biomeWeighted on its own. A biome given weight 2.0 is
# steered toward roughly twice as often as a weight-1.0 biome among the
# requested set (when both are present in biome-recall memory); 0.0
# suppresses a biome. Requires biomeRecall; no effect on unfiltered
# (default-biome) teleports. The shipped plains entry is a weight-1.0
# no-op example - replace or extend it with the biomes you want to bias.
# @type: map<string, number>
biome_favor_amounts:
  # How strongly this biome gets pounced toward (1.0 = no favoritism).
  # @type: number
  # @range: [0.0, null]
  # @default: 1.0
  plains: 1.0
  sunflower_plains: 1.0
  snowy_plains: 1.0
  ice_spikes: 1.0
  desert: 1.0
  swamp: 1.0
  mangrove_swamp: 1.0
  forest: 1.0
  flower_forest: 1.0
  birch_forest: 1.0
  dark_forest: 1.0
  old_growth_birch_forest: 1.0
  old_growth_pine_taiga: 1.0
  old_growth_spruce_taiga: 1.0
  taiga: 1.0
  snowy_taiga: 1.0
  savanna: 1.0
  savanna_plateau: 1.0
  windswept_hills: 1.0
  windswept_gravelly_hills: 1.0
  windswept_forest: 1.0
  windswept_savanna: 1.0
  jungle: 1.0
  sparse_jungle: 1.0
  bamboo_jungle: 1.0
  badlands: 1.0
  eroded_badlands: 1.0
  wooded_badlands: 1.0
  meadow: 1.0
  cherry_grove: 1.0
  pale_garden: 1.0
  grove: 1.0
  snowy_slopes: 1.0
  frozen_peaks: 1.0
  jagged_peaks: 1.0
  stony_peaks: 1.0
  river: 1.0
  frozen_river: 1.0
  beach: 1.0
  snowy_beach: 1.0
  stony_shore: 1.0
  warm_ocean: 1.0
  lukewarm_ocean: 1.0
  deep_lukewarm_ocean: 1.0
  ocean: 1.0
  deep_ocean: 1.0
  cold_ocean: 1.0
  deep_cold_ocean: 1.0
  frozen_ocean: 1.0
  deep_frozen_ocean: 1.0
  mushroom_fields: 1.0
  dripstone_caves: 1.0
  lush_caves: 1.0
  deep_dark: 1.0
  # --- Nether ---
  nether_wastes: 1.0
  warped_forest: 1.0
  crimson_forest: 1.0
  soul_sand_valley: 1.0
  basalt_deltas: 1.0
  # --- The End ---
  the_end: 1.0
  end_highlands: 1.0
  end_midlands: 1.0
  small_end_islands: 1.0
  end_barrens: 1.0
  # --- Odds & ends / techy ---
  the_void: 1.0

# Check for warm-spots in every loaded kibble (chunk)
# @type: boolean
# @default: true
check_when_kibble_arrives: true

# Enable background data gathering by visiting kitties
# @type: boolean
# @default: false
visitor_kitty_enabled: false

# Keep a reserved warm-spot pile for join-time pounces (rtp.onevent.firstjoin / rtp.onevent.join). Sized by remaining empty kitty slots.
# @type: boolean
# @default: false
login_warmspot_enabled: false

# Hard lid for the join warm-spot pile. 0 = auto (server max-kitties at startup).
# @type: integer
# @range: [0, null]
# @default: 0
login_warmspot_cap: 0

# Chance of rejecting an ungenerated chunk per pounce attempt.
# 0.0 = no bias (default), 1.0 = strictly avoid ungenerated land.
# Generated chunks always pass.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.0
prefers_explored_land: 0.0

# Fraction of L3 backlog capacity at which top-up resumes (hysteresis).
# 0.5 = top-up only after L3 drains to 50% (default). 1.0 = top-up
# nonstop. Bigger values bunch.mca-bin sniffs together for better
# CPU/memory thriftiness.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.5
backlog_refill_threshold: 0.5

# Latency threshold (ms) above which an immediately-served (unqueued) pounce
# is audited: a WARN is logged and the cumulative slowPipelineCount counter
# (shown by /rtp info) is bumped. Only immediate/unqueued pounces are audited;
# queued at-rate pounces are excluded because their measured time includes
# queue-wait. 0 or below disables the audit.
# @type: integer
# @range: [0, null]
# @unit: ms
# @default: 5000
slow_pounce_threshold_ms: 5000

# Public pounce-queue depth (cats waiting) at or above which queue backpressure
# is audited: an edge-triggered WARN is logged and the cumulative
# queueGrowthWarnCount counter (shown by /rtp info) is bumped once per crossing.
# 0 or below disables the audit (opt-in).
# @type: integer
# @range: [0, null]
# @unit: players
# @default: 0
queue_growth_warn_threshold: 0

# Settings for /rtp admin prefab. The apply -> confirm flow writes each touched
# config file with a sibling backup named <file>.yml.bak.<epochMillis>;
# bakRetention caps how many such backups are kept per file, oldest pruned first.
# Set to 1 to keep only the most recent backup; values below 1 are clamped to 1.
# /rtp admin prefab rollback walks backups newest-first across multiple invocations.
prefab_blanket:
  # Number of timestamped config backups kept per file before pruning.
  # @type: integer
  # @range: [1, null]
  # @default: 3
  bakRetention: 3
# Do not bite the version number, sacred catnip
meowsion: 1.0
