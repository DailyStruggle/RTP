# RTP Network Mode (multi-server / multi-proxy) Disabled by default; flipping `network.enabled: true` opts this backend into the cross-server network.
network:
  # when false, kitty sniffs n checks dis file den ignores it - no yarn-threads, no scratching-post tables, no tunnel opens.
  # @type: boolean
  # @default: false
  enabled: false
  # steady litter-box name fur dis box, needed when on; two boxes sharin one serverId scribble over each-other's purr-beat.
  # @type: string
  # @default: ""
  serverId: ""
  # den-variable holdin da shared HMAC secret-treat; needed when on wif transport.type redis.
  # @type: string
  # @default: "RTP_NET_SECRET"
  secretEnv: "RTP_NET_SECRET"

# Backing store for cross-process state.
transport:
  # tunnel's stash-spot fur cross-box mews.
  # @type: enum
  # @options: ["auto", "plugin-message", "in-memory", "sql", "redis"]
  # @default: "auto"
  type: "auto"
  pluginMessage:
    # proxy plugin-meow channel; leave as-is unless yer proxy uses a weird name.
    # @type: string
    # @default: "bungeecord:main"
    channel: "bungeecord:main"
  redis:
    # host-name or IP of da Redis den shared by every box n proxy (needed when type is redis).
    # @type: string
    # @default: "localhost"
    host: "localhost"
    # Redis port; paw a new one fur weird setups.
    # @type: integer
    # @default: 6379
    port: 6379
    # Redis secret-word; leave empty fur no-guard Redis, set it when ACL/requirepass is set up.
    # @type: string
    # @default: ""
    password: ""

# Backend heartbeat / peer-staleness cadence (shared by every transport tier).
heartbeat:
  # how often dis box meows out its state row (ms).
  # @type: integer
  # @default: 1000
  intervalMs: 1000
  # how long a fren-box's last-seen state stays trusted afore it goes mystery-cat (ms); keep it above intervalMs.
  # @type: integer
  # @default: 5000
  staleAfterMs: 5000

# Backend-side router.
routing:
  # router mode: local (home pipe only), auto (home first, else da waitin line), or always (always hop in line).
  # @type: enum
  # @options: ["local", "auto", "always"]
  # @default: "local"
  mode: "local"
  # lobby mode: makes dis box a pure send-off perch dat auto-flings bare /rtp to da fren-box wif da most warm-spots.
  # @type: boolean
  # @default: false
  lobbyMode: false

# Cross-server wait queue.
queue:
  # most home-buffered sign-ups afore da push-back hisses at new /rtp calls (QUEUE_FULL).
  # @type: integer
  # @default: 50
  maxDepth: 50
  # box messy-write flush beat (ms); lower = quicker pounce, higher = fewer trips down da tunnel.
  # @type: integer
  # @default: 250
  flushIntervalMs: 250
  # box status-stash peek beat (ms); how often each hooman's progress gets a fresh lick.
  # @type: integer
  # @default: 1000
  pollIntervalMs: 1000
  # optional lazy TTL agein of envelope HASHes (ms); 0 naps it off.
  # @type: integer
  # @default: 0
  entryTtlMs: 0
  # cross-box /rtp sign-up speed cap (treat-bucket): steady asks per second.
  # @type: number
  # @default: 5
  crossServerRequestsPerSecond: 5
  # cross-box /rtp sign-up speed cap: zoomies burst size.
  # @type: number
  # @default: 10
  crossServerRequestsBurst: 10
  # proxy-side BLPOP worker-cat count; add more only when one worker-cat gets pooped out.
  # @type: integer
  # @default: 1
  workerThreads: 1

# Reservation-token lifecycle (REQ-RTP-NET-011).
reservation:
  # proxy-side TTL sweeper beat (ms); shoos stale tokens n frees their spots.
  # @type: integer
  # @default: 30000
  reapIntervalMs: 30000
  # per-token TTL (ms); a called-dibs-but-unused hold older than dis gets freed as abandoned.
  # @type: integer
  # @default: 60000
  ttlMs: 60000

# Region-collision policy.
regionCollision:
  # bonk policy applied at wake-up.
  # @type: enum
  # @options: ["warn", "rename-local", "reject-startup"]
  # @default: "warn"
  policy: "warn"

# Optional per-destination policy overlay (matched by serverId); leave commented for the common case.
#servers:
#  example-backend:
#    # Permission required to target this destination (empty = none).
#    # @type: string
#    # @default: "
#    permission: "
#    # Label shown in menus / suggestions (default: serverId).
#    # @type: string
#    # @default: "
#    display-name: "Example"
#    # Hide from tab-completion when it has no servable region.
#    # @type: boolean
#    # @default: false
#    hide-when-unavailable: false
#    # Allow targeting it even when it reports no servable region.
#    # @type: boolean
#    # @default: true
#    allow-when-unavailable: true
# Load balancer scoring table.
loadBalancer:
  # weight of da built-in region-scarcity bit; 0 cuz da plain `region` bit below owns dat signal.
  # @type: number
  # @default: 0
  regionScarcityWeight: 0
  # Scoring terms, one per metric.
  terms:
    # Tick pressure; sigmoid knee at 0.6.
    mspt:
      # metric nibble.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "mspt"
      input: "mspt"
      # bit weight.
      # @type: number
      # @default: 1.0
      weight: 1.0
      curve:
        # curve kind.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "sigmoid"
        type: "sigmoid"
        # steepness.
        # @type: number
        # @range: [0.1, 20]
        # @default: 8.0
        k: 8.0
        # middle-spot.
        # @type: number
        # @range: [0, 1]
        # @default: 0.6
        x0: 0.6
    # Queue depth; small queues silent, large ones explode.
    queue:
      # metric nibble.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "queueDepth"
      input: "queueDepth"
      # bit weight.
      # @type: number
      # @default: 1.0
      weight: 1.0
      curve:
        # curve kind.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "exponential"
        type: "exponential"
        # steepness.
        # @type: number
        # @range: [0.1, 20]
        # @default: 3.0
        k: 3.0
    # Heap gate; fires at >= 85% used.
    heap:
      # metric nibble.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "heapUsed"
      input: "heapUsed"
      # bit weight.
      # @type: number
      # @default: 5.0
      weight: 5.0
      curve:
        # curve kind.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "step"
        type: "step"
        # step line.
        # @type: number
        # @range: [0, 1]
        # @default: 0.85
        threshold: 0.85
    # Region gate; fires when the kept pool is >= 95% full.
    region:
      # metric nibble.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "keptRegion"
      input: "keptRegion"
      # bit weight.
      # @type: number
      # @default: 5.0
      weight: 5.0
      curve:
        # curve kind.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "step"
        type: "step"
        # step line.
        # @type: number
        # @range: [0, 1]
        # @default: 0.95
        threshold: 0.95
    # Gentle tie-breaker on kept count.
    kept:
      # metric nibble.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "keptCount"
      input: "keptCount"
      # bit weight.
      # @type: number
      # @default: 0.25
      weight: 0.25
      curve:
        # curve kind.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "logarithmic"
        type: "logarithmic"
        # steepness.
        # @type: number
        # @range: [0.1, 20]
        # @default: 9.0
        k: 9.0

version: 1.1
