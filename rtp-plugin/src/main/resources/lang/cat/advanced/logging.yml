# --- Plugin Logging Toggles (cat dialect) ---
# The diary of every hiss and purr the kitty wants to remember.
# Log all files re-licked during /rtp reload
# @type: boolean
# @default: false
long_grooming_session: false

# Log territory (region) initialisation details
# @type: boolean
# @default: false
territory_marking: false

# Log player-pawed RTP commands
# @type: boolean
# @default: false
human_trick: false

# Log successful pounce events
# @type: boolean
# @default: true
pounce: true

# Log RTP pounced by world changes
# @type: boolean
# @default: true
hopped_to_new_box: true

# Log RTP pounced on join
# @type: boolean
# @default: true
new_kitty_arrived: true

# Log RTP pounced on respawn
# @type: boolean
# @default: true
nine_lives_used: true

# Log move event pawing
# @type: boolean
# @default: true
prowl: true

# Log teleport event pawing
# @type: boolean
# @default: true
pounce_event: true

# Log info when a warm-spot search fails
# @type: boolean
# @default: true
missed_the_pounce: true

# Debug logs for snack (memory) activity
# @type: boolean
# @default: false
snack_inventory: false

# Debug logs for scratching-post (database) activity
# @type: boolean
# @default: false
scratching_post: false

# Minimum meow volume. Effective filter is the finer of this and the
# tall-human logger's own level. ALL behaves like the tall-human logger.
# @type: enum
# @options: [SEVERE, WARNING, INFO, CONFIG, FINE, FINER, FINEST, ALL, OFF]
# @default: ALL
minimum_meow_volume: "INFO"

# Do not bite the version number, sacred catnip
meowsion: 1.0
