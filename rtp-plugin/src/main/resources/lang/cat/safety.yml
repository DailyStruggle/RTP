# --- RTP Safety Configuration (cat dialect) ---
# Where it is safe to land on four paws after a pounce.

# Tail flicks (seconds) of invulnerability after pouncing
nine_lives_buffer: 5
# Block radius around landing spot to sniff for danger
soft_landing_radius: 0
# Max retries for stale-kibble guard
staleChunkRetryLimit: 2
# Off-thread anvil prefilter (smell from afar)
anvilPrefilterEnabled: true
# Radius of emergency paw platform (-1 to disable)
paw_platform_radius: -1
# Depth of platform
paw_platform_depth: 1
# Air space above platform for tail
paw_platform_headroom: 2
# Material for emergency paw platform
paw_platform_material: GLASS

empty_air_for_zoomies:
  - AIR
  - CAVE_AIR
  - VOID_AIR
  - LEGACY_AIR
  - STRUCTURE_VOID
  - LIGHT
  - "#minecraft:flowers"
  - "#minecraft:small_flowers"
  # Note: #minecraft:tall_flowers is an item-only tag in vanilla; its members
  # (LILAC, PEONY, ROSE_BUSH, SUNFLOWER, PITCHER_PLANT) are already covered by
  # #minecraft:flowers above.
  - SHORT_GRASS
  - TALL_GRASS
  - SHORT_DRY_GRASS
  - TALL_DRY_GRASS
  - FERN
  - LARGE_FERN
  - DEAD_BUSH
  - BUSH
  - WILDFLOWERS
  - FIREFLY_BUSH
  - LEGACY_LONG_GRASS
  - LEGACY_DEAD_BUSH
  - "#minecraft:saplings"
  - BROWN_MUSHROOM
  - RED_MUSHROOM
  - CRIMSON_FUNGUS
  - WARPED_FUNGUS
  - "#minecraft:crops"
  - MELON_STEM
  - PUMPKIN_STEM
  - SUGAR_CANE
  - BAMBOO_SAPLING
  - VINE
  - GLOW_LICHEN
  - WEEPING_VINES
  - TWISTING_VINES
  - HANGING_ROOTS
  - PALE_HANGING_MOSS
  - RESIN_CLUMP
  - "#minecraft:rails"
  - REDSTONE_WIRE
  - COMPARATOR
  - REPEATER
  - LEVER
  - STRING
  - TRIPWIRE
  - TORCH
  - WALL_TORCH
  - SOUL_TORCH
  - SOUL_WALL_TORCH
  - REDSTONE_TORCH
  - REDSTONE_WALL_TORCH
  - END_ROD
  - "#minecraft:buttons"
  - "#minecraft:pressure_plates"
  - "#minecraft:standing_signs"
  - "#minecraft:wall_signs"
  - "#minecraft:ceiling_hanging_signs"
  - "#minecraft:wall_hanging_signs"
  - LEGACY_SIGN
  - LEGACY_WALL_SIGN
  - SNOW
  - MOSS_CARPET
  - PALE_MOSS_CARPET
  - LEAF_LITTER
  - "#minecraft:leaves"

scary_blocks:
  - WATER
  - LAVA
  - BUBBLE_COLUMN
  - "*[waterlogged=true]"
  - "#minecraft:fire"
  - POWDER_SNOW
  - MAGMA_BLOCK
  - "#minecraft:campfires"
  - CACTUS
  - SWEET_BERRY_BUSH
  - WITHER_ROSE
  - CHORUS_PLANT
  - CHORUS_FLOWER
  - POINTED_DRIPSTONE
  - COBWEB
  - CREAKING_HEART
  - BEDROCK
  - NETHER_PORTAL
  - END_PORTAL
  - END_GATEWAY
  - TNT
  - END_CRYSTAL
  - RESPAWN_ANCHOR
  - SEAGRASS
  - TALL_SEAGRASS
  - KELP
  - KELP_PLANT
