# Stalk delay (tail flicks)
# How long the kitty crouches before the actual pounce.
# Gives the server time to pre-load destination kibble.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 2
stalk_delay: 2

# Too-far-to-chase (blocks)
# If the kitty wanders this far during the crouch, the pounce is cancelled.
# Set -1 to disable.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 2
too_far_to_chase: 2

# Nap time (tail flicks)
# How long a kitty must nap before pouncing again.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 300
nap_time: 300

# Maximum number of successful /rtp uses a player may make within the
# lockAfterResetSeconds window before being locked out (BetterRTP LockAfter parity).
# 0 disables the cap. Bypassed by rtp.nolock.
# @type: integer
# @range: [0, null]
# @default: 0
lockAfterUses: 0

# Length of the rolling usage-cap window for lockAfterUses. The counter resets this
# many seconds after the window's first use. 0 means the cap never resets (a hard
# lifetime cap).
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 0
lockAfterResetSeconds: 0

# When true, a successful /rtp sets the landed location as the player's persistent
# spawn anchor (BetterRTP SetAsRespawn parity).
# @type: boolean
# @default: false
setRespawnOnTeleport: false

# Post-pounce tricks
# Commands the tall human runs after a successful pounce.
# Placeholder [player] is the kitty's name.
# @type: list<string>
tall_human_tricks:
  - "say [player] has just randomly pounced! Mrrow!"

# Tricks the kitty performs after a successful pounce.
# Use [player] for the kitty's name. Empty entries are ignored.
# @type: list<string>
human_tricks:
  # Tricks the kitty performs after a successful pounce.
  # Use [player] for the kitty's name. Empty entries are ignored.
  # @type: list<string>
  - ""

# --- Scratching post (database) ---
# Where cached warm-spots and kitty data are remembered.
scratching_post:
  # Allowed types: yaml, sqlite, mysql, postgresql
  # - yaml/sqlite: local file (no extra setup)
  # - mysql/postgresql: remote post (credentials below)
  # @type: enum
  # @options: ["yaml", "sqlite", "mysql", "postgresql"]
  # @default: "sqlite"
  type: "sqlite"
  # Network post credentials (ignored for local types)
  # @type: string
  host: "127.0.0.1"
  # Port for the kibble-stash. Only mysql/postgresql sniff at this one.
  # @type: integer
  # @range: [1, 65535]
  port: 3306
  # Kibble-stash / schema name. Sniffed by mysql/postgresql only.
  # @type: string
  name: "rtp"
  # Kibble-stash username. Sniffed by mysql/postgresql only.
  # @type: string
  username: "root"
  # Tall-human's secret kibble-stash password. Sniffed by mysql/postgresql only.
  # @type: string
  password: "password"

# --- Yarn ball (network sync) ---
# Redis is used to share warm-spots between many tall-human boxes.
yarn_ball:
  redis:
    # Enable Redis-backed network state binding.
    # @type: boolean
    # @default: false
    enabled: false
    # Redis host.
    # @type: string
    host: "127.0.0.1"
    # Redis port.
    # @type: integer
    # @range: [1, 65535]
    port: 6379
    # Redis password. Empty string disables auth.
    # @type: string
    password: ""

# Generalized menu framework.
# `renderer` is an ordered preference list of renderer ids. On exception or
# missing adapter the framework walks the list and falls back to the next
# entry. If the list is exhausted the no-token open-page path falls back to
# the configurable `menuInvalid` message. Available ids: book. (The chat
# renderer ships in a follow-up and will be added to the default list at
# that point.)
menu:
  # Ordered preference list of renderer ids.
  # @type: list<enum>
  # @options: ["book", "chat"]
  renderer:
    # Generalized menu framework.
    # `renderer` is an ordered preference list of renderer ids. On exception or
    # missing adapter the framework walks the list and falls back to the next
    # entry. If the list is exhausted the no-token open-page path falls back to
    # the configurable `menuInvalid` message. Available ids: book. (The chat
    # renderer ships in a follow-up and will be added to the default list at
    # that point.)
    - "book"

# Do not bite the version number, sacred catnip
meowsion: 3.0
