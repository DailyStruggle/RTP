# --- Карта языка: regions/*.yml ---
# Сопоставляет внутренние ключи региона (слева) с именами, видимыми
# пользователю во всех файлах под `regions/` (справа).
# Изменяйте только правую сторону; левая сторона является константой
# кода и не должна изменяться.
# Если этот файл отсутствует, плагин восстановит его с идентичными
# парами слева/справа (значения по умолчанию на английском).
world: "мир"
worldBorderOverride: "переопределениеГраницыМира"
shape: "форма"
vert: "вертикаль"
requirePermission: "требуетсяПраво"
cacheCap: "размерКэша"
backlogCacheCap: "размерКэшаНакопленного"
activeChunkCap: "размерАктивныхЧанков"
price: "цена"
spatialResolution: "пространственноеРазрешение"
override: "переопределение"
version: "version"
