# --- Карта языка: config.yml ---
# Сопоставляет внутренние ключи (слева) с именами, видимыми пользователю
# в config.yml (справа). Изменяйте только правую сторону, чтобы
# переименовать или перевести параметр; левая сторона является константой
# кода и не должна изменяться.
# Если этот файл отсутствует, плагин восстановит его с идентичными парами
# слева/справа (значения по умолчанию на английском).
database: "базаДанных"
playerCommands: "командыИгрока"
teleportCooldown: "задержкаТелепорта"
cancelDistance: "дистанцияОтмены"
teleportDelay: "отсрочкаТелепорта"
consoleCommands: "командыКонсоли"
version: "version"
network: "сеть"
