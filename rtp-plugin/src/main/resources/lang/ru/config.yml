# Отсрочка телепорта (секунды). 0 = сразу. Поддерживает единицы времени (например, 2s, 40t, 1500ms).
# Время, которое игрок должен ждать перед выполнением телепорта.
# Иногда даёт серверу время предзагрузить целевые чанки.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 2
отсрочкаТелепорта: 2

# Отмена при движении (блоки)
# Если игрок переместится дальше этой дистанции во время отсрочки,
# телепорт отменяется. Установите -1, чтобы отключить.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 2
дистанцияОтмены: 2

# Перезарядка между телепортами. Пропускается с rtp.nocooldown. Поддерживает единицы времени (например, 5m, 300s, 1h).
# Время, которое игрок должен ждать между успешными использованиями RTP.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 300
задержкаТелепорта: 300

# Максимальное число успешных использований /rtp, которое игрок может совершить в течение
# окна lockAfterResetSeconds, прежде чем будет заблокирован (аналог LockAfter из BetterRTP).
# 0 отключает ограничение. Обходится правом rtp.nolock.
# @type: integer
# @range: [0, null]
# @default: 0
lockAfterUses: 0

# Длина скользящего окна ограничения использований для lockAfterUses. Счётчик сбрасывается
# через столько секунд после первого использования в окне. 0 означает, что ограничение
# никогда не сбрасывается (жёсткий пожизненный лимит). Поддерживает единицы времени (например, 24h, 1d).
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 0
lockAfterResetSeconds: 0

# Если true, успешный /rtp устанавливает место приземления как постоянную
# точку возрождения игрока (аналог из BetterRTP).
# @type: boolean
# @default: false
setRespawnOnTeleport: false

# Команды после телепорта
# Список команд для выполнения после успешного телепорта.
# Маркер [player] представляет имя игрока.
# @type: list<string>
командыКонсоли:
  - "say [player] только что телепортировался случайно!"

# Команды, выполняемые от имени телепортированного игрока после успешного телепорта.
# Используйте [player] для имени игрока. Пустые записи игнорируются.
# @type: list<string>
командыИгрока:
  # Команды, выполняемые от имени телепортированного игрока после успешного телепорта.
  # Используйте [player] для имени игрока. Пустые записи игнорируются.
  # @type: list<string>
  - ""

# Обобщённый каркас меню.
# `renderer` — упорядоченный список предпочтений идентификаторов
# рендереров. При исключении или отсутствии адаптера каркас перебирает
# список и переходит к следующей записи. Когда список исчерпан, путь
# открытия страницы без токена возвращается к настраиваемому сообщению
# `menuInvalid`. Доступные id: book. (Чат-рендерер появится в одном из
# следующих выпусков и тогда будет добавлен в список по умолчанию.)
menu:
  # Ordered preference list of renderer ids.
  # @type: list<enum>
  # @options: ["book", "chat"]
  renderer:
    # Обобщённый каркас меню.
    # `renderer` — упорядоченный список предпочтений идентификаторов
    # рендереров. При исключении или отсутствии адаптера каркас перебирает
    # список и переходит к следующей записи. Когда список исчерпан, путь
    # открытия страницы без токена возвращается к настраиваемому сообщению
    # `menuInvalid`. Доступные id: book. (Чат-рендерер появится в одном из
    # следующих выпусков и тогда будет добавлен в список по умолчанию.)
    - "book"

# Глобальные значения по умолчанию, наследуемые файлами регионов/миров через токен "@config".
defaults:
  # Форма и размер области по умолчанию, используемые каждым регионом с формой "@config".
  #
  # РАЗМЕРЫ ЗДЕСЬ ПО УМОЛЧАНИЮ В ЧАНКАХ (1 чанк = 16 блоков):
  #   radius: 64   ->  1 024 блока от центра
  #   radius: 256  ->  4 096 блоков от центра   (значение по умолчанию ниже)
  #   radius: 625  -> 10 000 блоков от центра
  #
  # СУФФИКСЫ ПРОСТРАНСТВЕННЫХ ЕДИНИЦ:
  # Вы также можете указывать явные единицы прямо в radius, centerRadius и т. д.:
  #   radius: 4096b   (или 4096 blocks, 4096m)
  #   radius: 256c    (чанки)
  #   radius: 4r      (файлы регионов Anvil = 32 чанка = 512 блоков)
  #   radius: 5km     (километры = 5000 блоков)
  #
  # radius       = внешний край. Никто не приземлится дальше этого расстояния.
  # centerRadius = внутренний край / «дырка от бублика». Никто не приземлится ближе этого расстояния.
  #                Должен оставаться меньше radius, иначе не останется территории для выбора.
  shape:
    # Landing area shape algorithm.
    # @type: enum
    # @source: shape
    name: "CIRCLE"
    mode: "ACCUMULATE"
    radius: 256
    centerRadius: 64
    centerX: 0
    centerZ: 0
    weight: 1.0

    # Keep spots from being reused. 0 = off, 1 = the landing chunk, N = bigger square.
    uniquePlacements: 0
    expand: false

  # Default high/low landing window.
  vert:
    # Vertical placement algorithm.
    # @type: enum
    # @source: vert
    name: "LINEAR"
    minY: 32
    maxY: 255

    # Search order: 0 = bottom-up, 1 = top-down, 2 = middle-out, 3 = edges-in, else random.
    direction: 2
    requireSkyLight: true

  # How many safe spots to pre-calculate.
  cacheCap: 50

  # Extra unverified spots kept ready. 0 = off.
  backlogCacheCap: 1000

  # Max chunks kept loaded for instant teleports.
  activeChunkCap: 10

  # Bad-spot tracking precision (1-5).
  spatialResolution: 3

  # Whether regions/worlds need permission.
  requirePermission: false

# НЕ ИЗМЕНЯЙТЕ НОМЕР ВЕРСИИ
version: 3.1
