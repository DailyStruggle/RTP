# --- Настройки интеграций RTP ---
# Каждый переключатель заново выбирает точку назначения, если она оказывается внутри клейма/региона указанного плагина (действует только если этот плагин установлен).
# Заново выбирает местоположение, если оно оказывается внутри клейма плагина Factions.
# @type: boolean
# @default: false
rerollFactions: false

# Заново выбирает местоположение, если оно оказывается внутри клейма плагина GriefDefender.
# @type: boolean
# @default: false
rerollGriefDefender: false

# Заново выбирает местоположение, если оно оказывается внутри клейма плагина GriefPrevention.
# @type: boolean
# @default: false
rerollGriefPrevention: false

# Заново выбирает местоположение, если оно оказывается внутри клейма плагина HuskTowns.
# @type: boolean
# @default: false
rerollHuskTowns: false

# Заново выбирает местоположение, если оно оказывается внутри клейма плагина Lands.
# @type: boolean
# @default: false
rerollLands: false

# Заново выбирает местоположение, если оно оказывается внутри региона плагина RedProtect.
# @type: boolean
# @default: false
rerollRedProtect: false

# Заново выбирает местоположение, если оно оказывается внутри клейма плагина Towny Advanced.
# @type: boolean
# @default: false
rerollTownyAdvanced: false

# Заново выбирает местоположение, если оно оказывается внутри региона плагина WorldGuard.
# @type: boolean
# @default: false
rerollWorldGuard: false

# НЕ ТРОГАЙТЕ НОМЕР ВЕРСИИ
version: 1.0
