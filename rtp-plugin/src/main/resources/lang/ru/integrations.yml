# Reroll the location if it lands inside a SaberFactions claim.
# @type: boolean
# @default: false
rerollSaberFactions: false

# Reroll the location if it lands inside Factions territory reported via the FactionsBridge API.
# FactionsBridge bridges many Factions forks (FactionsUUID, SaberFactions, FactionsX, KingdomsX, ...)
# behind one API; enable this when the FactionsBridge plugin is installed.
# @type: boolean
# @default: false
rerollFactionsBridge: false

