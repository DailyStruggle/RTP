# --- Конфигурация производительности RTP ---
# Точная настройка плагина для производительности сервера.
# Максимальное число попыток поиска
# Сколько раз плагин будет искать безопасную локацию, прежде чем сдаться.
# Влияние: ВЫСОКОЕ - высокие значения могут сильно увеличить нагрузку на CPU.
# @type: integer
# @range: [1, null]
# @default: 32
максПопыток: 10

# Предзагрузка цели (чанки)
# Радиус чанков для предзагрузки вокруг цели.
# Число загруженных чанков = ( 1 + 2 * радиус )^2.
# Влияние: ВЫСОКОЕ - слишком высокое значение может вызвать падение TPS.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
дистанцияВидимостиВыбор: 0

# Chunk radius loaded around the final location immediately before
# teleport. 0 loads only the destination chunk.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
дистанцияВидимостиТелепорт: 0

# Частота выбора (тики игры)
# Время между поисками новых локаций для заполнения кэшей регионов.
# ( 20 тиков = 1 секунда ).
# Влияние: СРЕДНЕЕ - меньшие значения заполняют кэш быстрее, но используют больше CPU.
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
период: 20

# Выделенное время на задачу (миллисекунды)
# Максимальное время (мс), уделяемое задачам RTP за тик.
# Диапазон: 0 - 50.
# Влияние: СРЕДНЕЕ - высокие значения позволяют обрабатывать быстрее, но за счёт времени тика.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
выделенноеВремяСинхр: 50

# Maximum milliseconds per tick spent in asynchronous tasks.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
выделенноеВремяАсинхр: 50

# Минимальное требование TPS
# Минимальный TPS сервера перед постановкой новой локации в очередь кэша.
# Диапазон: 0.0 - 20.0.
# Влияние: НИЗКОЕ - не позволяет плагину добавлять лаг, когда серверу плохо.
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
минTPS: 19.0

# Постановка в очередь после телепорта
# Если true, плагин попытается заполнить кэш локаций сразу после RTP.
# Влияние: СРЕДНЕЕ
# @type: boolean
# @default: false
очередьПослеТелепорта: false

# Синхронная загрузка
# Использовать синхронную загрузку чанков для выбора локаций.
# Влияние: ВЫСОКОЕ - НЕ РЕКОМЕНДУЕТСЯ! Может вызвать серьёзные зависания сервера.
# @type: boolean
# @default: false
синхроннаяЗагрузка: false

# Разбор прав (запуск)
# onEventParsing: Несовместим с широкими правами вида *.*.
# Влияние: СРЕДНЕЕ (onEvent) / НИЗКОЕ (effect)
# @type: boolean
# @default: false
разборНаСобытие: false

# Parse effect permission nodes at startup.
# @type: boolean
# @default: true
разборЭффектов: true

# Кэш выбора биомов
# biomeRecall: Повторно использовать ранее найденные локации по биому.
# biomeRecallForced: Использовать только уже обнаруженные и закэшированные биомы.
# Влияние: НИЗКОЕ - СРЕДНЕЕ
# @type: boolean
# @default: true
запоминаниеБиома: true

# When set, only serve biome-filtered requests from cache (never
# generate new biome searches). Requires biomeRecall.
# @type: boolean
# @default: false
запоминаниеБиомаПринуд: false

# Bias biome-filtered selection so each requested biome is steered toward
# with equal probability, instead of in proportion to how much of the
# region it covers. Counteracts common biomes drowning out rare ones when
# several biomes are requested. Requires biomeRecall; no effect on
# unfiltered (default-biome) teleports.
# @type: boolean
# @default: false
biomeWeighted: false

# Per-biome relative selection weights for biome-filtered teleports.
# Only consulted when biomeWeighted is true. Biomes not listed here use
# weight 1.0, so an empty/all-equal map reproduces the equal-probability
# behavior of biomeWeighted on its own. A biome given weight 2.0 is
# steered toward roughly twice as often as a weight-1.0 biome among the
# requested set (when both are present in biome-recall memory); 0.0
# suppresses a biome. Requires biomeRecall; no effect on unfiltered
# (default-biome) teleports. The shipped plains entry is a weight-1.0
# no-op example - replace or extend it with the biomes you want to bias.
# @type: map<string, number>
biomeWeights:
  # @type: number
  # @range: [0.0, null]
  # @default: 1.0
  plains: 1.0

# Пассивная проверка чанков
# Ищет безопасные локации во всех загруженных чанках в пределах диапазона региона.
# Влияние: ВЫСОКОЕ - может значительно увеличить нагрузку при загрузке чанков.
# @type: boolean
# @default: false
проверкаПриЗагрузкеЧанка: false

# Режим заполнения кэша через наблюдение (Region Data Visitor)
# Когда кэш предгенерации заполнен, одна задача RegionCacheTask в режиме
# наблюдения планируется на регион согласно той же `period` заполнения кэша.
# Использует тот же конвейер LocationGenerator, что и стандартное
# заполнение кэша, но отбрасывает результирующего безопасного кандидата
# вместо постановки в очередь, так что побочные эффекты (запись плохих
# локаций, сбор наблюдаемых биомов) накапливаются в фоне без роста
# очереди сверх её предела. НИКОГДА не запускает генерацию мира: чанки,
# которых нет на диске, пропускаются пре-фильтром Anvil из с
# вердиктом UNKNOWN.
# visitorEnabled: главный переключатель (true включает режим наблюдения).
# Каденция наследуется от настройки `period` выше; отдельного параметра
# частоты нет.
# Влияние: НИЗКОЕ - ограничено существующим `period`; работа только
# когда у кэша нет места для заполнений в режиме по умолчанию.
# @type: boolean
# @default: false
visitorEnabled: true

# Поддерживать зарезервированный кэш для телепортов при входе (rtp.onevent.firstjoin / rtp.onevent.join). Размер по числу свободных слотов. См.
# @type: boolean
# @default: false
loginCacheEnabled: false

# Жёсткий предел кэша входа. 0 = авто (max-players сервера при запуске).
# @type: integer
# @range: [0, null]
# @default: 0
loginCacheCap: 0

# Probability of rejecting an ungenerated chunk per selection attempt.
# 0.0 = no bias (default), 1.0 = strictly avoid ungenerated land.
# Generated chunks always pass.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.0
pregeneratedPreference: 0.0

# Fraction of L3 backlog capacity at which refill resumes (hysteresis).
# 0.5 = refill only after L3 drains to 50% (default). 1.0 = refill
# continuously. Higher values group .mca-bin checks for better
# CPU/memory efficiency.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.5
backlogRefillThreshold: 0.5

# Latency threshold (ms) above which an immediately-served (unqueued) teleport
# is audited: a WARN is logged and the cumulative slowPipelineCount counter
# (surfaced by /rtp info) is incremented. Only immediate/unqueued teleports are
# audited; queued at-rate teleports are excluded because their measured time
# includes queue-wait. 0 or below disables the audit. See ADR-053.
# @type: integer
# @range: [0, null]
# @unit: ms
# @default: 5000
slowPipelineThresholdMs: 5000

# Public teleport-queue depth (players waiting) at or above which queue
# backpressure is audited: an edge-triggered WARN is logged and the cumulative
# queueGrowthWarnCount counter (surfaced by /rtp info) is incremented once per
# crossing. 0 or below disables the audit (opt-in). See ADR-053.
# @type: integer
# @range: [0, null]
# @unit: players
# @default: 0
queueGrowthWarnThreshold: 0
# Settings for /rtp admin prefab. The `apply` -> `confirm` flow writes
# each touched config file with a sibling backup named
# <file>.yml.bak.<epochMillis>; `bakRetention` caps how many such
# backups are kept per file, oldest pruned first. Set to 1 to keep only
# the most recent backup; values below 1 are clamped to 1. /rtp admin
# prefab rollback walks backups newest-first across multiple invocations.
prefab:
  # @type: integer
  # @range: [1, null]
  # @default: 3
  bakRetention: 3
# DO NOT TOUCH VERSION NUMBER
version: 1.0
