# --- Сообщения RTP (Русский) ---
# Перевод сообщений, видимых игроку и консоли.
# ВАЖНО:
# - Имена ключей в этом файле соответствуют правой колонке
# lang/ru/messages.lang.yml. Если ключ отсутствует в messages.lang.yml,
# используется английский ключ из базового файла.
# - Сохраняйте маркеры в квадратных скобках как есть: [P0], [delay],
# [attempts], [world], [region], [remainingCooldown], [scan_chunks], и т.д.
# - Сохраняйте цветовые коды &a &e &c и шестнадцатеричные (#2636ef).
маркеры:
  # P0
  - "[RTP]"

# ###############################################################################
# Section 2: Teleportation
# ###############################################################################
# when teleporting, say this
ужеТелепортируется: "&e[P0] вы уже телепортируетесь!"

# если плагин в данный момент перезагружается
телепортОтклонёнПерезагрузка: "&e[P0] телепорты временно отключены, пока плагин перезагружается. Попробуйте снова через несколько мгновений."
сообщениеОтсрочки: "&e[P0] Телепортация через [delay]. Не двигайтесь."
загрузкаЧанков: "&e[P0] Загрузка чанков, подождите..."
сообщениеТелепорта: "&e[P0] Телепортирован за [attempts] попыток, за [processingTime]"

# if teleport is cancelled
отменаТелепорта: "&e[P0] Телепорт отменён!"

# если после максимального числа попыток не найдено безопасных мест
# подстановка: [attempts] - максимальное число попыток
небезопасно: "&e[P0] безопасная локация не найдена за [attempts] попыток"

# когда у игрока действует задержка
# подстановка: [remainingCooldown] - оставшееся время
сообщениеПерезарядки: "&e[P0] Вы не можете телепортироваться снова в течение [remainingCooldown]"

# если у региона нет ожидающих локаций, а у игрока нет права rtp.unqueued
нетЛокацийВОчереди: "#f5eb73[P0] сейчас нет готовых локаций"

# когда очередь сдвигается
# подстановка: [spot] - текущая позиция в очереди
обновитьОчередь: "#2636ef[P0] ваша позиция в очереди: [spot]"

# если у игрока недостаточно денег для телепорта в регионе
# подстановка: [money] - сколько денег требует команда
недостаточноДенег: "&e[P0] вам нужно как минимум $[money] для этого."

# ###############################################################################
# Section 3: Time Formatting
# ###############################################################################
# for time placeholders, what to call days, hours, minutes, seconds, and milliseconds
дни: "д"
часы: "ч"
минуты: "м"
секунды: "с"
миллисекунды: "мс"

# ###############################################################################
# Section 4: System & Management
# ###############################################################################
# a configuration file 'version' is lower than the latest
# placeholder: [filename] - name of file, including file extension
старыйФайл: "&b[P0] обнаружен старый [filename]. Обновление"

# обнаружен мир bukkit, отсутствующий в файле конфигурации
# подстановка: [world] - обнаруженный мир
новыйМир: "&b[P0] обнаружен новый мир '[world]'"

# мир не существует в bukkit
# подстановка: [world] - имя мира
недопустимыйМир: "&e[P0] не удалось найти мир '[world]'"

# текст перезагрузки / обновления плагина
# подстановка: [filename] - имя файла
перезагрузка: "&b[P0] загрузка [filename]..."
перезагружено: "&b[P0] [filename] успешно загружен."
обновление: "&a[P0] обновление [filename]..."
обновлено: "&a[P0] [filename] успешно обновлён."

# плагин не содержит запрошенной команды
# подстановка: [arg] - переданный аргумент
неверныйАргумент: "&c[P0] недопустимый аргумент команды [arg]"

# когда консоль пытается выполнить команду, доступную только игрокам
командаКонсолиНеРазрешена: "&c[P0] Вы должны быть игроком в игре, чтобы выполнить эту команду."

# plugin is busy reloading
busy: "&c[P0] занят"

# plugin doesn't have the subcommand or parameter the user requested
# placeholder: [arg] - the argument attempted
invalidCommand: "&c[P0] недопустимая команда - [arg]"

# у пользователя нет прав на запрошенную команду
нетПрав: "&eИзвините, но у вас нет прав на выполнение этой команды. Свяжитесь с администраторами сервера, если считаете, что это ошибка."

# ###############################################################################
# Section 5: Administrative Logs
# ###############################################################################
# logged when locations are saved/loaded from database
# placeholder: [amount] - number of locations
# placeholder: [region] - name of region
локацияСохранена: "&e[P0] [amount] локаций успешно сохранены для [region]"
локацияЗагружена: "&e[P0] [amount] локаций успешно загружены для [region]"

# ###############################################################################
# Section 6: Scan Command
# ###############################################################################
# messages related to the scan command
# placeholder: [scan_regions] - list of regions
началоСканирования: "&a[P0] задача сканирования запущена для регионов: [scan_regions]"
сбросСканирования: "&e[P0] очередь сканирования сброшена для регионов: [scan_regions]"
отменитьСканирование: "&e[P0] задача сканирования отменена для регионов: [scan_regions]"
приостановитьСканирование: "#A020F0[P0] задача сканирования приостановлена для регионов: [scan_regions]"
продолжитьСканирование: "#10A5F5[P0] задача сканирования возобновлена для регионов: [scan_regions]"
сканированиеАктивно: "&c[P0] задача сканирования уже выполняется для регионов: [scan_regions]"
сканированиеНеАктивно: "&c[P0] нет выполняющейся задачи сканирования для регионов: [scan_regions]"
# placeholder: [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
статусСканирования: "&a[P0] завершено [scan_chunks] / [scan_totalChunks] чанков для регионов: [scan_regions]. [scan_cps] cps. Процент земли: [scan_landPercentage]%. Оставшееся время: [scan_eta]"

# ###############################################################################
# Section 7: Info Command
# ###############################################################################
# messages related to the info command
заголовокИнфо: "&a======Информация RTP======"
инфоТикеты: "&7Активные тикеты чанков (глобально): &f[tickets]"
инфоТелепорты: ""
инфоMSPT: ""
инфоВсегоЗагрузок: "&7Чанков загружено за всё время: &f[loads]"
инфоЗагрузкиПоИсточнику: "&7Загрузки по источнику: &f[loadsByOrigin]"
инфоЧастотаУтечек: "&7Текущая частота утечек чанков: &f[leakRate]"
# --- Metrics SPI health block (METRICS_PLAN.md > /rtp info Surface) ---
infoQueueDepth: "&7Игроков в очередях регионов: &f[queueDepth]"
infoPendingTeleports: "&7Ожидающих конвейеров телепорта: &f[pendingTeleports]"
infoAvgPipelineMs: "&7Avg Pipeline Latency: &f[avgPipelineMs] ms"
infoHeap: "&7Heap JVM: &f[heapUsedMb] / [heapMaxMb] MiB"
# Строка заголовка блока Health pipeline в /rtp info.
infoHealthPipelineHeader: "&7--- Health: pipeline ---"
# Показания TPS для окон 1m / 5m / 15m. Подстановки: [tps1m] [tps5m] [tps15m].
infoTps: "&7TPS (1m/5m/15m): &f[tps1m] / [tps5m] / [tps15m]"
# Текущий MSPT сервера и загрузка бюджета тика. Подстановки: [mspt] [tickBudgetUtilisation].
infoMSPTLive: "&7Server MSPT: &f[mspt] ms (&7tick budget: &f[tickBudgetUtilisation]&7)"
# Configured player soft-cap vs current online count. Placeholders: [softCap] [playerCount].
infoSoftCap: "&7Players: &f[playerCount] / [softCap]"
# Последняя задержка обращения к базе данных в мс. Подстановка: [databaseLatencyMs].
infoDatabaseLatencyMs: "&7Database Latency: &f[databaseLatencyMs] ms"
# Health colour-band thresholds. Doubles consumed by ColourBands in rtp-core
# to wrap coloured-variant placeholders (e.g. [tps1mColoured]) with &a/&e/&c.
infoThresholdTpsGreen: 19.5
infoThresholdTpsYellow: 18.0
infoThresholdMsptGreen: 30.0
infoThresholdMsptYellow: 45.0
infoThresholdCacheFillGreen: 0.5
infoThresholdCacheFillYellow: 0.25
infoThresholdNetworkAgeYellow: 5.0
# Header line introducing the per-Folia-region table (Folia runtime only).
infoFoliaRegionsHeader: "&7--- Folia regions ---"
# Per-row template for a single Folia region. Placeholders: [regionId] [tps1m]
# [mspt] [playerCount] [queueDepth] [tickBudgetUtilisation].
infoFoliaRegion: "  &f[regionId]&7: tps=&f[tps1m]&7 mspt=&f[mspt]&7 players=&f[playerCount]&7 queue=&f[queueDepth]&7 budget=&f[tickBudgetUtilisation]"
заголовокПримечанияИнфо: "&7--- Диагностическое примечание ---"
примечаниеИнфо: "&7Диагностика: Если общее число потерянных чанков сервера превышает исторический итог загрузок этого плагина ([loads]), этот плагин не единственная причина утечки памяти."
заголовокМираИнфо: "#008080Миры:"
заголовокМираКонсолиИнфо: "&7--- Миры ---"
инфоМир: "  #21ADA8[world]"
заголовокРегионаИнфо: "#63C5DAРегионы:"
заголовокРегионаКонсолиИнфо: "&7--- Регионы ---"
инфоРегион: "  #52B2BF[region]"

# sub-info listings
# placeholders: [world], [region], [requirePermission], [override], [shape], [worldBorderOverride], [cacheCap], [cached], [keptCache], [unkeptCache], [backlogCache], [backlogCacheCap]
данныеМира:
  - "#21ADA8[world]:"
  - "#99EEBB  - регион: [region]"
  - "#99EEBB  - требуетсяПраво: [requirePermission]"
  - "#99EEBB  - переопределение: [override]"

данныеРегиона:
  - "#52B2BF[region]:"
  - "#58CCED  - мир: [world]"
  - "#58CCED  - форма: [shape]"
  - "#58CCED  - требуетсяПраво: [requirePermission]"
  - "#58CCED  - переопределениеГраницы: [worldBorderOverride]"
  - "#58CCED  - размерКэша: [cacheCap]"
  - "#58CCED  - удержанныйКэш (L1): [keptCache]"
  - "#58CCED  - освобождённыйКэш (L2): [unkeptCache]"
  - "#58CCED  - накопленныйКэш (L3): [backlogCache] / [backlogCacheCap]"
  - "#58CCED  - вКэше: [cached]"

