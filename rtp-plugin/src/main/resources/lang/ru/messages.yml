# ###############################################################################
# Section 0: Подстановочные значения
# ###############################################################################
# Перевод сообщений, видимых игроку и консоли.
# ВАЖНО:
# - Имена ключей в этом файле соответствуют правой колонке
# lang/ru/messages.lang.yml. Если ключ отсутствует в messages.lang.yml,
# используется английский ключ из базового файла.
# - Сохраняйте маркеры в квадратных скобках как есть: [P0], [delay],
# [attempts], [world], [region], [remainingCooldown], [scan_chunks], и т.д.
# - Сохраняйте цветовые коды &a &7 &c и шестнадцатеричные (#2636ef).
маркеры:
  # P0
  - "[RTP]"

# ###############################################################################
# Section 1: Teleportation
# ###############################################################################
# when teleporting, say this
ужеТелепортируется: "&7[P0] ⚡ вы уже телепортируетесь!"

# если плагин в данный момент перезагружается
телепортОтклонёнПерезагрузка: "&7[P0] телепорты временно отключены, пока плагин перезагружается. Попробуйте снова через несколько мгновений."
сообщениеОтсрочки: "<gradient:#9D7CD8:#5FB3B3>[P0] ⚡ Телепортация через [delay]. Не двигайтесь.</gradient>"
загрузкаЧанков: "&7[P0] ⚙ Загрузка чанков, подождите..."
сообщениеТелепорта: "<gradient:#5FB3B3:#9D7CD8>[P0] ⚡ Телепортирован за [attempts] попыток, за [processingTime]</gradient>"

# if teleport is cancelled
отменаТелепорта: "&7[P0] ⚡ Телепорт отменён!"

# Sent when the optional PvP combat check refuses /rtp because the player is in combat
pvpInCombat: "&c[P0] Нельзя телепортироваться случайно во время боя."

# если после максимального числа попыток не найдено безопасных мест
# подстановка: [attempts] - максимальное число попыток
небезопасно: "&7[P0] ⌖ безопасная локация не найдена за [attempts] попыток"

# когда у игрока действует задержка
# подстановка: [remainingCooldown] - оставшееся время
сообщениеПерезарядки: "&7[P0] ⚡ Вы не можете телепортироваться снова в течение [remainingCooldown]"

# when the player has reached the lockAfterUses cap and is locked out (BetterRTP LockAfter parity)
lockedAfterUses: "&7[P0] ⌖ Вы достигли лимита случайных телепортаций. Попробуйте снова через [remainingLockTime]."

# если у региона нет ожидающих локаций, а у игрока нет права rtp.unqueued
нетЛокацийВОчереди: "#f5eb73[P0] ⌖ сейчас нет готовых локаций"

# когда очередь сдвигается
# подстановка: [spot] - текущая позиция в очереди
обновитьОчередь: "#2636ef[P0] ваша позиция в очереди: [spot]"

# если у игрока недостаточно денег для телепорта в регионе
# подстановка: [money] - сколько денег требует команда
недостаточноДенег: "&7[P0] вам нужно как минимум $[money] для этого."

# ###############################################################################
# Section 2: Отклик команд
# ###############################################################################
# мир не существует в bukkit
# подстановка: [world] - имя мира
недопустимыйМир: "&7[P0] не удалось найти мир '[world]'"

# плагин не содержит запрошенной команды
