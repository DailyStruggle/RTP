# --- Сообщения RTP (Русский) ---
# Перевод сообщений, видимых игроку и консоли.
# ВАЖНО:
# - Имена ключей в этом файле соответствуют правой колонке
# lang/ru/messages.lang.yml. Если ключ отсутствует в messages.lang.yml,
# используется английский ключ из базового файла.
# - Сохраняйте маркеры в квадратных скобках как есть: [P0], [delay],
# [attempts], [world], [region], [remainingCooldown], [scan_chunks], и т.д.
# - Сохраняйте цветовые коды &a &7 &c и шестнадцатеричные (#2636ef).
маркеры:
  # P0
  - "[RTP]"

# ###############################################################################
# Section 2: Teleportation
# ###############################################################################
# when teleporting, say this
ужеТелепортируется: "&7[P0] вы уже телепортируетесь!"

# если плагин в данный момент перезагружается
телепортОтклонёнПерезагрузка: "&7[P0] телепорты временно отключены, пока плагин перезагружается. Попробуйте снова через несколько мгновений."
сообщениеОтсрочки: "&7[P0] Телепортация через [delay]. Не двигайтесь."
загрузкаЧанков: "&7[P0] Загрузка чанков, подождите..."
сообщениеТелепорта: "&7[P0] Телепортирован за [attempts] попыток, за [processingTime]"

# if teleport is cancelled
отменаТелепорта: "&7[P0] Телепорт отменён!"

# если после максимального числа попыток не найдено безопасных мест
# подстановка: [attempts] - максимальное число попыток
небезопасно: "&7[P0] безопасная локация не найдена за [attempts] попыток"

# когда у игрока действует задержка
# подстановка: [remainingCooldown] - оставшееся время
сообщениеПерезарядки: "&7[P0] Вы не можете телепортироваться снова в течение [remainingCooldown]"

# если у региона нет ожидающих локаций, а у игрока нет права rtp.unqueued
нетЛокацийВОчереди: "#f5eb73[P0] сейчас нет готовых локаций"

# когда очередь сдвигается
# подстановка: [spot] - текущая позиция в очереди
обновитьОчередь: "#2636ef[P0] ваша позиция в очереди: [spot]"

# если у игрока недостаточно денег для телепорта в регионе
# подстановка: [money] - сколько денег требует команда
недостаточноДенег: "&7[P0] вам нужно как минимум $[money] для этого."

# ###############################################################################
# Section 3: Time Formatting
# ###############################################################################
# for time placeholders, what to call days, hours, minutes, seconds, and milliseconds
дни: "д"
часы: "ч"
минуты: "м"
секунды: "с"
миллисекунды: "мс"

# ###############################################################################
# Section 4: System & Management
# ###############################################################################
# a configuration file 'version' is lower than the latest
# placeholder: [filename] - name of file, including file extension
старыйФайл: "&b[P0] обнаружен старый [filename]. Обновление"

# обнаружен мир bukkit, отсутствующий в файле конфигурации
# подстановка: [world] - обнаруженный мир
новыйМир: "&b[P0] обнаружен новый мир '[world]'"

# мир не существует в bukkit
# подстановка: [world] - имя мира
недопустимыйМир: "&7[P0] не удалось найти мир '[world]'"

# текст перезагрузки / обновления плагина
# подстановка: [filename] - имя файла
перезагрузка: "&b[P0] загрузка [filename]..."
перезагружено: "&b[P0] [filename] успешно загружен."
обновление: "&a[P0] обновление [filename]..."
обновлено: "&a[P0] [filename] успешно обновлён."

# плагин не содержит запрошенной команды
# подстановка: [arg] - переданный аргумент
неверныйАргумент: "&c[P0] недопустимый аргумент команды [arg]"

# когда консоль пытается выполнить команду, доступную только игрокам
командаКонсолиНеРазрешена: "&c[P0] Вы должны быть игроком в игре, чтобы выполнить эту команду."

# plugin is busy reloading
busy: "&c[P0] занят"

# plugin doesn't have the subcommand or parameter the user requested
# placeholder: [arg] - the argument attempted
invalidCommand: "&c[P0] недопустимая команда - [arg]"

# у пользователя нет прав на запрошенную команду
нетПрав: "&7Извините, но у вас нет прав на выполнение этой команды. Свяжитесь с администраторами сервера, если считаете, что это ошибка."

# ###############################################################################
# Section 5: Administrative Logs
# ###############################################################################
# logged when locations are saved/loaded from database
# placeholder: [amount] - number of locations
# placeholder: [region] - name of region
локацияСохранена: "&7[P0] [amount] локаций успешно сохранены для [region]"
локацияЗагружена: "&7[P0] [amount] локаций успешно загружены для [region]"

# ###############################################################################
# Section 6: Scan Command
# ###############################################################################
# messages related to the scan command
# placeholder: [scan_regions] - list of regions
началоСканирования: "&a[P0] задача сканирования запущена для регионов: [scan_regions]"
сбросСканирования: "&7[P0] очередь сканирования сброшена для регионов: [scan_regions]"
отменитьСканирование: "&7[P0] задача сканирования отменена для регионов: [scan_regions]"
приостановитьСканирование: "#A020F0[P0] задача сканирования приостановлена для регионов: [scan_regions]"
продолжитьСканирование: "#10A5F5[P0] задача сканирования возобновлена для регионов: [scan_regions]"
сканированиеАктивно: "&c[P0] задача сканирования уже выполняется для регионов: [scan_regions]"
сканированиеНеАктивно: "&c[P0] нет выполняющейся задачи сканирования для регионов: [scan_regions]"
# placeholder: [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
статусСканирования: "&a[P0] завершено [scan_chunks] / [scan_totalChunks] чанков для регионов: [scan_regions]. [scan_cps] cps. Процент земли: [scan_landPercentage]%. Оставшееся время: [scan_eta]"

