# --- Карта языка: economy.yml ---
# Сопоставляет внутренние ключи (слева) с именами, видимыми пользователю
# в economy.yml (справа). Изменяйте только правую сторону; левая сторона
# является константой кода и не должна изменяться.
# Если этот файл отсутствует, плагин восстановит его с идентичными
# парами слева/справа (значения по умолчанию на английском).
balanceFloor: "минимальныйБаланс"
price: "цена"
priceOther: "ценаДругого"
refundOnCancel: "возвратПриОтмене"
biomePrice: "ценаБиома"
paramsPrice: "ценаПараметров"
version: "version"
