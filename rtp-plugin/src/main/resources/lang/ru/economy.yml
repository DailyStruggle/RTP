# --- Экономическая конфигурация RTP ---
# Настраивает стоимость случайного телепорта через экономику сервера.
# Стоимость телепорта
# Базовая стоимость стандартной команды /rtp.
# @type: number
# @range: [0.0, null]
# @default: 50.0
цена: 50.0

# Стоимость телепорта другого игрока (/rtp <игрок>).
# @type: number
# @range: [0.0, null]
# @default: 200.0
ценаДругого: 200.0

# Стоимость использования пользовательских параметров (/rtp region:<регион>, и т.д.).
# @type: number
# @range: [0.0, null]
# @default: 1000000000.0
ценаПараметров: 1000000000.0

# Дополнительная стоимость за указание биома (/rtp biome:<биом>).
# @type: number
# @range: [0.0, null]
# @default: 5000.0
ценаБиома: 5000.0

# Возвращает стоимость, если телепортация отменена (игрок двигается, сбой и т. д.).
# @type: boolean
# @default: true
возвратПриОтмене: true

# Минимальный баланс, который игрок должен сохранить после оплаты; телепортация
# отклоняется, если баланс упадёт ниже этого порога.
# @type: number
# @range: [0.0, null]
# @default: 0.0
минимальныйБаланс: 0.0

# НЕ ИЗМЕНЯЙТЕ НОМЕР ВЕРСИИ
version: 1.0
