# --- Экономическая конфигурация RTP ---
# Настраивает стоимость случайного телепорта через экономику сервера.
# Политика возврата
# Указывает, возвращается ли цена и сбрасывается ли кулдаун при отмене телепорта.
# @type: boolean
# @default: true
возвратПриОтмене: true

# Стоимость телепорта
# Базовая стоимость стандартной команды /rtp.
# @type: number
# @range: [0.0, null]
# @default: 50.0
цена: 50.0

# Стоимость телепорта другого игрока (/rtp <игрок>).
# @type: number
# @range: [0.0, null]
# @default: 200.0
ценаДругого: 200.0

# Стоимость использования пользовательских параметров (/rtp region:<регион>, и т.д.).
# @type: number
# @range: [0.0, null]
# @default: 1000000000.0
ценаПараметров: 1000000000.0

# Дополнительная стоимость за указание биома (/rtp biome:<биом>).
# @type: number
# @range: [0.0, null]
# @default: 5000.0
ценаБиома: 5000.0

# Минимальный требуемый баланс.
# Игроки не могут опуститься ниже этого баланса при использовании RTP.
# @type: number
# @range: [0.0, null]
# @default: 0.0
минимальныйБаланс: 0.0

# НЕ ИЗМЕНЯЙТЕ НОМЕР ВЕРСИИ
version: 1.0
