# --- Карта языка: performance.yml ---
# Сопоставляет внутренние ключи (слева) с именами, видимыми пользователю
# в performance.yml (справа). Изменяйте только правую сторону; левая
# сторона является константой кода и не должна изменяться.
# Если этот файл отсутствует, плагин восстановит его с идентичными
# парами слева/справа (значения по умолчанию на английском).
period: "период"
viewDistanceSelect: "дистанцияВидимостиВыбор"
