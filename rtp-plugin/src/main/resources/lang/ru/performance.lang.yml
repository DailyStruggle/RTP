version: "version"
maxAttempts: "максПопыток"
biomeRecallForced: "запоминаниеБиомаПринуд"
onEventParsing: "разборНаСобытие"
checkOnChunkLoads: "проверкаПриЗагрузкеЧанка"
postTeleportQueueing: "очередьПослеТелепорта"
syncLoading: "синхроннаяЗагрузка"
effectParsing: "разборЭффектов"
viewDistanceTeleport: "дистанцияВидимостиТелепорт"
minTPS: "минTPS"
syncAllottedTime: "выделенноеВремяСинхр"
asyncAllottedTime: "выделенноеВремяАсинхр"
