# --- Сообщения RTP (этот язык) ---
# Тексты сообщений для игроков и операторов на этом языке, сгруппированные по темам.
# Автоматически созданная копия английских сообщений; не редактировать вручную (будет перезаписано).

# ###############################################################################
# Раздел 4: Системные и управленческие сообщения
# ###############################################################################
# версия файла конфигурации ниже последней
# плейсхолдер: [filename] - имя файла, включая расширение файла
старыйФайл: "&b[P0] обнаружен старый [filename]. Обновление"

# обнаружен мир bukkit, отсутствующий в файле конфигурации
# подстановка: [world] - обнаруженный мир
новыйМир: "&b[P0] обнаружен новый мир '[world]'"

# текст перезагрузки / обновления плагина
# подстановка: [filename] - имя файла
перезагрузка: "&b[P0] загрузка [filename]..."
перезагружено: "&b[P0] [filename] успешно загружен."
обновление: "&a[P0] обновление [filename]..."
обновлено: "&a[P0] [filename] успешно обновлён."

# ###############################################################################
# Раздел 5: Административные журналы
# ###############################################################################
# записывается при сохранении/загрузке локаций из базы данных
# плейсхолдер: [amount] - количество локаций
# плейсхолдер: [region] - имя региона
локацияСохранена: "&7[P0] [amount] локаций успешно сохранены для [region]"
локацияЗагружена: "&7[P0] [amount] локаций успешно загружены для [region]"

# ###############################################################################
# Раздел 11: Метаданные
# ###############################################################################
# НЕ ИЗМЕНЯЙТЕ НОМЕР ВЕРСИИ
version: 1.0

# ###############################################################################
# Раздел 12: Параметры для разработчиков
# ###############################################################################
# установите в true, чтобы добавлять тег разработчика (например, §8(RTP:ClassName)) к каждому сообщению
показатьТэгРазработчика: false
