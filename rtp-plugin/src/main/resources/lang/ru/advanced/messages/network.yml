# --- Сообщения RTP (этот язык) ---
# Тексты сообщений для игроков и операторов на этом языке, сгруппированные по темам.
# Автоматически созданная копия английских сообщений; не редактировать вручную (будет перезаписано).

# --- Межсерверные сообщения сетевого режима ---
# Отправляются только когда `network.enabled: true` и команда `/rtp` игрока маршрутизируется
# через межсерверную очередь ожидания (см. `routing.mode` в network.yml).
# Все ключи опциональны с точки зрения игрока — базовый цикл
# `delayMessage` / `teleportMessage` по-прежнему управляет видимым процессом.
# Отправляется, когда запрос принят в межсерверную очередь ожидания
# и ожидает выделения бэкендом. Плейсхолдер: [position] - позиция с
# отсчётом от 0 из `pollStatus`; может быть пустым, если транспорт
# не возвращает позицию.
networkQueued: "&7[P0] в очереди на межсерверное назначение (позиция [position])..."

# Отправляется, когда игрок выполняет /rtp, уже находясь в межсерверной очереди.
# Плейсхолдер: [position] - позиция в очереди; может быть пустым.
alreadyQueued: "&cВы уже ожидаете в межсерверной очереди (позиция [position]). Пожалуйста, подождите."

# Отправляется, когда запись в межсерверной очереди слишком долго ожидала и была сброшена.
# Без плейсхолдеров.
networkTimedOut: "&c[P0] межсерверная телепортация истекла по времени в ожидании сервера."

# Отправляется, когда межсерверная очередь заполнена и запрос отклонён.
# Без плейсхолдеров.
waitlistFull: "&c[P0] межсерверная очередь заполнена; попробуйте снова чуть позже."

# Отправляется, когда очередь передала запрос прокси-маршрутизатору и
# выполняется выбор бэкенда.
networkRouting: "&7[P0] маршрутизация на сервер..."

# Отправляется, когда бэкенд зарезервировал координату для этого игрока и
# прокси готов начать межсерверный переход. Плейсхолдер: [server]
# - serverId целевого бэкенда.
networkReserved: "&a[P0] координата зарезервирована на [server]. Перенос..."

# Отправляется во время перехода через прокси. Плейсхолдер: [server] - назначение.
networkTransferring: "&a[P0] перенос на [server]..."

# Отправляется, когда межсерверный путь был прерван и произошёл откат к локальному серверу.
# Плейсхолдер: [reason] - причина отката.
networkFallback: "&e[P0] межсерверный режим недоступен ([reason]); возврат к локальному."

# Отправляется, когда межсерверный запрос не удался и откат невозможен.
# Плейсхолдер: [reason] - причина сбоя.
networkFailed: "&c[P0] межсерверная телепортация не удалась: [reason]."

# Отправляется, когда игрок запросил конкретный регион (`/rtp <region>`), но
# ни один бэкенд в сети сейчас его не обслуживает. Плейсхолдер:
# [region] - имя запрошенного региона.
networkRegionUnavailable: "&c[P0] сейчас ни один сервер не обслуживает регион '[region]'."

# Отправляется, когда имя запрошенного региона соответствует двум или более бэкендам и
# политика, настроенная оператором, не может выбрать один из них (срабатывает
# только при более строгих политиках, чем значение по умолчанию `warn`). Плейсхолдер: [region].
networkRegionAmbiguous: "&c[P0] регион '[region]' неоднозначен среди серверов; укажите сервер."

# НЕ ИЗМЕНЯЙТЕ НОМЕР ВЕРСИИ
version: 1.0
