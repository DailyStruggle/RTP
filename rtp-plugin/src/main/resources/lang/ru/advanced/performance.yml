# --- Конфигурация производительности RTP ---
# Точная настройка плагина для производительности сервера.
# Максимальное число попыток поиска
# Сколько раз плагин будет искать безопасную локацию, прежде чем сдаться.
# Влияние: ВЫСОКОЕ - высокие значения могут сильно увеличить нагрузку на CPU.
# @type: integer
# @range: [1, null]
# @default: 32
максПопыток: 10

# Предзагрузка цели (чанки)
# Радиус чанков для предзагрузки вокруг цели.
# Число загруженных чанков = ( 1 + 2 * радиус )^2.
# Влияние: ВЫСОКОЕ - слишком высокое значение может вызвать падение TPS.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
дистанцияВидимостиВыбор: 0

# Радиус чанков, загружаемых вокруг конечной точки непосредственно перед
# телепортацией. 0 загружает только чанк назначения.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
дистанцияВидимостиТелепорт: 0

# Общее число тиков, в течение которых дальность прорисовки
# телепортированного игрока плавно восстанавливается после прибытия. При
# телепортации дальность ненадолго снижается до радиуса
# viewDistanceTeleport (минимум 2), чтобы при размещении игрока сервер
# загружал лишь небольшое кольцо чанков, а затем поднимается обратно за
# эти тики. Это сглаживает всплеск загрузки чанков, способный застопорить
# тик на слабых хостах. 0 отключает ограничение. Не действует, если
# viewDistanceTeleport уже равен дальности прорисовки игрока или больше.
# @type: integer
# @range: [0, null]
# @unit: ticks
# @default: 200
интервалВосстановленияВидимости: 200

# Частота выбора (тики игры)
# Время между поисками новых локаций для заполнения кэшей регионов.
# ( 20 тиков = 1 секунда ).
# Влияние: СРЕДНЕЕ - меньшие значения заполняют кэш быстрее, но используют больше CPU.
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
период: 20

# Выделенное время на задачу (миллисекунды)
# Максимальное время (мс), уделяемое задачам RTP за тик.
# Диапазон: 0 - 50.
# Влияние: СРЕДНЕЕ - высокие значения позволяют обрабатывать быстрее, но за счёт времени тика.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
выделенноеВремяСинхр: 50

# Максимум миллисекунд за тик на асинхронные задачи.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
выделенноеВремяАсинхр: 50

# Минимальное требование TPS
# Минимальный TPS сервера перед постановкой новой локации в очередь кэша.
# Диапазон: 0.0 - 20.0.
# Влияние: НИЗКОЕ - не позволяет плагину добавлять лаг, когда серверу плохо.
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
минTPS: 19.0

# Максимальное использование кучи JVM (процент от максимальной кучи), при
# котором приостанавливается фоновое наполнение кэша. Каждая закэшированная
# точка удерживает чанк, поэтому неограниченное наполнение на сервере с
# небольшой кучей может ввести JVM в постоянную сборку мусора и сделать сервер
# неотзывчивым без каких-либо ошибок в консоли. Пока использование находится на
# уровне этого порога или выше, RTP прекращает пополнять кэш точек, но
# продолжает выдавать уже закэшированные точки ожидающим игрокам. 0 или 100
# отключает ограничение.
# @type: number
# @range: [0.0, 100.0]
# @default: 85.0
maxHeapПроцент: 85.0

# Постановка в очередь после телепорта
# Если true, плагин попытается заполнить кэш локаций сразу после RTP.
# Влияние: СРЕДНЕЕ
# @type: boolean
# @default: false
очередьПослеТелепорта: false

# Синхронная загрузка
# Использовать синхронную загрузку чанков для выбора локаций.
# Влияние: ВЫСОКОЕ - НЕ РЕКОМЕНДУЕТСЯ! Может вызвать серьёзные зависания сервера.
# @type: boolean
# @default: false
синхроннаяЗагрузка: false

# Разбор прав (запуск)
# onEventParsing: Несовместим с широкими правами вида *.*.
# Влияние: СРЕДНЕЕ (onEvent) / НИЗКОЕ (effect)
# @type: boolean
# @default: false
разборНаСобытие: false

# Разбирать узлы прав эффектов при запуске.
# @type: boolean
# @default: true
разборЭффектов: true

# Кэш выбора биомов
# biomeRecall: Повторно использовать ранее найденные локации по биому.
# biomeRecallForced: Использовать только уже обнаруженные и закэшированные биомы.
# Влияние: НИЗКОЕ - СРЕДНЕЕ
# @type: boolean
# @default: true
запоминаниеБиома: true

# Если включено, запросы с фильтром по биому обслуживаются только из кэша
# (новые поиски биомов не запускаются). Требует biomeRecall.
# @type: boolean
# @default: false
запоминаниеБиомаПринуд: false

# Смещает отбор с фильтром по биому так, чтобы каждый запрошенный биом выбирался
# с равной вероятностью, а не пропорционально занимаемой им части региона.
# Не даёт распространённым биомам вытеснять редкие, когда запрошено несколько
# биомов. Требует biomeRecall; не влияет на телепортацию без фильтра
# (биом по умолчанию).
# @type: boolean
# @default: false
взвешиваниеБиома: false

# Per-biome relative selection weights for biome-filtered teleports.
# Only consulted when biomeWeighted is true. Biomes not listed here use
# weight 1.0, so an empty/all-equal map reproduces the equal-probability
# behavior of biomeWeighted on its own. A biome given weight 2.0 is
# steered toward roughly twice as often as a weight-1.0 biome among the
# requested set (when both are present in biome-recall memory); 0.0
# suppresses a biome. Requires biomeRecall; no effect on unfiltered
# (default-biome) teleports. The shipped plains entry is a weight-1.0
# no-op example - replace or extend it with the biomes you want to bias.
# @type: map<string, number>
весаБиома:
  # Относительный вес выбора для этого биома (1.0 = без смещения).
  # @type: number
  # @range: [0.0, null]
  # @default: 1.0
  plains: 1.0
  sunflower_plains: 1.0
  snowy_plains: 1.0
  ice_spikes: 1.0
  desert: 1.0
  swamp: 1.0
  mangrove_swamp: 1.0
  forest: 1.0
  flower_forest: 1.0
  birch_forest: 1.0
  dark_forest: 1.0
  old_growth_birch_forest: 1.0
  old_growth_pine_taiga: 1.0
  old_growth_spruce_taiga: 1.0
  taiga: 1.0
  snowy_taiga: 1.0
  savanna: 1.0
  savanna_plateau: 1.0
  windswept_hills: 1.0
  windswept_gravelly_hills: 1.0
  windswept_forest: 1.0
  windswept_savanna: 1.0
  jungle: 1.0
  sparse_jungle: 1.0
  bamboo_jungle: 1.0
  badlands: 1.0
  eroded_badlands: 1.0
  wooded_badlands: 1.0
  meadow: 1.0
  cherry_grove: 1.0
  pale_garden: 1.0
  grove: 1.0
  snowy_slopes: 1.0
  frozen_peaks: 1.0
  jagged_peaks: 1.0
  stony_peaks: 1.0
  river: 1.0
  frozen_river: 1.0
  beach: 1.0
  snowy_beach: 1.0
  stony_shore: 1.0
  warm_ocean: 1.0
  lukewarm_ocean: 1.0
  deep_lukewarm_ocean: 1.0
  ocean: 1.0
  deep_ocean: 1.0
  cold_ocean: 1.0
  deep_cold_ocean: 1.0
  frozen_ocean: 1.0
  deep_frozen_ocean: 1.0
  mushroom_fields: 1.0
  dripstone_caves: 1.0
  lush_caves: 1.0
  deep_dark: 1.0
  # --- Незер ---
  nether_wastes: 1.0
  warped_forest: 1.0
  crimson_forest: 1.0
  soul_sand_valley: 1.0
  basalt_deltas: 1.0
  # --- Энд ---
  the_end: 1.0
  end_highlands: 1.0
  end_midlands: 1.0
  small_end_islands: 1.0
  end_barrens: 1.0
  # --- Прочее / техническое ---
  the_void: 1.0

# Пассивная проверка чанков
# Ищет безопасные локации во всех загруженных чанках в пределах диапазона региона.
# Влияние: ВЫСОКОЕ - может значительно увеличить нагрузку при загрузке чанков.
# @type: boolean
# @default: true
проверкаПриЗагрузкеЧанка: true

# Режим заполнения кэша через наблюдение (Region Data Visitor)
# Когда кэш предгенерации заполнен, одна задача RegionCacheTask в режиме
# наблюдения планируется на регион согласно той же `period` заполнения кэша.
# Использует тот же конвейер LocationGenerator, что и стандартное
# заполнение кэша, но отбрасывает результирующего безопасного кандидата
# вместо постановки в очередь, так что побочные эффекты (запись плохих
# локаций, сбор наблюдаемых биомов) накапливаются в фоне без роста
# очереди сверх её предела. НИКОГДА не запускает генерацию мира: чанки,
# которых нет на диске, пропускаются пре-фильтром Anvil из с
# вердиктом UNKNOWN.
# visitorEnabled: главный переключатель (true включает режим наблюдения).
# Каденция наследуется от настройки `period` выше; отдельного параметра
# частоты нет.
# Влияние: НИЗКОЕ - ограничено существующим `period`; работа только
# когда у кэша нет места для заполнений в режиме по умолчанию.
# @type: boolean
# @default: false
посетительВключен: true

# Поддерживать зарезервированный кэш для телепортов при входе (rtp.onevent.firstjoin / rtp.onevent.join). Размер по числу свободных слотов. См.
# @type: boolean
# @default: false
кэшВходаВключен: false

# Жёсткий предел кэша входа. 0 = авто (max-players сервера при запуске).
# @type: integer
# @range: [0, null]
# @default: 0
пределКэшаВхода: 0

# Вероятность отклонить несгенерированный чанк за попытку выбора.
# 0.0 = без смещения (по умолчанию), 1.0 = строго избегать несгенерированной земли.
# Сгенерированные чанки всегда проходят.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.0
предпочтениеПредген: 0.0

# Доля ёмкости L3-очереди, при которой возобновляется пополнение
# (гистерезис). 0.5 = пополнять только после опустошения L3 до 50% (по умолчанию).
# 1.0 = пополнять непрерывно. Большие значения группируют проверки
# .mca-бинов для лучшей эффективности ЦП/памяти.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.5
порогПополненияBacklog: 0.5

# Порог задержки (мс), выше которого немедленно обслуженная (без очереди)
# телепортация проверяется: записывается WARN и увеличивается накопительный
# счётчик slowPipelineCount (показывается в /rtp info). Проверяются только
# немедленные/внеочередные телепортации; очередные исключаются, так как их
# измеренное время включает ожидание в очереди. 0 или меньше отключает проверку.
# @type: integer
# @range: [0, null]
# @unit: ms
# @default: 5000
порогМедленногоPipelineMs: 5000

# Глубина публичной очереди телепортации (ожидающие игроки), при достижении
# которой проверяется обратное давление очереди: по фронту записывается WARN
# и накопительный счётчик queueGrowthWarnCount (показывается в /rtp info)
# увеличивается один раз за пересечение. 0 или меньше отключает проверку (по выбору).
# @type: integer
# @range: [0, null]
# @unit: players
# @default: 0
порогПредупрежденияРостаОчереди: 0

# Настройки /rtp admin prefab. Поток apply -> confirm записывает каждый изменённый
# файл конфигурации с резервной копией с именем <file>.yml.bak.<epochMillis>;
# bakRetention ограничивает число таких копий на файл, старые удаляются первыми.
# Установите 1, чтобы хранить только последнюю; значения ниже 1 повышаются до 1.
# /rtp admin prefab rollback проходит копии от новых к старым за несколько вызовов.
шаблон:
  # Number of timestamped config backups kept per file before pruning.
  # @type: integer
  # @range: [1, null]
  # @default: 3
  bakRetention: 3
# НЕ ТРОГАЙТЕ НОМЕР ВЕРСИИ
version: 1.0
