# Минимальное требование TPS
# Минимальный TPS сервера перед постановкой новой локации в очередь кэша.
# Диапазон: 0.0 - 20.0.
# Влияние: НИЗКОЕ - не позволяет плагину добавлять лаг, когда серверу плохо.
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
минTPS: 19.0

# Макс. использование кучи JVM (% от максимума), при котором фоновое заполнение
# кэша приостанавливается. Уже закэшированные точки продолжают выдаваться. 0 или 100 отключает.
# @type: number
# @range: [0.0, 100.0]
# @default: 85.0
maxHeapПроцент: 85.0

# --- Конфигурация производительности RTP ---
# Точная настройка плагина для производительности сервера.
# Максимальное число попыток поиска
# Сколько раз плагин будет искать безопасную локацию, прежде чем сдаться.
# Влияние: ВЫСОКОЕ - высокие значения могут сильно увеличить нагрузку на CPU.
# @type: integer
# @range: [1, null]
# @default: 32
максПопыток: 10

# Частота выбора (тики игры)
# Время между поисками новых локаций для заполнения кэшей регионов.
# ( 20 тиков = 1 секунда ).
# Влияние: СРЕДНЕЕ - меньшие значения заполняют кэш быстрее, но используют больше CPU.
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
период: 20

# Выделенное время на задачу (миллисекунды)
# Максимальное время (мс), уделяемое задачам RTP за тик.
# Диапазон: 0 - 50.
# Влияние: СРЕДНЕЕ - высокие значения позволяют обрабатывать быстрее, но за счёт времени тика.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
выделенноеВремяСинхр: 50

# Максимум миллисекунд за тик на асинхронные задачи.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
выделенноеВремяАсинхр: 50

# Предзагрузка цели (чанки)
# Радиус чанков для предзагрузки вокруг цели.
# Число загруженных чанков = ( 1 + 2 * радиус )^2.
# Влияние: ВЫСОКОЕ - слишком высокое значение может вызвать падение TPS.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
дистанцияВидимостиВыбор: 0

# Радиус чанков, загружаемых вокруг конечной точки непосредственно перед
# телепортацией. 0 загружает только чанк назначения.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
дистанцияВидимостиТелепорт: 0

# Тики, за которые дальность прорисовки телепортированного игрока возвращается к
# норме после прибытия, сглаживая всплеск загрузки чанков. 0 отключает ограничение.
# ПРИМЕЧАНИЕ: Временно принудительно установлено в 0. Постепенное восстановление
# вызывает мерцание / перерисовку на стороне клиента при прибытии. Оставьте 0 до
# дальнейших указаний.
# @type: integer
# @range: [0, null]
# @unit: ticks
# @default: 200
интервалВосстановленияВидимости: 0

# Постановка в очередь после телепорта
# Если true, плагин попытается заполнить кэш локаций сразу после RTP.
# Влияние: СРЕДНЕЕ
# @type: boolean
# @default: false
очередьПослеТелепорта: false

# Регистрирует биомы из уже загруженных чанков в пространственной памяти, питая
# вызов / взвешивание биомов. Без дополнительного чанк-I/O.
# @type: boolean
# @default: true
проверкаПриЗагрузкеЧанка: true

# Доля ёмкости бэклога, при которой возобновляется пополнение (гистерезис).
# 0.5 = пополнять после опустошения до 50%; 1.0 = пополнять непрерывно.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.5
порогПополненияBacklog: 0.5

# Вероятность отклонить несгенерированный чанк за попытку.
# 0.0 = без смещения, 1.0 = избегать несгенерированной земли. Сгенерированные чанки проходят всегда.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.0
предпочтениеПредген: 0.0

# Резервирует кэш точек для телепортов при входе
# (rtp.onevent.firstjoin / rtp.onevent.join).
# @type: boolean
# @default: false
кэшВходаВключен: false

# Жёсткий предел кэша входа. 0 = авто (max-players сервера при запуске).
# @type: integer
# @range: [0, null]
# @default: 0
пределКэшаВхода: 0

# Кэш выбора биомов
# biomeRecall: Повторно использовать ранее найденные локации по биому.
# biomeRecallForced: Использовать только уже обнаруженные и закэшированные биомы.
# Влияние: НИЗКОЕ - СРЕДНЕЕ
# @type: boolean
# @default: true
запоминаниеБиома: true

# Обслуживает запросы с фильтром по биому только из кэша (никогда не создаёт новых
# поисков биома). Требует biomeRecall.
# @type: boolean
# @default: false
запоминаниеБиомаПринуд: false

# Порог задержки (мс), выше которого мгновенно выданный телепорт проверяется
# (пишется WARN, slowPipelineCount увеличивается). 0 или меньше отключает.
# @type: integer
# @range: [0, null]
# @unit: ms
# @default: 5000
порогМедленногоPipelineMs: 5000

# Глубина очереди (ожидающие игроки), при которой проверяется обратное давление
# (пишется WARN, queueGrowthWarnCount увеличивается). 0 или меньше отключает.
# @type: integer
# @range: [0, null]
# @unit: players
# @default: 0
порогПредупрежденияРостаОчереди: 0

# Синхронная загрузка
# Использовать синхронную загрузку чанков для выбора локаций.
# Влияние: ВЫСОКОЕ - НЕ РЕКОМЕНДУЕТСЯ! Может вызвать серьёзные зависания сервера.
# @type: boolean
# @default: false
синхроннаяЗагрузка: false

# Разбор прав (запуск)
# onEventParsing: Несовместим с широкими правами вида *.*.
# Влияние: СРЕДНЕЕ (onEvent) / НИЗКОЕ (effect)
# @type: boolean
# @default: false
разборНаСобытие: false

# Разбирать узлы прав эффектов при запуске.
# @type: boolean
# @default: true
разборЭффектов: true

# Режим заполнения кэша через наблюдение (Region Data Visitor)
# Когда кэш предгенерации заполнен, одна задача в режиме
# наблюдения планируется на регион согласно той же `period` заполнения кэша.
# Использует тот же конвейер, что и стандартное
# заполнение кэша, но отбрасывает результирующего безопасного кандидата
# вместо постановки в очередь, так что побочные эффекты (запись плохих
# локаций, сбор наблюдаемых биомов) накапливаются в фоне без роста
# очереди сверх её предела. НИКОГДА не запускает генерацию мира: чанки,
# которых нет на диске, пропускаются пре-фильтром Anvil из с
# вердиктом UNKNOWN.
# visitorEnabled: главный переключатель (true включает режим наблюдения).
# Каденция наследуется от настройки `period` выше; отдельного параметра
# частоты нет.
# Влияние: НИЗКОЕ - ограничено существующим `period`; работа только
# когда у кэша нет места для заполнений в режиме по умолчанию.
# @type: boolean
# @default: false
посетительВключен: true

# Настройки /rtp admin prefab. Поток apply -> confirm пишет резервную копию для
# каждого изменённого файла; bakRetention ограничивает их число (старые удаляются).
шаблон:
  # Number of timestamped config backups kept per file before pruning.
  # @type: integer
  # @range: [1, null]
  # @default: 3
  bakRetention: 3
# НЕ ТРОГАЙТЕ НОМЕР ВЕРСИИ
version: 1.0
