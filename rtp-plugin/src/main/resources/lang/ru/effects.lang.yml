# --- Карта языка: effects.yml ---
# Сопоставляет внутренние имена ключей конфигурации (слева) с именами,
# видимыми оператору в effects.yml (справа).
# Изменяйте только правый столбец для переименования или перевода
# параметров; левый столбец является константой кода, не изменяйте его.
# Если этот файл не существует, плагин автоматически восстановит его
# с английской версией, где обе стороны идентичны.
when: "когда"
permission: "право"
players: "игроки"
inherit: "наследует"
effects: "эффекты"
version: "version"
