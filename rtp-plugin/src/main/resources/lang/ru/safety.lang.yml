# --- Карта языка: safety.yml ---
# Сопоставляет внутренние ключи (слева) с именами, видимыми пользователю
# в safety.yml (справа). Изменяйте только правую сторону; левая сторона
# является константой кода и не должна изменяться.
# Если этот файл отсутствует, плагин восстановит его с идентичными
# парами слева/справа (значения по умолчанию на английском).
safetyRadius: "радиусБезопасности"
biomeWhitelist: "белыйСписокБиомов"
airBlocks: "блокиВоздуха"
biomes: "биомы"
unsafeBlocks: "небезопасныеБлоки"
platformRadius: "радиусПлатформы"
platformAirHeight: "высотаВоздухаПлатформы"
platformMaterial: "материалПлатформы"
invulnerabilityTime: "времяНеуязвимости"
version: "version"
platformDepth: "глубинаПлатформы"
