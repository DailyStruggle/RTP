# --- Логи плагина ---
# Включает или отключает логи различных действий плагина.
# Подробные системные логи
# detailed_reload: логировать все перезагруженные файлы/секции
# detailed_region_init: логировать инициализацию каждого региона
подробная_перезагрузка: false
подробная_инициализация_региона: false

# Логи базовой активности
# command: логировать команды RTP, выполняемые игроками
# teleport: логировать фактические события телепорта
команда: false
телепорт: true

# Автоматические или событийные логи RTP
# Логи для RTP, активируемого событиями:
событие_сменаМира: "true # Когда игрок меняет мир"
событие_вход: "true       # Когда игрок входит на сервер"
событие_возрождение: "true # Когда игрок возрождается"
событие_движение: "true  # Когда игрок двигается (если RTP по движению включён)"
событие_телепорт: "true # Когда игрок телепортируется (если RTP по телепорту включён)"

# Отладка ошибок выбора
# Логирует подробную информацию, когда выбор безопасной локации не удаётся,
# включая частоты сбоев и параметры поиска.
ошибка_выбора: true

# Системные логи
# Связано с фоновыми задачами и операциями базы данных.
система_отслеживаниеПамяти: false
система_базаДанных: false

# Минимальный уровень логирования плагина. Эффективный фильтр - самый
# строгий из этого и логгера Bukkit. Допускаются: SEVERE, WARNING, INFO,
# CONFIG, FINE, FINER, FINEST, ALL, OFF. Значение по умолчанию ALL
# сохраняет поведение, идентичное логгеру Bukkit.
мин_уровень: "INFO"

# НЕ ИЗМЕНЯЙТЕ НОМЕР ВЕРСИИ
version: 1.0
