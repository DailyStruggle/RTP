# RTP Network Mode (multi-server / multi-proxy) Disabled by default; flipping `network.enabled: true` opts this backend into the cross-server network.

network:
  # false이면 이 파일은 읽고 검증된 뒤 무시됩니다. 스레드, 테이블, 전송은 전혀 열리지 않습니다.
  # @type: boolean
  # @default: false
  enabled: false

  # 안정적인 백엔드 식별자. 활성화 시 필수이며, 같은 serverId를 공유하는 두 백엔드는 서로의 하트비트를 덮어씁니다.
  # @type: string
  # @default: ""
  serverId: ""

  # 공유 HMAC 비밀을 담는 환경 변수. transport.type redis로 활성화한 경우 필수입니다.
  # @type: string
  # @default: "RTP_NET_SECRET"
  secretEnv: "RTP_NET_SECRET"

# Backing store for cross-process state.
transport:
  # 전송 백업 저장소.
  # @type: enum
  # @options: ["auto", "plugin-message", "in-memory", "sql", "redis"]
  # @default: "auto"
  type: "auto"
  pluginMessage:
    # 프록시 플러그인 메시징 채널. 프록시가 비표준 이름을 쓰지 않는 한 기본값으로 두세요.
    # @type: string
    # @default: "bungeecord:main"
    channel: "bungeecord:main"
  redis:
    # 모든 백엔드와 프록시가 공유하는 Redis 인스턴스의 호스트 이름 또는 IP(type이 redis일 때 필수).
    # @type: string
    # @default: "localhost"
    host: "localhost"

    # Redis 포트. 비표준 배포에서는 변경하세요.
    # @type: integer
    # @default: 6379
    port: 6379

    # Redis 비밀번호. 인증 없는 Redis에서는 비워 두고, ACL/requirepass를 구성한 경우 설정하세요.
    # @type: string
    # @default: ""
    password: ""

# Backend heartbeat / peer-staleness cadence (shared by every transport tier).
heartbeat:
  # 이 백엔드가 상태 행을 게시하는 빈도(ms).
  # @type: integer
  # @default: 1000
  intervalMs: 1000

  # 피어의 마지막 확인 상태가 알 수 없음으로 처리되기 전까지 신뢰되는 시간(ms). intervalMs보다 크게 유지하세요.
  # @type: integer
  # @default: 5000
  staleAfterMs: 5000

# Backend-side router.
routing:
  # 라우터 모드: local(로컬 파이프라인만), auto(로컬 우선, 없으면 대기열), 또는 always(항상 등록).
  # @type: enum
  # @options: ["local", "auto", "always"]
  # @default: "local"
  mode: "local"

  # 로비 모드: 이 백엔드를 순수 분배 노드로 만들어, 단순 /rtp를 비축량이 가장 많은 피어 지역으로 자동 라우팅합니다.
  # @type: boolean
  # @default: false
  lobbyMode: false

# Cross-server wait queue.
queue:
  # 백프레셔가 새로운 /rtp 호출을 거부(QUEUE_FULL)하기 전까지 로컬에 버퍼링되는 최대 등록 수.
  # @type: integer
  # @default: 50
  maxDepth: 50

  # 백엔드 대기 쓰기 플러시 주기(ms). 낮을수록 지연이 줄고, 높을수록 전송 왕복이 줄어듭니다.
  # @type: integer
  # @default: 250
  flushIntervalMs: 250

  # 백엔드 상태 캐시 폴링 주기(ms). 플레이어별 진행 상황을 새로 고치는 빈도.
  # @type: integer
  # @default: 1000
  pollIntervalMs: 1000

  # 엔벨로프 HASH의 선택적 TTL 수동 만료(ms). 0이면 비활성화.
  # @type: integer
  # @default: 0
  entryTtlMs: 0

  # 서버 간 /rtp 등록 속도 제한(토큰 버킷): 초당 지속 요청 수.
  # @type: number
  # @default: 5
  crossServerRequestsPerSecond: 5

  # 서버 간 /rtp 등록 속도 제한: 버스트 크기.
  # @type: number
  # @default: 10
  crossServerRequestsBurst: 10

  # 프록시 측 BLPOP 워커 수. 단일 워커가 포화될 때만 늘리세요.
  # @type: integer
  # @default: 1
  workerThreads: 1

# Reservation-token lifecycle.
reservation:
  # 프록시 측 TTL 수거기 주기(ms). 만료된 토큰을 정리하고 좌표를 해제합니다.
  # @type: integer
  # @default: 30000
  reapIntervalMs: 30000

  # 토큰별 TTL(ms). 요청되었으나 사용되지 않은 예약이 이보다 오래되면 버려진 것으로 해제됩니다.
  # @type: integer
  # @default: 60000
  ttlMs: 60000

# Region-collision policy.
regionCollision:
  # 시작 시 적용되는 충돌 정책.
  # @type: enum
  # @options: ["warn", "rename-local", "reject-startup"]
  # @default: "warn"
  policy: "warn"

# Optional per-destination policy overlay (matched by serverId); leave commented for the common case.
# servers:
#  example-backend:
#    # Permission required to target this destination (empty = none).
#    # @type: string
#    # @default: "
#    permission: "
#    # Label shown in menus / suggestions (default: serverId).
#    # @type: string
#    # @default: "
#    display-name: "Example"
#    # Hide from tab-completion when it has no servable region.
#    # @type: boolean
#    # @default: false
#    hide-when-unavailable: false
#    # Allow targeting it even when it reports no servable region.
#    # @type: boolean
#    # @default: true
#    allow-when-unavailable: true
# Load balancer scoring table.
loadBalancer:
  # 내장된 지역 부족 항의 가중치. 아래의 명시적 `region` 항이 그 신호를 담당하므로 0입니다.
  # @type: number
  # @default: 0
  regionScarcityWeight: 0

  # Scoring terms, one per metric.
  terms:
    # Tick pressure; sigmoid knee at 0.6.
    mspt:
      # 지표 입력.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "mspt"
      input: "mspt"

      # 항 가중치.
      # @type: number
      # @default: 1.0
      weight: 1.0
      curve:
        # 곡선 유형.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "sigmoid"
        type: "sigmoid"

        # 기울기.
        # @type: number
        # @range: [0.1, 20]
        # @default: 8.0
        k: 8.0

        # 중간점.
        # @type: number
        # @range: [0, 1]
        # @default: 0.6
        x0: 0.6

    # Queue depth; small queues silent, large ones explode.
    queue:
      # 지표 입력.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "queueDepth"
      input: "queueDepth"

      # 항 가중치.
      # @type: number
      # @default: 1.0
      weight: 1.0
      curve:
        # 곡선 유형.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "exponential"
        type: "exponential"

        # 기울기.
        # @type: number
        # @range: [0.1, 20]
        # @default: 3.0
        k: 3.0

    # Heap gate; fires at >= 85% used.
    heap:
      # 지표 입력.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "heapUsed"
      input: "heapUsed"

      # 항 가중치.
      # @type: number
      # @default: 5.0
      weight: 5.0
      curve:
        # 곡선 유형.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "step"
        type: "step"

        # 계단 임계값.
        # @type: number
        # @range: [0, 1]
        # @default: 0.85
        threshold: 0.85

    # Region gate; fires when the kept pool is >= 95% full.
    region:
      # 지표 입력.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "keptRegion"
      input: "keptRegion"

      # 항 가중치.
      # @type: number
      # @default: 5.0
      weight: 5.0
      curve:
        # 곡선 유형.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "step"
        type: "step"

        # 계단 임계값.
        # @type: number
        # @range: [0, 1]
        # @default: 0.95
        threshold: 0.95

    # Gentle tie-breaker on kept count.
    kept:
      # 지표 입력.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "keptCount"
      input: "keptCount"

      # 항 가중치.
      # @type: number
      # @default: 0.25
      weight: 0.25
      curve:
        # 곡선 유형.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "logarithmic"
        type: "logarithmic"

        # 기울기.
        # @type: number
        # @range: [0.1, 20]
        # @default: 9.0
        k: 9.0

version: 1.1
