# --- RTP 메시지 (이 언어) ---
# 이 언어의 플레이어 및 운영자용 메시지 문구로, 주제별로 분류되어 있습니다.
# 영어 메시지에서 자동 생성된 사본입니다. 직접 편집하지 마세요 (덮어쓰여집니다).

# ###############################################################################
# 섹션 6: 스캔 명령어
# ###############################################################################
스캔시작: "&a[P0] 다음 리전에서 스캔 작업을 시작했습니다: [scan_regions]"
스캔리셋: "&7[P0] 다음 리전의 스캔 큐를 초기화했습니다: [scan_regions]"
스캔취소: "&7[P0] 다음 리전의 스캔 작업을 취소했습니다: [scan_regions]"
스캔일시중지: "#A020F0[P0] 다음 리전의 스캔 작업을 일시 중지했습니다: [scan_regions]"
스캔재개: "#10A5F5[P0] 다음 리전의 스캔 작업을 재개했습니다: [scan_regions]"
스캔실행중: "&c[P0] 다음 리전에서는 이미 스캔 작업이 실행 중입니다: [scan_regions]"
스캔미실행: "&c[P0] 다음 리전에는 현재 스캔 작업이 없습니다: [scan_regions]"
# placeholder: [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
스캔상태: "[P0] &8» &7[scan_regions] &8| &7[scan_chunks]&8/&7[scan_totalChunks] &8| #7E9CC8[scan_cps]&7 cps &8| #7E9CC8[scan_landPercentage]%&7 육지 &8| &7ETA #7E9CC8[scan_eta]"
# Boss-bar title shown to players with rtp.scan permission while a world scan is running.
# Set to empty string to disable the boss-bar.
# placeholder: [scan_regions], [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
scanBossBar: "스캔 중 [scan_regions]: [scan_chunks]/[scan_totalChunks] ([scan_landPercentage]% 육지) ETA [scan_eta]"

# ###############################################################################
# 섹션 7: 정보 명령어
# ###############################################################################
정보제목: "&2&l/rtp info"
정보_티켓: "&7전역 활성 청크 티켓: #7E9CC8[tickets]"
정보_텔레포트: "&7활성 텔레포트 상태 머신: #7E9CC8[teleports]"
정보_MSPT: "&7플러그인 현재 MSPT: #7E9CC8[mspt]"
정보_총로드수: "&7누적 로드된 청크 수: #7E9CC8[loads]"
infoLoadsByOrigin: "&7출처별 로드: #7E9CC8[loadsByOrigin]"
정보_누수율: "&7현재 청크 누수율: #7E9CC8[leakRate]"
# --- Health metrics block ---
infoQueueDepth: "&7리전 대기열에서 대기 중인 플레이어: #7E9CC8[queueDepth]"
infoPendingTeleports: "&7대기 중인 텔레포트 파이프라인: #7E9CC8[pendingTeleports]"
infoAvgPipelineMs: "&7평균 파이프라인 지연: #7E9CC8[avgPipelineMs] ms"
# Pipeline-latency percentiles. Placeholders: [pipelineMsP50] [pipelineMsP75]
# [pipelineMsP90] [pipelineMsP95] [pipelineMsP99] [pipelineSampleCount].
infoPipelinePercentiles: "&7파이프라인 지연 (ms) P50/P75/P90/P95/P99: #7E9CC8[pipelineMsP50] / [pipelineMsP75] / [pipelineMsP90] / [pipelineMsP95] / [pipelineMsP99]&7 (n=[pipelineSampleCount])"
# Slow-teleport audit (immediate/unqueued teleports only). Placeholders:
# [slowPipelineCount] [slowPipelineThresholdMs].
infoSlowPipeline: "&7느린 텔레포트 (> #7E9CC8[slowPipelineThresholdMs]&7 ms): #7E9CC8[slowPipelineCount]"
# Queue-growth audit. Placeholders: [queueGrowthWarnCount] [queueGrowthWarnThreshold].
infoQueueGrowth: "&7대기열 증가 경고 (>= #7E9CC8[queueGrowthWarnThreshold]&7): #7E9CC8[queueGrowthWarnCount]"
infoHeap: "&7JVM 힙: #7E9CC8[heapUsedMb] / [heapMaxMb] MiB"
# /rtp info 의 Health pipeline 라벨 블록 헤더 줄.
infoHealthPipelineHeader: "&7--- 상태: 파이프라인 ---"
# 1m / 5m / 15m 윈도우의 TPS 표시. 자리표시자: [tps1m] [tps5m] [tps15m].
infoTps: "&7TPS (1m/5m/15m): #7E9CC8[tps1m] / [tps5m] / [tps15m]"
# 서버 실시간 MSPT 및 tick 예산 사용률. 자리표시자: [mspt] [tickBudgetUtilisation].
infoMSPTLive: "&7서버 MSPT: #7E9CC8[mspt] ms (&7틱 예산: #7E9CC8[tickBudgetUtilisation]&7)"
# Configured player soft-cap vs current online count. Placeholders: [softCap] [playerCount].
infoSoftCap: "&7플레이어: #7E9CC8[playerCount] / [softCap]"
# 데이터베이스의 최근 왕복 지연 시간 (ms). 자리표시자: [databaseLatencyMs].
infoDatabaseLatencyMs: "&7데이터베이스 지연: #7E9CC8[databaseLatencyMs] ms"
# Generation outcome metrics.
# Success/failure rate over all recorded generation attempts. Placeholders:
# [genSuccessRate] [genFailureRate] [genOutcomeTotal].
infoFailureRate: "&7생성 성공률: #7E9CC8[genSuccessRate]&7 (실패 #7E9CC8[genFailureRate]&7, n=#7E9CC8[genOutcomeTotal]&7)"
# Single most common rejection cause and its share of all failures. Placeholders:
# [genTopRejectionCause] [genTopRejectionShare].
infoTopRejectionCause: "&7주요 거부 원인: #7E9CC8[genTopRejectionCause]&7 (#7E9CC8[genTopRejectionShare]&7)"
# Per-cause rejection breakdown.
# Placeholder: [genFailureBreakdown] - comma-separated cause=N list, busiest first.
infoFailureBreakdown: "&7원인별 거부: #7E9CC8[genFailureBreakdown]"
# Health colour-band thresholds. Used to colour the coloured-variant
# placeholders (e.g. [tps1mColoured]) green/yellow/red.
infoThresholdTpsGreen: 19.5
infoThresholdTpsYellow: 18.0
infoThresholdMsptGreen: 30.0
infoThresholdMsptYellow: 45.0
infoThresholdCacheFillGreen: 0.5
infoThresholdCacheFillYellow: 0.25
infoThresholdNetworkAgeYellow: 5.0
# Header line introducing the per-Folia-region table (Folia runtime only).
infoFoliaRegionsHeader: "&7--- Folia 리전 ---"
# Per-row template for a single Folia region. Placeholders: [regionId] [tps1m]
# [mspt] [playerCount] [queueDepth] [tickBudgetUtilisation].
infoFoliaRegion: "#7E9CC8[regionId]&7: tps=#7E9CC8[tps1m]&7 mspt=#7E9CC8[mspt]&7 players=#7E9CC8[playerCount]&7 queue=#7E9CC8[queueDepth]&7 budget=#7E9CC8[tickBudgetUtilisation]"
정보_면책_헤더: "&7--- 진단 노트 ---"
정보_면책: "&7진단 노트: 서버의 고립 청크 총수가 본 플러그인의 누적 로드 수 ([loads]) 를 초과하는 경우, 본 플러그인이 메모리 누수의 유일한 원인은 아닙니다."
정보_월드헤더: "#008080월드:"
정보_콘솔_월드헤더: "&7--- 월드 ---"
정보월드: "#21ADA8[world]"
정보_리전헤더: "#63C5DA리전:"
정보_콘솔_리전헤더: "&7--- 리전 ---"
정보리전: "#52B2BF[region]"
# Biome-occupancy leaderboard shown by /rtp info biomes - which biomes online
# players spend their time in, sampled over the server's uptime.
# Header placeholders: [biomeTotalSamples] [biomeDistinctCount].
infoBiomeActivityHeader: "&8--- &3바이옴 점유 &8(&3[biomeTotalSamples]&8 샘플, &3[biomeDistinctCount]&8 바이옴) ---"
# Per-biome row. Placeholders: [biomeRank] [biomeName] [biomeSamples] [biomePercent] [biomeBar].
infoBiomeActivityRow: "&8 [biomeRank]. &3[biomeName] &8[biomeBar] &7[biomePercent]% &8([biomeSamples])"
# Shown when no occupancy has been sampled yet.
infoBiomeActivityEmpty: "&8--- &7아직 바이옴 점유가 샘플링되지 않았습니다 &8---"

# sub-info listings
# placeholders: [world], [region], [requirePermission], [override], [shape], [worldBorderOverride], [cacheCap], [cached], [keptCache], [unkeptCache], [backlogCache], [backlogCacheCap]
월드정보:
  - "#21ADA8[world]:"
  - "#99EEBB  - 리전: [region]"
  - "#99EEBB  - 필요 권한: [requirePermission]"
  - "#99EEBB  - 재정의: [override]"

리전정보:
  - "#52B2BF[region]:"
  - "#58CCED  - 월드: [world]"
  - "#58CCED  - 모양: [shape]"
  - "#58CCED  - 필요 권한: [requirePermission]"
  - "#58CCED  - 월드 경계 재정의: [worldBorderOverride]"
  - "#58CCED  - 캐시 한도: [cacheCap]"
  - "#58CCED  - 유지 캐시 (hot): [keptCache]"
  - "#58CCED  - 해제 캐시 (cold): [unkeptCache]"
  - "#58CCED  - 백로그 캐시 (backlog): [backlogCache] / [backlogCacheCap]"
  - "#58CCED  - 캐시됨: [cached]"
  - "#58CCED  - 학습된 커버리지: [memCoveragePct] (불량: [memBadPct], [memBadCount] 셀)"
  - "#58CCED  - 주요 거부 원인: [memTopCause] ([memTopCausePct])"

