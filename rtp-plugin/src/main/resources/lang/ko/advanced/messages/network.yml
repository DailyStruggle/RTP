# --- RTP 메시지 (이 언어) ---
# 이 언어의 플레이어 및 운영자용 메시지 문구로, 주제별로 분류되어 있습니다.
# 영어 메시지에서 자동 생성된 사본입니다. 직접 편집하지 마세요 (덮어쓰여집니다).

# --- 서버 간 네트워크 모드 메시지 ---
# `network.enabled: true` 이고 플레이어의 `/rtp` 가 서버 간 대기열을 통해 라우팅될 때만
# 전송됩니다 (network.yml 의 `routing.mode` 참조).
# 플레이어 관점에서는 모든 키가 선택 사항입니다 - 기본
# `delayMessage` / `teleportMessage` 주기가 여전히 보이는 흐름을 주도합니다.
# 요청이 서버 간 대기열에 수락되어 백엔드 청구를 기다리고 있을 때
# 전송됩니다. 자리표시자: [position] - `pollStatus` 의 0부터 시작하는
# 순번; 전송 계층에서 위치를 반환하지 않으면 비어 있을 수 있습니다.
networkQueued: "&7[P0] 서버 간 목적지를 위해 대기 중입니다 (순번 [position])..."

# 플레이어가 이미 서버 간 대기열에서 대기 중인 상태에서 /rtp 를 실행했을 때 전송됩니다.
# 자리표시자: [position] - 대기열에서의 순번; 비어 있을 수 있습니다.
alreadyQueued: "&c이미 서버 간 대기열에서 기다리고 있습니다 (순번 [position]). 잠시 기다려 주세요."

# 서버 간 대기열 항목이 너무 오래 대기하여 취소(삭제)되었을 때 전송됩니다.
# 자리표시자 없음.
networkTimedOut: "&c[P0] 백엔드를 기다리는 동안 서버 간 텔레포트가 시간 초과되었습니다."

# 서버 간 대기열이 가득 차서 요청이 거부되었을 때 전송됩니다.
# 자리표시자 없음.
waitlistFull: "&c[P0] 서버 간 대기열이 가득 찼습니다. 잠시 후 다시 시도해 주세요."

# 대기열이 프록시 라우터로 요청을 넘겨주고 백엔드 선택이
# 진행 중일 때 전송됩니다.
networkRouting: "&7[P0] 백엔드로 라우팅 중..."

# 백엔드가 이 플레이어를 위한 좌표를 예약했고 프록시가 서버 간 홉을
# 시작하려고 할 때 전송됩니다. 자리표시자: [server]
# - 대상 백엔드의 serverId.
networkReserved: "&a[P0] [server]에 좌표를 예약했습니다. 전송 중..."

# 프록시가 홉(이동) 중일 때 전송됩니다. 자리표시자: [server] - 목적지.
networkTransferring: "&a[P0] [server](으)로 전송 중..."

# 서버 간 경로를 포기하고 로컬 서버로 전환했을 때 전송됩니다.
# 자리표시자: [reason] - 전환된 이유.
networkFallback: "&e[P0] 서버 간 연결을 사용할 수 없습니다 ([reason]). 로컬로 전환합니다."

# 서버 간 요청이 실패하고 로컬 전환도 불가능했을 때 전송됩니다.
# 자리표시자: [reason] - 실패 이유.
networkFailed: "&c[P0] 서버 간 텔레포트에 실패했습니다: [reason]."

# 플레이어가 특정 리전을 요청했으나 (`/rtp <region>`) 네트워크 내 어떤 백엔드도
# 현재 해당 리전을 제공하지 않을 때 전송됩니다. 자리표시자:
# [region] - 요청된 리전 이름.
networkRegionUnavailable: "&c[P0] 현재 '[region]' 지역을 제공하는 백엔드가 없습니다."

# 요청된 리전 이름이 둘 이상의 백엔드로 확인되고 운영자가 설정한 정책으로
# 하나를 선택할 수 없을 때 전송됩니다 (기본값인 `warn` 보다 엄격한 정책에서만
# 발생). 자리표시자: [region].
networkRegionAmbiguous: "&c[P0] '[region]' 지역이 여러 백엔드에서 모호합니다. 서버를 지정해 주세요."

# 버전 번호는 변경하지 마세요
version: 1.0
