# --- RTP 메시지 (이 언어) ---
# 이 언어의 플레이어 및 운영자용 메시지 문구로, 주제별로 분류되어 있습니다.
# 영어 메시지에서 자동 생성된 사본입니다. 직접 편집하지 마세요 (덮어쓰여집니다).

# ###############################################################################
# 섹션 2: 텔레포트
# ###############################################################################
이미텔레포트중: "&7[P0] ⚡ 이미 텔레포트 중입니다!"

# 플러그인이 현재 리로드 중일 때
텔레포트거부_리로드중: "&7[P0] 플러그인 리로드 중이므로 텔레포트가 일시적으로 비활성화되었습니다. 잠시 후 다시 시도해 주세요."
지연메시지: "<gradient:#9D7CD8:#5FB3B3>[P0] ⚡ [delay] 후 텔레포트합니다. 움직이지 마세요.</gradient>"
청크로딩중: "&7[P0] ⚙ 청크 로딩 중. 잠시 기다려 주세요.."
텔레포트메시지: "<gradient:#5FB3B3:#9D7CD8>[P0] ⚡ [attempts] 번 시도 후 텔레포트 완료 ([processingTime])</gradient>"

# 텔레포트가 취소되었을 때
텔레포트취소: "&7[P0] ⚡ 텔레포트가 취소되었습니다!"

# 최대 시도 횟수에 도달해도 안전한 장소를 찾지 못한 경우
# 자리표시자: [attempts] - 최대 시도 횟수
위험: "&7[P0] ⌖ [attempts] 회 시도해도 안전한 위치를 찾지 못했습니다"

# 플레이어가 쿨다운 중일 때
# 자리표시자: [remainingCooldown] - 남은 시간
쿨다운메시지: "&7[P0] ⚡ 다시 텔레포트하려면 [remainingCooldown] 기다려야 합니다"

# 플레이어가 lockAfterUses 한도에 도달하여 잠겼을 때 (BetterRTP LockAfter 패리티)
lockedAfterUses: "&7[P0] ⌖ 랜덤 텔레포트 한도에 도달했습니다. [remainingLockTime] 후에 다시 시도해 주세요."

# 리전에 대기 중인 위치가 없고 플레이어가 rtp.unqueued 권한을 가지고 있지 않을 때
가능한위치없음: "#f5eb73[P0] ⌖ 현재 사용 가능한 위치가 없습니다"

# 대기열이 이동했을 때
# 자리표시자: [spot] - 현재 대기열 위치
큐업데이트: "#2636ef[P0] 큐에서 당신의 순서: [spot]"

# 플레이어가 해당 리전에서 텔레포트하기에 충분한 돈이 없을 때
# 자리표시자: [money] - 명령어에 필요한 금액
잔액부족: "&7[P0] 이 작업에는 최소 $[money] 이(가) 필요합니다."

# ###############################################################################
# 섹션 3: 시간 표기
# ###############################################################################
일: "일"
시간: "시간"
분: "분"
초: "초"
밀리초: "밀리초"

# bukkit 에 해당 월드가 존재하지 않습니다
# 자리표시자: [world] - 월드 이름
잘못된월드: "&7[P0] 월드 '[world]' 을(를) 찾을 수 없습니다"

# 플러그인에 사용자가 요청한 명령어가 없습니다
# 자리표시자: [arg] - 시도된 인수
잘못된인수: "&c[P0] 잘못된 명령어 인수입니다 [arg]"

# 콘솔이 플레이어 전용 명령어를 실행하려 할 때
콘솔불가: "&c[P0] 이 명령어는 게임 내 플레이어로 실행해야 합니다."

# busy 와 invalidCommand 는 messages.lang.yml 에서 번역되지 않음 -> 영어 키 이름 (영어 기준선으로 폴백).
busy: "&c[P0] 처리 중"

# 플레이어가 전투 중이어서 선택적 PvP 전투 확인이 /rtp 를 거부할 때 전송됩니다
pvpInCombat: "&c[P0] 전투 중에는 무작위 텔레포트를 할 수 없습니다."

# 사용자가 요청한 하위 명령어 또는 매개변수가 플러그인에 없습니다
# 자리표시자: [arg] - 시도된 인수
invalidCommand: "&c[P0] 잘못된 명령어 - [arg]"

# 사용자가 요청한 명령어에 대한 권한이 없습니다
권한없음: "&7죄송합니다. 이 명령어를 실행할 권한이 없습니다. 오류라고 생각되시면 서버 관리자에게 문의하세요."

