도움말: "&b/rtp help - 이 도움말을 표시합니다"
도움말_설명: "명령어 설명"
리로드: "&b/rtp reload - 설정 파일을 리로드합니다"
리로드_설명: "설정 파일을 리로드합니다"
스캔: "&b/rtp scan - 리전 내 가능한 모든 위치를 스캔하여 로드 속도를 향상시킵니다"
스캔_설명: "저장된 데이터를 지우고 리전 내 가능한 모든 위치를 스캔합니다"
설정_설명: "런타임에 설정 파일을 업데이트합니다"
정보_설명: "플러그인의 현재 상태를 표시합니다"
