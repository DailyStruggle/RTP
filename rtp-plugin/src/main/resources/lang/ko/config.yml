# 텔레포트 지연(초)
# 실제 텔레포트가 발동하기 전에 플레이어가 기다리는 시간.
# 서버가 목적지 청크를 미리 로드할 시간을 확보합니다.
텔레포트지연: 2

# 이동 취소(블록)
# 지연 중 플레이어가 이 거리 이상 이동하면 텔레포트를 취소합니다.
# -1 로 설정하면 비활성화됩니다.
취소거리: 2

# 텔레포트 간격(초)
# 플레이어가 RTP 를 연속해서 사용하기 전에 기다려야 하는 시간.
텔레포트쿨다운: 300

# 텔레포트 후 명령어
# 텔레포트 성공 후 실행할 명령어 목록.
# 자리표시자 [player] 는 플레이어 이름을 나타냅니다.
콘솔명령어:
  - "say [player] 가 무작위 텔레포트했습니다!"

# Commands executed as the teleporting player on successful teleport.
# Use [player] for the target player's name. Empty string entries are ignored.
# @type: list<string>
플레이어명령어:
  - ""

# --- 데이터베이스 설정 ---
# 캐시된 위치 및 플레이어 데이터의 저장소.
데이터베이스:
  # 사용 가능한 type: yaml, sqlite, mysql, postgresql
  # - yaml/sqlite: 로컬 파일(추가 설정 불필요)
  # - mysql/postgresql: 원격 데이터베이스(아래 인증 정보 필요)
  type: "sqlite"
  # 네트워크 데이터베이스 인증 정보(로컬에서는 무시됨)
  host: "127.0.0.1"
  # Database port. Used by mysql/postgresql only.
  # @type: integer
  # @range: [1, 65535]
  port: 3306
  # Database / schema name. Used by mysql/postgresql only.
  # @type: string
  name: "rtp"
  # Database username. Used by mysql/postgresql only.
  # @type: string
  username: "root"
  # Database password. Used by mysql/postgresql only.
  # @type: string
  password: "password"

# --- 네트워크 동기화 ---
# Redis 는 여러 서버 간 캐시된 위치를 동기화하는 데 사용됩니다.
네트워크:
  redis:
    # Enable Redis-backed network state binding.
    # @type: boolean
    # @default: false
    enabled: false
    # Redis host.
    # @type: string
    host: "127.0.0.1"
    # Redis port.
    # @type: integer
    # @range: [1, 65535]
    port: 6379
    # Redis password. Empty string disables auth.
    # @type: string
    password: ""

# Generalized menu framework (ADR-035 / ADR-044).
# `renderer` is an ordered preference list of renderer ids. On exception or
# missing adapter the framework walks the list and falls back to the next
# entry. If the list is exhausted the no-token open-page path falls back to
# the configurable `menuInvalid` message. Available ids: book. (The chat
# renderer ships in a follow-up and will be added to the default list at
# that point.)
menu:
  # Ordered preference list of renderer ids.
  # @type: list<enum>
  # @options: ["book", "chat"]
  renderer:
    - "book"

# 버전 번호는 변경하지 마세요
version: 3.0
