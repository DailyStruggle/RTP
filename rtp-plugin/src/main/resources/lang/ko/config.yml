# --- RTP 메인 설정 ---

# 플레이어에게 표시되는 메시지의 언어.
# 기본값: "en" (messages.yml 에 포함된 영어 기준선).
# 다른 번역은 lang/<locale>/messages.yml 에 있으며 영어 기준선 위에
# 레이어로 로드됩니다. 언어 파일에 없는 키는 조용히 영어로
# 폴백합니다. 알 수 없는 언어 코드는 경고를 띄우고 마찬가지로 영어로
# 폴백합니다.
# ADR-020 및 REQ-RTP-F-013 참조.
language: "en"

# 텔레포트 지연(초)
# 실제 텔레포트가 발동하기 전에 플레이어가 기다리는 시간.
# 서버가 목적지 청크를 미리 로드할 시간을 확보합니다.
텔레포트지연: 2

# 이동 취소(블록)
# 지연 중 플레이어가 이 거리 이상 이동하면 텔레포트를 취소합니다.
# -1 로 설정하면 비활성화됩니다.
취소거리: 2

# 텔레포트 간격(초)
# 플레이어가 RTP 를 연속해서 사용하기 전에 기다려야 하는 시간.
텔레포트쿨다운: 300

# 텔레포트 후 명령어
# 텔레포트 성공 후 실행할 명령어 목록.
# 자리표시자 [player] 는 플레이어 이름을 나타냅니다.
콘솔명령어:
  - "say [player] 가 무작위 텔레포트했습니다!"
플레이어명령어:
  - ""

# --- 데이터베이스 설정 ---
# 캐시된 위치 및 플레이어 데이터의 저장소.
데이터베이스:
  # 사용 가능한 type: yaml, sqlite, mysql, postgresql
  # - yaml/sqlite: 로컬 파일(추가 설정 불필요)
  # - mysql/postgresql: 원격 데이터베이스(아래 인증 정보 필요)
  type: "sqlite"

  # 네트워크 데이터베이스 인증 정보(로컬에서는 무시됨)
  host: "127.0.0.1"
  port: 3306
  name: "rtp"
  username: "root"
  password: "password"

# --- 네트워크 동기화 ---
# Redis 는 여러 서버 간 캐시된 위치를 동기화하는 데 사용됩니다.
네트워크:
  redis:
    enabled: false
    host: "127.0.0.1"
    port: 6379
    password: ""

# 버전 번호는 변경하지 마세요
version: "3.0"
