# 텔레포트 지연(초)
# 실제 텔레포트가 발동하기 전에 플레이어가 기다리는 시간.
# 서버가 목적지 청크를 미리 로드할 시간을 확보합니다.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 2
텔레포트지연: 2

# 이동 취소(블록)
# 지연 중 플레이어가 이 거리 이상 이동하면 텔레포트를 취소합니다.
# -1 로 설정하면 비활성화됩니다.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 2
취소거리: 2

# 텔레포트 간격(초)
# 플레이어가 RTP 를 연속해서 사용하기 전에 기다려야 하는 시간.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 300
텔레포트쿨다운: 300

# 플레이어가 잠기기 전에 lockAfterResetSeconds 기간 내에 사용할 수 있는
# 성공한 /rtp의 최대 횟수입니다 (BetterRTP LockAfter 동등 기능).
# 0은 제한을 비활성화합니다. rtp.nolock으로 우회됩니다.
# @type: integer
# @range: [0, null]
# @default: 0
lockAfterUses: 0

# lockAfterUses의 롤링 사용 제한 창의 길이입니다. 카운터는 창의 첫 사용 후
# 이 초만큼 지나면 초기화됩니다. 0은 제한이 절대 초기화되지 않음을
# 의미합니다 (영구 제한).
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 0
lockAfterResetSeconds: 0

# true이면 성공한 /rtp가 착지 위치를 플레이어의 영구
# 리스폰 지점으로 설정합니다 (BetterRTP 동등 기능).
# @type: boolean
# @default: false
setRespawnOnTeleport: false

# 텔레포트 후 명령어
# 텔레포트 성공 후 실행할 명령어 목록.
# 자리표시자 [player] 는 플레이어 이름을 나타냅니다.
# @type: list<string>
콘솔명령어:
  - "say [player] 가 무작위 텔레포트했습니다!"

# 텔레포트 성공 시 대상 플레이어로 실행되는 명령어.
# [player] 는 대상 플레이어 이름입니다. 빈 항목은 무시됩니다.
# @type: list<string>
플레이어명령어:
  # 텔레포트 성공 시 대상 플레이어로 실행되는 명령어.
  # [player] 는 대상 플레이어 이름입니다. 빈 항목은 무시됩니다.
  # @type: list<string>
  - ""

# 일반화된 메뉴 프레임워크.
# `renderer` 는 렌더러 ID 우선순위 리스트입니다. 예외가 발생하거나
# 어댑터가 없는 경우 프레임워크는 리스트를 순회하며 다음 항목으로
# 폴백합니다. 리스트가 소진되면 토큰 없는 페이지 열기 경로는 구성
# 가능한 `menuInvalid` 메시지로 폴백합니다. 사용 가능한 ID: book.
# (채팅 렌더러는 후속 릴리스에서 추가되며, 그 시점에 기본 리스트에
# 포함될 예정입니다.)
menu:
  # Ordered preference list of renderer ids.
  # @type: list<enum>
  # @options: ["book", "chat"]
  renderer:
    # 일반화된 메뉴 프레임워크.
    # `renderer` 는 렌더러 ID 우선순위 리스트입니다. 예외가 발생하거나
    # 어댑터가 없는 경우 프레임워크는 리스트를 순회하며 다음 항목으로
    # 폴백합니다. 리스트가 소진되면 토큰 없는 페이지 열기 경로는 구성
    # 가능한 `menuInvalid` 메시지로 폴백합니다. 사용 가능한 ID: book.
    # (채팅 렌더러는 후속 릴리스에서 추가되며, 그 시점에 기본 리스트에
    # 포함될 예정입니다.)
    - "book"

# "@config" 토큰을 통해 지역/월드 파일에 상속되는 전역 기본값입니다.
defaults:
  # 기본 영역의 모양과 크기. radius/centerRadius = 얼마나 멀리 착지하는지 (청크 단위).
  shape:
    # Landing area shape algorithm.
    # @type: enum
    # @source: shape
    name: "CIRCLE"
    mode: "ACCUMULATE"
    radius: 256
    centerRadius: 64
    centerX: 0
    centerZ: 0
    weight: 1.0
    # Keep spots from being reused. 0 = off, 1 = the landing chunk, N = bigger square.
    uniquePlacements: 0
    expand: false
  # Default high/low landing window.
  vert:
    # Vertical placement algorithm.
    # @type: enum
    # @source: vert
    name: "LINEAR"
    minY: 32
    maxY: 255
    # Search order: 0 = bottom-up, 1 = top-down, 2 = middle-out, 3 = edges-in, else random.
    direction: 2
    requireSkyLight: true
  # How many safe spots to pre-calculate.
  cacheCap: 50
  # Extra unverified spots kept ready. 0 = off.
  backlogCacheCap: 1000
  # Max chunks kept loaded for instant teleports.
  activeChunkCap: 10
  # Bad-spot tracking precision (1-5).
  spatialResolution: 3
  # Whether regions/worlds need permission.
  requirePermission: false

# 버전 번호는 변경하지 마세요
version: 3.1
