# --- RTP 안전 설정 ---
# 플러그인이 텔레포트 목적지를 "안전"하다고 판단하는 기준을 설정합니다.
#
# 토큰 구문 (ADR-017):
#   MATERIAL                          -- 단순 재질, 예: LAVA
#   MATERIAL[prop=val,prop2=val2]     -- 모든 블록 상태 속성이 일치할 때만
#   #namespace:tag                    -- 해당 태그 아래의 모든 재질로 확장
#   #namespace:tag[prop=val]          -- 속성이 일치할 때만 태그 멤버로 카운트
#   *[prop=val]                       -- 속성이 일치할 때 임의의 재질에 매칭(와일드카드)
#
# 속성 값은 Bukkit BlockData 의 문자열 형식과 대소문자를 무시하여 비교됩니다.
# 알 수 없는 태그는 빈 집합으로 확장됩니다 (no-op, fail-open). 형식이 잘못된
# 토큰은 리로드 시 WARN 레벨로 한 번만 로그에 출력됩니다 (REQ-RTP-S-004).
# 리스트 내 순서는 중요하지 않습니다.
# 무적 시간(초)
# 텔레포트 후 플레이어가 무적이 되는 시간. 도착 직후 화재·질식·낙하 피해로 죽는 것을 방지합니다.
무적시간: 5

# 안전 검사 반경(블록)
# 대상 블록 주변의 위험 검사 반경.
# 클수록 안전하지만 적절한 착지점을 찾기 어려워집니다.
안전반경: 0

# 오래된 청크 재시도 한도(횟수)
# ADR-015 / REQ-RTP-S-005 에서 오래된 청크 가드의 유한 재시도 예산. 비동기 청크 로드
# 완료 후, 후속 블록 평가 작업은 Count-Bound 작업 파이프라인 (Folia 의 Region Thread
# 스케줄러) 에 큐잉됩니다. 파이프라인이 포화 상태인 경우, 네이티브 청크 GC 가 해당
# 작업이 실행되기 전에 청크를 언로드할 수 있으며, 방치 시 Region Thread 에서 동기
# 로드가 발생하여 Folia 의 Watchdog 을 일으킵니다. 가드가 이러한 경합을 감지하면
# 최대 이 횟수만큼 비동기 로드를 재큐잉합니다. 모두 소진되면 이 후보는 일반 "unsafe"
# 경로로 거부됩니다 (WARN 로그를 출력. 조용히 폐기하지 않습니다).
# 기본값: 2. 매우 공격적인 청크 GC 를 가진 포크에서만 증가시키세요.
staleChunkRetryLimit: 2

# 읽기 전용 Anvil 사전 필터 (Vanilla Spigot 만 해당)
# 영구 저장된 리전 파일 `r.X.Z.mca` 를 스레드 외부에서 파싱하는 안전 프로브로,
# 명백히 안전하지 않은 후보(heightmap 표면이 lava/magma/fire)에 대해 라이브 권위
# 청크 로드를 요청하기 전에 거부합니다. Vanilla Spigot 에서는 라이브 청크 로드 API 가
# 진정한 비동기가 아니므로 tick 스레드의 부하를 줄여줍니다. Paper / Folia 에서는
# 네이티브 비동기 API 가 청크 로드 경로를 대체하여 사전 필터에 도달하지 않으므로
# 효과가 없습니다.
# ACCEPT 시에는 chunk.isSafe(...) 의 라이브 재검사가 권위로 남습니다. REJECT 만이
# 단축 경로입니다. ADR-016 / REQ-RTP-S-005 참조.
# 기본값: true. 이국적인 리전 형식을 사용하는 포크에서는 사전 필터를 비활성화하기 위해
# false 로 설정하세요.
anvilPrefilterEnabled: true

# 착지 플랫폼
# 텔레포트 목적지에 착지용 플랫폼을 생성합니다. 중심 블록은 목적지 블록 종류에 따라 선택됩니다.
# 플랫폼을 비활성화하려면 platformRadius 를 -1 로 설정하세요.
# 기본값: -1 (비활성화) — 최신 안전 검사 (chunk.isSafe + 수직 조정) 가 신뢰할 수 있는
# 착지점을 안정적으로 제공하므로, 이 비상용 플랫폼 (유리 블록) 은 기본적으로 비활성화됩니다.
# 구식 폴백이 필요할 만큼 안전하지 않은 착지가 발생할 때만 0 이상으로 설정하세요.
플랫폼반경: -1

# Depth (vertical thickness) of the emergency platform.
# @type: integer
# @range: [1, null]
# @unit: blocks
# @default: 1
플랫폼깊이: 1

# 플랫폼 위에 보장할 공기의 높이.
# 너무 높으면 광원 환경이 이상해질 수 있습니다.
플랫폼공기높이: 2

# 목적지에 고체 블록이 없을 때 플랫폼에 사용할 기본 재질.
플랫폼재질: "GLASS"

# 공기 블록
# 통과 가능/플레이어 신체를 막지 않는 것으로 간주되는 재질. 전방 호환성을 위해
# 가능한 한 바닐라 블록 태그를 우선하세요
# (예: 향후 MC 가 추가하는 꽃은 #minecraft:small_flowers 에서 자동으로 선택됨).
공기블록:
  # 진정한 air 변형 (이 모두를 커버하는 태그는 없음)
  - "AIR"
  - "CAVE_AIR"
  - "VOID_AIR"
  - "LEGACY_AIR"
  - "STRUCTURE_VOID"
  - "LIGHT"
  # 꽃 (민들레, 양귀비, 튤립, 아이블로섬, 횃불꽃…)
  - "#minecraft:flowers"
  - "#minecraft:small_flowers"
  # Note: #minecraft:tall_flowers is an item-only tag in vanilla; its members
  # (LILAC, PEONY, ROSE_BUSH, SUNFLOWER, PITCHER_PLANT) are already covered by
  # #minecraft:flowers above.
  - "#minecraft:tall_flowers"
  # 풀 종류와 꽃 태그에 포함되지 않는 관목
  - "SHORT_GRASS"
  - "TALL_GRASS"
  - "SHORT_DRY_GRASS"
  - "TALL_DRY_GRASS"
  - "FERN"
  - "LARGE_FERN"
  - "DEAD_BUSH"
  - "BUSH"
  - "WILDFLOWERS"
  - "FIREFLY_BUSH"
  - "LEGACY_LONG_GRASS"
  - "LEGACY_DEAD_BUSH"
  # 묘목, 번식 새싹, 버섯
  - "#minecraft:saplings"
  - "BROWN_MUSHROOM"
  - "RED_MUSHROOM"
  - "CRIMSON_FUNGUS"
  - "WARPED_FUNGUS"
  # 작물과 편리한 태그가 없는 지표 식물
  - "#minecraft:crops"
  - "MELON_STEM"
  - "PUMPKIN_STEM"
  - "SUGAR_CANE"
  - "BAMBOO_SAPLING"
  # 덩굴과 벽걸이 식물
  - "VINE"
  - "GLOW_LICHEN"
  - "WEEPING_VINES"
  - "TWISTING_VINES"
  - "HANGING_ROOTS"
  - "PALE_HANGING_MOSS"
  - "RESIN_CLUMP"
  # 레일
  - "#minecraft:rails"
  # 레드스톤 회로 (통합 태그 없음)
  - "REDSTONE_WIRE"
  - "COMPARATOR"
  - "REPEATER"
  - "LEVER"
  - "STRING"
  - "TRIPWIRE"
  # 횃불 및 조명 (통합 태그 없음)
  - "TORCH"
  - "WALL_TORCH"
  - "SOUL_TORCH"
  - "SOUL_WALL_TORCH"
  - "REDSTONE_TORCH"
  - "REDSTONE_WALL_TORCH"
  - "END_ROD"
  # 버튼 (석재/목재의 모든 변형)
  - "#minecraft:buttons"
  # 압력판
  - "#minecraft:pressure_plates"
  # 표지판 -- 직립/벽걸이/매달린 모든 변형 (4 개의 태그)
  - "#minecraft:standing_signs"
  - "#minecraft:wall_signs"
  - "#minecraft:ceiling_hanging_signs"
  - "#minecraft:wall_hanging_signs"
  - "LEGACY_SIGN"
  - "LEGACY_WALL_SIGN"
  # 지표 카펫
  - "SNOW"
  - "MOSS_CARPET"
  - "PALE_MOSS_CARPET"
  - "LEAF_LITTER"

# 위험 블록
# 플러그인이 착지점으로 거부할 재질 또는 블록 상태. `safetyRadius` 범위 내에
# 있는 경우에도 거부됩니다. 상태 술어와 와일드카드를 지원합니다 (파일 상단 구문 참조).
위험블록:
  # 유체
  - "WATER"
  - "LAVA"
  - "BUBBLE_COLUMN"
  # 침수 블록 (반/계단/울타리/벽/표지판/체인/…) — 구식 의사 토큰
  # 'WATERLOGGED' 를 대체합니다. ADR-017 의 와일드카드를 사용합니다.
  - "*[waterlogged=true]"
  # 화염 및 고온 위험물
  - "#minecraft:fire"
  - "POWDER_SNOW"
  - "MAGMA_BLOCK"
  # 모닥불 (점화/미점화 모두 플레이어가 빠지므로 위험)
  - "#minecraft:campfires"
  # 접촉 피해 / 걸림
  - "CACTUS"
  - "SWEET_BERRY_BUSH"
  - "WITHER_ROSE"
  - "CHORUS_PLANT"
  - "CHORUS_FLOWER"
  - "POINTED_DRIPSTONE"
  - "COBWEB"
  - "CREAKING_HEART"
  # 공허 / 포털 / 이동 불가
  - "BEDROCK"
  - "NETHER_PORTAL"
  - "END_PORTAL"
  - "END_GATEWAY"
  # 폭발물
  - "TNT"
  - "END_CRYSTAL"
  - "RESPAWN_ANCHOR"
  # 수중 식물 (질식 위험)
  - "SEAGRASS"
  - "TALL_SEAGRASS"
  - "KELP"
  - "KELP_PLANT"
  - "#minecraft:logs"

# 바이옴 필터
# biomeWhitelist: false -> `biomes` 리스트는 블랙리스트 (이들을 건너뜀)
#                  true  -> `biomes` 리스트는 화이트리스트 (이들만 허용)
# 기본 블랙리스트는 해양·강·공허, 기타 견고한 안전 착지점을 얻기
# 어렵거나 불가능한 바이옴을 제외합니다.
바이옴화이트리스트: false

# Biomes treated as whitelist or blacklist members per biomeWhitelist.
# @type: list<biome>
# @source: biome
바이옴:
