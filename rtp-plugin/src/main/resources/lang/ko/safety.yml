# --- RTP 안전 설정 ---
# 플러그인이 텔레포트 목적지를 "안전"하다고 판단하는 기준을 설정합니다.
# 토큰 구문:
# MATERIAL -- 단순 재질, 예: LAVA
# MATERIAL[prop=val,prop2=val2] -- 모든 블록 상태 속성이 일치할 때만
# #namespace:tag -- 해당 태그 아래의 모든 재질로 확장
# #namespace:tag[prop=val] -- 속성이 일치할 때만 태그 멤버로 카운트
# *[prop=val] -- 속성이 일치할 때 임의의 재질에 매칭(와일드카드)
# 속성 값은 Bukkit BlockData 의 문자열 형식과 대소문자를 무시하여 비교됩니다.
# 알 수 없는 태그는 빈 집합으로 확장됩니다 (no-op, fail-open). 형식이 잘못된
# 토큰은 리로드 시 WARN 레벨로 한 번만 로그에 출력됩니다 .
# 리스트 내 순서는 중요하지 않습니다.
# 무적 시간(초)
# 텔레포트 후 플레이어가 무적이 되는 시간. 도착 직후 화재·질식·낙하 피해로 죽는 것을 방지합니다.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 5"
무적시간: 5

# 안전 검사 반경(블록)
# 대상 블록 주변의 위험 검사 반경.
# 클수록 안전하지만 적절한 착지점을 찾기 어려워집니다.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 0
안전반경: 0

# 착지 플랫폼
# 텔레포트 목적지에 착지용 플랫폼을 생성합니다. 중심 블록은 목적지 블록 종류에 따라 선택됩니다.
# 플랫폼을 비활성화하려면 platformRadius 를 -1 로 설정하세요.
# 기본값: -1 (비활성화) — 최신 안전 검사 (chunk.isSafe + 수직 조정) 가 신뢰할 수 있는
# 착지점을 안정적으로 제공하므로, 이 비상용 플랫폼 (유리 블록) 은 기본적으로 비활성화됩니다.
# 구식 폴백이 필요할 만큼 안전하지 않은 착지가 발생할 때만 0 이상으로 설정하세요.
# @type: integer
# @range: [-1, null]
# @unit: blocks
# @default: -1
플랫폼반경: -1

# Depth (vertical thickness) of the emergency platform.
# @type: integer
# @range: [1, null]
# @unit: blocks
# @default: 1
플랫폼깊이: 1

# 플랫폼 위에 보장할 공기의 높이.
# 너무 높으면 광원 환경이 이상해질 수 있습니다.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 2
플랫폼공기높이: 2

# 목적지에 고체 블록이 없을 때 플랫폼에 사용할 기본 재질.
# @type: material
# @source: material
# @default: GLASS
플랫폼재질: "GLASS"

# 플랫폼 자리를 원래 블록으로 복원하기까지의 초. -1 = 안 함(영구), 0 = 청크가
# 다시 로드되는 즉시. 카운트다운은 청크가 로드된 동안에만 진행되며 재시작 후에도
# 유지됩니다.
# @type: integer
# @range: [-1, null]
# @unit: seconds
# @default: -1
platformRestoreSeconds: -1

# --- Optional PvP / combat-tag pre-flight gate ---
# 마스터 토글. true이면 /rtp는 전투 상태를 확인하고 대기열 등록 전과 텔레포트
# 전에 아래의 pvpOnCombat을 적용합니다.
# @type: boolean
# @default: false
pvpCheckEnabled: false

# PvP 피해 후 플레이어가 "전투 중"으로 간주되는 초(기본 추적기만 해당; 외부
# combat-tag 플러그인이 연결된 경우 무시됨).
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 15"
pvpCombatTagSeconds: 15

# What to do when a combat-tagged player requests (or is mid-)/rtp.
# ALLOW  - permit, but log an audit line
# DENY   - refuse the command with the busy message
# DELAY  - postpone until the combat tag expires, then proceed
# CANCEL - abort an in-progress / queued teleport
# Unknown values fail safe to DENY.
# @type: enum
# @options: [ALLOW, DENY, DELAY, CANCEL]
# @default: DENY
pvpOnCombat: "DENY"

# Combat-state source preference.
# AUTO     - external combat-tag plugin if one is bound, else native tracker
# NATIVE   - always use RTP's native damage tracker
# EXTERNAL - only a bound combat-tag plugin (no native fallback)
# @type: enum
# @options: [AUTO, NATIVE, EXTERNAL]
# @default: AUTO
pvpSource: "AUTO"

# Native tracker: tag a player who TAKES PvP damage.
# @type: boolean
# @default: true
pvpTagVictim: true

# Native tracker: tag a player who DEALS PvP damage.
# @type: boolean
# @default: true
pvpTagAggressor: true

# 오래된 청크 재시도 한도(횟수)
# 에서 오래된 청크 가드의 유한 재시도 예산. 비동기 청크 로드
# 완료 후, 후속 블록 평가 작업은 Count-Bound 작업 파이프라인 (Folia 의 Region Thread
# 스케줄러) 에 큐잉됩니다. 파이프라인이 포화 상태인 경우, 네이티브 청크 GC 가 해당
# 작업이 실행되기 전에 청크를 언로드할 수 있으며, 방치 시 Region Thread 에서 동기
# 로드가 발생하여 Folia 의 Watchdog 을 일으킵니다. 가드가 이러한 경합을 감지하면
# 최대 이 횟수만큼 비동기 로드를 재큐잉합니다. 모두 소진되면 이 후보는 일반 "unsafe"
# 경로로 거부됩니다 (WARN 로그를 출력. 조용히 폐기하지 않습니다).
# 기본값: 2. 매우 공격적인 청크 GC 를 가진 포크에서만 증가시키세요.
# @type: integer
# @range: [0, null]
# @default: 2"
staleChunkRetryLimit: 2

# 읽기 전용 Anvil 사전 필터 (Vanilla Spigot 만 해당)
# 영구 저장된 리전 파일 `r.X.Z.mca` 를 스레드 외부에서 파싱하는 안전 프로브로,
# 명백히 안전하지 않은 후보(heightmap 표면이 lava/magma/fire)에 대해 라이브 권위
# 청크 로드를 요청하기 전에 거부합니다. Vanilla Spigot 에서는 라이브 청크 로드 API 가
# 진정한 비동기가 아니므로 tick 스레드의 부하를 줄여줍니다. Paper / Folia 에서는
# 네이티브 비동기 API 가 청크 로드 경로를 대체하여 사전 필터에 도달하지 않으므로
# 효과가 없습니다.
# ACCEPT 시에는 chunk.isSafe(...) 의 라이브 재검사가 권위로 남습니다. REJECT 만이
# 단축 경로입니다. 참조.
# 기본값: true. 이국적인 리전 형식을 사용하는 포크에서는 사전 필터를 비활성화하기 위해
# false 로 설정하세요.
# @type: boolean
# @default: true
anvilPrefilterEnabled: true

# 버전 번호는 변경하지 마세요
version: 1.0
