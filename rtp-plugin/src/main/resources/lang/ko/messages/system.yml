# --- RTP 메시지 (이 언어) ---
# 이 언어의 플레이어 및 운영자용 메시지 문구로, 주제별로 분류되어 있습니다.
# 영어 메시지에서 자동 생성된 사본입니다. 직접 편집하지 마세요 (덮어쓰여집니다).

# ###############################################################################
# 섹션 4: 시스템 / 관리
# ###############################################################################
구파일: "&b[P0] 오래된 [filename] 을(를) 감지했습니다. 업데이트 중"

# 설정 파일에 없는 bukkit 월드를 감지했습니다
# 자리표시자: [world] - 감지된 월드
신규월드: "&b[P0] 새 월드 '[world]' 을(를) 감지했습니다"

# 플러그인 리로드 / 업데이트 메시지
# 자리표시자: [filename] - 파일 이름
리로드중: "&b[P0] [filename] 을(를) 로딩 중……"
리로드완료: "&b[P0] [filename] 로딩이 완료되었습니다."
업데이트중: "&a[P0] [filename] 업데이트 중……"
업데이트완료: "&a[P0] [filename] 업데이트가 정상적으로 완료되었습니다."

# ###############################################################################
# 섹션 5: 관리 로그
# ###############################################################################
위치저장: "&7[P0] [region] 의 위치 [amount] 개를 저장했습니다"
위치로드: "&7[P0] [region] 의 위치 [amount] 개를 로드했습니다"

# ###############################################################################
# 섹션 11: 메타데이터
# ###############################################################################
version: 1.0

