# --- RTP 연동 설정 ---
# 각 토글은 지정된 플러그인의 클레임/영역 안에 도착하면 목적지를 다시 추첨합니다(해당 플러그인이 설치된 경우에만 작동).
# Factions 클레임 안에 도착하면 위치를 다시 추첨합니다.
# @type: boolean
# @default: false
rerollFactions: false

# GriefDefender 클레임 안에 도착하면 위치를 다시 추첨합니다.
# @type: boolean
# @default: false
rerollGriefDefender: false

# GriefPrevention 클레임 안에 도착하면 위치를 다시 추첨합니다.
# @type: boolean
# @default: false
rerollGriefPrevention: false

# HuskTowns 클레임 안에 도착하면 위치를 다시 추첨합니다.
# @type: boolean
# @default: false
rerollHuskTowns: false

# Lands 클레임 안에 도착하면 위치를 다시 추첨합니다.
# @type: boolean
# @default: false
rerollLands: false

# RedProtect 영역 안에 도착하면 위치를 다시 추첨합니다.
# @type: boolean
# @default: false
