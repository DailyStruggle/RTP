# --- RTP 메시지(한국어) ---
# 플레이어와 콘솔에 표시되는 메시지의 한국어 번역.
# 중요 사항:
# - 이 파일의 키 이름은 lang/ko/messages.lang.yml 의 오른쪽 열(내부 키 이름의
# 한국어 번역)과 일치해야 합니다. messages.lang.yml 에 없는 키는 영어
# 기준선(lang/messages.lang.yml)의 영어 키 이름으로 폴백합니다.
# - 대괄호 자리표시자는 그대로 두세요: [P0], [delay], [attempts],
# [world], [region], [remainingCooldown], [scan_chunks] 등.
# - 색상 코드 &a &e &c 와 HEX 색상 (#2636ef) 은 그대로 두세요.
# ###############################################################################
# 섹션 1: 일반 설정
# ###############################################################################
자리표시자:
  # P0
  - "[RTP]"

# ###############################################################################
# 섹션 2: 텔레포트
# ###############################################################################
이미텔레포트중: "&e[P0] 이미 텔레포트 중입니다!"

# 플러그인이 현재 리로드 중일 때
텔레포트거부_리로드중: "&e[P0] 플러그인 리로드 중이므로 텔레포트가 일시적으로 비활성화되었습니다. 잠시 후 다시 시도해 주세요."
지연메시지: "&e[P0] [delay] 후에 텔레포트합니다. 움직이지 마세요."
청크로딩중: "&e[P0] 청크를 로딩 중입니다. 잠시 기다려 주세요……"
텔레포트메시지: "&e[P0] [attempts] 회 시도로 텔레포트했습니다 ([processingTime])"

# if teleport is cancelled
텔레포트취소: "&e[P0] 텔레포트가 취소되었습니다!"

# 최대 시도 횟수에 도달해도 안전한 장소를 찾지 못한 경우
# 자리표시자: [attempts] - 최대 시도 횟수
위험: "&e[P0] [attempts] 회 시도해도 안전한 위치를 찾지 못했습니다"

# 플레이어가 쿨다운 중일 때
# 자리표시자: [remainingCooldown] - 남은 시간
쿨다운메시지: "&e[P0] 다시 텔레포트하려면 [remainingCooldown] 기다려야 합니다"

# 리전에 대기 중인 위치가 없고 플레이어가 rtp.unqueued 권한을 가지고 있지 않을 때
가능한위치없음: "#f5eb73[P0] 현재 사용 가능한 위치가 없습니다"

# 대기열이 이동했을 때
# 자리표시자: [spot] - 현재 대기열 위치
큐업데이트: "#2636ef[P0] 큐에서 당신의 순서: [spot]"

# 플레이어가 해당 리전에서 텔레포트하기에 충분한 돈이 없을 때
# 자리표시자: [money] - 명령어에 필요한 금액
잔액부족: "&e[P0] 이 작업에는 최소 $[money] 이(가) 필요합니다."

# ###############################################################################
# 섹션 3: 시간 표기
# ###############################################################################
일: "일"
시간: "시간"
분: "분"
초: "초"
밀리초: "밀리초"

# ###############################################################################
# 섹션 4: 시스템 / 관리
# ###############################################################################
구파일: "&b[P0] 오래된 [filename] 을(를) 감지했습니다. 업데이트 중"

# 설정 파일에 없는 bukkit 월드를 감지했습니다
# 자리표시자: [world] - 감지된 월드
신규월드: "&b[P0] 새 월드 '[world]' 을(를) 감지했습니다"

# bukkit 에 해당 월드가 존재하지 않습니다
# 자리표시자: [world] - 월드 이름
잘못된월드: "&e[P0] 월드 '[world]' 을(를) 찾을 수 없습니다"

# 플러그인 리로드 / 업데이트 메시지
# 자리표시자: [filename] - 파일 이름
리로드중: "&b[P0] [filename] 을(를) 로딩 중……"
리로드완료: "&b[P0] [filename] 로딩이 완료되었습니다."
업데이트중: "&a[P0] [filename] 업데이트 중……"
업데이트완료: "&a[P0] [filename] 업데이트가 정상적으로 완료되었습니다."

# 플러그인에 사용자가 요청한 명령어가 없습니다
# 자리표시자: [arg] - 시도된 인수
잘못된인수: "&c[P0] 잘못된 명령어 인수입니다 [arg]"

# 콘솔이 플레이어 전용 명령어를 실행하려 할 때
콘솔불가: "&c[P0] 이 명령어는 게임 내 플레이어로 실행해야 합니다."

# busy 와 invalidCommand 는 messages.lang.yml 에서 번역되지 않음 -> 영어 키 이름 (영어 기준선으로 폴백).
busy: "&c[P0] 처리 중"

# plugin doesn't have the subcommand or parameter the user requested
# placeholder: [arg] - the argument attempted
invalidCommand: "&c[P0] 잘못된 명령어 - [arg]"

# 사용자가 요청한 명령어에 대한 권한이 없습니다
권한없음: "&e죄송합니다. 이 명령어를 실행할 권한이 없습니다. 오류라고 생각되시면 서버 관리자에게 문의하세요."

# ###############################################################################
# 섹션 5: 관리 로그
# ###############################################################################
위치저장: "&e[P0] [region] 의 위치 [amount] 개를 저장했습니다"
위치로드: "&e[P0] [region] 의 위치 [amount] 개를 로드했습니다"

# ###############################################################################
# 섹션 6: 스캔 명령어
# ###############################################################################
스캔시작: "&a[P0] 다음 리전에서 스캔 작업을 시작했습니다: [scan_regions]"
스캔리셋: "&e[P0] 다음 리전의 스캔 큐를 초기화했습니다: [scan_regions]"
스캔취소: "&e[P0] 다음 리전의 스캔 작업을 취소했습니다: [scan_regions]"
스캔일시중지: "#A020F0[P0] 다음 리전의 스캔 작업을 일시 중지했습니다: [scan_regions]"
스캔재개: "#10A5F5[P0] 다음 리전의 스캔 작업을 재개했습니다: [scan_regions]"
스캔실행중: "&c[P0] 다음 리전에서는 이미 스캔 작업이 실행 중입니다: [scan_regions]"
스캔미실행: "&c[P0] 다음 리전에는 현재 스캔 작업이 없습니다: [scan_regions]"
# placeholder: [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
스캔상태: "&a[P0] [scan_chunks] / [scan_totalChunks] 청크 완료 (리전: [scan_regions]). [scan_cps] cps. 육지 비율: [scan_landPercentage]%. 남은 시간: [scan_eta]"

# ###############################################################################
# 섹션 7: 정보 명령어
# ###############################################################################
정보제목: "&a======RTP 정보======"
정보_티켓: "&7전역 활성 청크 티켓: &f[tickets]"
정보_텔레포트: "&7활성 텔레포트 상태 머신: &f[teleports]"
정보_MSPT: "&7플러그인 현재 MSPT: &f[mspt]"
정보_총로드수: "&7누적 로드된 청크 수: &f[loads]"
infoLoadsByOrigin: "&7Loads by Origin: &f[loadsByOrigin]"
정보_누수율: "&7현재 청크 누수율: &f[leakRate]"
# --- Metrics SPI health block (METRICS_PLAN.md > /rtp info Surface) ---
infoQueueDepth: "&7Players Waiting In Region Queues: &f[queueDepth]"
infoPendingTeleports: "&7Pending Teleport Pipelines: &f[pendingTeleports]"
infoAvgPipelineMs: "&7Avg Pipeline Latency: &f[avgPipelineMs] ms"
infoHeap: "&7JVM Heap: &f[heapUsedMb] / [heapMaxMb] MiB"
# /rtp info 의 Health pipeline 라벨 블록 헤더 줄.
infoHealthPipelineHeader: "&7--- Health: pipeline ---"
# 1m / 5m / 15m 윈도우의 TPS 표시. 자리표시자: [tps1m] [tps5m] [tps15m].
infoTps: "&7TPS (1m/5m/15m): &f[tps1m] / [tps5m] / [tps15m]"
# 서버 실시간 MSPT 및 tick 예산 사용률. 자리표시자: [mspt] [tickBudgetUtilisation].
infoMSPTLive: "&7Server MSPT: &f[mspt] ms (&7tick budget: &f[tickBudgetUtilisation]&7)"
# Configured player soft-cap vs current online count. Placeholders: [softCap] [playerCount].
infoSoftCap: "&7Players: &f[playerCount] / [softCap]"
# 데이터베이스의 최근 왕복 지연 시간 (ms). 자리표시자: [databaseLatencyMs].
infoDatabaseLatencyMs: "&7Database Latency: &f[databaseLatencyMs] ms"
# Health colour-band thresholds. Doubles consumed by ColourBands in rtp-core
# to wrap coloured-variant placeholders (e.g. [tps1mColoured]) with &a/&e/&c.
infoThresholdTpsGreen: 19.5
infoThresholdTpsYellow: 18.0
infoThresholdMsptGreen: 30.0
infoThresholdMsptYellow: 45.0
infoThresholdCacheFillGreen: 0.5
infoThresholdCacheFillYellow: 0.25
infoThresholdNetworkAgeYellow: 5.0
# Header line introducing the per-Folia-region table (Folia runtime only).
infoFoliaRegionsHeader: "&7--- Folia regions ---"
# Per-row template for a single Folia region. Placeholders: [regionId] [tps1m]
# [mspt] [playerCount] [queueDepth] [tickBudgetUtilisation].
infoFoliaRegion: "  &f[regionId]&7: tps=&f[tps1m]&7 mspt=&f[mspt]&7 players=&f[playerCount]&7 queue=&f[queueDepth]&7 budget=&f[tickBudgetUtilisation]"
정보_면책_헤더: "&7--- 진단 노트 ---"
정보_면책: "&7진단 노트: 서버의 고립 청크 총수가 본 플러그인의 누적 로드 수 ([loads]) 를 초과하는 경우, 본 플러그인이 메모리 누수의 유일한 원인은 아닙니다."
정보_월드헤더: "#008080월드:"
정보_콘솔_월드헤더: "&7--- 월드 ---"
정보월드: "  #21ADA8[world]"
정보_리전헤더: "#63C5DA리전:"
정보_콘솔_리전헤더: "&7--- 리전 ---"
정보리전: "  #52B2BF[region]"

# sub-info listings
# placeholders: [world], [region], [requirePermission], [override], [shape], [worldBorderOverride], [cacheCap], [cached], [keptCache], [unkeptCache], [backlogCache], [backlogCacheCap]
월드정보:
  - "#21ADA8[world]:"
