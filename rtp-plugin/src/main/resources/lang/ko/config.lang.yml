# --- 언어 매핑: config.yml ---
# 내부 설정 키 이름(왼쪽)을 config.yml 에서 운영자에게 보이는 키 이름(오른쪽)에 매핑합니다.
# 옵션 이름을 변경하거나 번역하려면 오른쪽만 편집하세요.
# 왼쪽은 코드 상수이므로 변경하지 마세요.
# 이 파일이 존재하지 않으면 플러그인은 좌우가 동일한 영어 버전을 다시 생성합니다.
database: "데이터베이스"
playerCommands: "플레이어명령어"
teleportCooldown: "텔레포트쿨다운"
cancelDistance: "취소거리"
teleportDelay: "텔레포트지연"
consoleCommands: "콘솔명령어"
version: "version"
network: "네트워크"
