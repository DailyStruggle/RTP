# --- Mapeo de Idioma: economy.yml ---
# Asigna las claves internas (izquierda) a los nombres visibles para el
# usuario en economy.yml (derecha). Modifica únicamente el lado derecho para
# renombrar o traducir una opción; el lado izquierdo es una constante de
# código y no debe cambiarse.
# Si este archivo falta, el plugin lo regenera con pares idénticos
# izquierda/derecha (los valores por defecto en inglés).

balanceFloor: saldoMinimo
price: precio
priceOther: precioOtro
refundOnCancel: reembolsoAlCancelar
biomePrice: precioBioma
paramsPrice: precioParametros
version: version
