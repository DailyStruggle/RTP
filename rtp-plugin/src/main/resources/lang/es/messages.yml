# --- Mensajes de RTP (Español) ---
# Traducción de los mensajes visibles para el jugador y la consola.
#
# IMPORTANTE:
#   - Conservar los marcadores entre corchetes tal cual: [P0], [delay], [attempts],
#     [world], [region], [remainingCooldown], [scan_chunks], etc.
#   - Conservar los códigos de color &a &e &c y hexadecimales (#2636ef).
#   - Las claves que faltan aquí se rellenan automáticamente con el inglés.
#
# REQ-RTP-F-013 / ADR-020.

################################################################################
# Sección 1: Configuración general
################################################################################
placeholders:
  - "[RTP]" #P0

################################################################################
# Sección 2: Teletransporte
################################################################################
alreadyTeleporting: "&e[P0] ¡ya te estás teletransportando!"
teleportDeniedReloading: "&e[P0] los teletransportes están desactivados temporalmente mientras el plugin se recarga. Inténtalo de nuevo en unos instantes."
delayMessage: "&e[P0] Teletransportando en [delay]. No te muevas."
chunkLoading: "&e[P0] Cargando chunks, por favor espera..."
teleportMessage: "&e[P0] Teletransportado en [attempts] intentos, en [processingTime]"
teleportCancel: "&e[P0] ¡Teletransporte cancelado!"
unsafe: "&e[P0] no se encontró una ubicación segura en [attempts] intentos"
cooldownMessage: "&e[P0] No puedes teletransportarte otra vez hasta dentro de [remainingCooldown]"
noLocationsQueued: "#f5eb73[P0] no hay ubicaciones listas en este momento"
queueUpdate: "#2636ef[P0] tu puesto en la cola: [spot]"
notEnoughMoney: "&e[P0] necesitas al menos $[money] para eso."

################################################################################
# Sección 3: Formato de tiempo
################################################################################
days: "d"
hours: "h"
minutes: "m"
seconds: "s"
millis: "ms"

################################################################################
# Sección 4: Sistema y administración
################################################################################
oldFile: "&b[P0] se detectó un [filename] antiguo. Actualizando"
newWorld: "&b[P0] se detectó un nuevo mundo '[world]'"
invalidWorld: "&e[P0] no se pudo encontrar el mundo '[world]'"
reloading: "&b[P0] cargando [filename]..."
reloaded: "&b[P0] [filename] cargado correctamente."
updating: "&a[P0] actualizando [filename]..."
updated: "&a[P0] [filename] actualizado correctamente."
badArg: "&c[P0] argumento de comando no válido [arg]"
consoleCmdNotAllowed: "&c[P0] Debes ser un jugador en el juego para ejecutar este comando."
busy: "&c[P0] ocupado"
invalidCommand: "&c[P0] comando no válido - [arg]"
noPerms: "&eLo sentimos, pero no tienes permiso para ejecutar este comando. Contacta con los administradores del servidor si crees que esto es un error."

################################################################################
# Sección 5: Registros administrativos
################################################################################
locationSaved: "&e[P0] Se guardaron correctamente [amount] ubicaciones para [region]"
locationLoaded: "&e[P0] Se cargaron correctamente [amount] ubicaciones para [region]"

################################################################################
# Sección 6: Comando Scan
################################################################################
scanStart: "&a[P0] tarea de escaneo iniciada para las regiones: [scan_regions]"
scanReset: "&e[P0] cola de escaneo reiniciada para las regiones: [scan_regions]"
scanCancel: "&e[P0] tarea de escaneo cancelada para las regiones: [scan_regions]"
scanPause: "#A020F0[P0] tarea de escaneo pausada para las regiones: [scan_regions]"
scanResume: "#10A5F5[P0] tarea de escaneo reanudada para las regiones: [scan_regions]"
scanRunning: "&c[P0] ya hay una tarea de escaneo en curso para las regiones: [scan_regions]"
scanNotRunning: "&c[P0] no hay ninguna tarea de escaneo en curso para las regiones: [scan_regions]"
scanStatus: "&a[P0] completados [scan_chunks] / [scan_totalChunks] chunks para las regiones: [scan_regions]. [scan_cps] cps. Porcentaje de tierra: [scan_landPercentage]%. Tiempo restante: [scan_eta]"

################################################################################
# Sección 7: Comando Info
################################################################################
infoTitle: "&a======Información de RTP======"
infoTickets: "&7Tickets de chunks activos globales: &f[tickets]"
infoTeleports: "&7Máquinas de estado de teletransporte activas: &f[teleports]"
infoMSPT: "&7MSPT actual del plugin: &f[mspt]"
infoTotalLoads: "&7Chunks cargados de por vida: &f[loads]"
infoLeakRate: "&7Tasa actual de fuga de chunks: &f[leakRate]"
infoDisclaimerHeader: "&7--- Aviso de diagnóstico ---"
infoDisclaimer: "&7Nota de diagnóstico: Si el número total de chunks huérfanos del servidor supera el total histórico de cargas de este plugin ([loads]), este plugin no es la única causa de la fuga de memoria."
infoWorldHeader: "#008080Mundos:"
infoConsoleWorldHeader: "&7--- Mundos ---"
infoWorld: "  #21ADA8[world]"
infoRegionHeader: "#63C5DARegiones:"
infoConsoleRegionHeader: "&7--- Regiones ---"
infoRegion: "  #52B2BF[region]"

worldInfo:
  - "#21ADA8[world]:"
  - "#99EEBB  - región: [region]"
  - "#99EEBB  - requierePermiso: [requirePermission]"
  - "#99EEBB  - sobrescribir: [override]"

regionInfo:
  - "#52B2BF[region]:"
  - "#58CCED  - mundo: [world]"
  - "#58CCED  - forma: [shape]"
  - "#58CCED  - requierePermiso: [requirePermission]"
  - "#58CCED  - sobrescrituraDeBorde: [worldBorderOverride]"
  - "#58CCED  - capacidadCache: [cacheCap]"
  - "#58CCED  - cacheRetenida: [keptCache]"
  - "#58CCED  - enCache: [cached]"

################################################################################
# Sección 8: Descripciones de comandos
################################################################################
rtp: "&b/rtp - teletranspórtate a una ubicación aleatoria"
help: "&b/rtp help - mostrar esta ayuda"
reload: "&b/rtp reload - recargar los archivos de configuración"
scan: "&b/rtp scan - probar todas las ubicaciones posibles de la región para mejorar los tiempos de carga"

################################################################################
# Sección 9: Soporte de PlaceholderAPI
################################################################################
PLAYER_AVAILABLE: "&aDISPONIBLE"
PLAYER_COOLDOWN: "&eEN ESPERA"
PLAYER_SETUP: "&bELIGIENDO UBICACIÓN"
PLAYER_LOADING: "&bCARGANDO CHUNKS"
PLAYER_TELEPORTING: "&bTELETRANSPORTANDO"

################################################################################
# Sección 10: Elementos visuales
################################################################################
title: "&a¡Teletransportado!"
subtitle: "&b¡diviértete!"
fadeIn: 20
stay: 20
fadeOut: 20

actionbar: ""

