# --- Mensajes de RTP (Español) ---
# Traducción de los mensajes visibles para el jugador y la consola.
# IMPORTANTE:
# - Los nombres de clave de este archivo se corresponden con la columna
# derecha de lang/es/messages.lang.yml (la traducción de los nombres de
# clave internos del plugin). Si una clave no aparece en messages.lang.yml,
# se utiliza la clave en inglés del archivo base (lang/messages.lang.yml).
# - Conservar los marcadores entre corchetes tal cual: [P0], [delay], [attempts],
# [world], [region], [remainingCooldown], [scan_chunks], etc.
# - Conservar los códigos de color &a &7 &c y hexadecimales (#2636ef).
# ###############################################################################
# Sección 1: Configuración general
# ###############################################################################
marcadores:
  # P0
  - "[RTP]"

# ###############################################################################
# Sección 2: Teletransporte
# ###############################################################################
yaTeletransportando: "&7[P0] ⚡ ¡ya te estás teletransportando!"

# si el plugin se está recargando actualmente
teletransporteDenegadoRecargando: "&7[P0] los teletransportes están desactivados temporalmente mientras el plugin se recarga. Inténtalo de nuevo en unos instantes."
mensajeRetraso: "<gradient:#9D7CD8:#5FB3B3>[P0] ⚡ Teletransportando en [delay]. No te muevas.</gradient>"
cargaDeChunk: "&7[P0] ⚙ Cargando chunks, por favor espera..."
mensajeTeletransporte: "<gradient:#5FB3B3:#9D7CD8>[P0] ⚡ Teletransportado en [attempts] intentos, en [processingTime]</gradient>"

# if teleport is cancelled
cancelarTeletransporte: "&7[P0] ⚡ ¡Teletransporte cancelado!"

# si no hay lugares seguros tras alcanzar el máximo de intentos
# marcador: [attempts] - el número máximo de intentos
inseguro: "&7[P0] ⌖ no se encontró una ubicación segura en [attempts] intentos"

# cuando el jugador está en tiempo de reutilización
# marcador: [remainingCooldown] - el tiempo restante
mensajeEnfriamiento: "&7[P0] ⚡ No puedes teletransportarte otra vez hasta dentro de [remainingCooldown]"

# when the player has reached the lockAfterUses cap and is locked out (BetterRTP LockAfter parity)
lockedAfterUses: "&7[P0] ⌖ Has alcanzado tu límite de teletransporte aleatorio. Inténtalo de nuevo más tarde."

# si la región no tiene ubicaciones en cola y el jugador no tiene el permiso rtp.unqueued
sinUbicacionesEnCola: "#f5eb73[P0] ⌖ no hay ubicaciones listas en este momento"

# cuando la fila de espera avanza
# marcador: [spot] - la posición actual en la fila
actualizarCola: "#2636ef[P0] tu puesto en la cola: [spot]"

# si el jugador no tiene suficiente dinero para teletransportarse en la región
# marcador: [money] - cuánto dinero requiere el comando
dineroInsuficiente: "&7[P0] necesitas al menos $[money] para eso."

# ###############################################################################
# Sección 3: Formato de tiempo
# ###############################################################################
dias: "d"
horas: "h"
minutos: "m"
segundos: "s"
milisegundos: "ms"

# ###############################################################################
# Sección 4: Sistema y administración
# ###############################################################################
archivoAntiguo: "&b[P0] se detectó un [filename] antiguo. Actualizando"

# se detectó un mundo de bukkit que no está en el archivo de configuración
# marcador: [world] - el mundo detectado
mundoNuevo: "&b[P0] se detectó un nuevo mundo '[world]'"

# el mundo no existe en bukkit
# marcador: [world] - el nombre del mundo
mundoInvalido: "&7[P0] no se pudo encontrar el mundo '[world]'"

# texto de recarga / actualización del plugin
# marcador: [filename] - nombre del archivo
recargando: "&b[P0] cargando [filename]..."
recargado: "&b[P0] [filename] cargado correctamente."
actualizando: "&a[P0] actualizando [filename]..."
actualizado: "&a[P0] [filename] actualizado correctamente."

# el plugin no tiene el comando que el usuario solicitó
# marcador: [arg] - el argumento intentado
argumentoInvalido: "&c[P0] argumento de comando no válido [arg]"

# cuando la consola intenta ejecutar un comando solo para jugadores
comandoConsolaNoPermitido: "&c[P0] Debes ser un jugador en el juego para ejecutar este comando."

# busy y invalidCommand no se traducen en messages.lang.yml -> se usan las claves en inglés (fallback al baseline).
busy: "&c[P0] ocupado"

# Sent when the optional PvP combat check refuses /rtp because the player is in combat
pvpInCombat: "&c[P0] No puedes teletransportarte al azar mientras estás en combate."

# plugin doesn't have the subcommand or parameter the user requested
# placeholder: [arg] - the argument attempted
invalidCommand: "&c[P0] comando no válido - [arg]"

# el usuario no tiene permiso para el comando solicitado
sinPermisos: "&7Lo sentimos, pero no tienes permiso para ejecutar este comando. Contacta con los administradores del servidor si crees que esto es un error."

# ###############################################################################
# Sección 5: Registros administrativos
# ###############################################################################
ubicacionGuardada: "&7[P0] Se guardaron correctamente [amount] ubicaciones para [region]"
ubicacionCargada: "&7[P0] Se cargaron correctamente [amount] ubicaciones para [region]"

# ###############################################################################
# Sección 6: Comando Scan
# ###############################################################################
iniciarEscaneo: "&a[P0] tarea de escaneo iniciada para las regiones: [scan_regions]"
reiniciarEscaneo: "&7[P0] cola de escaneo reiniciada para las regiones: [scan_regions]"
cancelarEscaneo: "&7[P0] tarea de escaneo cancelada para las regiones: [scan_regions]"
pausarEscaneo: "#A020F0[P0] tarea de escaneo pausada para las regiones: [scan_regions]"
reanudarEscaneo: "#10A5F5[P0] tarea de escaneo reanudada para las regiones: [scan_regions]"
escaneoActivo: "&c[P0] ya hay una tarea de escaneo en curso para las regiones: [scan_regions]"
escaneoNoActivo: "&c[P0] no hay ninguna tarea de escaneo en curso para las regiones: [scan_regions]"
# placeholder: [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
estadoEscaneo: "[P0] &8» &7[scan_regions] &8| &7[scan_chunks]&8/&7[scan_totalChunks] &8| #7E9CC8[scan_cps]&7 cps &8| #7E9CC8[scan_landPercentage]%&7 tierra &8| &7ETA #7E9CC8[scan_eta]"
# Boss-bar title shown to players with rtp.scan permission while a world scan is running.
# Set to empty string to disable the boss-bar.
# placeholder: [scan_regions], [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
scanBossBar: "Scanning [scan_regions]: [scan_chunks]/[scan_totalChunks] ([scan_landPercentage]% land) ETA [scan_eta]"

# ###############################################################################
# Sección 7: Comando Info
# ###############################################################################
tituloInfo: "&2&l/rtp info"
infoTickets: "&7Tickets de chunks activos globales: #7E9CC8[tickets]"
infoTeletransportes: "&7Máquinas de estado de teletransporte activas: #7E9CC8[teleports]"
infoMSPT: "&7MSPT actual del plugin: #7E9CC8[mspt]"
infoCargasTotales: "&7Chunks cargados de por vida: #7E9CC8[loads]"
infoCargasPorOrigen: "&7Cargas por origen: #7E9CC8[loadsByOrigin]"
infoTasaFuga: "&7Tasa actual de fuga de chunks: #7E9CC8[leakRate]"
# --- Metrics SPI health block ---
infoQueueDepth: "&7Jugadores esperando en colas de región: #7E9CC8[queueDepth]"
infoPendingTeleports: "&7Tuberías de teletransporte pendientes: #7E9CC8[pendingTeleports]"
infoAvgPipelineMs: "&7Latencia media de la tubería: #7E9CC8[avgPipelineMs] ms"
# Pipeline-latency percentiles (ADR-053). Placeholders: [pipelineMsP50] [pipelineMsP75]
# [pipelineMsP90] [pipelineMsP95] [pipelineMsP99] [pipelineSampleCount].
infoPipelinePercentiles: "&7Latencia de pipeline (ms) P50/P75/P90/P95/P99: #7E9CC8[pipelineMsP50] / [pipelineMsP75] / [pipelineMsP90] / [pipelineMsP95] / [pipelineMsP99]&7 (n=[pipelineSampleCount])"
# Slow-teleport audit (ADR-053, immediate/unqueued teleports only). Placeholders:
# [slowPipelineCount] [slowPipelineThresholdMs].
infoSlowPipeline: "&7Teletransportes lentos (> #7E9CC8[slowPipelineThresholdMs]&7 ms): #7E9CC8[slowPipelineCount]"
# Queue-growth audit (ADR-053). Placeholders: [queueGrowthWarnCount] [queueGrowthWarnThreshold].
infoQueueGrowth: "&7Avisos de crecimiento de cola (>= #7E9CC8[queueGrowthWarnThreshold]&7): #7E9CC8[queueGrowthWarnCount]"
infoHeap: "&7Heap de la JVM: #7E9CC8[heapUsedMb] / [heapMaxMb] MiB"
# Línea de encabezado para el bloque etiquetado del pipeline de Health en /rtp info.
infoHealthPipelineHeader: "&7--- Estado: pipeline ---"
# Lectura de TPS para las ventanas 1m / 5m / 15m. Marcadores: [tps1m] [tps5m] [tps15m].
infoTps: "&7TPS (1m/5m/15m): #7E9CC8[tps1m] / [tps5m] / [tps15m]"
# MSPT del servidor en vivo y uso del presupuesto de tick. Marcadores: [mspt] [tickBudgetUtilisation].
infoMSPTLive: "&7MSPT del servidor: #7E9CC8[mspt] ms (&7presupuesto de tick: #7E9CC8[tickBudgetUtilisation]&7)"
# Configured player soft-cap vs current online count. Placeholders: [softCap] [playerCount].
infoSoftCap: "&7Jugadores: #7E9CC8[playerCount] / [softCap]"
# Latencia de ida y vuelta más reciente de la base de datos en ms. Marcador: [databaseLatencyMs].
infoDatabaseLatencyMs: "&7Latencia de base de datos: #7E9CC8[databaseLatencyMs] ms"
# Generation outcome metrics (ADR-052), sourced from the process-global RtpOutcomeStats.
# Success/failure rate over all recorded generation attempts. Placeholders:
# [genSuccessRate] [genFailureRate] [genOutcomeTotal].
infoFailureRate: "&7Éxito de generación: #7E9CC8[genSuccessRate]&7 (fallos #7E9CC8[genFailureRate]&7, n=#7E9CC8[genOutcomeTotal]&7)"
# Single most common rejection cause and its share of all failures. Placeholders:
# [genTopRejectionCause] [genTopRejectionShare].
infoTopRejectionCause: "&7Causa principal de rechazo: #7E9CC8[genTopRejectionCause]&7 (#7E9CC8[genTopRejectionShare]&7)"
# Per-cause rejection breakdown (the analogue of a competitor's /rtp unsafe-stats).
# Placeholder: [genFailureBreakdown] - comma-separated cause=N list, busiest first.
infoFailureBreakdown: "&7Rechazos por causa: #7E9CC8[genFailureBreakdown]"
# Health colour-band thresholds. Doubles consumed by ColourBands in rtp-core
# to wrap coloured-variant placeholders (e.g. [tps1mColoured]) with &a/&7/&c.
infoThresholdTpsGreen: 19.5
infoThresholdTpsYellow: 18.0
infoThresholdMsptGreen: 30.0
infoThresholdMsptYellow: 45.0
infoThresholdCacheFillGreen: 0.5
infoThresholdCacheFillYellow: 0.25
infoThresholdNetworkAgeYellow: 5.0
# Header line introducing the per-Folia-region table (Folia runtime only).
infoFoliaRegionsHeader: "&7--- Regiones de Folia ---"
# Per-row template for a single Folia region. Placeholders: [regionId] [tps1m]
# [mspt] [playerCount] [queueDepth] [tickBudgetUtilisation].
infoFoliaRegion: "#7E9CC8[regionId]&7: tps=#7E9CC8[tps1m]&7 mspt=#7E9CC8[mspt]&7 players=#7E9CC8[playerCount]&7 queue=#7E9CC8[queueDepth]&7 budget=#7E9CC8[tickBudgetUtilisation]"
cabeceraAvisoInfo: "&7--- Aviso de diagnóstico ---"
avisoInfo: "&7Nota de diagnóstico: Si el número total de chunks huérfanos del servidor supera el total histórico de cargas de este plugin ([loads]), este plugin no es la única causa de la fuga de memoria."
cabeceraMundoInfo: "#008080Mundos:"
cabeceraMundoConsolaInfo: "&7--- Mundos ---"
infoMundo: "#21ADA8[world]"
cabeceraRegionInfo: "#63C5DARegiones:"
cabeceraRegionConsolaInfo: "&7--- Regiones ---"
infoRegion: "#52B2BF[region]"
# Biome-occupancy leaderboard shown by /rtp info biomes - which biomes online
# players spend their time in, sampled over the server's uptime.
# Header placeholders: [biomeTotalSamples] [biomeDistinctCount].
infoBiomeActivityHeader: "&8--- &3Ocupación de biomas &8(&3[biomeTotalSamples]&8 muestras, &3[biomeDistinctCount]&8 biomas) ---"
# Per-biome row. Placeholders: [biomeRank] [biomeName] [biomeSamples] [biomePercent] [biomeBar].
infoBiomeActivityRow: "&8 [biomeRank]. &3[biomeName] &8[biomeBar] &7[biomePercent]% &8([biomeSamples])"
# Shown when no occupancy has been sampled yet.
infoBiomeActivityEmpty: "&8--- &7aún no se ha muestreado la ocupación de biomas &8---"

# sub-info listings
