# --- Mensajes de RTP (Español) ---
# Traducción de los mensajes visibles para el jugador y la consola.
# IMPORTANTE:
# - Los nombres de clave de este archivo se corresponden con la columna
# derecha de lang/es/messages.lang.yml (la traducción de los nombres de
# clave internos del plugin). Si una clave no aparece en messages.lang.yml,
# se utiliza la clave en inglés del archivo base (lang/messages.lang.yml).
# - Conservar los marcadores entre corchetes tal cual: [P0], [delay], [attempts],
# [world], [region], [remainingCooldown], [scan_chunks], etc.
# - Conservar los códigos de color &a &e &c y hexadecimales (#2636ef).
# ###############################################################################
# Sección 1: Configuración general
# ###############################################################################
marcadores:
  # P0
  - "[RTP]"

# ###############################################################################
# Sección 2: Teletransporte
# ###############################################################################
yaTeletransportando: "&e[P0] ¡ya te estás teletransportando!"

# si el plugin se está recargando actualmente
teletransporteDenegadoRecargando: "&e[P0] los teletransportes están desactivados temporalmente mientras el plugin se recarga. Inténtalo de nuevo en unos instantes."
mensajeRetraso: "&e[P0] Teletransportando en [delay]. No te muevas."
cargaDeChunk: "&e[P0] Cargando chunks, por favor espera..."
mensajeTeletransporte: "&e[P0] Teletransportado en [attempts] intentos, en [processingTime]"

# if teleport is cancelled
cancelarTeletransporte: "&e[P0] ¡Teletransporte cancelado!"

# si no hay lugares seguros tras alcanzar el máximo de intentos
# marcador: [attempts] - el número máximo de intentos
inseguro: "&e[P0] no se encontró una ubicación segura en [attempts] intentos"

# cuando el jugador está en tiempo de reutilización
# marcador: [remainingCooldown] - el tiempo restante
mensajeEnfriamiento: "&e[P0] No puedes teletransportarte otra vez hasta dentro de [remainingCooldown]"

# si la región no tiene ubicaciones en cola y el jugador no tiene el permiso rtp.unqueued
sinUbicacionesEnCola: "#f5eb73[P0] no hay ubicaciones listas en este momento"

# cuando la fila de espera avanza
# marcador: [spot] - la posición actual en la fila
actualizarCola: "#2636ef[P0] tu puesto en la cola: [spot]"

# si el jugador no tiene suficiente dinero para teletransportarse en la región
# marcador: [money] - cuánto dinero requiere el comando
dineroInsuficiente: "&e[P0] necesitas al menos $[money] para eso."

# ###############################################################################
# Sección 3: Formato de tiempo
# ###############################################################################
dias: "d"
horas: "h"
minutos: "m"
segundos: "s"
milisegundos: "ms"

# ###############################################################################
# Sección 4: Sistema y administración
# ###############################################################################
archivoAntiguo: "&b[P0] se detectó un [filename] antiguo. Actualizando"

# se detectó un mundo de bukkit que no está en el archivo de configuración
# marcador: [world] - el mundo detectado
mundoNuevo: "&b[P0] se detectó un nuevo mundo '[world]'"

# el mundo no existe en bukkit
# marcador: [world] - el nombre del mundo
mundoInvalido: "&e[P0] no se pudo encontrar el mundo '[world]'"

# texto de recarga / actualización del plugin
# marcador: [filename] - nombre del archivo
recargando: "&b[P0] cargando [filename]..."
recargado: "&b[P0] [filename] cargado correctamente."
actualizando: "&a[P0] actualizando [filename]..."
actualizado: "&a[P0] [filename] actualizado correctamente."

# el plugin no tiene el comando que el usuario solicitó
# marcador: [arg] - el argumento intentado
argumentoInvalido: "&c[P0] argumento de comando no válido [arg]"

# cuando la consola intenta ejecutar un comando solo para jugadores
comandoConsolaNoPermitido: "&c[P0] Debes ser un jugador en el juego para ejecutar este comando."

# busy y invalidCommand no se traducen en messages.lang.yml -> se usan las claves en inglés (fallback al baseline).
busy: "&c[P0] ocupado"

# plugin doesn't have the subcommand or parameter the user requested
# placeholder: [arg] - the argument attempted
invalidCommand: "&c[P0] comando no válido - [arg]"

# el usuario no tiene permiso para el comando solicitado
sinPermisos: "&eLo sentimos, pero no tienes permiso para ejecutar este comando. Contacta con los administradores del servidor si crees que esto es un error."

# ###############################################################################
# Sección 5: Registros administrativos
# ###############################################################################
ubicacionGuardada: "&e[P0] Se guardaron correctamente [amount] ubicaciones para [region]"
ubicacionCargada: "&e[P0] Se cargaron correctamente [amount] ubicaciones para [region]"

# ###############################################################################
# Sección 6: Comando Scan
# ###############################################################################
iniciarEscaneo: "&a[P0] tarea de escaneo iniciada para las regiones: [scan_regions]"
reiniciarEscaneo: "&e[P0] cola de escaneo reiniciada para las regiones: [scan_regions]"
cancelarEscaneo: "&e[P0] tarea de escaneo cancelada para las regiones: [scan_regions]"
pausarEscaneo: "#A020F0[P0] tarea de escaneo pausada para las regiones: [scan_regions]"
reanudarEscaneo: "#10A5F5[P0] tarea de escaneo reanudada para las regiones: [scan_regions]"
escaneoActivo: "&c[P0] ya hay una tarea de escaneo en curso para las regiones: [scan_regions]"
escaneoNoActivo: "&c[P0] no hay ninguna tarea de escaneo en curso para las regiones: [scan_regions]"
# placeholder: [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
estadoEscaneo: "&a[P0] completados [scan_chunks] / [scan_totalChunks] chunks para las regiones: [scan_regions]. [scan_cps] cps. Porcentaje de tierra: [scan_landPercentage]%. Tiempo restante: [scan_eta]"

# ###############################################################################
# Sección 7: Comando Info
# ###############################################################################
tituloInfo: "&a======Información de RTP======"
infoTickets: "&7Tickets de chunks activos globales: &f[tickets]"
infoTeletransportes: "&7Máquinas de estado de teletransporte activas: &f[teleports]"
infoMSPT: "&7MSPT actual del plugin: &f[mspt]"
infoCargasTotales: "&7Chunks cargados de por vida: &f[loads]"
infoCargasPorOrigen: "&7Cargas por origen: &f[loadsByOrigin]"
infoTasaFuga: "&7Tasa actual de fuga de chunks: &f[leakRate]"
# --- Metrics SPI health block (METRICS_PLAN.md > /rtp info Surface) ---
infoQueueDepth: "&7Jugadores esperando en colas de región: &f[queueDepth]"
infoPendingTeleports: "&7Tuberías de teletransporte pendientes: &f[pendingTeleports]"
infoAvgPipelineMs: "&7Latencia media de la tubería: &f[avgPipelineMs] ms"
infoHeap: "&7Heap de la JVM: &f[heapUsedMb] / [heapMaxMb] MiB"
# Línea de encabezado para el bloque etiquetado del pipeline de Health en /rtp info.
infoHealthPipelineHeader: "&7--- Health: pipeline ---"
# Lectura de TPS para las ventanas 1m / 5m / 15m. Marcadores: [tps1m] [tps5m] [tps15m].
infoTps: "&7TPS (1m/5m/15m): &f[tps1m] / [tps5m] / [tps15m]"
# MSPT del servidor en vivo y uso del presupuesto de tick. Marcadores: [mspt] [tickBudgetUtilisation].
infoMSPTLive: "&7Server MSPT: &f[mspt] ms (&7tick budget: &f[tickBudgetUtilisation]&7)"
# Configured player soft-cap vs current online count. Placeholders: [softCap] [playerCount].
infoSoftCap: "&7Players: &f[playerCount] / [softCap]"
# Latencia de ida y vuelta más reciente de la base de datos en ms. Marcador: [databaseLatencyMs].
infoDatabaseLatencyMs: "&7Database Latency: &f[databaseLatencyMs] ms"
# Health colour-band thresholds. Doubles consumed by ColourBands in rtp-core
# to wrap coloured-variant placeholders (e.g. [tps1mColoured]) with &a/&e/&c.
infoThresholdTpsGreen: 19.5
infoThresholdTpsYellow: 18.0
infoThresholdMsptGreen: 30.0
infoThresholdMsptYellow: 45.0
infoThresholdCacheFillGreen: 0.5
infoThresholdCacheFillYellow: 0.25
infoThresholdNetworkAgeYellow: 5.0
# Header line introducing the per-Folia-region table (Folia runtime only).
infoFoliaRegionsHeader: "&7--- Folia regions ---"
# Per-row template for a single Folia region. Placeholders: [regionId] [tps1m]
# [mspt] [playerCount] [queueDepth] [tickBudgetUtilisation].
infoFoliaRegion: "  &f[regionId]&7: tps=&f[tps1m]&7 mspt=&f[mspt]&7 players=&f[playerCount]&7 queue=&f[queueDepth]&7 budget=&f[tickBudgetUtilisation]"
cabeceraAvisoInfo: "&7--- Aviso de diagnóstico ---"
avisoInfo: "&7Nota de diagnóstico: Si el número total de chunks huérfanos del servidor supera el total histórico de cargas de este plugin ([loads]), este plugin no es la única causa de la fuga de memoria."
cabeceraMundoInfo: "#008080Mundos:"
cabeceraMundoConsolaInfo: "&7--- Mundos ---"
infoMundo: "  #21ADA8[world]"
cabeceraRegionInfo: "#63C5DARegiones:"
cabeceraRegionConsolaInfo: "&7--- Regiones ---"
infoRegion: "  #52B2BF[region]"

# sub-info listings
# placeholders: [world], [region], [requirePermission], [override], [shape], [worldBorderOverride], [cacheCap], [cached], [keptCache], [unkeptCache], [backlogCache], [backlogCacheCap]
datosMundo:
  - "#21ADA8[world]:"
  - "#99EEBB  - región: [region]"
  - "#99EEBB  - requierePermiso: [requirePermission]"
  - "#99EEBB  - sobrescribir: [override]"

datosRegion:
  - "#52B2BF[region]:"
  - "#58CCED  - mundo: [world]"
  - "#58CCED  - forma: [shape]"
  - "#58CCED  - requierePermiso: [requirePermission]"
  - "#58CCED  - sobrescrituraDeBorde: [worldBorderOverride]"
  - "#58CCED  - capacidadCache: [cacheCap]"
  - "#58CCED  - cacheRetenida (L1): [keptCache]"
  - "#58CCED  - cacheLiberada (L2): [unkeptCache]"
  - "#58CCED  - cacheAcumulada (L3): [backlogCache] / [backlogCacheCap]"
  - "#58CCED  - enCache: [cached]"

# ###############################################################################
# Sección 8: Descripciones de comandos
# ###############################################################################
rtp: "&b/rtp - teletranspórtate a una ubicación aleatoria"
rtp_descripcion: "teletranspórtate a una ubicación aleatoria"
ayuda: "&b/rtp help - mostrar esta ayuda"
ayuda_descripcion: "describir comandos"
recargar: "&b/rtp reload - recargar los archivos de configuración"
recargar_descripcion: "recargar archivos de configuración"
escaneo: "&b/rtp scan - probar todas las ubicaciones posibles de la región para mejorar los tiempos de carga"
escaneo_descripcion: "borrar datos guardados y probar todas las ubicaciones posibles de la región"
config_descripcion: "actualizar archivos de configuración en tiempo de ejecución"
info_descripcion: "verificar el estado actual del plugin"
prueba_descripcion: "probar funciones de RTP"

# ###############################################################################
# Sección 8b: Marco de menús generalizado
# ###############################################################################
# Estas claves no se traducen en lang/es/messages.lang.yml, por lo que se usan
# los nombres canónicos en inglés (fallback al baseline).
menuInvalid: "&c[P0] ese enlace de menú no es válido."
# Sent when a menu token has expired or was already consumed.
menuExpired: "&c[P0] ese enlace de menú ha expirado. Vuelve a abrir el menú."
# Enviado cuando un canje de menú no puede resolver el UUID del jugador que llama.
menuUnknownPlayer: "&c[P0] los enlaces de menú solo pueden usarlos jugadores en el juego."
# Plantilla de información emergente cuando no hay comentario YAML disponible para un parámetro. Marcador: [type] - el tipo declarado del parámetro.
menuHoverFallbackType: "tipo: [type]"
# Plantilla de información emergente cuando un parámetro expone un conjunto pequeño de valores. Marcador: [values] - valores aceptados separados por coma.
menuHoverFallbackBounds: "aceptados: [values]"
# Etiqueta de la fila de navegación "volver un nivel" en cada página de menú no raíz.
menuBack: "&7« atrás"
# Plantilla de la fila "ejecutar el comando ensamblado" en cada página de menú ejecutable no raíz. Marcador: [command] - la invocación /rtp ... ensamblada.
menuExecute: "&a▶ ejecutar [command]"
# Encabezado de una sub-página selector de valor de parámetro (Etapa A.2).
# Marcadores: [param] - nombre del parámetro; [command] - la invocación /rtp ... ensamblada.
menuPickValue: "&eelige un valor para [param] (ejecutará: /rtp [command] [param]:<valor>)"
# Etiqueta de la fila "escribir valor personalizado" como alternativa en el selector.
# Al hacer clic prellena el chat con el comando ensamblado hasta '<param>:'.
menuTypeValue: "&7✎ escribir un valor personalizado..."
# Non-clickable header row at the top of every non-root menu page (Stage A.4).
# Surfaces the currently-constructed /rtp invocation including any staged
# parameter assignments (name:value). Placeholder: [command] - assembled args.
menuConstructed: "&7construyendo: &f/rtp [command]"
# Título no interactivo en la parte superior del menú raíz /rtp menu (Etapa A.5).
menuRootTitle: "&6&l⚡ menú de RTP"
# Subtítulo/orientación no interactivo bajo menuRootTitle (Etapa A.5).
menuRootHint: "&7haz clic en una opción para comenzar"
# Filas de navegación añadidas a páginas de menú paginadas (Etapa A.6).
# Marcador: [page] - número de página destino (base 1).
menuPagePrev: "&7« página anterior ([page])"
menuPageNext: "&7página siguiente ([page]) »"
# Section divider on the front page above teleport rows (player view).
menuFrontPageSectionTeleport: "&8--- &7teleport &8---"
# Section divider on the front page above admin rows (admin view).
menuFrontPageSectionAdmin: "&8--- &7admin &8---"
# Front-page rows. No placeholders.
menuFrontPageRowTeleport: "&a▶ /rtp &7- teleport to a random location"
menuFrontPageRowRegion: "&a▶ /rtp region:&7... &7- pick a region"
menuFrontPageRowBiome: "&a▶ /rtp biome:&7... &7- pick a biome"
menuFrontPageRowHelp: "&a▶ /rtp help &7- list commands"
menuFrontPageRowInfo: "&b▶ /rtp info &7- plugin diagnostics"
menuFrontPageRowConfig: "&b▶ /rtp config &7- edit config files"
menuFrontPageRowScan: "&b▶ /rtp scan &7- pre-fill region caches"
menuFrontPageRowDiagnostics: "&c▶ /rtp test full &7- run full diagnostics"
menuFrontPageRowReload: "&c▶ /rtp reload &7- reload config files"
# Texto al pasar el cursor sobre la fila de diagnóstico que advierte del coste. Sin marcadores.
menuFrontPageHoverDiagnostics: "&7runs full diagnostic suite; may be expensive"
# Texto al pasar el cursor sobre la fila de recarga que advierte sobre efectos secundarios. Sin marcadores.
menuFrontPageHoverReload: "&7reloads all config files; in-flight teleports may be affected"

