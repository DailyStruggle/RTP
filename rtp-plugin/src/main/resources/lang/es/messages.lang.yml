# --- Mapeo de Idioma: messages.yml ---
# Asigna las claves de mensaje internas (izquierda) a los nombres visibles
# para el usuario en messages.yml (derecha). Modifica únicamente el lado
# derecho para renombrar o traducir una clave de mensaje; el lado izquierdo
# es una constante de código y no debe cambiarse.
# Nota: este archivo solo asigna NOMBRES DE CLAVE. El texto traducido del
# mensaje en sí vive en messages.yml. Si este archivo falta, el plugin lo
# regenera con pares idénticos izquierda/derecha (los valores por defecto
# en inglés).

