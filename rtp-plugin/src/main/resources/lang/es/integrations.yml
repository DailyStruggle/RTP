rerollLands: false

# Vuelve a elegir la ubicación si cae dentro de una región de RedProtect.
# @type: boolean
# @default: false
rerollRedProtect: false

# Vuelve a elegir la ubicación si cae dentro de un claim de Towny Advanced.
# @type: boolean
