rtp: "&b/rtp - teletranspórtate a una ubicación aleatoria"
rtp_descripcion: "teletranspórtate a una ubicación aleatoria"
ayuda: "&b/rtp help - mostrar esta ayuda"
ayuda_descripcion: "describir comandos"
recargar: "&b/rtp reload - recargar los archivos de configuración"
recargar_descripcion: "recargar archivos de configuración"
escaneo: "&b/rtp scan - probar todas las ubicaciones posibles de la región para mejorar los tiempos de carga"
escaneo_descripcion: "borrar datos guardados y probar todas las ubicaciones posibles de la región"
config_descripcion: "actualizar archivos de configuración en tiempo de ejecución"
info_descripcion: "verificar el estado actual del plugin"
prueba_descripcion: "probar funciones de RTP"

