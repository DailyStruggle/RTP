escaneoNoActivo: "&c[P0] no hay ninguna tarea de escaneo en curso para las regiones: [scan_regions]"

# marcador: [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
estadoEscaneo: "[P0] &8» &7[scan_regions] &8| &7[scan_chunks]&8/&7[scan_totalChunks] &8| #7E9CC8[scan_cps]&7 cps &8| #7E9CC8[scan_landPercentage]%&7 tierra &8| &7ETA #7E9CC8[scan_eta]"

# Título de la boss-bar mostrado a los jugadores con el permiso rtp.scan mientras se ejecuta un escaneo del mundo.
# Establecer como cadena vacía para desactivar la boss-bar.
# El color de la barra se toma del primer código de color heredado en este valor:
#   &c/&4 = rojo, &e/&6 = amarillo, &a/&2 = verde, &9/&1/&3/&b = azul,
#   &5 = morado, &d = rosa, &f/&7/&8/&0 = blanco. Por defecto es verde si no hay ninguno.
# marcador: [scan_regions], [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
scanBossBar: "Escaneando [scan_regions]: [scan_chunks]/[scan_totalChunks] ([scan_landPercentage]% tierra) ETA [scan_eta]"

