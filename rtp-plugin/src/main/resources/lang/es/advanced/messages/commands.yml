configPendingHeader: "&6&l-- pending changes --"

# Etiqueta por fila para una entrada key=value preparada (pendiente) en una página de archivo de configuración.
# Hacer clic en la fila la elimina del carrito. Marcadores: [key], [value].
# Evitar amarillo/blanco en el pergamino del libro.
configPendingRowFormat: "&9[key]&8 = &0[value]"

# Texto emergente mostrado cuando el visor pasa el cursor sobre una fila pendiente (preparada) en una
# página de archivo de configuración. Sin marcadores.
configPendingRowHover: "haz clic para descartar"

# Etiqueta interactiva para la fila "aplicar cambios preparados" en una página de archivo de configuración.
# Ejecuta el comando ensamblado /rtp config <file> k1=v1 ... y vacía el carrito.
configApplyRow: "&2&l[apply]"

# Etiqueta interactiva para la fila "descartar cambios preparados" en una página de archivo de configuración.
# Vacía el carrito sin aplicar los cambios.
configDiscardRow: "&c&l[discard]"

# --- Renderizado de mapas / gráficos ---
# Enviado cuando se hace clic en una fila de mapa pero el renderizado de mapas no está disponible en este
# servidor (p. ej. la compilación Lite, o ningún proveedor de mapas instalado).
mapBindingMissing: "&c[P0] el renderizado de mapas no está disponible en este servidor."

# Enviado cuando se solicita un gráfico pero no hay ningún renderizador registrado para ese
# tipo de gráfico.
mapResolverMissing: "&c[P0] no hay ningún resolutor de gráficos registrado para esta solicitud."

# Enviado cuando un resolutor se ejecuta pero la fuente de datos subyacente no está disponible
# para el objetivo solicitado (región desconocida, sin datos aún, mundo descargado).
# Marcador: [region] - el nombre de la región solicitada (puede estar vacío).
mapUnavailable: "&e[P1] los datos del gráfico no están disponibles ahora mismo."

# Enviado cuando el servicio de mapas no puede asignar un mapa ahora mismo (p. ej. se ha
# alcanzado un límite por espectador).
mapBusy: "&e[P1] el servicio de mapas está ocupado; inténtalo de nuevo en breve."

# Etiqueta para la fila de menú interactiva "/rtp info" que genera un mapa térmico de
# las ubicaciones no válidas conocidas de la región actual. Oculta cuando el renderizado de mapas
# no está disponible en este servidor.
menuInfoBadPointsLabel: "#9D7CD8&l# mapa de puntos inseguros"

# --- Submenú MultiConfig ---
# Alternativa de encabezado utilizada cuando no hay una clave de encabezado registrada por tipo.
# Marcador: [parserKind] - el nombre en bruto del tipo de multiconfiguración.
multiconfigHeaderDefault: "#5FB3B3&l[parserKind]"

# Etiqueta de la fila de encabezado para la página del selector de multiconfiguración de regiones. Sin marcadores.
multiconfigHeaderRegions: "#5FB3B3&l regiones"

# Etiqueta de la fila de encabezado para la página del selector de multiconfiguración de mundos. Sin marcadores.
multiconfigHeaderWorlds: "#5FB3B3&l mundos"

# Etiqueta de la fila de alternancia cuando el modo de eliminación está DESACTIVADO. Sin marcadores.
multiconfigToggleRemoveModeOff: "&8[ ] modo eliminar"

# Etiqueta de la fila de alternancia cuando el modo de eliminación está ACTIVADO. Los clics en las filas de entrada eliminan.
multiconfigToggleRemoveModeOn: "&c[x] modo eliminar (haz clic en una entrada para borrarla)"

# Etiqueta de fila del selector para la entrada "+ Añadir nuevo...". Sin marcadores.
multiconfigRowAdd: "&2+ añadir nuevo..."

# Texto emergente para la fila Añadir. Marcador: [name] - nombre predeterminado prerrellenado.
multiconfigRowAddHover: "&7escribe un nombre en el aviso del yunque; prerrellenado: &f[name]"

# Texto emergente para una fila de entrada en modo normal. Marcador: [name].
multiconfigRowEditHover: "&7editar &f[name]"

# Texto emergente para una fila de entrada en modo de eliminación. Marcador: [name].
multiconfigRowRemoveHover: "&cborrar &f[name]"

# Fila de título de la página de confirmación de eliminación. Marcador: [name].
multiconfigConfirmTitle: "&c&l¿borrar [name]?"

# Etiqueta de fila Sí en la página de confirmación de eliminación. Sin marcadores.
multiconfigConfirmYes: "&c&l[confirm delete]"

# Etiqueta de fila Cancelar en la página de confirmación de eliminación. Sin marcadores.
multiconfigConfirmNo: "&2&l[cancel]"

# Texto emergente en una fila de región predeterminada bloqueada (atenuada). Sin marcadores.
multiconfigLockRegionDefault: "&7la región predeterminada no se puede eliminar"

# Texto emergente en una fila de mundo bloqueada (atenuada). Marcador: [name].
multiconfigLockWorldLoaded: "&7el mundo '[name]' está cargado en el servidor; descárgalo antes de eliminar su configuración"

# Mensaje de resultado tras una acción de AÑADIR exitosa. Marcador: [name].
multiconfigResultAdded: "&aañadido '[name]'."

# Mensaje de resultado tras una acción de ELIMINAR exitosa. Marcador: [name].
multiconfigResultRemoved: "&aeliminado '[name]'."

# Mensaje de resultado cuando AÑADIR falló. Marcadores: [name], [reason].
multiconfigResultAddFailed: "&cno se pudo añadir '[name]': [reason]"

# Mensaje de resultado cuando ELIMINAR falló. Marcadores: [name], [reason].
multiconfigResultRemoveFailed: "&cno se pudo eliminar '[name]': [reason]"

# Mensaje de resultado cuando el desinfectador rechaza el nombre de entrada propuesto.
# Marcador: [name].
multiconfigResultNameInvalid: "&cel nombre '[name]' no está permitido; usa letras, dígitos, '_', '-', '.'"

# Mensaje de resultado cuando una acción de AÑADIR entra en conflicto con un nombre de entrada existente.
# Marcador: [name].
multiconfigResultNameTaken: "&cya existe una entrada llamada '[name]'."

