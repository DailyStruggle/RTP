# --- Mensajes de RTP (este idioma) ---
# Textos de mensajes para jugadores y operadores en este idioma, agrupados por tema.
# Copia generada automaticamente de los mensajes en ingles; no editar a mano (se sobrescribe).

# --- Mensajes de modo de red entre servidores ---
# Se envían únicamente cuando `network.enabled: true` y el `/rtp` del jugador se enruta
# a través de la cola de espera entre servidores (ver network.yml `routing.mode`).
# Todas las claves son opcionales desde la perspectiva del jugador: el ciclo base
# `mensajeRetraso` / `mensajeTeletransporte` sigue controlando el flujo visible.
# Enviado cuando la solicitud ha sido aceptada en la cola de espera entre servidores
# y está esperando una asignación de backend. Marcador: [position] - posición
# indexada en 0 desde `pollStatus`; puede estar vacía si el transporte no devuelve
# ninguna posición.
networkQueued: "&7[P0] en cola para un destino entre servidores (posición [position])..."

# Enviado cuando un jugador ejecuta /rtp mientras ya está esperando en la cola entre servidores.
# Marcador: [position] - posición en la fila; puede estar vacío.
alreadyQueued: "&cYa estás esperando en la cola entre servidores (posición [position]). Espera por favor."

# Enviado cuando una entrada en la cola entre servidores esperó demasiado tiempo y se descartó.
# Sin marcadores.
networkTimedOut: "&c[P0] el teletransporte entre servidores expiró esperando un servidor."

# Enviado cuando la cola entre servidores está llena y la solicitud es rechazada.
# Sin marcadores.
waitlistFull: "&c[P0] la cola entre servidores está llena; inténtalo de nuevo en breve."

# Enviado cuando la cola ha transferido la solicitud al enrutador proxy y
# se está seleccionando un backend.
networkRouting: "&7[P0] enrutando a un servidor..."

# Enviado cuando un backend ha reservado una coordenada para este jugador y el
# proxy está a punto de iniciar el salto entre servidores. Marcador: [server]
# - el serverId del backend de destino.
networkReserved: "&a[P0] coordenada reservada en [server]. Transfiriendo..."

# Enviado cuando el proxy está en medio del salto. Marcador: [server] - destino.
networkTransferring: "&a[P0] transfiriendo a [server]..."

# Enviado cuando la ruta entre servidores se rindió y recurrió al servidor local.
# Marcador: [reason] - el motivo por el cual se recurrió al servidor local.
networkFallback: "&e[P0] entre servidores no disponible ([reason]); volviendo a local."

# Enviado cuando la solicitud entre servidores falló y no fue posible recurrir a una alternativa.
# Marcador: [reason] - el motivo del fallo.
networkFailed: "&c[P0] el teletransporte entre servidores falló: [reason]."

# Enviado cuando el jugador solicitó una región específica (`/rtp <region>`) pero
# ningún backend en la red la está atendiendo actualmente. Marcador:
# [region] - el nombre de la región solicitada.
networkRegionUnavailable: "&c[P0] ningún servidor está sirviendo la región '[region]' actualmente."

# Enviado cuando el nombre de la región solicitada coincide con dos o más backends y
# la directiva configurada por el operador no puede elegir uno (solo se activa
# con directivas más estrictas que el `warn` predeterminado). Marcador: [region].
networkRegionAmbiguous: "&c[P0] la región '[region]' es ambigua entre servidores; fija un servidor."

# NO MODIFICAR EL NÚMERO DE VERSIÓN
version: 1.0
