# RTP Network Mode (multi-server / multi-proxy) Disabled by default; flipping `network.enabled: true` opts this backend into the cross-server network.
network:
  # Si es false, este archivo se lee y valida, luego se ignora: no se abren hilos, tablas ni transporte.
  # @type: boolean
  # @default: false
  enabled: false
  # Identidad estable del backend, obligatoria cuando esta activado; dos backends con el mismo serverId sobrescriben su latido mutuamente.
  # @type: string
  # @default: ""
  serverId: ""
  # Variable de entorno con el secreto HMAC compartido; obligatoria cuando esta activado con transport.type redis.
  # @type: string
  # @default: "RTP_NET_SECRET"
  secretEnv: "RTP_NET_SECRET"

# Backing store for cross-process state.
transport:
  # Almacen de respaldo del transporte.
  # @type: enum
  # @options: ["auto", "plugin-message", "in-memory", "sql", "redis"]
  # @default: "auto"
  type: "auto"
  pluginMessage:
    # Canal de mensajeria de plugins del proxy; deja el valor por defecto salvo que tu proxy use un nombre no estandar.
    # @type: string
    # @default: "bungeecord:main"
    channel: "bungeecord:main"
  redis:
    # Nombre de host o IP de la instancia Redis compartida por cada backend y proxy (obligatorio cuando type es redis).
    # @type: string
    # @default: "localhost"
    host: "localhost"
    # Puerto de Redis; cambialo para despliegues no estandar.
    # @type: integer
    # @default: 6379
    port: 6379
    # Contrasena de Redis; dejala vacia para Redis sin autenticacion, definela cuando se configure ACL/requirepass.
    # @type: string
    # @default: ""
    password: ""

# Backend heartbeat / peer-staleness cadence (shared by every transport tier).
heartbeat:
  # Con que frecuencia este backend publica su fila de estado (ms).
  # @type: integer
  # @default: 1000
  intervalMs: 1000
  # Cuanto tiempo se confia en el ultimo estado visto de un par antes de tratarlo como desconocido (ms); mantenlo por encima de intervalMs.
  # @type: integer
  # @default: 5000
  staleAfterMs: 5000

# Backend-side router.
routing:
  # Modo del enrutador: local (solo canalizacion local), auto (local primero, si no la cola de espera) o always (siempre inscribir).
  # @type: enum
  # @options: ["local", "auto", "always"]
  # @default: "local"
  mode: "local"
  # Modo lobby: convierte este backend en un nodo de despacho puro que enruta automaticamente /rtp simple a la region par con mas reservas.
  # @type: boolean
  # @default: false
  lobbyMode: false

# Cross-server wait queue.
queue:
  # Maximo de inscripciones almacenadas localmente antes de que la contrapresion rechace nuevas llamadas /rtp (QUEUE_FULL).
  # @type: integer
  # @default: 50
  maxDepth: 50
  # Cadencia de vaciado de escrituras pendientes del backend (ms); menor = menos latencia, mayor = menos viajes al transporte.
  # @type: integer
  # @default: 250
  flushIntervalMs: 250
  # Cadencia de sondeo de la cache de estado del backend (ms); con que frecuencia se actualiza el progreso por jugador.
  # @type: integer
  # @default: 1000
  pollIntervalMs: 1000
  # Caducidad pasiva opcional por TTL de los HASH de sobre (ms); 0 lo desactiva.
  # @type: integer
  # @default: 0
  entryTtlMs: 0
  # Limite de tasa de inscripciones /rtp entre servidores (cubo de tokens): solicitudes sostenidas por segundo.
  # @type: number
  # @default: 5
  crossServerRequestsPerSecond: 5
  # Limite de tasa de inscripciones /rtp entre servidores: tamano de rafaga.
  # @type: number
  # @default: 10
  crossServerRequestsBurst: 10
  # Numero de trabajadores BLPOP del lado del proxy; aumentalo solo cuando un unico trabajador se sature.
  # @type: integer
  # @default: 1
  workerThreads: 1

# Reservation-token lifecycle (REQ-RTP-NET-011).
reservation:
  # Cadencia del recolector por TTL del lado del proxy (ms); barre tokens caducados y libera sus coordenadas.
  # @type: integer
  # @default: 30000
  reapIntervalMs: 30000
  # TTL por token (ms); una reserva reclamada pero no consumida mas antigua que esto se libera como abandonada.
  # @type: integer
  # @default: 60000
  ttlMs: 60000

# Region-collision policy.
regionCollision:
  # Politica de colisiones aplicada al iniciar.
  # @type: enum
  # @options: ["warn", "rename-local", "reject-startup"]
  # @default: "warn"
  policy: "warn"

# Optional per-destination policy overlay (matched by serverId); leave commented for the common case.
#servers:
#  example-backend:
#    # Permission required to target this destination (empty = none).
#    # @type: string
#    # @default: "
#    permission: "
#    # Label shown in menus / suggestions (default: serverId).
#    # @type: string
#    # @default: "
#    display-name: "Example"
#    # Hide from tab-completion when it has no servable region.
#    # @type: boolean
#    # @default: false
#    hide-when-unavailable: false
#    # Allow targeting it even when it reports no servable region.
#    # @type: boolean
#    # @default: true
#    allow-when-unavailable: true
# Load balancer scoring table.
loadBalancer:
  # Peso del termino integrado de escasez de regiones; 0 porque el termino `region` explicito de abajo posee esa senal.
  # @type: number
  # @default: 0
  regionScarcityWeight: 0
  # Scoring terms, one per metric.
  terms:
    # Tick pressure; sigmoid knee at 0.6.
    mspt:
      # Entrada de metrica.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "mspt"
      input: "mspt"
      # Peso del termino.
      # @type: number
      # @default: 1.0
      weight: 1.0
      curve:
        # Tipo de curva.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "sigmoid"
        type: "sigmoid"
        # Pendiente.
        # @type: number
        # @range: [0.1, 20]
        # @default: 8.0
        k: 8.0
        # Punto medio.
        # @type: number
        # @range: [0, 1]
        # @default: 0.6
        x0: 0.6
    # Queue depth; small queues silent, large ones explode.
    queue:
      # Entrada de metrica.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "queueDepth"
      input: "queueDepth"
      # Peso del termino.
      # @type: number
      # @default: 1.0
      weight: 1.0
      curve:
        # Tipo de curva.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "exponential"
        type: "exponential"
        # Pendiente.
        # @type: number
        # @range: [0.1, 20]
        # @default: 3.0
        k: 3.0
    # Heap gate; fires at >= 85% used.
    heap:
      # Entrada de metrica.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "heapUsed"
      input: "heapUsed"
      # Peso del termino.
      # @type: number
      # @default: 5.0
      weight: 5.0
      curve:
        # Tipo de curva.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "step"
        type: "step"
        # Umbral del escalon.
        # @type: number
        # @range: [0, 1]
        # @default: 0.85
        threshold: 0.85
    # Region gate; fires when the kept pool is >= 95% full.
    region:
      # Entrada de metrica.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "keptRegion"
      input: "keptRegion"
      # Peso del termino.
      # @type: number
      # @default: 5.0
      weight: 5.0
      curve:
        # Tipo de curva.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "step"
        type: "step"
        # Umbral del escalon.
        # @type: number
        # @range: [0, 1]
        # @default: 0.95
        threshold: 0.95
    # Gentle tie-breaker on kept count.
    kept:
      # Entrada de metrica.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "keptCount"
      input: "keptCount"
      # Peso del termino.
      # @type: number
      # @default: 0.25
      weight: 0.25
      curve:
        # Tipo de curva.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "logarithmic"
        type: "logarithmic"
        # Pendiente.
        # @type: number
        # @range: [0.1, 20]
        # @default: 9.0
        k: 9.0

version: 1.1
