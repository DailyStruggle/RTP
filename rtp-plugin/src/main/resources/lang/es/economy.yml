# --- Configuración económica de RTP ---
# Configura los costes del teletransporte aleatorio usando la economía del servidor.
# Política de reembolso
# Indica si se reembolsa el precio y se reinicia el cooldown al cancelarse el teletransporte.
# @type: boolean
# @default: true
reembolsoAlCancelar: true

# Costes del teletransporte
# Coste base para un comando /rtp estándar.
# @type: number
# @range: [0.0, null]
# @default: 50.0
precio: 50.0

# Coste para teletransportar a otro jugador (rtp <jugador>).
# @type: number
# @range: [0.0, null]
# @default: 200.0
precioOtro: 200.0

# Coste por usar parámetros personalizados (rtp region:<región>, etc.).
# @type: number
# @range: [0.0, null]
# @default: 1000000000.0
precioParametros: 1000000000.0

# Coste adicional por especificar un bioma (rtp biome:<bioma>).
# @type: number
# @range: [0.0, null]
# @default: 5000.0
precioBioma: 5000.0

# Saldo mínimo obligatorio.
# Los jugadores no pueden bajar de este saldo al usar RTP.
# @type: number
# @range: [0.0, null]
# @default: 0.0
saldoMinimo: 0.0

# NO MODIFIQUES EL NÚMERO DE VERSIÓN
version: 1.0
