# Retraso del teletransporte (segundos)
# Tiempo que el jugador debe esperar antes de que se realice el teletransporte.
# A veces le da tiempo al servidor para precargar los chunks de destino.
retrasoTeletransporte: 2

# Cancelación por movimiento (bloques)
# Si el jugador se mueve más de esta distancia durante el retraso, el
# teletransporte se cancela. Establece -1 para desactivarlo.
distanciaCancelar: 2

# Tiempo de espera entre teletransportes (segundos)
# Tiempo que el jugador debe esperar entre usos exitosos de RTP.
enfriamientoTeletransporte: 300

# Comandos posteriores al teletransporte
# Lista de comandos a ejecutar tras un teletransporte exitoso.
# El marcador [player] representa el nombre del jugador.
comandosConsola:
  - "say ¡[player] acaba de teletransportarse aleatoriamente!"

# Commands executed as the teleporting player on successful teleport.
# Use [player] for the target player's name. Empty string entries are ignored.
# @type: list<string>
comandosJugador:
  - ""

# --- Configuración de la base de datos ---
# Dónde almacenar ubicaciones en caché y datos de los jugadores.
baseDeDatos:
  # Tipos disponibles: yaml, sqlite, mysql, postgresql
  # - yaml/sqlite: archivos locales (sin configuración adicional)
  # - mysql/postgresql: base de datos remota (requiere credenciales abajo)
  type: "sqlite"
  # Credenciales de base de datos en red (ignoradas para tipos locales)
  host: "127.0.0.1"
  # Database port. Used by mysql/postgresql only.
  # @type: integer
  # @range: [1, 65535]
  port: 3306
  # Database / schema name. Used by mysql/postgresql only.
  # @type: string
  name: "rtp"
  # Database username. Used by mysql/postgresql only.
  # @type: string
  username: "root"
  # Database password. Used by mysql/postgresql only.
  # @type: string
  password: "password"

# --- Red y sincronización ---
# Redis se utiliza para sincronizar ubicaciones en caché entre varios servidores.
red:
  redis:
    # Enable Redis-backed network state binding.
    # @type: boolean
    # @default: false
    enabled: false
    # Redis host.
    # @type: string
    host: "127.0.0.1"
    # Redis port.
    # @type: integer
    # @range: [1, 65535]
    port: 6379
    # Redis password. Empty string disables auth.
    # @type: string
    password: ""

# Generalized menu framework (ADR-035 / ADR-044).
# `renderer` is an ordered preference list of renderer ids. On exception or
# missing adapter the framework walks the list and falls back to the next
# entry. If the list is exhausted the no-token open-page path falls back to
# the configurable `menuInvalid` message. Available ids: book. (The chat
# renderer ships in a follow-up and will be added to the default list at
# that point.)
menu:
  # Ordered preference list of renderer ids.
  # @type: list<enum>
  # @options: ["book", "chat"]
  renderer:
    - "book"

# NO MODIFIQUES EL NÚMERO DE VERSIÓN
version: 3.0
