# --- RTP 消息（简体中文） ---
# 玩家与控制台可见消息的中文翻译。
#
# 重要事项：
#   - 本文件的键名应与 lang/zh/messages.lang.yml 的右列（即插件内部键名的
#     中文翻译）保持一致。若 messages.lang.yml 中没有某个键，将回退到基础
#     英文文件 (lang/messages.lang.yml) 中的英文键名。
#   - 必须原样保留方括号占位符: [P0], [delay], [attempts], [world],
#     [region], [remainingCooldown], [scan_chunks] 等。
#   - 必须保留颜色代码 &a &e &c 以及十六进制颜色 (#2636ef)。
#
# REQ-RTP-F-013 / ADR-020。

################################################################################
# 第 1 节: 通用配置
################################################################################
占位符:
  - "[RTP]" #P0

################################################################################
# 第 2 节: 传送
################################################################################
已在传送: "&e[P0] 你已经在传送中！"
传送被拒_重载中: "&e[P0] 插件正在重载，传送暂时被禁用。请稍后再试。"
延迟消息: "&e[P0] 将在 [delay] 后传送，请勿移动。"
区块加载中: "&e[P0] 正在加载区块，请稍候……"
传送消息: "&e[P0] 在 [attempts] 次尝试后已传送，用时 [processingTime]"
取消传送: "&e[P0] 传送已取消！"
不安全: "&e[P0] 在 [attempts] 次尝试中未找到安全位置"
冷却消息: "&e[P0] 你必须等待 [remainingCooldown] 才能再次传送"
队列中无可用位置: "#f5eb73[P0] 当前没有可用的位置"
队列更新: "#2636ef[P0] 你在队列中的位置: [spot]"
余额不足: "&e[P0] 你至少需要 $[money] 才能执行此操作。"

################################################################################
# 第 3 节: 时间格式
################################################################################
天: "天"
小时: "时"
分: "分"
秒: "秒"
毫秒: "毫秒"

################################################################################
# 第 4 节: 系统与管理
################################################################################
旧文件: "&b[P0] 检测到旧的 [filename]。正在更新"
新世界: "&b[P0] 检测到新世界 '[world]'"
无效世界: "&e[P0] 找不到世界 '[world]'"
重载中: "&b[P0] 正在加载 [filename]……"
已重载: "&b[P0] [filename] 已成功加载。"
更新中: "&a[P0] 正在更新 [filename]……"
已更新: "&a[P0] [filename] 已成功更新。"
参数错误: "&c[P0] 命令参数无效 [arg]"
控制台命令不允许: "&c[P0] 你必须以游戏内玩家身份执行此命令。"
# busy 与 invalidCommand 未在 messages.lang.yml 中翻译 -> 使用英文键名（回退到基础英文）。
busy: "&c[P0] 忙"
invalidCommand: "&c[P0] 无效命令 - [arg]"
无权限: "&e抱歉，你没有权限执行此命令。如果你认为这是错误，请联系服务器管理员。"

################################################################################
# 第 5 节: 管理日志
################################################################################
位置已保存: "&e[P0] 已成功保存 [amount] 个 [region] 的位置"
位置已加载: "&e[P0] 已成功加载 [amount] 个 [region] 的位置"

################################################################################
# 第 6 节: 扫描命令
################################################################################
开始扫描: "&a[P0] 已为以下区域启动扫描任务: [scan_regions]"
重置扫描: "&e[P0] 已重置以下区域的扫描队列: [scan_regions]"
取消扫描: "&e[P0] 已取消以下区域的扫描任务: [scan_regions]"
暂停扫描: "#A020F0[P0] 已暂停以下区域的扫描任务: [scan_regions]"
恢复扫描: "#10A5F5[P0] 已恢复以下区域的扫描任务: [scan_regions]"
扫描进行中: "&c[P0] 以下区域已有扫描任务在进行: [scan_regions]"
扫描未运行: "&c[P0] 以下区域当前没有扫描任务: [scan_regions]"
扫描状态: "&a[P0] 已完成 [scan_chunks] / [scan_totalChunks] 区块（区域: [scan_regions]）。[scan_cps] cps。陆地比例: [scan_landPercentage]%。剩余时间: [scan_eta]"

################################################################################
# 第 7 节: 信息命令
################################################################################
信息标题: "&a======RTP 信息======"
信息_票据: "&7全局活动区块票据: &f[tickets]"
信息_传送: "&7活动传送状态机: &f[teleports]"
信息_MSPT: "&7当前插件 MSPT: &f[mspt]"
信息_总加载次数: "&7累计加载区块数: &f[loads]"
信息_泄漏率: "&7当前区块泄漏率: &f[leakRate]"
信息_免责声明_标题: "&7--- 诊断说明 ---"
信息_免责声明: "&7诊断说明: 如果服务器孤儿区块总数超过本插件的累计加载数 ([loads])，则本插件并非内存泄漏的唯一原因。"
信息_世界标题: "#008080世界:"
信息_控制台_世界标题: "&7--- 世界 ---"
信息世界: "  #21ADA8[world]"
信息_区域标题: "#63C5DA区域:"
信息_控制台_区域标题: "&7--- 区域 ---"
信息区域: "  #52B2BF[region]"

世界信息:
  - "#21ADA8[world]:"
  - "#99EEBB  - 区域: [region]"
  - "#99EEBB  - 需要权限: [requirePermission]"
  - "#99EEBB  - 覆盖: [override]"

区域信息:
  - "#52B2BF[region]:"
  - "#58CCED  - 世界: [world]"
  - "#58CCED  - 形状: [shape]"
  - "#58CCED  - 需要权限: [requirePermission]"
  - "#58CCED  - 覆盖世界边界: [worldBorderOverride]"
  - "#58CCED  - 缓存上限: [cacheCap]"
  - "#58CCED  - 已保留缓存 (L1): [keptCache]"
  - "#58CCED  - 已释放缓存 (L2): [unkeptCache]"
  - "#58CCED  - 积压缓存 (L3): [backlogCache] / [backlogCacheCap]"
  - "#58CCED  - 已缓存: [cached]"

################################################################################
# 第 8 节: 命令说明
################################################################################
rtp: "&b/rtp - 传送到一个随机位置"
rtp_说明: "传送到一个随机位置"
帮助: "&b/rtp help - 显示本帮助"
帮助_说明: "命令说明"
重载: "&b/rtp reload - 重新加载配置文件"
重载_说明: "重新加载配置文件"
扫描: "&b/rtp scan - 扫描区域内所有可能位置以提升加载速度"
扫描_说明: "清理已保存数据并扫描区域内所有可能位置"
配置_说明: "在运行时更新配置文件"
信息_说明: "查看插件当前状态"
测试_说明: "测试 RTP 功能"

################################################################################
# 第 9 节: PlaceholderAPI 支持
################################################################################
玩家_可用: "&a可用"
玩家_冷却中: "&e等待中"
玩家_准备: "&b正在选择位置"
玩家_加载中: "&b正在加载区块"
玩家_传送中: "&b正在传送"

################################################################################
# 第 10 节: 视觉元素
################################################################################
标题: "#FF6B6B随#FF7E63机#FF9155传#FFA447送#FFB739！"
副标题: "#A78BFA出#AF84F9发#B77DF7吧#BF76F5！"
淡入: 20
停留: 20
淡出: 20

动作栏: ""

################################################################################
# 第 11 节: 元数据
################################################################################
version: "1.0"

################################################################################
# 第 12 节: 开发者选项
################################################################################
显示开发者标签: false
