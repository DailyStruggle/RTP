# --- RTP 消息（简体中文） ---
# 玩家与控制台可见消息的中文翻译。
# 重要事项：
# - 本文件的键名应与 lang/zh/messages.lang.yml 的右列（即插件内部键名的
# 中文翻译）保持一致。若 messages.lang.yml 中没有某个键，将回退到基础
# 英文文件 (lang/messages.lang.yml) 中的英文键名。
# - 必须原样保留方括号占位符: [P0], [delay], [attempts], [world],
# [region], [remainingCooldown], [scan_chunks] 等。
# - 必须保留颜色代码 &a &e &c 以及十六进制颜色 (#2636ef)。
# ###############################################################################
# 第 1 节: 通用配置
# ###############################################################################
占位符:
  # P0
  - "[RTP]"

# ###############################################################################
# 第 2 节: 传送
# ###############################################################################
已在传送: "&e[P0] 你已经在传送中！"

# 当插件正在重载时
传送被拒_重载中: "&e[P0] 插件正在重载，传送暂时被禁用。请稍后再试。"
延迟消息: "&e[P0] 将在 [delay] 后传送，请勿移动。"
区块加载中: "&e[P0] 正在加载区块，请稍候……"
传送消息: "&e[P0] 在 [attempts] 次尝试后已传送，用时 [processingTime]"

# if teleport is cancelled
取消传送: "&e[P0] 传送已取消！"

# 达到最大尝试次数后仍未找到安全位置时
# 占位符: [attempts] - 最大尝试次数
不安全: "&e[P0] 在 [attempts] 次尝试中未找到安全位置"

# 当玩家处于冷却中时
# 占位符: [remainingCooldown] - 剩余时间
冷却消息: "&e[P0] 你必须等待 [remainingCooldown] 才能再次传送"

# 当区域没有排队的位置且玩家没有 rtp.unqueued 权限时
队列中无可用位置: "#f5eb73[P0] 当前没有可用的位置"

# 当队列前进时
# 占位符: [spot] - 当前队列位置
队列更新: "#2636ef[P0] 你在队列中的位置: [spot]"

# 玩家在该区域传送所需的金钱不足时
# 占位符: [money] - 命令所需的金额
余额不足: "&e[P0] 你至少需要 $[money] 才能执行此操作。"

# ###############################################################################
# 第 3 节: 时间格式
# ###############################################################################
天: "天"
小时: "时"
分: "分"
秒: "秒"
毫秒: "毫秒"

# ###############################################################################
# 第 4 节: 系统与管理
# ###############################################################################
旧文件: "&b[P0] 检测到旧的 [filename]。正在更新"

# 检测到配置文件中没有的 bukkit 世界
# 占位符: [world] - 检测到的世界
新世界: "&b[P0] 检测到新世界 '[world]'"

# bukkit 中不存在该世界
# 占位符: [world] - 世界名称
无效世界: "&e[P0] 找不到世界 '[world]'"

# 插件重载 / 更新提示
# 占位符: [filename] - 文件名
重载中: "&b[P0] 正在加载 [filename]……"
已重载: "&b[P0] [filename] 已成功加载。"
更新中: "&a[P0] 正在更新 [filename]……"
已更新: "&a[P0] [filename] 已成功更新。"

# 插件没有用户请求的命令
# 占位符: [arg] - 尝试的参数
参数错误: "&c[P0] 命令参数无效 [arg]"

# 当控制台尝试运行仅限玩家的命令时
控制台命令不允许: "&c[P0] 你必须以游戏内玩家身份执行此命令。"

# busy 与 invalidCommand 未在 messages.lang.yml 中翻译 -> 使用英文键名（回退到基础英文）。
繁忙: "&c[P0] 忙"

# plugin doesn't have the subcommand or parameter the user requested
# placeholder: [arg] - the argument attempted
无效命令: "&c[P0] 无效命令 - [arg]"

# 用户没有所请求命令的权限
无权限: "&e抱歉，你没有权限执行此命令。如果你认为这是错误，请联系服务器管理员。"

# ###############################################################################
# 第 5 节: 管理日志
# ###############################################################################
位置已保存: "&e[P0] 已成功保存 [amount] 个 [region] 的位置"
位置已加载: "&e[P0] 已成功加载 [amount] 个 [region] 的位置"

# ###############################################################################
# 第 6 节: 扫描命令
# ###############################################################################
开始扫描: "&a[P0] 已为以下区域启动扫描任务: [scan_regions]"
重置扫描: "&e[P0] 已重置以下区域的扫描队列: [scan_regions]"
取消扫描: "&e[P0] 已取消以下区域的扫描任务: [scan_regions]"
暂停扫描: "#A020F0[P0] 已暂停以下区域的扫描任务: [scan_regions]"
恢复扫描: "#10A5F5[P0] 已恢复以下区域的扫描任务: [scan_regions]"
扫描进行中: "&c[P0] 以下区域已有扫描任务在进行: [scan_regions]"
扫描未运行: "&c[P0] 以下区域当前没有扫描任务: [scan_regions]"
# placeholder: [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
扫描状态: "&a[P0] 已完成 [scan_chunks] / [scan_totalChunks] 区块（区域: [scan_regions]）。[scan_cps] cps。陆地比例: [scan_landPercentage]%。剩余时间: [scan_eta]"

# ###############################################################################
# 第 7 节: 信息命令
# ###############################################################################
信息标题: "&a======RTP 信息======"
信息_票据: "&7全局活动区块票据: &f[tickets]"
信息_传送: "&7活动传送状态机: &f[teleports]"
信息_MSPT: "&7当前插件 MSPT: &f[mspt]"
信息_总加载次数: "&7累计加载区块数: &f[loads]"
信息_按来源加载: "&7Loads by Origin: &f[loadsByOrigin]"
信息_泄漏率: "&7当前区块泄漏率: &f[leakRate]"
# --- Metrics SPI health block (METRICS_PLAN.md > /rtp info Surface) ---
信息_队列深度: "&7Players Waiting In Region Queues: &f[queueDepth]"
信息_等待传送: "&7Pending Teleport Pipelines: &f[pendingTeleports]"
信息_平均管道毫秒: "&7Avg Pipeline Latency: &f[avgPipelineMs] ms"
信息_堆内存: "&7JVM Heap: &f[heapUsedMb] / [heapMaxMb] MiB"
# /rtp info 中 Health pipeline 标记块的标题行。
信息_健康管道标题: "&7--- Health: pipeline ---"
# 1m / 5m / 15m 窗口的 TPS 读数。占位符: [tps1m] [tps5m] [tps15m]。
信息_TPS: "&7TPS (1m/5m/15m): &f[tps1m] / [tps5m] / [tps15m]"
# 实时服务器 MSPT 与 tick 预算使用率。占位符: [mspt] [tickBudgetUtilisation]。
信息_MSPT实时: "&7Server MSPT: &f[mspt] ms (&7tick budget: &f[tickBudgetUtilisation]&7)"
# Configured player soft-cap vs current online count. Placeholders: [softCap] [playerCount].
信息_软上限: "&7Players: &f[playerCount] / [softCap]"
# 最近一次数据库往返延迟（毫秒）。占位符: [databaseLatencyMs]。
信息_数据库延迟毫秒: "&7Database Latency: &f[databaseLatencyMs] ms"
# Health colour-band thresholds. Doubles consumed by ColourBands in rtp-core
# to wrap coloured-variant placeholders (e.g. [tps1mColoured]) with &a/&e/&c.
信息_TPS阈值_绿: 19.5
信息_TPS阈值_黄: 18.0
信息_MSPT阈值_绿: 30.0
信息_MSPT阈值_黄: 45.0
信息_缓存填充阈值_绿: 0.5
信息_缓存填充阈值_黄: 0.25
信息_网络快照陈旧阈值_黄: 5.0
# Header line introducing the per-Folia-region table (Folia runtime only).
信息_Folia区域标题: "&7--- Folia regions ---"
# Per-row template for a single Folia region. Placeholders: [regionId] [tps1m]
# [mspt] [playerCount] [queueDepth] [tickBudgetUtilisation].
信息_Folia区域: "  &f[regionId]&7: tps=&f[tps1m]&7 mspt=&f[mspt]&7 players=&f[playerCount]&7 queue=&f[queueDepth]&7 budget=&f[tickBudgetUtilisation]"
信息_免责声明_标题: "&7--- 诊断说明 ---"
信息_免责声明: "&7诊断说明: 如果服务器孤儿区块总数超过本插件的累计加载数 ([loads])，则本插件并非内存泄漏的唯一原因。"
信息_世界标题: "#008080世界:"
信息_控制台_世界标题: "&7--- 世界 ---"
信息世界: "  #21ADA8[world]"
信息_区域标题: "#63C5DA区域:"
信息_控制台_区域标题: "&7--- 区域 ---"
信息区域: "  #52B2BF[region]"

# sub-info listings
# placeholders: [world], [region], [requirePermission], [override], [shape], [worldBorderOverride], [cacheCap], [cached], [keptCache], [unkeptCache], [backlogCache], [backlogCacheCap]
世界信息:
  - "#21ADA8[world]:"
  - "#99EEBB  - 区域: [region]"
  - "#99EEBB  - 需要权限: [requirePermission]"
  - "#99EEBB  - 覆盖: [override]"

区域信息:
  - "#52B2BF[region]:"
  - "#58CCED  - 世界: [world]"
  - "#58CCED  - 形状: [shape]"
  - "#58CCED  - 需要权限: [requirePermission]"
  - "#58CCED  - 覆盖世界边界: [worldBorderOverride]"
  - "#58CCED  - 缓存上限: [cacheCap]"
  - "#58CCED  - 已保留缓存 (L1): [keptCache]"
  - "#58CCED  - 已释放缓存 (L2): [unkeptCache]"
  - "#58CCED  - 积压缓存 (L3): [backlogCache] / [backlogCacheCap]"
  - "#58CCED  - 已缓存: [cached]"

# ###############################################################################
# 第 8 节: 命令说明
# ###############################################################################
rtp: "&b/rtp - 传送到一个随机位置"
rtp_说明: "传送到一个随机位置"
帮助: "&b/rtp help - 显示本帮助"
帮助_说明: "命令说明"
重载: "&b/rtp reload - 重新加载配置文件"
重载_说明: "重新加载配置文件"
扫描: "&b/rtp scan - 扫描区域内所有可能位置以提升加载速度"
扫描_说明: "清理已保存数据并扫描区域内所有可能位置"
配置_说明: "在运行时更新配置文件"
信息_说明: "查看插件当前状态"
测试_说明: "测试 RTP 功能"

# ###############################################################################
# Section 8b: Generalized Menu Framework
# ###############################################################################
# Sent when a menu token is unknown, malformed, or belongs to another player.
菜单_无效: "&c[P0] that menu link is invalid."
# Sent when a menu token has expired or was already consumed.
菜单_已过期: "&c[P0] that menu link has expired. Please reopen the menu."
# 当菜单兑换无法解析调用玩家 UUID 时发送。
菜单_未知玩家: "&c[P0] menu links can only be used by in-game players."
# Hover-fallback template used by the menu reflector when no YAML block-comment
# is available for a parameter. Placeholder: [type] - the declared parameter type.
菜单_悬停_备用类型: "type: [type]"
# Hover-fallback template used by the menu reflector when a parameter exposes a
# small curated value set. Placeholder: [values] - comma-joined accepted values.
菜单_悬停_备用范围: "accepted: [values]"
# Label for the "go back one level" navigation row prepended to every non-root menu page.
菜单_返回: "&7« back"
# Label template for the "execute the assembled command" row prepended to every
# runnable non-root menu page. Placeholder: [command] - the assembled /rtp ... invocation.
菜单_执行: "&a▶ run [command]"
# Header row at the top of a parameter-value picker sub-page (Stage A.2).
# Placeholders: [param] - parameter name; [command] - assembled /rtp ... invocation.
菜单_选择值: "&epick a value for [param] (will run: /rtp [command] [param]:<value>)"
# Label for the "type a custom value" fallback row on a parameter-value picker page.
# Clicking it prefills chat with the assembled command up to '<param>:' so the player
# can type any value, including ones not in the suggestion list.
菜单_输入值: "&7✎ type a custom value..."
# Non-clickable header row at the top of every non-root menu page (Stage A.4).
# Surfaces the currently-constructed /rtp invocation including any staged
# parameter assignments (name:value). Placeholder: [command] - assembled args.
菜单_已构建: "&7building: &f/rtp [command]"
# Non-clickable title row prepended to the root /rtp menu page (Stage A.5).
# Provides a welcoming header before the player descends into any subcommand.
菜单_主标题: "&6&l⚡ RTP menu"
# Non-clickable subtitle/hint row prepended to the root /rtp menu page below
# menuRootTitle (Stage A.5). Short orientation text for first-time users.
菜单_主提示: "&7click an option below to begin"
# Navigation rows appended to paginated menu pages (Stage A.6) — clicking
# them moves to the previous/next page of the same model. Placeholder:
# [page] - the 1-based human-readable target page number.
菜单_上一页: "&7« previous page ([page])"
菜单_下一页: "&7next page ([page]) »"
# Section divider on the front page above teleport rows (player view).
菜单_首页_传送分区: "&8--- &7teleport &8---"
# Section divider on the front page above admin rows (admin view).
菜单_首页_管理分区: "&8--- &7admin &8---"
# Front-page rows. No placeholders.
菜单_首页_传送行: "&a▶ /rtp &7- teleport to a random location"
菜单_首页_区域行: "&a▶ /rtp region:&7... &7- pick a region"
菜单_首页_生物群系行: "&a▶ /rtp biome:&7... &7- pick a biome"
菜单_首页_帮助行: "&a▶ /rtp help &7- list commands"
菜单_首页_信息行: "&b▶ /rtp info &7- plugin diagnostics"
菜单_首页_配置行: "&b▶ /rtp config &7- edit config files"
菜单_首页_扫描行: "&b▶ /rtp scan &7- pre-fill region caches"
菜单_首页_诊断行: "&c▶ /rtp test full &7- run full diagnostics"
菜单_首页_重载行: "&c▶ /rtp reload &7- reload config files"
# 诊断行的悬停文本，提示成本。无占位符。
菜单_首页_悬停_诊断: "&7runs full diagnostic suite; may be expensive"
# 重载行的悬停文本，提示副作用。无占位符。
菜单_首页_悬停_重载: "&7reloads all config files; in-flight teleports may be affected"

