信息_等待传送: "&7Pending Teleport Pipelines: #7E9CC8[pendingTeleports]"
信息_平均管道毫秒: "&7Avg Pipeline Latency: #7E9CC8[avgPipelineMs] ms"
信息_堆内存: "&7JVM Heap: #7E9CC8[heapUsedMb] / [heapMaxMb] MiB"
# /rtp info 中 Health pipeline 标记块的标题行。
