# --- RTP 消息（简体中文） ---
# 玩家与控制台可见消息的中文翻译。
# 重要事项：
# - 本文件的键名应与 lang/zh/messages.lang.yml 的右列（即插件内部键名的
# 中文翻译）保持一致。若 messages.lang.yml 中没有某个键，将回退到基础
# 英文文件 (lang/messages.lang.yml) 中的英文键名。
# - 必须原样保留方括号占位符: [P0], [delay], [attempts], [world],
# [region], [remainingCooldown], [scan_chunks] 等。
# - 必须保留颜色代码 &a &7 &c 以及十六进制颜色 (#2636ef)。
# ###############################################################################
# 第 1 节: 通用配置
# ###############################################################################
占位符:
  # P0
  - "[RTP]"

# ###############################################################################
# 第 2 节: 传送
# ###############################################################################
已在传送: "&7[P0] 你已经在传送中！"

# 当插件正在重载时
传送被拒_重载中: "&7[P0] 插件正在重载，传送暂时被禁用。请稍后再试。"
延迟消息: "&7[P0] 将在 [delay] 后传送，请勿移动。"
区块加载中: "&7[P0] 正在加载区块，请稍候……"
传送消息: "&7[P0] 在 [attempts] 次尝试后已传送，用时 [processingTime]"

# if teleport is cancelled
取消传送: "&7[P0] 传送已取消！"

# 达到最大尝试次数后仍未找到安全位置时
# 占位符: [attempts] - 最大尝试次数
不安全: "&7[P0] 在 [attempts] 次尝试中未找到安全位置"

# 当玩家处于冷却中时
# 占位符: [remainingCooldown] - 剩余时间
冷却消息: "&7[P0] 你必须等待 [remainingCooldown] 才能再次传送"

# 当区域没有排队的位置且玩家没有 rtp.unqueued 权限时
队列中无可用位置: "#f5eb73[P0] 当前没有可用的位置"

# 当队列前进时
# 占位符: [spot] - 当前队列位置
队列更新: "#2636ef[P0] 你在队列中的位置: [spot]"

# 玩家在该区域传送所需的金钱不足时
# 占位符: [money] - 命令所需的金额
余额不足: "&7[P0] 你至少需要 $[money] 才能执行此操作。"

# ###############################################################################
# 第 3 节: 时间格式
# ###############################################################################
天: "天"
小时: "时"
分: "分"
秒: "秒"
毫秒: "毫秒"

# ###############################################################################
# 第 4 节: 系统与管理
# ###############################################################################
旧文件: "&b[P0] 检测到旧的 [filename]。正在更新"

# 检测到配置文件中没有的 bukkit 世界
# 占位符: [world] - 检测到的世界
新世界: "&b[P0] 检测到新世界 '[world]'"

# bukkit 中不存在该世界
# 占位符: [world] - 世界名称
无效世界: "&7[P0] 找不到世界 '[world]'"

# 插件重载 / 更新提示
# 占位符: [filename] - 文件名
重载中: "&b[P0] 正在加载 [filename]……"
已重载: "&b[P0] [filename] 已成功加载。"
更新中: "&a[P0] 正在更新 [filename]……"
已更新: "&a[P0] [filename] 已成功更新。"

# 插件没有用户请求的命令
# 占位符: [arg] - 尝试的参数
参数错误: "&c[P0] 命令参数无效 [arg]"

# 当控制台尝试运行仅限玩家的命令时
控制台命令不允许: "&c[P0] 你必须以游戏内玩家身份执行此命令。"

# busy 与 invalidCommand 未在 messages.lang.yml 中翻译 -> 使用英文键名（回退到基础英文）。
繁忙: "&c[P0] 忙"

# plugin doesn't have the subcommand or parameter the user requested
# placeholder: [arg] - the argument attempted
无效命令: "&c[P0] 无效命令 - [arg]"

# 用户没有所请求命令的权限
无权限: "&7抱歉，你没有权限执行此命令。如果你认为这是错误，请联系服务器管理员。"

# ###############################################################################
# 第 5 节: 管理日志
# ###############################################################################
位置已保存: "&7[P0] 已成功保存 [amount] 个 [region] 的位置"
位置已加载: "&7[P0] 已成功加载 [amount] 个 [region] 的位置"

# ###############################################################################
# 第 6 节: 扫描命令
# ###############################################################################
开始扫描: "&a[P0] 已为以下区域启动扫描任务: [scan_regions]"
重置扫描: "&7[P0] 已重置以下区域的扫描队列: [scan_regions]"
取消扫描: "&7[P0] 已取消以下区域的扫描任务: [scan_regions]"
暂停扫描: "#A020F0[P0] 已暂停以下区域的扫描任务: [scan_regions]"
恢复扫描: "#10A5F5[P0] 已恢复以下区域的扫描任务: [scan_regions]"
扫描进行中: "&c[P0] 以下区域已有扫描任务在进行: [scan_regions]"
扫描未运行: "&c[P0] 以下区域当前没有扫描任务: [scan_regions]"
# placeholder: [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
扫描状态: "&a[P0] 已完成 [scan_chunks] / [scan_totalChunks] 区块（区域: [scan_regions]）。[scan_cps] cps。陆地比例: [scan_landPercentage]%。剩余时间: [scan_eta]"

# ###############################################################################
# 第 7 节: 信息命令
# ###############################################################################
信息标题: "&a======RTP 信息======"
信息_票据: "&7全局活动区块票据: #7E9CC8[tickets]"
信息_传送: "&7活动传送状态机: #7E9CC8[teleports]"
信息_MSPT: "&7当前插件 MSPT: #7E9CC8[mspt]"
信息_总加载次数: "&7累计加载区块数: #7E9CC8[loads]"
信息_按来源加载: "&7Loads by Origin: #7E9CC8[loadsByOrigin]"
信息_泄漏率: "&7当前区块泄漏率: #7E9CC8[leakRate]"
# --- Metrics SPI health block (METRICS_PLAN.md > /rtp info Surface) ---
