# --- RTP 经济配置 ---
# 通过服务器经济系统配置随机传送的费用。
# 传送费用
# 标准 /rtp 命令的基础费用。
# @type: number
# @range: [0.0, null]
# @default: 50.0
价格: 50.0

# 传送其他玩家 (/rtp <玩家>) 的费用。
# @type: number
# @range: [0.0, null]
# @default: 200.0
价格其他: 200.0

# 使用自定义参数 (/rtp region:<区域> 等) 的费用。
# @type: number
# @range: [0.0, null]
# @default: 1000000000.0
参数价格: 1000000000.0

# 指定生物群系 (/rtp biome:<生物群系>) 的额外费用。
# @type: number
# @range: [0.0, null]
# @default: 5000.0
生物群系价格: 5000.0

# 若传送被取消（玩家移动、失败等）则退还费用。
# @type: boolean
# @default: true
取消时退款: true

# 玩家付款后必须保留的最低余额；若会低于此下限则拒绝传送。
# @type: number
# @range: [0.0, null]
# @default: 0.0
最低余额: 0.0

# 请勿修改版本号
version: 1.0
