# --- 插件日志开关 ---
# 启用或禁用插件各类活动的日志记录。
# 系统详细日志
# detailed_reload: 记录所有被重新加载的文件/配置段
# detailed_region_init: 记录每个区域的初始化过程
详细_重载: false
# Log region initialization details
详细_区域初始化: false

# 基础活动日志
# command: 记录玩家执行的 RTP 命令
# teleport: 记录实际的传送事件
命令: false
# Log successful teleport events
传送: true

# 事件触发的自动 RTP 日志
事件_切换世界: "true # 玩家切换世界时"
# Log RTP triggered on join
事件_加入: "true     # 玩家加入服务器时"
# Log RTP triggered on respawn
事件_重生: "true     # 玩家重生时"
# Log move event processing
事件_移动: "true     # 玩家移动时（若启用按移动触发的 RTP）"
# Log teleport event processing
事件_传送: "true     # 玩家传送时（若启用按传送触发的 RTP）"

# 选择失败调试
# 当查找安全位置失败时记录详细信息，包括失败率与查询参数。
选择失败: true

# 系统日志
# 与后台任务和数据库操作相关。
系统_内存追踪: false
# Debug logs for database activity
系统_数据库: false

# 插件级最低日志级别。实际过滤为本设置与 Bukkit logger 二者中较严格的一个。
# 可选值: SEVERE, WARNING, INFO, CONFIG, FINE, FINER, FINEST, ALL, OFF。
# 默认 ALL，行为与 Bukkit logger 一致。
最低级别: "INFO"

# 请勿修改版本号
version: 1.0
