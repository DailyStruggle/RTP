# --- RTP 指标设置 ---
# Phase M2 指标 SPI 的仅报告类开关。节流 / 调优开关仍位于
# performance.yml 中。
# 文档: docs/dev/METRICS_PLAN.md > Folia Aggregation
# 在 Folia 上以每区域明细填充 MetricsSnapshot.foliaRegions()。
# 对 Paper / Bukkit / Fabric 无效 (单区域运行时始终返回空列表，
# 这是这些平台的正确答案)。
# @type: boolean
# @default: true
foliaIncludeRegions: true

# 在 Folia 上将每个区域的采样合并为 MetricsSnapshot 标量
# tps{1,5,15}m 字段的聚合策略。
# 可选值: mean | max
# @type: enum
# @default: mean
foliaAggregationTps: "mean"

# 在 Folia 上将每个区域的采样合并为 MetricsSnapshot 标量 mspt
# 字段的聚合策略。
# 可选值: mean | max
# @type: enum
# @default: max
foliaAggregationMspt: "max"

# 在 Folia 上将每个区域的采样合并为 MetricsSnapshot 标量
# tickBudgetUtilisation 字段的聚合策略。
# 可选值: mean | max
# @type: enum
# @default: max
foliaAggregationTickBudget: "max"

# DO NOT TOUCH VERSION NUMBER
version: 1.0
