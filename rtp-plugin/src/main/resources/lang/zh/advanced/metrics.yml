# --- RTP 指标设置 ---

# 指标的仅报告类开关。节流 / 调优开关仍位于
# performance.yml 中。
# 在 Folia 上以每区域明细填充。
# 对 Paper / Bukkit / Fabric 无效 (单区域运行时始终返回空列表，
# 这是这些平台的正确答案)。
# @type: boolean
# @default: true
foliaIncludeRegions: true

# 在 Folia 上将每个区域的采样合并为标量
# tps{1,5,15}m 字段的聚合策略。
# @type: enum
# @options: [mean, max]
# @default: mean
foliaAggregationTps: "mean"

# 在 Folia 上将每个区域的采样合并为标量 mspt
# 字段的聚合策略。
# @type: enum
# @options: [mean, max]
# @default: max
foliaAggregationMspt: "max"

# 在 Folia 上将每个区域的采样合并为标量
# tickBudgetUtilisation 字段的聚合策略。
# @type: enum
# @options: [mean, max]
# @default: max
foliaAggregationTickBudget: "max"

# 请勿修改版本号
version: 1.0
