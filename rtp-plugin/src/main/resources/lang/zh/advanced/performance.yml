# 最低 TPS 要求
# 在向缓存中追加新位置之前要求的最低服务器 TPS。
# 范围: 0.0 - 20.0。
# 影响: 低 — 防止插件在服务器卡顿时进一步加重负担。
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
最低TPS: 19.0

# 暂停后台缓存填充的 JVM 堆使用率上限（最大值的 %）。
# 已缓存的位置仍会提供。0 或 100 表示禁用。
# @type: number
# @range: [0.0, 100.0]
# @default: 85.0
maxHeap百分比: 85.0

# --- RTP 性能设置 ---
# 针对服务器性能精细调节插件行为。
# 最大查找尝试次数
# 在放弃前为单次请求查找安全位置的最大尝试次数。
# 影响: 高 — 数值过大会显著增加每次请求的 CPU 占用。
# @type: integer
# @range: [1, null]
# @default: 32
最大尝试次数: 10

# 选择频率（游戏刻）
# 后台为各区域缓存补充新位置的间隔时间。
# ( 20 ticks = 1 秒 )。
# 影响: 中 — 数值越小补充越快，但 CPU 占用越多。
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
周期: 20

# 单次任务分配时间（毫秒）
# 每个 tick 用于 RTP 任务的最大时间（毫秒）。
# 范围: 0 - 50。
# 影响: 中 — 数值越大处理越快，但可能挤压 tick 时间。
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
分配时间_同步: 50

# 每刻用于异步任务的最大毫秒数。
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
分配时间_异步: 50

# 目标位置预加载（区块）
# 在目标周围预加载的区块半径。
# 加载的区块数 = ( 1 + 2 * 半径 )^2。
# 影响: 高 — 数值过大可能在传送时导致 TPS 下降。
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
视距_选择: 0

# 传送前在最终位置周围加载的区块半径。
# 0 仅加载目标区块。
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
视距_传送: 0

# 传送后玩家视距恢复正常所经历的刻数，用于平滑区块加载峰值。0 表示禁用钳制。
# 注意：暂时强制设为 0。逐步恢复会在到达时导致客户端闪烁 / 重新渲染。
# 在另行通知前请保持为 0。
# @type: integer
# @range: [0, null]
# @unit: ticks
# @default: 200
视距_恢复间隔: 0

# 传送后排队
# 若为 true，则插件会在一次 RTP 之后立即尝试补充位置缓存。
# 影响: 中
# @type: boolean
# @default: false
传送后排队: false

# 将已加载区块的生物群系记录到空间内存，供生物群系召回 / 加权使用。无额外区块 I/O。
# @type: boolean
# @default: true
区块加载时检查: true

# 恢复填充时 L3 积压容量的比例（滞后）。
# 0.5 = 排空至 50% 后填充；1.0 = 持续填充。
# @type: number
# @range: [0.0, 1.0]
# @default: 0.5
积压补充阈值: 0.5

# 每次尝试拒绝未生成区块的概率。
# 0.0 = 无偏向，1.0 = 避开未生成的地块。已生成的区块始终通过。
# @type: number
# @range: [0.0, 1.0]
# @default: 0.0
预生成偏好: 0.0

# 为加入时的传送预留一份位置缓存
# (rtp.onevent.firstjoin / rtp.onevent.join)。
# @type: boolean
# @default: false
登录缓存启用: false

# 加入缓存的硬上限。0 = 自动 (服务器启动时的 max-players)。
# @type: integer
# @range: [0, null]
# @default: 0
登录缓存上限: 0

# 生物群系选择缓存
# biomeRecall: 复用按生物群系曾经找到过的位置。
# biomeRecallForced: 仅使用缓存中已发现的生物群系。
# 影响: 低 至 中
# @type: boolean
# @default: true
生物群系记忆: true

# 仅从缓存提供按生物群系过滤的请求（绝不生成新的生物群系搜索）。需要 biomeRecall。
# @type: boolean
# @default: false
生物群系记忆_强制: false

# 延迟阈值（毫秒），超过此值的即时传送将被审计
# （记录 WARN，slowPipelineCount 递增）。0 或更小表示禁用。
# @type: integer
# @range: [0, null]
# @unit: ms
# @default: 5000
慢管线阈值Ms: 5000

# 审计背压的队列深度（等待中的玩家数）
# （记录 WARN，queueGrowthWarnCount 递增）。0 或更小表示禁用。
# @type: integer
# @range: [0, null]
# @unit: players
# @default: 0
队列增长警告阈值: 0

# 同步加载
# 在选择位置时使用同步区块加载。
# 影响: 高 — 不推荐！可能造成严重的服务器卡顿。
# @type: boolean
# @default: false
同步加载: false

# 权限解析（启动时）
# onEventParsing: 与通配符权限 *.* 不兼容。
# 影响: 中 (onEvent) / 低 (effect)
# @type: boolean
# @default: false
事件时解析: false

# 在启动时解析效果权限节点。
# @type: boolean
# @default: true
效果解析: true

# 观察者模式缓存填充（Region Data Visitor）
# 当预生成缓存已满时，按相同的 `period` 周期为每个区域调度一个观察类型的
#。它复用与默认缓存填充相同的 流水线，
# 但不会把得到的安全候选项加入队列，而是丢弃，从而让副作用（如记录不良
# 位置、收集已观察到的生物群系）在后台累积，且队列不会超过上限。
# 它从不触发世界生成：尚未存入磁盘的区块会被 的 Anvil 预过滤器
# 以 UNKNOWN 结果跳过。
# visitorEnabled: 主开关 (true 启用观察者模式)。
# 频率沿用上面的 `period` 设置；没有单独的速率参数。
# 影响: 低 — 受现有 `period` 限制；只有当默认填充模式下缓存还有富余时才
# 会执行额外工作。
# @type: boolean
# @default: false
访客启用: true

# /rtp admin prefab 的设置。apply -> confirm 流程会为每个改动的文件写入一份备份；
# bakRetention 限制保留数量（最旧的先清除）。
预设:
  # 每个文件在修剪前保留的带时间戳配置备份数量。
  # @type: integer
  # @range: [1, null]
  # @default: 3
  bakRetention: 3
# 请勿修改版本号
version: 1.0
