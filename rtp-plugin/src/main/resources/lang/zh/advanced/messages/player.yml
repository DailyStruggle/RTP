# --- RTP 消息（本语言） ---
# 本语言面向玩家和管理员的消息文本，按主题分组。
# 由英文消息自动生成的副本；请勿手动编辑（会被覆盖）。

# ###############################################################################
# 第 2 节: 传送
# ###############################################################################
已在传送: "&7[P0] ⚡ 你已经在传送中！"

# 当插件正在重载时
传送被拒_重载中: "&7[P0] 插件正在重载，传送暂时被禁用。请稍后再试。"
延迟消息: "<gradient:#9D7CD8:#5FB3B3>[P0] ⚡ 将在 [delay] 后传送，请勿移动</gradient>"
区块加载中: "&7[P0] ⚙ 正在加载区块，请稍候.."
传送消息: "<gradient:#5FB3B3:#9D7CD8>[P0] ⚡ 已在 [attempts] 次尝试后传送，耗时 [processingTime]</gradient>"

# 传送被取消时
取消传送: "&7[P0] ⚡ 传送已取消！"

# 达到最大尝试次数后仍未找到安全位置时
# 占位符: [attempts] - 最大尝试次数
不安全: "&7[P0] ⌖ 在 [attempts] 次尝试中未找到安全位置"

# 当玩家处于冷却中时
# 占位符: [remainingCooldown] - 剩余时间
冷却消息: "&7[P0] ⚡ 你必须等待 [remainingCooldown] 才能再次传送"

# 玩家达到 lockAfterUses 上限被锁定时（BetterRTP LockAfter 兼容）
lockedAfterUses: "&7[P0] ⌖ 你已达到随机传送次数上限，请在 [remainingLockTime] 后再试。"

# 当区域没有排队的位置且玩家没有 rtp.unqueued 权限时
队列中无可用位置: "#f5eb73[P0] ⌖ 当前没有可用的位置"

# 当队列前进时
# 占位符: [spot] - 当前队列位置
队列更新: "#2636ef[P0] 你在队列中的位置: [spot]"

# 玩家在该区域传送所需的金钱不足时
# 占位符: [money] - 命令所需的金额
余额不足: "&7[P0] 你至少需要 $[money] 才能执行此操作。"

# ###############################################################################
# 第 3 节: 时间格式
# ###############################################################################
天: "天"
小时: "时"
分: "分"
秒: "秒"
毫秒: "毫秒"

# bukkit 中不存在该世界
# 占位符: [world] - 世界名称
无效世界: "&7[P0] 找不到世界 '[world]'"

# 插件没有用户请求的命令
# 占位符: [arg] - 尝试的参数
参数错误: "&c[P0] 命令参数无效 [arg]"

# 当控制台尝试运行仅限玩家的命令时
控制台命令不允许: "&c[P0] 你必须以游戏内玩家身份执行此命令。"

# busy 与 invalidCommand 未在 messages.lang.yml 中翻译 -> 使用英文键名（回退到基础英文）。
繁忙: "&c[P0] 忙"

# 可选 PvP 战斗检测拒绝 /rtp 时发送（玩家处于战斗中）
pvpInCombat: "&c[P0] 战斗中无法进行随机传送。"

# 插件没有用户请求的子命令或参数
# 占位符: [arg] - 尝试的参数
无效命令: "&c[P0] 无效命令 - [arg]"

# 用户没有所请求命令的权限
无权限: "&7抱歉，你没有权限执行此命令。如果你认为这是错误，请联系服务器管理员。"

# ###############################################################################
# 第 8 节: 命令说明
# ###############################################################################
rtp: "&b/rtp - 传送到一个随机位置"
rtp_说明: "传送到一个随机位置"
帮助: "&b/rtp help - 显示本帮助"
帮助_说明: "命令说明"
重载: "&b/rtp reload - 重新加载配置文件"
重载_说明: "重新加载配置文件"
扫描: "&b/rtp scan - 扫描区域内所有可能位置以提升加载速度"
扫描_说明: "清理已保存数据并扫描区域内所有可能位置"
配置_说明: "在运行时更新配置文件"
信息_说明: "查看插件当前状态"
测试_说明: "测试 RTP 功能"

# ###############################################################################
# 第 9 节: PlaceholderAPI 支持
# ###############################################################################
玩家_可用: "&a可用"
玩家_冷却中: "&7等待中"
玩家_准备: "&b正在选择位置"
玩家_加载中: "&b正在加载区块"
玩家_传送中: "&b正在传送"

# ###############################################################################
# 第 10 节: 视觉元素
# ###############################################################################
标题: "<rainbow>已传送！</rainbow>"
副标题: "<gradient:#A78BFA:#E876A0>玩得开心！</gradient>"
淡入: 20
停留: 20
淡出: 20

# actionbar 设置
动作栏: ""

# DO NOT TOUCH VERSION NUMBER
version: 1.0
