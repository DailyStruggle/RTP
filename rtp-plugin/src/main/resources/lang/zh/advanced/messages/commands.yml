# --- RTP 消息（本语言） ---
# 本语言面向玩家和管理员的消息文本，按主题分组。
# 由英文消息自动生成的副本；请勿手动编辑（会被覆盖）。

# ###############################################################################
# 第 6 节: 扫描命令
# ###############################################################################
开始扫描: "&a[P0] 已为以下区域启动扫描任务: [scan_regions]"
重置扫描: "&7[P0] 已重置以下区域的扫描队列: [scan_regions]"
取消扫描: "&7[P0] 已取消以下区域的扫描任务: [scan_regions]"
暂停扫描: "#A020F0[P0] 已暂停以下区域的扫描任务: [scan_regions]"
恢复扫描: "#10A5F5[P0] 已恢复以下区域的扫描任务: [scan_regions]"
扫描进行中: "&c[P0] 以下区域已有扫描任务在进行: [scan_regions]"
扫描未运行: "&c[P0] 以下区域当前没有扫描任务: [scan_regions]"
# 占位符: [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
扫描状态: "[P0] &8» &7[scan_regions] &8| &7[scan_chunks]&8/&7[scan_totalChunks] &8| #7E9CC8[scan_cps]&7 cps &8| #7E9CC8[scan_landPercentage]%&7 陆地 &8| &7ETA #7E9CC8[scan_eta]"
# Boss-bar title shown to players with rtp.scan permission while a world scan is running.
# Set to empty string to disable the boss-bar.
# placeholder: [scan_regions], [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
scanBossBar: "Scanning [scan_regions]: [scan_chunks]/[scan_totalChunks] ([scan_landPercentage]% land) ETA [scan_eta]"

# ###############################################################################
# 第 7 节: 信息命令
# ###############################################################################
信息标题: "&2&l/rtp 信息"
信息_票据: "&7全局活动区块票据: #7E9CC8[tickets]"
信息_传送: "&7活动传送状态机: #7E9CC8[teleports]"
信息_MSPT: "&7当前插件 MSPT: #7E9CC8[mspt]"
信息_总加载次数: "&7累计加载区块数: #7E9CC8[loads]"
信息_按来源加载: "&7按来源加载: #7E9CC8[loadsByOrigin]"
信息_泄漏率: "&7当前区块泄漏率: #7E9CC8[leakRate]"
# --- 指标 健康状态块 ---
信息_队列深度: "&7区域队列中等待的玩家: #7E9CC8[queueDepth]"
信息_等待传送: "&7待处理传送管道: #7E9CC8[pendingTeleports]"
信息_平均管道毫秒: "&7平均管道延迟: #7E9CC8[avgPipelineMs] ms"
# 管道延迟百分位数。占位符: [pipelineMsP50] [pipelineMsP75]
# [pipelineMsP90] [pipelineMsP95] [pipelineMsP99] [pipelineSampleCount]。
infoPipelinePercentiles: "&7管道延迟(ms) P50/P75/P90/P95/P99: #7E9CC8[pipelineMsP50] / [pipelineMsP75] / [pipelineMsP90] / [pipelineMsP95] / [pipelineMsP99]&7 (n=[pipelineSampleCount])"
# 慢速传送审计（仅限即时/未排队传送）。占位符:
# [slowPipelineCount] [slowPipelineThresholdMs]。
infoSlowPipeline: "&7慢速传送 (> #7E9CC8[slowPipelineThresholdMs]&7 ms): #7E9CC8[slowPipelineCount]"
# 队列增长审计。占位符: [queueGrowthWarnCount] [queueGrowthWarnThreshold]。
infoQueueGrowth: "&7队列增长警告 (>= #7E9CC8[queueGrowthWarnThreshold]&7): #7E9CC8[queueGrowthWarnCount]"
信息_堆内存: "&7JVM 堆内存: #7E9CC8[heapUsedMb] / [heapMaxMb] MiB"
# /rtp info 中 Health pipeline 标记块的标题行。
信息_健康管道标题: "&7--- 健康状态: 管道 ---"
# 1m / 5m / 15m 窗口的 TPS 读数。占位符: [tps1m] [tps5m] [tps15m]。
信息_TPS: "&7TPS (1分/5分/15分): #7E9CC8[tps1m] / [tps5m] / [tps15m]"
# 实时服务器 MSPT 与 tick 预算使用率。占位符: [mspt] [tickBudgetUtilisation]。
信息_MSPT实时: "&7服务器 MSPT: #7E9CC8[mspt] ms (&7tick 预算: #7E9CC8[tickBudgetUtilisation]&7)"
# 已配置的玩家软上限与当前在线人数对比。占位符: [softCap] [playerCount]。
信息_软上限: "&7玩家数: #7E9CC8[playerCount] / [softCap]"
# 最近一次数据库往返延迟（毫秒）。占位符: [databaseLatencyMs]。
信息_数据库延迟毫秒: "&7数据库延迟: #7E9CC8[databaseLatencyMs] ms"
# 生成结果指标。
# 所有已记录生成尝试的成功/失败率。占位符:
# [genSuccessRate] [genFailureRate] [genOutcomeTotal]。
infoFailureRate: "&7生成成功率: #7E9CC8[genSuccessRate]&7 (失败 #7E9CC8[genFailureRate]&7, n=#7E9CC8[genOutcomeTotal]&7)"
# 最常见的单一拒绝原因及其在所有失败中的占比。占位符:
# [genTopRejectionCause] [genTopRejectionShare]。
infoTopRejectionCause: "&7主要拒绝原因: #7E9CC8[genTopRejectionCause]&7 (#7E9CC8[genTopRejectionShare]&7)"
# 按原因分类的拒绝明细。
# 占位符: [genFailureBreakdown] - 以逗号分隔的 cause=N 列表，最忙的排在前面。
infoFailureBreakdown: "&7按原因分类的拒绝: #7E9CC8[genFailureBreakdown]"
# Health colour-band thresholds. Used to colour the coloured-variant
# placeholders (e.g. [tps1mColoured]) green/yellow/red.
信息_TPS阈值_绿: 19.5
信息_TPS阈值_黄: 18.0
信息_MSPT阈值_绿: 30.0
信息_MSPT阈值_黄: 45.0
信息_缓存填充阈值_绿: 0.5
信息_缓存填充阈值_黄: 0.25
信息_网络快照陈旧阈值_黄: 5.0
# 介绍每个 Folia 区域表格的标题行（仅限 Folia 运行时）。
信息_Folia区域标题: "&7--- Folia 区域 ---"
# 单个 Folia 区域的行模板。占位符: [regionId] [tps1m]
# [mspt] [playerCount] [queueDepth] [tickBudgetUtilisation]。
信息_Folia区域: "#7E9CC8[regionId]&7: tps=#7E9CC8[tps1m]&7 mspt=#7E9CC8[mspt]&7 玩家=#7E9CC8[playerCount]&7 队列=#7E9CC8[queueDepth]&7 预算=#7E9CC8[tickBudgetUtilisation]"
信息_免责声明_标题: "&7--- 诊断说明 ---"
信息_免责声明: "&7诊断说明: 如果服务器孤儿区块总数超过本插件的累计加载数 ([loads])，则本插件并非内存泄漏的唯一原因。"
信息_世界标题: "#008080世界:"
信息_控制台_世界标题: "&7--- 世界 ---"
信息世界: "#21ADA8[world]"
信息_区域标题: "#63C5DA区域:"
信息_控制台_区域标题: "&7--- 区域 ---"
信息区域: "#52B2BF[region]"
# /rtp info biomes 显示的生物群系占用排行榜。
# 标题占位符: [biomeTotalSamples] [biomeDistinctCount]。
infoBiomeActivityHeader: "&8--- &3生物群系占用 &8(&3[biomeTotalSamples]&8 次采样, &3[biomeDistinctCount]&8 个生物群系) ---"
# 每个生物群系的行。占位符: [biomeRank] [biomeName] [biomeSamples] [biomePercent] [biomeBar]。
infoBiomeActivityRow: "&8 [biomeRank]. &3[biomeName] &8[biomeBar] &7[biomePercent]% &8([biomeSamples])"
# 尚未采样到任何占用数据时显示。
infoBiomeActivityEmpty: "&8--- &7暂无生物群系占用数据 &8---"

# sub-info listings
# placeholders: [world], [region], [requirePermission], [override], [shape], [worldBorderOverride], [cacheCap], [cached], [keptCache], [unkeptCache], [backlogCache], [backlogCacheCap]
世界信息:
  - "#21ADA8[world]:"
  - "#99EEBB  - 区域: [region]"
  - "#99EEBB  - 需要权限: [requirePermission]"
  - "#99EEBB  - 覆盖: [override]"

区域信息:
  - "#52B2BF[region]:"
  - "#58CCED  - 世界: [world]"
  - "#58CCED  - 形状: [shape]"
  - "#58CCED  - 需要权限: [requirePermission]"
  - "#58CCED  - 覆盖世界边界: [worldBorderOverride]"
  - "#58CCED  - 缓存上限: [cacheCap]"
  - "#58CCED  - 已保留缓存 (L1): [keptCache]"
  - "#58CCED  - 已释放缓存 (L2): [unkeptCache]"
  - "#58CCED  - 积压缓存 (L3): [backlogCache] / [backlogCacheCap]"
  - "#58CCED  - 已缓存: [cached]"
  - "#58CCED  - 已学习覆盖率: [memCoveragePct] (坏点: [memBadPct], [memBadCount] 格)"
  - "#58CCED  - 主要拒绝原因: [memTopCause] ([memTopCausePct])"

