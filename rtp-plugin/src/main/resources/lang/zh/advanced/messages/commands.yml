# 配置文件页面上每个键行的悬停文字。占位符:
#   [key], [value], [type] - 配置键名、当前值和声明类型。
configKeyHoverFormat: "&7click to edit &7[key] &7(type: [type])"
# 形状/vert 类型选择页面顶部的不可点击标题行。
# 占位符: [param] - shape 或 vert; [current] - 当前激活的类型名称。
configTypePickerTitle: "#5FB3B3&l⚙ pick [param] type &7(current: &7[current]&7)"
# 形状/vert 子参数页面顶部的不可点击标题行。
# 占位符: [param] - shape 或 vert; [type] - 激活的类型名称。
configSubParamPageTitle: "#5FB3B3&l⚙ [param] &7- &7[type] &7sub-parameters"
# 书本视图回退到旧版原始 YAML 聊天转储时发送的提示
#（此平台上没有可用的书本渲染器）。
configViewRawHint: "&7[P0] 书本视图不可用; 回退到原始转储。"
# 替代未设置配置值的占位符文字。
configValueUnsetPlaceholder: "&8(未设置)"
# Non-clickable header row separating the "Changeable" list from the "Pending"
# staging-cart list on a config-file page when the viewer has staged one or
# more uncommitted edits. No placeholders.
configPendingHeader: "&6&l-- pending changes --"
# Per-row label for a staged (pending) key=value entry on a config-file page.
# Clicking the row removes it from the cart. Placeholders: [key], [value].
configPendingRowFormat: "&9[key]&8 = &0[value]"
# 查看者悬停在配置文件页面上暂存（待处理）行时显示的悬停文字。无占位符。
configPendingRowHover: "点击取消暂存"
# 配置文件页面上「应用暂存更改」行的可点击标签。
# 运行组装好的 /rtp config <file> k1=v1 ... 命令并清空购物车。
configApplyRow: "&2&l[apply]"
# 配置文件页面上「放弃暂存更改」行的可点击标签。
# 清空购物车但不应用更改。
configDiscardRow: "&c&l[discard]"

# --- 地图/图表渲染 ---
# 当点击地图行但此服务器上地图渲染不可用时发送（例如 Lite 版本或未安装地图提供者）。
mapBindingMissing: "&c[P0] 此服务器上地图渲染不可用。"
# 当请求图表但未为该图表类型注册渲染器时发送。
mapResolverMissing: "&c[P0] 此请求未注册图表解析器。"
# 当解析器运行但底层数据源对请求目标不可用时发送。
# 占位符: [region] - 请求的区域名称（可能为空）。
mapUnavailable: "&e[P1] 图表数据当前不可用。"
# 当地图服务当前无法分配地图时发送（例如已达到每个查看者的上限）。
mapBusy: "&e[P1] 地图服务繁忙，请稍后再试。"
# 可点击的 /rtp info 菜单行的标签，渲染当前区域已知坏点的热力图。
# 当此服务器上地图渲染不可用时，该行被隐藏。
menuInfoBadPointsLabel: "#9D7CD8&l# 坏点地图"

# --- 多配置子菜单 ---
# 未注册特定类型标题键时使用的默认标题行。
# 占位符: [parserKind] - 原始多配置类型名称。
multiconfigHeaderDefault: "#5FB3B3&l[parserKind]"
# 区域多配置选择页面的标题行标签。无占位符。
multiconfigHeaderRegions: "#5FB3B3&l 区域"
# 世界多配置选择页面的标题行标签。无占位符。
multiconfigHeaderWorlds: "#5FB3B3&l 世界"
# 删除模式关闭时的切换行标签。无占位符。
multiconfigToggleRemoveModeOff: "&8[ ] 删除模式"
# 删除模式开启时的切换行标签。点击条目行将删除。
multiconfigToggleRemoveModeOn: "&c[x] 删除模式 (点击条目以删除)"
# 「+ 添加新...」条目的选择器行标签。无占位符。
multiconfigRowAdd: "&2+ 新增..."
# 添加行的悬停文字。占位符: [name] - 预填的默认名称。
multiconfigRowAddHover: "&7在铁砧提示中输入名称; 预填: &f[name]"
# 普通模式下条目行的悬停文字。占位符: [name]。
multiconfigRowEditHover: "&7编辑 &f[name]"
# 删除模式下条目行的悬停文字。占位符: [name]。
multiconfigRowRemoveHover: "&c删除 &f[name]"
# 确认删除页面标题行。占位符: [name]。
multiconfigConfirmTitle: "&c&l删除 [name]?"
# 确认删除页面「是」行标签。无占位符。
multiconfigConfirmYes: "&c&l[confirm delete]"
# 确认删除页面「取消」行标签。无占位符。
multiconfigConfirmNo: "&2&l[cancel]"
# 锁定（灰色）默认区域行的悬停文字。无占位符。
multiconfigLockRegionDefault: "&7默认区域不能被删除"
# 锁定（灰色）世界行的悬停文字。占位符: [name]。
multiconfigLockWorldLoaded: "&7世界 '[name]' 已在服务器上加载; 请先卸载再删除其配置"
# 成功 ADD 后的结果消息。占位符: [name]。
multiconfigResultAdded: "&a已添加 '[name]'。"
# 成功 REMOVE 后的结果消息。占位符: [name]。
multiconfigResultRemoved: "&a已删除 '[name]'。"
# ADD 失败时的结果消息。占位符: [name], [reason]。
multiconfigResultAddFailed: "&c无法添加 '[name]': [reason]"
