# RTP 网络模式（多服务器 / 多代理） 默认禁用；将 network.enabled: true 翻转后，此后端加入跨服网络。 REQ-RTP-NET-002（禁用时的行为一致性）：当 enabled: false 时， 此文件被读取和验证，但其他方面被忽略 - 不启动线程， 不创建数据库表，不打开传输。后端行为与不含网络模式的构建完全相同。

network:
  # When false this file is read and validated, then ignored - no threads, tables, or transport open.
  # @type: boolean
  # @default: false
  enabled: false
  # 稳定的后端标识符。当 enabled: true 时必填。无默认值 - 运营商必须提供；两个共享同一 serverId 的后端会互相覆盖心跳行。
  # @type: string
  # @default: "
  serverId: ""
  # 持有共享 HMAC 密钥的环境变量。当 enabled: true 且 transport.type: redis 时必填； SQL 绑定目前将该环境变量视为可选（DB 连接认证 + TLS 是安全边界）。
  # @type: string
  # @default: "RTP_NET_SECRET"
  secretEnv: "RTP_NET_SECRET"

# Backing store for cross-process state.
transport:
  # Transport backing store.
  # @type: enum
  # @options: ["auto", "plugin-message", "in-memory", "sql", "redis"]
  # @default: "auto"
  type: "auto"
  pluginMessage:
    # 代理插件消息通道。除非代理配置了非标准通道名称，否则保持默认值。
    # @type: string
    # @default: "bungeecord:main"
    channel: "bungeecord:main"
  redis:
    # 当 type: redis 时必填。网络中所有后端和代理共享的 Redis 实例的主机名或 IP。
    # @type: string
    # @default: "localhost"
    host: "localhost"
    # 默认 Redis 端口。如果部署使用非标准端口，请覆盖此值。
    # @type: integer
    # @default: 6379
    port: 6379
    # 可选。未认证 Redis（开发/测试）时留空或省略； 配置了 Redis ACL 或 requirepass 时设置。
    # @type: string
    # @default: "
    password: ""

# Backend heartbeat / peer-staleness cadence (shared by every transport tier).
heartbeat:
  # How often this backend publishes its state row.
  # @type: integer
  # @default: 1000
  intervalMs: 1000
  # 对等节点的最后可见状态在被视为未知之前保持可信的时长。 在插件消息层，这也是快照陈旧窗口：变为未知的对等节点仍被接受为目标， 只是不再被建议。保持远高于 intervalMs，以免单次心跳丢失导致对等节点状态抖动。
  # @type: integer
  # @default: 5000
  staleAfterMs: 5000

# 后端路由器。当 routing.mode 为 local（默认值）时， /rtp 仅运行本地管道，此文件其余部分仅供参考。 切换为 auto 可将此后端加入跨服等待队列 （当本地后端有请求的区域时仍优先本地）。
routing:
  # local  - 永不加入跨服等待队列（默认；零行为变化）。 auto   - 当本地后端可以服务该区域时优先本地；仅当本地无法服务时加入等待队列。 always - 始终加入等待队列（开发者/验收测试模式；不建议用于生产环境）。
  # @type: enum
  # @options: ["local", "auto", "always"]
  # @default: "local"
  mode: "local"
  # 大厅模式。为 true 时，此后端成为纯调度节点： - 心跳发布空的 regions 集合和 acceptingRequests:false， 使对等节点永不将此后端选为跨服目标。 - 裸 /rtp（无 region= 参数）自动路由到快照中 regionKeptCounts 最大的对等节点+区域。 - 当没有对等节点发布任何区域时，裸 /rtp 以 networkRegionUnavailable 消息拒绝。 默认 false 保持原有行为。
  # @type: boolean
  # @default: false
  lobbyMode: false

# 队列深度；小队列静默，大队列急剧上升。
queue:
  # 本地缓冲注册的最大数量，超过后背压将以 QUEUE_FULL 拒绝新的 /rtp 调用。
  # @type: integer
  # @default: 50
  maxDepth: 50
  # 后端脏写刷新节奏（毫秒）。越低端到端延迟越低，越高往返传输次数越少。默认 250ms。
  # @type: integer
  # @default: 250
  flushIntervalMs: 250
  # 后端状态缓存轮询节奏（毫秒）。驱动后端读取 rtp:net:wq:status:<pid> 刷新每玩家进度的频率。
  # @type: integer
  # @default: 1000
  pollIntervalMs: 1000
  # 可选的信封 HASH 被动老化。0 禁用（终态转换仍会显式 DEL 信封 HASH）； 设置正值可在卡住的信封上显示运营商可见的 TTL。
  # @type: integer
  # @default: 0
  entryTtlMs: 0
  # 跨服 /rtp 注册速率限制（令牌桶）。防止失控客户端的运营商安全网。
  # @type: number
  # @default: 5
  crossServerRequestsPerSecond: 5
  # Cross-server /rtp enrolment rate limit: burst size.
  # @type: number
  # @default: 10
  crossServerRequestsBurst: 10
  # 代理端 BLPOP 工作线程数（rtp-proxy-velocity）。 仅当观察到代理使单个工作线程饱和时才增加；调度器和传输池才是真正的瓶颈。
  # @type: integer
  # @default: 1
  workerThreads: 1

# 预留令牌生命周期（REQ-RTP-NET-011）。
reservation:
  # 代理端 TTL 回收器节奏（毫秒）。回收器清除过期令牌并触发 ReleaseSink.onRelease(tokenId, TTL_EXPIRED)，使同位后端可将坐标归还给 networkKeptLocations。
  # @type: integer
  # @default: 30000
  reapIntervalMs: 30000
  # 每个令牌的 TTL（毫秒）。已认领但未消费且超过此时长的预留被视为已放弃并释放。
  # @type: integer
  # @default: 60000
  ttlMs: 60000

# 区域冲突策略。 仅提供 warn；rename-local 和 reject-startup 是已记录的后续功能。 未知值静默降级为 warn。
regionCollision:
  # Collision policy applied at startup.
  # @type: enum
  # @options: ["warn", "rename-local", "reject-startup"]
  # @default: "warn"
  policy: "warn"

# Optional per-destination policy overlay (matched by serverId); leave commented for the common case.
#servers:
#  example-backend:
#    # Permission required to target this destination (empty = none).
#    # @type: string
#    # @default: "
#    permission: "
#    # Label shown in menus / suggestions (default: serverId).
#    # @type: string
#    # @default: "
#    display-name: "Example"
#    # Hide from tab-completion when it has no servable region.
#    # @type: boolean
#    # @default: false
#    hide-when-unavailable: false
#    # Allow targeting it even when it reports no servable region.
#    # @type: boolean
#    # @default: true
#    allow-when-unavailable: true
# Load balancer scoring table.
loadBalancer:
  # 内置区域稀缺性项的权重。此处为 0，因为下方的显式 region 项已拥有 kept-region 信号。
  # @type: number
  # @default: 0
  regionScarcityWeight: 0
  # 评分项，每个指标一项。每项包含 input、weight 和 curve（类型 + 参数）。 默认值用于限制过载的后端。
  terms:
    # Tick 压力；sigmoid 拐点在 0.6。
    mspt:
      # Metric input.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "mspt"
      input: "mspt"
      # Term weight.
      # @type: number
      # @default: 1.0
      weight: 1.0
      curve:
        # Curve type.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "sigmoid"
        type: "sigmoid"
        # Steepness.
        # @type: number
        # @range: [0.1, 20]
        # @default: 8.0
        k: 8.0
        # Midpoint.
        # @type: number
        # @range: [0, 1]
        # @default: 0.6
        x0: 0.6
    # 队列深度；小队列静默，大队列急剧上升。
    queue:
      # Metric input.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "queueDepth"
      input: "queueDepth"
      # Term weight.
      # @type: number
      # @default: 1.0
      weight: 1.0
      curve:
        # Curve type.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "exponential"
        type: "exponential"
        # Steepness.
        # @type: number
        # @range: [0.1, 20]
        # @default: 3.0
        k: 3.0
    # 堆内存门控；在已用内存 >= 85% 时触发。
    heap:
      # Metric input.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "heapUsed"
      input: "heapUsed"
      # Term weight.
      # @type: number
      # @default: 5.0
      weight: 5.0
      curve:
        # Curve type.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "step"
        type: "step"
        # Step threshold.
        # @type: number
        # @range: [0, 1]
        # @default: 0.85
        threshold: 0.85
    # 区域门控；当 kept 池 >= 95% 满时触发。
    region:
      # Metric input.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "keptRegion"
      input: "keptRegion"
      # Term weight.
      # @type: number
      # @default: 5.0
      weight: 5.0
      curve:
        # Curve type.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "step"
        type: "step"
        # Step threshold.
        # @type: number
        # @range: [0, 1]
        # @default: 0.95
        threshold: 0.95
    # kept 数量上的温和平局打破器。
    kept:
      # Metric input.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "keptCount"
      input: "keptCount"
      # Term weight.
      # @type: number
      # @default: 0.25
      weight: 0.25
      curve:
        # Curve type.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "logarithmic"
        type: "logarithmic"
        # Steepness.
        # @type: number
        # @range: [0.1, 20]
        # @default: 9.0
        k: 9.0

version: 1.1
