# --- RTP 集成设置 ---
# 如果传送点落在指定插件的领地/区域内，每个开关都会重新随机选择目的地（仅当安装了该插件时生效）。
# 如果落点位于 Factions 领地内，则重新随机选择位置。
# @type: boolean
# @default: false
rerollFactions: false

# 如果落点位于 GriefDefender 领地内，则重新随机选择位置。
# @type: boolean
# @default: false
rerollGriefDefender: false

# 如果落点位于 GriefPrevention 领地内，则重新随机选择位置。
# @type: boolean
# @default: false
rerollGriefPrevention: false

# 如果落点位于 HuskTowns 领地内，则重新随机选择位置。
# @type: boolean
# @default: false
rerollHuskTowns: false

# 如果落点位于 Lands 领地内，则重新随机选择位置。
# @type: boolean
# @default: false
rerollLands: false

# 如果落点位于 RedProtect 区域内，则重新随机选择位置。
# @type: boolean
# @default: false
rerollRedProtect: false

# 如果落点位于 Towny Advanced 领地内，则重新随机选择位置。
# @type: boolean
# @default: false
rerollTownyAdvanced: false

# 如果落点位于 WorldGuard 区域内，则重新随机选择位置。
# @type: boolean
# @default: false
rerollWorldGuard: false

# 请勿修改版本号
version: 1.0
