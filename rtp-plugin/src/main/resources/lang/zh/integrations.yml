# Reroll the location if it lands inside a SaberFactions claim.
# @type: boolean
# @default: false
rerollSaberFactions: false

# 如果位置落在通过 FactionsBridge API 报告的 Factions 领地内则重新抽取。
# FactionsBridge 将多个 Factions 分支（FactionsUUID、SaberFactions、FactionsX、KingdomsX 等）
# 统一到一个 API；安装了 FactionsBridge 插件时启用此选项。
# @type: boolean
# @default: false
rerollFactionsBridge: false

# 如果落点位于 GriefDefender 领地内，则重新随机选择位置。
# @type: boolean
# @default: false
rerollGriefDefender: false

# 如果落点位于 GriefPrevention 领地内，则重新随机选择位置。
# @type: boolean
# @default: false
rerollGriefPrevention: false

# 如果落点位于 Lands 领地内，则重新随机选择位置。
# @type: boolean
# @default: false
rerollLands: false

# 如果落点位于 RedProtect 区域内，则重新随机选择位置。
# @type: boolean
# @default: false
rerollRedProtect: false

# 如果位置落在 Residence 领地内则重新抽取。
# @type: boolean
# @default: false
rerollResidence: false

# 如果位置落在 CrashClaim 领地内则重新抽取。
# @type: boolean
# @default: false
rerollCrashClaim: false

# 如果位置落在 HuskClaims 领地内则重新抽取。
# @type: boolean
# @default: false
rerollHuskClaims: false

# 如果位置落在 KingdomsX 已认领土地内则重新抽取。
# @type: boolean
# @default: false
rerollKingdomsX: false

# 如果落点位于 Towny Advanced 领地内，则重新随机选择位置。
# @type: boolean
# @default: false
rerollTownyAdvanced: false

# 如果落点位于 WorldGuard 区域内，则重新随机选择位置。
# @type: boolean
# @default: false
rerollWorldGuard: false

