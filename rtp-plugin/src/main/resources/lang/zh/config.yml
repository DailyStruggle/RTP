# --- RTP 主配置 ---
# 玩家可见消息所使用的语言。
# 默认值: "en" (内置于 messages.yml 的英文基线)。
# 其他翻译位于 lang/<locale>/messages.yml，并作为一层覆盖在英文基线之上加载。
# 缺失的键会静默回退为英文。未知的语言代码会触发警告并同样回退为英文。
# 参见 ADR-020 与 REQ-RTP-F-013。
language: "en"

# 传送延迟（秒）
# 玩家在实际执行传送之前必须等待的时间。
# 有时会让服务器有时间预加载目标区块。
传送延迟: 2

# 移动取消（方块）
# 若玩家在延迟期间移动超过此距离，传送将被取消。设为 -1 可禁用。
取消距离: 2

# 传送之间的等待时间（秒）
# 玩家两次成功使用 RTP 之间必须等待的时间。
传送冷却: 300

# 传送后命令
# 一次成功传送之后要执行的命令列表。
# 占位符 [player] 表示玩家名。
控制台命令:
  - "say [player] 刚刚被随机传送了！"
玩家命令:
  - ""

# --- 数据库设置 ---
# 缓存的位置和玩家数据存储于何处。
数据库:
  # 可用类型: yaml, sqlite, mysql, postgresql
  # - yaml/sqlite: 本地文件（无需额外配置）
  # - mysql/postgresql: 远程数据库（需要下方的凭据）
  type: "sqlite"

  # 网络数据库凭据（本地类型会忽略）
  host: "127.0.0.1"
  port: 3306
  name: "rtp"
  username: "root"
  password: "password"

# --- 网络与同步 ---
# Redis 用于在多台服务器之间同步缓存的位置。
网络:
  redis:
    enabled: false
    host: "127.0.0.1"
    port: 6379
    password: ""

# 请勿修改版本号
version: 3.0
