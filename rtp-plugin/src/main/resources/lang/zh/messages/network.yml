# --- RTP 消息（本语言） ---
# 本语言面向玩家和管理员的消息文本，按主题分组。
# 由英文消息自动生成的副本；请勿手动编辑（会被覆盖）。

# --- 跨服务器网络模式消息 ---
# 请求已被接受进入跨服等待队列并等待后端认领时发送。
# 占位符: [position] - 0 索引位置；传输未返回位置时可能为空。
networkQueued: "&7[P0] 正在排队等待跨服目的地 (位置 [position])..."
# 玩家在已持有非终态跨服注册时运行 /rtp* 时发送。
# 占位符: [position] - 已知时的 FIFO 位置；代理尚未分配时为空。
alreadyQueued: "&c你已经在跨服队列中等待 (位置 [position])。请稍候。"
# 跨服等待列表条目超过配置的 TTL 被回收时发送。无占位符。
networkTimedOut: "&c[P0] 等待后端时跨服传送已超时。"
# 跨服等待列表注册因共享等待列表已达到最大大小而被拒绝时发送。无占位符。
waitlistFull: "&c[P0] 跨服队列已满；请稍后再试。"
# 队列将请求移交给代理路由器且后端选择正在进行时发送。
networkRouting: "&7[P0] 正在路由到后端..."
# 后端已为该玩家预留坐标且代理即将发起跨服跳转时发送。
# 占位符: [server] - 目标后端的 serverId。
networkReserved: "&a[P0] 已在 [server] 预留坐标。正在传送..."
# 代理正在跳转中时发送。占位符: [server] - 目标服务器。
networkTransferring: "&a[P0] 正在传送到 [server]..."
# 跨服路径放弃并回退到本地服务器时发送。
# 占位符: [reason] - 回退原因。
networkFallback: "&e[P0] 跨服不可用 ([reason])；回退到本地。"
# 跨服请求失败且无法回退时发送。
# 占位符: [reason] - 失败原因。
networkFailed: "&c[P0] 跨服传送失败：[reason]。"
# 玩家请求特定区域但网络中没有后端当前提供该区域时发送。
# 占位符: [region] - 请求的区域名称。
networkRegionUnavailable: "&c[P0] 当前没有后端在提供区域 '[region]'。"
# 请求的区域名称解析到两个或多个后端且策略无法选择时发送。占位符: [region]。
networkRegionAmbiguous: "&c[P0] 区域 '[region]' 在多个后端间不明确；请指定一个服务器。"

# DO NOT TOUCH VERSION NUMBER
version: 1.0
