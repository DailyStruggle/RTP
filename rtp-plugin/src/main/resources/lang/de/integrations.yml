rerollHuskTowns: false

# Würfelt den Standort neu aus, wenn er innerhalb eines Lands-Claims landet.
# @type: boolean
# @default: false
rerollLands: false

# Würfelt den Standort neu aus, wenn er innerhalb einer RedProtect-Region landet.
# @type: boolean
# @default: false
rerollRedProtect: false

# Würfelt den Standort neu aus, wenn er innerhalb eines Towny Advanced-Claims landet.
# @type: boolean
# @default: false
rerollTownyAdvanced: false

# Würfelt den Standort neu aus, wenn er innerhalb einer WorldGuard-Region landet.
