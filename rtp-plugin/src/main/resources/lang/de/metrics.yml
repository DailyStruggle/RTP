# --- RTP-Metrik-Einstellungen ---
# Reine Reporting-Schalter für die Phase-M2-Metrik-SPI. Drossel-/Tuning-
# Schalter bleiben in performance.yml.
# Dokumentation: docs/dev/METRICS_PLAN.md > Folia Aggregation
# Füllt MetricsSnapshot.foliaRegions() auf Folia mit Details pro Region.
# Keine Wirkung auf Paper / Bukkit / Fabric (Single-Region-Runtimes geben
# stets eine leere Liste zurück, was für diese Plattformen korrekt ist).
# @type: boolean
# @default: true
foliaIncludeRegions: true

# Aggregationsstrategie, um Pro-Region-Stichproben in die skalaren
# tps{1,5,15}m-Felder von MetricsSnapshot auf Folia zusammenzufassen.
# Zulässige Werte: mean | max
# @type: enum
# @default: mean
foliaAggregationTps: "mean"

# Aggregationsstrategie, um Pro-Region-Stichproben in das skalare
# mspt-Feld von MetricsSnapshot auf Folia zusammenzufassen.
# Zulässige Werte: mean | max
# @type: enum
# @default: max
foliaAggregationMspt: "max"

# Aggregationsstrategie, um Pro-Region-Stichproben in das skalare
# tickBudgetUtilisation-Feld von MetricsSnapshot auf Folia zusammenzufassen.
# Zulässige Werte: mean | max
# @type: enum
# @default: max
foliaAggregationTickBudget: "max"

# DO NOT TOUCH VERSION NUMBER
version: 1.0
