# --- RTP Sicherheitskonfiguration ---
# Dokumentation: plugins/RTP/docs/admin/configuration/SAFETY.md
# Sekunden der Unverwundbarkeit nach Abschluss eines Teleports.
# 0 deaktiviert das Unverwundbarkeitsfenster nach dem Teleport.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 5
invulnerabilityTime: 5

# Blockradius rund um den Landepunkt, der auf Gefahren geprüft wird.
# 0 prüft nur den Landeblock und die unmittelbare Vertikale.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 0
safetyRadius: 0

# Maximale Wiederholungen des Stale-Chunk-Schutzes, bevor der Versuch fehlschlägt.
# @type: integer
# @range: [0, null]
# @default: 2
staleChunkRetryLimit: 2

# Den Off-Thread-Anvil-NBT-Vorfilter verwenden, um Kandidaten zu verwerfen,
# ohne ihre Chunks zu laden.
# @type: boolean
# @default: true
anvilPrefilterEnabled: true

# Radius der Notfall-Landeplattform am Zielort.
# -1 deaktiviert die Plattform vollständig.
# @type: integer
# @range: [-1, null]
# @unit: blocks
# @default: -1
platformRadius: -1

# Tiefe (vertikale Dicke) der Notfallplattform.
# @type: integer
# @range: [1, null]
# @unit: blocks
# @default: 1
platformDepth: 1

# Über der Notfallplattform freigeräumte Lufthöhe.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 2
platformAirHeight: 2

# Material der Notfall-Landeplattform.
# @type: material
# @source: material
# @default: GLASS
platformMaterial: "GLASS"

# Optionaler Timeout in Sekunden, nach dem der Fußabdruck der Notfall-Landeplattform
# wieder auf die Blöcke zurückgesetzt wird, die vorher dort waren.
# -1 deaktiviert die Wiederherstellung (die Plattform ist dauerhaft, das bisherige Verhalten).
# 0 stellt wieder her, sobald der Plattform-Chunk erneut geladen ist; ein positiver Wert
# stellt nach so vielen Sekunden geladener Zeit wieder her. Der Countdown läuft nur weiter,
# während der Plattform-Chunk geladen ist (er pausiert, solange der Bereich entladen ist),
# und ausstehende Wiederherstellungen überstehen einen Server-Neustart.
# @type: integer
# @range: [-1, null]
# @unit: seconds
# @default: -1
platformRestoreSeconds: -1
