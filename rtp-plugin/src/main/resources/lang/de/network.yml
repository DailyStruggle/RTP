# RTP Netzwerkmodus (Multi-Server / Multi-Proxy)
#
# Phase 2e von MULTI_SERVER_PLAN.md. Standardmäßig deaktiviert; das Umstellen von
# `network.enabled: true` nimmt dieses Backend in das serverübergreifende Netzwerk auf.
# Siehe rtp-proxy-ADR-002 für das vollständige Schema und rtp-proxy-ADR-011 für die
# hier dokumentierte DB-als-Bus-Bindung (`transport.type: sql`).
#
# REQ-RTP-NET-002 (Verhaltensgleichheit bei Deaktivierung): wenn `enabled: false`,
# wird diese Datei gelesen, validiert und ansonsten ignoriert - es starten keine Threads,
# es werden keine Datenbanktabellen erstellt, es öffnet kein Transport. Das Backend verhält
# sich byte-identisch zu einem Build vor Phase 2.
network:
  enabled: false
  schemaVersion: 1
  # Stabile Backend-Identität. Erforderlich, wenn `enabled: true`. Kein Standard - der
  # Betreiber MUSS eine angeben; zwei Backends mit derselben serverId überschreiben
  # gegenseitig ihre Heartbeat-Zeile.
  serverId: ""
  # Backends nehmen niemals eine Proxy-Rolle an. `role: backend` ist der einzige gültige
  # Wert auf dieser Seite; das Feld existiert nur aus Symmetrie zu Proxy-
  # Adaptern (die `role: auto | proxy` berücksichtigen).
  role: "backend"
  # Umgebungsvariable mit dem gemeinsamen HMAC-Secret. Erforderlich, wenn
  # `enabled: true` UND `transport.type: redis`; die SQL-Bindung behandelt
  # die Umgebungsvariable derzeit als optional (DB-Verbindungs-Authentifizierung + TLS bilden die
  # Sicherheitsgrenze - rtp-proxy-ADR-011 Q1).
  secretEnv: "RTP_NET_SECRET"

transport:
  # Speicher-Backend für prozessübergreifenden Zustand.
  # - `in-memory`: nur für die Entwicklung; nichts verlässt die JVM (REQ-RTP-NET-002
  #   Gleichheit per Konstruktion).
  # - `sql`: DB-als-Bus (rtp-proxy-ADR-011). Verwendet den vorhandenen RTP-Datenbank-
  #   Accessor-Pool aus `database.yml` wieder. Rückfalloption, wenn Redis nicht verfügbar ist.
  # - `redis`: Jedis-gestützte Heartbeats + Pub/Sub-Verteilung (rtp-proxy-ADR-005).
  #   Phase 2e-Redis A1: Heartbeats und Snapshot funktionieren; der atomare Claim (genutzt für
  #   backend-übergreifende Reservierungs-Tokens) kommt in A2. Projektziel ist
  #   redis-first; stelle `type: redis` um, sobald du eine von allen Backends und Proxys
  #   gemeinsam genutzte Redis-Instanz hast.
  type: "sql"
  redis:
    # Erforderlich, wenn `type: redis`. Hostname oder IP der Redis-Instanz,
    # die von jedem Backend und Proxy im Netzwerk gemeinsam genutzt wird.
    host: "localhost"
    # Standard-Redis-Port. Überschreiben, falls dein Deployment einen abweichenden verwendet.
    port: 6379
    # Optional. Für unauthentifiziertes Redis (Dev/Test) leer lassen / weglassen;
    # setzen, wenn Redis-ACL oder `requirepass` konfiguriert ist.
    password: ""

heartbeat:
  # Wie oft dieses Backend seine Zustandszeile veröffentlicht. 1000ms ist der Standard,
  # der von Publishern auf Proxy- und Backend-Seite verwendet wird; die Poll-Schleife
  # des Proxys muss Zeilen innerhalb von `staleAfterMs` sehen, um sie als aktiv zu werten.
  intervalMs: 1000
  staleAfterMs: 5000
# Router auf Backend-Seite (L6 / rtp-proxy-ADR-014). Wenn `routing.mode`
# `local` ist (Standard), führt `/rtp` nur die lokale Pipeline aus und der Rest
# dieser Datei ist nur informativ. Auf `auto` umstellen, um dieses Backend in
# die serverübergreifende Warteschlange aufzunehmen (weiterhin lokal zuerst, wenn das lokale
# Backend die angeforderte Region verfügbar hat).
routing:
  # `local`  - niemals in die serverübergreifende Warteschlange eintragen (D2-Standard;
  #            keine Verhaltensänderung für Server vor L6).
  # `auto`   - lokal bevorzugen, wenn dieses Backend die Region bedienen kann; nur dann
  #            in die Warteschlange eintragen, wenn lokal nicht bedient werden kann.
  # `always` - immer in die Warteschlange eintragen (Entwickler- / Abnahme-
  #            Testmodus; nicht für die Produktion empfohlen).
  mode: "local"
  # Lobby-Modus (L6 Slice I). Wenn true, wird dieses Backend zu einem reinen Dispatch-
  # Knoten:
  #  - Heartbeats veröffentlichen eine leere `regions`-Menge und `acceptingRequests:false`,
  #    damit Peers dieses Backend nie als serverübergreifendes Ziel auswählen.
  #  - Ein bloßes `/rtp` (ohne `region=`-Argument) leitet automatisch zum Peer +
  #    der Region mit dem größten `regionKeptCounts`-Wert im Snapshot weiter
  #    ("most-kept"-Politik, v1). Explizites `rtp region=<server>:<region>`
  #    funktioniert weiterhin wie in Slice H2.
  #  - Wenn kein Peer eine Region anbietet, lehnt bloßes `/rtp` mit der
  #    lokalisierten `networkRegionUnavailable`-Meldung ab, statt stillschweigend
  #    in die (leere) lokale Pipeline durchzufallen.
  # Standard false bewahrt das Verhalten vor Slice I.
  lobbyMode: false
# Serverübergreifende Warteschlange (L6 / rtp-proxy-ADR-014). Alle Schlüssel hier werden
# ignoriert, wenn `network.enabled: false` oder `routing.mode: local`.
queue:
  # Maximale Anzahl lokal gepufferter Eintragungen, bevor der Gegendruck
  # neue `/rtp`-Aufrufe mit `RoutingDecision.FallbackReason.QUEUE_FULL` ablehnt.
  maxDepth: 50
  # Flush-Takt für Dirty-Writes des Backends (ms). Niedriger = geringere Ende-zu-Ende-
  # Latenz, höher = weniger Roundtrips zum Transport. 250ms ist der
  # Standard aus PROPOSAL Abschnitt 7.
  flushIntervalMs: 250
  # Poll-Takt des Backend-Status-Caches (ms). Bestimmt, wie oft das Backend
  # `rtp:net:wq:status:<pid>` liest, um den Fortschritt je Spieler zu aktualisieren.
  pollIntervalMs: 1000
  # Optionales passives Altern der Envelope-HASHes. `0` deaktiviert (terminale
  # Übergänge löschen den Envelope-HASH gemäß D3 weiterhin explizit per DEL); auf einen
  # positiven Wert setzen, wenn du eine betreiber-sichtbare TTL für hängende Envelopes willst.
  entryTtlMs: 0
  # Ratenbegrenzung für serverübergreifende `/rtp`-Eintragungen (Token-Bucket). Betreiber-
  # Sicherheitsnetz gegen außer Kontrolle geratene Clients.
  crossServerRequestsPerSecond: 5
  crossServerRequestsBurst: 10
  # Anzahl der BLPOP-Worker auf Proxy-Seite (rtp-proxy-velocity). Nur erhöhen, wenn
  # beobachtet wird, dass der Proxy einen einzelnen Worker auslastet; der Dispatcher und
  # der Transport-Pool sind die eigentlichen Engpässe.
  workerThreads: 1
# Lebenszyklus der Reservierungs-Tokens (L6 / REQ-RTP-NET-011).
reservation:
  # Takt des TTL-Reapers auf Proxy-Seite (ms). Der Reaper räumt abgelaufene Tokens auf
  # und löst `ReleaseSink.onRelease(tokenId, TTL_EXPIRED)` aus, damit am selben Ort liegende
  # Backends die Koordinate an `networkKeptLocations` zurückgeben können.
  reapIntervalMs: 30000
  # TTL je Token (ms). Eine beanspruchte, aber nicht verbrauchte Reservierung, die älter
  # als dieser Wert ist, gilt als verwaist und wird freigegeben.
  ttlMs: 60000
# Politik bei Regions-Kollisionen (L6 / rtp-proxy-ADR-014 Abschnitt Region Collisions).
# In L6 wird nur `warn` ausgeliefert; `rename-local` und `reject-startup` sind
# dokumentierte Folgeaufgaben. Unbekannte Werte fallen stillschweigend auf `warn` zurück.
regionCollision:
  policy: "warn"
# Load balancer scoring table (rtp-proxy-ADR-004 *Region-Pair Scoring*).
# Consumed by `PeerRegionRegistry.pickMostKept()` on lobby/backend JVMs to
# drive blank-`/rtp` region selection (and, when `routing.mode: auto`, the
# fallback region pick for cross-server enrolment). The SAME schema is
# parsed by the Velocity proxy's `network-proxy.yml`, so curves/weights
# tuned for one side can be copy-pasted to the other.
#
# Per-`(serverId, regionKey)` pair score:
#   score(b, r) = ( Sigma_i  weight_i * curve_i( normalize_i( metric_i(b) ) ) ) / backendWeight(b)
#               + regionScarcityWeight * exponential_k5( 1 - keptCount(b, r) / refCount )
# Lowest score wins; ties break by serverId then regionKey ascending. The
# synthesized region-scarcity term sharply prioritises regions whose kept
# pool is shallow (a region 90% empty contributes ~0.85, one 50% empty
# only ~0.07) - this is the curve-driven replacement for the legacy
# "most-kept wins" v1 policy.
#
# Two configuration shapes are accepted; the lobby reads whichever is present.
#
# 1) Sub-configuration `terms` block (preferred). Each term is a map keyed
#    by a free-form label, with `input`, `weight`, and a nested `curve`
#    sub-map. Supported inputs: mspt, queueDepth, heapUsed, heapFree,
#    playerCount, keptCount, tps, keptRegion. Supported curves: linear,
#    exponential (k), logarithmic (k), sigmoid (k, x0), step (threshold),
#    power (p). Parameter bounds: k in [0.1, 20], p in [0.1, 8],
#    x0/threshold in [0, 1].
#
# 2) Legacy flat weights (msptWeight, queueDepthWeight, heapWeight,
#    playerCountWeight) are synthesized to linear terms for back-compat.
#
# `regionScarcityWeight` (default 1.0) controls the synthesized
# region-scarcity term. Set to 0 to disable it (e.g. when you add an
# explicit `keptRegion` input term and want full control). Adding any
# explicit `keptRegion` term suppresses the synthesized one automatically.
#
# The block below ships ACTIVE so operator support is "edit values" not
# "first uncomment, then edit". The defaults below mirror the prior
# "most-kept wins" v1 behaviour with a smooth fall-off (synthesized
# region-scarcity term disabled because the explicit `region` term owns
# the signal), but with `step` curves on `heapUsed` and `keptRegion` so
# overloaded backends are silently skipped without operator action.
#
# Five terms, one per metric (no doubled constraints). The curve carries
# the soft-vs-hard expression: `step` near the top of its range acts as a
# gate that only fires when the metric is critical, but the candidate can
# still win if every alternative is even worse (graceful degradation).
#   - mspt:   sigmoid x0=0.6 (production knee; fires when tick is under pressure)
#   - queue:  exponential (small queues silent, large ones explode)
#   - heap:   step at heapUsed >= 0.85, weight 5.0 (effective gate)
#   - region: step at keptRegion >= 0.95, weight 5.0 (effective gate)
#   - kept:   logarithmic, weight 0.25 (gentle tie-breaker)
# regionScarcityWeight is 0 because the explicit `region` term below owns
# the kept-region signal.
loadBalancer:
  regionScarcityWeight: 0
  terms:
    mspt:
      input: "mspt"
      weight: 1.0
      curve:
        type: "sigmoid"
        k: 8.0
        x0: 0.6
        queue:
          input: "queueDepth"
          weight: 1.0
          curve:
            type: "exponential"
            k: 3.0
            heap:
              input: "heapUsed"
              weight: 5.0
              curve:
                type: "step"
                threshold: 0.85
                region:
                  input: "keptRegion"
                  weight: 5.0
                  curve:
                    type: "step"
                    threshold: 0.95
                    kept:
                      input: "keptCount"
                      weight: 0.25
                      curve:
                        type: "logarithmic"
                        k: 9.0
