# --- RTP Leistungseinstellungen ---
# Dokumentation: https://github.com/DailyStruggle/RTP/blob/master/docs/admin/PERFORMANCE.md
# Maximale Suchversuche pro /rtp-Aufruf, bevor aufgegeben wird.
# @type: integer
# @range: [1, null]
# @default: 32
maxAttempts: 32

# Chunk-Radius, der während der Auswahl rund um einen Kandidatenort geladen wird.
# 0 lädt nur den Kandidaten-Chunk.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
viewDistanceSelect: 0

# Chunk-Radius, der unmittelbar vor dem Teleport rund um den endgültigen Ort
# geladen wird. 0 lädt nur den Ziel-Chunk.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
viewDistanceTeleport: 0

# Ticks zwischen Hintergrund-Cache-Zyklen (Regions-Vorbefüllung, Warteschlangen-Auffüllung).
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
period: 20

# Maximale Millisekunden pro Tick für synchrone Aufgaben.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
syncAllottedTime: 50

# Maximale Millisekunden pro Tick für asynchrone Aufgaben.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
asyncAllottedTime: 50

# Mindest-Server-TPS, die zum Fortführen der Hintergrund-Warteschlange nötig ist.
# Hintergrundarbeit pausiert, wenn die TPS unter diesen Schwellenwert fallen.
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
minTPS: 19.0

# Den Regions-Cache unmittelbar nach einem erfolgreichen Teleport auffüllen.
# @type: boolean
# @default: false
postTeleportQueueing: false

# Synchrones Chunk-Laden verwenden. NICHT EMPFOHLEN. Verletzt den Geist von S-005
# auf Folia und blockiert den Haupt-Thread auf Paper/Spigot.
# @type: boolean
# @default: false
syncLoading: false

# Berechtigungsknoten bei jedem Ereignis neu auswerten, statt sie zu cachen.
# @type: boolean
# @default: false
onEventParsing: false

# Effekt-Berechtigungsknoten beim Start auswerten.
# @type: boolean
# @default: true
effectParsing: true

# Zuvor gefundene biom-passende Orte aus dem Cache wiederverwenden.
# @type: boolean
# @default: true
biomeRecall: true

# Wenn gesetzt, biom-gefilterte Anfragen nur aus dem Cache bedienen (niemals
# neue Biom-Suchen erzeugen). Erfordert biomeRecall.
# @type: boolean
# @default: false
biomeRecallForced: false

# In allen geladenen Chunks nach sicheren Landeplätzen suchen (opportunistische
# Vorbefüllung).
# @type: boolean
# @default: false
checkOnChunkLoads: false

# Hintergrund-Datenerfassung für Besucher-Analysen aktivieren.
# @type: boolean
# @default: false
visitorEnabled: true

# Reservierten Cache für Beitritts-Teleports vorhalten (rtp.onevent.firstjoin / rtp.onevent.join). Größe richtet sich nach verbleibenden freien Spieler-Slots. Siehe
# @type: boolean
# @default: false
loginCacheEnabled: false

# Harte Obergrenze für den Beitritts-Cache. 0 = automatisch (max-players des Servers beim Start).
# @type: integer
# @range: [0, null]
# @default: 0
loginCacheCap: 0

# Wahrscheinlichkeit, einen nicht generierten Chunk pro Auswahlversuch abzulehnen.
# 0.0 = keine Bevorzugung (Standard), 1.0 = nicht generiertes Land strikt meiden.
# Generierte Chunks bestehen immer.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.0
pregeneratedPreference: 0.0

# Anteil der L3-Backlog-Kapazität, bei dem das Auffüllen wieder einsetzt (Hysterese).
# 0.5 = erst auffüllen, wenn L3 auf 50% geleert ist (Standard). 1.0 = kontinuierlich
# auffüllen. Höhere Werte gruppieren .mca-Bin-Prüfungen für bessere
# CPU-/Speichereffizienz.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.5
backlogRefillThreshold: 0.5

# Latency threshold (ms) above which an immediately-served (unqueued) teleport
# is audited: a WARN is logged and the cumulative slowPipelineCount counter
# (surfaced by /rtp info) is incremented. Only immediate/unqueued teleports are
# audited; queued at-rate teleports are excluded because their measured time
# includes queue-wait. 0 or below disables the audit. See ADR-053.
# @type: integer
# @range: [0, null]
# @unit: ms
# @default: 5000
slowPipelineThresholdMs: 5000

# Public teleport-queue depth (players waiting) at or above which queue
# backpressure is audited: an edge-triggered WARN is logged and the cumulative
# queueGrowthWarnCount counter (surfaced by /rtp info) is incremented once per
# crossing. 0 or below disables the audit (opt-in). See ADR-053.
# @type: integer
# @range: [0, null]
# @unit: players
# @default: 0
queueGrowthWarnThreshold: 0
# Einstellungen für /rtp admin prefab. Der `apply` -> `confirm`-Ablauf schreibt
# jede berührte Konfigurationsdatei mit einem gleichnamigen Backup
# <file>.yml.bak.<epochMillis>; `bakRetention` begrenzt, wie viele solcher
# Backups je Datei behalten werden, älteste zuerst entfernt. Auf 1 setzen, um nur
# das neueste Backup zu behalten; Werte unter 1 werden auf 1 angehoben. /rtp admin
# prefab rollback geht Backups über mehrere Aufrufe vom neuesten zum ältesten durch.
prefab:
  # @type: integer
  # @range: [1, null]
  # @default: 3
  bakRetention: 3
# ÄNDERE NICHT DIE VERSIONSNUMMER
version: 1.0
