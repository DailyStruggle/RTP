# --- RTP Leistungseinstellungen ---
# Dokumentation: plugins/RTP/docs/admin/configuration/PERFORMANCE.md
# Maximale Suchversuche pro /rtp-Aufruf, bevor aufgegeben wird.
# @type: integer
# @range: [1, null]
# @default: 32
maxVersuche: 32

# Chunk-Radius, der während der Auswahl rund um einen Kandidatenort geladen wird.
# 0 lädt nur den Kandidaten-Chunk.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
sichtweiteAuswahl: 0

# Chunk-Radius, der unmittelbar vor dem Teleport rund um den endgültigen Ort
# geladen wird. 0 lädt nur den Ziel-Chunk.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
sichtweiteTeleport: 0

# Gesamtanzahl Ticks, ueber die die Sichtweite eines teleportierten
# Spielers nach der Ankunft stetig wiederhergestellt wird. Beim Teleport
# wird die Sichtweite kurz auf den viewDistanceTeleport-Radius gesenkt
# (mindestens 2), damit der Server beim Platzieren nur einen kleinen Ring
# Chunks laedt, und dann ueber diese Ticks wieder hochgefahren. Das glaettet
# die Chunk-Last-Spitze, die auf schwachen Hosts einen Tick blockieren kann.
# 0 deaktiviert die Klammer. Wirkungslos, wenn viewDistanceTeleport bereits
# gleich oder groesser als die Sichtweite des Spielers ist.
# @type: integer
# @range: [0, null]
# @unit: ticks
# @default: 200
sichtweiteWiederherstellungsIntervall: 200

# Ticks zwischen Hintergrund-Cache-Zyklen (Regions-Vorbefüllung, Warteschlangen-Auffüllung).
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
intervall: 20

# Maximale Millisekunden pro Tick für synchrone Aufgaben.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
syncZugeteilteZeit: 50

# Maximale Millisekunden pro Tick für asynchrone Aufgaben.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
asyncZugeteilteZeit: 50

# Mindest-Server-TPS, die zum Fortführen der Hintergrund-Warteschlange nötig ist.
# Hintergrundarbeit pausiert, wenn die TPS unter diesen Schwellenwert fallen.
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
minimaleTPS: 19.0

# Maximale JVM-Heap-Auslastung (Prozent des maximalen Heaps), bevor das
# Auffüllen des Hintergrund-Caches pausiert. Jede zwischengespeicherte
# Position hält einen Chunk fest, daher kann ein unbegrenztes Auffüllen auf
# einem Server mit kleinem Heap die JVM in eine ständige Garbage Collection
# treiben und den Server ohne Konsolenfehler nicht mehr reagieren lassen.
# Solange die Auslastung auf oder über diesem Schwellenwert liegt, füllt RTP
# den Positions-Cache nicht mehr auf, liefert aber weiterhin bereits
# zwischengespeicherte Positionen an wartende Spieler. 0 oder 100 deaktiviert
# die Sperre.
# @type: number
# @range: [0.0, 100.0]
# @default: 85.0
maxHeapProzent: 85.0

# Den Regions-Cache unmittelbar nach einem erfolgreichen Teleport auffüllen.
# @type: boolean
# @default: false
nachTeleportEinreihung: false

# Synchrones Chunk-Laden verwenden. NICHT EMPFOHLEN. Verletzt den Geist von S-005
# auf Folia und blockiert den Haupt-Thread auf Paper/Spigot.
# @type: boolean
# @default: false
syncLaden: false

# Berechtigungsknoten bei jedem Ereignis neu auswerten, statt sie zu cachen.
# @type: boolean
# @default: false
ereignisAuswertung: false

# Effekt-Berechtigungsknoten beim Start auswerten.
# @type: boolean
# @default: true
effektAuswertung: true

# Zuvor gefundene biom-passende Orte aus dem Cache wiederverwenden.
# @type: boolean
# @default: true
biomWiederverwendung: true

# Wenn gesetzt, biom-gefilterte Anfragen nur aus dem Cache bedienen (niemals
# neue Biom-Suchen erzeugen). Erfordert biomeRecall.
# @type: boolean
# @default: false
biomWiederverwendungErzwungen: false

# Verzerrt die biomgefilterte Auswahl so, dass jedes angeforderte Biom mit
# gleicher Wahrscheinlichkeit angesteuert wird, statt anteilig zu seiner Fläche
# in der Region. Verhindert, dass häufige Biome seltene verdrängen, wenn mehrere
# Biome angefordert werden. Erfordert biomeRecall; keine Wirkung auf
# ungefilterte (Standardbiom-)Teleports.
# @type: boolean
# @default: false
biomGewichtet: false

# Per-biome relative selection weights for biome-filtered teleports.
# Only consulted when biomeWeighted is true. Biomes not listed here use
# weight 1.0, so an empty/all-equal map reproduces the equal-probability
# behavior of biomeWeighted on its own. A biome given weight 2.0 is
# steered toward roughly twice as often as a weight-1.0 biome among the
# requested set (when both are present in biome-recall memory); 0.0
# suppresses a biome. Requires biomeRecall; no effect on unfiltered
# (default-biome) teleports. The shipped plains entry is a weight-1.0
# no-op example - replace or extend it with the biomes you want to bias.
# @type: map<string, number>
biomGewichte:
  # Relative Auswahlgewichtung für dieses Biom (1.0 = keine Gewichtung).
  # @type: number
  # @range: [0.0, null]
  # @default: 1.0
  plains: 1.0
  sunflower_plains: 1.0
  snowy_plains: 1.0
  ice_spikes: 1.0
  desert: 1.0
  swamp: 1.0
  mangrove_swamp: 1.0
  forest: 1.0
  flower_forest: 1.0
  birch_forest: 1.0
  dark_forest: 1.0
  old_growth_birch_forest: 1.0
  old_growth_pine_taiga: 1.0
  old_growth_spruce_taiga: 1.0
  taiga: 1.0
  snowy_taiga: 1.0
  savanna: 1.0
  savanna_plateau: 1.0
  windswept_hills: 1.0
  windswept_gravelly_hills: 1.0
  windswept_forest: 1.0
  windswept_savanna: 1.0
  jungle: 1.0
  sparse_jungle: 1.0
  bamboo_jungle: 1.0
  badlands: 1.0
  eroded_badlands: 1.0
  wooded_badlands: 1.0
  meadow: 1.0
  cherry_grove: 1.0
  pale_garden: 1.0
  grove: 1.0
  snowy_slopes: 1.0
  frozen_peaks: 1.0
  jagged_peaks: 1.0
  stony_peaks: 1.0
  river: 1.0
  frozen_river: 1.0
  beach: 1.0
  snowy_beach: 1.0
  stony_shore: 1.0
  warm_ocean: 1.0
  lukewarm_ocean: 1.0
  deep_lukewarm_ocean: 1.0
  ocean: 1.0
  deep_ocean: 1.0
  cold_ocean: 1.0
  deep_cold_ocean: 1.0
  frozen_ocean: 1.0
  deep_frozen_ocean: 1.0
  mushroom_fields: 1.0
  dripstone_caves: 1.0
  lush_caves: 1.0
  deep_dark: 1.0
  # --- Der Nether ---
  nether_wastes: 1.0
  warped_forest: 1.0
  crimson_forest: 1.0
  soul_sand_valley: 1.0
  basalt_deltas: 1.0
  # --- Das End ---
  the_end: 1.0
  end_highlands: 1.0
  end_midlands: 1.0
  small_end_islands: 1.0
  end_barrens: 1.0
  # --- Sonstiges / technisch ---
  the_void: 1.0

# In allen geladenen Chunks nach sicheren Landeplätzen suchen (opportunistische
# Vorbefüllung).
# @type: boolean
# @default: true
beiChunkLadenPruefen: true

# Hintergrund-Datenerfassung für Besucher-Analysen aktivieren.
# @type: boolean
# @default: false
besucherAktiviert: true

# Reservierten Cache für Beitritts-Teleports vorhalten (rtp.onevent.firstjoin / rtp.onevent.join). Größe richtet sich nach verbleibenden freien Spieler-Slots.
# @type: boolean
# @default: false
loginCacheAktiviert: false

# Harte Obergrenze für den Beitritts-Cache. 0 = automatisch (max-players des Servers beim Start).
# @type: integer
# @range: [0, null]
# @default: 0
loginCacheObergrenze: 0

# Wahrscheinlichkeit, einen nicht generierten Chunk pro Auswahlversuch abzulehnen.
# 0.0 = keine Bevorzugung (Standard), 1.0 = nicht generiertes Land strikt meiden.
# Generierte Chunks bestehen immer.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.0
vorgeneriertBevorzugung: 0.0

# Anteil der L3-Backlog-Kapazität, bei dem das Auffüllen wieder einsetzt (Hysterese).
# 0.5 = erst auffüllen, wenn L3 auf 50% geleert ist (Standard). 1.0 = kontinuierlich
# auffüllen. Höhere Werte gruppieren.mca-Bin-Prüfungen für bessere
# CPU-/Speichereffizienz.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.5
rueckstauAuffuellSchwelle: 0.5

# Latenzschwelle (ms), oberhalb der ein sofort bedienter (nicht eingereihter) Teleport
# geprüft wird: eine WARN wird protokolliert und der kumulative slowPipelineCount-Zähler
# (angezeigt von /rtp info) wird erhöht. Nur sofortige/nicht eingereihte Teleports werden
# geprüft; eingereihte at-rate-Teleports werden ausgeschlossen, da ihre gemessene Zeit
# die Warteschlangen-Wartezeit enthält. 0 oder darunter deaktiviert die Prüfung.
# @type: integer
# @range: [0, null]
# @unit: ms
# @default: 5000
langsamePipelineSchwelleMs: 5000

# Tiefe der öffentlichen Teleport-Warteschlange (wartende Spieler), ab der die
# Warteschlangen-Rückstauprüfung erfolgt: eine flankengesteuerte WARN wird protokolliert und der
# kumulative queueGrowthWarnCount-Zähler (angezeigt von /rtp info) wird einmal pro
# überschreitung erhöht. 0 oder darunter deaktiviert die Prüfung (Opt-in).
# @type: integer
# @range: [0, null]
# @unit: players
# @default: 0
warteschlangenWachstumWarnSchwelle: 0

# Einstellungen für /rtp admin prefab. Der `apply` -> `confirm`-Ablauf schreibt
# jede berührte Konfigurationsdatei mit einem gleichnamigen Backup
# <file>.yml.bak.<epochMillis>; `bakRetention` begrenzt, wie viele solcher
# Backups je Datei behalten werden, älteste zuerst entfernt. Auf 1 setzen, um nur
# das neueste Backup zu behalten; Werte unter 1 werden auf 1 angehoben. /rtp admin
# prefab rollback geht Backups über mehrere Aufrufe vom neuesten zum ältesten durch.
vorlage:
  # Number of timestamped config backups kept per file before pruning.
  # @type: integer
  # @range: [1, null]
  # @default: 3
  bakRetention: 3
# ÄNDERE NICHT DIE VERSIONSNUMMER
version: 1.0
