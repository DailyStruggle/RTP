# --- RTP-Nachrichten (diese Sprache) ---
# Nachrichtentexte fuer Spieler und Operatoren in dieser Sprache, nach Themen gruppiert.
# Automatisch aus den englischen Nachrichten erzeugt; nicht von Hand bearbeiten (wird ueberschrieben).

# ###############################################################################
# Abschnitt 2: Teleportation
# ###############################################################################
# beim Teleportieren dies anzeigen
wirdBereitsTeleportiert: "&7[P0] ⚡ du wirst bereits teleportiert!"

# wenn das Plugin gerade neu lädt
teleportVerweigertNeuladen: "&7[P0] Teleports sind vorübergehend deaktiviert, während das Plugin neu lädt. Bitte versuche es gleich erneut."
verzoegerungsNachricht: "<gradient:#9D7CD8:#5FB3B3>[P0] ⚡ Teleportiere in [delay]. Nicht bewegen</gradient>"
chunksLaden: "&7[P0] ⚙ Lade Chunks! bitte warten..."
teleportNachricht: "<gradient:#5FB3B3:#9D7CD8>[P0] ⚡ Teleportiert in [attempts] Versuchen, in [processingTime]</gradient>"

# wenn der Teleport abgebrochen wird
teleportAbbruch: "&7[P0] ⚡ Teleport abgebrochen!"

# wenn nach Erreichen der maximalen Versuche keine sicheren Orte gefunden wurden
# Platzhalter: [attempts] - die maximale Anzahl Versuche
unsicher: "&7[P0] ⌖ konnte innerhalb von [attempts] Versuchen keinen sicheren Ort finden"

# wenn der Spieler eine Abklingzeit hat
# Platzhalter: [remainingCooldown] - die verbleibende Zeit
abklingzeitNachricht: "&7[P0] ⚡ Du kannst erst in [remainingCooldown] wieder teleportieren"

# wenn der Spieler die Obergrenze lockAfterUses erreicht hat und gesperrt ist (BetterRTP LockAfter-Parität)
lockedAfterUses: "&7[P0] ⌖ Du hast dein Zufallsteleport-Limit erreicht. Versuche es in [remainingLockTime] erneut."

# wenn die Region keine Standorte in der Warteschlange hat und der Spieler keine rtp.unqueued-Berechtigung besitzt
keineOrteInWarteschlange: "#f5eb73[P0] ⌖ derzeit keine Orte bereit"

# wenn sich die Warteschlange verschiebt
# Platzhalter: [spot] - die aktuelle Position in der Warteschlange
warteschlangenAktualisierung: "#2636ef[P0] dein Platz in der Schlange: [spot]"

# wenn der Spieler nicht genug Geld für den Teleport in dieser Region hat
# Platzhalter: [money] - wie viel Geld der Befehl erfordert
nichtGenugGeld: "&7[P0] du brauchst dafür mindestens $[money]."

# ###############################################################################
# Abschnitt 3: Zeitformatierung
# ###############################################################################
# Bezeichnungen für Tage, Stunden, Minuten, Sekunden und Millisekunden in Zeit-Platzhaltern
tage: "d"
stunden: "h"
minuten: "m"
sekunden: "s"
millis: "ms"

# Welt existiert nicht in Bukkit
# Platzhalter: [world] - der Weltname
ungueltigeWelt: "&7[P0] konnte Welt '[world]' nicht finden"

# das Plugin kennt den vom Benutzer angeforderten Befehl nicht
# Platzhalter: [arg] - das versuchte Argument
ungueltigesArgument: "&c[P0] ungültiges Befehlsargument [arg]"

# wenn die Konsole einen nur für Spieler gedachten Befehl ausführt
konsolenBefehlNichtErlaubt: "&c[P0] Du musst ein Spieler im Spiel sein, um diesen Befehl auszuführen."

# das Plugin ist mit dem Neuladen beschäftigt
beschaeftigt: "&c[P0] beschäftigt"

# Wird gesendet, wenn die optionale PvP-Kampfprüfung /rtp ablehnt, weil sich der Spieler im Kampf befindet
pvpImKampf: "&c[P0] Du kannst dich im Kampf nicht zufällig teleportieren."

# das Plugin kennt den vom Benutzer angeforderten Unterbefehl oder Parameter nicht
# Platzhalter: [arg] - das versuchte Argument
ungueltigerBefehl: "&c[P0] ungültiger Befehl - [arg]"

# Benutzer hat keine Berechtigung für den angeforderten Befehl
keineBerechtigung: "&7Es tut mir leid, aber du hast keine Berechtigung, diesen Befehl auszuführen. Bitte wende dich an die Server-Administratoren, falls du glaubst, dass dies ein Fehler ist."

# ###############################################################################
# Abschnitt 8: Befehlsbeschreibungen
# ###############################################################################
rtp: "&b/rtp - zu einem zufälligen Ort teleportieren"
rtpBeschreibung: "zu einem zufälligen Ort teleportieren"
hilfe: "&b/rtp help - dies anzeigen"
hilfeBeschreibung: "Befehle beschreiben"
neuladen: "&b/rtp reload - Konfigurationsdateien neu laden"
neuladenBeschreibung: "Konfigurationsdateien neu laden"
scan: "&b/rtp scan - alle möglichen Regionsplatzierungen testen, um Ladezeiten zu verbessern"
scanBeschreibung: "gespeicherte Daten löschen und alle möglichen Regionsplatzierungen testen"
konfigBeschreibung: "Konfigurationsdateien zur Laufzeit aktualisieren"
infoBeschreibung: "den aktuellen Zustand des Plugins prüfen"
testBeschreibung: "RTP-Funktionen testen"

# ###############################################################################
# Abschnitt 9: PlaceholderAPI-Unterstützung
# ###############################################################################
# Status-Platzhalter für Spieler
SPIELER_VERFUEGBAR: "&aVERFÜGBAR"
SPIELER_ABKLINGZEIT: "&7ABKLINGZEIT"
SPIELER_EINRICHTUNG: "&bWÄHLE EINEN ORT"
SPIELER_LADEN: "&bLADE CHUNKS"
SPIELER_TELEPORTIERT: "&bTELEPORTIERE"

# ###############################################################################
# Abschnitt 10: Visuelles
# ###############################################################################
# Titeleinstellungen
# entfernen oder Titel auf " setzen, um zu deaktivieren
# Für Koordinaten wird PlaceholderAPI empfohlen
titel: "<rainbow>Teleportiert!</rainbow>"
untertitel: "<gradient:#A78BFA:#E876A0>Viel Spaß!</gradient>"
einblenden: 20
bleiben: 20
ausblenden: 20

# Aktionsleisten-Einstellung
aktionsleiste: ""

# DO NOT TOUCH VERSION NUMBER
version: 1.0
