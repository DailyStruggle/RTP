#   [key]   - der Konfigurationsschlüsselname; [value] - der aktuell gespeicherte Wert.
konfigSchluesselZeilenFormat: "&7[key]&7: #7E9CC8[value]"
# Hover-Text für eine Zeile pro Schlüssel auf einer Konfigurationsdateiseite. Platzhalter:
#   [key], [value], [type] - der Konfigurationsschlüsselname, aktueller Wert und deklarierter Typ.
konfigSchluesselHoverFormat: "&7zum Bearbeiten klicken &7[key] &7(Typ: [type])"
# Nicht anklickbare Titelzeile oben auf einer shape/vert-Typauswahlseite.
# Platzhalter: [param] - "shape" oder "vert"; [current] - aktuell aktiver Typname.
konfigTypAuswahlTitel: "#5FB3B3&l⚙ [param]-Typ wählen &7(aktuell: &7[current]&7)"
# Nicht anklickbare Titelzeile oben auf einer shape/vert-Unterparameterseite.
# Platzhalter: [param] - "shape" oder "vert"; [type] - der aktive Typname.
konfigUnterparameterSeitenTitel: "#5FB3B3&l⚙ [param] &7- &7[type] &7Unterparameter"
# Hinweis, der gesendet wird, wenn die Buchansicht auf den alten Roh-YAML-Chat-Auszug zurückgreift
# (auf dieser Plattform ist kein Buch-Renderer verfügbar).
konfigRohansichtHinweis: "&7[P0] Buchansicht nicht verfügbar; greife auf Rohausgabe zurück."
# Platzhaltertext, der anstelle eines nicht gesetzten Konfigurationswerts gerendert wird.
konfigWertNichtGesetztPlatzhalter: "&8(nicht gesetzt)"
# Nicht anklickbare Kopfzeile, die die "Änderbar"-Liste von der "Ausstehend"-
# Vormerkliste auf einer Konfigurationsdateiseite trennt, wenn der Betrachter eine oder
# mehrere nicht übernommene Änderungen vorgemerkt hat. Keine Platzhalter.
konfigAusstehendKopf: "&6&l-- pending changes --"
# Zeilenbezeichnung für einen vorgemerkten (ausstehenden) key=value-Eintrag auf einer Konfigurationsdateiseite.
# Ein Klick auf die Zeile entfernt sie aus dem Warenkorb. Platzhalter: [key], [value].
konfigAusstehendZeilenFormat: "&9[key]&8 = &0[value]"
# Hover-Text, der angezeigt wird, wenn der Betrachter eine ausstehende (vorgemerkte) Zeile auf einer
# Konfigurationsdateiseite überfährt. Keine Platzhalter.
konfigAusstehendZeileHover: "klicke, um zu verwerfen"
# Anklickbare Bezeichnung der Zeile "vorgemerkte Änderungen übernehmen" auf einer Konfigurationsdateiseite.
# Führt den zusammengebauten Befehl /rtp config <file> k1=v1 ... aus und leert den Warenkorb.
konfigAnwendenZeile: "&2&l[apply]"
# Anklickbare Bezeichnung der Zeile "vorgemerkte Änderungen verwerfen" auf einer Konfigurationsdateiseite.
# Leert den Warenkorb, ohne zu übernehmen.
konfigVerwerfenZeile: "&c&l[discard]"

# --- Karten-/Diagrammdarstellung ---
# Wird gesendet, wenn eine Kartenzeile angeklickt wird, aber die Kartendarstellung
# auf diesem Server nicht verfügbar ist (z. B. bei der Lite-Assembly oder ohne Kartenanbieter).
karteBindungFehlt: "&c[P0] Kartendarstellung ist auf diesem Server nicht verfügbar."
# Wird gesendet, wenn ein Diagramm angefordert wird, aber kein Renderer für
# diesen Diagrammtyp registriert ist.
karteResolverFehlt: "&c[P0] für diese Anfrage ist kein Karten-Resolver registriert."
# Wird gesendet, wenn ein Resolver läuft, aber die zugrunde liegende Datenquelle für
# das angeforderte Ziel nicht verfügbar ist (unbekannte Region, noch keine Daten, Welt entladen).
# Platzhalter: [region] - der angeforderte Regionsname (kann leer sein).
karteNichtVerfuegbar: "&e[P1] Kartendaten sind derzeit nicht verfügbar."
# Wird gesendet, wenn der Kartendienst derzeit keine Karte zuweisen kann
# (z. B. Obergrenze pro Betrachter erreicht).
karteBeschaeftigt: "&e[P1] der Kartendienst ist beschäftigt; bitte versuche es gleich erneut."
# Bezeichnung der anklickbaren "/rtp info"-Menüzeile, die eine Heatmap der
# bekannten schlechten Orte der aktuellen Region rendert. Ausgeblendet, wenn die
# Kartendarstellung auf diesem Server nicht verfügbar ist.
menueInfoSchlechteOrteBezeichnung: "#9D7CD8&l# Karte schlechter Orte"

# --- MultiConfig-Untermenü ---
# Ersatz-Kopfzeile, die verwendet wird, wenn kein Kopfzeilenschlüssel pro Art registriert ist.
# Platzhalter: [parserKind] - der rohe Multi-Config-Artname.
multikonfigKopfStandard: "#5FB3B3&l[parserKind]"
# Kopfzeilenbezeichnung der Multi-Config-Auswahlseite für Regionen. Keine Platzhalter.
multikonfigKopfRegionen: "#5FB3B3&l Regionen"
# Kopfzeilenbezeichnung der Multi-Config-Auswahlseite für Welten. Keine Platzhalter.
multikonfigKopfWelten: "#5FB3B3&l Welten"
# Umschaltzeilenbezeichnung, wenn der Entfernen-Modus AUS ist. Keine Platzhalter.
multikonfigEntfernenModusAus: "&8[ ] Entfernen-Modus"
# Umschaltzeilenbezeichnung, wenn der Entfernen-Modus AN ist. Klicks auf Eintragszeilen löschen.
multikonfigEntfernenModusAn: "&c[x] Entfernen-Modus (klicke einen Eintrag zum Löschen)"
# Auswahlzeilenbezeichnung für den Eintrag "+ neu hinzufügen...". Keine Platzhalter.
multikonfigZeileHinzufuegen: "&2+ neu hinzufügen..."
# Hover-Text für die Hinzufügen-Zeile. Platzhalter: [name] - vorausgefüllter Standardname.
multikonfigZeileHinzufuegenHover: "&7gib einen Namen im Amboss-Dialog ein; vorausgefüllt: &f[name]"
# Hover-Text für eine Eintragszeile im Normalmodus. Platzhalter: [name].
multikonfigZeileBearbeitenHover: "&7&f[name] bearbeiten"
# Hover-Text für eine Eintragszeile im Entfernen-Modus. Platzhalter: [name].
multikonfigZeileEntfernenHover: "&c&f[name] löschen"
# Titelzeile der Löschbestätigungsseite. Platzhalter: [name].
multikonfigBestaetigenTitel: "&c&l[name] löschen?"
# Ja-Zeilenbezeichnung der Löschbestätigungsseite. Keine Platzhalter.
multikonfigBestaetigenJa: "&c&l[confirm delete]"
# Abbrechen-Zeilenbezeichnung der Löschbestätigungsseite. Keine Platzhalter.
multikonfigBestaetigenNein: "&2&l[cancel]"
# Hover-Text auf einer gesperrten (ausgegrauten) Standardregionszeile. Keine Platzhalter.
multikonfigSperreRegionStandard: "&7die Standardregion kann nicht entfernt werden"
# Hover-Text auf einer gesperrten (ausgegrauten) Weltzeile. Platzhalter: [name].
multikonfigSperreWeltGeladen: "&7Welt '[name]' ist auf dem Server geladen; entlade sie, bevor du ihre Konfiguration entfernst"
# Ergebnisnachricht nach einem erfolgreichen HINZUFÜGEN. Platzhalter: [name].
multikonfigErgebnisHinzugefuegt: "&a'[name]' hinzugefügt."
# Ergebnisnachricht nach einem erfolgreichen ENTFERNEN. Platzhalter: [name].
multikonfigErgebnisEntfernt: "&a'[name]' entfernt."
# Ergebnisnachricht, wenn das HINZUFÜGEN fehlgeschlagen ist. Platzhalter: [name], [reason].
multikonfigErgebnisHinzufuegenFehlgeschlagen: "&c'[name]' konnte nicht hinzugefügt werden: [reason]"
# Ergebnisnachricht, wenn das ENTFERNEN fehlgeschlagen ist. Platzhalter: [name], [reason].
multikonfigErgebnisEntfernenFehlgeschlagen: "&c'[name]' konnte nicht entfernt werden: [reason]"
# Ergebnisnachricht, wenn der vorgeschlagene Eintragsname vom Bereiniger abgelehnt wird.
# Platzhalter: [name].
multikonfigErgebnisNameUngueltig: "&cName '[name]' ist nicht erlaubt; verwende Buchstaben, Ziffern, '_', '-', '.'"
# Ergebnisnachricht, wenn ein HINZUFÜGEN mit einem bestehenden Eintragsnamen kollidiert.
# Platzhalter: [name].
multikonfigErgebnisNameVergeben: "&cein Eintrag mit dem Namen '[name]' existiert bereits."

