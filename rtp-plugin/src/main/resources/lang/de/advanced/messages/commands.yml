menueHoverGrenzenFallback: "akzeptiert: [values]"
# Bezeichnung der "eine Ebene zurück"-Navigationszeile, die jeder Nicht-Wurzel-Menüseite vorangestellt wird.
menueZurueck: "&7« zurück"
# Bezeichnungsvorlage für die Zeile "zusammengebauten Befehl ausführen", die jeder
