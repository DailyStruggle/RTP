# --- RTP User-Facing Messages ---
# All player- and console-visible strings.
# Formatting:
# - Bukkit legacy color codes (e.g. &a, &7, &c)
# - Hex color codes (e.g. #2636ef)
# - PlaceholderAPI placeholders (when PAPI is installed)
# Placeholders:
# - Shared "[Pn]" placeholders are defined in the `placeholders` list below.
# [P0] is the RTP prefix by default.
# - Per-message placeholders (e.g. [attempts], [world]) are documented inline
# above each message that uses them.
# ###############################################################################
# Section 1: General Configuration
# ###############################################################################
# list of additional placeholders
# format: Pn - where n is the index in this list
platzhalter:
  # P0
  - "[RTP]"

# ###############################################################################
# Section 2: Teleportation
# ###############################################################################
# when teleporting, say this
wirdBereitsTeleportiert: "&7[P0] du wirst bereits teleportiert!"

# wenn das Plugin gerade neu lädt
teleportVerweigertNeuladen: "&7[P0] Teleports sind vorübergehend deaktiviert, während das Plugin neu lädt. Bitte versuche es gleich erneut."
verzoegerungsNachricht: "&7[P0] Teleporting in [delay]. Don't move"
chunksLaden: "&7[P0] Lade Chunks! bitte warten..."
teleportNachricht: "&7[P0] Teleported in [attempts] attempts, in [processingTime]"

# if teleport is cancelled
teleportAbbruch: "&7[P0] Teleport abgebrochen!"

# wenn nach Erreichen der maximalen Versuche keine sicheren Orte gefunden wurden
# Platzhalter: [attempts] - die maximale Anzahl Versuche
unsicher: "&7[P0] konnte innerhalb von [attempts] Versuchen keinen sicheren Ort finden"

# wenn der Spieler eine Abklingzeit hat
# Platzhalter: [remainingCooldown] - die verbleibende Zeit
abklingzeitNachricht: "&7[P0] Du kannst erst in [remainingCooldown] wieder teleportieren"

# wenn die Region keine Standorte in der Warteschlange hat und der Spieler keine rtp.unqueued-Berechtigung besitzt
keineOrteInWarteschlange: "#f5eb73[P0] derzeit keine Orte bereit"

# wenn sich die Warteschlange verschiebt
# Platzhalter: [spot] - die aktuelle Position in der Warteschlange
warteschlangenAktualisierung: "#2636ef[P0] dein Platz in der Schlange: [spot]"

# wenn der Spieler nicht genug Geld für den Teleport in dieser Region hat
# Platzhalter: [money] - wie viel Geld der Befehl erfordert
nichtGenugGeld: "&7[P0] du brauchst dafür mindestens $[money]."

# ###############################################################################
# Section 3: Time Formatting
# ###############################################################################
# for time placeholders, what to call days, hours, minutes, seconds, and milliseconds
tage: "d"
stunden: "h"
minuten: "m"
sekunden: "s"
millis: "ms"

# ###############################################################################
# Section 4: System & Management
# ###############################################################################
# a configuration file 'version' is lower than the latest
# placeholder: [filename] - name of file, including file extension
alteDatei: "&b[P0] alte [filename] erkannt. Aktualisiere"

# eine Bukkit-Welt erkannt, die nicht in der Konfigurationsdatei steht
# Platzhalter: [world] - die erkannte Welt
neueWelt: "&b[P0] neue Welt '[world]' erkannt"

# Welt existiert nicht in Bukkit
# Platzhalter: [world] - der Weltname
ungueltigeWelt: "&7[P0] konnte Welt '[world]' nicht finden"

# Text für Plugin-Reload/Update
# Platzhalter: [filename] - Dateiname
ladeNeu: "&b[P0] lade [filename]..."
neuGeladen: "&b[P0] [filename] erfolgreich geladen."
aktualisiere: "&a[P0] aktualisiere [filename]..."
aktualisiert: "&a[P0] [filename] erfolgreich aktualisiert."

# das Plugin kennt den vom Benutzer angeforderten Befehl nicht
# Platzhalter: [arg] - das versuchte Argument
ungueltigesArgument: "&c[P0] ungültiges Befehlsargument [arg]"

# wenn die Konsole einen nur für Spieler gedachten Befehl ausführt
konsolenBefehlNichtErlaubt: "&c[P0] Du musst ein Spieler im Spiel sein, um diesen Befehl auszuführen."

# plugin is busy reloading
beschaeftigt: "&c[P0] beschäftigt"

# plugin doesn't have the subcommand or parameter the user requested
# placeholder: [arg] - the argument attempted
ungueltigerBefehl: "&c[P0] ungültiger Befehl - [arg]"

# Benutzer hat keine Berechtigung für den angeforderten Befehl
keineBerechtigung: "&7Es tut mir leid, aber du hast keine Berechtigung, diesen Befehl auszuführen. Bitte wende dich an die Server-Administratoren, falls du glaubst, dass dies ein Fehler ist."

# ###############################################################################
# Section 5: Administrative Logs
# ###############################################################################
# logged when locations are saved/loaded from database
# placeholder: [amount] - number of locations
# placeholder: [region] - name of region
ortGespeichert: "&7[P0] [amount] Orte für [region] erfolgreich gespeichert"
ortGeladen: "&7[P0] [amount] Orte für [region] erfolgreich geladen"

# ###############################################################################
# Section 6: Scan Command
# ###############################################################################
# messages related to the scan command
# placeholder: [scan_regions] - list of regions
scanStart: "&a[P0] Scan-Aufgabe gestartet für Regionen: [scan_regions]"
scanZuruecksetzen: "&7[P0] Scan-Warteschlange zurückgesetzt für Regionen: [scan_regions]"
scanAbbruch: "&7[P0] Scan-Aufgabe abgebrochen für Regionen: [scan_regions]"
scanPause: "#A020F0[P0] Scan-Aufgabe pausiert für Regionen: [scan_regions]"
scanFortsetzen: "#10A5F5[P0] Scan-Aufgabe fortgesetzt für Regionen: [scan_regions]"
scanLaeuft: "&c[P0] Scan-Aufgabe läuft bereits für Regionen: [scan_regions]"
scanLaeuftNicht: "&c[P0] Scan-Aufgabe läuft nicht für Regionen: [scan_regions]"
# placeholder: [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
scanStatus: "&a[P0] [scan_chunks] / [scan_totalChunks] Chunks für Regionen abgeschlossen: [scan_regions]. [scan_cps] cps. Landanteil: [scan_landPercentage]%. ETA: [scan_eta]"

# ###############################################################################
# Section 7: Info Command
# ###############################################################################
# messages related to the info command
infoTitel: "&a&l/rtp info"
infoTickets: "&7Globale aktive Chunk-Tickets: #7E9CC8[tickets]"
infoTeleports: "&7Aktive Teleport-Zustandsmaschinen: #7E9CC8[teleports]"
infoMSPT: "&7Aktuelles Plugin-MSPT: #7E9CC8[mspt]"
infoLadevorgaengeGesamt: "&7Insgesamt geladene Chunks: #7E9CC8[loads]"
infoLadevorgaengeNachUrsprung: "&7Ladevorgänge nach Ursprung: #7E9CC8[loadsByOrigin]"
infoLeckRate: "&7Aktuelle Chunk-Leak-Rate: #7E9CC8[leakRate]"
# --- Metrics SPI health block (METRICS_PLAN.md > /rtp info Surface) ---
infoWarteschlangenTiefe: "&7Spieler in Regions-Warteschlangen: #7E9CC8[queueDepth]"
infoAusstehendeTeleports: "&7Ausstehende Teleport-Pipelines: #7E9CC8[pendingTeleports]"
infoDurchschnittPipelineMs: "&7Durchschnittliche Pipeline-Latenz: #7E9CC8[avgPipelineMs] ms"
# Pipeline-latency percentiles (ADR-053). Placeholders: [pipelineMsP50] [pipelineMsP75]
# [pipelineMsP90] [pipelineMsP95] [pipelineMsP99] [pipelineSampleCount].
infoPipelinePercentiles: "&7Pipeline Latency (ms) P50/P75/P90/P95/P99: #7E9CC8[pipelineMsP50] / [pipelineMsP75] / [pipelineMsP90] / [pipelineMsP95] / [pipelineMsP99]&7 (n=[pipelineSampleCount])"
# Slow-teleport audit (ADR-053, immediate/unqueued teleports only). Placeholders:
# [slowPipelineCount] [slowPipelineThresholdMs].
infoSlowPipeline: "&7Slow Teleports (> #7E9CC8[slowPipelineThresholdMs]&7 ms): #7E9CC8[slowPipelineCount]"
# Queue-growth audit (ADR-053). Placeholders: [queueGrowthWarnCount] [queueGrowthWarnThreshold].
infoQueueGrowth: "&7Queue-Growth Warnings (>= #7E9CC8[queueGrowthWarnThreshold]&7): #7E9CC8[queueGrowthWarnCount]"
infoHeap: "&7JVM-Heap: #7E9CC8[heapUsedMb] / [heapMaxMb] MiB"
# Kopfzeile für den als Pipeline gekennzeichneten Block in /rtp info.
infoZustandPipelineKopf: "&7--- Zustand: Pipeline ---"
# TPS-Anzeige für die Fenster 1m / 5m / 15m. Platzhalter: [tps1m] [tps5m] [tps15m].
infoTps: "&7TPS (1m/5m/15m): #7E9CC8[tps1m] / [tps5m] / [tps15m]"
# Live-Server-MSPT und Tick-Budget-Auslastung. Platzhalter: [mspt] [tickBudgetUtilisation].
infoMSPTLive: "&7Server-MSPT: #7E9CC8[mspt] ms (&7Tick-Budget: #7E9CC8[tickBudgetUtilisation]&7)"
# Configured player soft-cap vs current online count. Placeholders: [softCap] [playerCount].
infoSoftLimit: "&7Spieler: #7E9CC8[playerCount] / [softCap]"
# Aktuelle Round-Trip-Latenz der Datenbank in ms. Platzhalter: [databaseLatencyMs].
infoDatenbankLatenzMs: "&7Datenbank-Latenz: #7E9CC8[databaseLatencyMs] ms"
# Health colour-band thresholds. Doubles consumed by ColourBands in rtp-core
# to wrap coloured-variant placeholders (e.g. [tps1mColoured]) with &a/&7/&c.
infoSchwelleTpsGruen: 19.5
infoSchwelleTpsGelb: 18.0
infoSchwelleMsptGruen: 30.0
infoSchwelleMsptGelb: 45.0
infoSchwelleCacheFuellungGruen: 0.5
infoSchwelleCacheFuellungGelb: 0.25
infoSchwelleNetzwerkAlterGelb: 5.0
# Header line introducing the per-Folia-region table (Folia runtime only).
infoFoliaRegionenKopf: "&7--- Folia-Regionen ---"
# Per-row template for a single Folia region. Placeholders: [regionId] [tps1m]
# [mspt] [playerCount] [queueDepth] [tickBudgetUtilisation].
infoFoliaRegion: "  #7E9CC8[regionId]&7: tps=#7E9CC8[tps1m]&7 mspt=#7E9CC8[mspt]&7 players=#7E9CC8[playerCount]&7 queue=#7E9CC8[queueDepth]&7 budget=#7E9CC8[tickBudgetUtilisation]"
infoHinweisKopf: "&7--- Diagnose-Hinweis ---"
infoHinweis: "&7Diagnose-Hinweis: Wenn die Gesamtzahl verwaister Chunks des Servers die gesamten Ladevorgänge dieses Plugins ([loads]) übersteigt, ist dieses Plugin nicht die alleinige Ursache des Speicherlecks."
infoWeltKopf: "#008080Welten:"
infoKonsoleWeltKopf: "&7--- Welten ---"
infoWelt: "  #21ADA8[world]"
infoRegionKopf: "#63C5DARegionen:"
infoKonsoleRegionKopf: "&7--- Regionen ---"
infoRegion: "  #52B2BF[region]"

# sub-info listings
# placeholders: [world], [region], [requirePermission], [override], [shape], [worldBorderOverride], [cacheCap], [cached], [keptCache], [unkeptCache], [backlogCache], [backlogCacheCap]
weltInfo:
  - "#21ADA8[world]:"
  - "#99EEBB  - region: [region]"
  - "#99EEBB  - requirePermission: [requirePermission]"
  - "#99EEBB  - override: [override]"

regionInfo:
  - "#52B2BF[region]:"
  - "#58CCED  - Welt: [world]"
  - "#58CCED  - Form: [shape]"
  - "#58CCED  - BerechtingungErforderlich: [requirePermission]"
  - "#58CCED  - WeltgrenzeUeberschreiben: [worldBorderOverride]"
  - "#58CCED  - Cache-Kapazitaet: [cacheCap]"
  - "#58CCED  - GehaltenerCache (L1): [keptCache]"
  - "#58CCED  - UngehaltenerCache (L2): [unkeptCache]"
  - "#58CCED  - RueckstauCache (L3): [backlogCache] / [backlogCacheCap]"
  - "#58CCED  - ImCache: [cached]"

