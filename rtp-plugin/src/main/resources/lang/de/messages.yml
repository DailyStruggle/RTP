# --- RTP Nachrichten (Deutsch) ---
# Übersetzung der spieler- und konsolensichtbaren Nachrichten.
#
# WICHTIG:
#   - Platzhalter in eckigen Klammern unverändert lassen: [P0], [delay], [attempts],
#     [world], [region], [remainingCooldown], [scan_chunks], usw.
#   - Farbcodes &a &e &c und Hex-Codes (#2636ef) beibehalten.
#   - Fehlende Schlüssel werden automatisch mit dem englischen Text gefüllt.
#
# REQ-RTP-F-013 / ADR-020.
################################################################################
