# --- Admin-Panel-Bereich Einrichtung: kuratierte Vorlagen ---
# Abschnittstrenner über dem Einrichtungs-Block (Schnellstart) im Admin-Panel.
menueAdminPanelAbschnittEinrichtung: "&8» &7Einrichtung (Schnellstart)"
# Einrichtungszeile + Hover: survival-default-Identitätsüberlagerung (auf ausgelieferte Standardwerte zurücksetzen).
menueVorlageSurvivalStandardZeile: "#5FB3B3▶ survival-default"
menueVorlageSurvivalStandardHover: "&7auf die ausgelieferten Standardwerte zurücksetzen (identische Überlagerung)"
# Einrichtungszeile + Hover: low-performance (längerer Puls, kleinere Caches, Login-Cache aus).
menueVorlageNiedrigeLeistungZeile: "#5FB3B3▶ low-performance"
menueVorlageNiedrigeLeistungHover: "&7schwache Hosts / Shared-CPU-VPSes: längerer Puls, kleinere Caches, Login-Cache aus"
# Einrichtungszeile + Hover: high-performance (kurzer Puls, große Caches, Login-Cache an).
menueVorlageHoheLeistungZeile: "#5FB3B3▶ high-performance"
menueVorlageHoheLeistungHover: "&7dedizierte Hardware / hohe Spielerzahlen: kurzer Puls, große Caches, Login-Cache an"
# Einrichtungszeile + Hover: folia-tuned (Abstimmung des Regions-Schedulers).
menueVorlageFoliaOptimiertZeile: "#5FB3B3▶ folia-tuned"
menueVorlageFoliaOptimiertHover: "&7Folia-Regionsscheduler: schnellere Pulse pro Region, weniger gleichzeitige Chunk-Tickets"
# Einrichtungszeile + Hover: multi-world (eine Region pro Welt aus dem aktuellen Standard).
menueVorlageMehrweltZeile: "#5FB3B3▶ multi-world"
menueVorlageMehrweltHover: "&7aus dem aktuellen Standard eine Region pro Welt erzeugen"
# Titel des Bestätigungsmenüs. Platzhalter: [prefab] - Vorlagen-ID oder Anzeigename.
menueVorlageBestaetigenTitel: "#9D7CD8&l⚙ Vorlage bestätigen: #5FB3B3[prefab]"
# Nicht anklickbare Hinweiszeile des Bestätigungsmenüs unterhalb des Titels. Keine Platzhalter.
menueVorlageBestaetigenHinweis: "&7prüfe die Änderungen unten, dann klicke auf Bestätigen oder Abbrechen"
# Fußzeile des Bestätigungsmenüs: bestätigen und die Vorlage auf die Festplatte schreiben.
menueVorlageBestaetigenZeile: "&a&l[confirm]"
# Fußzeile des Bestätigungsmenüs: abbrechen und zum Admin-Panel zurückkehren.
menueVorlageAbbrechenZeile: "&c&l[cancel]"
# Anklickbare Zeilenbezeichnung für die Aktualisieren-Schaltfläche unten im /rtp-info-
# Buch. Rendert den aktuellen Bereich anhand einer frischen Metrik-Momentaufnahme neu.
infoBuchAktualisierenZeile: "&a[Refresh]"
# Hover-Text für die Aktualisieren-Zeile des Info-Buchs.
infoBuchAktualisierenHover: "&7Diese Seite mit einer frischen Metrik-Momentaufnahme neu rendern."
# Anklickbare Zeilenbezeichnung für die Zum-Chat-wechseln-Schaltfläche unten im
# /rtp-info-Buch. Führt denselben Bereich über den alten Chat-Pfad erneut aus.
infoBuchZuChatWechselnZeile: "&7[Switch to chat]"
# Hover-Text für die Zum-Chat-wechseln-Zeile des Info-Buchs.
infoBuchZuChatWechselnHover: "&7/rtp info stattdessen im Chat ausführen."
# Fußzeile, die gerendert wird, wenn der /rtp-info-Buchinhalt die Buchseiten-
# Obergrenze überschreitet. Ein Klick führt denselben Bereich im Chat-Modus erneut aus, damit keine Daten verloren gehen.
infoBuchUeberlaufFusszeile: "&7(Inhalt gekürzt - klicke, um die vollständige Ausgabe im Chat zu sehen)"
# Nicht anklickbare Hinweiszeile, die angibt, dass die periodische Auto-Aktualisierung des Info-
# Buchs in diesem Build derzeit nicht unterstützt wird (auf einen späteren
# Meilenstein verschoben). Nutzer können die Aktualisieren-Zeile anklicken, um manuell zu aktualisieren.
infoBuchAutoAktualisierenHinweis: "&8(automatisches Aktualisieren noch nicht unterstützt; klicke auf Aktualisieren)"
# Nicht anklickbare Titelzeile oben auf der Auswahlseite der Konfigurationsdateien (Stufe C.1).
# Wird angezeigt, wenn ein Admin auf der Startseite "/rtp config" anklickt.
konfigSelektorTitel: "#5FB3B3&l⚙ Konfigurationsdateien"
# Bezeichnung der Navigationszeile "zurück zur /rtp-Menüwurzel" auf der Konfigurationsauswahlseite.
konfigSelektorZurueckZeile: "&7« zurück zum Menü"
# Nicht anklickbare Titelzeile oben auf einer einzelnen Konfigurationsdateiseite (Stufe C.2).
# Platzhalter: [file] - der Name der Konfigurationsdatei (z. B. "performance", "safety").
konfigDateiTitel: "#5FB3B3&l⚙ Konfiguration: &7[file]"
# Bezeichnung der Navigationszeile "zurück zur Konfigurationsauswahl" auf einer einzelnen Konfigurationsdateiseite.
konfigDateiZurueckZeile: "&7« zurück zu Konfigurationsdateien"
# Nicht anklickbare Hinweiszeile, die angezeigt wird, wenn eine Konfigurationsdatei keine bearbeitbaren Schlüssel hat.
konfigDateiLeerHinweis: "&7(keine bearbeitbaren Schlüssel in dieser Datei)"
# Zeilenbezeichnung pro Schlüssel auf einer Konfigurationsdateiseite. Platzhalter:
#   [key]   - der Konfigurationsschlüsselname; [value] - der aktuell gespeicherte Wert.
konfigSchluesselZeilenFormat: "&7[key]&7: #7E9CC8[value]"
# Hover-Text für eine Zeile pro Schlüssel auf einer Konfigurationsdateiseite. Platzhalter:
#   [key], [value], [type] - der Konfigurationsschlüsselname, aktueller Wert und deklarierter Typ.
konfigSchluesselHoverFormat: "&7zum Bearbeiten klicken &7[key] &7(Typ: [type])"
# Nicht anklickbare Titelzeile oben auf einer shape/vert-Typauswahlseite (Stufe C.3a).
# Platzhalter: [param] - "shape" oder "vert"; [current] - aktuell aktiver Typname.
konfigTypAuswahlTitel: "#5FB3B3&l⚙ [param]-Typ wählen &7(aktuell: &7[current]&7)"
# Nicht anklickbare Titelzeile oben auf einer shape/vert-Unterparameterseite (Stufe C.3b).
# Platzhalter: [param] - "shape" oder "vert"; [type] - der aktive Typname.
konfigUnterparameterSeitenTitel: "#5FB3B3&l⚙ [param] &7- &7[type] &7Unterparameter"
# Hinweis, der gesendet wird, wenn die Buchansicht auf den alten Roh-YAML-Chat-Auszug zurückgreift
# (auf dieser Plattform ist kein Buch-Renderer verfügbar).
konfigRohansichtHinweis: "&7[P0] Buchansicht nicht verfügbar; greife auf Rohausgabe zurück."
# Platzhaltertext, der anstelle eines nicht gesetzten Konfigurationswerts gerendert wird.
konfigWertNichtGesetztPlatzhalter: "&8(nicht gesetzt)"
# Nicht anklickbare Kopfzeile, die die "Änderbar"-Liste von der "Ausstehend"-
# Vormerkliste auf einer Konfigurationsdateiseite trennt, wenn der Betrachter eine oder
# mehrere nicht übernommene Änderungen vorgemerkt hat. Keine Platzhalter.
konfigAusstehendKopf: "&6&l-- pending changes --"
# Zeilenbezeichnung für einen vorgemerkten (ausstehenden) key=value-Eintrag auf einer Konfigurationsdateiseite.
# Ein Klick auf die Zeile entfernt sie aus dem Warenkorb. Platzhalter: [key], [value].
konfigAusstehendZeilenFormat: "&9[key]&8 = &0[value]"
# Hover-Text, der angezeigt wird, wenn der Betrachter eine ausstehende (vorgemerkte) Zeile auf einer
# Konfigurationsdateiseite überfährt. Keine Platzhalter.
konfigAusstehendZeileHover: "klicke, um zu verwerfen"
# Anklickbare Bezeichnung der Zeile "vorgemerkte Änderungen übernehmen" auf einer Konfigurationsdateiseite.
# Führt den zusammengebauten Befehl /rtp config <file> k1=v1 ... aus und leert den Warenkorb.
konfigAnwendenZeile: "&a&l[apply]"
# Anklickbare Bezeichnung der Zeile "vorgemerkte Änderungen verwerfen" auf einer Konfigurationsdateiseite.
# Leert den Warenkorb, ohne zu übernehmen.
konfigVerwerfenZeile: "&c&l[discard]"

# --- ADR-047 deklarative Diagramm-Kompositionsbrücke (REQ-RTP-MAP-006) ---
# Wird an den Betrachter gesendet, wenn eine OPEN_MAP-Menüaktion ausgelöst wird, aber kein konkretes
# MapBinding registriert ist (NoopMapBinding ist noch aktiv, z. B. bei der
# Lite-Assembly oder bevor RTPHooks das Plattform-Binding verdrahtet).
karteBindungFehlt: "&c[P0] Kartendarstellung ist auf diesem Server nicht verfügbar."
# Wird gesendet, wenn MapDispatch eine ChartSpec erhält, deren Kind keinen registrierten
# ChartSpecResolver hat (z. B. Stufe-1-Betrachter klickt eine Stufe-3-Sparkline an, bevor
# der Resolver vorhanden ist).
karteResolverFehlt: "&c[P0] für diese Anfrage ist kein Karten-Resolver registriert."
# Wird gesendet, wenn ein Resolver läuft, aber die zugrunde liegende Datenquelle für
# das angeforderte Ziel nicht verfügbar ist (unbekannte Region, noch keine Daten, Welt entladen).
# Platzhalter: [region] - der angeforderte Regionsname (kann leer sein).
karteNichtVerfuegbar: "&e[P1] Kartendaten sind derzeit nicht verfügbar."
# Wird gesendet, wenn das aktive MapBinding derzeit keinen Karten-Handle zuweisen kann
# (vom Binding definierter Gegendruck, z. B. Obergrenze pro Betrachter erreicht).
karteBeschaeftigt: "&e[P1] der Kartendienst ist beschäftigt; bitte versuche es gleich erneut."
# Bezeichnung der anklickbaren "/rtp info"-Menüzeile, die beim Klick einen
# ChartSpec(BAD_POINTS_HEATMAP, ...)-Token erzeugt und das aktive MapBinding bittet,
# eine 128x128-Heatmap der bekannten Schlecht-Punkt-Spiralindizes der aktuellen
# Region zu rendern. Die Zeile wird beim Rendern ausgelassen, wenn NoopMapBinding
# das installierte Binding ist (REQ-RTP-MAP-006 / ADR-047).
menueInfoSchlechteOrteBezeichnung: "#9D7CD8&l# Karte schlechter Orte"

# --- Nachrichten für den serverübergreifenden Netzwerkmodus ---
# Wird nur gesendet, wenn `network.enabled: true` ist und das `/rtp` des Spielers über
# die serverübergreifende Warteschlange geleitet wird (siehe network.yml `routing.mode`).
# Aus Sicht des Spielers sind alle Schlüssel optional - der L2-Basiszyklus aus
# `delayMessage` / `teleportMessage` steuert weiterhin den sichtbaren Ablauf.
# Wird gesendet, wenn die Anfrage in die serverübergreifende Warteschlange aufgenommen wurde
# und auf eine Backend-Reservierung wartet. Platzhalter: [position] - 0-basierte
# Position aus `pollStatus`; kann leer sein, wenn der Transport keine
# Position zurückgibt.
netzwerkInWarteschlange: "&7[P0] für ein serverübergreifendes Ziel eingereiht (Position [position])..."
# Wird gesendet, wenn ein Spieler /rtp* ausführt, während er bereits eine nicht abgeschlossene
# serverübergreifende Anmeldung hält (ADR-015 / REQ-RTP-NET-015 Befehlssperre). Platzhalter:
# [position] - FIFO-Position, falls bekannt; leer, wenn der Proxy noch keine
# zugewiesen hat.
bereitsInWarteschlange: "&cDu wartest bereits in der serverübergreifenden Warteschlange (Position [position]). Bitte warte."
# Wird gesendet, wenn ein serverübergreifender Warteschlangeneintrag nach Überschreiten seiner
# konfigurierten TTL entfernt wird (ADR-015). Keine Platzhalter.
netzwerkZeitueberschreitung: "&c[P0] serverübergreifender Teleport hat beim Warten auf ein Backend das Zeitlimit überschritten."
# Wird gesendet, wenn eine serverübergreifende Warteschlangenanmeldung abgelehnt wird, weil die gemeinsame
# Warteschlange ihre konfigurierte Maximalgröße erreicht hat (ADR-015 REJECTED_FULL).
# Keine Platzhalter.
warteschlangeVoll: "&c[P0] serverübergreifende Warteschlange ist voll; bitte versuche es gleich erneut."
# Wird gesendet, wenn die Warteschlange die Anfrage an den Proxy-Router übergeben hat und
# eine Backend-Auswahl läuft.
netzwerkWeiterleitung: "&7[P0] leite zu einem Backend weiter..."
# Wird gesendet, wenn ein Backend eine Koordinate für diesen Spieler reserviert hat und der
# Proxy im Begriff ist, den serverübergreifenden Sprung einzuleiten. Platzhalter: [server]
# - die serverId des Ziel-Backends.
netzwerkReserviert: "&a[P0] Koordinate auf [server] reserviert. Übertrage..."
# Wird gesendet, während der Proxy den Sprung ausführt. Platzhalter: [server] - Ziel.
netzwerkUebertragung: "&a[P0] übertrage zu [server]..."
# Wird gesendet, wenn der serverübergreifende Pfad aufgegeben hat und die Anfrage auf
# das lokale Backend zurückgefallen ist. Platzhalter: [reason] - einer der
# `RoutingDecision.FallbackReason`-Werte (z. B. NO_LIVE_PEER, QUEUE_FULL).
netzwerkRueckfall: "&e[P0] serverübergreifend nicht verfügbar ([reason]); greife lokal zurück."
# Wird gesendet, wenn die serverübergreifende Anfrage endgültig fehlgeschlagen ist (kein Rückfall war
# möglich). Platzhalter: [reason] - der `DispatchOutcome.Failed.Reason`.
netzwerkFehlgeschlagen: "&c[P0] serverübergreifender Teleport fehlgeschlagen: [reason]."
# Wird gesendet, wenn der Spieler eine bestimmte Region angefordert hat (`/rtp <region>`), aber
# derzeit kein Backend im Netzwerk sie bedient. Platzhalter:
# [region] - der angeforderte Regionsname.
netzwerkRegionNichtVerfuegbar: "&c[P0] derzeit bedient kein Backend die Region '[region]'."
# Wird gesendet, wenn der angeforderte Regionsname zu zwei oder mehr Backends aufgelöst wird und
# die vom Operator konfigurierte Richtlinie keines auswählen kann (wird nur
# unter strengeren Richtlinien als dem Standard `warn` ausgelöst). Platzhalter: [region].
netzwerkRegionMehrdeutig: "&c[P0] Region '[region]' ist über mehrere Backends mehrdeutig; bitte einen Server festlegen."

# --- MultiConfig-Untermenü ---
# Ersatz-Kopfzeile, die verwendet wird, wenn kein Kopfzeilenschlüssel pro Art registriert ist.
# Platzhalter: [parserKind] - der rohe Multi-Config-Artname.
multikonfigKopfStandard: "#5FB3B3&l[parserKind]"
# Kopfzeilenbezeichnung der Multi-Config-Auswahlseite für Regionen. Keine Platzhalter.
multikonfigKopfRegionen: "#5FB3B3&l Regionen"
# Kopfzeilenbezeichnung der Multi-Config-Auswahlseite für Welten. Keine Platzhalter.
multikonfigKopfWelten: "#5FB3B3&l Welten"
# Umschaltzeilenbezeichnung, wenn der Entfernen-Modus AUS ist. Keine Platzhalter.
multikonfigEntfernenModusAus: "&8[ ] Entfernen-Modus"
# Umschaltzeilenbezeichnung, wenn der Entfernen-Modus AN ist. Klicks auf Eintragszeilen löschen.
multikonfigEntfernenModusAn: "&c[x] Entfernen-Modus (klicke einen Eintrag zum Löschen)"
# Auswahlzeilenbezeichnung für den Eintrag "+ neu hinzufügen...". Keine Platzhalter.
multikonfigZeileHinzufuegen: "&a+ neu hinzufügen..."
# Hover-Text für die Hinzufügen-Zeile. Platzhalter: [name] - vorausgefüllter Standardname.
multikonfigZeileHinzufuegenHover: "&7gib einen Namen im Amboss-Dialog ein; vorausgefüllt: &f[name]"
# Hover-Text für eine Eintragszeile im Normalmodus. Platzhalter: [name].
multikonfigZeileBearbeitenHover: "&7&f[name] bearbeiten"
# Hover-Text für eine Eintragszeile im Entfernen-Modus. Platzhalter: [name].
multikonfigZeileEntfernenHover: "&c&f[name] löschen"
# Titelzeile der Löschbestätigungsseite. Platzhalter: [name].
multikonfigBestaetigenTitel: "&c&l[name] löschen?"
# Ja-Zeilenbezeichnung der Löschbestätigungsseite. Keine Platzhalter.
multikonfigBestaetigenJa: "&c&l[confirm delete]"
# Abbrechen-Zeilenbezeichnung der Löschbestätigungsseite. Keine Platzhalter.
multikonfigBestaetigenNein: "&a&l[cancel]"
# Hover-Text auf einer gesperrten (ausgegrauten) Standardregionszeile. Keine Platzhalter.
multikonfigSperreRegionStandard: "&7die Standardregion kann nicht entfernt werden"
# Hover-Text auf einer gesperrten (ausgegrauten) Weltzeile. Platzhalter: [name].
multikonfigSperreWeltGeladen: "&7Welt '[name]' ist auf dem Server geladen; entlade sie, bevor du ihre Konfiguration entfernst"
# Ergebnisnachricht nach einem erfolgreichen HINZUFÜGEN. Platzhalter: [name].
multikonfigErgebnisHinzugefuegt: "&a'[name]' hinzugefügt."
# Ergebnisnachricht nach einem erfolgreichen ENTFERNEN. Platzhalter: [name].
multikonfigErgebnisEntfernt: "&a'[name]' entfernt."
# Ergebnisnachricht, wenn das HINZUFÜGEN fehlgeschlagen ist. Platzhalter: [name], [reason].
multikonfigErgebnisHinzufuegenFehlgeschlagen: "&c'[name]' konnte nicht hinzugefügt werden: [reason]"
# Ergebnisnachricht, wenn das ENTFERNEN fehlgeschlagen ist. Platzhalter: [name], [reason].
multikonfigErgebnisEntfernenFehlgeschlagen: "&c'[name]' konnte nicht entfernt werden: [reason]"
# Ergebnisnachricht, wenn der vorgeschlagene Eintragsname vom Bereiniger abgelehnt wird.
# Platzhalter: [name].
multikonfigErgebnisNameUngueltig: "&cName '[name]' ist nicht erlaubt; verwende Buchstaben, Ziffern, '_', '-', '.'"
# Ergebnisnachricht, wenn ein HINZUFÜGEN mit einem bestehenden Eintragsnamen kollidiert.
# Platzhalter: [name].
multikonfigErgebnisNameVergeben: "&cein Eintrag mit dem Namen '[name]' existiert bereits."

