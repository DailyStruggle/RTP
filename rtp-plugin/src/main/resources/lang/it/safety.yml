# --- Configurazione di sicurezza di RTP ---
# Documentazione: https://github.com/DailyStruggle/RTP/blob/master/docs/admin/SAFETY.md
# Secondi di invulnerabilità concessi dopo il completamento di un teletrasporto.
# 0 disattiva la finestra di invulnerabilità post-teletrasporto.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 5
tempoInvulnerabilita: 5

# Raggio in blocchi attorno al punto di atterraggio scansionato per pericoli.
# 0 controlla solo il blocco di atterraggio + la verticale immediata.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 0
raggioSicurezza: 0

# Numero massimo di tentativi per la guardia dei chunk obsoleti prima di far fallire il tentativo.
# Vedi ADR-015.
# @type: integer
# @range: [0, null]
# @default: 2
limiteRipetizioniChunkObsoleti: 2

# Usa il prefiltro NBT anvil fuori dal thread per rifiutare i candidati senza
# caricare i loro chunk. Vedi ADR-016.
# @type: boolean
# @default: true
prefiltroAnvilAttivo: true

# Raggio della piattaforma di atterraggio di emergenza costruita alla destinazione.
# -1 disattiva del tutto la piattaforma.
# @type: integer
# @range: [-1, null]
# @unit: blocks
# @default: -1
raggioPiattaforma: -1

# Profondità (spessore verticale) della piattaforma di emergenza.
# @type: integer
# @range: [1, null]
# @unit: blocks
# @default: 1
profonditaPiattaforma: 1

# Altezza dello spazio d'aria liberato sopra la piattaforma di emergenza.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 2
altezzaAriaPiattaforma: 2

# Materiale usato per la piattaforma di atterraggio di emergenza.
# @type: material
# @source: material
# @default: GLASS
materialePiattaforma: "GLASS"

# Blocchi trattati come aria attraversabile per i controlli di sicurezza di atterraggio.
# Accetta nomi di Material di Bukkit e riferimenti a tag "#minecraft:<tag>"
# (vedi ADR-017).
# @type: list<material>
# @source: material
blocchiAria:
  - "AIR"
  - "CAVE_AIR"
  - "VOID_AIR"
  - "LEGACY_AIR"
  - "STRUCTURE_VOID"
  - "LIGHT"
  - "#minecraft:flowers"
  - "#minecraft:small_flowers"
  # Nota: #minecraft:tall_flowers è un tag solo-oggetto in vanilla; i suoi membri
  # (LILAC, PEONY, ROSE_BUSH, SUNFLOWER, PITCHER_PLANT) sono già coperti da
  # #minecraft:flowers sopra.
  - "SHORT_GRASS"
  - "TALL_GRASS"
  - "SHORT_DRY_GRASS"
  - "TALL_DRY_GRASS"
  - "FERN"
  - "LARGE_FERN"
  - "DEAD_BUSH"
  - "BUSH"
  - "WILDFLOWERS"
  - "FIREFLY_BUSH"
  - "LEGACY_LONG_GRASS"
  - "LEGACY_DEAD_BUSH"
  - "#minecraft:saplings"
  - "BROWN_MUSHROOM"
  - "RED_MUSHROOM"
  - "CRIMSON_FUNGUS"
  - "WARPED_FUNGUS"
  - "#minecraft:crops"
  - "MELON_STEM"
  - "PUMPKIN_STEM"
  - "SUGAR_CANE"
  - "BAMBOO_SAPLING"
  - "VINE"
  - "GLOW_LICHEN"
  - "WEEPING_VINES"
  - "TWISTING_VINES"
  - "HANGING_ROOTS"
  - "PALE_HANGING_MOSS"
  - "RESIN_CLUMP"
  - "#minecraft:rails"
  - "REDSTONE_WIRE"
  - "COMPARATOR"
  - "REPEATER"
  - "LEVER"
  - "STRING"
  - "TRIPWIRE"
  - "TORCH"
  - "WALL_TORCH"
  - "SOUL_TORCH"
  - "SOUL_WALL_TORCH"
  - "REDSTONE_TORCH"
  - "REDSTONE_WALL_TORCH"
  - "END_ROD"
  - "#minecraft:buttons"
  - "#minecraft:pressure_plates"
  - "#minecraft:standing_signs"
  - "#minecraft:wall_signs"
  - "#minecraft:ceiling_hanging_signs"
  - "#minecraft:wall_hanging_signs"
  - "LEGACY_SIGN"
  - "LEGACY_WALL_SIGN"
  - "SNOW"
  - "MOSS_CARPET"
  - "PALE_MOSS_CARPET"
  - "LEAF_LITTER"
  - "#minecraft:leaves"

# Blocchi che squalificano un punto di atterraggio (lava, pericoli, ecc.).
# Accetta nomi di Material di Bukkit, riferimenti a tag "#minecraft:<tag>" e
# predicati di stato come "*[waterlogged=true]" (vedi ADR-017).
# @type: list<material>
# @source: material
blocchiPericolosi:
  - "WATER"
  - "LAVA"
  - "BUBBLE_COLUMN"
  - "*[waterlogged=true]"
  - "#minecraft:fire"
  - "POWDER_SNOW"
  - "MAGMA_BLOCK"
  - "#minecraft:campfires"
  - "CACTUS"
  - "SWEET_BERRY_BUSH"
  - "WITHER_ROSE"
  - "CHORUS_PLANT"
  - "CHORUS_FLOWER"
  - "POINTED_DRIPSTONE"
  - "COBWEB"
  - "CREAKING_HEART"
  - "BEDROCK"
  - "NETHER_PORTAL"
  - "END_PORTAL"
  - "END_GATEWAY"
  - "TNT"
  - "END_CRYSTAL"
  - "RESPAWN_ANCHOR"
  - "SEAGRASS"
  - "TALL_SEAGRASS"
  - "KELP"
  - "KELP_PLANT"
  - "#minecraft:logs"

# Se true, la lista dei biomi è una whitelist (solo questi biomi sono
# permessi). Se false, è una blacklist (questi biomi sono esclusi).
# @type: boolean
# @default: false
whitelistBiomi: false

# Biomi trattati come membri della whitelist o blacklist secondo biomeWhitelist.
# @type: list<biome>
# @source: biome
