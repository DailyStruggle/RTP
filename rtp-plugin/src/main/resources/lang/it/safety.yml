# --- Configurazione di sicurezza di RTP ---
# Documentazione: plugins/RTP/docs/admin/SAFETY.md
# Secondi di invulnerabilità concessi dopo il completamento di un teletrasporto.
# 0 disattiva la finestra di invulnerabilità post-teletrasporto.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 5
tempoInvulnerabilita: 5

# Raggio in blocchi attorno al punto di atterraggio scansionato per pericoli.
# 0 controlla solo il blocco di atterraggio + la verticale immediata.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 0
raggioSicurezza: 0

# Numero massimo di tentativi per la guardia dei chunk obsoleti prima di far fallire il tentativo.
# Vedi
# @type: integer
# @range: [0, null]
# @default: 2
limiteRipetizioniChunkObsoleti: 2

# Usa il prefiltro NBT anvil fuori dal thread per rifiutare i candidati senza
# caricare i loro chunk. Vedi
# @type: boolean
# @default: true
prefiltroAnvilAttivo: true

# Raggio della piattaforma di atterraggio di emergenza costruita alla destinazione.
# -1 disattiva del tutto la piattaforma.
# @type: integer
# @range: [-1, null]
# @unit: blocks
# @default: -1
raggioPiattaforma: -1

# Profondità (spessore verticale) della piattaforma di emergenza.
# @type: integer
# @range: [1, null]
# @unit: blocks
# @default: 1
profonditaPiattaforma: 1

# Altezza dello spazio d'aria liberato sopra la piattaforma di emergenza.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 2
altezzaAriaPiattaforma: 2

# Materiale usato per la piattaforma di atterraggio di emergenza.
# @type: material
# @source: material
# @default: GLASS
materialePiattaforma: "GLASS"

# Optional timeout, in seconds, after which the emergency landing platform's
# footprint is restored to the blocks that were there before it was built.
# -1 disables restoration (the platform is permanent, the previous behaviour).
# 0 restores as soon as the footprint chunk is loaded again; a positive value
# restores after that many seconds of loaded time. The countdown only advances
# while the footprint chunk is loaded (it pauses while the area is unloaded),
# and pending restores survive a server restart.
# @type: integer
# @range: [-1, null]
# @unit: seconds
# @default: -1
platformRestoreSeconds: -1

