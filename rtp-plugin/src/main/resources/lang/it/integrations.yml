# --- Impostazioni di integrazione di RTP ---
# Ogni opzione riestrae la destinazione se cade all'interno di un claim/una regione del plugin indicato (attiva solo se quel plugin è installato).
# Riestrae la posizione se cade all'interno di un claim di Factions.
# @type: boolean
# @default: false
rerollFactions: false

# Riestrae la posizione se cade all'interno di un claim di GriefDefender.
# @type: boolean
# @default: false
rerollGriefDefender: false

# Riestrae la posizione se cade all'interno di un claim di GriefPrevention.
# @type: boolean
# @default: false
rerollGriefPrevention: false

# Riestrae la posizione se cade all'interno di un claim di HuskTowns.
# @type: boolean
# @default: false
rerollHuskTowns: false

# Riestrae la posizione se cade all'interno di un claim di Lands.
# @type: boolean
# @default: false
rerollLands: false

# Riestrae la posizione se cade all'interno di una regione di RedProtect.
# @type: boolean
# @default: false
rerollRedProtect: false

# Riestrae la posizione se cade all'interno di un claim di Towny Advanced.
# @type: boolean
# @default: false
rerollTownyAdvanced: false

# Riestrae la posizione se cade all'interno di una regione di WorldGuard.
# @type: boolean
# @default: false
rerollWorldGuard: false

# NON TOCCARE IL NUMERO DI VERSIONE
version: 1.0
