# Reroll the location if it lands inside a SaberFactions claim.
# @type: boolean
# @default: false
rerollSaberFactions: false

# Reroll the location if it lands inside Factions territory reported via the FactionsBridge API.
# FactionsBridge bridges many Factions forks (FactionsUUID, SaberFactions, FactionsX, KingdomsX, ...)
# behind one API; enable this when the FactionsBridge plugin is installed.
# @type: boolean
# @default: false
rerollFactionsBridge: false

# Riestrae la posizione se cade all'interno di un claim di GriefDefender.
# @type: boolean
# @default: false
rerollGriefDefender: false

# Riestrae la posizione se cade all'interno di un claim di GriefPrevention.
# @type: boolean
# @default: false
rerollGriefPrevention: false

# Riestrae la posizione se cade all'interno di un claim di Lands.
# @type: boolean
# @default: false
rerollLands: false

# Riestrae la posizione se cade all'interno di una regione di RedProtect.
# @type: boolean
# @default: false
rerollRedProtect: false

# Reroll the location if it lands inside a Residence claim.
# @type: boolean
# @default: false
rerollResidence: false

# Reroll the location if it lands inside a CrashClaim claim.
# @type: boolean
# @default: false
rerollCrashClaim: false

# Reroll the location if it lands inside a HuskClaims claim.
# @type: boolean
# @default: false
rerollHuskClaims: false

# Reroll the location if it lands inside KingdomsX claimed land.
# @type: boolean
# @default: false
rerollKingdomsX: false

# Riestrae la posizione se cade all'interno di un claim di Towny Advanced.
# @type: boolean
