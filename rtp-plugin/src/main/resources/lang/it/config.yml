# --- Configurazione principale di RTP ---
# Documentazione: plugins/RTP/docs/admin/configuration/CORE_CONFIG.md
# La selezione della lingua ora risiede in language.yml (caricato prima di config.yml).
# Tempo di attesa prima che un teletrasporto in coda venga eseguito.
# 0 teletrasporta immediatamente (salta la finestra di annullamento per movimento).
# Supporta unità di durata (es. 2s, 40t, 1500ms).
# Interagisce con cancelDistance qui sotto.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 2
ritardoTeletrasporto: 2

# Distanza massima che un giocatore può percorrere durante teleportDelay prima
# che il teletrasporto in coda venga annullato.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 2
distanzaAnnullamento: 2

# Tempo di attesa tra usi riusciti di /rtp dallo stesso giocatore.
# Aggirato da rtp.nocooldown. Supporta unità di durata (es. 5m, 300s, 1h).
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 300
raffreddamentoTeletrasporto: 300

# Numero massimo di usi riusciti di /rtp che un giocatore può effettuare entro la
# finestra lockAfterResetSeconds prima di essere bloccato (parità con LockAfter di BetterRTP).
# 0 disabilita il limite. Aggirato da rtp.nolock.
# @type: integer
# @range: [0, null]
# @default: 0
lockAfterUses: 0

# Durata della finestra mobile del limite d'uso per lockAfterUses. Il contatore si azzera
# dopo questo numero di secondi dal primo uso della finestra. 0 significa che il limite non
# si azzera mai (un limite a vita). Supporta unità di durata (es. 24h, 1d).
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 0
lockAfterResetSeconds: 0

# Se true, un /rtp riuscito imposta il luogo di atterraggio come punto di
# rinascita persistente del giocatore (parità con BetterRTP).
# @type: boolean
# @default: false
setRespawnOnTeleport: false

# Comandi della console eseguiti su teletrasporto riuscito. Usa [player] per
# il nome del giocatore di destinazione. Le voci di stringa vuote sono ignorate.
# @type: list<string>
comandiConsole:
  - "say [player] si è appena teletrasportato casualmente!"

# Comandi eseguiti come il giocatore che si teletrasporta su teletrasporto riuscito.
# Usa [player] per il nome del giocatore di destinazione. Le voci di stringa vuote sono ignorate.
# @type: list<string>
comandiGiocatore:
  - ""

# Framework di menù generalizzato.
# `renderer` è una lista ordinata di preferenze di id di renderer. In caso di
# eccezione o di adattatore mancante il framework percorre la lista e ripiega
# sulla voce successiva. Se la lista è esaurita, il percorso di apertura di pagina
# senza token ripiega sul messaggio configurabile `menuInvalid`. Id disponibili:
# book. (Il renderer chat arriva in un follow-up e sarà aggiunto alla lista
# predefinita a quel punto.)
menu:
  # Ordered preference list of renderer ids.
  # @type: list<enum>
  # @options: ["book", "chat"]
  renderer:
    - "book"

# Valori predefiniti globali ereditati dai file di regione/mondo tramite il token "@config".
defaults:
  # Forma e dimensione predefinite dell'area, utilizzate da ogni regione la cui forma è "@config".
  #
  # LE DIMENSIONI QUI SONO PREDEFINITE IN CHUNK (1 chunk = 16 blocchi):
  #   radius: 64   ->  1.024 blocchi dal centro
  #   radius: 256  ->  4.096 blocchi dal centro   (il valore predefinito qui sotto)
  #   radius: 625  -> 10.000 blocchi dal centro
  #
  # SUFFISSI DELLE UNITÀ SPAZIALI:
  # Puoi anche usare unità esplicite direttamente su radius, centerRadius, ecc.:
  #   radius: 4096b   (o 4096 blocks, 4096m)
  #   radius: 256c    (chunk)
  #   radius: 4r      (file di regione Anvil = 32 chunk = 512 blocchi)
  #   radius: 5km     (chilometri = 5000 blocchi)
  #
  # radius       = bordo esterno. Nessuno atterra più lontano di così.
  # centerRadius = bordo interno / foro a ciambella. Nessuno atterra più vicino di così.
  #                Deve rimanere inferiore a radius, altrimenti non rimane terra tra cui scegliere.
  shape:
    # Landing area shape algorithm.
    # @type: enum
    # @source: shape
    name: "CIRCLE"
    mode: "ACCUMULATE"
    radius: 256
    centerRadius: 64
    centerX: 0
    centerZ: 0
    weight: 1.0

    # Keep spots from being reused. 0 = off, 1 = the landing chunk, N = bigger square.
    uniquePlacements: 0
    expand: false

  # Default high/low landing window.
  vert:
    # Vertical placement algorithm.
    # @type: enum
    # @source: vert
    name: "LINEAR"
    minY: 32
    maxY: 255

    # Search order: 0 = bottom-up, 1 = top-down, 2 = middle-out, 3 = edges-in, else random.
    direction: 2
    requireSkyLight: true

  # How many safe spots to pre-calculate.
  cacheCap: 50

  # Extra unverified spots kept ready. 0 = off.
  backlogCacheCap: 1000

  # Max chunks kept loaded for instant teleports.
  activeChunkCap: 10

  # Bad-spot tracking precision (1-5).
  spatialResolution: 3

  # Whether regions/worlds need permission.
  requirePermission: false

# NON MODIFICARE IL NUMERO DI VERSIONE
versione: 3.1
