# --- Messaggi RTP (questa lingua) ---
# Testi dei messaggi per giocatori e operatori in questa lingua, raggruppati per argomento.
# Copia generata automaticamente dai messaggi inglesi; non modificare a mano (viene sovrascritto).

# --- Messaggi di modalità di rete tra server ---
# Inviati solo quando `network.enabled: true` e il `/rtp` del giocatore viene instradato
# attraverso la coda di attesa tra server (vedere network.yml `routing.mode`).
# Tutte le chiavi sono facoltative dal punto di vista del giocatore: il ciclo di base
# `delayMessage` / `teleportMessage` gestisce comunque il flusso visibile.
# Inviato quando la richiesta è stata accettata nella coda di attesa tra server
# ed è in attesa di assegnazione a un backend. Segnaposto: [position] - posizione
# indicizzata da 0 da `pollStatus`; può essere vuota se il trasporto non restituisce
# alcuna posizione.
networkQueued: "&7[P0] in coda per una destinazione tra server (posizione [position])..."

# Inviato quando un giocatore esegue /rtp mentre è già in attesa nella coda tra server.
# Segnaposto: [position] - posizione in fila; può essere vuoto.
alreadyQueued: "&cSei già in attesa nella coda tra server (posizione [position]). Attendi."

# Inviato quando una voce della coda tra server ha atteso troppo a lungo ed è stata rimossa.
# Nessun segnaposto.
networkTimedOut: "&c[P0] il teletrasporto tra server è scaduto in attesa di un backend."

# Inviato quando la coda tra server è piena e la richiesta viene rifiutata.
# Nessun segnaposto.
waitlistFull: "&c[P0] la coda tra server è piena; riprova a breve."

# Inviato quando la coda ha passato la richiesta al router proxy ed
# è in corso la selezione di un backend.
networkRouting: "&7[P0] instradamento verso un backend..."

# Inviato quando un backend ha riservato una coordinata per questo giocatore e il
# proxy sta per avviare il passaggio tra server. Segnaposto: [server]
# - il serverId del backend di destinazione.
networkReserved: "&a[P0] coordinata riservata su [server]. Trasferimento..."

# Inviato mentre il proxy sta effettuando il passaggio. Segnaposto: [server] - destinazione.
networkTransferring: "&a[P0] trasferimento a [server]..."

# Inviato quando il percorso tra server ha fallito e si è ripiegato sul server locale.
# Segnaposto: [reason] - il motivo del ripiego.
networkFallback: "&e[P0] tra server non disponibile ([reason]); ritorno al locale."

# Inviato quando la richiesta tra server è fallita e non è stato possibile alcun ripiego.
# Segnaposto: [reason] - il motivo del fallimento.
networkFailed: "&c[P0] teletrasporto tra server fallito: [reason]."

# Inviato quando il giocatore ha richiesto una regione specifica (`/rtp <region>`) ma
# nessun backend nella rete la sta attualmente servendo. Segnaposto:
# [region] - il nome della regione richiesta.
networkRegionUnavailable: "&c[P0] nessun backend sta servendo la regione '[region]' al momento."

# Inviato quando il nome della regione richiesta corrisponde a due o più backend e
# i criteri configurati dall'operatore non possono sceglierne uno (si attiva solo
# con criteri più restrittivi rispetto al `warn` predefinito). Segnaposto: [region].
networkRegionAmbiguous: "&c[P0] la regione '[region]' è ambigua tra i backend; fissa un server."

# NON MODIFICARE IL NUMERO DI VERSIONE
version: 1.0
