# ###############################################################################
# Sezione 6: Comando di scansione
# ###############################################################################
# messaggi relativi al comando di scansione
# segnaposto: [scan_regions] - lista delle regioni
avvioScansione: "&a[P0] scansione avviata per le regioni: [scan_regions]"
resetScansione: "&7[P0] coda di scansione azzerata per le regioni: [scan_regions]"
annullaScansione: "&7[P0] scansione annullata per le regioni: [scan_regions]"
pausaScansione: "#A020F0[P0] scansione in pausa per le regioni: [scan_regions]"
riprendiScansione: "#10A5F5[P0] scansione ripresa per le regioni: [scan_regions]"
scansioneInCorso: "&c[P0] scansione già in corso per le regioni: [scan_regions]"
scansioneNonInCorso: "&c[P0] scansione non in corso per le regioni: [scan_regions]"

# segnaposto: [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
statoScansione: "[P0] &8» &7[scan_regions] &8| &7[scan_chunks]&8/&7[scan_totalChunks] &8| #7E9CC8[scan_cps]&7 cps &8| #7E9CC8[scan_landPercentage]%&7 terra &8| &7ETA #7E9CC8[scan_eta]"

# Titolo della boss-bar mostrato ai giocatori con il permesso rtp.scan mentre è in corso una scansione del mondo.
# Impostare su stringa vuota per disabilitare la boss-bar.
# Il colore della barra è determinato dal primo codice colore legacy in questo valore:
#   &c/&4 = rosso, &e/&6 = giallo, &a/&2 = verde, &9/&1/&3/&b = blu,
#   &5 = viola, &d = rosa, &f/&7/&8/&0 = bianco. Predefinito verde se assente.
# segnaposto: [scan_regions], [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
scanBossBar: "Scansione di [scan_regions]: [scan_chunks]/[scan_totalChunks] ([scan_landPercentage]% terra) ETA [scan_eta]"

