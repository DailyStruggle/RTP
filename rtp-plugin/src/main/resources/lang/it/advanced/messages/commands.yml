# Suggerimento inviato quando la visualizzazione a libro ripiega sul dump YAML grezzo in chat
# (nessun renderizzatore di libri disponibile su questa piattaforma).
configViewRawHint: "&7[P0] vista libro non disponibile; ripiego sul dump grezzo."

# Testo segnaposto visualizzato al posto di un valore di configurazione che non è stato impostato.
configValueUnsetPlaceholder: "&8(non impostato)"

# Riga di intestazione non cliccabile che separa l'elenco "Modificabile" dall'elenco "In attesa"
# nel carrello in una pagina di file di configurazione quando il visualizzatore ha preparato una o
# più modifiche non confermate. Nessun segnaposto. Evitare giallo (&e/&6) e bianco (&f): la pergamena del libro li rende sbiaditi.
configPendingHeader: "&6&l-- pending changes --"

# Etichetta per riga per una voce key=value preparata (in attesa) in una pagina di file di configurazione.
# Cliccando sulla riga la si rimuove dal carrello. Segnaposto: [key], [value].
# Evitare giallo/bianco sulla pergamena del libro.
configPendingRowFormat: "&9[key]&8 = &0[value]"

# Testo al passaggio del mouse mostrato quando il visualizzatore passa su una riga in attesa (preparata) in una
# pagina di file di configurazione. Nessun segnaposto.
configPendingRowHover: "clicca per annullare"

# Etichetta cliccabile per la riga "applica modifiche preparate" in una pagina di file di configurazione.
# Esegue il comando assemblato /rtp config <file> k1=v1 ... e svuota il carrello.
configApplyRow: "&2&l[apply]"

# Etichetta cliccabile per la riga "annulla modifiche preparate" in una pagina di file di configurazione.
# Svuota il carrello senza applicare.
configDiscardRow: "&c&l[discard]"

# --- Rendering di mappe / grafici ---
# Inviato quando si clicca su una riga della mappa ma il rendering delle mappe non è disponibile su questo
# server (es. la build Lite, o nessun provider di mappe installato).
mapBindingMissing: "&c[P0] il rendering delle mappe non è disponibile su questo server."

# Inviato quando viene richiesto un grafico ma nessun renderer è registrato per quel
# tipo di grafico.
mapResolverMissing: "&c[P0] nessun resolver di grafici registrato per questa richiesta."

# Inviato quando un resolver viene eseguito ma la fonte dati sottostante non è disponibile
# per la destinazione richiesta (regione sconosciuta, nessun dato ancora disponibile, mondo scaricato).
# Segnaposto: [region] - il nome della regione richiesta (può essere vuoto).
mapUnavailable: "&e[P1] i dati del grafico non sono disponibili al momento."

# Inviato quando il servizio mappe non può allocare una mappa in questo momento (es. è stato
# raggiunto un limite per spettatore).
mapBusy: "&e[P1] il servizio mappe è occupato; riprova tra poco."

# Etichetta per la riga del menu cliccabile "/rtp info" che genera una mappa termica delle
# posizioni non sicure note della regione corrente. Nascosta quando il rendering delle mappe
# non è disponibile su questo server.
menuInfoBadPointsLabel: "#9D7CD8&l# mappa dei punti non sicuri"

