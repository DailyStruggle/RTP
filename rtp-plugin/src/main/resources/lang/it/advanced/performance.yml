# TPS minimo del server richiesto per continuare l'accodamento in background.
# Il lavoro in background si mette in pausa quando i TPS scendono sotto questa soglia.
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
tpsMinimo: 19.0

# Uso massimo dell'heap JVM (% del massimo) prima di mettere in pausa il riempimento
# della cache in background. Le posizioni già in cache restano servite. 0 o 100 disabilita.
# @type: number
# @range: [0.0, 100.0]
# @default: 85.0
maxHeapPercentuale: 85.0

# --- Impostazioni di prestazione di RTP ---
# Documentazione: plugins/RTP/docs/admin/configuration/PERFORMANCE.md
# Numero massimo di tentativi di ricerca per invocazione di /rtp prima di rinunciare.
# @type: integer
# @range: [1, null]
# @default: 32
tentativiMassimi: 32

# Tick tra cicli di cache in background (pre-riempimento regione, ricarica coda).
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
periodo: 20

# Massimo di millisecondi per tick spesi in task sincroni.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
tempoAssegnatoSinc: 50

# Massimo di millisecondi per tick spesi in task asincroni.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
tempoAssegnatoAsinc: 50

# Raggio in chunk caricato attorno a una posizione candidata durante la selezione.
# 0 carica solo il chunk candidato.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
distanzaVisualeSelezione: 0

# Raggio in chunk caricato attorno alla posizione finale immediatamente prima
# del teletrasporto. 0 carica solo il chunk di destinazione.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
distanzaVisualeTeletrasporto: 0

# Tick durante i quali la distanza di visuale di un giocatore teletrasportato torna
# normale dopo l'arrivo, smussando il picco di caricamento chunk. 0 disabilita il limite.
# @type: integer
# @range: [0, null]
# @unit: ticks
# @default: 200
intervalloRipristinoVisuale: 200

# Riempi la cache della regione immediatamente dopo un teletrasporto riuscito.
# @type: boolean
# @default: false
accodamentoPostTeletrasporto: false

# Registra i biomi dai chunk già caricati nella memoria spaziale, alimentando il
# richiamo / la ponderazione dei biomi. Nessun I/O di chunk aggiuntivo.
# @type: boolean
# @default: true
controlloCaricamentoChunk: true

# Frazione della capacità del backlog L3 alla quale riprende il riempimento (isteresi).
# 0.5 = riempi dopo lo svuotamento al 50%; 1.0 = riempi di continuo.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.5
sogliaRiempimentoArretrato: 0.5

# Probabilità di rifiutare un chunk non generato per tentativo.
# 0.0 = nessun bias, 1.0 = evita terreni non generati. I chunk generati passano sempre.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.0
preferenzaPregenerati: 0.0

# Riserva una cache di posizioni per i teletrasporti all'ingresso
# (rtp.onevent.firstjoin / rtp.onevent.join).
# @type: boolean
# @default: false
cacheLoginAttiva: false

# Limite massimo per la cache di login. 0 = auto (max-players del server,
# snapshot all'avvio).
# @type: integer
# @range: [0, null]
# @default: 0
limiteCacheLogin: 0

# Riutilizza dalle cache le posizioni già trovate corrispondenti al bioma.
# @type: boolean
# @default: true
richiamoBioma: true

# Serve le richieste filtrate per bioma solo dalla cache (non genera mai nuove
# ricerche di bioma). Richiede biomeRecall.
# @type: boolean
# @default: false
richiamoBiomaForzato: false

# Indirizza ogni bioma richiesto con uguale probabilità invece che in base a quanta
# regione copre. Richiede biomeRecall; nessun effetto sui teletrasporti non filtrati.
# @type: boolean
# @default: false
biomaPesato: false

# Pesi relativi per bioma per i teletrasporti filtrati per bioma. Usati solo quando
# biomeWeighted è true. I biomi non elencati usano 1.0 (nessun bias); 2.0 = scelto
# ~il doppio delle volte, 0.0 = soppresso. L'intero set vanilla è preelencato a 1.0
# come riferimento modificabile; aggiungi i biomi moddati con il loro id di
# piattaforma (es. terralith:emerald_peaks). Richiede biomeRecall.
# @type: map<string, number>
pesiBioma:
  # Peso di selezione relativo per questo bioma (1.0 = nessun bias).
  # @type: number
  # @range: [0.0, null]
  # @default: 1.0
  plains: 1.0
  sunflower_plains: 1.0
  snowy_plains: 1.0
  ice_spikes: 1.0
  desert: 1.0
  swamp: 1.0
  mangrove_swamp: 1.0
  forest: 1.0
  flower_forest: 1.0
  birch_forest: 1.0
  dark_forest: 1.0
  old_growth_birch_forest: 1.0
  old_growth_pine_taiga: 1.0
  old_growth_spruce_taiga: 1.0
  taiga: 1.0
  snowy_taiga: 1.0
  savanna: 1.0
  savanna_plateau: 1.0
  windswept_hills: 1.0
  windswept_gravelly_hills: 1.0
  windswept_forest: 1.0
  windswept_savanna: 1.0
  jungle: 1.0
  sparse_jungle: 1.0
  bamboo_jungle: 1.0
  badlands: 1.0
  eroded_badlands: 1.0
  wooded_badlands: 1.0
  meadow: 1.0
  cherry_grove: 1.0
  pale_garden: 1.0
  grove: 1.0
  snowy_slopes: 1.0
  frozen_peaks: 1.0
  jagged_peaks: 1.0
  stony_peaks: 1.0
  river: 1.0
  frozen_river: 1.0
  beach: 1.0
  snowy_beach: 1.0
  stony_shore: 1.0
  warm_ocean: 1.0
  lukewarm_ocean: 1.0
  deep_lukewarm_ocean: 1.0
  ocean: 1.0
  deep_ocean: 1.0
  cold_ocean: 1.0
  deep_cold_ocean: 1.0
  frozen_ocean: 1.0
  deep_frozen_ocean: 1.0
  mushroom_fields: 1.0
  dripstone_caves: 1.0
  lush_caves: 1.0
  deep_dark: 1.0
  # --- Il Nether ---
  nether_wastes: 1.0
  warped_forest: 1.0
  crimson_forest: 1.0
  soul_sand_valley: 1.0
  basalt_deltas: 1.0
  # --- L'End ---
  the_end: 1.0
  end_highlands: 1.0
  end_midlands: 1.0
  small_end_islands: 1.0
  end_barrens: 1.0
  # --- Varie / tecnico ---
  the_void: 1.0

# Soglia di latenza (ms) oltre la quale un teletrasporto servito subito viene
# verificato (WARN registrato, slowPipelineCount incrementato). 0 o meno disabilita.
# @type: integer
# @range: [0, null]
# @unit: ms
# @default: 5000
sogliaPipelineLentaMs: 5000

# Profondità della coda (giocatori in attesa) alla quale la contropressione viene
# verificata (WARN registrato, queueGrowthWarnCount incrementato). 0 o meno disabilita.
# @type: integer
# @range: [0, null]
# @unit: players
# @default: 0
sogliaAvvisoCrescitaCoda: 0

# Usa il caricamento sincrono dei chunk. NON CONSIGLIATO. Viola lo spirito di S-005
# su Folia e bloccherà il thread principale su Paper/Spigot.
# @type: boolean
# @default: false
caricamentoSinc: false

# Ri-analizza i nodi di permesso ad ogni evento invece di metterli in cache.
# @type: boolean
# @default: false
parsingSuEvento: false

# Analizza i nodi di permesso degli effetti all'avvio.
# @type: boolean
# @default: true
parsingEffetti: true

# Attiva la raccolta dati in background per l'analisi dei visitatori.
# @type: boolean
# @default: false
visitatoreAttivo: false

# Impostazioni per /rtp admin prefab. Il flusso apply -> confirm scrive un backup
# per file modificato; bakRetention limita quanti se ne tengono (i più vecchi eliminati).
prefabbricato:
  # Number of timestamped config backups kept per file before pruning.
  # @type: integer
  # @range: [1, null]
  # @default: 3
  bakRetention: 3
# NON MODIFICARE IL NUMERO DI VERSIONE
versione: 1.0
