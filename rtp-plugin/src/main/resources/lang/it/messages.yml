infoTeletrasporti: "&7Macchine a stati di teletrasporto attive: #7E9CC8[teleports]"
infoMSPT: "&7MSPT attuale del plugin: #7E9CC8[mspt]"
infoCaricamentiTotali: "&7Chunk caricati totali: #7E9CC8[loads]"
