# --- Messaggi visibili agli utenti di RTP ---
# Tutte le stringhe visibili ai giocatori e alla console.
# Formattazione:
# - Codici colore legacy di Bukkit (es. &a, &e, &c)
# - Codici colore esadecimali (es. #2636ef)
# - Segnaposto di PlaceholderAPI (quando PAPI è installato)
# Segnaposto:
# - I segnaposto condivisi "[Pn]" sono definiti nella lista `placeholders` qui sotto.
# [P0] è il prefisso RTP per impostazione predefinita.
# - I segnaposto specifici per messaggio (es. [attempts], [world]) sono documentati
# in linea sopra ogni messaggio che li usa.
# ###############################################################################
# Sezione 1: Configurazione generale
# ###############################################################################
# lista di segnaposto aggiuntivi
# formato: Pn - dove n è l'indice in questa lista
segnaposto:
  # P0
  - "[RTP]"

# ###############################################################################
# Sezione 2: Teletrasporto
# ###############################################################################
# durante il teletrasporto, mostra questo
giàTeletrasporto: "&e[P0] ti stai già teletrasportando!"

# se il plugin si sta attualmente ricaricando
teletrasportoNegatoRicaricamento: "&e[P0] i teletrasporti sono temporaneamente disattivati mentre il plugin si ricarica. Riprova tra poco."
messaggioRitardo: "&e[P0] Teletrasporto in [delay]. Non muoverti"
caricamentoChunk: "&e[P0] Caricamento dei chunk! attendere..."
messaggioTeletrasporto: "&e[P0] Teletrasportato in [attempts] tentativi, in [processingTime]"

# se il teletrasporto viene annullato
teletrasportoAnnullato: "&e[P0] Teletrasporto annullato!"

# se non ci sono posizioni sicure dopo aver raggiunto il numero massimo di tentativi
# segnaposto: [attempts] - il numero massimo di tentativi
nonSicuro: "&e[P0] impossibile trovare una posizione sicura entro [attempts] tentativi"

# quando il giocatore è in cooldown
# segnaposto: [remainingCooldown] - il tempo rimanente
messaggioRaffreddamento: "&e[P0] Non puoi teletrasportarti di nuovo per [remainingCooldown]"

# se la regione non ha posizioni in coda e il giocatore non ha il permesso rtp.unqueued
nessunaPosizioneInCoda: "#f5eb73[P0] nessuna posizione pronta in questo momento"

# quando la fila in coda si sposta
# segnaposto: [spot] - la posizione attuale in coda
aggiornamentoCoda: "#2636ef[P0] il tuo posto in coda: [spot]"

# se il giocatore non ha abbastanza denaro per teletrasportarsi nella regione
# segnaposto: [money] - quanto denaro è richiesto per il comando
denaroInsufficiente: "&e[P0] ti servono almeno $[money] per questo."

# ###############################################################################
# Sezione 3: Formattazione del tempo
# ###############################################################################
# per i segnaposto temporali, come chiamare giorni, ore, minuti, secondi e millisecondi
giorni: "g"
ore: "h"
minuti: "m"
secondi: "s"
millisecondi: "ms"

# ###############################################################################
# Sezione 4: Sistema e gestione
# ###############################################################################
# la 'version' di un file di configurazione è inferiore all'ultima
# segnaposto: [filename] - nome del file, inclusa l'estensione
fileVecchio: "&b[P0] rilevato [filename] vecchio. Aggiornamento in corso"

# rilevato un mondo di Bukkit che non è nel file di configurazione
# segnaposto: [world] - il mondo rilevato
nuovoMondo: "&b[P0] rilevato un nuovo mondo '[world]'"

# il mondo non esiste in Bukkit
# segnaposto: [world] - il nome del mondo
mondoNonValido: "&e[P0] impossibile trovare il mondo '[world]'"

# testo di ricaricamento/aggiornamento del plugin
# segnaposto: [filename] - nome del file
ricaricamento: "&b[P0] caricamento di [filename]..."
ricaricato: "&b[P0] [filename] caricato con successo."
aggiornamento: "&a[P0] aggiornamento di [filename]..."
aggiornato: "&a[P0] [filename] aggiornato con successo."

# il plugin non ha il comando richiesto dall'utente
# segnaposto: [arg] - l'argomento tentato
argomentoNonValido: "&c[P0] argomento di comando non valido [arg]"

# quando la console prova a eseguire un comando destinato solo ai giocatori
comandoConsoleNonPermesso: "&c[P0] Devi essere un giocatore in gioco per eseguire questo comando."

# il plugin è occupato a ricaricare
busy: "&c[P0] occupato"

# il plugin non ha il sottocomando o parametro richiesto dall'utente
# segnaposto: [arg] - l'argomento tentato
invalidCommand: "&c[P0] comando non valido - [arg]"

# l'utente non ha il permesso per il comando richiesto
senzaPermessi: "&eMi dispiace, ma non hai il permesso di eseguire questo comando. Contatta gli amministratori del server se ritieni che sia un errore."

# ###############################################################################
# Sezione 5: Log amministrativi
# ###############################################################################
# registrato quando le posizioni vengono salvate/caricate dal database
# segnaposto: [amount] - numero di posizioni
# segnaposto: [region] - nome della regione
posizioneSalvata: "&e[P0] Salvate con successo [amount] posizioni per [region]"
posizioneCaricata: "&e[P0] Caricate con successo [amount] posizioni per [region]"

# ###############################################################################
# Sezione 6: Comando di scansione
# ###############################################################################
# messaggi relativi al comando di scansione
# segnaposto: [scan_regions] - lista delle regioni
avvioScansione: "&a[P0] scansione avviata per le regioni: [scan_regions]"
resetScansione: "&e[P0] coda di scansione azzerata per le regioni: [scan_regions]"
annullaScansione: "&e[P0] scansione annullata per le regioni: [scan_regions]"
pausaScansione: "#A020F0[P0] scansione in pausa per le regioni: [scan_regions]"
riprendiScansione: "#10A5F5[P0] scansione ripresa per le regioni: [scan_regions]"
scansioneInCorso: "&c[P0] scansione già in corso per le regioni: [scan_regions]"
scansioneNonInCorso: "&c[P0] scansione non in corso per le regioni: [scan_regions]"
# segnaposto: [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
statoScansione: "&a[P0] completati [scan_chunks] / [scan_totalChunks] chunk per le regioni: [scan_regions]. [scan_cps] cps. Percentuale di terra: [scan_landPercentage]%. ETA: [scan_eta]"

# ###############################################################################
# Sezione 7: Comando Info
# ###############################################################################
# messaggi relativi al comando info
titoloInfo: "&a======Informazioni RTP======"
infoTicket: "&7Ticket di chunk globali attivi: &f[tickets]"
infoTeletrasporti: "&7Macchine a stati di teletrasporto attive: &f[teleports]"
infoMSPT: "&7MSPT attuale del plugin: &f[mspt]"
infoCaricamentiTotali: "&7Chunk caricati totali: &f[loads]"
infoCaricamentiPerOrigine: "&7Caricamenti per origine: &f[loadsByOrigin]"
infoTassoFughe: "&7Tasso attuale di fughe di chunk: &f[leakRate]"
# --- Blocco di salute del SPI metriche (METRICS_PLAN.md > /rtp info Surface) ---
infoProfonditaCoda: "&7Giocatori in attesa nelle code di regione: &f[queueDepth]"
infoTeletrasportiInAttesa: "&7Pipeline di teletrasporto in attesa: &f[pendingTeleports]"
infoMediaPipelineMs: "&7Latenza media pipeline: &f[avgPipelineMs] ms"
infoHeap: "&7Heap JVM: &f[heapUsedMb] / [heapMaxMb] MiB"
# Riga di intestazione per il blocco etichettato Salute pipeline in /rtp info.
infoIntestazioneSalutePipeline: "&7--- Salute: pipeline ---"
# Lettura TPS per le finestre 1m / 5m / 15m. Segnaposto: [tps1m] [tps5m] [tps15m].
infoTps: "&7TPS (1m/5m/15m): &f[tps1m] / [tps5m] / [tps15m]"
# MSPT del server live e utilizzo del budget tick. Segnaposto: [mspt] [tickBudgetUtilisation].
infoMSPTLive: "&7MSPT del server: &f[mspt] ms (&7budget tick: &f[tickBudgetUtilisation]&7)"
# Soft-cap configurato dei giocatori vs il conteggio online attuale. Segnaposto: [softCap] [playerCount].
infoSoftCap: "&7Giocatori: &f[playerCount] / [softCap]"
# Latenza round-trip più recente del database in ms. Segnaposto: [databaseLatencyMs].
infoLatenzaDatabaseMs: "&7Latenza database: &f[databaseLatencyMs] ms"
# Soglie delle fasce colore di salute. Double consumati da ColourBands in rtp-core
# per avvolgere i segnaposto di varianti colorate (es. [tps1mColoured]) con &a/&e/&c.
infoSogliaTpsVerde: 19.5
infoSogliaTpsGialla: 18.0
infoSogliaMsptVerde: 30.0
infoSogliaMsptGialla: 45.0
infoSogliaRiempCacheVerde: 0.5
infoSogliaRiempCacheGialla: 0.25
infoSogliaEtaReteGialla: 5.0
# Riga di intestazione che introduce la tabella per-regione-Folia (solo runtime Folia).
infoIntestazioneRegioniFolia: "&7--- Regioni Folia ---"
# Modello di riga per una singola regione Folia. Segnaposto: [regionId] [tps1m]
# [mspt] [playerCount] [queueDepth] [tickBudgetUtilisation].
infoRegioneFolia: "  &f[regionId]&7: tps=&f[tps1m]&7 mspt=&f[mspt]&7 giocatori=&f[playerCount]&7 coda=&f[queueDepth]&7 budget=&f[tickBudgetUtilisation]"
infoIntestazioneDisclaimer: "&7--- Disclaimer diagnostico ---"
infoDisclaimer: "&7Nota diagnostica: se il conteggio totale dei chunk orfani del server supera i caricamenti totali di questo plugin ([loads]), questo plugin non è l'unica fonte del leak di memoria."
infoIntestazioneMondo: "#008080Mondi:"
infoIntestazioneMondoConsole: "&7--- Mondi ---"
infoMondo: "  #21ADA8[world]"
infoIntestazioneRegione: "#63C5DARegioni:"
infoIntestazioneRegioneConsole: "&7--- Regioni ---"
infoRegione: "  #52B2BF[region]"

# sotto-elenchi di info
# segnaposto: [world], [region], [requirePermission], [override], [shape], [worldBorderOverride], [cacheCap], [cached], [keptCache], [unkeptCache], [backlogCache], [backlogCacheCap]
infoMondoDati:
  - "#21ADA8[world]:"
  - "#99EEBB  - regione: [region]"
  - "#99EEBB  - richiediPermesso: [requirePermission]"
  - "#99EEBB  - sovrascrivi: [override]"

infoRegioneDati:
  - "#52B2BF[region]:"
  - "#58CCED  - mondo: [world]"
  - "#58CCED  - forma: [shape]"
  - "#58CCED  - richiediPermesso: [requirePermission]"
  - "#58CCED  - sovrascriviBordiMondo: [worldBorderOverride]"
  - "#58CCED  - limiteCache: [cacheCap]"
  - "#58CCED  - cacheConservata (L1): [keptCache]"
  - "#58CCED  - cacheNonConservata (L2): [unkeptCache]"
  - "#58CCED  - cacheArretrata (L3): [backlogCache] / [backlogCacheCap]"
  - "#58CCED  - inCache: [cached]"

