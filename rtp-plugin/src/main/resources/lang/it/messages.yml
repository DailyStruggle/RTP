config_descrizione: "aggiorna i file di configurazione a runtime"
info_descrizione: "controlla lo stato attuale del plugin"
test_descrizione: "testa le funzioni di RTP"

# ###############################################################################
# Sezione 8b: Framework di menù generalizzato
# ###############################################################################
# Inviato quando un token di menù è sconosciuto, malformato o appartiene a un altro giocatore.
menuInvalid: "&c[P0] quel collegamento del menù non è valido."
# Inviato quando un token di menù è scaduto o già consumato.
menuExpired: "&c[P0] quel collegamento del menù è scaduto. Riapri il menù."
# Inviato quando un riscatto del menù non può risolvere l'UUID del giocatore chiamante.
menuUnknownPlayer: "&c[P0] i collegamenti del menù possono essere usati solo da giocatori in gioco."
# Modello di tooltip di fallback usato dal riflettore del menù quando nessun commento
# di blocco YAML è disponibile per un parametro. Segnaposto: [type] - il tipo di parametro dichiarato.
menuHoverFallbackType: "tipo: [type]"
# Modello di tooltip di fallback usato dal riflettore del menù quando un parametro espone
# un piccolo insieme curato di valori. Segnaposto: [values] - valori accettati separati da virgola.
menuHoverFallbackBounds: "accettati: [values]"
# Etichetta della riga di navigazione "torna indietro di un livello" anteposta a ogni pagina di menù non radice.
menuBack: "&7« indietro"
# Modello di etichetta della riga "esegui il comando assemblato" anteposta a ogni
# pagina di menù eseguibile non radice. Segnaposto: [command] - l'invocazione /rtp ... assemblata.
menuExecute: "&a▶ esegui [command]"
# Riga di intestazione in cima a una sotto-pagina selettore di valore di parametro (Fase A.2).
# Segnaposto: [param] - nome del parametro; [command] - invocazione /rtp ... assemblata.
menuPickValue: "&escegli un valore per [param] (eseguirà: /rtp [command] [param]:<valore>)"
# Etichetta della riga di fallback "digita un valore personalizzato" in una pagina selettore di valore.
# Cliccandola si precompila la chat con il comando assemblato fino a '<param>:' così che il giocatore
# possa digitare qualsiasi valore, anche quelli non nella lista dei suggerimenti.
menuTypeValue: "&7✎ digita un valore personalizzato..."
# Riga di intestazione non cliccabile in cima a ogni pagina di menù non radice (Fase A.4).
# Mostra l'invocazione /rtp attualmente costruita inclusi gli assegnamenti di parametri
# in attesa (nome:valore). Segnaposto: [command] - argomenti assemblati.
menuConstructed: "&7costruendo: &f/rtp [command]"
# Riga del titolo non cliccabile anteposta alla pagina del menù radice /rtp (Fase A.5).
# Fornisce un'intestazione di benvenuto prima che il giocatore entri in qualsiasi sottocomando.
menuRootTitle: "&6&l⚡ menù RTP"
# Riga di sottotitolo/suggerimento non cliccabile anteposta alla pagina del menù radice /rtp sotto
# menuRootTitle (Fase A.5). Breve testo di orientamento per utenti nuovi.
menuRootHint: "&7clicca un'opzione qui sotto per iniziare"
# Righe di navigazione aggiunte alle pagine di menù paginate (Fase A.6) - cliccandole
# ci si sposta alla pagina precedente/successiva dello stesso modello. Segnaposto:
# [page] - il numero di pagina di destinazione leggibile (base 1).
menuPagePrev: "&7« pagina precedente ([page])"
menuPageNext: "&7pagina successiva ([page]) »"
# Divisore di sezione nella pagina iniziale sopra le righe di teletrasporto (vista giocatore).
menuFrontPageSectionTeleport: "&8--- &7teletrasporto &8---"
# Divisore di sezione nella pagina iniziale sopra le righe di amministrazione (vista admin).
menuFrontPageSectionAdmin: "&8--- &7admin &8---"
# Righe della pagina iniziale. Nessun segnaposto.
menuFrontPageRowTeleport: "&a▶ /rtp &7- teletrasportati in una posizione casuale"
menuFrontPageRowRegion: "&a▶ /rtp region:&7... &7- scegli una regione"
menuFrontPageRowBiome: "&a▶ /rtp biome:&7... &7- scegli un bioma"
menuFrontPageRowHelp: "&a▶ /rtp help &7- elenca i comandi"
menuFrontPageRowInfo: "&b▶ /rtp info &7- diagnostica del plugin"
menuFrontPageRowConfig: "&b▶ /rtp config &7- modifica i file di configurazione"
menuFrontPageRowScan: "&b▶ /rtp scan &7- pre-riempie le cache delle regioni"
menuFrontPageRowDiagnostics: "&c▶ /rtp test full &7- esegui la diagnostica completa"
menuFrontPageRowReload: "&c▶ /rtp reload &7- ricarica i file di configurazione"
# Testo tooltip per la riga di diagnostica che avverte del costo. Nessun segnaposto.
menuFrontPageHoverDiagnostics: "&7esegue la suite di diagnostica completa; potrebbe essere costosa"
# Testo tooltip per la riga di ricaricamento che avverte degli effetti collaterali. Nessun segnaposto.
menuFrontPageHoverReload: "&7ricarica tutti i file di configurazione; i teletrasporti in corso potrebbero esserne influenzati"

