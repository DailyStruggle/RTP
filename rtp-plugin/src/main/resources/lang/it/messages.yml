infoTeletrasportiInAttesa: "&7Pipeline di teletrasporto in attesa: #7E9CC8[pendingTeleports]"
infoMediaPipelineMs: "&7Latenza media pipeline: #7E9CC8[avgPipelineMs] ms"
# Pipeline-latency percentiles (ADR-053). Placeholders: [pipelineMsP50] [pipelineMsP75]
