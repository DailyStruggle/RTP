# --- Impostazioni economiche di RTP ---
# Documentazione: plugins/RTP/docs/admin/configuration/ECONOMY.md
# Rimborsa il costo detratto se il teletrasporto viene annullato (movimento durante
# teleportDelay, fallimento della pipeline, ecc.).
# @type: boolean
# @default: true
rimborsoAnnullamento: true

# Costo base addebitato per un /rtp riuscito.
# @type: number
# @range: [0.0, null]
# @default: 50.0
prezzo: 50.0

# Costo aggiuntivo addebitato quando si teletrasporta un altro giocatore (/rtp <altro>).
# @type: number
# @range: [0.0, null]
# @default: 200.0
prezzoAltro: 200.0

# Costo aggiuntivo addebitato quando si forniscono parametri a /rtp.
# @type: number
# @range: [0.0, null]
# @default: 1000000000.0
prezzoParametri: 1000000000.0

# Costo aggiuntivo addebitato quando si specifica un bioma nei parametri di /rtp.
# @type: number
# @range: [0.0, null]
# @default: 5000.0
prezzoBioma: 5000.0

# Saldo minimo che il giocatore deve mantenere dopo aver pagato. Il teletrasporto
# viene rifiutato se il saldo risultante scenderebbe sotto questa soglia.
# @type: number
# @range: [0.0, null]
# @default: 0.0
saldoMinimo: 0.0

# NON MODIFICARE IL NUMERO DI VERSIONE
versione: 1.0
