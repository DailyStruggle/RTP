# --- RTP Performance Settings ---
# Fine-tune the plugin for server performance.

# Maximum Search Attempts
# How many times the plugin will search for a safe location before stopping.
# Impact: HIGH - Higher values can significantly increase CPU usage per request.
maxAttempts: 10

# Destination Pre-loading (Chunks)
# The radius of chunks to pre-load around the destination.
# Number of chunks loaded is ( 1 + 2 * radius )^2.
# Impact: HIGH - Setting this too high can cause significant lag spikes on teleport.
viewDistanceSelect: 0
viewDistanceTeleport: 0

# Selection Frequency (Game Ticks)
# Time between searching for new locations to refill the region caches.
# ( 20 gameticks = 1 second ).
# Impact: MEDIUM - Lower values refill caches faster but use more CPU.
period: 100

# Task Time Allotment (Milliseconds)
# Maximum time (ms) to spend on RTP tasks per game tick. 
# Range: 0 - 50.
# Impact: MEDIUM - Higher values allow faster processing at the risk of tick time.
syncAllottedTime: 50
asyncAllottedTime: 50

# Minimum TPS Requirement
# Minimum server TPS before queuing a new location for the cache.
# Range: 0.0 - 20.0.
# Impact: LOW - Prevents the plugin from adding lag when the server is struggling.
minTPS: 19.0

# Post-Teleport Queueing
# If true, the plugin will try to refill the location cache immediately after an RTP.
# Impact: MEDIUM
postTeleportQueueing: false

# Synchronous Loading
# Use synchronous chunk loading for location selection.
# Impact: HIGH - NOT RECOMMENDED! Can cause significant server hangs.
syncLoading: false

# Permission Parsing (Startup)
# onEventParsing: Incompatible with broad *.* permissions.
# Impact: MEDIUM (onEvent) / LOW (effect)
onEventParsing: false
effectParsing: true

# Biome Selection Cache
# biomeRecall: Reuse previously found biome locations.
# biomeRecallForced: Only use biomes that have already been discovered and cached.
# Impact: LOW to MEDIUM
biomeRecall: true
biomeRecallForced: false

# Passive Chunk Check
# Check for safe locations within all loaded chunks in range of a region.
# Impact: HIGH - Can significantly increase server load on chunk load events.
checkOnChunkLoads: false

# DO NOT TOUCH VERSION NUMBER
version: "1.0"