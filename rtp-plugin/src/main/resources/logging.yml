# --- Plugin Logging Toggles ---
# Documentation: https://github.com/DailyStruggle/RTP/blob/master/docs/admin/CONFIGURATION.md#loggingyml--console-logging-verbosity

detailed_reload: false # Log all files reloaded during /rtp reload
detailed_region_init: false # Log region initialization details

command: false # Log player-executed RTP commands
teleport: true # Log successful teleport events

event_changeworld: true # Log RTP triggered by world changes
event_join: true # Log RTP triggered on join
event_respawn: true # Log RTP triggered on respawn
event_move: true # Log move event processing
event_teleport: true # Log teleport event processing

selection_failure: true # Log info when location selection fails

system_memory_tracker: false # Debug logs for memory activity
system_database: false # Debug logs for database activity

# Plugin-scoped minimum log level. Effective filter is the finer of this and the
# Bukkit logger's own level. Accepts: SEVERE, WARNING, INFO, CONFIG, FINE, FINER,
# FINEST, ALL, OFF. Default ALL keeps behavior identical to the Bukkit logger.
min_level: INFO

# DO NOT TOUCH VERSION NUMBER
version: "1.0"
