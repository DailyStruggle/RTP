# RTP Network Mode (multi-server / multi-proxy)
#
# Disabled by default; flipping
# `network.enabled: true` opts this backend into the cross-server network.
#
# REQ-RTP-NET-002 (Behavioural Parity When Disabled): when `enabled: false`
# this file is read, validated, and otherwise ignored - no threads start,
# no database tables are created, no transport opens. The backend behaves
# byte-identically to a build without network mode.
network:
  enabled: false
  # Stable backend identity. Required when `enabled: true`. No default - the
  # operator MUST supply one; two backends sharing a serverId will overwrite
  # each other's heartbeat row.
  serverId: ""
  # Environment variable holding the shared HMAC secret. Required when
  # `enabled: true` AND `transport.type: redis`; SQL binding currently
  # treats the env var as optional (DB connection auth + TLS is the
  # security boundary).
  secretEnv: "RTP_NET_SECRET"

transport:
  # Backing store for cross-process state.
  # - `auto`: no database required. Detects a BungeeCord/Velocity proxy at
  #   runtime and, when one is present, gossips region availability over the
  #   proxy's built-in plugin-messaging channel. Falls back to a local-only
  #   (disabled network) state when no proxy is detected. This is the
  #   recommended starting point: drop the plugin on every backend and the
  #   network assembles itself, no shared store to set up.
  # - `plugin-message`: force the proxy plugin-messaging transport even
  #   without auto-detection. No database required. Availability is
  #   best-effort and only as fresh as the last heartbeat seen over a player
  #   connection, so a player-empty backend may briefly show as unknown. Not
  #   intended for very large multi-proxy networks; use `sql` or `redis`
  #   there for durable, always-fresh availability.
  # - `in-memory`: development only; nothing leaves the JVM.
  # - `sql`: DB-as-bus. Reuses the existing RTP database
  #   accessor pool from `database.yml`. Durable across restarts.
  # - `redis`: Jedis-backed heartbeats + pub/sub fan-out.
  #   Heartbeats and snapshot work; atomic claim (used for
  #   cross-backend reservation tokens) is not yet available. Flip
  #   `type: redis` once you have a Redis instance shared
  #   across every backend and proxy.
  type: "auto"
  # Plugin-messaging transport tuning. Used when `type` is `auto` (and a
  # proxy was detected) or `plugin-message`. Ignored by the other transports.
  # Gossip cadence and peer-staleness are NOT configured here: they reuse the
  # shared `heartbeat.intervalMs` / `heartbeat.staleAfterMs` knobs below, so a
  # single pair of values drives every transport tier.
  pluginMessage:
    # Proxy plugin-messaging channel. Leave as the default unless your proxy
    # is configured to use a non-standard channel name.
    channel: "bungeecord:main"
  redis:
    # Required when `type: redis`. Hostname or IP of the Redis instance
    # shared by every backend and proxy in the network.
    host: "localhost"
    # Default Redis port. Override if your deployment uses a non-standard one.
    port: 6379
    # Optional. Leave empty / omitted for unauthenticated Redis (dev/test);
    # set when Redis ACL or `requirepass` is configured.
    password: ""

heartbeat:
  # How often this backend publishes its state row. 1000ms is the default
  # used by both proxy-side and backend-side publishers; the proxy's
  # poll loop must observe rows within `staleAfterMs` to consider them live.
  # On the plugin-message tier this same value sets the region-availability
  # gossip cadence.
  intervalMs: 1000
  # How long a peer's last-seen state stays trusted before it is treated as
  # unknown. On the plugin-message tier this is also the snapshot stale
  # window: a peer that goes unknown is still accepted as a destination (the
  # destination decides on arrival), it just stops being suggested. Keep it
  # comfortably above `intervalMs` so one dropped heartbeat does not flap a
  # peer to unknown.
  staleAfterMs: 5000
# Backend-side router. When `routing.mode` is
# `local` (the default), `/rtp` runs the local pipeline only and the rest
# of this file is informational. Flip to `auto` to opt this backend into
# the cross-server wait queue (still local-first when the local backend
# has the requested region available).
routing:
  # `local`  - never enrol into the cross-server wait queue (default;
  #            zero behaviour change).
  # `auto`   - prefer local when this backend can serve the region; enrol
  #            into the wait queue only when local cannot serve.
  # `always` - always enrol into the wait queue (developer / acceptance
  #            harness mode; not recommended for production).
  mode: "local"
  # Lobby mode. When true, this backend becomes a pure dispatch
  # node:
  #  - Heartbeats publish an empty `regions` set and `acceptingRequests:false`
  #    so peers never select this backend as a cross-server destination.
  #  - A bare `/rtp` (no `region=` argument) auto-routes to the peer +
  #    region with the largest `regionKeptCounts` value across the snapshot
  #    ("most-kept" policy). Explicit `rtp region=<server>:<region>`
  #    still works.
  #  - When no peer advertises any region, bare `/rtp` rejects with the
  #    localized `networkRegionUnavailable` message instead of silently
  #    falling through to the (empty) local pipeline.
  # Default false preserves the prior behaviour.
  lobbyMode: false
# Cross-server wait queue. All keys here are
# ignored when `network.enabled: false` or `routing.mode: local`.
queue:
  # Maximum number of locally-buffered enrolments before backpressure
  # rejects new `/rtp` calls with `RoutingDecision.FallbackReason.QUEUE_FULL`.
  maxDepth: 50
  # Backend dirty-write flush cadence (ms). Lower = lower end-to-end
  # latency, higher = fewer round trips to the transport. 250ms is the
  # default.
  flushIntervalMs: 250
  # Backend status-cache poll cadence (ms). Drives how often the backend
  # reads `rtp:net:wq:status:<pid>` to refresh per-player progress.
  pollIntervalMs: 1000
  # Optional passive aging of envelope HASHes. `0` disables (terminal
  # transitions still DEL the env HASH explicitly); set to a
  # positive value if you want operator-visible TTL on stuck envelopes.
  entryTtlMs: 0
  # Cross-server `/rtp` enrolment rate limit (token bucket). Operator
  # safety net against runaway clients.
  crossServerRequestsPerSecond: 5
  crossServerRequestsBurst: 10
  # Proxy-side BLPOP worker count (rtp-proxy-velocity). Increase only when
  # the proxy is observed to saturate a single worker; the dispatcher and
  # transport pool are the real bottlenecks.
  workerThreads: 1
# Reservation-token lifecycle (REQ-RTP-NET-011).
reservation:
  # Proxy-side TTL reaper cadence (ms). The reaper sweeps expired tokens
  # and fires `ReleaseSink.onRelease(tokenId, TTL_EXPIRED)` so co-located
  # backends can return the coordinate to `networkKeptLocations`.
  reapIntervalMs: 30000
  # Per-token TTL (ms). A claimed-but-not-consumed reservation older than
  # this is treated as abandoned and released.
  ttlMs: 60000
# Region-collision policy.
# Only `warn` is shipped; `rename-local` and `reject-startup` are
# documented follow-ups. Unknown values silently degrade to `warn`.
regionCollision:
  policy: "warn"
# Optional per-destination policy overlay. Never required: backends announce
# themselves over the proxy, so the destination list assembles itself. Add an
# entry (matched by serverId) only to override policy for one destination;
# anything not listed uses defaults. Leave commented out for the common case.
#servers:
#  example-backend:
#    # Permission required to target this destination (empty = none).
#    # @type: string
#    permission: ""
#    # Label shown in menus / suggestions (default: serverId).
#    # @type: string
#    display-name: "Example"
#    # Hide from tab-completion when it has no servable region.
#    # @type: boolean
#    # @default: false
#    hide-when-unavailable: false
#    # Allow targeting it even when it reports no servable region.
#    # @type: boolean
#    # @default: true
#    allow-when-unavailable: true
# Load balancer scoring for blank-`/rtp` region selection. Lower score wins.
# Each `terms` entry scores a backend by one metric through a curve; scores
# sum, divide by backendWeight, and ties break by serverId then region.
# Inputs: mspt, queueDepth, heapUsed, heapFree, playerCount, keptCount, tps,
# keptRegion. Curves: linear, exponential (k), logarithmic (k),
# sigmoid (k, x0), step (threshold), power (p); k 0.1-20, p 0.1-8,
# x0/threshold 0-1. The defaults below mirror "most-kept wins" with smooth
# fall-off, gating overloaded backends via `step` curves on heap and region.
loadBalancer:
  # Weight of the built-in region-scarcity term. 0 here because the explicit
  # `region` term below already owns the kept-region signal.
  # @type: number
  # @default: 0
  regionScarcityWeight: 0
  # Scoring terms, one per metric. Each has an `input`, a `weight`, and a
  # `curve` (type + parameters). Defaults gate overloaded backends.
  terms:
    # Tick pressure; sigmoid knee at 0.6.
    mspt:
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      input: "mspt"
      # @type: number
      weight: 1.0
      curve:
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        type: "sigmoid"
        # @type: number
        # @range: [0.1, 20]
        k: 8.0
        # @type: number
        # @range: [0, 1]
        x0: 0.6
    # Queue depth; small queues silent, large ones explode.
    queue:
      input: "queueDepth"
      weight: 1.0
      curve:
        type: "exponential"
        k: 3.0
    # Heap gate; fires at >= 85% used.
    heap:
      input: "heapUsed"
      weight: 5.0
      curve:
        type: "step"
        # @range: [0, 1]
        threshold: 0.85
    # Region gate; fires when the kept pool is >= 95% full.
    region:
      input: "keptRegion"
      weight: 5.0
      curve:
        type: "step"
        threshold: 0.95
    # Gentle tie-breaker on kept count.
    kept:
      input: "keptCount"
      weight: 0.25
      curve:
        type: "logarithmic"
        k: 9.0
