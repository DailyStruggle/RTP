# --- RTP Region Configuration ---
# Documentation: https://github.com/DailyStruggle/RTP/wiki/Regions

# Target world name (e.g. "world", "world_nether").
# "[0]" = main world, "[1]" = 2nd loaded world, etc.
world: "[0]"
# Use the world's /worldborder as the bound instead of the shape radius below.
worldBorderOverride: false

# Spawn area shape and size. radius/centerRadius are measured in chunks. "@config" inherits
# the whole `defaults.shape` block from config.yml (ADR-073), so a single-world server sets
# radius/centerRadius once there.
# Replace with an inline block to override per-region, e.g.:
#   shape:
#     name: "CIRCLE"
#     radius: 256
#     centerRadius: 64
shape: "@config"

# Vertical landing window. "@config" inherits the whole `defaults.vert` block from
# config.yml (ADR-073). Replace with an inline block to override per-region.
vert: "@config"

# If true, rtp.regions.<name> is required. "@config" inherits defaults.requirePermission.
requirePermission: "@config"
# Region to redirect to if no permission
override: "default"
# Economy cost override for this region (added on top of the economy.yml base price).
price: 0.0

# Optional cosmetic display name shown in /rtp info and the GUI menu. Does NOT
# change the region's identity (commands/permissions still use the file name).
# Supports color codes (e.g. &#55ff55 or &a). Defaults to the region name.
# displayName: "&#55ff55Wild Overworld"

# --- Advanced (cache/precision tuning; defaults suit most servers) ---
# Each "@config" inherits the matching defaults.<key> value from config.yml (ADR-073);
# replace with a number to override per-region.
# Max pre-calculated safe locations
cacheCap: "@config"
# L3 backlog cache capacity; unverified candidates pre-filtered by anvil one .mca-bin per pulse. 0 disables L3.
backlogCacheCap: "@config"
# Max chunks kept loaded for zero-latency
activeChunkCap: "@config"
# Precision for bad-location tracking (1-5)
spatialResolution: "@config"

# DO NOT TOUCH VERSION NUMBER
version: "1.1"
