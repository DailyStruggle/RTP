# --- RTP Region Configuration ---
# Documentation: https://github.com/DailyStruggle/RTP/wiki/Regions

# Target world name (e.g. "world", "world_nether").
# "[0]" = main world, "[1]" = 2nd loaded world, etc.
world: "[0]"
# Use the world's /worldborder as the bound instead of the shape radius below.
worldBorderOverride: false

# Spawn area shape and size. radius/centerRadius set how far out players land;
# centerX/centerZ recenter the ring.
shape:
  name: "CIRCLE"
  mode: "ACCUMULATE"
  radius: 256
  centerRadius: 64
  centerX: 0
  centerZ: 0
  weight: 1.0
  # Chunk radius cleared around each used spot so it is never reused.
  # 0 = off, 1 = the landing chunk only, N = an (2N-1)x(2N-1) chunk square.
  uniquePlacements: 0
  expand: false

# Vertical landing window.
vert:
  name: "LINEAR"
  minY: 32
  maxY: 255
  # Scan order: 0 = bottom-up, 1 = top-down, 2 = middle-out, 3 = edges-in,
  # any other value = random order.
  direction: 2
  requireSkyLight: true

# If true, rtp.regions.<name> is required
requirePermission: false
# Region to redirect to if no permission
override: "default"
# Economy cost override for this region
price: 0.0

# Optional cosmetic display name shown in /rtp info and the GUI menu. Does NOT
# change the region's identity (commands/permissions still use the file name).
# Supports color codes (e.g. &#55ff55 or &a). Defaults to the region name.
# displayName: "&#55ff55Wild Overworld"

# --- Advanced (cache/precision tuning; defaults suit most servers) ---
# Max pre-calculated safe locations
cacheCap: 50
# L3 backlog cache capacity; unverified candidates pre-filtered by anvil one .mca-bin per pulse. 0 disables L3.
backlogCacheCap: 1000
# Max chunks kept loaded for zero-latency
activeChunkCap: 10
# Precision for bad-location tracking (1-5)
spatialResolution: 3

# DO NOT TOUCH VERSION NUMBER
version: "1.1"
