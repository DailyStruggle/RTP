# --- RTP Region Configuration ---
# Documentation: plugins/RTP/docs/admin/REGIONS.md

# Optional cosmetic display name shown in user-facing surfaces (the /rtp info
# [displayName] placeholder and the RTP GUI menu). Does NOT change the region's
# identity: commands, permissions (rtp.regions.<name>) and config still use the
# file/region name. Supports color/gradient codes (e.g. &#55ff55 or &a). When
# omitted, the region name is used. On a network it is advertised to lobbies so
# a cross-server destination shows this server's chosen words.
# displayName: "&#55ff55Wild Overworld"

# Target world. [0] = main world.
world: "[0]"
# Use vanilla /worldborder radius if true
worldBorderOverride: false

shape:
  name: "CIRCLE"
  mode: "ACCUMULATE"
  radius: 256
  centerRadius: 64
  centerX: 0
  centerZ: 0
  weight: 1.0
  # Chunk radius cleared around each used spot so it is never reused.
  # 0 = off, 1 = the landing chunk only, N = an (2N-1)x(2N-1) chunk square.
  uniquePlacements: 0
  expand: false

vert:
  name: "JUMP"
  minY: 32
  maxY: 255
  step: 16
  requireSkyLight: false

# If true, rtp.regions.<name> is required
requirePermission: false
# Region to redirect to if no permission
override: "default"
# Max pre-calculated safe locations
cacheCap: 50
# L3 backlog cache capacity; unverified candidates pre-filtered by anvil one .mca-bin per pulse. 0 disables L3.
backlogCacheCap: 1000
# Max chunks kept loaded for zero-latency
activeChunkCap: 10
# Economy cost override for this region
price: 0.0
# Precision for bad-location tracking (1-5)
spatialResolution: 3

# DO NOT TOUCH VERSION NUMBER
version: "1.0"