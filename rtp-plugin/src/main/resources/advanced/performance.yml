# --- RTP Performance Settings ---
# Documentation: docs/admin/configuration/PERFORMANCE.md

# --- Server health ---
# Relative adaptive scaler: scales background compute, promotion rate, hot-cache size, and generation concurrency relative to the configured baselines below (`syncAllottedTime`, `asyncAllottedTime`, `period`, `activeChunkCap`) based on live MSPT and heap telemetry to prevent lag and TPS drops (keep true; invisible to players while the hot queue stays populated).
# Set false to run at fixed configured values.
# @type: boolean
# @default: true
autoTune: true

# Pause background cache filling when TPS drops below this to prevent server lag (raise toward 19.5 to pause earlier). On Folia the
# slowest region counts. Waiting players are still served. 0 = off.
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
minTPS: 19.0

# Pause background cache filling when a tick takes longer than this in ms (lower toward 35.0-40.0 to pause background work earlier and reduce lag; 1 tick = 50 ms at 20 TPS).
# Catches lag that TPS hides (TPS stays 20 up to 50 ms). 0 = off.
# @type: number
# @range: [0.0, 50.0]
# @unit: ms
# @default: 45.0
maxMSPT: 45.0

# Pause cache filling when memory use passes this %. 0/100 = off.
# @type: number
# @range: [0.0, 100.0]
# @default: 85.0
maxHeapPercent: 85.0

# How many spots to try per /rtp before giving up.
# @type: integer
# @range: [1, null]
# @default: 32
maxAttempts: 32

# Ticks between queue refills of the same region (lower values refill the queue faster and speed up queued wait times). Regions take turns.
# Supports duration units (e.g. 24h, 1d).
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
period: 20

# Max ms per tick for main-thread work (lower toward 2-3 ms to give autoTune a tighter baseline ceiling and reduce main-thread tick lag; invisible to players while the hot queue stays populated). Capped at 25.
# Supports duration units (e.g. 24h, 1d).
# @type: integer
# @range: [1, 25]
# @unit: ms
# @default: 5
syncAllottedTime: 5

# Max ms per pulse for background work. Capped at 25.
# Supports duration units (e.g. 24h, 1d).
# @type: integer
# @range: [1, 25]
# @unit: ms
# @default: 25
asyncAllottedTime: 25

# --- View-distance smoothing ---
# Chunks loaded around a spot while searching. Keep at 0 (just the spot; surrounding view-distance chunks load after arrival rather than before); values above 0 load extra chunks per candidate and cause lag spikes.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
viewDistanceSelect: 0

# Chunks loaded around the final spot before teleport. 0 = just the spot.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
viewDistanceTeleport: 0

# Ticks to ease view distance back to normal after arrival. 0 = off.
# NOTE: Temporarily forced to 0. The gradual restore causes client-side
# flashing / re-rendering on arrival. Leave at 0 until further notice.
# Supports duration units (e.g. 24h, 1d).
# @type: integer
# @range: [0, null]
# @unit: ticks
# @default: 200
viewDistanceRestoreInterval: 0

# --- Caching / pre-fill ---
# Refill the cache right after a teleport.
# @type: boolean
# @default: false
postTeleportQueueing: false

# Learn biomes from chunks already loaded (no extra work).
# @type: boolean
# @default: true
checkOnChunkLoads: true

# Refill the backlog when it drops to this fraction. 0.5 = at 50%.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.5
backlogRefillThreshold: 0.5

# Backlog Candidate Generation Strategy.
# FLAT_STRIDE = Uses the same 1D Hilbert dyadic-stride Feistel permutation as live/uncached selection.
# BINNED_AMORTIZED = Uses region-file binned PRP with amortized batch quotas and within-bin dyadic stride.
# @type: string
# @options: ["FLAT_STRIDE", "BINNED_AMORTIZED"]
# @default: "FLAT_STRIDE"
backlogGenerationStrategy: "FLAT_STRIDE"

# Chance to skip new (ungenerated) land and prefer pregenerated chunks on disk (0 = don't care, raise toward 0.8-1.0 to avoid chunk-generation lag at the trade-off of biasing destinations toward already-generated terrain).
# @type: number
# @range: [0.0, 1.0]
# @default: 0.0
pregeneratedPreference: 0.0

# Keep spare spots ready for players joining the server.
# @type: boolean
# @default: false
loginCacheEnabled: false

# Max size of the join-spot cache. 0 = auto (max players).
# @type: integer
# @range: [0, null]
# @default: 0
loginCacheCap: 0

# --- Biome recall ---
# Reuse saved biome spots from the cache.
# @type: boolean
# @default: true
biomeRecall: true

# Only use cached biome spots, never search for new ones. Needs biomeRecall.
# @type: boolean
# @default: false
biomeRecallForced: false

# --- Auditing counters ---
# Warn when a teleport takes longer than this (ms). 0 or less = off.
# Supports duration units (e.g. 24h, 1d).
# @type: integer
# @range: [0, null]
# @unit: ms
# @default: 5000
slowPipelineThresholdMs: 5000

# Warn when this many players are waiting. 0 or less = off.
# @type: integer
# @range: [0, null]
# @unit: players
# @default: 0
queueGrowthWarnThreshold: 0

# --- Advanced (rarely touched) ---
# Load chunks on the main thread. NOT RECOMMENDED (keep false; setting true blocks the main thread and causes severe server hangs).
# @type: boolean
# @default: false
syncLoading: false

# Teleport path on Paper. AUTO = same-tick teleport when the spot's chunk is
# already loaded, else teleportAsync. ASYNC = always teleportAsync (one tick slower).
# @type: string
# @options: ["AUTO", "ASYNC"]
# @default: "AUTO"
teleportPath: "AUTO"

# Re-read permissions every event instead of caching them.
# @type: boolean
# @default: false
onEventParsing: false

# Parse effect permission nodes at startup.
# @type: boolean
# @default: true
effectParsing: true

# Enable background data gathering for visitor analytics.
# @type: boolean
# @default: false
visitorEnabled: false

# Settings for /rtp admin prefab. Keeps backups of changed files.
prefab:
  # How many backups to keep per file.
  # @type: integer
  # @range: [1, null]
  # @default: 3
  bakRetention: 3

# DO NOT TOUCH VERSION NUMBER
version: 1.1
