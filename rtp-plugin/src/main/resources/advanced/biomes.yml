# --- RTP Biome Filter (advanced) ---
# Documentation: https://github.com/DailyStruggle/RTP/wiki/Biome-Controls

# true = only land in the listed biomes. false = never land in them.
# @type: boolean
# @default: false
biomeWhitelist: false

# The biomes the list above uses.
# @type: list<biome>
# @source: biome
biomes:
  - "OCEAN"
  - "DEEP_OCEAN"
  - "WARM_OCEAN"
  - "LUKEWARM_OCEAN"
  - "DEEP_LUKEWARM_OCEAN"
  - "COLD_OCEAN"
  - "DEEP_COLD_OCEAN"
  - "FROZEN_OCEAN"
  - "DEEP_FROZEN_OCEAN"
  - "RIVER"
  - "FROZEN_RIVER"
  - "BEACH"
  - "SNOWY_BEACH"
  - "STONY_SHORE"
  - "SWAMP"
  - "MANGROVE_SWAMP"
  - "SMALL_END_ISLANDS"
  - "BASALT_DELTAS"
  - "DRIPSTONE_CAVES"
  - "LUSH_CAVES"
  - "DEEP_DARK"
  - "THE_VOID"

# --- Biome weighting ---
# Pick each biome equally instead of by size. Needs biomeRecall.
# @type: boolean
# @default: false
biomeWeighted: false

# How often each biome is picked (needs biomeWeighted).
# 1.0 = normal, 2.0 = twice as often, 0.0 = never. Add modded biomes by id.
# @type: map<string, number>
biomeWeights:
  # Relative selection weight for this biome (1.0 = no bias).
  # @type: number
  # @range: [0.0, null]
  # @default: 1.0
  # --- Overworld ---
  plains: 1.0
  sunflower_plains: 1.0
  snowy_plains: 1.0
  ice_spikes: 1.0
  desert: 1.0
  swamp: 1.0
  mangrove_swamp: 1.0
  forest: 1.0
  flower_forest: 1.0
  birch_forest: 1.0
  dark_forest: 1.0
  old_growth_birch_forest: 1.0
  old_growth_pine_taiga: 1.0
  old_growth_spruce_taiga: 1.0
  taiga: 1.0
  snowy_taiga: 1.0
  savanna: 1.0
  savanna_plateau: 1.0
  windswept_hills: 1.0
  windswept_gravelly_hills: 1.0
  windswept_forest: 1.0
  windswept_savanna: 1.0
  jungle: 1.0
  sparse_jungle: 1.0
  bamboo_jungle: 1.0
  badlands: 1.0
  eroded_badlands: 1.0
  wooded_badlands: 1.0
  meadow: 1.0
  cherry_grove: 1.0
  pale_garden: 1.0
  grove: 1.0
  snowy_slopes: 1.0
  frozen_peaks: 1.0
  jagged_peaks: 1.0
  stony_peaks: 1.0
  river: 1.0
  frozen_river: 1.0
  beach: 1.0
  snowy_beach: 1.0
  stony_shore: 1.0
  warm_ocean: 1.0
  lukewarm_ocean: 1.0
  deep_lukewarm_ocean: 1.0
  ocean: 1.0
  deep_ocean: 1.0
  cold_ocean: 1.0
  deep_cold_ocean: 1.0
  frozen_ocean: 1.0
  deep_frozen_ocean: 1.0
  mushroom_fields: 1.0
  dripstone_caves: 1.0
  lush_caves: 1.0
  deep_dark: 1.0
  # --- Nether ---
  nether_wastes: 1.0
  warped_forest: 1.0
  crimson_forest: 1.0
  soul_sand_valley: 1.0
  basalt_deltas: 1.0
  # --- The End ---
  the_end: 1.0
  end_highlands: 1.0
  end_midlands: 1.0
  small_end_islands: 1.0
  end_barrens: 1.0
  # --- Misc / technical ---
  the_void: 1.0

# DO NOT TOUCH VERSION NUMBER
version: 1.0
