# RTP Network Mode (multi-server / proxy). Documentation: plugins/RTP/docs/admin/proxies/CONFIGURATION.md

# Off by default. Set network.enabled true to use it.
network:
  # false = this file is ignored (no network).
  # @type: boolean
  # @default: false
  enabled: false

  # This server's unique name. Needed when enabled. Don't reuse it.
  # @type: string
  # @default: ""
  serverId: ""

  # Env var that holds the shared secret. Needed for redis.
  # @type: string
  # @default: "RTP_NET_SECRET"
  secretEnv: "RTP_NET_SECRET"

# Backing store for cross-process state.
transport:
  # How servers share data.
  # @type: enum
  # @options: ["auto", "plugin-message", "in-memory", "sql", "redis"]
  # @default: "auto"
  type: "auto"
  pluginMessage:
    # Proxy message channel. Leave as-is unless your proxy differs.
    # @type: string
    # @default: "bungeecord:main"
    channel: "bungeecord:main"
  redis:
    # Redis address shared by all servers (needed for redis).
    # @type: string
    # @default: "localhost"
    host: "localhost"

    # Redis port.
    # @type: integer
    # @default: 6379
    port: 6379

    # Redis password. Empty = none.
    # @type: string
    # @default: ""
    password: ""

# How servers tell each other they're alive.
heartbeat:
  # How often to report this server (ms).
  # @type: integer
  # @default: 1000
  intervalMs: 1000

  # How long a server is trusted after its last report (ms). Keep above intervalMs.
  # @type: integer
  # @default: 5000
  staleAfterMs: 5000

# How /rtp picks a server.
routing:
  # local = this server, auto = here first then others, always = always others.
  # @type: enum
  # @options: ["local", "auto", "always"]
  # @default: "local"
  mode: "local"

  # true = this server only sends players to other servers.
  # @type: boolean
  # @default: false
  lobbyMode: false

# Line of players waiting for a cross-server teleport.
queue:
  # Most players that can wait before new /rtp is refused.
  # @type: integer
  # @default: 50
  maxDepth: 50

  # How often to send updates (ms).
  # @type: integer
  # @default: 250
  flushIntervalMs: 250

  # How often to refresh each player's progress (ms).
  # @type: integer
  # @default: 1000
  pollIntervalMs: 1000

  # Auto-clean old entries after this long (ms). 0 = off.
  # @type: integer
  # @default: 0
  entryTtlMs: 0

  # Max cross-server /rtp per second.
  # @type: number
  # @default: 5
  crossServerRequestsPerSecond: 5

  # Short burst allowance on top of the rate above.
  # @type: number
  # @default: 10
  crossServerRequestsBurst: 10

  # Proxy worker threads. Raise only if one is too busy.
  # @type: integer
  # @default: 1
  workerThreads: 1

# Held spots for traveling players.
reservation:
  # How often to clean up expired holds (ms).
  # @type: integer
  # @default: 30000
  reapIntervalMs: 30000

  # How long a held spot lasts before it's freed (ms).
  # @type: integer
  # @default: 60000
  ttlMs: 60000

# What to do if two servers share a region name. Only `warn` works.
regionCollision:
  # Action at startup.
  # @type: enum
  # @options: ["warn", "rename-local", "reject-startup"]
  # @default: "warn"
  policy: "warn"

# Optional per-server rules (matched by serverId). Leave commented for most setups.
# servers:
#  example-backend:
#    # Permission required to target this destination (empty = none).
#    # @type: string
#    # @default: ""
#    permission: ""
#    # Label shown in menus / suggestions (default: serverId).
#    # @type: string
#    # @default: ""
#    display-name: "Example"
#    # Hide from tab-completion when it has no servable region.
#    # @type: boolean
#    # @default: false
#    hide-when-unavailable: false
#    # Allow targeting it even when it reports no servable region.
#    # @type: boolean
#    # @default: true
#    allow-when-unavailable: true
# Picks the best server for a plain /rtp. Lowest score wins. Documentation: plugins/RTP/docs/admin/proxies/CONFIGURATION.md
loadBalancer:
  # Weight of the built-in scarcity term. 0 = the `region` term handles it.
  # @type: number
  # @default: 0
  regionScarcityWeight: 0

  # One scoring rule per metric (input + weight + curve).
  terms:
    # Tick pressure; sigmoid knee at 0.6.
    mspt:
      # Metric input.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "mspt"
      input: "mspt"

      # Term weight.
      # @type: number
      # @default: 1.0
      weight: 1.0
      curve:
        # Curve type.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "sigmoid"
        type: "sigmoid"

        # Steepness.
        # @type: number
        # @range: [0.1, 20]
        # @default: 8.0
        k: 8.0

        # Midpoint.
        # @type: number
        # @range: [0, 1]
        # @default: 0.6
        x0: 0.6

    # Queue depth; small queues silent, large ones explode.
    queue:
      # Metric input.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "queueDepth"
      input: "queueDepth"

      # Term weight.
      # @type: number
      # @default: 1.0
      weight: 1.0
      curve:
        # Curve type.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "exponential"
        type: "exponential"

        # Steepness.
        # @type: number
        # @range: [0.1, 20]
        # @default: 3.0
        k: 3.0

    # Heap gate; fires at >= 85% used.
    heap:
      # Metric input.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "heapUsed"
      input: "heapUsed"

      # Term weight.
      # @type: number
      # @default: 5.0
      weight: 5.0
      curve:
        # Curve type.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "step"
        type: "step"

        # Step threshold.
        # @type: number
        # @range: [0, 1]
        # @default: 0.85
        threshold: 0.85

    # Region gate; fires when the kept pool is >= 95% full.
    region:
      # Metric input.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "keptRegion"
      input: "keptRegion"

      # Term weight.
      # @type: number
      # @default: 5.0
      weight: 5.0
      curve:
        # Curve type.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "step"
        type: "step"

        # Step threshold.
        # @type: number
        # @range: [0, 1]
        # @default: 0.95
        threshold: 0.95

    # Gentle tie-breaker on kept count.
    kept:
      # Metric input.
      # @type: enum
      # @options: ["mspt", "queueDepth", "heapUsed", "heapFree", "playerCount", "keptCount", "tps", "keptRegion"]
      # @default: "keptCount"
      input: "keptCount"

      # Term weight.
      # @type: number
      # @default: 0.25
      weight: 0.25
      curve:
        # Curve type.
        # @type: enum
        # @options: ["linear", "exponential", "logarithmic", "sigmoid", "step", "power"]
        # @default: "logarithmic"
        type: "logarithmic"

        # Steepness.
        # @type: number
        # @range: [0.1, 20]
        # @default: 9.0
        k: 9.0

# Config schema version (do not edit).
version: 1.1
