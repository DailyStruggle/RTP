# --- Language Mapping: network.yml ---
# Maps internal baseline keys (left) to user-visible key names used in
# network.yml (right). network.yml is language-neutral (transport knobs), so
# every row is identity; the file exists purely to mirror the value file
# under lang/advanced/ and keep the config loader's path uniform.
network: "network"
transport: "transport"
heartbeat: "heartbeat"
routing: "routing"
queue: "queue"
reservation: "reservation"
regionCollision: "regionCollision"
loadBalancer: "loadBalancer"
version: "version"
