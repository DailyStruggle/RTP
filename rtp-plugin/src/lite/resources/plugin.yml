# --- RTP-lite Plugin Descriptor (ADR-024) ---
# Distinct from src/main/resources/plugin.yml. The lite shadow JAR ships ONLY
# this descriptor (the full descriptor is excluded from the lite artifact via
# DuplicatesStrategy.EXCLUDE). The lite bootstrap class is divergent on purpose;
# do not point this descriptor at io.github.dailystruggle.rtp.bukkit.RTPBukkitPlugin.
#
# Lite scope (per ADR-024):
#   - No SQL/Redis persistence, no shutdown flush.
#   - Basic Folia support (regionized scheduling + async teleport via the Paper
#     adapter); the tuned rtp-folia adapter remains Pro. No anvil*, no tags.
#     (* anvil is actually retained in lite per the ADR-024 2026-05-07 amendment.)
#   - No multilingual support; locale hardcoded to English.
#   - No on-event/effect permission parsing; no login reserve cache; no visitor mode.
#
# Permission set is a strict subset of the full descriptor. rtp.onevent.*,
# rtp.scan, rtp.biome.* (parsing tree), and the parsed-permission machinery are
# omitted. Operators who need any of those features should install the full JAR.

name: RTP
version: '${version}'
main: io.github.dailystruggle.rtp.bukkit.lite.RTPBukkitLitePlugin
api-version: 1.13
prefix: 'RTP'
authors: [ leaf26 ]
description: 'Random teleport, lite edition (no SQL; basic Folia support) -- see ADR-024'
# Claim-plugin softdepends are included in lite as of 2026-05-11: lite is the
# small-server target and claim-protection support is a baseline operator
# expectation there. Vault is included as of 2026-06-01 so optional per-region
# teleport charging works in lite (ADR-024 economy amendment). Chunky/ChunkyBorder
# and PlaceholderAPI remain Pro-only. See ADR-024.
# CombatLogX / PvPManager / SimpleCombatLog are listed so the PvP gate's bundled
# combat-tag adapters (ADR-055) can resolve those plugins' API classes at runtime
# (Paper/Folia gates cross-plugin class access behind a declared dependency).
softdepend: [ Vault, GriefDefender, GriefPrevention, Towny, Factions, FactionsBridge, Lands, RedProtect, Residence, CrashClaim, HuskClaims, Kingdoms, WorldGuard, CombatLogX, PvPManager, SimpleCombatLog ]
# Basic Folia support (ADR-024 / ADR-061): the free build ships a correctness-first
# regionized scheduler (FoliaAwareScheduler) + async teleport in the Paper adapter so it
# runs on Folia. The tuned, throughput-optimized rtp-folia adapter stays a LeafRTP-Pro
# early-access feature and is not bundled here.
folia-supported: true

commands:
  rtp:
    description: Teleport randomly
    permission: rtp.use
    usage: |
      /rtp
  wild:
    description: Teleport randomly
    permission: rtp.use
    usage: |
      /wild

permissions:
  rtp.see:
    description: allow player to tab for rtp commands
    default: true
  rtp.use:
    description: allow player to use /rtp
    default: true
  rtp.free:
    description: use /rtp for free (bypass the optional Vault economy charge)
    default: op
  rtp.reload:
    description: allow player to use /rtp reload
    default: op
  rtp.config:
    description: allow player to use /rtp config
    default: op
  rtp.noDelay:
    description: skip the teleport delay
    default: op
  rtp.noDelay.chunks:
    description: skip chunk loading
    default: op
  rtp.noCancel:
    description: skip teleport cancellation tasks
    default: op
  rtp.noCooldown:
    description: skip the teleport cooldown
    default: op
  rtp.delay:
    description: placeholder for custom delay values
    default: false
  rtp.cooldown:
    description: placeholder for custom cooldown values
    default: false
  rtp.other:
    description: allow player to teleport another player
    default: op
  rtp.notme:
    description: prevent this player from being targeted by another player's /rtp player:<name> (console is exempt)
    default: op
  rtp.world:
    description: allow player to specify any world they have permission for
    default: op
  rtp.worlds.*:
    description: allow player to teleport to any world from any world
    default: op
    children:
      rtp.world: true
  rtp.region:
    description: allow player to specify any region they have permission for
    default: op
  rtp.regions.*:
    description: allow player to teleport to any region
    default: op
    children:
      rtp.region: true
  rtp.servers.*:
    description: allow player to teleport to a region on any networked backend server (network mode)
    default: op
  rtp.unqueued:
    description: if no locations are queued, generate a new location
    default: op
  rtp.params:
    description: allow player to use custom parameters for their teleport
    default: op
    children:
      rtp.unqueued: true
  rtp.info:
    description: see plugin info and settings
    default: op
  rtp.admin:
    description: allow player to use /rtp clear and grant all other admin tooling
    default: op
    children:
      rtp.reload: true
      rtp.config: true
      rtp.scan: true
      rtp.info: true
  rtp.*:
    description: access all rtp subcommands available in lite
    default: op
    children:
      rtp.see: true
      rtp.use: true
      rtp.reload: true
      rtp.config: true
      rtp.noCooldown: true
      rtp.noDelay: true
      rtp.noDelay.chunks: true
      rtp.noCancel: true
      rtp.other: true
      rtp.notme: true
      rtp.world: true
      rtp.worlds.*: true
      rtp.region: true
      rtp.regions.*: true
      rtp.servers.*: true
      rtp.params: true
      rtp.unqueued: true
      rtp.admin: true
