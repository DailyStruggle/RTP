# --- RTP-lite Plugin Descriptor ---
# Distinct from src/main/resources/plugin.yml. The lite shadow JAR ships ONLY
# this descriptor (the full descriptor is excluded from the lite artifact via
# DuplicatesStrategy.EXCLUDE).
# Under ADR-100, the lite assembly has 100% technical and functional parity with Pro.
# Everything except `main:` shall mirror src/main/resources/plugin.yml verbatim;
# LitePluginDescriptorParityTest fails the build on drift.

name: RTP
version: '${version}'
main: io.github.dailystruggle.rtp.bukkit.lite.RTPBukkitLitePlugin
api-version: '1.18'
prefix: 'RTP'
authors: [ leaf26 ]
description: 'a fast and flexible random teleportation plugin'

# CombatLogX / PvPManager / SimpleCombatLog are listed so the PvP gate's bundled
# combat-tag adapters can load those plugins' API classes at runtime:
# on Paper/Folia a plugin may only resolve another plugin's classes when it
# declares a dependency on it, otherwise the CombatLogX/PvPManager adapters hit a
# NoClassDefFoundError at query time and silently report "not in combat".
# spark is listed for load-order only: when present it loads before RTP so the
# spark API is ready when the metrics binding queries it (richer TPS/MSPT than
# the native server calls). Never required - absence degrades to the native binding.
softdepend: [ WorldGuard, WorldEdit, PlaceholderAPI, Vault, Chunky, ChunkyBorder, GriefDefender, GriefPrevention, Towny, Factions, FactionsBridge, Lands, RedProtect, Residence, CrashClaim, HuskClaims, Kingdoms, CombatLogX, PvPManager, SimpleCombatLog, DecentHolograms, HolographicDisplays, FancyHolograms, spark ]
folia-supported: true

# --- Commands ---
# Registered command aliases. Argument parsing itself is dispatched through
# the TreeCommand framework.
commands:
  rtp:
    description: Teleport randomly
    permission: rtp.use
    usage: |
      /rtp
  wild:
    description: Teleport randomly
    permission: rtp.use
    usage: |
      /wild

# --- Permissions ---
# Grouped by feature area:
#   rtp.see / rtp.use       - baseline player permissions (default: true)
#   rtp.free / rtp.no*      - bypasses for delays, cooldowns, cancellation (op)
#   rtp.other   - allow this player to teleport others
#   rtp.notme   - prevent this player from being targeted by others
#   rtp.world(s) / rtp.region(s) - cross-world / cross-region targeting (op)
#   rtp.onevent.*           - automatic RTP on player events (default: false)
#   rtp.biome.*             - biome-targeted teleports (op)
#   rtp.scan / rtp.info / rtp.reload / rtp.config / rtp.update - admin tooling (op)
#   rtp.back / rtp.gui / rtp.editor / rtp.action* / rtp.admin.* - subcommands (op)
#   rtp.*                   - aggregate; grants all of the above
permissions:
  rtp.see:
    description: allow player to tab for rtp commands
    default: true
  rtp.use:
    description: allow player to use /rtp
    default: true
  rtp.free:
    description: use /rtp for free
    default: op
  rtp.reload:
    description: allow player to use /rtp reload
    default: op
  rtp.config:
    description: allow player to use /rtp config
    default: op
    children:
      rtp.update: true
  rtp.update:
    description: allow player to set config keys through /rtp config <file> <key>=<value>
    default: op
  rtp.scan:
    description: allow player to start scan tasks
    default: op
  rtp.noDelay:
    description: skip the teleport delay
    default: op
  rtp.noDelay.chunks:
    description: skip chunk loading
    default: op
  rtp.noCancel:
    description: skip teleport cancellation tasks
    default: op
  rtp.noCooldown:
    description: skip the teleport cooldown
    default: op
  rtp.delay:
    description: placeholder for custom delay values
    default: false
  rtp.cooldown:
    description: placeholder for custom cooldown values
    default: false
  rtp.other:
    description: allow player to teleport another player.
    default: op
  rtp.notme:
    description: prevent this player from being targeted by another player's /rtp player:<name> (console is exempt)
    default: op
  rtp.world:
    description: allow player to specify any world they have permission for
    default: op
  rtp.worlds.*:
    description: allow player to teleport to any world from any world
    default: op
    children:
      rtp.world: true
  rtp.region:
    description: allow player to specify any region they have permission for
    default: op
  rtp.regions.*:
    description: allow player to teleport to any region
    default: op
    children:
      rtp.region: true
  rtp.servers.*:
    description: allow player to teleport to a region on any networked backend server (network mode)
    default: true
  rtp.unqueued:
    description: if no locations are queued, generate a new location
    default: op
  rtp.params:
    description: allow player to use custom parameters for their teleport
    default: op
    children:
      rtp.unqueued: true
  rtp.personalqueue:
    description: reserve a next location for this player
    default: false
  rtp.onevent.join:
    description: randomly teleport player on every join
    default: false
  rtp.onevent.firstjoin:
    description: randomly teleport player on player's first join
    default: false
  rtp.onevent.respawn:
    description: randomly teleport player on respawn after death
    default: false
  rtp.onevent.changeworld:
    description: randomly teleport player upon changing worlds
    default: false
  rtp.onevent.move:
    description: randomly teleport player on movement
    default: false
  rtp.onevent.teleport:
    description: randomly teleport player on teleport, recursively
    default: false
  rtp.onevent.*:
    description: inescapable chaos
    default: false
    children:
      rtp.onevent.join: true
      rtp.onevent.firstjoin: true
      rtp.onevent.respawn: true
      rtp.onevent.changeworld: true
      rtp.onevent.move: true
      rtp.onevent.teleport: true
  rtp.biome:
    description: teleport to any biome you have permission for
    default: op
  rtp.biome.free:
    description: use the biome parameter for free
    default: op
  rtp.biome.*:
    description: use any biome type
    default: op
    children:
      rtp.biome: true
  rtp.menu.admin:
    description: show the admin panel entry row in the /rtp menu front page (operator tools submenu)
    default: op
  rtp.info:
    description: see plugin info and settings
    default: op
  rtp.version:
    description: allow player to use /rtp version (alias /rtp about) to see plugin and server identity
    default: true
  rtp.back:
    description: allow player to use /rtp back to return to where they were before the last teleport
    default: op
  rtp.gui:
    description: allow player to use /rtp gui to open the menu a GUI addon bound to /rtp
    default: op
  rtp.editor:
    description: allow player to use /rtp editor and its subcommands (local, trust, untrust, apply)
    default: op
  rtp.action:
    description: allow player to use /rtp action <name>; each action also checks its own permission (rtp.action.<name> by default)
    default: op
  rtp.action.cancel:
    description: allow player to use /rtp action cancel to leave a queue or cancel their own action entry
    default: op
  rtp.action.cancel.other:
    description: allow player to cancel another player's action entry or a session by UUID
    default: op
  rtp.admin.setup:
    description: allow player to use the /rtp admin setup wizard
    default: op
  rtp.admin.prefab:
    description: allow player to use /rtp admin prefab
    default: op
  rtp.admin:
    description: allow player to use /rtp clear and grant all other admin tooling
    default: op
    children:
      rtp.reload: true
      rtp.config: true
      rtp.scan: true
      rtp.info: true
      rtp.menu.admin: true
  rtp.*:
    description: access all rtp subcommands
    default: op
    children:
      rtp.see: true
      rtp.use: true
      rtp.reload: true
      rtp.config: true
      rtp.update: true
      rtp.noCooldown: true
      rtp.noDelay: true
      rtp.noDelay.chunks: true
      rtp.noCancel: true
      rtp.other: true
      rtp.notme: true
      rtp.world: true
      rtp.worlds.*: true
      rtp.region: true
      rtp.regions.*: true
      rtp.servers.*: true
      rtp.params: true
      rtp.unqueued: true
      rtp.biome: true
      rtp.biome.*: true
      rtp.menu.admin: true
      rtp.scan: true
      rtp.version: true
      rtp.back: true
      rtp.gui: true
      rtp.editor: true
      rtp.action: true
      rtp.action.cancel: true
      rtp.action.cancel.other: true
      rtp.admin.setup: true
      rtp.admin.prefab: true
      rtp.admin: true
