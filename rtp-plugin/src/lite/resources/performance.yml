# --- RTP-lite Performance Settings (ADR-024) ---
# Subset of the full performance.yml. Keys removed in lite:
#   visitorEnabled         (observation mode -- not present in lite)
#   loginCacheEnabled      (ADR-023 login reserve cache -- not present in lite)
#   loginCacheCap          (ADR-023 -- not present in lite)
#   onEventParsing         (per-permission startup parse -- not present in lite)
#
# biomeRecall is retained as a showcase feature.
# effectParsing defaults to true in lite so per-permission effects
# (rtp.effect.<stage>) fire identically to the full edition.
effectParsing: true

maxAttempts: 32           # Max search attempts before giving up
viewDistanceSelect: 0     # Chunk radius to load during selection
viewDistanceTeleport: 0   # Chunk radius to load before teleport
period: 20                # Ticks between background cache cycles
syncAllottedTime: 50      # Max ms per tick for sync tasks
asyncAllottedTime: 50     # Max ms per tick for async tasks
minTPS: 19.0              # Min TPS to continue background queueing
maxHeapPercent: 85.0      # Pause background cache generation above this % of max heap (0/100 disables)
postTeleportQueueing: false  # Refill cache immediately after teleport
syncLoading: false        # Use sync chunk loading (NOT RECOMMENDED)
biomeRecall: true         # Reuse found biome locations
biomeRecallForced: false  # Only use biomes already in cache
biomeWeighted: false      # Steer each requested biome equally (rare-biome bias)
  # Per-biome relative selection weights; only used when biomeWeighted=true.
  # Unlisted biomes default to weight 1.0. The full vanilla biome set is
  # pre-listed at the no-op weight 1.0 as an easy-to-edit reference: change a
  # number to bias a biome, 0.0 to suppress it, or append modded biome ids.
biomeWeights:
  # --- Overworld ---
  plains: 1.0
  sunflower_plains: 1.0
  snowy_plains: 1.0
  ice_spikes: 1.0
  desert: 1.0
  swamp: 1.0
  mangrove_swamp: 1.0
  forest: 1.0
  flower_forest: 1.0
  birch_forest: 1.0
  dark_forest: 1.0
  old_growth_birch_forest: 1.0
  old_growth_pine_taiga: 1.0
  old_growth_spruce_taiga: 1.0
  taiga: 1.0
  snowy_taiga: 1.0
  savanna: 1.0
  savanna_plateau: 1.0
  windswept_hills: 1.0
  windswept_gravelly_hills: 1.0
  windswept_forest: 1.0
  windswept_savanna: 1.0
  jungle: 1.0
  sparse_jungle: 1.0
  bamboo_jungle: 1.0
  badlands: 1.0
  eroded_badlands: 1.0
  wooded_badlands: 1.0
  meadow: 1.0
  cherry_grove: 1.0
  pale_garden: 1.0
  grove: 1.0
  snowy_slopes: 1.0
  frozen_peaks: 1.0
  jagged_peaks: 1.0
  stony_peaks: 1.0
  river: 1.0
  frozen_river: 1.0
  beach: 1.0
  snowy_beach: 1.0
  stony_shore: 1.0
  warm_ocean: 1.0
  lukewarm_ocean: 1.0
  deep_lukewarm_ocean: 1.0
  ocean: 1.0
  deep_ocean: 1.0
  cold_ocean: 1.0
  deep_cold_ocean: 1.0
  frozen_ocean: 1.0
  deep_frozen_ocean: 1.0
  mushroom_fields: 1.0
  dripstone_caves: 1.0
  lush_caves: 1.0
  deep_dark: 1.0
  # --- Nether ---
  nether_wastes: 1.0
  warped_forest: 1.0
  crimson_forest: 1.0
  soul_sand_valley: 1.0
  basalt_deltas: 1.0
  # --- The End ---
  the_end: 1.0
  end_highlands: 1.0
  end_midlands: 1.0
  small_end_islands: 1.0
  end_barrens: 1.0
  # --- Misc / technical ---
  the_void: 1.0
checkOnChunkLoads: true   # Register biome of loaded chunks for in-range regions

# DO NOT TOUCH VERSION NUMBER
version: "1.0"
