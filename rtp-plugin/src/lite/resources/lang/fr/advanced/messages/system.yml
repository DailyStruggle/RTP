# --- Messages RTP (cette langue) ---
# Textes des messages destines aux joueurs et aux operateurs dans cette langue, groupes par theme.
# Copie generee automatiquement des messages anglais; ne pas editer a la main (sera ecrase).

# ###############################################################################
# Section 4: System & Management
# ###############################################################################
# a configuration file 'version' is lower than the latest
# placeholder: [filename] - name of file, including file extension
oldFile: "&b[P0] ancien [filename] détecté. Mise à jour"

# monde bukkit détecté qui n'est pas dans le fichier de configuration
# espace réservé : [world] - le monde détecté
nouveauMonde: "&b[P0] nouveau monde '[world]' détecté"

# texte de rechargement / mise à jour du plugin
# espace réservé : [filename] - nom du fichier
reloading: "&b[P0] chargement de [filename]..."
reloaded: "&b[P0] [filename] chargé avec succès."
updating: "&a[P0] mise à jour de [filename]..."
updated: "&a[P0] [filename] mis à jour avec succès."

# ###############################################################################
# Section 5: Administrative Logs
# ###############################################################################
# logged when locations are saved/loaded from database
# placeholder: [amount] - number of locations
# placeholder: [region] - name of region
locationSaved: "&7[P0] [amount] emplacements enregistrés avec succès pour [region]"
locationLoaded: "&7[P0] [amount] emplacements chargés avec succès pour [region]"

# ###############################################################################
# Section 11 : Métadonnées
# ###############################################################################
version: 1.0

# ###############################################################################
# Section 12: Developer Options
# ###############################################################################
# set to true to append a dev tag (e.g. §8(RTP:ClassName)) to every message
showDevTag: false
