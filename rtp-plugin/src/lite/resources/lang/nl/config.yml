# Teletransportvertraging (seconden)
# Tijd die de speler moet wachten voordat het teletransport plaatsvindt.
# Geeft de server soms tijd om bestemmingschunks voor te laden.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 2
teletransportVertraging: 2

# Annuleerdrempel (blokken)
# Als de speler meer dan deze afstand beweegt tijdens de vertraging,
# wordt het teletransport geannuleerd. Stel in op -1 om uit te schakelen.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 2
annuleerAfstand: 2

# Wachttijd tussen teletransports (seconden)
# Tijd die de speler moet wachten tussen succesvolle RTP-gebruiken.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 300
teletransportWachttijd: 300

# Maximaal aantal geslaagde /rtp-gebruiken dat een speler binnen het
# lockAfterResetSeconds-venster mag doen voordat hij wordt vergrendeld (BetterRTP LockAfter-pariteit).
# 0 schakelt de limiet uit. Omzeild door rtp.nolock.
# @type: integer
# @range: [0, null]
# @default: 0
lockAfterUses: 0

# Lengte van het voortschrijdende gebruikslimietvenster voor lockAfterUses. De teller wordt zoveel
# seconden na het eerste gebruik van het venster gereset. 0 betekent dat de limiet nooit wordt
# gereset (een harde levenslange limiet).
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 0
lockAfterResetSeconds: 0

# Indien true stelt een geslaagde /rtp de landingsplek in als het permanente
# spawn-anker van de speler (BetterRTP SetAsRespawn-pariteit).
# @type: boolean
# @default: false
setRespawnOnTeleport: false

# Opdrachten na teletransport
# Lijst van opdrachten die worden uitgevoerd na een succesvol teletransport.
# De plaatshouder [player] staat voor de spelernaam.
# @type: list<string>
consoleOpdrachten:
  - "say [player] is zojuist willekeurig geteletransporteerd!"

# Commando's uitgevoerd als de geteleporteerde speler bij geslaagde teleport.
# Gebruik [player] voor de spelersnaam. Lege invoer wordt genegeerd.
# @type: list<string>
spelerOpdrachten:
  # Commando's uitgevoerd als de geteleporteerde speler bij geslaagde teleport.
  # Gebruik [player] voor de spelersnaam. Lege invoer wordt genegeerd.
  # @type: list<string>
  - ""

# Algemeen menu-framework.
# `renderer` is een geordende voorkeurlijst van renderer-ids. Bij een
# uitzondering of ontbrekende adapter loopt het framework de lijst door en
# valt terug op de volgende ingang. Is de lijst uitgeput, dan valt het
# token-loze openings-pad terug op het instelbare `menuInvalid`-bericht.
# Beschikbare ids: book. (De chat-renderer komt in een vervolg-release en
# wordt dan aan de standaardlijst toegevoegd.)
menu:
  # Ordered preference list of renderer ids.
  # @type: list<enum>
  # @options: ["book", "chat"]
  renderer:
    # Algemeen menu-framework.
    # `renderer` is een geordende voorkeurlijst van renderer-ids. Bij een
    # uitzondering of ontbrekende adapter loopt het framework de lijst door en
    # valt terug op de volgende ingang. Is de lijst uitgeput, dan valt het
    # token-loze openings-pad terug op het instelbare `menuInvalid`-bericht.
    # Beschikbare ids: book. (De chat-renderer komt in een vervolg-release en
    # wordt dan aan de standaardlijst toegevoegd.)
    - "book"

# Globale standaardwaarden die via het "@config"-token worden overgenomen door regio-/wereldbestanden (ADR-073).
defaults:
  # Standaardvorm en -grootte van het gebied. radius/centerRadius = hoe ver weg je landt, gemeten in chunks.
  shape:
    name: "CIRCLE"
    mode: "ACCUMULATE"
    radius: 256
    centerRadius: 64
    centerX: 0
    centerZ: 0
    weight: 1.0
    # Keep spots from being reused. 0 = off, 1 = the landing chunk, N = bigger square.
    uniquePlacements: 0
    expand: false
  # Default high/low landing window.
  vert:
    name: "LINEAR"
    minY: 32
    maxY: 255
    # Search order: 0 = bottom-up, 1 = top-down, 2 = middle-out, 3 = edges-in, else random.
    direction: 2
    requireSkyLight: true
  # How many safe spots to pre-calculate.
  cacheCap: 50
  # Extra unverified spots kept ready. 0 = off.
  backlogCacheCap: 1000
  # Max chunks kept loaded for instant teleports.
  activeChunkCap: 10
  # Bad-spot tracking precision (1-5).
  spatialResolution: 3
  # Whether regions/worlds need permission.
  requirePermission: false

# WIJZIG HET VERSIENUMMER NIET
version: 3.1
