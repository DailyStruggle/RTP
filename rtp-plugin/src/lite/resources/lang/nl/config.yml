# Teletransportvertraging (seconden)
# Tijd die de speler moet wachten voordat het teletransport plaatsvindt.
# Geeft de server soms tijd om bestemmingschunks voor te laden.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 2
teletransportVertraging: 2

# Annuleerdrempel (blokken)
# Als de speler meer dan deze afstand beweegt tijdens de vertraging,
# wordt het teletransport geannuleerd. Stel in op -1 om uit te schakelen.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 2
annuleerAfstand: 2

# Wachttijd tussen teletransports (seconden)
# Tijd die de speler moet wachten tussen succesvolle RTP-gebruiken.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 300
teletransportWachttijd: 300

# Maximum number of successful /rtp uses a player may make within the
# lockAfterResetSeconds window before being locked out (BetterRTP LockAfter parity).
# 0 disables the cap. Bypassed by rtp.nolock.
# @type: integer
# @range: [0, null]
# @default: 0
lockAfterUses: 0

# Length of the rolling usage-cap window for lockAfterUses. The counter resets this
# many seconds after the window's first use. 0 means the cap never resets (a hard
# lifetime cap).
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 0
lockAfterResetSeconds: 0

# When true, a successful /rtp sets the landed location as the player's persistent
# spawn anchor (BetterRTP SetAsRespawn parity).
# @type: boolean
# @default: false
setRespawnOnTeleport: false

# Opdrachten na teletransport
# Lijst van opdrachten die worden uitgevoerd na een succesvol teletransport.
# De plaatshouder [player] staat voor de spelernaam.
# @type: list<string>
consoleOpdrachten:
  - "say [player] is zojuist willekeurig geteletransporteerd!"

# Commando's uitgevoerd als de geteleporteerde speler bij geslaagde teleport.
# Gebruik [player] voor de spelersnaam. Lege invoer wordt genegeerd.
# @type: list<string>
spelerOpdrachten:
  # Commando's uitgevoerd als de geteleporteerde speler bij geslaagde teleport.
  # Gebruik [player] voor de spelersnaam. Lege invoer wordt genegeerd.
  # @type: list<string>
  - ""

# Algemeen menu-framework.
# `renderer` is een geordende voorkeurlijst van renderer-ids. Bij een
# uitzondering of ontbrekende adapter loopt het framework de lijst door en
# valt terug op de volgende ingang. Is de lijst uitgeput, dan valt het
# token-loze openings-pad terug op het instelbare `menuInvalid`-bericht.
# Beschikbare ids: book. (De chat-renderer komt in een vervolg-release en
# wordt dan aan de standaardlijst toegevoegd.)
menu:
  # Ordered preference list of renderer ids.
  # @type: list<enum>
  # @options: ["book", "chat"]
  renderer:
    # Algemeen menu-framework.
    # `renderer` is een geordende voorkeurlijst van renderer-ids. Bij een
    # uitzondering of ontbrekende adapter loopt het framework de lijst door en
    # valt terug op de volgende ingang. Is de lijst uitgeput, dan valt het
    # token-loze openings-pad terug op het instelbare `menuInvalid`-bericht.
    # Beschikbare ids: book. (De chat-renderer komt in een vervolg-release en
    # wordt dan aan de standaardlijst toegevoegd.)
    - "book"

# WIJZIG HET VERSIENUMMER NIET
version: 3.0
