# Atraso de teletransporte (segundos)
# Tempo que o jogador deve esperar antes que o teletransporte seja realizado.
# Às vezes dá tempo ao servidor para pré-carregar os chunks de destino.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 2
atrasoTeletransporte: 2

# Cancelamento por movimento (blocos)
# Se o jogador se mover mais que esta distância durante o atraso, o
# teletransporte é cancelado. Defina como -1 para desativar.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 2
distanciaCancelamento: 2

# Tempo de espera entre teletransportes (segundos)
# Tempo que o jogador deve esperar entre usos bem-sucedidos do RTP.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 300
tempoDeEsperaTeletransporte: 300

# Número máximo de usos bem-sucedidos de /rtp que um jogador pode fazer dentro da
# janela lockAfterResetSeconds antes de ser bloqueado (paridade com LockAfter do BetterRTP).
# 0 desativa o limite. Ignorado por rtp.nolock.
# @type: integer
# @range: [0, null]
# @default: 0
lockAfterUses: 0

# Duração da janela móvel de limite de uso para lockAfterUses. O contador é reiniciado
# este número de segundos após o primeiro uso da janela. 0 significa que o limite nunca
# é reiniciado (um limite vitalício).
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 0
lockAfterResetSeconds: 0

# Quando true, um /rtp bem-sucedido define o local de pouso como ponto de
# renascimento persistente do jogador (paridade com BetterRTP).
# @type: boolean
# @default: false
setRespawnOnTeleport: false

# Comandos pós-teletransporte
# Lista de comandos a serem executados após um teletransporte bem-sucedido.
# O marcador [player] representa o nome do jogador.
# @type: list<string>
comandosConsole:
  - "say [player] acabou de teletransportar-se aleatoriamente!"

# Comandos executados como o jogador teletransportado após teletransporte bem-sucedido.
# Use [player] para o nome do jogador. Entradas vazias são ignoradas.
# @type: list<string>
comandosJogador:
  # Comandos executados como o jogador teletransportado após teletransporte bem-sucedido.
  # Use [player] para o nome do jogador. Entradas vazias são ignoradas.
  # @type: list<string>
  - ""

# Estrutura genérica de menus.
# `renderer` é uma lista de preferência ordenada de ids de renderer. Em
# caso de exceção ou adaptador ausente, a estrutura percorre a lista e
# recorre à próxima entrada. Se a lista se esgotar, o caminho de abertura
# sem token recorre à mensagem configurável `menuInvalid`. Ids disponíveis:
# book. (O renderer de chat virá em uma entrega posterior e será
# adicionado à lista padrão nesse momento.)
menu:
  # Ordered preference list of renderer ids.
  # @type: list<enum>
  # @options: ["book", "chat"]
  renderer:
    # Estrutura genérica de menus.
    # `renderer` é uma lista de preferência ordenada de ids de renderer. Em
    # caso de exceção ou adaptador ausente, a estrutura percorre a lista e
    # recorre à próxima entrada. Se a lista se esgotar, o caminho de abertura
    # sem token recorre à mensagem configurável `menuInvalid`. Ids disponíveis:
    # book. (O renderer de chat virá em uma entrega posterior e será
    # adicionado à lista padrão nesse momento.)
    - "book"

# Valores padrão globais herdados pelos arquivos de região/mundo por meio do token "@config".
defaults:
  # Forma e tamanho padrão da área. radius/centerRadius = quão longe você cai, medido em chunks.
  shape:
    name: "CIRCLE"
    mode: "ACCUMULATE"
    radius: 256
    centerRadius: 64
    centerX: 0
    centerZ: 0
    weight: 1.0
    # Keep spots from being reused. 0 = off, 1 = the landing chunk, N = bigger square.
    uniquePlacements: 0
    expand: false
  # Default high/low landing window.
  vert:
    name: "LINEAR"
    minY: 32
    maxY: 255
    # Search order: 0 = bottom-up, 1 = top-down, 2 = middle-out, 3 = edges-in, else random.
    direction: 2
    requireSkyLight: true
  # How many safe spots to pre-calculate.
  cacheCap: 50
  # Extra unverified spots kept ready. 0 = off.
  backlogCacheCap: 1000
  # Max chunks kept loaded for instant teleports.
  activeChunkCap: 10
  # Bad-spot tracking precision (1-5).
  spatialResolution: 3
  # Whether regions/worlds need permission.
  requirePermission: false

# NAO MODIFIQUE O NUMERO DE VERSAO
version: 3.1
