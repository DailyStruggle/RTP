# --- プラグインログ切り替え ---
# プラグインの各種アクティビティのログを有効/無効にします。
# 詳細システムログ
# detailed_reload: リロードされたすべてのファイル/セクションをログ
# detailed_region_init: 各リージョンの初期化をログ
# @type: boolean
# @default: false
詳細_リロード: false

# 領域の初期化の詳細をログに記録
# @type: boolean
# @default: false
詳細_リージョン初期化: false

# 基本アクティビティログ
# command: プレイヤーが実行した RTP コマンドをログ
# teleport: 実際のテレポートイベントをログ
# @type: boolean
# @default: false
コマンド: false

# 成功したテレポートイベントをログに記録
# @type: boolean
# @default: true
テレポート: true

# プレイヤーがワールドを切り替えたとき
# @type: boolean
# @default: true
イベント_ワールド変更: true

# プレイヤーがサーバーに参加したとき
# @type: boolean
# @default: true
イベント_参加: true

# プレイヤーがリスポーンしたとき
# @type: boolean
# @default: true
イベント_リスポーン: true

# プレイヤーが移動したとき (移動駆動 RTP が有効な場合)
# @type: boolean
# @default: true
イベント_移動: true

# プレイヤーがテレポートしたとき (テレポート駆動 RTP が有効な場合)
# @type: boolean
# @default: true
イベント_テレポート: true

# 選択失敗デバッグ
# 安全な位置を見つけられなかったときの詳細をログに残します。失敗率や検索パラメータを含みます。
# @type: boolean
# @default: true
選択失敗: true

# システムログ
# バックグラウンドタスクとデータベース操作に関連します。
# @type: boolean
# @default: false
システム_メモリトラッカ: false

# データベース活動のデバッグログ
# @type: boolean
# @default: false
システム_データベース: false

# プラグイン固有の最小ログレベル。有効なフィルターはこれと Bukkit logger の
# うち細かい方です。ALL は Bukkit logger と同じ動作を維持します。
# @type: enum
# @options: [SEVERE, WARNING, INFO, CONFIG, FINE, FINER, FINEST, ALL, OFF]
# @default: ALL
最低レベル: "INFO"

# バージョン番号は変更しないでください
version: 1.0
