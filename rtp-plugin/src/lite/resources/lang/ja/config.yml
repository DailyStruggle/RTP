# テレポート遅延（秒）
# 実際にテレポートが発動するまでにプレイヤーが待つ時間。
# サーバーが目的地のチャンクを事前にロードする時間を確保できます。
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 2
テレポート遅延: 2

# 移動キャンセル（ブロック）
# 遅延中にプレイヤーがこの距離以上動いたらテレポートをキャンセルします。
# -1 で無効化。
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 2
キャンセル距離: 2

# テレポート間隔（秒）
# プレイヤーが連続して RTP を使うまでに待つ時間。
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 300
テレポートクールダウン: 300

# プレイヤーがロックアウトされるまでに lockAfterResetSeconds の期間内で行える
# /rtp の成功回数の最大値です (BetterRTP の LockAfter と同等)。
# 0 で上限を無効化します。rtp.nolock で回避されます。
# @type: integer
# @range: [0, null]
# @default: 0
lockAfterUses: 0

# lockAfterUses 用のローリング使用回数ウィンドウの長さです。カウンターはウィンドウの
# 最初の使用からこの秒数が経過すると初期化されます。0 は上限が決して初期化されない
# (恒久的な上限) ことを意味します。
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 0
lockAfterResetSeconds: 0

# true の場合、/rtp の成功時に着地地点をプレイヤーの永続的な
# リスポーン地点として設定します (BetterRTP の SetAsRespawn と同等)。
# @type: boolean
# @default: false
setRespawnOnTeleport: false

# テレポート後コマンド
# テレポート成功後に実行するコマンドのリスト。
# プレースホルダ [player] はプレイヤー名を表します。
# @type: list<string>
コンソールコマンド:
  - "say [player] がランダムテレポートしました！"

# テレポート成功時に対象プレイヤーとして実行されるコマンド。
# [player] でプレイヤー名を指定します。空のエントリは無視されます。
# @type: list<string>
プレイヤーコマンド:
  # テレポート成功時に対象プレイヤーとして実行されるコマンド。
  # [player] でプレイヤー名を指定します。空のエントリは無視されます。
  # @type: list<string>
  - ""

# 汎用メニューフレームワーク。
# `renderer` はレンダラ ID の優先順位付きリストです。例外発生時または
# 該当アダプタが無い場合、フレームワークは順にリストを辿り次のエントリへ
# フォールバックします。リストを使い切った場合、トークン無しのページ表示
# パスは設定可能な `menuInvalid` メッセージにフォールバックします。
# 利用可能な ID: book。(チャットレンダラは後続リリースで追加され、その時点で
# デフォルトリストに加わります。)
menu:
  # Ordered preference list of renderer ids.
  # @type: list<enum>
  # @options: ["book", "chat"]
  renderer:
    # 汎用メニューフレームワーク。
    # `renderer` はレンダラ ID の優先順位付きリストです。例外発生時または
    # 該当アダプタが無い場合、フレームワークは順にリストを辿り次のエントリへ
    # フォールバックします。リストを使い切った場合、トークン無しのページ表示
    # パスは設定可能な `menuInvalid` メッセージにフォールバックします。
    # 利用可能な ID: book。(チャットレンダラは後続リリースで追加され、その時点で
    # デフォルトリストに加わります。)
    - "book"

# "@config" トークンを介してリージョン/ワールドのファイルに継承されるグローバルな既定値です (ADR-073)。
defaults:
  # デフォルトのエリアの形状とサイズ。radius/centerRadius = どれだけ遠くに着地するか（チャンク単位）。
  shape:
    name: "CIRCLE"
    mode: "ACCUMULATE"
    radius: 256
    centerRadius: 64
    centerX: 0
    centerZ: 0
    weight: 1.0
    # Keep spots from being reused. 0 = off, 1 = the landing chunk, N = bigger square.
    uniquePlacements: 0
    expand: false
  # Default high/low landing window.
  vert:
    name: "LINEAR"
    minY: 32
    maxY: 255
    # Search order: 0 = bottom-up, 1 = top-down, 2 = middle-out, 3 = edges-in, else random.
    direction: 2
    requireSkyLight: true
  # How many safe spots to pre-calculate.
  cacheCap: 50
  # Extra unverified spots kept ready. 0 = off.
  backlogCacheCap: 1000
  # Max chunks kept loaded for instant teleports.
  activeChunkCap: 10
  # Bad-spot tracking precision (1-5).
  spatialResolution: 3
  # Whether regions/worlds need permission.
  requirePermission: false

# バージョン番号は変更しないでください
version: 3.1
