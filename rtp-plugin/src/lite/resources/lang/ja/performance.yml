# --- RTP パフォーマンス設定 ---
# サーバーパフォーマンスに合わせてプラグインの挙動を細かく調整します。
# 最大検索試行回数
# 1 回のリクエストで安全な位置を探す最大試行回数。これを超えると諦めます。
# 影響: 高 — 大きな値はリクエストごとの CPU 使用を大きく増やします。
# @type: integer
# @range: [1, null]
# @default: 32
最大試行回数: 10

# 目的地のプリロード（チャンク）
# 目的地周辺で事前にロードするチャンクの半径。
# ロードされるチャンク数 = ( 1 + 2 * 半径 )^2。
# 影響: 高 — 大きすぎるとテレポート時に TPS 低下を引き起こすことがあります。
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
視距離_選択: 0

# テレポート直前に最終地点の周囲で読み込むチャンク半径。
# 0 は目的地のチャンクのみを読み込みます。
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
視距離_テレポート: 0

# 選択頻度（tick）
# 各リージョンの位置キャッシュをバックグラウンドで補充する間隔。
# ( 20 tick = 1 秒 )。
# 影響: 中 — 値が小さいほど補充は速くなりますが、CPU を多く消費します。
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
周期: 20

# タスクごとの割当時間（ミリ秒）
# 1 tick の中で RTP タスクに使う最大時間（ミリ秒）。
# 範囲: 0 - 50。
# 影響: 中 — 大きいほど処理は速くなりますが、tick を圧迫する可能性があります。
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
割当時間_同期: 50

# 1 ティックあたりに非同期タスクへ費やす最大ミリ秒数。
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
割当時間_非同期: 50

# 最低 TPS 要件
# 新しい位置をキャッシュに追加する前に必要な最低サーバー TPS。
# 範囲: 0.0 - 20.0。
# 影響: 低 — サーバーが既にラグっているときにプラグインが負荷を増やすのを防ぎます。
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
最低TPS: 19.0

# テレポート後キューイング
# true の場合、RTP の直後にプラグインが位置キャッシュの補充を試みます。
# 影響: 中
# @type: boolean
# @default: false
テレポート後キューイング: false

# 同期ロード
# 位置選択時に同期チャンクロードを使用します。
# 影響: 高 — 推奨しません！深刻なサーバーラグを引き起こす可能性があります。
# @type: boolean
# @default: false
同期ロード: false

# 起動時パーミッション解析
# onEventParsing: ワイルドカード権限 *.* と互換性がありません。
# 影響: 中 (onEvent) / 低 (effect)
# @type: boolean
# @default: false
イベント時解析: false

# 起動時にエフェクトの権限ノードを解析します。
# @type: boolean
# @default: true
エフェクト解析: true

# バイオーム選択キャッシュ
# biomeRecall: バイオームごとに過去に見つけた位置を再利用します。
# biomeRecallForced: キャッシュ済みのバイオームのみを使用します。
# 影響: 低〜中
# @type: boolean
# @default: true
バイオーム記憶: true

# 設定すると、バイオーム絞り込み要求をキャッシュからのみ提供します（新たな
# バイオーム検索は行いません）。biomeRecall が必要です。
# @type: boolean
# @default: false
バイオーム記憶_強制: false

# バイオームで絞り込んだ選択に偏りを与え、要求された各バイオームが領域内で
# 占める広さに比例するのではなく、等しい確率で選ばれるようにします。複数の
# バイオームを要求したとき、よくあるバイオームが希少なものを押しのけるのを防ぎます。
# biomeRecall が必要です。絞り込みなし（既定バイオーム）のテレポートには影響しません。
# @type: boolean
# @default: false
biomeWeighted: false

# Per-biome relative selection weights for biome-filtered teleports.
# Only consulted when biomeWeighted is true. Biomes not listed here use
# weight 1.0, so an empty/all-equal map reproduces the equal-probability
# behavior of biomeWeighted on its own. A biome given weight 2.0 is
# steered toward roughly twice as often as a weight-1.0 biome among the
# requested set (when both are present in biome-recall memory); 0.0
# suppresses a biome. Requires biomeRecall; no effect on unfiltered
# (default-biome) teleports. The shipped plains entry is a weight-1.0
# no-op example - replace or extend it with the biomes you want to bias.
# @type: map<string, number>
biomeWeights:
  # このバイオームの相対的な選択ウェイト（1.0 = 偏りなし）。
  # @type: number
  # @range: [0.0, null]
  # @default: 1.0
  plains: 1.0
  sunflower_plains: 1.0
  snowy_plains: 1.0
  ice_spikes: 1.0
  desert: 1.0
  swamp: 1.0
  mangrove_swamp: 1.0
  forest: 1.0
  flower_forest: 1.0
  birch_forest: 1.0
  dark_forest: 1.0
  old_growth_birch_forest: 1.0
  old_growth_pine_taiga: 1.0
  old_growth_spruce_taiga: 1.0
  taiga: 1.0
  snowy_taiga: 1.0
  savanna: 1.0
  savanna_plateau: 1.0
  windswept_hills: 1.0
  windswept_gravelly_hills: 1.0
  windswept_forest: 1.0
  windswept_savanna: 1.0
  jungle: 1.0
  sparse_jungle: 1.0
  bamboo_jungle: 1.0
  badlands: 1.0
  eroded_badlands: 1.0
  wooded_badlands: 1.0
  meadow: 1.0
  cherry_grove: 1.0
  pale_garden: 1.0
  grove: 1.0
  snowy_slopes: 1.0
  frozen_peaks: 1.0
  jagged_peaks: 1.0
  stony_peaks: 1.0
  river: 1.0
  frozen_river: 1.0
  beach: 1.0
  snowy_beach: 1.0
  stony_shore: 1.0
  warm_ocean: 1.0
  lukewarm_ocean: 1.0
  deep_lukewarm_ocean: 1.0
  ocean: 1.0
  deep_ocean: 1.0
  cold_ocean: 1.0
  deep_cold_ocean: 1.0
  frozen_ocean: 1.0
  deep_frozen_ocean: 1.0
  mushroom_fields: 1.0
  dripstone_caves: 1.0
  lush_caves: 1.0
  deep_dark: 1.0
  # --- ネザー ---
  nether_wastes: 1.0
  warped_forest: 1.0
  crimson_forest: 1.0
  soul_sand_valley: 1.0
  basalt_deltas: 1.0
  # --- ジ・エンド ---
  the_end: 1.0
  end_highlands: 1.0
  end_midlands: 1.0
  small_end_islands: 1.0
  end_barrens: 1.0
  # --- その他 / 技術的 ---
  the_void: 1.0

# チャンクロード時のパッシブチェック
# リージョン範囲内でロードされたすべてのチャンクから安全な位置を探します。
# 影響: 高 — チャンクロードイベントでサーバー負荷を大きく増やす可能性があります。
# @type: boolean
# @default: false
チャンクロード時チェック: false

