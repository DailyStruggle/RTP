# --- RTP パフォーマンス設定 ---
# サーバーパフォーマンスに合わせてプラグインの挙動を細かく調整します。
# 最大検索試行回数
# 1 回のリクエストで安全な位置を探す最大試行回数。これを超えると諦めます。
# 影響: 高 — 大きな値はリクエストごとの CPU 使用を大きく増やします。
# @type: integer
# @range: [1, null]
# @default: 32
最大試行回数: 10

# 目的地のプリロード（チャンク）
# 目的地周辺で事前にロードするチャンクの半径。
# ロードされるチャンク数 = ( 1 + 2 * 半径 )^2。
# 影響: 高 — 大きすぎるとテレポート時に TPS 低下を引き起こすことがあります。
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
視距離_選択: 0

# テレポート直前に最終地点の周囲で読み込むチャンク半径。
# 0 は目的地のチャンクのみを読み込みます。
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
視距離_テレポート: 0

# 選択頻度（tick）
# 各リージョンの位置キャッシュをバックグラウンドで補充する間隔。
# ( 20 tick = 1 秒 )。
# 影響: 中 — 値が小さいほど補充は速くなりますが、CPU を多く消費します。
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
周期: 20

# タスクごとの割当時間（ミリ秒）
# 1 tick の中で RTP タスクに使う最大時間（ミリ秒）。
# 範囲: 0 - 50。
# 影響: 中 — 大きいほど処理は速くなりますが、tick を圧迫する可能性があります。
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
割当時間_同期: 50

# 1 ティックあたりに非同期タスクへ費やす最大ミリ秒数。
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
割当時間_非同期: 50

# 最低 TPS 要件
# 新しい位置をキャッシュに追加する前に必要な最低サーバー TPS。
# 範囲: 0.0 - 20.0。
# 影響: 低 — サーバーが既にラグっているときにプラグインが負荷を増やすのを防ぎます。
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
最低TPS: 19.0

# テレポート後キューイング
# true の場合、RTP の直後にプラグインが位置キャッシュの補充を試みます。
# 影響: 中
# @type: boolean
# @default: false
テレポート後キューイング: false

# 同期ロード
# 位置選択時に同期チャンクロードを使用します。
# 影響: 高 — 推奨しません！深刻なサーバーラグを引き起こす可能性があります。
# @type: boolean
# @default: false
同期ロード: false

# 起動時パーミッション解析
# onEventParsing: ワイルドカード権限 *.* と互換性がありません。
# 影響: 中 (onEvent) / 低 (effect)
# @type: boolean
# @default: false
イベント時解析: false

# 起動時にエフェクトの権限ノードを解析します。
# @type: boolean
# @default: true
エフェクト解析: true

# バイオーム選択キャッシュ
# biomeRecall: バイオームごとに過去に見つけた位置を再利用します。
# biomeRecallForced: キャッシュ済みのバイオームのみを使用します。
# 影響: 低〜中
# @type: boolean
# @default: true
バイオーム記憶: true

# 設定すると、バイオーム絞り込み要求をキャッシュからのみ提供します（新たな
# バイオーム検索は行いません）。biomeRecall が必要です。
# @type: boolean
# @default: false
バイオーム記憶_強制: false

# バイオームで絞り込んだ選択に偏りを与え、要求された各バイオームが領域内で
# 占める広さに比例するのではなく、等しい確率で選ばれるようにします。複数の
# バイオームを要求したとき、よくあるバイオームが希少なものを押しのけるのを防ぎます。
# biomeRecall が必要です。絞り込みなし（既定バイオーム）のテレポートには影響しません。
# @type: boolean
# @default: false
バイオーム重み付け: false

# Per-biome relative selection weights for biome-filtered teleports.
# Only consulted when biomeWeighted is true. Biomes not listed here use
# weight 1.0, so an empty/all-equal map reproduces the equal-probability
# behavior of biomeWeighted on its own. A biome given weight 2.0 is
# steered toward roughly twice as often as a weight-1.0 biome among the
# requested set (when both are present in biome-recall memory); 0.0
# suppresses a biome. Requires biomeRecall; no effect on unfiltered
# (default-biome) teleports. The shipped plains entry is a weight-1.0
# no-op example - replace or extend it with the biomes you want to bias.
# @type: map<string, number>
バイオーム重み:
  # このバイオームの相対的な選択ウェイト（1.0 = 偏りなし）。
  # @type: number
  # @range: [0.0, null]
  # @default: 1.0
  plains: 1.0
  sunflower_plains: 1.0
  snowy_plains: 1.0
  ice_spikes: 1.0
  desert: 1.0
  swamp: 1.0
  mangrove_swamp: 1.0
  forest: 1.0
  flower_forest: 1.0
  birch_forest: 1.0
  dark_forest: 1.0
  old_growth_birch_forest: 1.0
  old_growth_pine_taiga: 1.0
  old_growth_spruce_taiga: 1.0
  taiga: 1.0
  snowy_taiga: 1.0
  savanna: 1.0
  savanna_plateau: 1.0
  windswept_hills: 1.0
  windswept_gravelly_hills: 1.0
  windswept_forest: 1.0
  windswept_savanna: 1.0
  jungle: 1.0
  sparse_jungle: 1.0
  bamboo_jungle: 1.0
  badlands: 1.0
  eroded_badlands: 1.0
  wooded_badlands: 1.0
  meadow: 1.0
  cherry_grove: 1.0
  pale_garden: 1.0
  grove: 1.0
  snowy_slopes: 1.0
  frozen_peaks: 1.0
  jagged_peaks: 1.0
  stony_peaks: 1.0
  river: 1.0
  frozen_river: 1.0
  beach: 1.0
  snowy_beach: 1.0
  stony_shore: 1.0
  warm_ocean: 1.0
  lukewarm_ocean: 1.0
  deep_lukewarm_ocean: 1.0
  ocean: 1.0
  deep_ocean: 1.0
  cold_ocean: 1.0
  deep_cold_ocean: 1.0
  frozen_ocean: 1.0
  deep_frozen_ocean: 1.0
  mushroom_fields: 1.0
  dripstone_caves: 1.0
  lush_caves: 1.0
  deep_dark: 1.0
  # --- ネザー ---
  nether_wastes: 1.0
  warped_forest: 1.0
  crimson_forest: 1.0
  soul_sand_valley: 1.0
  basalt_deltas: 1.0
  # --- ジ・エンド ---
  the_end: 1.0
  end_highlands: 1.0
  end_midlands: 1.0
  small_end_islands: 1.0
  end_barrens: 1.0
  # --- その他 / 技術的 ---
  the_void: 1.0

# チャンクロード時のパッシブチェック
# リージョン範囲内でロードされたすべてのチャンクから安全な位置を探します。
# 影響: 高 — チャンクロードイベントでサーバー負荷を大きく増やす可能性があります。
# @type: boolean
# @default: false
チャンクロード時チェック: false

# 観察モードキャッシュ補充 (Region Data Visitor)
# プリジェネレーション済みキャッシュが満杯の場合、同じ `period` 周期で
# 各リージョンに観察モードの RegionCacheTask をスケジュールします。
# 通常のキャッシュ補充と同じ LocationGenerator パイプラインを再利用しますが、
# 安全候補をキューに入れずに破棄するため、副作用（不良位置の記録、観測済み
# バイオームの収集など）はバックグラウンドで蓄積される一方、キューが上限を
# 超えることはありません。
# ワールド生成は決して引き起こしません: ディスクに書き込まれていないチャンクは
# の Anvil プリフィルタにより UNKNOWN としてスキップされます。
# visitorEnabled: メインスイッチ (true で観察モードを有効化)。
# 頻度は上の `period` 設定に従います。専用のレートパラメータはありません。
# 影響: 低 — 既存の `period` で律速されており、デフォルト補充モードでキャッシュに
# 余裕があるときにのみ追加作業が行われます。
# @type: boolean
# @default: false
ビジター有効: true

# 参加時テレポート (rtp.onevent.firstjoin / rtp.onevent.join) 用に予約位置キャッシュを維持します。残りの空きスロット数でサイズが決まります。 参照。
# @type: boolean
# @default: false
ログインキャッシュ有効: false

# 参加キャッシュの上限。0 = 自動 (起動時のサーバー max-players)。
# @type: integer
# @range: [0, null]
# @default: 0
ログインキャッシュ上限: 0

# 選択試行ごとに未生成チャンクを拒否する確率。
# 0.0 = 偏りなし（既定）、1.0 = 未生成の土地を厳密に避ける。
# 生成済みチャンクは常に通過します。
# @type: number
# @range: [0.0, 1.0]
# @default: 0.0
事前生成優先度: 0.0

# L3 バックログ容量のどの割合で補充を再開するか（ヒステリシス）。
# 0.5 = L3 が 50% まで減ってから補充（既定）。1.0 = 継続的に補充。
# 値を大きくすると .mca ビンの確認がまとめられ、CPU/メモリ効率が向上します。
# @type: number
# @range: [0.0, 1.0]
# @default: 0.5
バックログ補充しきい値: 0.5

# この遅延しきい値（ミリ秒）を超えると、即時提供（キュー未経由）のテレポートが
# 監査されます。WARN が記録され、累積カウンタ slowPipelineCount（/rtp info で表示）
# が増加します。監査対象は即時/キュー未経由のテレポートのみで、キュー経由の
# 一定レートのテレポートは測定時間にキュー待ちを含むため除外されます。
# 0 以下で監査を無効化します。ADR-053 を参照。
# @type: integer
# @range: [0, null]
# @unit: ms
# @default: 5000
低速パイプラインしきい値Ms: 5000

# 公開テレポートキューの深さ（待機中のプレイヤー数）がこの値以上になると、
# キューの背圧が監査されます。エッジトリガーで WARN が記録され、累積カウンタ
# queueGrowthWarnCount（/rtp info で表示）が境界の通過ごとに 1 回増加します。
# 0 以下で監査を無効化します（オプトイン）。ADR-053 を参照。
# @type: integer
# @range: [0, null]
# @unit: players
# @default: 0
キュー増加警告しきい値: 0

# /rtp admin prefab の設定。apply -> confirm の流れで、変更した各設定ファイルを
# <file>.yml.bak.<epochMillis> という名前のバックアップとともに書き込みます。
# bakRetention はファイルごとに保持するバックアップ数の上限で、古いものから削除します。
# 1 にすると最新のバックアップのみ保持。1 未満の値は 1 に切り上げられます。
# /rtp admin prefab rollback は複数回の呼び出しでバックアップを新しい順にたどります。
プリセット:
  # ファイルごとに保持されるタイムスタンプ付き設定バックアップの数。
  # @type: integer
  # @range: [1, null]
  # @default: 3
  bak保持数: 3
# バージョン番号は変更しないでください
version: 1.0
