# Retraso del teletransporte (segundos)
# Tiempo que el jugador debe esperar antes de que se realice el teletransporte.
# A veces le da tiempo al servidor para precargar los chunks de destino.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 2
retrasoTeletransporte: 2

# Cancelación por movimiento (bloques)
# Si el jugador se mueve más de esta distancia durante el retraso, el
# teletransporte se cancela. Establece -1 para desactivarlo.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 2
distanciaCancelar: 2

# Tiempo de espera entre teletransportes (segundos)
# Tiempo que el jugador debe esperar entre usos exitosos de RTP.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 300
enfriamientoTeletransporte: 300

# Número máximo de usos correctos de /rtp que un jugador puede hacer dentro de la
# ventana lockAfterResetSeconds antes de ser bloqueado (paridad con LockAfter de BetterRTP).
# 0 desactiva el límite. Se omite con rtp.nolock.
# @type: integer
# @range: [0, null]
# @default: 0
lockAfterUses: 0

# Duración de la ventana móvil del límite de usos para lockAfterUses. El contador se reinicia
# tantos segundos después del primer uso de la ventana. 0 significa que el límite nunca se
# reinicia (un límite permanente).
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 0
lockAfterResetSeconds: 0

# Cuando es true, un /rtp correcto establece el lugar de aterrizaje como punto de
# reaparición persistente del jugador (paridad con BetterRTP).
# @type: boolean
# @default: false
setRespawnOnTeleport: false

# Comandos posteriores al teletransporte
# Lista de comandos a ejecutar tras un teletransporte exitoso.
# El marcador [player] representa el nombre del jugador.
# @type: list<string>
comandosConsola:
  - "say ¡[player] acaba de teletransportarse aleatoriamente!"

# Comandos ejecutados como el jugador teletransportado tras un teletransporte exitoso.
# Use [player] para el nombre del jugador. Las entradas vacías se ignoran.
# @type: list<string>
comandosJugador:
  # Comandos ejecutados como el jugador teletransportado tras un teletransporte exitoso.
  # Use [player] para el nombre del jugador. Las entradas vacías se ignoran.
  # @type: list<string>
  - ""

# Marco de menús generalizado.
# `renderer` es una lista ordenada de preferencia de ids de renderer. En
# caso de excepción o de adaptador faltante, el framework recorre la lista
# y recurre a la siguiente entrada. Si la lista se agota, la ruta de
# apertura sin token cae al mensaje configurable `menuInvalid`. Ids
# disponibles: book. (El renderer de chat llegará en una entrega posterior
# y se añadirá entonces a la lista por defecto.)
menu:
  # Ordered preference list of renderer ids.
  # @type: list<enum>
  # @options: ["book", "chat"]
  renderer:
    # Marco de menús generalizado.
    # `renderer` es una lista ordenada de preferencia de ids de renderer. En
    # caso de excepción o de adaptador faltante, el framework recorre la lista
    # y recurre a la siguiente entrada. Si la lista se agota, la ruta de
    # apertura sin token cae al mensaje configurable `menuInvalid`. Ids
    # disponibles: book. (El renderer de chat llegará en una entrega posterior
    # y se añadirá entonces a la lista por defecto.)
    - "book"

# Valores predeterminados globales heredados por los archivos de región/mundo mediante el token "@config".
defaults:
  # Forma y tamaño del área por defecto. radius/centerRadius = qué tan lejos aterrizas, medido en chunks.
  shape:
    name: "CIRCLE"
    mode: "ACCUMULATE"
    radius: 256
    centerRadius: 64
    centerX: 0
    centerZ: 0
    weight: 1.0
    # Keep spots from being reused. 0 = off, 1 = the landing chunk, N = bigger square.
    uniquePlacements: 0
    expand: false
  # Default high/low landing window.
  vert:
    name: "LINEAR"
    minY: 32
    maxY: 255
    # Search order: 0 = bottom-up, 1 = top-down, 2 = middle-out, 3 = edges-in, else random.
    direction: 2
    requireSkyLight: true
  # How many safe spots to pre-calculate.
  cacheCap: 50
  # Extra unverified spots kept ready. 0 = off.
  backlogCacheCap: 1000
  # Max chunks kept loaded for instant teleports.
  activeChunkCap: 10
  # Bad-spot tracking precision (1-5).
  spatialResolution: 3
  # Whether regions/worlds need permission.
  requirePermission: false

# NO MODIFIQUES EL NÚMERO DE VERSIÓN
version: 3.1
