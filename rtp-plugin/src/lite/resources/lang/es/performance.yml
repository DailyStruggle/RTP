# --- Configuración de rendimiento de RTP ---
# Ajusta con precisión el plugin para el rendimiento del servidor.
# Intentos máximos de búsqueda
# Cuántas veces buscará el plugin una ubicación segura antes de detenerse.
# Impacto: ALTO — valores elevados pueden aumentar mucho el uso de CPU por petición.
# @type: integer
# @range: [1, null]
# @default: 32
intentosMaximos: 10

# Precarga de destino (chunks)
# Radio de chunks a precargar alrededor del destino.
# Número de chunks cargados = ( 1 + 2 * radio )^2.
# Impacto: ALTO — un valor demasiado alto puede causar caídas de TPS al teletransportar.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
distanciaVistaSeleccion: 0

# Chunk radius loaded around the final location immediately before
# teleport. 0 loads only the destination chunk.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
distanciaVistaTeletransporte: 0

# Frecuencia de selección (ticks de juego)
# Tiempo entre búsquedas de nuevas ubicaciones para rellenar las cachés de región.
# ( 20 ticks = 1 segundo ).
# Impacto: MEDIO — valores menores rellenan la caché más rápido pero usan más CPU.
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
periodo: 20

# Tiempo asignado por tarea (milisegundos)
# Tiempo máximo (ms) que se dedica a tareas RTP por tick.
# Rango: 0 - 50.
# Impacto: MEDIO — valores altos permiten procesar más rápido a riesgo del tiempo de tick.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
tiempoAsignadoSincrono: 50

# Maximum milliseconds per tick spent in asynchronous tasks.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
tiempoAsignadoAsincrono: 50

# Requisito mínimo de TPS
# TPS mínimo del servidor antes de encolar una nueva ubicación para la caché.
# Rango: 0.0 - 20.0.
# Impacto: BAJO — evita que el plugin añada lag cuando el servidor va mal.
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
tpsMinimo: 19.0

# Encolado posterior al teletransporte
# Si es true, el plugin intentará rellenar la caché de ubicaciones inmediatamente después de un RTP.
# Impacto: MEDIO
# @type: boolean
# @default: false
encolarPostTeletransporte: false

# Carga síncrona
# Usar carga síncrona de chunks para la selección de ubicaciones.
# Impacto: ALTO — ¡NO RECOMENDADO! Puede provocar bloqueos importantes del servidor.
# @type: boolean
# @default: false
cargaSincrona: false

# Parse effect permission nodes at startup.
# @type: boolean
# @default: true
analisisEfectos: true

# Caché de selección de biomas
# biomeRecall: Reutilizar ubicaciones previamente encontradas por bioma.
# biomeRecallForced: Usar únicamente biomas ya descubiertos y almacenados en caché.
# Impacto: BAJO a MEDIO
# @type: boolean
# @default: true
recuerdoBioma: true

# When set, only serve biome-filtered requests from cache (never
# generate new biome searches). Requires biomeRecall.
# @type: boolean
# @default: false
recuerdoBiomaForzado: false

# Bias biome-filtered selection so each requested biome is steered toward
# with equal probability, instead of in proportion to how much of the
# region it covers. Counteracts common biomes drowning out rare ones when
# several biomes are requested. Requires biomeRecall; no effect on
# unfiltered (default-biome) teleports.
# @type: boolean
# @default: false
biomeWeighted: false

# Per-biome relative selection weights for biome-filtered teleports.
# Only consulted when biomeWeighted is true. Biomes not listed here use
# weight 1.0, so an empty/all-equal map reproduces the equal-probability
# behavior of biomeWeighted on its own. A biome given weight 2.0 is
# steered toward roughly twice as often as a weight-1.0 biome among the
# requested set (when both are present in biome-recall memory); 0.0
# suppresses a biome. Requires biomeRecall; no effect on unfiltered
# (default-biome) teleports. The shipped plains entry is a weight-1.0
# no-op example - replace or extend it with the biomes you want to bias.
# @type: map<string, number>
biomeWeights:
  # @type: number
  # @range: [0.0, null]
  # @default: 1.0
  plains: 1.0

# Comprobación pasiva de chunks
# Busca ubicaciones seguras dentro de todos los chunks cargados dentro del rango de una región.
# Impacto: ALTO — puede aumentar significativamente la carga del servidor en los eventos de carga de chunks.
# @type: boolean
# @default: false
verificarEnCargaChunk: false

# DO NOT TOUCH VERSION NUMBER
version: 1.0
