  - "DEEP_OCEAN"
  - "WARM_OCEAN"
  - "LUKEWARM_OCEAN"
  - "DEEP_LUKEWARM_OCEAN"
  - "COLD_OCEAN"
  - "DEEP_COLD_OCEAN"
  - "FROZEN_OCEAN"
  - "DEEP_FROZEN_OCEAN"
  - "RIVER"
