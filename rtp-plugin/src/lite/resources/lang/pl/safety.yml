  - "BEACH"
  - "SNOWY_BEACH"
  - "STONY_SHORE"
  - "SWAMP"
  - "MANGROVE_SWAMP"
  - "SMALL_END_ISLANDS"
  - "BASALT_DELTAS"
  - "DRIPSTONE_CAVES"
  - "LUSH_CAVES"
  - "DEEP_DARK"
  - "THE_VOID"

# DO NOT TOUCH VERSION NUMBER
version: 1.0
