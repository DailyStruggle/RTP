# --- RTP 성능 설정 ---
# 서버 성능에 맞춰 플러그인의 동작을 세밀하게 조정합니다.
# 최대 검색 시도 횟수
# 한 번의 요청에서 안전한 위치를 찾기 위한 최대 시도 횟수. 초과 시 포기합니다.
# 영향: 높음 — 큰 값은 요청당 CPU 사용량을 크게 증가시킵니다.
# @type: integer
# @range: [1, null]
# @default: 32
최대시도횟수: 10

# 목적지 사전 로드(청크)
# 목적지 주변에서 미리 로드할 청크의 반경.
# 로드되는 청크 수 = ( 1 + 2 * 반경 )^2.
# 영향: 높음 — 너무 크면 텔레포트 시 TPS 저하를 일으킬 수 있습니다.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
시야거리_선택: 0

# 텔레포트 직전에 최종 위치 주변에서 불러올 청크 반경.
# 0 은 목적지 청크만 불러옵니다.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
시야거리_텔레포트: 0

# 선택 빈도(틱)
# 각 리전의 위치 캐시를 백그라운드에서 보충하는 간격.
# ( 20 틱 = 1 초 ).
# 영향: 중간 — 값이 작을수록 보충은 빨라지지만 CPU 를 더 많이 사용합니다.
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
주기: 20

# 작업당 할당 시간(밀리초)
# 1 틱 내에서 RTP 작업에 사용하는 최대 시간(밀리초).
# 범위: 0 - 50.
# 영향: 중간 — 클수록 처리 속도가 빨라지지만 틱을 압박할 수 있습니다.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
할당시간_동기: 50

# 틱당 비동기 작업에 사용하는 최대 밀리초.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
할당시간_비동기: 50

# 최소 TPS 요구치
# 새 위치를 캐시에 추가하기 전에 필요한 최소 서버 TPS.
# 범위: 0.0 - 20.0.
# 영향: 낮음 — 서버가 이미 랙이 있을 때 플러그인이 부하를 가중시키는 것을 방지합니다.
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
최소TPS: 19.0

# 텔레포트 후 큐잉
# true 인 경우 RTP 직후에 플러그인이 위치 캐시 보충을 시도합니다.
# 영향: 중간
# @type: boolean
# @default: false
텔레포트후큐잉: false

# 동기 로딩
# 위치 선택 시 동기 청크 로드를 사용합니다.
# 영향: 높음 — 권장하지 않습니다! 심각한 서버 랙을 유발할 수 있습니다.
# @type: boolean
# @default: false
동기로딩: false

# 시작 시 권한 파싱
# onEventParsing: 와일드카드 권한 *.* 와 호환되지 않습니다.
# 영향: 중간 (onEvent) / 낮음 (effect)
# @type: boolean
# @default: false
이벤트시파싱: false

# 시작 시 효과 권한 노드를 구문 분석합니다.
# @type: boolean
# @default: true
이펙트파싱: true

# 바이옴 선택 캐시
# biomeRecall: 바이옴별로 과거에 찾은 위치를 재사용합니다.
# biomeRecallForced: 캐시된 바이옴만 사용합니다.
# 영향: 낮음~중간
# @type: boolean
# @default: true
바이옴기억: true

# 설정하면 바이옴 필터 요청을 캐시에서만 제공합니다(새 바이옴 검색을 시작하지
# 않음). biomeRecall 이 필요합니다.
# @type: boolean
# @default: false
바이옴기억_강제: false

# 바이옴 필터 선택에 가중치를 주어, 요청된 각 바이옴이 영역에서 차지하는 비율이
# 아니라 동일한 확률로 선택되도록 합니다. 여러 바이옴을 요청할 때 흔한 바이옴이
# 희귀한 바이옴을 밀어내는 것을 막습니다. biomeRecall 이 필요하며, 필터링되지
# 않은(기본 바이옴) 텔레포트에는 영향이 없습니다.
# @type: boolean
# @default: false
바이옴가중치: false

# Per-biome relative selection weights for biome-filtered teleports.
# Only consulted when biomeWeighted is true. Biomes not listed here use
# weight 1.0, so an empty/all-equal map reproduces the equal-probability
# behavior of biomeWeighted on its own. A biome given weight 2.0 is
# steered toward roughly twice as often as a weight-1.0 biome among the
# requested set (when both are present in biome-recall memory); 0.0
# suppresses a biome. Requires biomeRecall; no effect on unfiltered
# (default-biome) teleports. The shipped plains entry is a weight-1.0
# no-op example - replace or extend it with the biomes you want to bias.
# @type: map<string, number>
바이옴가중치맵:
  # 이 바이옴의 상대 선택 가중치 (1.0 = 편향 없음).
  # @type: number
  # @range: [0.0, null]
  # @default: 1.0
  plains: 1.0
  sunflower_plains: 1.0
  snowy_plains: 1.0
  ice_spikes: 1.0
  desert: 1.0
  swamp: 1.0
  mangrove_swamp: 1.0
  forest: 1.0
  flower_forest: 1.0
  birch_forest: 1.0
  dark_forest: 1.0
  old_growth_birch_forest: 1.0
  old_growth_pine_taiga: 1.0
  old_growth_spruce_taiga: 1.0
  taiga: 1.0
  snowy_taiga: 1.0
  savanna: 1.0
  savanna_plateau: 1.0
  windswept_hills: 1.0
  windswept_gravelly_hills: 1.0
  windswept_forest: 1.0
  windswept_savanna: 1.0
  jungle: 1.0
  sparse_jungle: 1.0
  bamboo_jungle: 1.0
  badlands: 1.0
  eroded_badlands: 1.0
  wooded_badlands: 1.0
  meadow: 1.0
  cherry_grove: 1.0
  pale_garden: 1.0
  grove: 1.0
  snowy_slopes: 1.0
  frozen_peaks: 1.0
  jagged_peaks: 1.0
  stony_peaks: 1.0
  river: 1.0
  frozen_river: 1.0
  beach: 1.0
  snowy_beach: 1.0
  stony_shore: 1.0
  warm_ocean: 1.0
  lukewarm_ocean: 1.0
  deep_lukewarm_ocean: 1.0
  ocean: 1.0
  deep_ocean: 1.0
  cold_ocean: 1.0
  deep_cold_ocean: 1.0
  frozen_ocean: 1.0
  deep_frozen_ocean: 1.0
  mushroom_fields: 1.0
  dripstone_caves: 1.0
  lush_caves: 1.0
  deep_dark: 1.0
  # --- 네더 ---
  nether_wastes: 1.0
  warped_forest: 1.0
  crimson_forest: 1.0
  soul_sand_valley: 1.0
  basalt_deltas: 1.0
  # --- 디 엔드 ---
  the_end: 1.0
  end_highlands: 1.0
  end_midlands: 1.0
  small_end_islands: 1.0
  end_barrens: 1.0
  # --- 기타 / 기술적 ---
  the_void: 1.0

# 청크 로드 시 패시브 검사
# 리전 범위 내에서 로드된 모든 청크에서 안전한 위치를 찾습니다.
# 영향: 높음 — 청크 로드 이벤트에서 서버 부하를 크게 증가시킬 수 있습니다.
# @type: boolean
# @default: false
청크로드시검사: false

# 관찰 모드 캐시 보충 (Region Data Visitor)
# 사전 생성된 캐시가 가득 찬 경우, 동일한 `period` 주기로 각 리전에
# 관찰 모드 RegionCacheTask 를 스케줄링합니다.
# 일반 캐시 보충과 동일한 LocationGenerator 파이프라인을 재사용하지만,
# 안전 후보를 큐에 넣지 않고 폐기하므로 부수 효과(불량 위치 기록, 관찰된
# 바이옴 수집 등)는 백그라운드에서 누적되지만 큐가 한계를 초과하지는
# 않습니다.
# 월드 생성을 결코 유발하지 않습니다: 디스크에 기록되지 않은 청크는
# 의 Anvil 사전 필터에 의해 UNKNOWN 으로 건너뜁니다.
# visitorEnabled: 메인 스위치 (true 로 관찰 모드 활성화).
# 빈도는 위의 `period` 설정을 따릅니다. 전용 속도 매개변수는 없습니다.
# 영향: 낮음 — 기존 `period` 에 의해 율속되며, 기본 보충 모드에서 캐시에
# 여유가 있을 때만 추가 작업이 수행됩니다.
# @type: boolean
# @default: false
방문자활성화: true

# 접속 텔레포트 (rtp.onevent.firstjoin / rtp.onevent.join) 용 예약 캐시를 유지합니다. 남은 빈 슬롯 수로 크기가 결정됩니다. 참고.
# @type: boolean
# @default: false
로그인캐시활성화: false

# 접속 캐시 상한. 0 = 자동 (시작 시 서버 max-players).
# @type: integer
# @range: [0, null]
# @default: 0
로그인캐시상한: 0

# 선택 시도마다 미생성 청크를 거부할 확률.
# 0.0 = 편향 없음(기본값), 1.0 = 미생성 지형을 엄격히 회피.
# 생성된 청크는 항상 통과합니다.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.0
사전생성선호도: 0.0

# 보충을 재개하는 L3 백로그 용량의 비율(히스테리시스).
# 0.5 = L3 가 50%까지 줄어든 후에만 보충(기본값). 1.0 = 지속적으로 보충.
# 값이 클수록 .mca 빈 검사를 묶어 CPU/메모리 효율이 좋아집니다.
# @type: number
# @range: [0.0, 1.0]
# @default: 0.5
백로그보충임계값: 0.5

# 이 지연 임계값(ms)을 초과하면 즉시 제공된(큐 미경유) 텔레포트가 감사됩니다.
# WARN 이 기록되고 누적 카운터 slowPipelineCount(/rtp info 에 표시)가 증가합니다.
# 즉시/큐 미경유 텔레포트만 감사하며, 큐를 거친 정속 텔레포트는 측정 시간에
# 큐 대기 시간이 포함되어 제외됩니다. 0 이하이면 감사를 비활성화합니다. ADR-053 참조.
# @type: integer
# @range: [0, null]
# @unit: ms
# @default: 5000
느린파이프라인임계값Ms: 5000

# 공개 텔레포트 큐 깊이(대기 중인 플레이어)가 이 값 이상이면 큐 배압이
# 감사됩니다. 에지 트리거 WARN 이 기록되고 누적 카운터 queueGrowthWarnCount
# (/rtp info 에 표시)가 경계를 넘을 때마다 한 번 증가합니다.
# 0 이하이면 감사를 비활성화합니다(옵트인). ADR-053 참조.
# @type: integer
# @range: [0, null]
# @unit: players
# @default: 0
대기열증가경고임계값: 0

# /rtp admin prefab 설정. apply -> confirm 흐름은 변경된 각 설정 파일을
# <file>.yml.bak.<epochMillis> 라는 백업과 함께 기록합니다.
# bakRetention 은 파일당 보관하는 백업 개수의 상한이며 오래된 것부터 제거합니다.
# 1 로 설정하면 가장 최근 백업만 보관하고, 1 미만 값은 1 로 보정됩니다.
# /rtp admin prefab rollback 은 여러 번 호출에 걸쳐 백업을 최신 순으로 진행합니다.
프리셋:
  # Number of timestamped config backups kept per file before pruning.
  # @type: integer
  # @range: [1, null]
  # @default: 3
  bakRetention: 3
# 버전 번호를 건드리지 마세요
version: 1.0
