# --- RTP Biome Filter (advanced) ---
# Documentation: plugins/RTP/docs/admin/configuration/SAFETY.md

# Split out of safety.yml so the common safety knobs stay uncluttered.
#
# If true, the biomes list is a whitelist (only these biomes are
# allowed). If false, it is a blacklist (these biomes are excluded).
# @type: boolean
# @default: false
바이옥화이트리스트: false

# Biomes treated as whitelist or blacklist members per biomeWhitelist.
# @type: list<biome>
# @source: biome
바이옥:
  - "OCEAN"
  - "DEEP_OCEAN"
  - "WARM_OCEAN"
  - "LUKEWARM_OCEAN"
  - "DEEP_LUKEWARM_OCEAN"
  - "COLD_OCEAN"
  - "DEEP_COLD_OCEAN"
  - "FROZEN_OCEAN"
  - "DEEP_FROZEN_OCEAN"
  - "RIVER"
  - "FROZEN_RIVER"
  - "BEACH"
  - "SNOWY_BEACH"
  - "STONY_SHORE"
  - "SWAMP"
  - "MANGROVE_SWAMP"
  - "SMALL_END_ISLANDS"
  - "BASALT_DELTAS"
  - "DRIPSTONE_CAVES"
  - "LUSH_CAVES"
  - "DEEP_DARK"
  - "THE_VOID"

# 요청된 각 바이옴을 영역 점유 비율이 아니라 동일한 확률로 유도합니다.
# biomeRecall이 필요합니다. 필터 없는 텔레포트에는 영향이 없습니다.
# @type: boolean
# @default: false
바이옴가중치: false

# 바이옴 필터 텔레포트의 바이옴별 상대 가중치. biomeWeighted가 true일 때만 사용.
# 목록에 없는 바이옴은 1.0(편향 없음), 2.0 = 약 2배 자주 선택, 0.0 = 억제.
# 전체 바닐라 세트는 편집 가능한 참고용으로 1.0으로 미리 나열됨; 모드 바이옴은
# 플랫폼 id로 추가(예: terralith:emerald_peaks). biomeRecall이 필요합니다.
# @type: map<string, number>
바이옴가중치맵:
  # 이 바이옴의 상대 선택 가중치 (1.0 = 편향 없음).
  # @type: number
  # @range: [0.0, null]
  # @default: 1.0
  plains: 1.0
  sunflower_plains: 1.0
  snowy_plains: 1.0
  ice_spikes: 1.0
  desert: 1.0
  swamp: 1.0
  mangrove_swamp: 1.0
  forest: 1.0
  flower_forest: 1.0
  birch_forest: 1.0
  dark_forest: 1.0
  old_growth_birch_forest: 1.0
  old_growth_pine_taiga: 1.0
  old_growth_spruce_taiga: 1.0
  taiga: 1.0
  snowy_taiga: 1.0
  savanna: 1.0
  savanna_plateau: 1.0
  windswept_hills: 1.0
  windswept_gravelly_hills: 1.0
  windswept_forest: 1.0
  windswept_savanna: 1.0
  jungle: 1.0
  sparse_jungle: 1.0
  bamboo_jungle: 1.0
  badlands: 1.0
  eroded_badlands: 1.0
  wooded_badlands: 1.0
  meadow: 1.0
  cherry_grove: 1.0
  pale_garden: 1.0
  grove: 1.0
  snowy_slopes: 1.0
  frozen_peaks: 1.0
  jagged_peaks: 1.0
  stony_peaks: 1.0
  river: 1.0
  frozen_river: 1.0
  beach: 1.0
  snowy_beach: 1.0
  stony_shore: 1.0
  warm_ocean: 1.0
  lukewarm_ocean: 1.0
  deep_lukewarm_ocean: 1.0
  ocean: 1.0
  deep_ocean: 1.0
  cold_ocean: 1.0
  deep_cold_ocean: 1.0
  frozen_ocean: 1.0
  deep_frozen_ocean: 1.0
  mushroom_fields: 1.0
  dripstone_caves: 1.0
  lush_caves: 1.0
  deep_dark: 1.0
  # --- 네더 ---
