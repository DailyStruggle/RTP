# --- RTP 性能设置 ---
# 针对服务器性能精细调节插件行为。
# 最大查找尝试次数
# 在放弃前为单次请求查找安全位置的最大尝试次数。
# 影响: 高 — 数值过大会显著增加每次请求的 CPU 占用。
# @type: integer
# @range: [1, null]
# @default: 32
最大尝试次数: 10

# 目标位置预加载（区块）
# 在目标周围预加载的区块半径。
# 加载的区块数 = ( 1 + 2 * 半径 )^2。
# 影响: 高 — 数值过大可能在传送时导致 TPS 下降。
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
视距_选择: 0

# 传送前在最终位置周围加载的区块半径。
# 0 仅加载目标区块。
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
视距_传送: 0

# 选择频率（游戏刻）
# 后台为各区域缓存补充新位置的间隔时间。
# ( 20 ticks = 1 秒 )。
# 影响: 中 — 数值越小补充越快，但 CPU 占用越多。
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
周期: 20

# 单次任务分配时间（毫秒）
# 每个 tick 用于 RTP 任务的最大时间（毫秒）。
# 范围: 0 - 50。
# 影响: 中 — 数值越大处理越快，但可能挤压 tick 时间。
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
分配时间_同步: 50

# 每刻用于异步任务的最大毫秒数。
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
分配时间_异步: 50

# 最低 TPS 要求
# 在向缓存中追加新位置之前要求的最低服务器 TPS。
# 范围: 0.0 - 20.0。
# 影响: 低 — 防止插件在服务器卡顿时进一步加重负担。
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
最低TPS: 19.0

# 传送后排队
# 若为 true，则插件会在一次 RTP 之后立即尝试补充位置缓存。
# 影响: 中
# @type: boolean
# @default: false
传送后排队: false

# 同步加载
# 在选择位置时使用同步区块加载。
# 影响: 高 — 不推荐！可能造成严重的服务器卡顿。
# @type: boolean
# @default: false
同步加载: false

# 权限解析（启动时）
# onEventParsing: 与通配符权限 *.* 不兼容。
# 影响: 中 (onEvent) / 低 (effect)
# @type: boolean
# @default: false
事件时解析: false

# 在启动时解析效果权限节点。
# @type: boolean
# @default: true
效果解析: true

# 生物群系选择缓存
# biomeRecall: 复用按生物群系曾经找到过的位置。
# biomeRecallForced: 仅使用缓存中已发现的生物群系。
# 影响: 低 至 中
# @type: boolean
# @default: true
生物群系记忆: true

# 启用后，仅从缓存中处理按生物群系筛选的请求（绝不发起新的生物群系搜索）。
# 需要 biomeRecall。
# @type: boolean
# @default: false
生物群系记忆_强制: false

# 对按生物群系筛选的选择进行加权，使每个请求的生物群系以相同概率被选中，
# 而不是按其在区域中所占比例选中。当请求多个生物群系时，可防止常见生物群系
# 淹没稀有生物群系。需要 biomeRecall；对未筛选（默认生物群系）的传送无效。
# @type: boolean
# @default: false
biomeWeighted: false

# Per-biome relative selection weights for biome-filtered teleports.
# Only consulted when biomeWeighted is true. Biomes not listed here use
# weight 1.0, so an empty/all-equal map reproduces the equal-probability
# behavior of biomeWeighted on its own. A biome given weight 2.0 is
# steered toward roughly twice as often as a weight-1.0 biome among the
# requested set (when both are present in biome-recall memory); 0.0
# suppresses a biome. Requires biomeRecall; no effect on unfiltered
# (default-biome) teleports. The shipped plains entry is a weight-1.0
# no-op example - replace or extend it with the biomes you want to bias.
# @type: map<string, number>
biomeWeights:
  # 该生物群系的相对选择权重（1.0 = 无偏向）。
  # @type: number
  # @range: [0.0, null]
  # @default: 1.0
  plains: 1.0
  sunflower_plains: 1.0
  snowy_plains: 1.0
  ice_spikes: 1.0
  desert: 1.0
  swamp: 1.0
  mangrove_swamp: 1.0
  forest: 1.0
  flower_forest: 1.0
  birch_forest: 1.0
  dark_forest: 1.0
  old_growth_birch_forest: 1.0
  old_growth_pine_taiga: 1.0
  old_growth_spruce_taiga: 1.0
  taiga: 1.0
  snowy_taiga: 1.0
  savanna: 1.0
  savanna_plateau: 1.0
  windswept_hills: 1.0
  windswept_gravelly_hills: 1.0
  windswept_forest: 1.0
  windswept_savanna: 1.0
  jungle: 1.0
  sparse_jungle: 1.0
  bamboo_jungle: 1.0
  badlands: 1.0
  eroded_badlands: 1.0
  wooded_badlands: 1.0
  meadow: 1.0
  cherry_grove: 1.0
  pale_garden: 1.0
  grove: 1.0
  snowy_slopes: 1.0
  frozen_peaks: 1.0
  jagged_peaks: 1.0
  stony_peaks: 1.0
  river: 1.0
  frozen_river: 1.0
  beach: 1.0
  snowy_beach: 1.0
  stony_shore: 1.0
  warm_ocean: 1.0
  lukewarm_ocean: 1.0
  deep_lukewarm_ocean: 1.0
  ocean: 1.0
  deep_ocean: 1.0
  cold_ocean: 1.0
  deep_cold_ocean: 1.0
  frozen_ocean: 1.0
  deep_frozen_ocean: 1.0
  mushroom_fields: 1.0
  dripstone_caves: 1.0
  lush_caves: 1.0
  deep_dark: 1.0
  # --- 下界 ---
  nether_wastes: 1.0
  warped_forest: 1.0
  crimson_forest: 1.0
  soul_sand_valley: 1.0
  basalt_deltas: 1.0
  # --- 末地 ---
  the_end: 1.0
  end_highlands: 1.0
  end_midlands: 1.0
  small_end_islands: 1.0
  end_barrens: 1.0
  # --- 杂项 / 技术 ---
  the_void: 1.0

# 区块加载时被动检查
# 在区域范围内的所有已加载区块中查找安全位置。
# 影响: 高 — 可能在区块加载事件中显著增加服务器负担。
# @type: boolean
# @default: false
区块加载时检查: false

# 请勿修改版本号
version: 1.0
