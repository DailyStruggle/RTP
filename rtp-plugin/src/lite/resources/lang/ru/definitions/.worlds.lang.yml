# --- Карта языка: worlds/*.yml ---
# Сопоставляет внутренние ключи мира (слева) с именами, видимыми
# пользователю во всех файлах под `worlds/` (справа).
# Изменяйте только правую сторону; левая сторона является константой
# кода и не должна изменяться.
# Если этот файл отсутствует, плагин восстановит его с идентичными
# парами слева/справа (значения по умолчанию на английском).
region: "регион"
requirePermission: "требуетсяПраво"
override: "переопределение"
version: "version"
