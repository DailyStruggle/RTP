# --- Конфигурация безопасности RTP ---

# Настраивает, как плагин определяет, является ли локация телепорта "безопасной".
# Грамматика токенов:
# MATERIAL -- простой материал, например LAVA
# MATERIAL[prop=val,prop2=val2] -- материал, только если ВСЕ свойства
# состояния блока совпадают
# #namespace:tag -- разворачивается во все материалы тега
# #namespace:tag[prop=val] -- члены тега, только если свойства совпадают
# *[prop=val] -- ЛЮБОЙ материал при совпадении свойств (джокер)
# Значения свойств сравниваются без учёта регистра со строковой формой
# BlockData из Bukkit. Неизвестные теги разворачиваются в пустое множество
# (no-op, fail-open); некорректные токены логируются один раз на уровне
# WARN при перезагрузке .
# Порядок внутри списка не важен.
# Неуязвимость (секунды)
# Длительность неуязвимости, предоставляемой игроку после телепорта.
# Предотвращает урон от огня, утопления или падения при прибытии.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 5"
времяНеуязвимости: 5

# Радиус проверки безопасности (блоки)
# Радиус вокруг целевого блока для проверки опасных условий.
# Большие значения дают больше безопасности, но усложняют поиск места.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 0
радиусБезопасности: 0

# Платформы приземления
# Создаёт платформу приземления в месте назначения телепорта.
# Центральный блок выбирается по типу блока в локации.
# Установите platformRadius в -1, чтобы отключить платформы.
# По умолчанию: -1 (отключено) - современные проверки безопасности
# (chunk.isSafe + вертикальный регулятор) надёжно дают твёрдые приземления,
# поэтому аварийная платформа (стеклянный блок) отключена по умолчанию.
# Увеличьте до 0 или больше, только если по-прежнему наблюдаете
# небезопасные приземления и хотите вернуть старую опцию fallback.
# @type: integer
# @range: [-1, null]
# @unit: blocks
# @default: -1
радиусПлатформы: -1

# Depth (vertical thickness) of the emergency platform.
# @type: integer
# @range: [1, null]
# @unit: blocks
# @default: 1
глубинаПлатформы: 1

# Высота воздуха, которую нужно гарантировать над платформой.
# Может вызвать проблемы с освещением, если слишком высока.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 2
высотаВоздухаПлатформы: 2

# Тип блока по умолчанию для платформы, если нет твёрдого блока.
# @type: material
# @source: material
# @default: GLASS
материалПлатформы: "GLASS"

# Секунды, после которых след платформы восстанавливается до исходных блоков.
# -1 = никогда (постоянно), 0 = как только чанк перезагрузится. Отсчёт идёт
# только при загруженном чанке; сохраняется после перезапусков.
# @type: integer
# @range: [-1, null]
# @unit: seconds
# @default: -1
platformRestoreSeconds: -1

# --- Optional PvP / combat-tag pre-flight gate ---
# Главный переключатель. Если true, /rtp проверяет боевое состояние и применяет
# pvpOnCombat (ниже) перед постановкой в очередь и перед телепортацией.
# @type: boolean
# @default: false
pvpCheckEnabled: false

# Секунды, в течение которых игрок считается "в бою" после урона PvP (только
# встроенный трекер; игнорируется при подключённом внешнем combat-tag плагине).
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 15"
pvpCombatTagSeconds: 15

# What to do when a combat-tagged player requests (or is mid-)/rtp.
# ALLOW  - permit, but log an audit line
# DENY   - refuse the command with the busy message
# DELAY  - postpone until the combat tag expires, then proceed
# CANCEL - abort an in-progress / queued teleport
# Unknown values fail safe to DENY.
# @type: enum
# @options: [ALLOW, DENY, DELAY, CANCEL]
# @default: DENY
pvpOnCombat: "DENY"

# Combat-state source preference.
# AUTO     - external combat-tag plugin if one is bound, else native tracker
# NATIVE   - always use RTP's native damage tracker
# EXTERNAL - only a bound combat-tag plugin (no native fallback)
# @type: enum
# @options: [AUTO, NATIVE, EXTERNAL]
# @default: AUTO
pvpSource: "AUTO"

# Native tracker: tag a player who TAKES PvP damage.
# @type: boolean
# @default: true
pvpTagVictim: true

# Native tracker: tag a player who DEALS PvP damage.
# @type: boolean
# @default: true
pvpTagAggressor: true

# Лимит повторов на устаревший чанк (число)
# Ограниченный бюджет повторов для стража устаревших чанков
# . После разрешения асинхронной загрузки чанка
# следующая задача оценки блока ставится в очередь конвейера задач
# Count-Bound (планировщик Region Thread Folia). Если конвейер перегружен,
# нативный GC чанков может выгрузить чанк до выполнения задачи, что иначе
# вызвало бы синхронную загрузку в Region Thread и сработал бы Folia
# Watchdog. Когда страж обнаруживает эту гонку, он переставляет асинхронную
# загрузку в очередь до этого числа раз на кандидата. При исчерпании
# кандидат отклоняется обычным маршрутом "unsafe" (логируется WARN; ничего
# не отбрасывается молча).
# По умолчанию: 2. Увеличивайте только в форках с очень агрессивным GC чанков.
# @type: integer
# @range: [0, null]
# @default: 2"
staleChunkRetryLimit: 2

# Anvil-префильтр только для чтения (только Spigot vanilla)
# Внепотоковая проба безопасности, которая анализирует сохранённый файл
# региона `r.X.Z.mca` и отклоняет явно небезопасных кандидатов (лава/магма/
# огонь на поверхности heightmap) до запроса авторитетной загрузки чанка
# вживую. Снижает нагрузку на тик-поток в Spigot vanilla, где API живой
# загрузки чанков не является по-настоящему асинхронным.
# Не действует на Paper и Folia (они заменяют маршрут загрузки чанков
# нативными асинхронными API и никогда не входят в префильтр).
# Живая перепроверка chunk.isSafe(...) остаётся авторитетным источником при
# ACCEPT; REJECT - единственный короткий путь. См.
# По умолчанию: true. Установите false, чтобы отключить пробу (полезно в
# модифицированных форках с экзотическими форматами региона).
# @type: boolean
# @default: true
anvilPrefilterEnabled: true

# НЕ ИЗМЕНЯЙТЕ НОМЕР ВЕРСИИ
version: 1.0
