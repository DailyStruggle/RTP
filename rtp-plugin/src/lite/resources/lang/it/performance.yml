# --- Impostazioni di prestazione di RTP ---
# Documentazione: plugins/RTP/docs/admin/configuration/PERFORMANCE.md
# Numero massimo di tentativi di ricerca per invocazione di /rtp prima di rinunciare.
# @type: integer
# @range: [1, null]
# @default: 32
tentativiMassimi: 32

# Raggio in chunk caricato attorno a una posizione candidata durante la selezione.
# 0 carica solo il chunk candidato.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
distanzaVisualeSelezione: 0

# Raggio in chunk caricato attorno alla posizione finale immediatamente prima
# del teletrasporto. 0 carica solo il chunk di destinazione.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
distanzaVisualeTeletrasporto: 0

# Tick tra cicli di cache in background (pre-riempimento regione, ricarica coda).
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
periodo: 20

# Massimo di millisecondi per tick spesi in task sincroni.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
tempoAssegnatoSinc: 50

# Massimo di millisecondi per tick spesi in task asincroni.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
tempoAssegnatoAsinc: 50

# TPS minimo del server richiesto per continuare l'accodamento in background.
# Il lavoro in background si mette in pausa quando i TPS scendono sotto questa soglia.
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
tpsMinimo: 19.0

# Utilizzo massimo dell'heap della JVM (percentuale dell'heap massimo) prima
# che la generazione della cache in background venga messa in pausa. Ogni
# posizione memorizzata nella cache blocca un chunk, quindi un riempimento
# illimitato su un server con heap ridotto può portare la JVM a una garbage
# collection continua e rendere il server non reattivo senza alcun errore in
# console. Finché l'utilizzo è pari o superiore a questa soglia, RTP smette di
# riempire la cache delle posizioni ma continua a servire le posizioni già
# memorizzate ai giocatori in attesa. 0 o 100 disabilita il limite.
# @type: number
# @range: [0.0, 100.0]
# @default: 85.0
maxHeapPercentuale: 85.0

# Riempi la cache della regione immediatamente dopo un teletrasporto riuscito.
# @type: boolean
# @default: false
accodamentoPostTeletrasporto: false

# Usa il caricamento sincrono dei chunk. NON CONSIGLIATO. Viola lo spirito di S-005
# su Folia e bloccherà il thread principale su Paper/Spigot.
# @type: boolean
# @default: false
caricamentoSinc: false

# Analizza i nodi di permesso degli effetti all'avvio.
# @type: boolean
# @default: true
parsingEffetti: true

# Riutilizza dalle cache le posizioni già trovate corrispondenti al bioma.
# @type: boolean
# @default: true
richiamoBioma: true

# Quando impostato, serve le richieste filtrate per bioma solo dalla cache (non
# genera mai nuove ricerche di bioma). Richiede biomeRecall.
# @type: boolean
# @default: false
richiamoBiomaForzato: false

# Modula la selezione filtrata per bioma così che ogni bioma richiesto venga
# scelto con uguale probabilità, anziché in proporzione a quanta regione copre.
# Evita che i biomi comuni soffochino quelli rari quando se ne richiedono diversi.
# Richiede biomeRecall; nessun effetto sui teletrasporti non filtrati (bioma predefinito).
# @type: boolean
# @default: false
biomaPesato: false

# Per-biome relative selection weights for biome-filtered teleports.
# Only consulted when biomeWeighted is true. Biomes not listed here use
# weight 1.0, so an empty/all-equal map reproduces the equal-probability
# behavior of biomeWeighted on its own. A biome given weight 2.0 is
# steered toward roughly twice as often as a weight-1.0 biome among the
# requested set (when both are present in biome-recall memory); 0.0
# suppresses a biome. Requires biomeRecall; no effect on unfiltered
# (default-biome) teleports. The shipped plains entry is a weight-1.0
# no-op example - replace or extend it with the biomes you want to bias.
# @type: map<string, number>
pesiBioma:
  # Peso di selezione relativo per questo bioma (1.0 = nessun bias).
  # @type: number
  # @range: [0.0, null]
  # @default: 1.0
  plains: 1.0
  sunflower_plains: 1.0
  snowy_plains: 1.0
  ice_spikes: 1.0
  desert: 1.0
  swamp: 1.0
  mangrove_swamp: 1.0
  forest: 1.0
  flower_forest: 1.0
  birch_forest: 1.0
  dark_forest: 1.0
  old_growth_birch_forest: 1.0
  old_growth_pine_taiga: 1.0
  old_growth_spruce_taiga: 1.0
  taiga: 1.0
  snowy_taiga: 1.0
  savanna: 1.0
  savanna_plateau: 1.0
  windswept_hills: 1.0
  windswept_gravelly_hills: 1.0
  windswept_forest: 1.0
  windswept_savanna: 1.0
  jungle: 1.0
  sparse_jungle: 1.0
  bamboo_jungle: 1.0
  badlands: 1.0
  eroded_badlands: 1.0
  wooded_badlands: 1.0
  meadow: 1.0
  cherry_grove: 1.0
  pale_garden: 1.0
  grove: 1.0
  snowy_slopes: 1.0
  frozen_peaks: 1.0
  jagged_peaks: 1.0
  stony_peaks: 1.0
  river: 1.0
  frozen_river: 1.0
  beach: 1.0
  snowy_beach: 1.0
  stony_shore: 1.0
  warm_ocean: 1.0
  lukewarm_ocean: 1.0
  deep_lukewarm_ocean: 1.0
  ocean: 1.0
  deep_ocean: 1.0
  cold_ocean: 1.0
  deep_cold_ocean: 1.0
  frozen_ocean: 1.0
  deep_frozen_ocean: 1.0
  mushroom_fields: 1.0
  dripstone_caves: 1.0
  lush_caves: 1.0
  deep_dark: 1.0
  # --- Il Nether ---
  nether_wastes: 1.0
  warped_forest: 1.0
  crimson_forest: 1.0
  soul_sand_valley: 1.0
  basalt_deltas: 1.0
  # --- L'End ---
  the_end: 1.0
  end_highlands: 1.0
  end_midlands: 1.0
  small_end_islands: 1.0
  end_barrens: 1.0
  # --- Varie / tecnico ---
  the_void: 1.0

# Scansiona punti di atterraggio sicuri in tutti i chunk caricati (pre-riempimento
# opportunistico).
# @type: boolean
# @default: true
controlloCaricamentoChunk: true

# NON MODIFICARE IL NUMERO DI VERSIONE
versione: 1.0
