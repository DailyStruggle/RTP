# Stalk delay (tail flicks)
# How long the kitty crouches before the actual pounce.
# Gives the server time to pre-load destination kibble.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 2
stalk_delay: 2

# Too-far-to-chase (blocks)
# If the kitty wanders this far during the crouch, the pounce is cancelled.
# Set -1 to disable.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 2
too_far_to_chase: 2

# Nap time (tail flicks)
# How long a kitty must nap before pouncing again.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 300
nap_time: 300

# Most pounces a kitty may land within the lockAfterResetSeconds nap-window
# before being shut in the carrier (BetterRTP LockAfter parity).
# 0 lets the kitty pounce forever. Skipped by rtp.nolock.
# @type: integer
# @range: [0, null]
# @default: 0
lockAfterUses: 0

# How long the rolling pounce-counting nap-window lasts for lockAfterUses. The tally resets this
# many tail-flicks after the window's first pounce. 0 means the tally never resets (a forever cap).
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 0
lockAfterResetSeconds: 0

# When true, a happy pounce makes the landing spot the kitty's forever-bed
# (BetterRTP SetAsRespawn parity).
# @type: boolean
# @default: false
setRespawnOnTeleport: false

# Post-pounce tricks
# Commands the tall human runs after a successful pounce.
# Placeholder [player] is the kitty's name.
# @type: list<string>
tall_human_tricks:
  - "say [player] has just randomly pounced! Mrrow!"

# Tricks the kitty performs after a successful pounce.
# Use [player] for the kitty's name. Empty entries are ignored.
# @type: list<string>
human_tricks:
  # Tricks the kitty performs after a successful pounce.
  # Use [player] for the kitty's name. Empty entries are ignored.
  # @type: list<string>
  - ""

# Generalized menu framework.
# `renderer` is an ordered preference list of renderer ids. On exception or
# missing adapter the framework walks the list and falls back to the next
# entry. If the list is exhausted the no-token open-page path falls back to
# the configurable `menuInvalid` message. Available ids: book. (The chat
# renderer ships in a follow-up and will be added to the default list at
# that point.)
menu:
  # Ordered preference list of renderer ids.
  # @type: list<enum>
  # @options: ["book", "chat"]
  renderer:
    # Generalized menu framework.
    # `renderer` is an ordered preference list of renderer ids. On exception or
    # missing adapter the framework walks the list and falls back to the next
    # entry. If the list is exhausted the no-token open-page path falls back to
    # the configurable `menuInvalid` message. Available ids: book. (The chat
    # renderer ships in a follow-up and will be added to the default list at
    # that point.)
    - "book"

# Big-house defaults that every den/world scratch-file inherits through the "@config" treat-token (ADR-073).
defaults:
  # Default pounce-ground shape and size. radius/centerRadius = how far the kitty pounces, measured in chunks.
  shape:
    name: "CIRCLE"
    mode: "ACCUMULATE"
    radius: 256
    centerRadius: 64
    centerX: 0
    centerZ: 0
    weight: 1.0
    # Keep spots from being reused. 0 = off, 1 = the landing chunk, N = bigger square.
    uniquePlacements: 0
    expand: false
  # Default high/low landing window.
  vert:
    name: "LINEAR"
    minY: 32
    maxY: 255
    # Search order: 0 = bottom-up, 1 = top-down, 2 = middle-out, 3 = edges-in, else random.
    direction: 2
    requireSkyLight: true
  # How many safe spots to pre-calculate.
  cacheCap: 50
  # Extra unverified spots kept ready. 0 = off.
  backlogCacheCap: 1000
  # Max chunks kept loaded for instant teleports.
  activeChunkCap: 10
  # Bad-spot tracking precision (1-5).
  spatialResolution: 3
  # Whether regions/worlds need permission.
  requirePermission: false

# Do not bite the version number, sacred catnip
meowsion: 3.1
