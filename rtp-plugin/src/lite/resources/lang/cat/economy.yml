# --- RTP Treats (economy, cat dialect) ---

# Treats! Mrrow! How many kibbles a pounce costs.
# Base treat cost for /rtp
# @type: number
# @range: [0.0, null]
# @default: 50.0
treat_cost: 50.0

# Treat cost when pouncing a friend kitty
# @type: number
# @range: [0.0, null]
# @default: 200.0
treat_cost_for_friend: 200.0

# Extra fancy-treat cost for using parameters
# @type: number
# @range: [0.0, null]
# @default: 1000000000.0
fancy_treat_cost: 1000000000.0

# Extra territory-treat cost for picking a specific smell (biome)
# @type: number
# @range: [0.0, null]
# @default: 5000.0
territory_treat_cost: 5000.0

# Give the treats back if the zoomies get cancelled (kitty wandered off, oopsie, etc.).
# @type: boolean
# @default: true
treats_back_if_napping: true

# Smallest treat-pile kitty must keep after paying; the zoomies are denied
# if it would drop below this floor.
# @type: number
# @range: [0.0, null]
# @default: 0.0
empty_bowl: 0.0

# Do not bite the version number, sacred catnip
meowsion: 1.0
