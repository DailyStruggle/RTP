# --- RTP Performance Settings (cat dialect) ---
# How fast a kitty can stalk and pounce without knocking over the lamp.
# Max pounce attempts before giving up
# @type: integer
# @range: [1, null]
# @default: 32
max_pounces: 32

# Kibble (chunk) radius to load while stalking
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
stalking_distance: 0

# Kibble (chunk) radius to load just before pouncing
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
pounce_distance: 0

# Tail flicks (ticks) between background sniff cycles
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
tail_swish_period: 20

# Max whisker-twitches per tick for sync errands
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
sync_nap_time: 50

# Max whisker-twitches per tick for async errands
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
async_nap_time: 50

# Minimum purrs/sec (TPS) to keep sniffing in the background
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
minimum_purrs_per_second: 19.0

# Refill the warm-spot pile right after a pounce
# @type: boolean
# @default: false
line_up_after_pounce: false

# Use sync chunk loading (NOT RECOMMENDED, may pull tail)
# @type: boolean
# @default: false
synced_kibble: false

# Parse sparkle (effect) permissions at startup
# @type: boolean
# @default: true
sparkle_parsing: true

# Reuse already-known biome warm-spots
# @type: boolean
# @default: true
smell_memory: true

# Only use biomes already remembered (no new sniffing)
# @type: boolean
# @default: false
forced_smell_memory: false

# Bias biome-filtered selection so each requested biome is steered toward
# with equal probability, instead of in proportion to how much of the
# region it covers. Counteracts common biomes drowning out rare ones when
# several biomes are requested. Requires biomeRecall; no effect on
# unfiltered (default-biome) teleports.
# @type: boolean
# @default: false
biomeWeighted: false

# Per-biome relative selection weights for biome-filtered teleports.
# Only consulted when biomeWeighted is true. Biomes not listed here use
# weight 1.0, so an empty/all-equal map reproduces the equal-probability
# behavior of biomeWeighted on its own. A biome given weight 2.0 is
# steered toward roughly twice as often as a weight-1.0 biome among the
# requested set (when both are present in biome-recall memory); 0.0
# suppresses a biome. Requires biomeRecall; no effect on unfiltered
# (default-biome) teleports. The shipped plains entry is a weight-1.0
# no-op example - replace or extend it with the biomes you want to bias.
# @type: map<string, number>
biomeWeights:
  # @type: number
  # @range: [0.0, null]
  # @default: 1.0
  plains: 1.0

# Check for warm-spots in every loaded kibble (chunk)
# @type: boolean
# @default: false
check_when_kibble_arrives: false

# Do not bite the version number, sacred catnip
meowsion: 1.0
