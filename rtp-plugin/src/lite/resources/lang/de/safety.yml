# --- RTP Sicherheitskonfiguration ---
# Dokumentation: plugins/RTP/docs/admin/configuration/SAFETY.md

# Sekunden der Unverwundbarkeit nach Abschluss eines Teleports.
# 0 deaktiviert das Unverwundbarkeitsfenster nach dem Teleport.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 5
invulnerabilityTime: 5

# Blockradius rund um den Landepunkt, der auf Gefahren geprüft wird.
# 0 prüft nur den Landeblock und die unmittelbare Vertikale.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 0
safetyRadius: 0

# Radius der Notfall-Landeplattform am Zielort.
# -1 deaktiviert die Plattform vollständig.
# @type: integer
# @range: [-1, null]
# @unit: blocks
# @default: -1
platformRadius: -1

# Tiefe (vertikale Dicke) der Notfallplattform.
# @type: integer
# @range: [1, null]
# @unit: blocks
# @default: 1
platformDepth: 1

# Über der Notfallplattform freigeräumte Lufthöhe.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 2
platformAirHeight: 2

# Material der Notfall-Landeplattform.
# @type: material
# @source: material
# @default: GLASS
platformMaterial: "GLASS"

# Sekunden, nach denen der Abdruck der Plattform auf die ursprünglichen Blöcke
# zurückgesetzt wird. -1 = nie (dauerhaft), 0 = sobald der Chunk neu lädt. Der
# Countdown läuft nur bei geladenem Chunk; übersteht Neustarts.
# @type: integer
# @range: [-1, null]
# @unit: seconds
# @default: -1
platformRestoreSeconds: -1

# --- Optionale PvP-/Combat-Tag-Vorabprüfung ---
# Hauptschalter. Bei true prüft /rtp den Kampfstatus und wendet pvpOnCombat
# (unten) vor dem Einreihen und vor dem Teleport an.
# @type: boolean
# @default: false
pvpCheckEnabled: false

# Sekunden, die ein Spieler nach PvP-Schaden "im Kampf" bleibt (nur nativer
# Tracker; ignoriert, wenn ein externes Combat-Tag-Plugin gebunden ist).
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 15
pvpCombatTagSeconds: 15

# Was zu tun ist, wenn ein im Kampf markierter Spieler /rtp anfordert (oder mittendrin ist).
# ALLOW - erlauben, aber eine Prüfzeile protokollieren
# DENY - den Befehl mit der Beschäftigt-Meldung ablehnen
# DELAY - aufschieben, bis die Kampfmarkierung abläuft, dann fortfahren
# CANCEL - einen laufenden / eingereihten Teleport abbrechen
# Unbekannte Werte fallen sicher auf DENY zurück.
# @type: enum
# @options: [ALLOW, DENY, DELAY, CANCEL]
# @default: DENY
pvpOnCombat: "DENY"

# Bevorzugte Quelle des Kampfzustands.
# AUTO - externes Combat-Tag-Plugin, falls eines gebunden ist, sonst nativer Tracker
# NATIVE - immer den nativen Schadens-Tracker von RTP verwenden
# EXTERNAL - nur ein gebundenes Combat-Tag-Plugin (kein nativer Rückfall)
# @type: enum
# @options: [AUTO, NATIVE, EXTERNAL]
# @default: AUTO
pvpSource: "AUTO"

# Nativer Tracker: einen Spieler markieren, der PvP-Schaden ERLEIDET.
# @type: boolean
# @default: true
pvpTagVictim: true

# Nativer Tracker: einen Spieler markieren, der PvP-Schaden AUSTEILT.
# @type: boolean
# @default: true
pvpTagAggressor: true

# Maximale Wiederholungen des Stale-Chunk-Schutzes, bevor der Versuch fehlschlägt.
# @type: integer
# @range: [0, null]
# @default: 2
staleChunkRetryLimit: 2

# Den Off-Thread-Anvil-NBT-Vorfilter verwenden, um Kandidaten zu verwerfen,
# ohne ihre Chunks zu laden.
# @type: boolean
# @default: true
anvilPrefilterEnabled: true

# ÄNDERE NICHT DIE VERSIONSNUMMER
version: 1.0
