# --- RTP Leistungseinstellungen ---
# Dokumentation: plugins/RTP/docs/admin/PERFORMANCE.md
# Maximale Suchversuche pro /rtp-Aufruf, bevor aufgegeben wird.
# @type: integer
# @range: [1, null]
# @default: 32
maxVersuche: 32

# Chunk-Radius, der während der Auswahl rund um einen Kandidatenort geladen wird.
# 0 lädt nur den Kandidaten-Chunk.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
sichtweiteAuswahl: 0

# Chunk-Radius, der unmittelbar vor dem Teleport rund um den endgültigen Ort
# geladen wird. 0 lädt nur den Ziel-Chunk.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
sichtweiteTeleport: 0

# Ticks zwischen Hintergrund-Cache-Zyklen (Regions-Vorbefüllung, Warteschlangen-Auffüllung).
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
intervall: 20

# Maximale Millisekunden pro Tick für synchrone Aufgaben.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
syncZugeteilteZeit: 50

# Maximale Millisekunden pro Tick für asynchrone Aufgaben.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
asyncZugeteilteZeit: 50

# Mindest-Server-TPS, die zum Fortführen der Hintergrund-Warteschlange nötig ist.
# Hintergrundarbeit pausiert, wenn die TPS unter diesen Schwellenwert fallen.
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
minTPS: 19.0

# Den Regions-Cache unmittelbar nach einem erfolgreichen Teleport auffüllen.
# @type: boolean
# @default: false
nachTeleportEinreihung: false

# Synchrones Chunk-Laden verwenden. NICHT EMPFOHLEN. Verletzt den Geist von S-005
# auf Folia und blockiert den Haupt-Thread auf Paper/Spigot.
# @type: boolean
# @default: false
syncLaden: false

# Effekt-Berechtigungsknoten beim Start auswerten.
# @type: boolean
# @default: true
effektAuswertung: true

# Zuvor gefundene biom-passende Orte aus dem Cache wiederverwenden.
# @type: boolean
# @default: true
biomWiederverwendung: true

# Wenn gesetzt, biom-gefilterte Anfragen nur aus dem Cache bedienen (niemals
# neue Biom-Suchen erzeugen). Erfordert biomeRecall.
# @type: boolean
# @default: false
biomWiederverwendungErzwungen: false

# In allen geladenen Chunks nach sicheren Landeplätzen suchen (opportunistische
# Vorbefüllung).
# @type: boolean
# @default: false
beiChunkLadenPruefen: false

# ÄNDERE NICHT DIE VERSIONSNUMMER
version: 1.0
