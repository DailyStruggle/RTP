# --- RTP Leistungseinstellungen ---
# Dokumentation: plugins/RTP/docs/admin/PERFORMANCE.md
# Maximale Suchversuche pro /rtp-Aufruf, bevor aufgegeben wird.
# @type: integer
# @range: [1, null]
# @default: 32
maxVersuche: 32

# Chunk-Radius, der während der Auswahl rund um einen Kandidatenort geladen wird.
# 0 lädt nur den Kandidaten-Chunk.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
sichtweiteAuswahl: 0

# Chunk-Radius, der unmittelbar vor dem Teleport rund um den endgültigen Ort
# geladen wird. 0 lädt nur den Ziel-Chunk.
# @type: integer
# @range: [0, null]
# @unit: chunks
# @default: 0
sichtweiteTeleport: 0

# Ticks zwischen Hintergrund-Cache-Zyklen (Regions-Vorbefüllung, Warteschlangen-Auffüllung).
# @type: integer
# @range: [1, null]
# @unit: ticks
# @default: 20
intervall: 20

# Maximale Millisekunden pro Tick für synchrone Aufgaben.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
syncZugeteilteZeit: 50

# Maximale Millisekunden pro Tick für asynchrone Aufgaben.
# @type: integer
# @range: [1, null]
# @unit: ms
# @default: 50
asyncZugeteilteZeit: 50

# Mindest-Server-TPS, die zum Fortführen der Hintergrund-Warteschlange nötig ist.
# Hintergrundarbeit pausiert, wenn die TPS unter diesen Schwellenwert fallen.
# @type: number
# @range: [0.0, 20.0]
# @default: 19.0
minTPS: 19.0

# Den Regions-Cache unmittelbar nach einem erfolgreichen Teleport auffüllen.
# @type: boolean
# @default: false
nachTeleportEinreihung: false

# Synchrones Chunk-Laden verwenden. NICHT EMPFOHLEN. Verletzt den Geist von S-005
# auf Folia und blockiert den Haupt-Thread auf Paper/Spigot.
# @type: boolean
# @default: false
syncLaden: false

# Effekt-Berechtigungsknoten beim Start auswerten.
# @type: boolean
# @default: true
effektAuswertung: true

# Zuvor gefundene biom-passende Orte aus dem Cache wiederverwenden.
# @type: boolean
# @default: true
biomWiederverwendung: true

# Wenn gesetzt, biom-gefilterte Anfragen nur aus dem Cache bedienen (niemals
# neue Biom-Suchen erzeugen). Erfordert biomeRecall.
# @type: boolean
# @default: false
biomWiederverwendungErzwungen: false

# Bias biome-filtered selection so each requested biome is steered toward
# with equal probability, instead of in proportion to how much of the
# region it covers. Counteracts common biomes drowning out rare ones when
# several biomes are requested. Requires biomeRecall; no effect on
# unfiltered (default-biome) teleports.
# @type: boolean
# @default: false
biomeWeighted: false

# Per-biome relative selection weights for biome-filtered teleports.
# Only consulted when biomeWeighted is true. Biomes not listed here use
# weight 1.0, so an empty/all-equal map reproduces the equal-probability
# behavior of biomeWeighted on its own. A biome given weight 2.0 is
# steered toward roughly twice as often as a weight-1.0 biome among the
# requested set (when both are present in biome-recall memory); 0.0
# suppresses a biome. Requires biomeRecall; no effect on unfiltered
# (default-biome) teleports. The shipped plains entry is a weight-1.0
# no-op example - replace or extend it with the biomes you want to bias.
# @type: map<string, number>
biomeWeights:
  # @type: number
  # @range: [0.0, null]
  # @default: 1.0
  plains: 1.0

# In allen geladenen Chunks nach sicheren Landeplätzen suchen (opportunistische
# Vorbefüllung).
# @type: boolean
# @default: false
beiChunkLadenPruefen: false

# ÄNDERE NICHT DIE VERSIONSNUMMER
version: 1.0
