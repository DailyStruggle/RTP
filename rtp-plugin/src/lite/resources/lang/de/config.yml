# Wartezeit (Sekunden) vor der Teleportation
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 2
teleportVerzoegerung: 2

# Maximale Bewegungsdistanz während der Verzögerung vor Abbruch
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 2
distanzAbbruch: 2

# Wartezeit (Sekunden) zwischen erfolgreichen Nutzungen
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 300
teleportAbkuehlung: 300

# Maximale Anzahl erfolgreicher /rtp-Nutzungen, die ein Spieler innerhalb des
# Fensters lockAfterResetSeconds machen darf, bevor er gesperrt wird (BetterRTP-LockAfter-Parität).
# 0 deaktiviert die Obergrenze. Durch rtp.nolock umgangen.
# @type: integer
# @range: [0, null]
# @default: 0
lockAfterUses: 0

# Länge des gleitenden Nutzungs-Obergrenzenfensters für lockAfterUses. Der Zähler wird so
# viele Sekunden nach der ersten Nutzung des Fensters zurückgesetzt. 0 bedeutet, dass die
# Obergrenze nie zurückgesetzt wird (eine harte Lebenszeit-Obergrenze).
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 0
lockAfterResetSeconds: 0

# Wenn true, legt ein erfolgreiches /rtp den Landeort als dauerhaften
# Spawn-Anker des Spielers fest (BetterRTP-Parität).
# @type: boolean
# @default: false
setRespawnOnTeleport: false

# Befehle, die nach der Teleportation ausgeführt werden
# @type: list<string>
konsolenBefehle:
  - "say [player] hat sich gerade zufällig teleportiert!"

# Befehle, die als der teleportierte Spieler bei erfolgreichem Teleport ausgeführt werden.
# Verwenden Sie [player] für den Spielernamen. Leere Einträge werden ignoriert.
# @type: list<string>
spielerBefehle:
  # Befehle, die als der teleportierte Spieler bei erfolgreichem Teleport ausgeführt werden.
  # Verwenden Sie [player] für den Spielernamen. Leere Einträge werden ignoriert.
  # @type: list<string>
  - ""

# Allgemeines Menü-Framework.
# `renderer` ist eine geordnete Präferenzliste von Renderer-IDs. Bei einer
# Ausnahme oder einem fehlenden Adapter geht das Framework die Liste durch
# und greift auf den nächsten Eintrag zurück. Ist die Liste erschöpft,
# greift der Pfad ohne Token auf die konfigurierbare `menuInvalid`-Meldung
# zurück. Verfügbare IDs: book. (Der Chat-Renderer kommt im Folge-Release
# und wird dann der Standardliste hinzugefügt.)
menu:
  # Ordered preference list of renderer ids.
  # @type: list<enum>
  # @options: ["book", "chat"]
  renderer:
    # Allgemeines Menü-Framework.
    # `renderer` ist eine geordnete Präferenzliste von Renderer-IDs. Bei einer
    # Ausnahme oder einem fehlenden Adapter geht das Framework die Liste durch
    # und greift auf den nächsten Eintrag zurück. Ist die Liste erschöpft,
    # greift der Pfad ohne Token auf die konfigurierbare `menuInvalid`-Meldung
    # zurück. Verfügbare IDs: book. (Der Chat-Renderer kommt im Folge-Release
    # und wird dann der Standardliste hinzugefügt.)
    - "book"

# Globale Standardwerte, die von Regions-/Welt-Dateien über den "@config"-Token geerbt werden.
defaults:
  # Standardform und -größe des Gebiets. radius/centerRadius = wie weit entfernt du landest, gemessen in Chunks.
  shape:
    name: "CIRCLE"
    mode: "ACCUMULATE"
    radius: 256
    centerRadius: 64
    centerX: 0
    centerZ: 0
    weight: 1.0
    # Keep spots from being reused. 0 = off, 1 = the landing chunk, N = bigger square.
    uniquePlacements: 0
    expand: false
  # Default high/low landing window.
  vert:
    name: "LINEAR"
    minY: 32
    maxY: 255
    # Search order: 0 = bottom-up, 1 = top-down, 2 = middle-out, 3 = edges-in, else random.
    direction: 2
    requireSkyLight: true
  # How many safe spots to pre-calculate.
  cacheCap: 50
  # Extra unverified spots kept ready. 0 = off.
  backlogCacheCap: 1000
  # Max chunks kept loaded for instant teleports.
  activeChunkCap: 10
  # Bad-spot tracking precision (1-5).
  spatialResolution: 3
  # Whether regions/worlds need permission.
  requirePermission: false

# ÄNDERE NICHT DIE VERSIONSNUMMER
version: 3.1
