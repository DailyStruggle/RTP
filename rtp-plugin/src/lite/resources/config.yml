# --- RTP-lite Core Configuration ---
# Documentation: https://github.com/DailyStruggle/RTP/wiki/Core-Configuration
# Lite has no SQL/Redis persistence backend (storage is yaml-only).
#
# Where to find things (files/folders in this RTP folder):
#   config.yml    - this file: core teleport behavior and shared defaults
#   safety.yml    - where players may or may not land (blocks, biomes)
#   messages/     - all player-facing text
#   effects/      - particle and sound effects on teleport
#   regions/      - per-region settings
#   worlds/       - per-world settings
#   advanced/     - tuning you usually do not need (performance, logging, metrics, biomes, blocks)
#   addons/       - config for optional add-ons, if installed

# Seconds to wait before teleporting. 0 = right away.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 2
teleportDelay: 2

# How far you can move before the teleport cancels.
# @type: integer
# @range: [0, null]
# @unit: blocks
# @default: 2
cancelDistance: 2

# Wait time between /rtp uses. Skipped by rtp.nocooldown.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 300
teleportCooldown: 300

# Max /rtp uses before lockout. 0 = no limit. Skipped by rtp.nolock.
# @type: integer
# @range: [0, null]
# @default: 0
lockAfterUses: 0

# Seconds until the use count resets. 0 = never resets.
# @type: integer
# @range: [0, null]
# @unit: seconds
# @default: 0
lockAfterResetSeconds: 0

# true = set your spawn point where you land.
# @type: boolean
# @default: false
setRespawnOnTeleport: false

# Console commands run after teleport. [player] = the player's name.
# @type: list<string>
consoleCommands:
  - "say [player] has just randomly teleported!"

# Commands run as the player after teleport. [player] = their name.
# @type: list<string>
playerCommands:
  - ""

# Lite intentionally OMITS the `database:` and `network:` blocks.
# Persistence is yaml-only and there is no Redis client on the classpath.

# Menu look. renderer = list of styles to try in order (lite has book only).
menu:
  # Menu styles to try; first one that works wins.
  # @type: list<enum>
  # @options: ["book"]
  renderer:
    - "book"

# Global default templates/values that region/world files inherit via the "@config"
# token (ADR-073). The bundled region/world files ship "@config" so you change a knob
# once here; a literal in a region/world file always overrides.
defaults:
  shape:
    name: "CIRCLE"
    mode: "ACCUMULATE"
    radius: 256
    centerRadius: 64
    centerX: 0
    centerZ: 0
    weight: 1.0
    uniquePlacements: 0
    expand: false
  vert:
    name: "LINEAR"
    minY: 32
    maxY: 255
    direction: 2
    requireSkyLight: true
  cacheCap: 50
  backlogCacheCap: 1000
  activeChunkCap: 10
  spatialResolution: 3
  requirePermission: false

# DO NOT TOUCH VERSION NUMBER
version: "3.1"
