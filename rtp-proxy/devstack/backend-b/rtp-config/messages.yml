# --- RTP User-Facing Messages ---
# All player- and console-visible strings.
#
# Formatting:
#   - Bukkit legacy color codes (e.g. &a, &e, &c)
#   - Hex color codes (e.g. #2636ef)
#   - PlaceholderAPI placeholders (when PAPI is installed)
#
# Placeholders:
#   - Shared "[Pn]" placeholders are defined in the `placeholders` list below.
#     [P0] is the RTP prefix by default.
#   - Per-message placeholders (e.g. [attempts], [world]) are documented inline
#     above each message that uses them.
#
# ###############################################################################
# Section 1: General Configuration
# ###############################################################################
# list of additional placeholders
# format: Pn - where n is the index in this list
placeholders:
  # P0
  - "[RTP]"

# ###############################################################################
# Section 2: Teleportation
# ###############################################################################
# when teleporting, say this
alreadyTeleporting: "&7[P0] you're already teleporting!"

# if the plugin is currently reloading
teleportDeniedReloading: "&7[P0] teleports are temporarily disabled while the plugin reloads. Please try again shortly."
delayMessage: "#9D7CD8[P0] Teleporting in [delay]. Don't move"
chunkLoading: "&7[P0] Loading chunks! please wait..."
teleportMessage: "#5FB3B3[P0] Teleported in [attempts] attempts, in [processingTime]"

# if teleport is cancelled
teleportCancel: "&7[P0] Teleport cancelled!"

# if no safe places after reaching max attempts
# placeholder: [attempts] - the maximum number of attempts
unsafe: "&7[P0] could not find a safe location within [attempts] attempts"

# when the player is on cooldown
# placeholder: [remainingCooldown] - the remaining time
cooldownMessage: "&7[P0] You can't teleport again for [remainingCooldown]"

# if the region doesn't have any locations queued and the player doesn't have rtp.unqueued permission
noLocationsQueued: "#f5eb73[P0] no locations ready at this time"

# when the queue line shifts
# placeholder: [spot] - the current position in line
queueUpdate: "#2636ef[P0] your spot in line: [spot]"

# if the player doesn't have enough money to teleport in the region
# placeholder: [money] - how much money is required for the command
notEnoughMoney: "&7[P0] you need at least $[money] for that."

# ###############################################################################
# Section 3: Time Formatting
# ###############################################################################
# for time placeholders, what to call days, hours, minutes, seconds, and milliseconds
days: "d"
hours: "h"
minutes: "m"
seconds: "s"
millis: "ms"

# ###############################################################################
# Section 4: System & Management
# ###############################################################################
# a configuration file 'version' is lower than the latest
# placeholder: [filename] - name of file, including file extension
oldFile: "&b[P0] old [filename] detected. Updating"

# detected a bukkit world that isn't in the config file
# placeholder: [world] - the world detected
newWorld: "&b[P0] detected a new world '[world]'"

# world doesn't exist in bukkit
# placeholder: [world] - the world name
invalidWorld: "&7[P0] could not find world '[world]'"

# plugin reload/update text
# placeholder: [filename] - name of file
reloading: "&b[P0] loading [filename]..."
reloaded: "&b[P0] successfully loaded [filename]."
updating: "&a[P0] updating [filename]..."
updated: "&a[P0] successfully updated [filename]."

# plugin doesn't have the command the user requested
# placeholder: [arg] - the argument attempted
badArg: "&c[P0] invalid command argument [arg]"

# when the console tries to run a command meant only for players
consoleCmdNotAllowed: "&c[P0] You must be an in-game player to execute this command."

# plugin is busy reloading
busy: "&c[P0] busy"

# plugin doesn't have the subcommand or parameter the user requested
# placeholder: [arg] - the argument attempted
invalidCommand: "&c[P0] invalid command - [arg]"

# user doesn't have permission for the command requested
noPerms: "&7I'm sorry, but you do not have permission to perform this command. Please contact the server administrators if you believe that this is in error."

# ###############################################################################
# Section 5: Administrative Logs
# ###############################################################################
# logged when locations are saved/loaded from database
# placeholder: [amount] - number of locations
# placeholder: [region] - name of region
locationSaved: "&7[P0] Successfully saved [amount] locations for [region]"
locationLoaded: "&7[P0] Successfully loaded [amount] locations for [region]"

# ###############################################################################
# Section 6: Scan Command
# ###############################################################################
# messages related to the scan command
# placeholder: [scan_regions] - list of regions
scanStart: "&a[P0] scan task started for regions: [scan_regions]"
scanReset: "&7[P0] scan queue reset for regions: [scan_regions]"
scanCancel: "&7[P0] scan task cancelled for regions: [scan_regions]"
scanPause: "#A020F0[P0] scan task paused for regions: [scan_regions]"
scanResume: "#10A5F5[P0] scan task resumed for regions: [scan_regions]"
scanRunning: "&c[P0] scan task already running for regions: [scan_regions]"
scanNotRunning: "&c[P0] scan task not running for regions: [scan_regions]"
# placeholder: [scan_chunks], [scan_totalChunks], [scan_cps], [scan_landPercentage], [scan_eta]
scanStatus: "&a[P0] completed [scan_chunks] / [scan_totalChunks] chunks for regions: [scan_regions]. [scan_cps] cps. Land Percentage: [scan_landPercentage]%. ETA: [scan_eta]"

# ###############################################################################
# Section 7: Info Command
# ###############################################################################
# messages related to the info command
infoTitle: "&a======RTP Info======"
infoTickets: "&7Global Active Chunk Tickets: #7E9CC8[tickets]"
infoTeleports: "&7Active Teleport State Machines: #7E9CC8[teleports]"
infoMSPT: "&7Current Plugin MSPT: #7E9CC8[mspt]"
infoTotalLoads: "&7Lifetime Chunks Loaded: #7E9CC8[loads]"
infoLoadsByOrigin: "&7Loads by Origin: #7E9CC8[loadsByOrigin]"
infoLeakRate: "&7Current Chunk Leak Rate: #7E9CC8[leakRate]"
# --- Metrics SPI health block (METRICS_PLAN.md > /rtp info Surface) ---
infoQueueDepth: "&7Players Waiting In Region Queues: #7E9CC8[queueDepth]"
infoPendingTeleports: "&7Pending Teleport Pipelines: #7E9CC8[pendingTeleports]"
infoAvgPipelineMs: "&7Avg Pipeline Latency: #7E9CC8[avgPipelineMs] ms"
infoHeap: "&7JVM Heap: #7E9CC8[heapUsedMb] / [heapMaxMb] MiB"
# Header line for the Health pipeline labelled block in /rtp info.
infoHealthPipelineHeader: "&7--- Health: pipeline ---"
# TPS readout for the 1m / 5m / 15m windows. Placeholders: [tps1m] [tps5m] [tps15m].
infoTps: "&7TPS (1m/5m/15m): #7E9CC8[tps1m] / [tps5m] / [tps15m]"
# Live server MSPT and tick-budget utilisation. Placeholders: [mspt] [tickBudgetUtilisation].
infoMSPTLive: "&7Server MSPT: #7E9CC8[mspt] ms (&7tick budget: #7E9CC8[tickBudgetUtilisation]&7)"
# Configured player soft-cap vs current online count. Placeholders: [softCap] [playerCount].
infoSoftCap: "&7Players: #7E9CC8[playerCount] / [softCap]"
# Most recent database round-trip latency in ms. Placeholder: [databaseLatencyMs].
infoDatabaseLatencyMs: "&7Database Latency: #7E9CC8[databaseLatencyMs] ms"
# Health colour-band thresholds. Doubles consumed by ColourBands in rtp-core
# to wrap coloured-variant placeholders (e.g. [tps1mColoured]) with &a/&e/&c.
infoThresholdTpsGreen: 19.5
infoThresholdTpsYellow: 18.0
infoThresholdMsptGreen: 30.0
infoThresholdMsptYellow: 45.0
infoThresholdCacheFillGreen: 0.5
infoThresholdCacheFillYellow: 0.25
infoThresholdNetworkAgeYellow: 5.0
# Header line introducing the per-Folia-region table (Folia runtime only).
infoFoliaRegionsHeader: "&7--- Folia regions ---"
# Per-row template for a single Folia region. Placeholders: [regionId] [tps1m]
# [mspt] [playerCount] [queueDepth] [tickBudgetUtilisation].
infoFoliaRegion: "  #7E9CC8[regionId]&7: tps=#7E9CC8[tps1m]&7 mspt=#7E9CC8[mspt]&7 players=#7E9CC8[playerCount]&7 queue=#7E9CC8[queueDepth]&7 budget=#7E9CC8[tickBudgetUtilisation]"
infoDisclaimerHeader: "&7--- Diagnostic Disclaimer ---"
infoDisclaimer: "&7Diagnostic Note: If the server's total orphaned chunk count exceeds this plugin's lifetime loads ([loads]), this plugin is not the sole source of the memory leak."
infoWorldHeader: "#008080Worlds:"
infoConsoleWorldHeader: "&7--- Worlds ---"
infoWorld: "  #21ADA8[world]"
infoRegionHeader: "#63C5DARegions:"
infoConsoleRegionHeader: "&7--- Regions ---"
infoRegion: "  #52B2BF[region]"

# sub-info listings
# placeholders: [world], [region], [requirePermission], [override], [shape], [worldBorderOverride], [cacheCap], [cached], [keptCache], [unkeptCache], [backlogCache], [backlogCacheCap]
worldInfo:
  - "#21ADA8[world]:"
  - "#99EEBB  - region: [region]"
  - "#99EEBB  - requirePermission: [requirePermission]"
  - "#99EEBB  - override: [override]"

regionInfo:
  - "#52B2BF[region]:"
  - "#58CCED  - world: [world]"
  - "#58CCED  - shape: [shape]"
  - "#58CCED  - requirePermission: [requirePermission]"
  - "#58CCED  - worldBorderOverride: [worldBorderOverride]"
  - "#58CCED  - cacheCap: [cacheCap]"
  - "#58CCED  - keptCache (L1): [keptCache]"
  - "#58CCED  - unkeptCache (L2): [unkeptCache]"
  - "#58CCED  - backlogCache (L3): [backlogCache] / [backlogCacheCap]"
  - "#58CCED  - cached: [cached]"

# ###############################################################################
# Section 8: Command Descriptions
# ###############################################################################
# shown in help command
rtp: "&b/rtp - teleport to a random location"
rtp_description: "teleport to a random location"
help: "&b/rtp help - see this"
help_description: "describe commands"
reload: "&b/rtp reload - reload config files"
reload_description: "reload config files"
scan: "&b/rtp scan - try all possible region placements to improve load times"
scan_description: "clear stored data and try all possible region placements"
config_description: "update configuration files at runtime"
info_description: "check the current state of the plugin"
test_description: "test RTP functions"

# ###############################################################################
# Section 8b: Generalized Menu Framework
# ###############################################################################
# Sent when a menu token is unknown, malformed, or belongs to another player.
menuInvalid: "&c[P0] that menu link is invalid."
# Sent when a menu token has expired or was already consumed.
menuExpired: "&c[P0] that menu link has expired. Please reopen the menu."
# Sent when a menu redeem cannot resolve the calling player UUID.
menuUnknownPlayer: "&c[P0] menu links can only be used by in-game players."
# Hover-fallback template used by the menu reflector when no YAML block-comment
# is available for a parameter. Placeholder: [type] - the declared parameter type.
menuHoverFallbackType: "type: [type]"
# Hover-fallback template used by the menu reflector when a parameter exposes a
# small curated value set. Placeholder: [values] - comma-joined accepted values.
menuHoverFallbackBounds: "accepted: [values]"
# Label for the "go back one level" navigation row prepended to every non-root menu page.
menuBack: "&7« back"
# Label template for the "execute the assembled command" row prepended to every
# runnable non-root menu page. Placeholder: [command] - the assembled /rtp ... invocation.
menuExecute: "&a▶ run [command]"
# Header row at the top of a parameter-value picker sub-page (Stage A.2).
# Placeholders: [param] - parameter name; [command] - assembled /rtp ... invocation.
menuPickValue: "&7pick a value for [param] (will run: /rtp [command] [param]:<value>)"
# Label for the "type a custom value" fallback row on a parameter-value picker page.
# Clicking it prefills chat with the assembled command up to '<param>:' so the player
# can type any value, including ones not in the suggestion list.
menuTypeValue: "&7✎ type a custom value..."
# Non-clickable header row at the top of every non-root menu page (Stage A.4).
# Surfaces the currently-constructed /rtp invocation including any staged
# parameter assignments (name:value). Placeholder: [command] - assembled args.
menuConstructed: "&7building: #7E9CC8/rtp [command]"
# Non-clickable title row prepended to the root /rtp menu page (Stage A.5).
# Provides a welcoming header before the player descends into any subcommand.
menuRootTitle: "#5FB3B3&l⚡ RTP menu"
# Non-clickable subtitle/hint row prepended to the root /rtp menu page below
# menuRootTitle (Stage A.5). Short orientation text for first-time users.
menuRootHint: "&7click an option below to begin"
# Navigation rows appended to paginated menu pages (Stage A.6) — clicking
# them moves to the previous/next page of the same model. Placeholder:
# [page] - the 1-based human-readable target page number.
menuPagePrev: "&7« previous page ([page])"
menuPageNext: "&7next page ([page]) »"
# Section divider on the front page above teleport rows (player view).
menuFrontPageSectionTeleport: "&8» &7teleport"
# Front-page rows. No placeholders.
menuFrontPageRowTeleport: "&a▶ /rtp &7- teleport to a random location"
menuFrontPageRowRegion: "&a▶ /rtp region:&7... &7- pick a region"
menuFrontPageRowBiome: "&a▶ /rtp biome:&7... &7- pick a biome"
menuFrontPageRowHelp: "&a▶ /rtp help &7- list commands"
# Front-page admin entry row (PROPOSAL-admin-panel.md v2): the only inline
# admin-visible row on the front page; click descends into the curated admin
# panel built by AdminPanelBuilder. Hidden when the viewer lacks rtp.menu.admin.
menuFrontPageRowAdmin: "#9D7CD8▶ admin panel &7- operator tools"
# Hover text for the admin-panel entry row. No placeholders.
menuFrontPageHoverAdmin: "&7operator tools: config, scans, diagnostics, reload"
# --- Admin panel book page (PROPOSAL-admin-panel.md v2) ---
# Non-clickable title row at the top of the admin panel. No placeholders.
menuAdminPanelTitle: "#9D7CD8&l⚙ admin panel"
# Non-clickable hint row below menuAdminPanelTitle. No placeholders.
menuAdminPanelHint: "&7click an option below"
# Section dividers on the admin panel. No placeholders.
menuAdminPanelSectionConfig: "&8» &7configuration"
menuAdminPanelSectionDiagnostics: "&8» &7diagnostics"
menuAdminPanelSectionLifecycle: "&8» &7lifecycle"
menuAdminPanelSectionBrowse: "&8» &7browse"
# Admin-panel rows + hovers. No placeholders.
menuAdminPanelRowConfig: "#5FB3B3▶ config editor"
menuAdminPanelHoverConfig: "&7open the curated config selector"
menuAdminPanelRowInfo: "#5FB3B3▶ server info"
menuAdminPanelHoverInfo: "&7show plugin version, region counts, and queue state"
menuAdminPanelRowDiagnostics: "&c▶ full diagnostics"
menuAdminPanelHoverDiagnostics: "&7runs the full diagnostic suite; may be expensive"
menuAdminPanelRowMemory: "#5FB3B3▶ memory tracker snapshot"
menuAdminPanelHoverMemory: "&7dump active chunk-ticket and pipeline allocations"
menuAdminPanelRowScan: "#5FB3B3▶ scan control"
menuAdminPanelHoverScan: "&7open the scan submenu (start / pause / cancel)"
menuAdminPanelRowReload: "&c▶ reload"
menuAdminPanelHoverReload: "&7reloads all config files; in-flight teleports may be affected"
menuAdminPanelRowBrowse: "#5FB3B3▶ browse all commands"
menuAdminPanelHoverBrowse: "&7open the reflected /rtp command tree"
menuAdminPanelRowBack: "&7« back"
# Non-clickable title row at the top of the config-file selector page (Stage C.1).
# Shown when an admin clicks "/rtp config" from the front page.
configSelectorTitle: "#5FB3B3&l⚙ config files"
# Label for the "back to /rtp menu root" navigation row on the config selector page.
configSelectorBackRow: "&7« back to menu"
# Non-clickable title row at the top of a single config-file page (Stage C.2).
# Placeholder: [file] - the config file name (e.g. "performance", "safety").
configFileTitle: "#5FB3B3&l⚙ config: #9D7CD8[file]"
# Label for the "back to config selector" navigation row on a single config-file page.
configFileBackRow: "&7« back to config files"
# Non-clickable hint row shown when a config file has no editable keys.
configFileEmptyHint: "&7(no editable keys in this file)"
# Per-key row label on a config-file page. Placeholders:
#   [key]   - the config key name; [value] - the currently-stored value.
configKeyRowFormat: "#7E9CC8[key]&7: #B084DC[value]"
# Hover text for a per-key row on a config-file page. Placeholders:
#   [key], [value], [type] - the config key name, current value, and declared type.
configKeyHoverFormat: "&7click to edit #7E9CC8[key] &7(type: [type])"
# Non-clickable title row at the top of a shape/vert type-picker page (Stage C.3a).
# Placeholders: [param] - "shape" or "vert"; [current] - currently-active type name.
configTypePickerTitle: "#5FB3B3&l⚙ pick [param] type &7(current: #9D7CD8[current]&7)"
# Non-clickable title row at the top of a shape/vert sub-parameter page (Stage C.3b).
# Placeholders: [param] - "shape" or "vert"; [type] - the active type name.
configSubParamPageTitle: "#5FB3B3&l⚙ [param] &7- #9D7CD8[type] &7sub-parameters"
# Hint sent when the book view falls back to the legacy raw-YAML chat dump
# (no book renderer available on this platform).
configViewRawHint: "&7[P0] book view unavailable; falling back to raw dump."
# Placeholder text rendered in place of a config value that has not been set.
configValueUnsetPlaceholder: "&8(unset)"

