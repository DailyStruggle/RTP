# Devstack proxy-b network.yml.
network:
  enabled: true
  schemaVersion: 1
  proxyId: "proxy-b"
  role: proxy
  secretEnv: RTP_NET_SECRET
  killSwitch: false
transport:
  type: redis
  redis:
    host: redis
    port: 6379
    password: ""
heartbeat:
  intervalMs: 1000
  staleAfterMs: 5000
reservation:
  ttlMs: 30000
  reapIntervalMs: 5000
