# Velocity proxy-b config. Modern forwarding; shared secret in
# /server/forwarding.secret (mounted from devstack/shared/forwarding.secret).
config-version = "2.7"
bind = "0.0.0.0:25577"
motd = "<bold><red>RTP devstack proxy-b"
show-max-players = 20
online-mode = true
force-key-authentication = true
prevent-client-proxy-connections = false
player-info-forwarding-mode = "MODERN"
forwarding-secret-file = "forwarding.secret"
announce-forge = false
kick-existing-players = false
ping-passthrough = "DISABLED"
enable-player-address-logging = true
forced-hosts = {}

[servers]
	# Lobbies have NO local /rtp region (see devstack/lobby-{a,b}/rtp-config/regions/README.md).
	# Running /rtp on a lobby is the cross-server dispatch test: the request is
	# routed via the network transport to a real destination backend.
	# proxy-b prefers lobby-b first to spread fresh joins across both lobbies.
	lobby-a = "lobby-a:25565"
	lobby-b = "lobby-b:25565"
	backend-a = "backend-a:25565"
	backend-b = "backend-b:25565"
	# backend-c: Fabric 1.21.11 (see proxy-a/velocity.toml for rationale).
	backend-c = "backend-c:25565"
	try = ["lobby-b", "lobby-a", "backend-b", "backend-a", "backend-c"]

[advanced]
	compression-threshold = 256
	compression-level = -1
	login-ratelimit = 3000
	connection-timeout = 5000
	read-timeout = 30000
	haproxy-protocol = false
	tcp-fast-open = false
	bungee-plugin-message-channel = true
	show-ping-requests = false
	failover-on-unexpected-server-disconnect = true
	announce-proxy-commands = true
	log-command-executions = false
	log-player-connections = true
	#Allows players transferred from other hosts via the
	#Transfer packet (Minecraft 1.20.5) to be received.
	accepts-transfers = false

[query]
	enabled = false
	port = 25577
	map = "Velocity"
	show-plugins = false
