# Devstack backend-a network.yml.
network:
  enabled: true
  schemaVersion: 1
  serverId: "lobby-b"
  role: backend
  secretEnv: RTP_NET_SECRET
transport:
  type: redis
  redis:
    host: redis
    port: 6379
    password: ""
heartbeat:
  intervalMs: 1000
  staleAfterMs: 5000
reservation:
  ttlMs: 30000
  reapIntervalMs: 5000

routing:
  # Slice J: lobby mode disables local region pre-fill/scan/hydrate.
  # Lobby backends only dispatch players to peer backends via cross-server /rtp.
  lobbyMode: true
