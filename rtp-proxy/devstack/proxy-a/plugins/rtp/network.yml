# Devstack proxy-a network.yml.
# Schema: rtp-proxy-ADR-002.
network:
  enabled: true
  schemaVersion: 1
  proxyId: "proxy-a"
  role: proxy
  secretEnv: RTP_NET_SECRET
  # Short TTL so the L3 kill-mid-flight scenario reaps within the harness window.
  # PRODUCTION DEFAULT IS 300000ms - do not ship this value.
  killSwitch: false
transport:
  type: redis
  redis:
    host: redis
    port: 6379
    password: ""
heartbeat:
  intervalMs: 1000
  staleAfterMs: 5000
reservation:
  ttlMs: 30000
  reapIntervalMs: 5000
