# SonarCloud Automatic Analysis & Scanner Fallback Configuration (ADR-094)
# Mirrors root build.gradle sonar {} exclusions so repositories analyzed via
# SonarCloud Automatic Analysis (or before Gradle CI coverage runs) exclude
# test fixtures, platform adapters, version shims, and unobf carrier mirrors
# from CPD duplication and coverage calculations.

sonar.coverage.exclusions=**/test/**,**/testFixtures/**,**/*Test*.java,**/*Benchmark*.java,**/testing/**,**/mock/**,platforms/**,addons/**,resource/LeafRTP/addons/**,helpers/**,rtp-plugin/**,resource/LeafRTP/rtp-plugin/**,api/**/*unobf/**,api/**/*Unobf/**

sonar.cpd.exclusions=**/test/**,**/testFixtures/**,**/*Test*.java,**/*Benchmark*.java,**/testing/**,**/mock/**,platforms/**,addons/**,resource/LeafRTP/addons/**,helpers/**,resource/LeafTreeGen/**,resource/LeafShapeMining/**,resource/LeafArtifacts/**,rtp-plugin/**,resource/LeafRTP/rtp-plugin/**,api/**/*unobf/**,api/**/*Unobf/**,**/server/ServerAccessorImpl.java
