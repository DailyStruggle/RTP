// maps-api — runtime cartography SPI. Pure-Java module: no Bukkit / Fabric /
// Loom dependency. Concrete platform bindings (BukkitMapBinding,
// FoliaMapBinding, FabricMapBinding) land in Stage 2/3 inside their
// respective platform adapters per ADR-046 and maps-api-ADR-001.
//
// Shape mirrors rtp-api: java-library, JUnit Jupiter + Mockito inherited
// from the root subprojects {} block, ArchUnit added locally for the
// REQ-RTP-MAP-002 no-chunk-I/O package-boundary rule (ReqRtpMap002NoChunkIoTest).
plugins {
    id 'java-library'
}

dependencies {
    compileOnly 'org.jetbrains:annotations:24.1.0'

    // ArchUnit — bytecode-level enforcement of the REQ-RTP-MAP-002 contract
    // (no chunk I/O, no .get() / .join(), no platform imports under
    // mapsapi.render). Same artifact + version as rtp-core, rtp-anvil,
    // rtp-bukkit-common, rtp-folia-common.
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}

java {
    withJavadocJar()
    withSourcesJar()
}

javadoc {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:syntax,html', '-quiet')
}
