// rtp-anvil — platform-neutral vanilla Anvil region-file decode.
// Per ADR-016 / docs/dev/ANVIL_SHARED_MODULE_PLAN.md, this module shall NOT depend on:
//   - any RTP module (rtp-api, rtp-core, commands-api, effects-api, platform adapters);
//   - any platform package (org.bukkit.*, io.papermc.*, net.minecraft.*, net.fabricmc.*).
// Java 21 toolchain, JUnit 5, and Mockito are inherited from the root build.gradle subprojects block.

dependencies {
    implementation 'org.jetbrains:annotations:24.1.0'
    // LZ4 chunk-payload decompression (compression mode 4 in r.X.Z.mca).
    implementation 'org.lz4:lz4-java:1.8.0'
    // Pure-Java ZStandard decoder for built-in Linear (.linear) region decode (ADR-077).
    // aircompressor 2.0.3 is the Java-8/21-compatible maintenance line with no native
    // binaries, keeping anvil-api lightweight (~0.26 MiB) for both Lite and Pro.
    api 'io.airlift:aircompressor:2.0.3'
    // ArchUnit — bytecode-level enforcement of the "no platform / no RTP imports"
    // invariant inside this module. See AnvilPackageBoundaryArchTest.
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    // zstd-jni is a test-only dependency used to author synthetic .linear fixtures;
    // production decode runs on the pure-Java aircompressor decoder above.
    testImplementation 'com.github.luben:zstd-jni:1.5.6-3'
}
