// SPDX-License-Identifier: MIT
// bytecode-api -- zero-classloading JVM .class constant-pool, config-key, and causal-graph bytecode scanner (leafconfig-ADR-001, leaffuzz-ADR-001, ADR-125, ADR-126).
// Pure Java 17 layered strictly on yaml-api, server-api, and config-bit-api: zero rtp-core or rtp-api dependency.
plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withJavadocJar()
    withSourcesJar()
}

dependencies {
    api project(':yaml-api')
    api project(':server-api')
    api project(':config-bit-api')
    compileOnly 'org.jetbrains:annotations:24.1.0'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}

javadoc {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:syntax,html', '-quiet')
}

test {
    useJUnitPlatform()
}
