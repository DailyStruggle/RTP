// SPDX-License-Identifier: MIT
// menu-api -- cross-platform declarative menu, session, token, and prompt SPI (ADR-035, ADR-044, ADR-048).
// Pure Java 17 layered strictly on server-api and commands-api: zero rtp-core or rtp-api dependency.
plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withJavadocJar()
    withSourcesJar()
}

dependencies {
    api project(':server-api')
    api project(':commands-api')
    compileOnly 'org.jetbrains:annotations:24.1.0'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}

javadoc {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:syntax,html', '-quiet')
}

test {
    useJUnitPlatform()
}
