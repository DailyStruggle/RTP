# Gradle JVM settings.
#
# Loom's remapJar (rtp-fabric/effects-api) and the rtp-folia-common test
# compile both OOM under Gradle's default 512m heap. During a full parallel
# build several Loom remap workers (effects-api + every rtp-fabric variant)
# and the NeoForge artifact creation run concurrently inside the Gradle
# daemon JVM; at 4g this intermittently exhausts the heap and surfaces as
# "remapJar ... Failed to create service instance" (an OOM masked by Loom's
# worker-service factory). 8 GiB gives the concurrent remappers headroom.
# Lower only on a memory-constrained machine, but do not go below 2g or
# remapJar will fail again, and expect intermittent remap failures below ~6g.
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
liteVersion=3.2.1
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
