# Gradle JVM settings.
#
# Loom's remapJar (rtp-fabric) and the rtp-folia-common test compile both
# OOM under Gradle's default 512m heap. 4 GiB is comfortable headroom for
# the full multi-module build (Paper/Folia/Fabric/Spigot variants + Loom
# remap). Lower if running on a memory-constrained machine, but do not
# go below 2g or remapJar will fail again.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
liteVersion=3.1.4
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
