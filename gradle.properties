# Gradle JVM settings.
#
# Loom's remapJar (rtp-fabric/effects-api) and the rtp-folia-common test
# compile both OOM under Gradle's default 512m heap. During a full parallel
# build several Loom remap workers (effects-api + every rtp-fabric variant)
# and the NeoForge artifact creation run concurrently inside the Gradle
# daemon JVM; at 4g this intermittently exhausts the heap and surfaces as
# "remapJar ... Failed to create service instance" (an OOM masked by Loom's
# worker-service factory). 8 GiB gives the concurrent remappers headroom.
# Lower only on a memory-constrained machine, but do not go below 2g or
# remapJar will fail again, and expect intermittent remap failures below ~6g.
# -XX:HeapBaseMinAddress moves the CompressedOops heap base above the 32 GiB
# region so the 8g heap no longer blocks native-heap growth. Without it, a full
# parallel build accumulated 300+ daemon threads (Build operations + jar
# transforms + Loom remap/fork workers) and crashed with a native malloc OOM
# (arena.cpp / Chunk::new) that surfaced as a build "freeze" before aborting.
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -XX:HeapBaseMinAddress=32g -Dfile.encoding=UTF-8
# Single source of truth for the plugin version. `build.gradle` reads these
# via providers.gradleProperty(...) and the docs stamp (@version@) is expanded
# from `version` by the rtp-plugin copyDocs task. Bump here only.
version=3.2.2
liteVersion=3.2.2
org.gradle.daemon=true
org.gradle.parallel=true
# Cap concurrent workers so peak Loom remap/fork worker and thread count stays
# well under the native-memory ceiling (prevents the daemon thread explosion /
# native OOM described above). Do not raise past ~8 on this codebase.
org.gradle.workers.max=6
org.gradle.caching=true
org.gradle.vfs.watch=true
systemProp.org.gradle.cache.lock.timeout=600000
