plugins {
    id 'java'
}
group = 'io.github.dailystruggle'
// LeafRTPClaimAddon carries its OWN version line, independent of the RTP core
// version: it ships and updates on its own cadence (mirroring LeafRTPGuiAddon).
version = '1.1.0'
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Installable artifact carries the brand name, so the build produces
// LeafRTPClaimAddon-<version>.jar - the jar a user drops into plugins/RTP/addons/.
base {
    archivesName = 'LeafRTPClaimAddon'
}

repositories {
    mavenCentral()
    // Soft-dep repos for the bundled claim-plugin APIs (compile-only).
    maven { url = 'https://maven.enginehub.org/repo/' }
    maven {
        url = 'https://jitpack.io'
        content { includeGroupByRegex 'com\\.github\\..*' }
    }
    maven { url = 'https://repo.glaremasters.me/repository/bloodshot/' }
    maven { url = 'https://raw.githubusercontent.com/FabioZumbi12/RedProtect/mvn-repo/' }
    maven { url = 'https://repo.spongepowered.org/maven/' }
    maven { url = 'https://ci.ender.zone/plugin/repository/everything/' }
    maven { url = 'https://repo.dmulloy2.net/repository/public/' }
    maven {
        url = 'https://maven.minecodes.pl/releases/'
        content { includeGroup 'pl.minecodes.plots' }
        // Its Gradle metadata pins org.gradle.jvm.version=21; this module targets 17. The API is
        // only linked when minePlots (itself Java 21+) is enabled, so resolve from the POM.
        metadataSources { mavenPom(); artifact() }
    }
    maven {
        url = 'https://repo.william278.net/releases/'
        content {
            includeGroup 'net.william278.huskclaims'
            includeGroup 'net.william278.husktowns'
        }
    }
}

configurations {
    // Claim plugins whose API ships only inside the shaded plugin jar (ADR-118 rule 1).
    shadedClaimPlugins { transitive = false }
}

// Only the plugins' own packages: the shaded jars also carry unrelocated Guava, Gson and
// Adventure, which would shadow the spigot-api copies on the test classpath.
def shadedClaimPluginJars = configurations.shadedClaimPlugins
def claimPluginApiClasses = tasks.register('claimPluginApiClasses', Sync) {
    from({ shadedClaimPluginJars.collect { zipTree(it) } }) {
        include 'net/william278/huskclaims/**'
        include 'net/william278/husktowns/**'
        include 'com/bekvon/**'
        include 'com/massivecraft/factions/**'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    into layout.buildDirectory.dir('claim-plugin-api')
}

dependencies {
    shadedClaimPlugins 'net.william278.huskclaims:huskclaims-bukkit:1.5.10'
    shadedClaimPlugins 'net.william278.husktowns:husktowns-bukkit:3.1.4'
    shadedClaimPlugins 'com.github.Zrips:Residence:6.0.2.3'
    shadedClaimPlugins 'com.github.SaberLLC:Saber-Factions:4.1.4-STABLE'

    // RTP SPI + core config/hook surface the addon registers through.
    compileOnly project(':rtp-api')
    compileOnly project(':rtp-core')
    // org.bukkit.* - every checker is Bukkit-based; supplied by the server at runtime.
    compileOnly 'org.spigotmc:spigot-api:1.20.1-R0.1-SNAPSHOT'

    // Claim-plugin APIs (compile-only; the installed plugin supplies the classes at runtime,
    // and each checker is additionally gated on the plugin being enabled).
    compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.12'
    compileOnly 'com.sk89q.worldedit:worldedit-bukkit:7.3.0'
    compileOnly 'com.github.TechFortress:GriefPrevention:16.18.1'
    compileOnly 'com.github.LlmDl:Towny:0.102.0.13'
    compileOnly 'com.griefdefender:api:2.1.0-SNAPSHOT'
    compileOnly 'com.github.IncrediblePlugins:LandsAPI:7.19.1'
    compileOnly 'br.net.fabiozumbi12.RedProtect:RedProtect-Core:7.7.3'
    compileOnly('br.net.fabiozumbi12.RedProtect:RedProtect-Spigot:7.7.3') {
        exclude group: 'com.destroystokyo.paper', module: 'paper-api'
        exclude group: 'com.sk89q.worldedit'
        exclude group: 'com.sk89q.worldguard'
        exclude group: 'de.keyle', module: 'mypet'
        exclude group: 'net.ess3', module: 'EssentialsX'
    }
    compileOnly 'pl.minecodes.plots:plugin-api:4.6.2'
    compileOnly 'com.intellectualsites.plotsquared:plotsquared-core:7.6.0', { transitive = false }
    compileOnly files(claimPluginApiClasses)

    testImplementation project(':rtp-api')
    testImplementation project(':rtp-core')
    testImplementation testFixtures(project(':rtp-core'))
    testImplementation 'org.spigotmc:spigot-api:1.20.1-R0.1-SNAPSHOT'
    testImplementation 'com.github.TechFortress:GriefPrevention:16.18.1'
    testImplementation 'com.github.LlmDl:Towny:0.102.0.13'
    testImplementation 'com.sk89q.worldguard:worldguard-bukkit:7.0.12'
    testImplementation 'com.sk89q.worldedit:worldedit-bukkit:7.3.0'
    testImplementation 'net.kyori:adventure-api:4.17.0'
    testImplementation 'pl.minecodes.plots:plugin-api:4.6.2'
    testImplementation 'com.intellectualsites.plotsquared:plotsquared-core:7.6.0', { transitive = false }
    testImplementation files(claimPluginApiClasses)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
