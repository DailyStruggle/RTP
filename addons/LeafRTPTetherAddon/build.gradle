plugins {
    id 'java'
}
group = 'io.github.dailystruggle'
// LeafRTPTetherAddon carries its OWN version line, independent of the RTP core
// version: it ships and updates on its own cadence (mirroring the other addons).
version = '1.0.0'
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Installable artifact carries the brand name, so the build produces
// LeafRTPTetherAddon-<version>.jar - the jar a user drops into plugins/RTP/addons/.
base {
    archivesName = 'LeafRTPTetherAddon'
}

repositories {
    mavenCentral()
}

dependencies {
    // RTP SPI + core scheduler/server-accessor surface the addon registers through.
    compileOnly project(':rtp-api')
    compileOnly project(':rtp-core')
    // NOTE: no platform (spigot/paper/fabric) dependency. A tether confines a player
    // to an existing RTP region using RTP's own platform-neutral move signal and the
    // region's own geometry (a chunk-free containment test), so the addon needs no
    // claim/region plugin and no platform API. Optional third-party region bounds,
    // where present, are resolved through the rtp-api hook surface (ADR-026).
}

test {
    useJUnitPlatform()
}
