# LeafRTPPartyAddon configuration. Edit values here; RTP's ConfigParser will
# pick up changes on /rtp reload through the Configs.onReload hook.

# Master on/off switch for the party addon.
enabled: true

# How party members are placed relative to the drawn destination:
#   SAME    - every member teleports to the single prepared coordinate.
#   CLUSTER - reserve a small adjacent group of prepared coordinates (one per
#             member) so members land near each other without stacking.
# Unknown values fall back to SAME.
placement: SAME

# Maximum members teleported in a single party operation. Bounds how many
# prepared coordinates a party may consume at once so one large party cannot
# drain the supply pipeline.
maxPartySize: 8

version: "1.0"
