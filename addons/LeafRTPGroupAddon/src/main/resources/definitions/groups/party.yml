version: 1.0

# Tight co-op party cluster.
# The shape block mirrors a region's shape declaration and carries everything spatial:
#   radius            - subspace footprint half-width in BLOCKS
#   spatialResolution - selection stride (participant spacing) in this group context
shape:
  name: "SQUARE"
  radius: 24
  spatialResolution: 2

maxGroupSize: 8
