plugins {
    id 'java'
}

group = 'io.github.dailystruggle'
version = '1.0-SNAPSHOT'

// Note: Target updated to 16 to match your POM
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url 'https://jitpack.io' }
}

dependencies {
    // Core RTP classes (will now work after the refactor above)
    compileOnly project(':rtp-api')
    compileOnly project(':rtp-core')
    compileOnly project(':rtp-spigot-v1_20_R1')
    compileOnly project(':rtp-paper-v1_20_R1')

    // The Domain API - Repository is down or requires auth, so we skip it for now
    // compileOnly 'com.github.Torp:Domain:2.11.2'

    // Spigot API (Required for the addon to see Bukkit classes)
    compileOnly 'io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT'
}

test {
    useJUnitPlatform()
}