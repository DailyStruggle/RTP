# --- actions/location.yml ---
# Free sample scripted action (ADR-093 + ADR-095): scatter around a named landmark.
# This reproduces justRTP's `/rtp location <name>` using a fixed anchor coordinate.
#
# The anchor is a fixed CoordinateAnchorSource read from the placement parameters below
# (a live caller may override anchorX/anchorY/anchorZ via invocation context).

alias: "spawnzone"
permission: "rtp.action.location.spawnzone"
description: "Teleport to a safe spot around the spawn landmark."

command:
  # Declarative parameters only (no top-level command name): teleporting another player requires the
  # permission below. Omitting the target defaults to "self", so an unprivileged caller can only send
  # themselves and never an arbitrary player.
  parameters:
    - name: "player"
      type: "player"
      required: false
      permission: "rtp.command.location.other"
      default: "self"

placement:
  region: "default"
  anchor: "fixed"
  shape:
    name: "CIRCLE"
    radius: 4c                  # ~64 block footprint around the landmark
    centerRadius: 0
  minSeparation: 16
  elevationTolerance: 256
  parameters:
    # Static landmark coordinates for this named location.
    anchorX: 0
    anchorY: 64
    anchorZ: 0

confinement:
  boundary: "SUBSPACE"
  duration: "0s"

lifecycle:
  onStart:
    - CONSOLE: "tellraw [player_name] [\"\",{\"text\":\"Arrived near spawn.\",\"color\":\"green\"}]"

version: "1.0"
